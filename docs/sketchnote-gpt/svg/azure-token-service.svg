<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Token Service (sketch)</title>
  
  <desc>Hand-drawn purple isometric token cube with three cyan token discs, irregular marker outlines, subtle highlights and restrained yellow sketch accents.</desc>

  <defs>
    <linearGradient id="tokenTop" x1="12" y1="11" x2="96" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C3A7FA"/>
      <stop offset="1" stop-color="#B796F9"/>
    </linearGradient>
    <linearGradient id="tokenLeft" x1="10" y1="39" x2="54" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#8A50E9"/>
    </linearGradient>
    <linearGradient id="tokenRight" x1="54" y1="46" x2="96" y2="98" gradientUnits="userSpaceOnUse">
      <stop stop-color="#773ADC"/>
      <stop offset="1" stop-color="#6230BA"/>
    </linearGradient>
    <linearGradient id="tokenCyan" x1="80" y1="76" x2="102" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Isometric token cube: left face -->
  <path d="M10 36            L53 61            L53 107            Q53 110 50 108            L12 86            Q9 84 9 81            L9 39            Q9 37 10 36Z" fill="url(#tokenLeft)" stroke="#6636B7" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cube right face -->
  <path d="M53 61            L96 36            L96 80            Q96 83 93 85            L53 108Z" fill="url(#tokenRight)" stroke="#5426A5" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cube top face -->
  <path d="M10 36            L49 13            Q53 10 57 13            L96 36            L53 61Z" fill="url(#tokenTop)" stroke="#7042C5" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Uneven hand-drawn cube edge -->
  <path d="M53 63 Q54 83 53 105" stroke="#D6BEFF" stroke-width="2.1" stroke-linecap="round" opacity=".75"/>

  <!-- Top-face marker highlights -->
  <path d="M20 35            L49 18            Q53 16 57 19" stroke="#E7DAFF" stroke-width="2.8" stroke-linecap="round" opacity=".8"/>

  <path d="M37 35 Q51 26 64 35" stroke="#F1E8FF" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- Left-face sketched reflection -->
  <path d="M16 48 L16 77            Q16 81 21 84" stroke="#D9C5FF" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>

  <!-- Right-face sketch highlight -->
  <path d="M89 48 L89 73            Q89 77 85 79" stroke="#B38DF6" stroke-width="2.6" stroke-linecap="round" opacity=".65"/>

  <!-- Left cyan token: lower side wall -->
  <path d="M37 91            C37 86 45 83 56 83            C67 83 75 87 75 92            L75 101            C75 107 67 111 56 111            C45 111 37 107 37 101Z" fill="#32BEDD" stroke="#148DAF" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Left token top -->
  <path d="M37 91            C37 85 45 81 56 81            C67 81 75 85 75 91            C75 97 67 101 56 101            C45 101 37 97 37 91Z" fill="url(#tokenCyan)" stroke="#168DAB" stroke-width="2.8"/>

  <!-- Left token handwritten highlight -->
  <path d="M43 89 Q52 84 63 88" stroke="#E4FCFF" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Rear right token: lower disc -->
  <path d="M78 88            C78 82 87 79 98 79            C109 79 117 83 117 88            L117 97            C117 103 109 107 98 107            C87 107 78 103 78 97Z" fill="#32BEDD" stroke="#138DAE" stroke-width="2.8" stroke-linejoin="round"/>

  <path d="M78 88            C78 82 87 78 98 78            C109 78 117 82 117 88            C117 94 109 98 98 98            C87 98 78 94 78 88Z" fill="#50E6FF" stroke="#138DAE" stroke-width="2.8"/>

  <!-- Rear token lower marker edge -->
  <path d="M84 100 Q98 108 111 100" stroke="#BDF6FF" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- Middle right token: side wall -->
  <path d="M78 74            C78 68 87 65 98 65            C109 65 117 69 117 74            L117 83            C117 89 109 93 98 93            C87 93 78 89 78 83Z" fill="#32BEDD" stroke="#138DAE" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Middle token top -->
  <path d="M78 74            C78 68 87 64 98 64            C109 64 117 68 117 74            C117 80 109 84 98 84            C87 84 78 80 78 74Z" fill="#50E6FF" stroke="#138DAE" stroke-width="2.8"/>

  <!-- Top-right token: side wall -->
  <path d="M78 60            C78 54 87 51 98 51            C109 51 117 55 117 60            L117 69            C117 75 109 79 98 79            C87 79 78 75 78 69Z" fill="#32BEDD" stroke="#138DAE" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Top-right token surface -->
  <path d="M78 60            C78 54 87 50 98 50            C109 50 117 54 117 60            C117 66 109 70 98 70            C87 70 78 66 78 60Z" fill="#50E6FF" stroke="#138DAE" stroke-width="2.8"/>

  <!-- Cyan token surface highlights -->
  <path d="M85 57 Q97 52 109 57" stroke="#E8FCFF" stroke-width="2.3" stroke-linecap="round"/>

  <path d="M85 72 Q96 68 108 72" stroke="#D9FAFF" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- Deliberately irregular disc-edge ink -->
  <path d="M82 83 Q87 88 95 89            M103 89 Q111 88 114 84" stroke="#A9F2FF" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Yellow sketchnote spark -->
  <path d="M105 27 L108 18            M114 31 L122 26            M100 25 L97 19" stroke="#F5C84C" stroke-width="3" stroke-linecap="round"/>

  <!-- Handwritten-style accent -->
  <path d="M14 103 Q24 110 34 111" stroke="#F5C84C" stroke-width="2.7" stroke-linecap="round"/>

  <path d="M29 106 L35 111 L28 114" stroke="#F5C84C" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small token-stack underline -->
  <path d="M84 116 Q98 119 113 115" stroke="#2A80C2" stroke-width="2" stroke-linecap="round" opacity=".55"/>
</svg>

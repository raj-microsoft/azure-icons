<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Production Ready Database (sketch)</title>
  <defs>
    <linearGradient id="dbBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset=".35" stop-color="#0071C8"/>
      <stop offset=".52" stop-color="#0078D4"/>
      <stop offset=".8" stop-color="#006ABB"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
    <linearGradient id="dbTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEAF2"/>

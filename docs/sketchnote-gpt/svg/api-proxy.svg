  <!-- Right endpoint -->
  <path d="M117.5 54.9        C123.1 54.8 126.5 59 126.4 64.3        C126.3 70.1 122.6 74.4 117 74.3        C111.3 74.2 107.4 70 107.5 64.1        C107.6 58.6 112 54.7 117.5 54.9 Z" fill="#3CD4C2" stroke="#203746" stroke-width="3"/>


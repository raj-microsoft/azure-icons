<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>API Proxy (sketch)</title>

  
  <desc>Hand-drawn Azure API Proxy with two opposing turquoise communication arcs, horizontal endpoint connectors, and a plain green central disk.</desc>

  <!-- Left communication arc -->
  <path d="M56.5 37.7        C41 41.1 30.2 52.6 30.1 64.2        C30 76.8 40.3 88.1 56.5 91.3" stroke="#203746" stroke-width="11.5"/>
  <path d="M56.5 37.7        C41 41.1 30.2 52.6 30.1 64.2        C30 76.8 40.3 88.1 56.5 91.3" stroke="#3CD4C2" stroke-width="7.4"/>

  <!-- Right communication arc -->
  <path d="M71.5 37.7        C87.2 41.2 97.8 52.5 97.9 64.2        C98.1 76.8 87.8 88.2 71.5 91.3" stroke="#203746" stroke-width="11.5"/>
  <path d="M71.5 37.7        C87.2 41.2 97.8 52.5 97.9 64.2        C98.1 76.8 87.8 88.2 71.5 91.3" stroke="#3CD4C2" stroke-width="7.4"/>

  <!-- Left horizontal connector -->
  <path d="M18 64.2 Q24 63.9 30.1 64.2" stroke="#203746" stroke-width="9"/>
  <path d="M18 64.2 Q24 63.9 30.1 64.2" stroke="#3CD4C2" stroke-width="5.8"/>

  <!-- Right horizontal connector -->

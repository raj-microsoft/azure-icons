<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Azure Database PostgreSQL Server (sketch)</title>
  
  <desc>Hand-drawn Azure PostgreSQL database cylinder with the recognizable PostgreSQL elephant head: asymmetrical ears, narrow forehead, distinct eyes, long curled trunk and small lower facial details. Flat Azure-blue and cyan fills with irregular charcoal outlines.</desc>

  <!-- Database cylinder -->
  <path d="M18 29        C18 41 38 47 64 47        C90 47 110 41 110 29        L110 107        C110 118 89 123 64 123        C39 123 18 118 18 107        Z" fill="#0078D4" stroke="#243447" stroke-width="3.5"/>

  <!-- Left cylindrical side -->
  <path d="M18 30        Q25 43 34 45        L34 117        Q23 114 18 107        Z" fill="#005BA1" stroke="#243447" stroke-width="1.8"/>

  <!-- Right cylindrical side -->
  <path d="M94 44        Q104 40 110 30        L110 107        Q106 115 94 119        Z" fill="#006ABB" stroke="#243447" stroke-width="1.8"/>

  <!-- Database elliptical top -->
  <path d="M110 29        C110 39 90 46 64 46        C38 46 18 39 18 29        C18 19 38 12 64 12        C90 12 110 19 110 29 Z" fill="#E8E8E8" stroke="#243447" stroke-width="3.2"/>


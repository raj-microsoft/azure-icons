  <!-- Ear contours -->
  <path d="M39 61        Q36 70 41 84        Q44 94 48 97" stroke="#243447" stroke-width="2" fill="none"/>

  <path d="M91 60        Q96 67 91 83        Q89 91 85 96" stroke="#243447" stroke-width="2" fill="none"/>

  <!-- PostgreSQL head: compact asymmetric face -->
  <path d="M53 76        Q53 62 59 55        Q65 49 72 51        Q80 51 83 60        Q87 68 84 78        Q81 86 79 93        Q77 99 77 104        L75 111        Q74 115 70 116        Q66 117 64 114        Q62 111 63 105        L65 96        Q60 94 57 89        Q53 84 53 76 Z" fill="#F2F2F2" stroke="#243447" stroke-width="2.7"/>


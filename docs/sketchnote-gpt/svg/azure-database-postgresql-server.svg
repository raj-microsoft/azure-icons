  <path d="M53 72        Q59 67 63 72        Q61 76 56 76        Q53 76 53 72 Z" fill="#F2F2F2" stroke="#243447" stroke-width="1.8"/>

  <path d="M57 72        Q59 70 61 72        Q60 74 58 74        Q57 74 57 72 Z" fill="#005BA1" stroke="#243447" stroke-width="1"/>

  <!-- PostgreSQL right eye socket -->
  <path d="M75 71        Q80 67 84 71        Q84 74 79 75        Q76 75 75 71 Z" fill="#F2F2F2" stroke="#243447" stroke-width="1.8"/>

  <path d="M78 71        Q80 69 82 71        Q81 73 79 73        Q78 73 78 71 Z" fill="#005BA1" stroke="#243447" stroke-width="1"/>

  <!-- Distinctive PostgreSQL trunk: long, narrow, curved, not a cartoon curl -->
  <path d="M66 83        Q68 89 66 97        Q64 104 64 110        Q64 115 68 117        Q73 120 78 116        Q82 113 81 107" fill="none" stroke="#243447" stroke-width="9"/>

  <path d="M66 83        Q68 89 66 97        Q64 104 64 110        Q64 115 68 117        Q73 120 78 116        Q82 113 81 107" fill="none" stroke="#F2F2F2" stroke-width="5.5"/>


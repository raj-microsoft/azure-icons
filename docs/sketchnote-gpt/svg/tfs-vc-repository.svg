<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>TFS VC Repository (sketch)</title>
  
  <desc>Hand-drawn purple version-control branching graph with a large hollow repository node and three connected smaller nodes.</desc>

  <defs>
    <linearGradient id="purple" x1="18" y1="5" x2="106" y2="117" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B796F9"/>
      <stop offset="0.55" stop-color="#AE87F6"/>
      <stop offset="1" stop-color="#A67AF4"/>
    </linearGradient>
  </defs>

  <!-- Branching repository connections -->
  <g stroke="#773ADC" stroke-width="9">
    <path d="M36 60 Q35 77 37 96"/>
    <path d="M61 36 Q79 36 108 36"/>
    <path d="M44 55 Q62 73 85 93"/>
  </g>

  <!-- Loose marker accents on connections -->
  <g stroke="#A67AF4" stroke-width="2.5" opacity=".8">
    <path d="M31 70 Q30 80 32 86"/>
    <path d="M74 31 Q87 30 97 31"/>
    <path d="M56 64 Q66 73 72 79"/>
  </g>

  <!-- Large repository node -->
  <path d="M36 5            C53 4 68 17 68 35            C68 53 54 67 36 67            C18 67 5 53 5 36            C4 18 18 6 36 5Z" fill="url(#purple)" stroke="#773ADC" stroke-width="3.5"/>

  <!-- Inner hollow circle -->
  <path d="M36 15            C48 14 57 24 57 36            C57 48 48 57 36 57            C24 57 15 48 15 36            C15 24 24 16 36 15Z" fill="#F2F2F2" stroke="#8B55E8" stroke-width="2.5"/>

  <!-- Hand-drawn highlight -->
  <path d="M21 23 Q25 18 31 18" stroke="#FFFFFF" stroke-width="2.5" opacity=".85"/>

  <!-- Bottom repository node -->
  <path d="M37 95            C45 94 51 100 51 108            C51 116 45 122 37 122            C29 122 23 116 23 108            C23 101 29 95 37 95Z" fill="url(#purple)" stroke="#773ADC" stroke-width="3"/>

  <!-- Upper-right branch node -->
  <path d="M109 22            C117 21 123 27 123 35            C123 43 117 49 109 49            C101 49 95 43 95 36            C95 28 101 22 109 22Z" fill="url(#purple)" stroke="#773ADC" stroke-width="3"/>

  <!-- Lower-right branch node -->
  <path d="M86 80            C94 79 100 85 100 93            C100 101 94 107 86 107            C78 107 72 101 72 93            C72 86 78 80 86 80Z" fill="url(#purple)" stroke="#773ADC" stroke-width="3"/>

  <!-- Subtle marker highlights -->
  <g stroke="#DCCAFF" stroke-width="2.5" opacity=".9">
    <path d="M29 104 Q31 100 35 100"/>
    <path d="M101 32 Q103 27 107 27"/>
    <path d="M78 90 Q80 85 84 85"/>
  </g>

  <!-- Small sketchnote accents -->
  <g stroke="#0078D4" stroke-width="2.3" opacity=".85">
    <path d="M8 77 L14 74"/>
    <path d="M11 83 L17 80"/>
  </g>

  <path d="M110 59 L113 54 L116 59 L121 62 L116 65 L113 70 L110 65 L105 62Z" fill="#FFD966" stroke="#D49A20" stroke-width="1.5"/>

  <path d="M57 111 Q63 114 68 110" stroke="#0078D4" stroke-width="2" stroke-dasharray="3 4"/>
</svg>

  <path d="M120 50            L120 79            Q120 88 113 95            L95 113            Q88 120 79 120            L50 120            Q61 120 69 112            L112 69            Q120 61 120 50Z" fill="url(#outerBottom)" stroke="#302092" stroke-width="2.8"/>


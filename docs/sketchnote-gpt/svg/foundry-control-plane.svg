<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Foundry Control Plane (sketch)</title>
  
  <desc>Hand-drawn Azure Foundry Control Plane icon featuring an interwoven violet diamond-shaped control loop surrounding a central geometric knot, preserving the original purple and indigo color palette.</desc>

  <defs>
    <linearGradient id="outerLeft" x1="8" y1="55" x2="76" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C08AC"/>
      <stop offset=".3" stop-color="#4F42FD"/>
      <stop offset=".65" stop-color="#7274FF"/>
    </linearGradient>

    <linearGradient id="outerBottom" x1="65" y1="123" x2="124" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C08AC"/>
      <stop offset=".35" stop-color="#4F42FD"/>
      <stop offset=".75" stop-color="#7274FF"/>
    </linearGradient>

    <linearGradient id="outerRight" x1="65" y1="8" x2="124" y2="73" gradientUnits="userSpaceOnUse">
      <stop offset=".1" stop-color="#7274FF"/>
      <stop offset=".55" stop-color="#4F42FD"/>
      <stop offset="1" stop-color="#2C08AC"/>
    </linearGradient>

    <linearGradient id="outerTop" x1="8" y1="72" x2="74" y2="7" gradientUnits="userSpaceOnUse">
      <stop offset=".1" stop-color="#7274FF"/>
      <stop offset=".55" stop-color="#4F42FD"/>
      <stop offset="1" stop-color="#2C08AC"/>
    </linearGradient>

    <linearGradient id="innerUpper" x1="36" y1="74" x2="90" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C08AC"/>
      <stop offset=".4" stop-color="#4F42FD"/>
      <stop offset="1" stop-color="#7274FF"/>
    </linearGradient>

    <linearGradient id="innerLower" x1="37" y1="74" x2="91" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7274FF"/>
      <stop offset=".55" stop-color="#4F42FD"/>
      <stop offset="1" stop-color="#2C08AC"/>
    </linearGradient>
  </defs>

  <!-- Upper-left flowing ribbon -->
  <path d="M9 78            L9 49            Q9 40 16 33            L34 15            Q41 8 50 8            L79 8            Q68 8 60 16            L18 58            Q9 67 9 78Z" fill="url(#outerTop)" stroke="#301B91" stroke-width="2.8"/>


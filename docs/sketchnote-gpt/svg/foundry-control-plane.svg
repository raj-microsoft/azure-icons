  <path d="M36 48            Q36 57 43 64            L60 81            Q64 85 68 81            L86 63            Q93 70 93 79            L93 82            Q93 86 90 89            L87 92            Q84 95 80 95            L49 95            Q45 95 42 92            L39 89            Q36 86 36 82Z" fill="url(#innerLower)" stroke="#3325A0" stroke-width="2.8"/>


  <path d="M16 52            Q16 44 22 38            L40 20            Q45 15 52 15" stroke="#A8A6FF" stroke-width="2.6" opacity=".8"/>

  <path d="M79 15            Q87 15 92 21            L107 36            Q113 42 113 48" stroke="#B3ADFF" stroke-width="2.5" opacity=".85"/>

  <path d="M113 82            Q112 89 107 94            L92 109            Q86 114 78 114" stroke="#9698FF" stroke-width="2.5" opacity=".8"/>

  <path d="M16 80            Q17 88 23 94            L39 110            Q44 114 52 114" stroke="#A8A6FF" stroke-width="2.5" opacity=".8"/>


  <path d="M36 48            Q36 44 39 41            L42 38            Q45 35 49 35            L80 35            Q84 35 87 38            L90 41            Q93 44 93 48            L93 79            Q93 70 86 63            L68 45            Q64 41 60 45            L42 63            Q36 69 36 78Z" fill="url(#innerUpper)" stroke="#3325A0" stroke-width="2.8"/>


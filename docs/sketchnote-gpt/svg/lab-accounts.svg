<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Lab Accounts (sketch)</title>
  
  <desc>Azure-blue laboratory flask with white liquid and an overlapping golden access key, drawn with irregular marker outlines.</desc>

  <defs>
    <linearGradient id="flaskBlue" x1="17" y1="7" x2="77" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="keyGold" x1="92" y1="37" x2="95" y2="121" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBD02"/>
      <stop offset="1" stop-color="#FFD400"/>
    </linearGradient>
  </defs>

  <!-- Laboratory flask rim -->
  <path d="M34 8            Q34 5 38 5            L74 5            Q78 5 78 9            L78 12            Q78 16 74 16            L72 16            L72 43            L79 54            L70 64            Q65 70 69 77            L83 92            L17 92            Q12 91 15 86            L39 49            Q41 46 41 42            L41 16            L38 16            Q34 16 34 12Z" fill="url(#flaskBlue)" stroke="#075A9C" stroke-width="3.5"/>

  <!-- Glass neck highlight -->
  <path d="M47 19 L47 42            M46 12 L67 12" stroke="#B9DFFF" stroke-width="2.5" opacity=".85"/>

  <!-- White liquid inside flask -->
  <path d="M48 34            Q48 32 51 32            L61 32            Q64 32 64 35            L64 46            Q64 50 67 54            L79 73            L73 80            L80 86            L25 86            L47 53            Q48 51 48 47Z" fill="#FFFFFF" stroke="#D2EBFF" stroke-width="2"/>

  <!-- Liquid surface and sketch details -->
  <path d="M32 79 Q49 76 65 79" stroke="#B7DFFF" stroke-width="2" opacity=".8"/>

  <path d="M36 71 L40 66            M42 62 L45 58" stroke="#5EA0EF" stroke-width="2.2" opacity=".8"/>

  <!-- Small laboratory bubbles -->
  <circle cx="52" cy="68" r="3" fill="#D2EBFF" stroke="#5EA0EF" stroke-width="1.5"/>
  <circle cx="60" cy="59" r="2" fill="#D2EBFF" stroke="#5EA0EF" stroke-width="1.3"/>

  <!-- Golden key head -->
  <path d="M83 39            Q89 33 96 39            L116 59            Q122 65 116 72            L99 89            Q93 95 86 89            L67 70            Q61 64 67 58Z" fill="url(#keyGold)" stroke="#C58A00" stroke-width="3.6"/>

  <!-- Keyhole -->
  <path d="M91 48            C96 45 102 49 102 54            C102 60 97 63 92 61            C87 59 86 53 89 50            Q90 49 91 48Z" fill="#FFFFFF" stroke="#D39400" stroke-width="2.5"/>

  <!-- Key shaft -->
  <path d="M89 85            L89 113            Q89 115 91 117            L97 123            Q99 125 101 123            L109 115            L105 111            L110 106            L105 101            L110 96            L103 89            Z" fill="url(#keyGold)" stroke="#C58A00" stroke-width="3.5"/>

  <!-- Key shaft hand-drawn highlights -->
  <path d="M94 92 L94 115" stroke="#FFF1A6" stroke-width="2.5" opacity=".9"/>

  <!-- Key head marker lines -->
  <path d="M77 67 L99 67            M79 72 L96 72" stroke="#F4A11B" stroke-width="2.4" opacity=".85"/>

  <!-- Small sketch accents -->
  <path d="M18 40 L24 37            M20 48 L26 46" stroke="#5EA0EF" stroke-width="2.4"/>

  <!-- Restrained yellow emphasis marks -->
  <path d="M109 34 L113 28            M116 40 L122 37" stroke="#F7C948" stroke-width="3.1"/>

  <!-- Hand-drawn finishing marks -->
  <path d="M15 101 L21 104            M27 101 L32 104" stroke="#0078D4" stroke-width="2.1" opacity=".8"/>
</svg>

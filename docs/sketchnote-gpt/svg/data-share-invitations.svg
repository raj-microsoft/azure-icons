<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Data Share Invitations (sketch)</title>
  
  <desc>Hand-drawn Azure Data Share Invitations envelope with cyan folded flaps, dark blue lower panel and marker-style accents.</desc>

  <defs>
    <linearGradient id="inviteBlue" x1="64" y1="65" x2="64" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset=".53" stop-color="#004F90"/>
      <stop offset="1" stop-color="#003067"/>
    </linearGradient>
  </defs>

  <!-- Envelope silhouette -->
  <path d="M12 28            Q12 24 18 24            L110 24            Q116 24 116 30            L116 97            Q116 103 110 103            L18 103            Q12 103 12 97Z" fill="#32BEDD" stroke="#174E83" stroke-width="4"/>

  <!-- Left folded flap -->
  <path d="M13 28            L64 65            L13 101Z" fill="#32BEDD" stroke="#176B96" stroke-width="2.6"/>

  <!-- Right folded flap -->
  <path d="M115 28            L64 65            L115 101Z" fill="#198AB3" stroke="#176B96" stroke-width="2.6"/>

  <!-- Lower envelope fold -->
  <path d="M13 101            L62 65            Q64 63 67 66            L115 101            Q113 104 109 103            L19 103            Q15 103 13 101Z" fill="url(#inviteBlue)" stroke="#174E83" stroke-width="3.3"/>

  <!-- Upper invitation flap -->
  <path d="M13 27            Q13 24 19 24            L109 24            Q114 24 115 27            L67 71            Q64 74 61 71Z" fill="#50E6FF" stroke="#176B96" stroke-width="3.6"/>

  <!-- Subtle hand-drawn flap highlight -->
  <path d="M24 30            L103 30            M29 36 L59 62" stroke="#C8F8FF" stroke-width="2.6" opacity=".85"/>

  <!-- Sketchy marker edge details -->
  <path d="M18 83 L18 94            M110 85 L110 96            M26 98 L49 81" stroke="#78DDF4" stroke-width="2.3" opacity=".65"/>

  <!-- Yellow sketchnote accent strokes -->
  <path d="M7 17 L13 12            M17 14 L18 6            M25 17 L29 11" stroke="#F6C84B" stroke-width="3.5"/>

  <path d="M120 47 L125 43            M120 57 L126 57" stroke="#F6C84B" stroke-width="3"/>

  <!-- Small handwritten-style emphasis marks -->
  <path d="M54 111 Q64 115 74 111" stroke="#198AB3" stroke-width="2.7"/>

  <path d="M59 118 L70 118" stroke="#F6C84B" stroke-width="2.6"/>

  <!-- Marker dots -->
  <circle cx="35" cy="113" r="2" fill="#32BEDD"/>
  <circle cx="93" cy="114" r="2" fill="#F6C84B"/>
</svg>

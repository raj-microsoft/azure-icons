<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Lab Services (sketch)</title>
  
  <desc>Azure-blue cloud behind a cyan laboratory flask with white liquid, recreated using irregular hand-drawn vector outlines.</desc>

  <defs>
    <linearGradient id="labCloud" x1="64" y1="5" x2="64" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".53" stop-color="#3C91E5"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="labFlask" x1="68" y1="48" x2="72" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".53" stop-color="#2EC9EB"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
  </defs>

  <!-- Organic Azure cloud silhouette -->
  <path d="M34 91            C18 93 6 82 6 67            C5 52 16 39 31 37            C37 19 51 9 66 9            C84 9 98 23 100 41            C114 43 123 54 122 67            C122 82 111 91 97 92            Z" fill="url(#labCloud)" stroke="#005A9E" stroke-width="3.4"/>

  <!-- Sketchy cloud marker highlights -->
  <path d="M13 63 Q16 46 32 42" stroke="#B4DEFF" stroke-width="2.7"/>

  <path d="M43 29 Q52 15 66 15" stroke="#C7E7FF" stroke-width="2.5"/>

  <path d="M105 48 Q115 53 116 65" stroke="#005A9E" stroke-width="2" opacity=".5"/>

  <!-- Flask neck and wide conical body -->
  <path d="M57 51            Q55 51 55 54            L55 57            Q55 60 58 60            L59 60            L59 82            Q59 84 57 87            L36 116            Q33 121 38 122            L102 122            Q107 121 104 116            L83 87            Q81 84 81 82            L81 60            L82 60            Q85 60 85 57            L85 54            Q85 51 82 51            Z" fill="url(#labFlask)" stroke="#087FA8" stroke-width="3.5"/>

  <!-- Uneven hand-drawn flask rim -->
  <path d="M56 60 Q70 62 84 60" stroke="#087FA8" stroke-width="2.2"/>

  <!-- White inner liquid chamber -->
  <path d="M65 73            Q65 71 68 71            L74 71            Q76 71 76 74            L76 84            Q76 89 79 93            L96 115            Q98 118 94 118            L46 118            Q42 118 45 114            L62 92            Q65 88 65 84            Z" fill="#FFFFFF" stroke="#087FA8" stroke-width="1.8"/>

  <!-- Flask glass highlights -->
  <path d="M61 65 L61 81" stroke="#B7F5FF" stroke-width="2.5"/>

  <path d="M49 112 L56 102" stroke="#C7F8FF" stroke-width="2.4"/>

  <path d="M88 105 L94 113" stroke="#B7F5FF" stroke-width="2" opacity=".8"/>

  <!-- Subtle sketchnote laboratory accent -->
  <path d="M91 65 L99 62" stroke="#FFCA00" stroke-width="2.8"/>

  <path d="M92 73 L102 73" stroke="#FFCA00" stroke-width="2.5"/>

  <path d="M47 52 L42 46" stroke="#FFCA00" stroke-width="2.5"/>

  <!-- Hand-drawn measurement marks -->
  <path d="M67 79 L71 79            M67 84 L70 84" stroke="#32BEDD" stroke-width="1.8" opacity=".8"/>

  <!-- Small sketchnote sparkle -->
  <path d="M27 104 L27 112            M23 108 L31 108" stroke="#FFCA00" stroke-width="2.5"/>

  <!-- Bottom marker flourish -->
  <path d="M48 125 Q70 127 92 125" stroke="#198AB3" stroke-width="1.8" opacity=".55"/>
</svg>

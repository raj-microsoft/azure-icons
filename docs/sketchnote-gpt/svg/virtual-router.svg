<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Virtual Router (sketch)</title>

  
  <desc>Blue circular router with four separate directional arrows: cyan arrows pointing upward and downward, white arrows pointing inward from the left and right. No central disk.</desc>

  <!-- Circular Azure-blue router body -->
  <path d="M64 5            C96 4 123 31 123 63            C124 96 97 123 65 123            C32 124 5 98 5 65            C4 32 30 6 64 5 Z" fill="#0078D4" stroke="#172B3A" stroke-width="3.8"/>

  <!-- Top arrow: pointing UP -->
  <path d="M47 34            L62 19            Q64 17 66 19            L81 34            Q83 37 79 37            L71 37            L71 51            Q71 53 69 53            L59 53            Q57 53 57 51            L57 37            L49 37            Q45 37 47 34 Z" fill="#9CEBFF" stroke="#172B3A" stroke-width="2.7"/>

  <!-- Bottom arrow: pointing DOWN -->
  <path d="M59 75            L69 75            Q71 75 71 77            L71 91            L79 91            Q83 91 81 94            L66 109            Q64 111 62 109            L47 94            Q45 91 49 91            L57 91            L57 77            Q57 75 59 75 Z" fill="#9CEBFF" stroke="#172B3A" stroke-width="2.7"/>

  <!-- Right arrow: pointing INWARD / LEFT -->
  <path d="M74 62            L90 46            Q93 43 93 47            L93 55            L108 55            Q110 55 110 57            L110 67            Q110 69 108 69            L93 69            L93 77            Q93 81 90 78            L74 62 Z" fill="#F2F2F2" stroke="#172B3A" stroke-width="2.7"/>

  <!-- Left arrow: pointing INWARD / RIGHT -->
  <path d="M54 62            L38 46            Q35 43 35 47            L35 55            L20 55            Q18 55 18 57            L18 67            Q18 69 20 69            L35 69            L35 77            Q35 81 38 78            L54 62 Z" fill="#F2F2F2" stroke="#172B3A" stroke-width="2.7"/>

  <!-- Subtle uneven marker retraces -->
  <g stroke="#50E6FF" stroke-width="1.7" opacity=".75">
    <path d="M37 15 Q49 9 63 10"/>
    <path d="M115 46 Q119 57 117 70"/>
    <path d="M42 114 Q56 120 72 117"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#E6B93F" stroke-width="2.5">
    <path d="M24 22 L19 17"/>
    <path d="M104 22 L109 17"/>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Device Registry (sketch)</title>
  
  <desc>
    Hand-drawn Azure Device Registry icon featuring a cyan
    cloud, blue robotic device arm, connected registry module,
    uneven marker outlines, original Azure colors, subtle
    yellow sketch accents, and a transparent background.
  </desc>

  <defs>
    <linearGradient id="registryCloud" x1="64" y1="10" x2="64" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".5" stop-color="#2EC7EA"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>

    <linearGradient id="registryArm" x1="29" y1="62" x2="81" y2="113" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5AD4F5"/>
      <stop offset=".48" stop-color="#5EC6F3"/>
      <stop offset="1" stop-color="#69A2EF"/>
    </linearGradient>

    <linearGradient id="registryBlue" x1="64" y1="49" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A79D3"/>
      <stop offset="1" stop-color="#1F5FA4"/>
    </linearGradient>
  </defs>

  <!-- Cloud silhouette -->
  <path d="M29 91            C15 90 7 81 7 68            C7 55 16 45 29 44            C32 26 46 14 64 14            C81 14 95 25 99 40            L94 41            C90 29 78 21 64 21            C49 21 38 31 36 46            C36 49 34 51 31 51            C21 51 14 58 14 68            C14 77 20 83 29 84            Z" fill="url(#registryCloud)" stroke="#1685AF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right cloud lobe -->
  <path d="M109 47            C119 53 123 62 123 71            C123 83 113 92 101 92            L91 92            L91 85            L101 85            C110 85 116 79 116 71            C116 64 113 59 107 55            Z" fill="url(#registryCloud)" stroke="#1685AF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cloud marker highlights -->
  <path d="M24 47            Q16 52 15 61" stroke="#A7F1FF" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>

  <path d="M45 29            Q53 20 64 20" stroke="#B9F5FF" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>

  <path d="M109 59            Q116 65 115 72" stroke="#7BEAFF" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>

  <!-- Rear registry connector -->
  <path d="M75 52            Q76 49 80 49            L103 49            Q106 49 108 53            L110 57            Q112 61 108 63            L103 66            L82 66            Q78 65 76 62            Z" fill="url(#registryBlue)" stroke="#164E90" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Registry connector inner notch -->
  <path d="M94 54            L101 54            Q103 54 104 56            L105 58            L100 60            L94 60            L91 57            Z" fill="#D2F5FF" stroke="#164E90" stroke-width="1.7" stroke-linejoin="round"/>

  <!-- Registry component -->
  <path d="M70 45            Q70 42 73 42            L83 42            Q86 42 86 45            L86 67            Q86 70 83 70            L73 70            Q70 70 70 67            Z" fill="#69A2EF" stroke="#1F5FA4" stroke-width="2.7" stroke-linejoin="round"/>

  <path d="M75 47            L75 64" stroke="#C6F3FF" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>

  <!-- Angled robotic arm: upper segment -->
  <path d="M34 79            L62 57            Q66 54 69 57            L76 64            Q79 67 76 70            L49 92            Z" fill="url(#registryBlue)" stroke="#1F5FA4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Arm top marker highlight -->
  <path d="M42 78            L64 62" stroke="#8EDBFF" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

  <!-- Articulated joint -->
  <path d="M30 73            Q40 67 48 75            L84 109            Q89 114 85 119            L76 124            Q72 126 68 122            L30 86            Q24 79 30 73            Z" fill="url(#registryArm)" stroke="#267AB9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Arm side shading -->
  <path d="M41 77            L78 112            Q81 115 79 119            L72 121            L35 85            Z" fill="#69A2EF" opacity=".45"/>

  <!-- Mechanical joint accent -->
  <path d="M34 78            Q38 75 42 79            L48 85" stroke="#C8F5FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Device registry base -->
  <path d="M50 99            Q50 91 57 88            Q64 84 73 88            Q82 91 82 100            L82 118            Q82 121 79 121            L53 121            Q50 121 50 118            Z" fill="url(#registryBlue)" stroke="#164E90" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Registry base upper lip -->
  <path d="M52 100            Q53 94 61 92            Q70 90 77 95" stroke="#8BCFFF" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>

  <!-- Base highlight -->
  <path d="M57 108            L57 116" stroke="#70B9F4" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Small mechanical connection detail -->
  <path d="M60 87            Q67 82 75 87" stroke="#1F5FA4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tiny Azure-blue sketch details -->
  <path d="M88 75            Q93 77 96 81" stroke="#0078D4" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <path d="M26 96            Q30 102 36 105" stroke="#50E6FF" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M112 30            L116 25            M116 37            L122 35" stroke="#F4C542" stroke-width="2.6" stroke-linecap="round"/>

  <path d="M19 105            L15 109            M24 110            L22 116" stroke="#F4C542" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Loose handwritten-style marker accents -->
  <path d="M10 34            Q16 25 25 23" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round" opacity=".4"/>

  <path d="M92 117            Q103 120 112 115" stroke="#198AB3" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
</svg>

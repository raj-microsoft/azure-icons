<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Cost Analysis (sketch)</title>

  
  <desc>
    Hand-drawn Azure Cost Analysis icon featuring a prominent
    green dollar symbol and a cyan magnifying glass.
    Original Azure green, teal and blue palette with subtle
    yellow accents, uneven marker outlines, and transparent
    background. Standalone editable vector illustration.
  </desc>

  <defs>
    <linearGradient id="costGreen" x1="28" y1="8" x2="55" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86D633"/>
      <stop offset=".55" stop-color="#75BA2D"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>

    <linearGradient id="lensCyan" x1="54" y1="57" x2="106" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Dollar symbol vertical stroke -->
  <path d="M41 9            Q41 7 44 7            L48 7            Q51 7 51 10            L51 118            Q51 121 48 121            L44 121            Q41 121 41 118            Z" fill="url(#costGreen)" stroke="#5E9624" stroke-width="2.8"/>

  <!-- Hand-drawn dollar symbol -->
  <path d="M70 24            Q55 14 40 19            C24 22 17 34 20 48            C23 60 36 65 48 70            C62 76 68 82 67 94            C66 107 56 114 41 114            Q28 114 17 107            L17 90            Q29 100 41 101            C49 102 54 99 54 93            C54 87 48 83 36 78            C18 71 8 61 8 45            C8 24 22 12 41 11            Q58 9 70 16            Z" fill="url(#costGreen)" stroke="#5E9624" stroke-width="3.4"/>

  <!-- Sketchy highlight on green currency shape -->
  <path d="M24 42            Q25 27 39 24            M28 107            Q37 112 47 108" stroke="#B4EC36" stroke-width="3" opacity=".9"/>

  <!-- Subtle marker-style currency accents -->
  <path d="M14 83            Q20 87 25 89            M60 29            Q66 31 70 35" stroke="#86D633" stroke-width="2.2" opacity=".8"/>

  <!-- Magnifying glass handle -->
  <path d="M91 91            L117 117            Q121 121 117 124            Q114 127 110 123            L84 98            Z" fill="#198AB3" stroke="#005B8F" stroke-width="3.5"/>

  <!-- Handle highlight -->
  <path d="M95 98            L115 118" stroke="#50E6FF" stroke-width="2.8"/>

  <!-- Magnifying glass outer rim -->
  <path d="M75 55            C94 54 109 69 109 88            C109 107 94 122 75 122            C56 122 41 107 41 88            C41 69 56 55 75 55            Z" fill="url(#lensCyan)" stroke="#198AB3" stroke-width="3.8"/>

  <!-- White transparent-style lens interior -->
  <path d="M75 63            C89 63 101 74 101 88            C101 103 90 114 75 114            C60 114 49 103 49 88            C49 74 60 63 75 63            Z" fill="#FFFFFF" stroke="#32BEDD" stroke-width="2.8"/>

  <!-- Hand-drawn inner lens reflection -->
  <path d="M58 82            Q62 71 73 70            M92 95            Q89 104 80 107" stroke="#B8F4FF" stroke-width="3.2"/>

  <!-- Small analytical trend inside lens -->
  <path d="M59 98            L69 90            L77 94            L91 79" stroke="#5EA0EF" stroke-width="3" opacity=".9"/>

  <!-- Tiny rising trend arrow -->
  <path d="M84 79            L92 78            L91 86" stroke="#5EA0EF" stroke-width="2.8"/>

  <!-- Hand-drawn yellow emphasis strokes -->
  <g stroke="#FFD400" stroke-width="3">
    <path d="M78 23 L84 18"/>
    <path d="M82 32 L90 30"/>
    <path d="M12 118 L18 114"/>
  </g>

  <!-- Sketchnote sparkle -->
  <g stroke="#FFD400" stroke-width="2.4">
    <path d="M103 48 L103 58"/>
    <path d="M98 53 L108 53"/>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Free Services (sketch)</title>
  
  <desc>Azure-blue monitor displaying a cyan gift box with a golden ribbon, supported by a grey stand, illustrated with uneven marker outlines and a transparent background.</desc>

  <defs>
    <linearGradient id="screenBlue" x1="64" y1="12" x2="64" y2="89" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".55" stop-color="#328FDF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="standGrey" x1="64" y1="87" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#707070"/>
      <stop offset="1" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>

  <!-- Main monitor silhouette -->
  <path d="M11 13            Q7 13 7 18            L7 84            Q7 89 12 89            L116 89            Q121 89 121 84            L121 18            Q121 13 116 13Z" fill="url(#screenBlue)" stroke="#135B96" stroke-width="3.6"/>

  <!-- Hand-inked monitor highlights -->
  <path d="M14 25 L14 76            M20 20 Q64 18 108 20            M23 83 L105 83" stroke="#B7DBFA" stroke-width="2.5" opacity=".75"/>

  <!-- Monitor stand -->
  <path d="M52 89            L76 89            Q75 99 79 108            Q82 112 89 113            Q94 114 94 119            L34 119            Q34 114 39 113            Q46 112 49 107            Q53 99 52 89Z" fill="url(#standGrey)" stroke="#686868" stroke-width="3.2"/>

  <!-- Stand highlights -->
  <path d="M57 92 Q57 105 50 112            M42 116 Q64 115 86 116" stroke="#E0E0E0" stroke-width="2.2" opacity=".85"/>

  <!-- Gift box top -->
  <path d="M45 50            L64 39            L83 50            L64 61Z" fill="#C3F1FF" stroke="#279FC5" stroke-width="2.6"/>

  <!-- Gift box left face -->
  <path d="M45 50            L64 61            L64 83            L45 72Z" fill="#9CEBFF" stroke="#279FC5" stroke-width="2.6"/>

  <!-- Gift box right face -->
  <path d="M64 61            L83 50            L83 72            L64 83Z" fill="#50E6FF" stroke="#279FC5" stroke-width="2.6"/>

  <!-- Angular sketch shading -->
  <path d="M47 71 L62 79            M67 79 L80 71" stroke="#C3F1FF" stroke-width="2.2" opacity=".85"/>

  <!-- Ribbon cross over gift lid -->
  <path d="M55 44 L74 55            M73 44 L54 55" stroke="#FFF0A6" stroke-width="3" opacity=".9"/>

  <!-- Golden bow center -->
  <path d="M61 38            Q64 36 67 38            Q69 41 66 43            Q63 45 61 42            Q59 40 61 38Z" fill="#FFCA00" stroke="#C58C00" stroke-width="2"/>

  <!-- Left ribbon loop -->
  <path d="M62 40            C55 30 46 30 45 36            C44 42 54 45 62 40Z" fill="#FFCA00" stroke="#D49A00" stroke-width="2.5"/>

  <!-- Right ribbon loop -->
  <path d="M66 40            C73 29 83 30 84 36            C85 42 75 45 66 40Z" fill="#FFCA00" stroke="#D49A00" stroke-width="2.5"/>

  <!-- Loose ribbon tails -->
  <path d="M62 39            Q55 29 47 23            L53 24            L49 17            Q62 26 64 37Z" fill="#FFCA00" stroke="#C58C00" stroke-width="1.8"/>

  <path d="M66 39            Q71 29 80 25            L76 25            L80 19            Q69 24 64 37Z" fill="#FFCA00" stroke="#C58C00" stroke-width="1.8"/>

  <!-- Ribbon marker highlights -->
  <path d="M48 36 Q53 33 59 39            M70 39 Q77 33 82 36" stroke="#FFE47C" stroke-width="2" opacity=".9"/>

  <!-- Small hand-drawn emphasis marks -->
  <path d="M32 39 L27 35            M31 48 L24 47            M97 39 L102 35            M97 48 L104 47" stroke="#D9F0FF" stroke-width="2.4"/>

  <!-- Restrained sketchnote sparkle -->
  <path d="M94 60 L94 67            M90.5 63.5 L97.5 63.5" stroke="#FFBD02" stroke-width="2.4"/>

  <!-- Subtle monitor edge wobble -->
  <path d="M10 56 L10 67            M118 69 L118 79            M28 87 L40 87" stroke="#0C5892" stroke-width="1.8" opacity=".55"/>
</svg>

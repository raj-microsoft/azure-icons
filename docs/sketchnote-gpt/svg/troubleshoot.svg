<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Troubleshoot (sketch)</title>
  
  <desc>Two crossed troubleshooting tools: a bright cyan open-ended wrench and a deep Azure-blue screwdriver, drawn with slightly uneven marker outlines on a transparent background.</desc>

  <defs>
    <linearGradient id="wrenchBlue" x1="35" y1="9" x2="107" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".46" stop-color="#2CC3E6"/>
      <stop offset=".78" stop-color="#25AFD4"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>

    <linearGradient id="driverBlue" x1="109" y1="8" x2="23" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#198AB3"/>
      <stop offset=".45" stop-color="#1079AD"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
  </defs>

  <!-- Rear screwdriver: long diagonal shaft -->
  <path d="M94 29            L103 20            L111 27            L101 37            L70 70            L59 81            Q54 85 50 91            L30 113            Q27 116 24 113            L13 102            Q10 99 13 96            L36 73            Q41 69 46 65            L83 39Z" fill="url(#driverBlue)" stroke="#075A88" stroke-width="3.3"/>

  <!-- Screwdriver tip -->
  <path d="M95 28            L99 21            L115 10            Q117 9 119 11            L121 13            Q122 15 121 17            L110 34            L103 38            L99 33Z" fill="#198AB3" stroke="#075A88" stroke-width="3"/>

  <!-- Tip facets -->
  <path d="M108 23 L118 13" stroke="#72DFF1" stroke-width="2.4"/>

  <path d="M101 31 L106 36" stroke="#005BA1" stroke-width="2"/>

  <!-- Screwdriver neck and grip details -->
  <path d="M81 42 L89 50            M75 48 L83 56" stroke="#005B91" stroke-width="2.3"/>

  <path d="M18 101 L28 111            M24 94 L35 105" stroke="#63C9E7" stroke-width="2.5" opacity=".85"/>

  <!-- Foreground open-ended wrench -->
  <path d="M10 27            Q8 38 15 48            C23 59 36 63 48 59            L97 114            Q104 123 114 120            C123 117 126 107 120 99            L62 40            C66 28 62 17 53 10            Q42 2 30 7            L43 21            L39 35            L25 39            L12 25            Q11 26 10 27Z" fill="url(#wrenchBlue)" stroke="#08759E" stroke-width="4"/>

  <!-- Emphasized open wrench jaw -->
  <path d="M12 25            L25 39            L39 35            L43 21            L30 7" stroke="#08759E" stroke-width="3.5"/>

  <!-- Uneven inner marker highlight -->
  <path d="M48 51            Q67 72 82 89            L103 112" stroke="#A4F2FF" stroke-width="3.2" opacity=".85"/>

  <!-- Wrench jaw surface detail -->
  <path d="M18 43            Q28 54 41 51" stroke="#83E8F8" stroke-width="2.6" opacity=".85"/>

  <!-- Wrench handle end -->
  <path d="M107 105            C110 103 114 105 115 109            Q116 113 112 115            C108 117 104 114 104 110            Q104 107 107 105Z" fill="#E7FAFF" stroke="#08759E" stroke-width="2.5"/>

  <!-- Subtle freehand contour strokes -->
  <g stroke="#0078D4" stroke-width="1.8" opacity=".7">
    <path d="M17 54 Q27 64 40 63"/>
    <path d="M69 70 Q84 86 95 99"/>
    <path d="M19 117 L26 122"/>
  </g>

  <!-- Restrained yellow sketchnote spark -->
  <path d="M86 15            L89 8            L92 15            L99 18            L92 21            L89 28            L86 21            L79 18Z" fill="#FFD966" stroke="#D49A20" stroke-width="1.6"/>

  <!-- Small hand-drawn motion ticks -->
  <g stroke="#0078D4" stroke-width="2.2" opacity=".8">
    <path d="M6 66 L13 63"/>
    <path d="M9 73 L16 70"/>
    <path d="M113 83 L119 79"/>
  </g>
</svg>

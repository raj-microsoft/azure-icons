<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Mobile Engagement (sketch)</title>
  <defs>
    <linearGradient id="phoneBody" x1="9" y1="22.81" x2="9" y2="-2.491" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset=".165" stop-color="#1c84dc"/>
      <stop offset=".378" stop-color="#3990e4"/>
      <stop offset=".59" stop-color="#4d99ea"/>
      <stop offset=".799" stop-color="#5a9eee"/>
      <stop offset="1" stop-color="#5ea0ef"/>
    </linearGradient>
    <linearGradient id="screen" x1="9" y1="15.982" x2="9" y2="1.522" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2ebff"/>
      <stop offset=".997" stop-color="#f0fffd"/>
    </linearGradient>
  </defs>

  <g transform="scale(7.111111)">

    <!-- Home button -->
    <rect x="8.398" y="16.58" width="1.204" height="1.028" rx=".286" fill="#f2f2f2"/>

    <!-- Original message panel: no additional bubbles or symbols -->
    <path d="M11.4 2.892V6.476a.192.192 0 0 1-.193.192h-1.5a.047.047 0 0 0-.047.047v.578a.094.094 0 0 1-.151.074l-.9-.689a.048.048 0 0 0-.029-.01H5.974a.192.192 0 0 1-.193-.192V2.892A.192.192 0 0 1 5.974 2.7H11.21a.192.192 0 0 1 .19.192Z" fill="#5ea0ef" stroke="#438fd7" stroke-width=".025" stroke-linejoin="round"/>


    <rect x="5.768" y="9.88" width="1.683" height="4.782" rx=".293" fill="#5ea0ef"/>
    <rect x="8.265" y="8.806" width="1.683" height="5.855" rx=".293" fill="#0078d4"/>
    <rect x="10.761" y="7.927" width="1.683" height="6.734" rx=".293" fill="#005ba1"/>


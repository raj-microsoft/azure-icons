<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="butt" stroke-linejoin="round"><title>DevOps Starter (sketch)</title>
  
  <desc>Azure cyan cloud with a white circular badge, purple perimeter, and thin broken blue infinity emblem.</desc>

  <!-- Azure cloud: original silhouette preserved -->
  <path d="M54 93            C43 93 31 93 28 92            C13 90 5 78 5 63            C4 48 14 37 30 32            C35 16 49 5 65 5            C84 4 100 19 102 38            C114 40 126 51 126 65            C127 80 117 88 104 93            Q101 94 96 94 Z" fill="#39C5EF" stroke="#203746" stroke-width="3.5"/>

  <!-- White circular badge: unchanged -->
  <path d="M80 46            C102 45 119 62 119 84            C119 106 102 123 80 123            C58 123 41 106 41 84            C41 62 58 46 80 46 Z" fill="#FFFFFF" stroke="#203746" stroke-width="3.3"/>

  <!-- Purple perimeter: unchanged -->
  <path d="M80 51            C99 50 114 65 114 84            C114 103 99 118 80 118            C61 118 46 103 46 84            C46 65 61 51 80 51 Z" stroke="#9570D2" stroke-width="4"/>

  <!-- Broken infinity emblem.
       Charcoal edging: 3.2 units.
       Blue inner stroke: 1.8 units.
       Butt caps preserve clearly visible gaps.
       No endpoint circles or continuation segments. -->

  <!-- First continuous section:
       Begins below the upper-left break,
       curves around the left lobe, crosses centrally,
       continues around the upper-right lobe,
       and ends above the lower-right break. -->
  <path id="infinity-main" d="M68 69            C59 69 54 76 54 85            C54 95 61 102 70 102            C79 102 85 95 85 86            C85 78 92 72 100 73            C108 74 112 80 112 87            C112 91 110 94 106 96" stroke="#203746" stroke-width="3.2"/>

  <path d="M68 69            C59 69 54 76 54 85            C54 95 61 102 70 102            C79 102 85 95 85 86            C85 78 92 72 100 73            C108 74 112 80 112 87            C112 91 110 94 106 96" stroke="#417BE9" stroke-width="1.8"/>

  <!-- Second continuous section:
       Starts after the lower-right break,
       follows the lower-right return,
       crosses the central junction,
       and stops before the upper-left break. -->
  <path id="infinity-return" d="M93 102            C89 99 85 93 85 86            C85 78 82 73 79 70" stroke="#203746" stroke-width="3.2"/>

  <path d="M93 102            C89 99 85 93 85 86            C85 78 82 73 79 70" stroke="#1453C8" stroke-width="1.8"/>

</svg>

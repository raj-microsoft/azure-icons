<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure DocumentDB (sketch)</title>
  
  <desc>Azure database cylinder with a cyan elliptical top and exactly two empty white JSON curly braces. No quotation marks or extra code symbols.</desc>

  <!-- Database cylinder -->
  <path d="M17 19            C17 10 38 4 64 4            C90 4 111 10 111 19            L111 108            C110 118 91 124 64 124            C38 124 17 118 17 108 Z" fill="#176DB5" stroke="#173F60" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Outer database rim -->
  <path d="M17 19            C17 10 38 4 64 4            C90 4 111 10 111 19            C111 29 90 36 64 36            C38 36 17 29 17 19 Z" fill="#E2E2E2" stroke="#526E82" stroke-width="3"/>

  <!-- Cyan elliptical surface -->
  <path d="M28 18            C28 12 44 8 64 8            C84 8 100 12 100 18            C100 24 84 29 64 29            C44 29 28 24 28 18 Z" fill="#8EC8E7" stroke="#378EBA" stroke-width="2.2"/>

  <!-- Inner surface shadow -->
  <path d="M36 24            Q49 20 64 20            Q80 20 92 24            Q80 29 64 29            Q47 29 36 24 Z" fill="#1E89B2"/>

  <!-- Top hand-drawn accents -->
  <path d="M38 15 Q52 10 68 12            M78 13 Q88 14 93 17" stroke="#E0F8FF" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Cylinder side contours -->
  <path d="M24 42 L24 101 Q25 112 40 117" stroke="#67A9D9" stroke-width="3" stroke-linecap="round" opacity=".8"/>

  <path d="M104 42 L104 104 Q103 113 93 117" stroke="#004B88" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>

  <path d="M18 105 Q30 123 64 124 Q91 124 110 106" stroke="#005DA1" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="17 5 8 5" opacity=".75"/>

  <!-- Left empty JSON curly brace -->
  <path d="M54 53            C46 53 43 56 43 63            L43 70            C43 76 40 79 34 80            C40 81 43 84 43 90            L43 97            C43 104 46 107 54 107" stroke="#F3F3F3" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right empty JSON curly brace -->
  <path d="M74 53            C82 53 85 56 85 63            L85 70            C85 76 88 79 94 80            C88 81 85 84 85 90            L85 97            C85 104 82 107 74 107" stroke="#F3F3F3" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle brace edge details -->
  <path d="M51 57 Q47 58 47 64            M47 96 Q47 102 51 103            M77 57 Q81 58 81 64            M81 96 Q81 102 77 103" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>

  <!-- Empty space between braces: no quotation marks or symbols -->

  <!-- Small cylinder sketch details -->
  <path d="M31 45 Q35 42 40 43            M89 43 Q95 42 99 45            M44 114 Q64 119 84 114" stroke="#8EC8E7" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <!-- Azure-blue annotation strokes -->
  <path d="M12 48 L12 62            M116 52 L116 67            M35 125 Q47 129 58 127" stroke="#159DCE" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="9 5" opacity=".65"/>

  <!-- Restrained yellow accents -->
  <path d="M113 25 L118 20            M117 30 L123 30" stroke="#F3B82D" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M10 91 L14 87            M10 98 L15 98" stroke="#F3B82D" stroke-width="2.3" stroke-linecap="round" opacity=".85"/>
</svg>

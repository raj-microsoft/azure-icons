<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Service Catalog MAD (sketch)</title>

  
  <desc>
    Purple layered service catalog book featuring one
    compact isometric cube with three visible faces,
    each subdivided into a two-by-two grid.
    A small white supporting hand sits beneath the cube.
    Flat fills, wobbly charcoal marker outlines,
    and a transparent background.
  </desc>

  <!-- Rear purple book cover -->
  <path d="M14 17        L23 7        Q25 5 28 5        L108 5        Q114 5 114 11        L114 112        L104 122        L19 122        L14 120 Z" fill="#773ADC" stroke="#203746" stroke-width="3.2"/>

  <!-- White page layer -->
  <path d="M21 17        L27 11        L105 11        L109 15        L109 109        L101 117        L20 117 Z" fill="#FFFFFF" stroke="#203746" stroke-width="2.5"/>

  <!-- Main purple book face -->
  <path d="M15 17        Q15 15 18 15        L99 15        Q102 15 102 18        L102 119        Q102 122 99 122        L18 122        Q15 122 15 119 Z" fill="#A669EE" stroke="#203746" stroke-width="3.3"/>

  <!-- SINGLE compact isometric cube -->

  <!-- Top face -->
  <path d="M64 42        L87 55        L64 69        L41 55 Z" fill="#FFFFFF" stroke="#203746" stroke-width="2.5"/>

  <!-- Left face -->
  <path d="M41 55        L64 69        L64 96        L41 82 Z" fill="#FFFFFF" stroke="#203746" stroke-width="2.5"/>

  <!-- Right face -->
  <path d="M64 69        L87 55        L87 82        L64 96 Z" fill="#F1E5FF" stroke="#203746" stroke-width="2.5"/>

  <!-- Top face: 2-by-2 subdivision -->
  <path d="M52.5 48.5        L75.5 62        M75.5 48.5        L52.5 62" stroke="#203746" stroke-width="1.8"/>

  <!-- Left face: 2-by-2 subdivision -->
  <path d="M52.5 62        L52.5 89        M41 68.5        L64 82.5" stroke="#203746" stroke-width="1.8"/>

  <!-- Right face: 2-by-2 subdivision -->
  <path d="M75.5 62        L75.5 89        M64 82.5        L87 68.5" stroke="#203746" stroke-width="1.8"/>

  <!-- Supporting hand beneath cube -->
  <path d="M26 101        L34 101        Q39 101 43 98        Q47 96 52 98        Q56 99 59 103        L63 106        L70 106        Q74 106 74 109        Q74 112 70 112        L59 112        Q56 112 53 109" fill="#FFFFFF" stroke="#203746" stroke-width="2.5"/>

  <!-- Palm and extended supporting fingers -->
  <path d="M26 101        L34 101        Q40 101 45 107        L50 112        Q54 116 61 116        L71 116        Q77 116 82 113        L93 106        Q97 104 95 101        Q93 99 89 101        L77 107        Q75 109 71 109        L65 109        Q62 109 59 106" fill="#FFFFFF" stroke="#203746" stroke-width="2.6"/>

</svg>

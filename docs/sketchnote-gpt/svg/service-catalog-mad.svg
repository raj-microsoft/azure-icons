<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Service Catalog MAD (sketch)</title>
  
  <desc>
    Purple layered service catalog document with one
    subdivided isometric cube arrangement and a supporting
    hand beneath it. Flat fills, uneven charcoal outlines,
    and transparent background.
  </desc>

  <!-- Layered document: rear purple cover -->
  <path d="M14 17 L23 7 Q25 5 28 5        L108 5 Q114 5 114 11        L114 112 L104 122        L19 122 L14 120 Z" fill="#773ADC" stroke="#203746" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Narrow white page layer -->
  <path d="M21 17 L27 11        L105 11 L109 15        L109 109 L101 117        L20 117 Z" fill="#FFFFFF" stroke="#203746" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Main purple document face -->
  <path d="M15 17        Q15 15 18 15        L99 15 Q102 15 102 18        L102 119 Q102 122 99 122        L18 122 Q15 122 15 119 Z" fill="#A669EE" stroke="#203746" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- One subdivided isometric cube structure -->
  <!-- Upper middle diamond -->
  <path d="M58 35 L69 29 L80 35 L69 41 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Upper-left diamond -->
  <path d="M44 43 L55 37 L66 43 L55 49 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Upper-right diamond -->
  <path d="M72 43 L83 37 L94 43 L83 49 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Middle central diamond -->
  <path d="M58 51 L69 45 L80 51 L69 57 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Left central diamond -->
  <path d="M30 59 L41 53 L52 59 L41 65 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Right central diamond -->
  <path d="M86 59 L97 53 L108 59 L97 65 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Connected left/front cube faces -->
  <path d="M44 43 L55 49 L55 64 L44 58 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <path d="M55 49 L66 43 L66 58 L55 64 Z" fill="#F1E5FF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Connected center cube faces -->
  <path d="M58 51 L69 57 L69 73 L58 66 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <path d="M69 57 L80 51 L80 66 L69 73 Z" fill="#F1E5FF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Connected right/front cube faces -->
  <path d="M72 43 L83 49 L83 64 L72 58 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <path d="M83 49 L94 43 L94 58 L83 64 Z" fill="#F1E5FF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Lower-left subdivision -->
  <path d="M44 66 L55 72 L55 88 L44 82 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <path d="M55 72 L66 66 L66 82 L55 88 Z" fill="#F1E5FF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Lower-right subdivision -->
  <path d="M72 66 L83 72 L83 88 L72 82 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <path d="M83 72 L94 66 L94 82 L83 88 Z" fill="#F1E5FF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Supporting hand beneath the geometric service map -->
  <path d="M25 94        L33 94        Q38 93 42 91        Q46 89 51 90        Q56 91 59 95        L64 100        L70 100        Q75 100 75 104        Q75 107 71 107        L57 107        Q54 107 52 105        L48 102" fill="#FFFFFF" stroke="#203746" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand palm and extended fingers -->
  <path d="M25 94 L33 94        Q40 94 45 100        L50 105        Q54 110 61 110        L72 110        Q78 110 83 107        L94 100        Q98 97 95 95        Q93 93 89 95        L77 101        Q75 103 71 103        L64 103        Q61 103 59 100" fill="#FFFFFF" stroke="#203746" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

</svg>

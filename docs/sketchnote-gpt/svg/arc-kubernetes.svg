    <path d="M5 -3 L10 -5 M5 1 L10 -1" stroke="#D7BCFF" stroke-width="1.6" opacity="0.9"/>

    <path d="M-10 -12 L0 -16" stroke="#C49AF7" stroke-width="1.6" opacity="0.8"/>
  </g>

  <!-- Middle row: center Kubernetes container -->
  <g transform="translate(64 52) rotate(1)" stroke-linejoin="round" stroke-linecap="round">

    <path d="M-12 -10 L0 -14 L13 -9 L1 -5Z" fill="#B77AF4" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M-12 -10 L1 -5 L1 12 L-12 8Z" fill="#9560E8" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M1 -5 L13 -9 L13 7 L1 12Z" fill="url(#arcPurple)" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M-8 -7 L-8 7 M-3 -5 L-3 9" stroke="#341A6E" stroke-width="1.8"/>

    <path d="M5 -3 L10 -5 M5 1 L10 -1" stroke="#D7BCFF" stroke-width="1.6" opacity="0.9"/>

    <path d="M-10 -12 L0 -16" stroke="#C49AF7" stroke-width="1.6" opacity="0.8"/>
  </g>

  <!-- Middle row: right Kubernetes container -->
  <g transform="translate(102 52) rotate(2)" stroke-linejoin="round" stroke-linecap="round">

    <path d="M-12 -10 L0 -14 L13 -9 L1 -5Z" fill="#B77AF4" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M-12 -10 L1 -5 L1 12 L-12 8Z" fill="#9560E8" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M1 -5 L13 -9 L13 7 L1 12Z" fill="url(#arcPurple)" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M-8 -7 L-8 7 M-3 -5 L-3 9" stroke="#341A6E" stroke-width="1.8"/>

    <path d="M5 -3 L10 -5 M5 1 L10 -1" stroke="#D7BCFF" stroke-width="1.6" opacity="0.9"/>

    <path d="M-10 -12 L0 -16" stroke="#C49AF7" stroke-width="1.6" opacity="0.8"/>
  </g>

  <!-- Front row: left Kubernetes container -->
  <g transform="translate(45 84) rotate(-1)" stroke-linejoin="round" stroke-linecap="round">

    <path d="M-12 -10 L0 -14 L13 -9 L1 -5Z" fill="#B77AF4" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M-12 -10 L1 -5 L1 12 L-12 8Z" fill="#9560E8" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M1 -5 L13 -9 L13 7 L1 12Z" fill="url(#arcPurple)" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M-8 -7 L-8 7 M-3 -5 L-3 9" stroke="#341A6E" stroke-width="1.8"/>

    <path d="M5 -3 L10 -5 M5 1 L10 -1" stroke="#D7BCFF" stroke-width="1.6" opacity="0.9"/>

    <path d="M-10 -12 L0 -16" stroke="#C49AF7" stroke-width="1.6" opacity="0.8"/>
  </g>

  <!-- Front row: right Kubernetes container -->
  <g transform="translate(83 84) rotate(2)" stroke-linejoin="round" stroke-linecap="round">

    <path d="M-12 -10 L0 -14 L13 -9 L1 -5Z" fill="#B77AF4" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M-12 -10 L1 -5 L1 12 L-12 8Z" fill="#9560E8" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M1 -5 L13 -9 L13 7 L1 12Z" fill="url(#arcPurple)" stroke="#341A6E" stroke-width="1.9"/>

    <path d="M-8 -7 L-8 7 M-3 -5 L-3 9" stroke="#341A6E" stroke-width="1.8"/>

    <path d="M5 -3 L10 -5 M5 1 L10 -1" stroke="#D7BCFF" stroke-width="1.6" opacity="0.9"/>

    <path d="M-10 -12 L0 -16" stroke="#C49AF7" stroke-width="1.6" opacity="0.8"/>
  </g>

  <!-- Subtle platform sketch details -->
  <path d="M22 101        C28 104 33 105 38 106        M91 106        C98 105 104 103 109 100" stroke="#0078D4" stroke-width="1.7" stroke-linecap="round" opacity="0.6"/>

  <!-- Restrained yellow sketchnote emphasis -->
  <path d="M104 19 L110 15        M108 26 L116 24" stroke="#F4C542" stroke-width="2.8" stroke-linecap="round"/>

  <path d="M13 43 L8 39        M13 49 L6 49" stroke="#F4C542" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Small informal handwritten-style marks -->
  <path d="M60 5 L64 2 L68 5" stroke="#B77AF4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M17 116 L21 120        M107 120 L111 116" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round"/>

</svg>

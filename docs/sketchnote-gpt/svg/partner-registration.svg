<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><title>Partner Registration (sketch)</title>
  <defs>
    <linearGradient id="partnerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="partnerPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B6AE8"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="partnerArrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#5EA0EF"/>
    </linearGradient>
  </defs>

  <!-- Azure partner tile cluster -->
  <g stroke="#075B9B" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M17 13 Q17 10 20 10 L47 10 L48 40 L17 40 Z" fill="url(#partnerBlue)"/>
    <path d="M52 10 L81 10 Q84 10 84 13 L84 40 L52 40 Z" fill="url(#partnerBlue)"/>
    <path d="M17 46 L48 46 L48 76 L20 76 Q17 76 17 73 Z" fill="url(#partnerBlue)"/>
    <path d="M52 46 L84 46 L84 73 Q84 76 81 76 L52 76 Z" fill="url(#partnerBlue)"/>
  </g>

  <!-- Subtle hand-drawn tile highlights -->
  <g fill="none" stroke="#B9E5FF" stroke-width="2" stroke-linecap="round">
    <path d="M23 17 Q33 15 42 17"/>
    <path d="M58 17 Q69 15 77 17"/>
    <path d="M23 53 Q34 51 42 53"/>
    <path d="M58 53 Q69 51 77 53"/>
  </g>

  <!-- Central partnership connection -->
  <path d="M49 28 Q52 25 55 28 L55 58 Q52 61 49 58 Z" fill="#E6F5FF" stroke="#075B9B" stroke-width="2"/>

  <!-- Grey partnership bridge -->
  <g stroke="#777777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 80 L88 80 Q91 80 91 84 L91 103 Q91 106 88 106 L42 106 Q39 106 39 103 L39 84 Q39 80 42 80 Z" fill="#A3A3A3"/>
    <path d="M35 84 L95 84" fill="none" stroke="#D4D4D4" stroke-width="2"/>
    <path d="M45 97 L85 97" fill="none" stroke="#777777" stroke-width="2"/>
  </g>

  <!-- Partner exchange symbol -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M73 62 L99 62 L93 56 M99 62 L93 68" fill="none" stroke="url(#partnerArrow)" stroke-width="5"/>
    <path d="M98 75 L72 75 L78 69 M72 75 L78 81" fill="none" stroke="url(#partnerArrow)" stroke-width="5"/>
  </g>

  <!-- Purple partner relationship loop -->
  <g stroke="#6530B7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86 92       Q95 88 103 95       Q111 102 106 111       Q102 119 92 116       Q87 115 84 110" fill="none"/>
    <path d="M84 110 L83 117 L91 114" fill="none"/>
    <path d="M95 93       Q89 88 82 91       Q76 94 75 100" fill="none"/>
  </g>

  <!-- Purple partnership node -->
  <circle cx="95" cy="103" r="10" fill="url(#partnerPurple)" stroke="#6530B7" stroke-width="2.5"/>
  <circle cx="95" cy="103" r="3.5" fill="#E8D9FF"/>

  <!-- Yellow sketchnote accents -->
  <g fill="none" stroke="#F2C94C" stroke-width="3" stroke-linecap="round">
    <path d="M104 26 L110 20"/>
    <path d="M111 35 L119 34"/>
    <path d="M107 43 L113 49"/>
    <path d="M27 89 L32 85"/>
    <path d="M17 96 L23 96"/>
  </g>

  <!-- Marker-style finishing strokes -->
  <g fill="none" stroke="#0078D4" stroke-width="2" stroke-linecap="round">
    <path d="M13 27 L10 31"/>
    <path d="M82 7 Q88 5 92 9"/>
    <path d="M29 113 Q36 116 42 113"/>
    <path d="M115 84 Q119 81 122 85"/>
  </g>
</svg>

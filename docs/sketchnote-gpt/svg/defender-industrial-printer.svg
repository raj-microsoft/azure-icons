<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Defender Industrial Printer (sketch)</title>
  
  <desc>Hand-drawn Azure industrial printer with blue housing, dark upper paper-feed panel, small status indicator, cyan output slot and completely blank cyan paper positioned in front of the slot. Flat colors, uneven dark marker outlines and transparent background.</desc>

  <!-- Upper industrial paper-feed assembly -->
  <path d="M18 4 Q18 2 22 2 L106 2 Q110 2 110 5 L110 22 Q109 24 106 24 L21 24 Q18 23 18 20 Z" fill="#005BA1" stroke="#243447" stroke-width="3.1"/>

  <!-- Main printer housing -->
  <path d="M9 10 Q5 10 5 16 L5 109 Q5 113 10 113 L118 113 Q123 113 123 109 L123 17 Q123 10 118 10 Z" fill="#5EA0EF" stroke="#243447" stroke-width="3.5"/>

  <!-- Lower Azure-blue housing band -->
  <path d="M5 100 Q64 99 123 100 L123 109 Q123 113 118 113 L10 113 Q5 113 5 109 Z" fill="#0078D4" stroke="#243447" stroke-width="2.7"/>

  <!-- Small round printer status indicator, approximately 6px diameter -->
  <path d="M108 54 C109.8 54 111 55.4 111 57 C111 58.8 109.7 60 108 60 C106.2 60 105 58.6 105 57 C105 55.3 106.3 54 108 54 Z" fill="#C3F1FF" stroke="#243447" stroke-width="1.5"/>

  <!-- Paper output slot, drawn BEHIND the sheet -->
  <path d="M19 76 Q19 73 23 73 L105 73 Q109 73 109 77 L109 87 Q109 91 105 91 L23 91 Q19 91 19 87 Z" fill="#83B9F9" stroke="#243447" stroke-width="3"/>

  <!-- Completely blank cyan output paper, IN FRONT of slot -->
  <!-- Top edge is only 2px below slot's top edge -->
  <path d="M24 75            Q24 75 27 75            L101 75            Q104 75 104 78            L104 121            Q104 125 100 125            L28 125            Q24 125 24 121            Z" fill="#C3F1FF" stroke="#243447" stroke-width="2.8"/>

</svg>

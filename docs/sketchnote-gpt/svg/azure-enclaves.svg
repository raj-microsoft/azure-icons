<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Enclaves (sketch)</title>

  
  <desc>
    Hand-drawn Azure Enclaves icon with a symmetric cluster
    of cyan and deep-blue hexagonal cells, framed by curved
    Azure-blue protective arcs. Original Azure colours,
    irregular marker outlines, restrained yellow accents,
    and a transparent background. Fully editable vector paths.
  </desc>

  <defs>
    <linearGradient id="enclaveBlue" x1="45" y1="24" x2="85" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset=".55" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#0062AD"/>
    </linearGradient>

    <linearGradient id="enclaveCyan" x1="30" y1="15" x2="93" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8CF2FF"/>
      <stop offset=".5" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Protective circular enclosure: four open arcs -->
  <g stroke="#005BA1" stroke-width="4" stroke-linecap="round" fill="none">

    <path d="M23 48              C29 31 42 19 58 16"/>

    <path d="M84 19              C98 26 108 39 112 51"/>

    <path d="M112 77              C107 94 94 106 79 111"/>

    <path d="M45 109              C31 102 22 90 18 77"/>

  </g>

  <!-- Secondary sketch strokes around boundary -->
  <g stroke="#5EA0EF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".75">

    <path d="M28 43 Q38 24 53 21"/>
    <path d="M89 25 Q102 35 107 47"/>
    <path d="M106 82 Q98 99 85 104"/>
    <path d="M39 103 Q27 94 23 82"/>

  </g>

  <!-- Top central cyan hexagon -->
  <path d="M57 7            L71 7            L79 20            L71 33            L57 33            L49 20Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Upper-left cyan hexagon -->
  <path d="M36 21            L50 21            L58 34            L50 47            L36 47            L28 34Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Upper-right cyan hexagon -->
  <path d="M78 21            L92 21            L100 34            L92 47            L78 47            L70 34Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Left outer cyan hexagon -->
  <path d="M14 50            L28 50            L36 63            L28 76            L14 76            L6 63Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Right outer cyan hexagon -->
  <path d="M100 50            L114 50            L122 63            L114 76            L100 76            L92 63Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lower-left cyan hexagon -->
  <path d="M36 81            L50 81            L58 94            L50 107            L36 107            L28 94Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lower-right cyan hexagon -->
  <path d="M78 81            L92 81            L100 94            L92 107            L78 107            L70 94Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Bottom central cyan hexagon -->
  <path d="M57 95            L71 95            L79 108            L71 121            L57 121            L49 108Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner upper-left blue hexagon -->
  <path d="M36 43            L50 43            L58 56            L50 69            L36 69            L28 56Z" fill="url(#enclaveBlue)" stroke="#004F8B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner upper-right blue hexagon -->
  <path d="M78 43            L92 43            L100 56            L92 69            L78 69            L70 56Z" fill="url(#enclaveBlue)" stroke="#004F8B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner lower-left blue hexagon -->
  <path d="M36 68            L50 68            L58 81            L50 94            L36 94            L28 81Z" fill="url(#enclaveBlue)" stroke="#004F8B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner lower-right blue hexagon -->
  <path d="M78 68            L92 68            L100 81            L92 94            L78 94            L70 81Z" fill="url(#enclaveBlue)" stroke="#004F8B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Upper inner blue hexagon -->
  <path d="M57 28            L71 28            L79 41            L71 54            L57 54            L49 41Z" fill="url(#enclaveBlue)" stroke="#004F8B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lower inner blue hexagon -->
  <path d="M57 74            L71 74            L79 87            L71 100            L57 100            L49 87Z" fill="url(#enclaveBlue)" stroke="#004F8B" stroke-width="3" stroke-linejoin="round"/>

  <!-- Central cyan enclave hexagon -->
  <path d="M57 51            L71 51            L79 64            L71 77            L57 77            L49 64Z" fill="url(#enclaveCyan)" stroke="#087FAE" stroke-width="3.3" stroke-linejoin="round"/>

  <!-- Hand-drawn cell highlights -->
  <g stroke="#D6FAFF" stroke-width="2" stroke-linecap="round" fill="none" opacity=".85">

    <path d="M55 18 L59 12 L68 12"/>
    <path d="M34 34 L39 27 L47 27"/>
    <path d="M76 34 L81 27 L89 27"/>
    <path d="M12 63 L17 56 L25 56"/>
    <path d="M98 63 L103 56 L111 56"/>
    <path d="M34 94 L39 87 L47 87"/>
    <path d="M76 94 L81 87 L89 87"/>
    <path d="M55 108 L59 101 L68 101"/>

  </g>

  <!-- Inner blue cell marker reflections -->
  <g stroke="#66B8EF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".75">

    <path d="M34 55 L39 49"/>
    <path d="M76 55 L81 49"/>
    <path d="M34 80 L39 74"/>
    <path d="M76 80 L81 74"/>
    <path d="M55 40 L60 34"/>
    <path d="M55 86 L60 80"/>

  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4C542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Small trust sparkle -->
    <path d="M108 13 L108 22"/>
    <path d="M104 17 L113 17"/>

    <!-- Left emphasis -->
    <path d="M8 32 L13 29"/>
    <path d="M6 39 L12 38"/>

    <!-- Lower-right emphasis -->
    <path d="M108 108 L113 104"/>
    <path d="M113 114 L119 110"/>

  </g>

  <!-- Subtle handwritten-style sketch marks -->
  <g stroke="#0078D4" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".65">

    <path d="M20 106 Q25 111 31 113"/>
    <path d="M94 116 Q100 113 104 109"/>
    <path d="M17 19 Q22 15 28 14"/>

  </g>

</svg>

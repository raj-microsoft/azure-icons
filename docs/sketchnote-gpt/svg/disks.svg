<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Disks (sketch)</title>
  
  <desc>Two vertically stacked Azure managed disk platters, blue above green, with hand-drawn elliptical outlines, central spindle details and subtle yellow marker accents.</desc>

  <defs>
    <linearGradient id="diskBlue" x1="32" y1="18" x2="96" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0078D4"/>
      <stop offset=".48" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#1782DA"/>
    </linearGradient>
    <linearGradient id="diskGreen" x1="27" y1="77" x2="100" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8BCC42"/>
      <stop offset=".55" stop-color="#76BC2D"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Lower green disk: side wall -->
  <path d="M12 83            C12 95 36 103 64 103            C92 103 116 95 116 83            L116 97            C115 109 92 117 64 117            C36 117 13 109 12 97Z" fill="#5E9624" stroke="#46771B" stroke-width="3.2"/>

  <!-- Lower green disk: upper platter -->
  <path d="M116 83            C116 95 92 103 64 103            C36 103 12 95 12 83            C12 71 36 63 64 63            C92 63 116 71 116 83Z" fill="url(#diskGreen)" stroke="#4E8722" stroke-width="3.5"/>

  <!-- Green disk spindle -->
  <path d="M47 82            C47 78 55 76 65 76            C75 76 82 79 82 83            C82 87 75 89 65 89            C55 89 47 86 47 82Z" fill="#5E9624" stroke="#477B20" stroke-width="2.1"/>

  <!-- Lower disk hand-drawn highlights -->
  <path d="M19 80 Q32 70 49 69            M21 101 Q39 111 61 111" stroke="#B3E77A" stroke-width="2.4" opacity=".8"/>

  <!-- Upper blue disk: side wall -->
  <path d="M12 36            C12 48 36 56 64 56            C92 56 116 48 116 36            L116 49            C115 61 92 69 64 69            C36 69 13 61 12 49Z" fill="#0078D4" stroke="#075A9C" stroke-width="3.2"/>

  <!-- Blue disk: upper platter -->
  <path d="M116 36            C116 48 92 56 64 56            C36 56 12 48 12 36            C12 24 36 16 64 16            C92 16 116 24 116 36Z" fill="url(#diskBlue)" stroke="#075A9C" stroke-width="3.5"/>

  <!-- Central spindle -->
  <path d="M47 35            C47 31 55 29 65 29            C75 29 82 32 82 36            C82 40 75 42 65 42            C55 42 47 39 47 35Z" fill="#005BA1" stroke="#064B86" stroke-width="2.2"/>

  <!-- Loose hand-drawn marker highlights -->
  <path d="M20 32 Q34 23 51 22            M80 23 Q99 27 108 33" stroke="#B6E2FF" stroke-width="2.6" opacity=".85"/>

  <path d="M19 51 Q36 62 61 63            M92 61 Q107 57 111 52" stroke="#79C9FC" stroke-width="2" opacity=".75"/>

  <!-- Platter separation and rim sketch strokes -->
  <g stroke="#075A9C" stroke-width="1.8" opacity=".7">
    <path d="M16 44 Q24 50 33 53"/>
    <path d="M97 55 Q108 52 113 47"/>
  </g>

  <g stroke="#4E8722" stroke-width="1.8" opacity=".75">
    <path d="M17 91 Q26 98 37 101"/>
    <path d="M92 108 Q107 104 113 98"/>
  </g>

  <!-- Small hand-drawn accent marks -->
  <g stroke="#0078D4" stroke-width="2.3">
    <path d="M5 60 L10 63"/>
    <path d="M5 69 L10 70"/>
    <path d="M119 72 L124 69"/>
  </g>

  <!-- Restrained yellow marker emphasis -->
  <g stroke="#F4C542" stroke-width="2.8">
    <path d="M100 12 L104 5"/>
    <path d="M112 17 L119 12"/>
    <path d="M117 26 L125 24"/>
  </g>

  <!-- Tiny hand-drawn sparkle -->
  <path d="M20 8            L22 12            L27 14            L22 16            L20 21            L18 16            L13 14            L18 12Z" fill="#F4C542" stroke="#C48B17" stroke-width="1.3"/>
</svg>

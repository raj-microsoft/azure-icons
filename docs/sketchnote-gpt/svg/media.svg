<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Media (sketch)</title>
  
  <desc>Six interlocking blue aperture blades surrounding a luminous cyan isometric media cube, with uneven marker outlines and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="darkBlue" x1="25" y1="18" x2="105" y2="109" gradientUnits="userSpaceOnUse">
      <stop stop-color="#005BA1"/>
      <stop offset=".45" stop-color="#004E8F"/>
      <stop offset="1" stop-color="#003067"/>
    </linearGradient>
    <linearGradient id="lightBlue" x1="25" y1="20" x2="106" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83B9F9"/>
      <stop offset="1" stop-color="#5EA0EF"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="33" y1="48" x2="64" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C3F1FF"/>
      <stop offset=".5" stop-color="#99EDFF"/>
      <stop offset="1" stop-color="#50E6FF"/>
    </linearGradient>
  </defs>

  <!-- Six hand-drawn aperture blades -->
  <path d="M19 22            C37 6 66 5 86 17            Q102 26 111 43            L94 53            L65 36            C46 25 30 24 19 22Z" fill="url(#darkBlue)" stroke="#003067" stroke-width="3.3"/>

  <path d="M86 17            C111 24 123 42 124 63            Q124 79 117 93            L96 87            L96 46            Q94 27 86 17Z" fill="#0078D4" stroke="#005BA1" stroke-width="3.3"/>

  <path d="M117 49            C125 66 120 92 105 108            Q90 124 64 124            L64 100            L95 82            Q111 72 117 49Z" fill="url(#lightBlue)" stroke="#286FAF" stroke-width="3.3"/>

  <path d="M109 105            C90 123 62 127 41 116            Q27 109 19 95            L36 85            L65 102            Q86 115 109 105Z" fill="url(#darkBlue)" stroke="#003067" stroke-width="3.3"/>

  <path d="M41 116            C18 109 5 88 5 65            Q5 50 12 37            L32 43            L32 84            Q32 105 41 116Z" fill="#0078D4" stroke="#005BA1" stroke-width="3.3"/>

  <path d="M12 79            C3 57 10 34 27 18            Q41 5 64 5            L64 27            L34 45            Q17 56 12 79Z" fill="url(#lightBlue)" stroke="#286FAF" stroke-width="3.3"/>

  <!-- Subtle sketchnote blade highlights -->
  <path d="M27 19 Q49 10 70 17            M103 34 Q116 49 116 65            M109 91 Q96 108 79 114" stroke="#B8D9FF" stroke-width="2.4" opacity=".8"/>

  <path d="M26 105 Q13 91 12 75            M16 48 Q23 31 40 21" stroke="#50C7E8" stroke-width="2.3" opacity=".8"/>

  <!-- Central luminous media cube -->
  <path d="M64 27            L96 45            L64 64            L32 45Z" fill="#C3F1FF" stroke="#1688B8" stroke-width="3.4"/>

  <path d="M32 45            L64 64            L64 101            L32 82Z" fill="url(#cubeLeft)" stroke="#1688B8" stroke-width="3.4"/>

  <path d="M64 64            L96 45            L96 82            L64 101Z" fill="#50E6FF" stroke="#1688B8" stroke-width="3.4"/>

  <!-- Hand-drawn cube edge highlights -->
  <path d="M42 44 L64 32 L85 44" stroke="#FFFFFF" stroke-width="2.6" opacity=".85"/>

  <path d="M38 55 L38 77            M70 69 L89 58" stroke="#E5FAFF" stroke-width="2.5"/>

  <path d="M64 70 L64 94" stroke="#129DC5" stroke-width="2.2"/>

  <!-- Subtle media play motif -->
  <path d="M73 72            L73 85            L84 72Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.8"/>

  <!-- Restrained yellow hand-drawn accents -->
  <path d="M106 10 L110 4            M115 16 L122 13            M116 25 L124 27" stroke="#FFCC4D" stroke-width="3"/>

  <!-- Azure-blue marker emphasis -->
  <path d="M7 113 L14 109            M15 121 L23 119" stroke="#0078D4" stroke-width="2.6"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Media (sketch)</title>
  
  <desc>Hand-drawn Azure Media icon with six interlocking blue aperture blades surrounding a plain three-faced cyan isometric cube. Flat fills, gently uneven dark marker contours, and a transparent background.</desc>

  <!-- Upper dark-blue aperture blade -->
  <path d="M19 22            C35 8 64 5 85 16            Q103 25 113 43            L95 53            L64 36            Q40 23 19 22 Z" fill="#005BA1" stroke="#243447" stroke-width="3.1"/>

  <!-- Upper-right Azure-blue aperture blade -->
  <path d="M85 16            C108 23 122 41 124 62            Q126 80 117 94            L96 87            L96 46            Q94 28 85 16 Z" fill="#0078D4" stroke="#243447" stroke-width="3.2"/>

  <!-- Lower-right light-blue aperture blade -->
  <path d="M117 49            C125 67 120 91 105 108            Q89 124 64 124            L64 100            L95 82            Q110 72 117 49 Z" fill="#5EA0EF" stroke="#243447" stroke-width="3"/>

  <!-- Lower dark-blue aperture blade -->
  <path d="M109 105            C90 123 63 126 41 116            Q26 109 19 95            L36 85            L65 102            Q86 115 109 105 Z" fill="#003067" stroke="#243447" stroke-width="3.2"/>

  <!-- Lower-left Azure-blue aperture blade -->
  <path d="M41 116            C18 109 5 88 5 65            Q5 49 12 37            L32 43            L32 84            Q32 105 41 116 Z" fill="#0078D4" stroke="#243447" stroke-width="3.1"/>

  <!-- Upper-left light-blue aperture blade -->
  <path d="M12 79            C3 57 10 34 27 18            Q42 5 64 5            L64 27            L34 45            Q17 56 12 79 Z" fill="#5EA0EF" stroke="#243447" stroke-width="3.2"/>

  <!-- Central cube top face -->
  <path d="M64 27            Q65 27 67 29            L96 45            L64 64            L32 45            L61 28            Q63 27 64 27 Z" fill="#C3F1FF" stroke="#243447" stroke-width="3.2"/>

  <!-- Central cube left face -->
  <path d="M32 45            Q47 54 64 64            L64 101            Q47 92 32 82            Z" fill="#9CEBFF" stroke="#243447" stroke-width="3.2"/>

  <!-- Central cube right face: completely plain -->
  <path d="M64 64            L96 45            L96 82            Q80 92 64 101            Z" fill="#50E6FF" stroke="#243447" stroke-width="3.2"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Web Application Firewall Policies(WAF) (sketch)</title>
  
  <desc>Azure-blue network globe with connected white nodes, protected by a red brick firewall, illustrated with irregular marker outlines.</desc>

  <defs>
    <radialGradient id="globeBlue" cx="43%" cy="34%" r="75%">
      <stop offset="0.18" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>
    <linearGradient id="nodeWhite" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FCFCFC"/>
      <stop offset="1" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>

  <!-- Azure network globe -->
  <path d="M64 7            C93 6 115 28 117 57            C119 79 108 96 91 107            C72 119 45 115 27 101            C10 88 5 64 12 43            C20 21 39 8 64 7Z" fill="url(#globeBlue)" stroke="#15549A" stroke-width="3.5"/>

  <!-- Loose hand-drawn globe highlight -->
  <path d="M21 38            Q33 16 59 14            M91 17 Q108 29 111 45" stroke="#9CEBFF" stroke-width="2.5" opacity=".8"/>

  <!-- Network connections -->
  <g stroke="#83B9F9" stroke-width="5">
    <path d="M29 27 Q32 40 39 52"/>
    <path d="M17 71 Q20 59 29 54"/>
    <path d="M39 52 Q53 32 79 28"/>
    <path d="M39 52 Q53 74 74 88"/>
    <path d="M60 12 Q67 30 91 47"/>
    <path d="M79 28 Q92 25 103 29"/>
    <path d="M91 47 Q103 55 108 68"/>
    <path d="M74 88 Q92 95 106 89"/>
  </g>

  <!-- Network nodes -->
  <path d="M39 35            C49 35 56 43 56 53            C56 63 48 71 38 71            C28 71 20 63 20 53            C20 43 29 35 39 35Z" fill="url(#nodeWhite)" stroke="#7CADD1" stroke-width="2.7"/>

  <path d="M91 36            C99 36 105 42 105 49            C105 57 99 62 91 62            C83 62 78 56 78 49            C78 42 84 36 91 36Z" fill="#F2F2F2" stroke="#7CADD1" stroke-width="2.5"/>

  <path d="M74 76            C82 76 87 82 87 89            C87 97 81 102 74 102            C66 102 61 96 61 89            C61 81 67 76 74 76Z" fill="#F2F2F2" stroke="#7CADD1" stroke-width="2.5"/>

  <!-- Node sketch highlights -->
  <path d="M30 46 Q34 41 40 42            M85 45 Q88 42 92 43            M68 85 Q71 82 75 83" stroke="#FFFFFF" stroke-width="2.4"/>

  <!-- Firewall body -->
  <path d="M38 75            Q38 72 42 72            L121 73            Q124 73 124 77            L124 120            Q124 123 121 123            L42 123            Q38 123 38 119Z" fill="#821010" stroke="#5E1010" stroke-width="3.5"/>

  <!-- Top row of firewall bricks -->
  <path d="M43 78 L65 78 L65 89 L43 89Z" fill="#E62323" stroke="#A51919" stroke-width="1.7"/>
  <path d="M69 78 L92 78 L92 89 L69 89Z" fill="#FF7381" stroke="#B92C3D" stroke-width="1.7"/>
  <path d="M96 78 L119 78 L119 89 L96 89Z" fill="#E62323" stroke="#A51919" stroke-width="1.7"/>

  <!-- Middle row, staggered bricks -->
  <path d="M43 93 L53 93 L53 105 L43 105Z" fill="#E62323" stroke="#A51919" stroke-width="1.7"/>
  <path d="M57 93 L80 93 L80 105 L57 105Z" fill="#FF7381" stroke="#B92C3D" stroke-width="1.7"/>
  <path d="M84 93 L107 93 L107 105 L84 105Z" fill="#E62323" stroke="#A51919" stroke-width="1.7"/>
  <path d="M111 93 L119 93 L119 105 L111 105Z" fill="#FF7381" stroke="#B92C3D" stroke-width="1.7"/>

  <!-- Bottom row -->
  <path d="M43 109 L65 109 L65 119 L43 119Z" fill="#E62323" stroke="#A51919" stroke-width="1.7"/>
  <path d="M69 109 L92 109 L92 119 L69 119Z" fill="#FF7381" stroke="#B92C3D" stroke-width="1.7"/>
  <path d="M96 109 L119 109 L119 119 L96 119Z" fill="#E62323" stroke="#A51919" stroke-width="1.7"/>

  <!-- Hand-drawn brick highlights -->
  <g stroke="#FFB0B6" stroke-width="1.7" opacity=".75">
    <path d="M47 81 L59 81"/>
    <path d="M73 81 L85 81"/>
    <path d="M100 81 L112 81"/>
    <path d="M61 96 L73 96"/>
    <path d="M88 96 L100 96"/>
    <path d="M47 112 L59 112"/>
    <path d="M73 112 L85 112"/>
    <path d="M100 112 L112 112"/>
  </g>

  <!-- Subtle yellow sketchnote accents -->
  <path d="M113 59 L118 55            M116 65 L123 64            M108 60 L109 54" stroke="#FFD34D" stroke-width="2.8"/>

  <!-- Small annotation strokes -->
  <path d="M13 105 L19 100            M17 111 L24 108" stroke="#FFD34D" stroke-width="2.5"/>

  <!-- Firewall base underline -->
  <path d="M45 126 Q81 127 119 125" stroke="#E62323" stroke-width="1.8" opacity=".65"/>
</svg>

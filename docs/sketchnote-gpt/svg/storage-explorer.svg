<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"><title>Storage Explorer (sketch)</title>
  
  <desc>Stepped storage hierarchy with three upper blue tiles and five lower square data cells arranged in the official stepped grid.</desc>

  <!-- Stepped background structure -->
  <path d="M16 48            Q16 46 19 46            L79 46            Q82 46 82 49            L82 66            Q82 68 85 68            L111 68            Q114 68 114 72            L114 109            Q114 113 110 113            L18 113            Q15 113 15 110            L15 53            Q15 49 16 48 Z" fill="#E6E6E6" stroke="#263F50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upper stepped edge -->
  <path d="M15 69            L39 69            L39 48            L61 48            L61 27            L96 27" stroke="#66849A" stroke-width="1.5" stroke-linecap="round" opacity=".55"/>

  <!-- Top-left light blue square -->
  <rect x="9" y="7" width="36" height="25" rx="3" fill="#83B9F9" stroke="#263F50" stroke-width="3" stroke-linejoin="round"/>
  <path d="M16 15 Q26 12 38 15" stroke="#DDF1FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Middle-left blue square -->
  <rect x="9" y="48" width="36" height="25" rx="3" fill="#0078D4" stroke="#263F50" stroke-width="3" stroke-linejoin="round"/>
  <path d="M16 56 Q27 53 38 56" stroke="#83B9F9" stroke-width="2" stroke-linecap="round"/>

  <!-- Upper-middle blue square -->
  <rect x="43" y="27" width="36" height="25" rx="3" fill="#5EA0EF" stroke="#263F50" stroke-width="3" stroke-linejoin="round"/>
  <path d="M50 35 Q62 32 74 35" stroke="#DDF1FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Stepped data grid: five distinct square cells -->
  <g stroke="#263F50" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round">

    <!-- Right column, top white cell -->
    <rect x="84" y="72" width="28" height="18" rx="2.5" fill="#FFFFFF"/>

    <!-- Right column, bottom blue cell -->
    <rect x="84" y="96" width="28" height="18" rx="2.5" fill="#005BA1"/>

    <!-- Middle column, upper white cell -->
    <rect x="50" y="96" width="28" height="18" rx="2.5" fill="#FFFFFF"/>

    <!-- Left column, bottom blue cell -->
    <rect x="16" y="96" width="28" height="18" rx="2.5" fill="#005BA1"/>

    <!-- Middle column, upper white cell -->
    <rect x="50" y="72" width="28" height="18" rx="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Minimal cell markings -->
  <g stroke="#83B9F9" stroke-width="1.8" stroke-linecap="round">
    <path d="M90 80 L105 80 M90 84 L101 84"/>
    <path d="M56 103 L72 103 M56 108 L68 108"/>
  </g>

  <g stroke="#DDF1FF" stroke-width="1.8" stroke-linecap="round">
    <path d="M22 103 L38 103 M22 108 L34 108"/>
    <path d="M90 103 L105 103 M90 108 L101 108"/>
  </g>

  <!-- Small yellow sketchnote accents -->
  <path d="M91 27 L96 22            M101 33 L107 31            M87 37 L91 35            M37 82 L41 78" stroke="#FFB900" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Hand-drawn finishing marks -->
  <path d="M13 78 Q11 87 14 92            M117 76 Q119 84 117 91            M20 119 Q47 122 76 119" stroke="#0078D4" stroke-width="2" stroke-linecap="round" opacity=".8"/>
</svg>

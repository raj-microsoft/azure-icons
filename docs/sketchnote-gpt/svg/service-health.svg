<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Service Health (sketch)</title>
  
  <desc>Azure-blue hand-drawn heart with a white heartbeat waveform, preserving the original Service Health icon's shape, colors, and symbolism.</desc>

  <defs>
    <linearGradient id="heartBlue" x1="64" y1="8" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#54AEF0"/>
      <stop offset=".44" stop-color="#379CE5"/>
      <stop offset=".78" stop-color="#218DDC"/>
      <stop offset="1" stop-color="#1988D9"/>
    </linearGradient>
  </defs>

  <!-- Main hand-drawn heart silhouette -->
  <path d="M64 119            C47 106 28 91 17 77            C8 66 5 55 6 43            C7 24 17 10 33 8            C47 6 58 14 64 28            C70 14 81 6 95 8            C112 10 121 24 122 43            C123 56 120 66 111 78            C100 92 81 106 64 119 Z" fill="url(#heartBlue)" stroke="#176EAC" stroke-width="3.5"/>

  <!-- Uneven secondary marker outline -->
  <path d="M11 41            C13 23 23 13 35 12            C48 11 58 20 63 34            M69 29            C76 16 85 11 96 13            C109 15 117 27 118 43            M114 66            C106 82 87 99 67 115" stroke="#86CFFF" stroke-width="2.5" opacity=".8"/>

  <!-- Soft blue hand-drawn highlight -->
  <path d="M17 37            Q21 20 36 18            Q47 17 55 29" stroke="#B8E4FF" stroke-width="3" opacity=".7"/>

  <!-- White service-health heartbeat waveform -->
  <path d="M9 72            L24 72            L39 46            L54 91            L70 36            L85 77            L97 56            L119 56" stroke="#1479B9" stroke-width="12" opacity=".28"/>

  <path d="M9 72            L24 72            L39 46            L54 91            L70 36            L85 77            L97 56            L119 56" stroke="#FFFFFF" stroke-width="8.5"/>

  <!-- Slightly irregular marker reinforcement -->
  <path d="M14 69            L22 69            M37 51            L40 47            M52 84            L54 89            M68 43            L70 38            M84 72            L86 76            M100 53            L112 53" stroke="#EAF8FF" stroke-width="2" opacity=".9"/>

  <!-- Small marker highlight near the lower heart -->
  <path d="M55 105            Q60 109 64 112" stroke="#8ED4FF" stroke-width="2.3" opacity=".65"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M105 10 L110 4            M115 19 L123 16            M7 91 L3 96" stroke="#F4C542" stroke-width="3"/>

  <!-- Subtle hand-drawn motion details -->
  <path d="M18 99 Q23 105 29 108            M24 111 Q29 115 34 117" stroke="#1988D9" stroke-width="2" opacity=".55"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Compute Fleet (sketch)</title>
  
  <desc>Four staggered Azure compute panel surfaces with a dotted deployment guide, circular synchronization badge, and light-gray monitor pedestal at bottom-right. Flat fills and hand-drawn charcoal outlines.</desc>

  <!-- Dotted deployment guide -->
  <path d="M8 40 L8 34 Q8 31 12 29 L58 3 Q62 1 65 3" stroke="#0078D4" stroke-width="2.3" stroke-dasharray="4 5"/>
  <path d="M8 47 L8 83 M14 100 L22 96" stroke="#0078D4" stroke-width="2.1" stroke-dasharray="4 5"/>

  <!-- Rear monitor: dark outer panel -->
  <path d="M10 43 Q10 40 14 38            L69 7 Q73 5 75 8            L75 58 Q75 62 71 64            L16 96 Q11 99 11 94 Z" fill="#2A446F" stroke="#243447" stroke-width="3.4"/>

  <!-- Rear monitor: blue screen -->
  <path d="M15 43 L70 12 L70 58 L16 90 Z" fill="#155EA1" stroke="#243447" stroke-width="2.5"/>

  <!-- Middle monitor: dark outer edge -->
  <path d="M29 52 Q29 48 33 46            L88 15 Q93 12 95 16            L95 69 Q95 73 91 75            L36 107 Q31 110 30 105 Z" fill="#155EA1" stroke="#243447" stroke-width="3.5"/>

  <!-- Middle monitor: blue screen -->
  <path d="M34 52 Q34 49 38 47            L89 19 L89 68 L35 100 Z" fill="#238CD9" stroke="#243447" stroke-width="2.6"/>

  <!-- Front monitor: side thickness -->
  <path d="M49 63 Q49 59 53 57            L108 26 Q113 23 116 27            L120 30 L120 83            Q120 87 116 89            L61 120 Q56 123 53 119            L49 115 Z" fill="#46A0DE" stroke="#243447" stroke-width="3.5"/>

  <!-- Front monitor: light-blue display -->
  <path d="M54 65 Q54 61 58 59            L113 28 Q117 26 118 30            L118 82 Q118 86 114 88            L59 119 Q54 122 54 116 Z" fill="#8DC8E8" stroke="#243447" stroke-width="3.5"/>

  <!-- Synchronization badge -->
  <path d="M92 61            C98 60 102 65 101 73            C100 81 94 90 87 94            C79 99 72 97 71 90            C69 83 74 73 81 67" stroke="#243447" stroke-width="8"/>

  <path d="M92 61            C98 60 102 65 101 73            C100 81 94 90 87 94            C79 99 72 97 71 90            C69 83 74 73 81 67" stroke="#FFFFFF" stroke-width="5.2"/>

  <!-- Badge arrowhead -->
  <path d="M80 66 Q83 64 89 61 L87 72 Q84 69 80 66 Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.5"/>

  <!-- Circular badge center -->
  <path d="M80 76            C85 71 92 72 94 77            C96 83 91 90 85 92            C79 94 76 90 77 85            Q77 80 80 76 Z" fill="#0078D4" stroke="#243447" stroke-width="2.6"/>

  <path d="M82 78            C86 75 90 76 91 80            C92 84 88 88 84 89            C81 89 79 86 80 83            Q80 80 82 78 Z" fill="#50E6FF" stroke="#243447" stroke-width="2.1"/>

  <!-- Monitor pedestal: short diagonal gray stem -->
  <path d="M81 105            L87 102            L87 111            Q87 114 90 116            L101 122            L96 125            L86 119            Q81 116 81 111 Z" fill="#BEBFBE" stroke="#243447" stroke-width="2.1"/>

  <!-- Monitor pedestal: wide light-gray isometric foot -->
  <path d="M96 119            Q98 118 100 119            L118 129            L125 125            Q127 124 125 122            L108 112            Q106 111 104 112            Z" fill="#D9D9D6" stroke="#243447" stroke-width="2.2"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M24 21 Q28 17 33 16" stroke="#F4C542" stroke-width="2.7"/>
  <path d="M31 13 L35 15 L32 19" stroke="#F4C542" stroke-width="2.5"/>
  <path d="M101 102 Q108 99 112 95" stroke="#F4C542" stroke-width="2.5"/>
  <path d="M110 94 L114 94 L113 99" stroke="#F4C542" stroke-width="2.3"/>
</svg>

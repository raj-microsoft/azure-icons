<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke="#203746" stroke-linecap="round" stroke-linejoin="round"><title>Quickstart Center (sketch)</title>

  
  <desc>Hand-drawn sketchnote rocket with a broad yellow fuselage, blue pointed nose, two orange fins, a large orange flame, and one plain pale cream porthole.</desc>

  <!-- Broad orange flame / exhaust -->
  <path d="     M8 118     C12 102 24 88 38 75     L53 92     C42 101 27 112 11 120     Q7 121 8 118 Z" fill="#F17905" stroke="#203746" stroke-width="3.8"/>

  <!-- Left broad orange fin -->

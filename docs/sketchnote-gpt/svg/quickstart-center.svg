  <!-- Lower broad orange fin -->
  <path d="     M55 96     C60 103 64 111 65 119     C71 116 76 111 79 105     C83 96 82 86 77 78     Z" fill="#F78D1E" stroke="#203746" stroke-width="3.8"/>

  <!-- Main broad yellow fuselage -->
  <path d="     M36 74     C50 57 66 42 83 28     C95 18 107 11 118 8     Q120 8 120 11     C117 22 109 34 98 46     C84 63 68 79 52 92     Z" fill="#FFCA00" stroke="#203746" stroke-width="3.8"/>

  <!-- Blue pointed nose -->
  <path d="     M85 28     C95 20 106 13 118 8     C117 16 113 24 108 32     L97 43     Z" fill="#0078D4" stroke="#203746" stroke-width="3.8"/>

  <!-- Plain porthole: single pale cream circle only -->

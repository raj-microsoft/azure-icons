<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>App Service Certificates (sketch)</title>
  

  <!-- Orange certificate frame -->
  <path d="M9 10            Q9 6 14 6            L114 7            Q120 7 120 13            L119 94            Q119 99 114 99            L14 98            Q9 98 9 93 Z" fill="#F8911E" stroke="#203746" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- White certificate paper -->
  <path d="M17 16            Q17 14 20 14            L108 15            Q112 15 112 19            L111 88            Q111 91 108 91            L20 90            Q17 90 17 87 Z" fill="#FFFFFF" stroke="#203746" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Certificate heading -->
  <path d="M35 36 Q68 35 99 36" stroke="#D15900" stroke-width="4" stroke-linecap="round"/>

  <!-- Certificate text lines -->
  <path d="M57 52 Q79 51 101 52            M57 64 Q80 63 100 64            M57 76 Q74 75 87 76" stroke="#D15900" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Red ribbon -->
  <path d="M21 89            L19 120            Q19 124 23 121            L34 112            L45 122            Q49 125 49 120            L46 89 Z" fill="#B31B1B" stroke="#203746" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Outer red certification seal -->
  <path d="M34 59            C45 59 54 68 54 79            C54 90 45 99 34 99            C23 99 14 90 14 79            C14 68 23 59 34 59 Z" fill="#E62323" stroke="#203746" stroke-width="3.5"/>

  <!-- Plain gold certificate seal -->
  <ellipse cx="34" cy="79.5" rx="13" ry="13" fill="#FFB34D" stroke="#203746" stroke-width="2.8"/>

</svg>

  <!-- Right curly brace -->
  <path d="M82 27            C90 27 93 31 93 39            L93 53            C93 60 96 63 101 64            C96 65 93 68 93 75            L93 90            C93 98 90 101 82 101" stroke="#FFFFFF" stroke-width="7.5"/>

  <!-- Right brace hand-drawn highlight -->

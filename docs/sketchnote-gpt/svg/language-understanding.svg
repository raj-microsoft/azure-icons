<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Language Understanding (sketch)</title>
  
  <desc>Hand-drawn Azure-blue circular badge containing two prominent white curly braces, preserving the original Language Understanding icon.</desc>

  <defs>
    <linearGradient id="languageBlue" x1="64" y1="7" x2="64" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".48" stop-color="#348EE3"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn circular Azure badge -->
  <path d="M64 5            C96 4 122 30 123 62            C125 95 99 121 66 123            C33 125 6 100 5 67            C3 34 29 7 64 5 Z" fill="#0078D4" stroke="#005A9E" stroke-width="3.5"/>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Translator Text (sketch)</title>
  
  <desc>Hand-drawn Azure Translator icon with Japanese hiragana あ, Latin lowercase a, and bidirectional translation arrows.</desc>

  <!-- Azure-blue translation tile -->
  <path d="M17 9 Q11 9 11 16 L10 108 Q10 117 19 118 L108 119 Q117 118 118 109 L118 19 Q117 10 108 10Z" fill="#1686D9" stroke="#123E60" stroke-width="3.8"/>

  <!-- Irregular dark marker retrace -->
  <path d="M18 14 Q14 18 15 27 M113 25 L113 102 Q112 113 104 114 M22 114 L42 115" stroke="#123E60" stroke-width="1.5" opacity=".5"/>

  <!-- Japanese hiragana あ: top bar -->
  <path d="M20 30 Q37 29 55 27" stroke="#123E60" stroke-width="7"/>
  <path d="M20 30 Q37 29 55 27" stroke="#FFFFFF" stroke-width="4.2"/>

  <!-- Japanese あ: central vertical curve -->
  <path d="M37 18 Q34 35 35 49 Q36 56 42 62" stroke="#123E60" stroke-width="7"/>
  <path d="M37 18 Q34 35 35 49 Q36 56 42 62" stroke="#FFFFFF" stroke-width="4.2"/>

  <!-- Japanese あ: lower rounded loop -->
  <path d="M35 41 C25 42 19 49 20 56 C21 63 32 64 41 57 C49 51 54 41 54 35" stroke="#123E60" stroke-width="7"/>
  <path d="M35 41 C25 42 19 49 20 56 C21 63 32 64 41 57 C49 51 54 41 54 35" stroke="#FFFFFF" stroke-width="4.2"/>

  <!-- Japanese あ: terminal sweep -->
  <path d="M44 40 C54 40 60 46 60 53 C60 60 55 65 48 66" stroke="#123E60" stroke-width="7"/>
  <path d="M44 40 C54 40 60 46 60 53 C60 60 55 65 48 66" stroke="#FFFFFF" stroke-width="4.2"/>

  <!-- Upper clockwise translation arrow -->
  <path d="M70 23 C88 22 101 32 101 48 L101 54" stroke="#123E60" stroke-width="7"/>
  <path d="M70 23 C88 22 101 32 101 48 L101 54" stroke="#FFFFFF" stroke-width="4.4"/>

  <path d="M91 49 L101 61 L111 49" stroke="#123E60" stroke-width="7"/>
  <path d="M91 49 L101 61 L111 49" stroke="#FFFFFF" stroke-width="4.4"/>

  <!-- Lower counterclockwise translation arrow -->
  <path d="M59 103 C42 105 28 95 28 81 L28 75" stroke="#123E60" stroke-width="7"/>
  <path d="M59 103 C42 105 28 95 28 81 L28 75" stroke="#FFFFFF" stroke-width="4.4"/>

  <path d="M18 80 L28 68 L38 80" stroke="#123E60" stroke-width="7"/>
  <path d="M18 80 L28 68 L38 80" stroke="#FFFFFF" stroke-width="4.4"/>

  <!-- Latin lowercase a: white letter with irregular marker edging -->
  <path d="M99 83 Q93 78 84 80 C74 81 70 88 70 96 C70 104 76 110 85 109 Q94 108 99 99" stroke="#123E60" stroke-width="9"/>
  <path d="M99 83 Q93 78 84 80 C74 81 70 88 70 96 C70 104 76 110 85 109 Q94 108 99 99" stroke="#FFFFFF" stroke-width="5.5"/>

  <!-- Latin a: upright right stem -->
  <path d="M100 81 Q99 94 100 108" stroke="#123E60" stroke-width="9"/>
  <path d="M100 81 Q99 94 100 108" stroke="#FFFFFF" stroke-width="5.5"/>

  <!-- Latin a: inner counter remains open and blue -->
  <path d="M89 87 C83 84 77 89 77 96 C77 102 83 105 89 101" stroke="#FFFFFF" stroke-width="2.1"/>

  <!-- Restrained yellow marker accents -->
  <path d="M105 31 L110 27 M106 111 L111 107 M16 101 L20 98" stroke="#FFCA28" stroke-width="2.8"/>

  <!-- Small external sketch ticks -->
  <path d="M9 43 L5 40 M119 82 L123 79" stroke="#123E60" stroke-width="1.7" opacity=".55"/>
</svg>

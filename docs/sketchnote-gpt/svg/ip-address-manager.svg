<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>IP Address manager (sketch)</title>
  
  <desc>Azure-blue IP address management panel with three network address indicators and an overlapping blue settings gear, illustrated with uneven marker outlines and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="panelCyan" x1="15" y1="32" x2="95" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D4F5"/>
      <stop offset=".55" stop-color="#32CAEA"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="gearBlue" x1="80" y1="68" x2="117" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Main IP address management panel -->
  <path d="M10 9            Q10 6 15 6            L105 7            Q110 7 110 12            L110 87            Q110 92 105 92            L15 91            Q10 91 10 86            Z" fill="url(#panelCyan)" stroke="#087C9C" stroke-width="3.5"/>

  <!-- Azure-blue header -->
  <path d="M10 12            Q10 7 15 7            L105 7            Q110 7 110 12            L110 30            L10 30            Z" fill="#0078D4" stroke="#075A9C" stroke-width="3.2"/>

  <!-- Hand-drawn header highlight -->
  <path d="M17 13 L100 13" stroke="#5EA0EF" stroke-width="2.2" opacity=".85"/>

  <!-- Header interface details -->
  <path d="M19 21 L29 21            M35 21 L42 21" stroke="#D2EBFF" stroke-width="2.8"/>

  <!-- Three IP address indicators -->
  <path d="M30 48            C35 46 40 50 40 55            C40 61 35 65 30 64            C24 64 21 59 22 54            C23 50 26 48 30 48Z" fill="#0078D4" stroke="#075A9C" stroke-width="2.7"/>

  <path d="M58 48            C63 46 68 50 68 55            C68 61 63 65 58 64            C52 64 49 59 50 54            C51 50 54 48 58 48Z" fill="#0078D4" stroke="#075A9C" stroke-width="2.7"/>

  <path d="M86 48            C91 46 96 50 96 55            C96 61 91 65 86 64            C80 64 77 59 78 54            C79 50 82 48 86 48Z" fill="#0078D4" stroke="#075A9C" stroke-width="2.7"/>

  <!-- Small hand-drawn indicator highlights -->
  <path d="M27 52 L30 51            M55 52 L58 51            M83 52 L86 51" stroke="#B9EDFF" stroke-width="2.2"/>

  <!-- Network relationship sketch -->
  <path d="M30 70 Q44 73 58 70            Q72 73 86 70" stroke="#0078D4" stroke-width="2.3" stroke-dasharray="4 5" opacity=".75"/>

  <!-- Panel marker details -->
  <path d="M19 79 L40 79            M19 84 L34 84" stroke="#087C9C" stroke-width="2.1" opacity=".65"/>

  <!-- Settings gear: explicit editable vector outline -->
  <path d="M97 67            L104 67            L107 75            Q110 76 113 77            L121 73            L127 79            L123 87            Q125 90 125 93            L133 96            L133 104            L125 107            Q124 110 123 112            L127 120            L121 126            L113 122            Q110 124 107 125            L104 133            L96 133            L93 125            Q90 124 87 122            L79 126            L73 120            L77 112            Q75 109 74 107            L66 104            L66 96            L74 93            Q75 90 77 87            L73 79            L79 73            L87 77            Q90 75 93 75            Z" transform="translate(1 2) translate(100 100) scale(.76) translate(-100 -100)" fill="url(#gearBlue)" stroke="#075A9C" stroke-width="4.5"/>

  <!-- Gear center -->
  <path d="M101 88            C109 88 115 94 115 101            C115 109 109 115 101 115            C93 115 87 109 87 101            C87 94 93 88 101 88Z" transform="translate(1 2) translate(100 100) scale(.76) translate(-100 -100)" fill="#FFFFFF" stroke="#075A9C" stroke-width="4.2"/>

  <!-- Inner gear opening -->
  <path d="M99 96 Q104 94 107 99            Q109 104 104 107            Q99 109 96 104            Q94 99 99 96Z" transform="translate(1 2) translate(100 100) scale(.76) translate(-100 -100)" fill="#D2EBFF" stroke="#5EA0EF" stroke-width="2.5"/>

  <!-- Sketchnote marker highlights -->
  <path d="M82 83 L87 79            M113 85 L117 89            M86 115 L90 119" stroke="#B9DDFF" stroke-width="2.4" opacity=".85"/>

  <!-- Restrained yellow emphasis strokes -->
  <path d="M112 57 L116 51            M118 63 L125 60            M69 112 L65 118" stroke="#F7C948" stroke-width="3.1"/>

  <!-- Loose hand-drawn finishing marks -->
  <path d="M16 96 L23 99            M29 96 L34 99" stroke="#32BEDD" stroke-width="2.1"/>
</svg>

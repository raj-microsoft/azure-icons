<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Genomics Accounts (sketch)</title>
  
  <desc>Intertwining Azure-blue and cyan DNA strands with horizontal genetic rungs, flat fills, uneven charcoal marker outlines, and no directional arrows or decorative objects.</desc>

  <!-- Upper DNA ladder rungs -->
  <g stroke="#203746" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43 12 Q64 13 85 12"/>
    <path d="M42 23 Q64 24 86 23"/>
    <path d="M45 34 Q64 35 83 34"/>
  </g>
  <g stroke="#0078D4" stroke-width="2.5" stroke-linecap="round">
    <path d="M43 12 Q64 13 85 12"/>
    <path d="M42 23 Q64 24 86 23"/>
    <path d="M45 34 Q64 35 83 34"/>
  </g>

  <!-- Middle DNA ladder rungs -->
  <g stroke="#203746" stroke-width="4.2" stroke-linecap="round">
    <path d="M43 52 Q64 53 85 52"/>
    <path d="M39 63 Q64 64 89 63"/>
    <path d="M39 74 Q64 75 89 74"/>
  </g>
  <g stroke="#32BEDD" stroke-width="2.5" stroke-linecap="round">
    <path d="M43 52 Q64 53 85 52"/>
    <path d="M39 63 Q64 64 89 63"/>
    <path d="M39 74 Q64 75 89 74"/>
  </g>

  <!-- Lower DNA ladder rungs -->
  <g stroke="#203746" stroke-width="4.2" stroke-linecap="round">
    <path d="M45 93 Q64 94 83 93"/>
    <path d="M42 104 Q64 105 86 104"/>
    <path d="M43 115 Q64 116 85 115"/>
  </g>
  <g stroke="#0078D4" stroke-width="2.5" stroke-linecap="round">
    <path d="M45 93 Q64 94 83 93"/>
    <path d="M42 104 Q64 105 86 104"/>
    <path d="M43 115 Q64 116 85 115"/>
  </g>

  <!-- Azure-blue DNA strand -->
  <path d="M38 5            C34 20 45 29 64 38            C82 47 91 55 91 64            C91 73 81 82 64 91            C46 100 35 109 38 123" stroke="#203746" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M38 5            C34 20 45 29 64 38            C82 47 91 55 91 64            C91 73 81 82 64 91            C46 100 35 109 38 123" stroke="#0078D4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cyan DNA strand -->
  <path d="M90 5            C94 20 83 29 64 38            C46 47 37 55 37 64            C37 73 47 82 64 91            C82 100 93 109 90 123" stroke="#203746" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M90 5            C94 20 83 29 64 38            C46 47 37 55 37 64            C37 73 47 82 64 91            C82 100 93 109 90 123" stroke="#32BEDD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle orange genetic crossing accent -->
  <path d="M55 85            Q59 88 64 91            Q69 94 74 97" stroke="#203746" stroke-width="5" stroke-linecap="round"/>

  <path d="M55 85            Q59 88 64 91            Q69 94 74 97" stroke="#F79A18" stroke-width="2.6" stroke-linecap="round"/>
</svg>

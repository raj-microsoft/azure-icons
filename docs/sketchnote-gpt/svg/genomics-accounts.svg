<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Genomics Accounts (sketch)</title>
  
  <desc>Hand-drawn DNA double helix with intertwining Azure-blue and cyan strands, uneven marker outlines, horizontal genetic rungs, and restrained orange accents.</desc>

  <defs>
    <linearGradient id="genBlue" x1="30" y1="12" x2="94" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#168EE0"/>
      <stop offset=".55" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005AAB"/>
    </linearGradient>
    <linearGradient id="genCyan" x1="90" y1="12" x2="32" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#61D8EA"/>
      <stop offset=".55" stop-color="#32BEDD"/>
      <stop offset="1" stop-color="#159DBE"/>
    </linearGradient>
    <linearGradient id="genOrange" x1="0" y1="0" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAA21D"/>
      <stop offset="1" stop-color="#EF7100"/>
    </linearGradient>
  </defs>

  <!-- DNA ladder: irregular hand-drawn connecting rungs -->
  <g stroke-width="3.5">
    <path d="M43 16 Q64 18 85 16" stroke="#0078D4"/>
    <path d="M40 27 Q64 29 88 27" stroke="#32BEDD"/>
    <path d="M47 39 Q64 41 81 39" stroke="#0078D4"/>
    <path d="M51 51 Q64 53 77 51" stroke="#32BEDD"/>
    <path d="M43 63 Q64 65 85 63" stroke="#0078D4"/>
    <path d="M39 75 Q64 77 89 75" stroke="#32BEDD"/>
    <path d="M47 87 Q64 89 81 87" stroke="#0078D4"/>
    <path d="M51 99 Q64 101 77 99" stroke="#32BEDD"/>
    <path d="M43 111 Q64 113 85 111" stroke="#0078D4"/>
  </g>

  <!-- First winding strand: deep Azure -->
  <path d="M38 9            C34 26 48 34 65 43            C81 52 91 59 91 65            C91 73 80 81 64 90            C47 99 35 108 38 119" stroke="#145B96" stroke-width="12"/>

  <path d="M38 9            C34 26 48 34 65 43            C81 52 91 59 91 65            C91 73 80 81 64 90            C47 99 35 108 38 119" stroke="url(#genBlue)" stroke-width="8"/>

  <!-- Second winding strand: bright cyan -->
  <path d="M90 9            C94 26 80 34 63 43            C47 52 37 59 37 65            C37 73 48 81 64 90            C81 99 93 108 90 119" stroke="#157D9F" stroke-width="12"/>

  <path d="M90 9            C94 26 80 34 63 43            C47 52 37 59 37 65            C37 73 48 81 64 90            C81 99 93 108 90 119" stroke="url(#genCyan)" stroke-width="8"/>

  <!-- Small sketch highlights on strands -->
  <g stroke="#FFFFFF" stroke-width="2" opacity=".55">
    <path d="M39 14 Q37 24 43 32"/>
    <path d="M88 14 Q90 25 84 32"/>
    <path d="M84 57 Q88 61 88 65"/>
    <path d="M40 61 Q39 65 42 70"/>
    <path d="M42 108 Q38 114 40 118"/>
    <path d="M86 108 Q90 114 88 118"/>
  </g>

  <!-- Hand-drawn genomic crossbars in foreground -->
  <g stroke="#F4FAFC" stroke-width="2.5" opacity=".9">
    <path d="M48 22 Q64 24 80 22"/>
    <path d="M53 45 Q64 47 75 45"/>
    <path d="M48 82 Q64 84 80 82"/>
    <path d="M51 105 Q64 107 77 105"/>
  </g>

  <!-- Restrained orange genomics accents -->
  <g stroke="url(#genOrange)" stroke-width="3">
    <path d="M20 24 L26 21"/>
    <path d="M19 32 L26 30"/>
    <path d="M103 93 L110 90"/>
    <path d="M104 101 L111 104"/>
  </g>

  <!-- Small hand-drawn annotation arrows -->
  <g stroke="#0078D4" stroke-width="2.2">
    <path d="M17 60 Q23 57 29 61"/>
    <path d="M25 56 L30 61 L24 65"/>
    <path d="M111 52 Q105 49 99 53"/>
    <path d="M104 48 L98 53 L104 57"/>
  </g>

  <!-- Molecular marker dots -->
  <g fill="#FAA21D" stroke="#D98412" stroke-width="1">
    <circle cx="18" cy="48" r="3"/>
    <circle cx="111" cy="78" r="3"/>
    <circle cx="28" cy="105" r="2.5"/>
  </g>

  <!-- Subtle sketchnote emphasis strokes -->
  <g stroke="#32BEDD" stroke-width="2" opacity=".75">
    <path d="M29 12 L25 8"/>
    <path d="M98 13 L103 9"/>
    <path d="M29 119 L24 123"/>
    <path d="M99 119 L104 123"/>
  </g>
</svg>

  <g stroke="#477D1D" stroke-width="2" opacity=".45">
    <path d="M18 36 L24 36"/>
    <path d="M57 36 L63 36"/>
    <path d="M95 36 L101 36"/>
    <path d="M18 74 L24 74"/>
    <path d="M57 74 L63 74"/>
    <path d="M95 74 L101 74"/>
    <path d="M18 110 L24 110"/>
    <path d="M57 110 L63 110"/>
    <path d="M95 110 L101 110"/>

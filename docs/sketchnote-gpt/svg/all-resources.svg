  <g stroke="#C5E99D" stroke-width="2.4" opacity=".75">
    <path d="M17 16 L36 16"/>
    <path d="M56 16 L75 16"/>
    <path d="M94 16 L111 16"/>
    <path d="M17 56 L36 56"/>
    <path d="M56 56 L75 56"/>
    <path d="M94 56 L111 56"/>
    <path d="M17 94 L36 94"/>
    <path d="M56 94 L75 94"/>
    <path d="M94 94 L111 94"/>
  </g>


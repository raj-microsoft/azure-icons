<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Windows Notification Services (sketch)</title>
  
  <desc>Azure-blue computer monitor with an overlapping golden-orange notification speech bubble, white message lines and a gray monitor stand.</desc>

  <defs>
    <linearGradient id="monitorBlue" x1="10" y1="28" x2="107" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".82" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#0069BC"/>
    </linearGradient>
    <linearGradient id="notificationGold" x1="44" y1="8" x2="112" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset=".21" stop-color="#FFB34D"/>
      <stop offset="1" stop-color="#FAA21D"/>
    </linearGradient>
    <linearGradient id="standGray" x1="52" y1="98" x2="58" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#707070"/>
      <stop offset="1" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>

  <!-- Azure monitor -->
  <path d="M10 30            Q10 26 14 26            L103 27            Q107 27 107 31            L107 95            Q107 99 103 99            L14 99            Q10 99 10 95Z" fill="url(#monitorBlue)" stroke="#15549A" stroke-width="3.5"/>

  <!-- Uneven hand-drawn monitor highlights -->
  <path d="M16 33 Q27 31 38 33            M16 39 L16 87            M19 93 Q35 95 48 93" stroke="#9CEBFF" stroke-width="2.3" opacity=".75"/>

  <!-- Monitor stand -->
  <path d="M45 99            L66 99            C66 108 67 115 73 117            Q78 119 78 124            L33 124            Q33 120 38 117            C44 115 45 108 45 99Z" fill="url(#standGray)" stroke="#777777" stroke-width="3"/>

  <path d="M39 120 Q54 117 72 120" stroke="#E5E5E5" stroke-width="2"/>

  <!-- Notification speech bubble -->
  <path d="M42 10            Q42 7 47 7            L119 8            Q123 8 123 13            L123 62            Q123 67 118 67            L94 67            L94 78            Q94 82 90 79            L72 67            L47 67            Q42 67 42 62Z" fill="url(#notificationGold)" stroke="#C87C18" stroke-width="3.5"/>

  <!-- Marker-style golden highlight -->
  <path d="M49 14 Q78 12 114 14            M48 20 L48 53" stroke="#FFE0A3" stroke-width="2.4" opacity=".8"/>

  <!-- Notification text, first line -->
  <path d="M60 31            Q76 30 91 31" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Notification text, second line -->
  <path d="M60 44            Q84 43 105 44" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Fine handwritten-style underline -->
  <path d="M63 52 Q83 54 100 52" stroke="#FFE5B5" stroke-width="1.8" opacity=".8"/>

  <!-- Small notification spark accents -->
  <path d="M113 77 L117 83            M120 74 L126 76            M110 84 L111 90" stroke="#FFD34D" stroke-width="2.8"/>

  <!-- Small Azure sketch accents -->
  <path d="M17 110 L23 106            M20 117 L27 114" stroke="#1490DF" stroke-width="2.3"/>

  <!-- Stand underline -->
  <path d="M35 127 Q56 125 76 127" stroke="#A2A2A2" stroke-width="1.6" opacity=".7"/>
</svg>

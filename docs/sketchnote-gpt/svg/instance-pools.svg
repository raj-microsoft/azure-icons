<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Instance Pools (sketch)</title>
  
  <desc>Three overlapping gray SQL instance panels with a blue SQL cloud, drawn using slightly irregular marker outlines.</desc>

  <defs>
    <linearGradient id="panel" x1="12" y1="31" x2="73" y2="121" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B3B3B3"/>
      <stop offset="1" stop-color="#949494"/>
    </linearGradient>
    <linearGradient id="cloud" x1="55" y1="49" x2="111" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset=".55" stop-color="#3C91E5"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Back instance -->
  <path d="M38 8 Q38 5 42 6 L97 7 Q101 7 101 11            L100 81 Q100 85 96 85 L39 84 Q36 84 36 80            L37 12 Q37 9 38 8Z" fill="#777777" stroke="#484848" stroke-width="3.2"/>

  <!-- Middle instance -->
  <path d="M25 21 Q25 18 29 19 L84 20 Q88 20 88 24            L87 96 Q87 99 83 99 L27 98 Q23 98 23 94            L24 25 Q24 22 25 21Z" fill="#999999" stroke="#555555" stroke-width="3.3"/>

  <!-- Foreground instance -->
  <path d="M11 35 Q11 32 15 32 L70 33 Q74 33 74 37            L73 114 Q73 118 69 118 L13 117 Q9 117 9 113            L10 40 Q10 36 11 35Z" fill="url(#panel)" stroke="#525252" stroke-width="3.6"/>

  <!-- Hand-inked panel highlights -->
  <path d="M16 39 L16 58 M17 88 L17 108" stroke="#E2E2E2" stroke-width="2.1" opacity=".72"/>
  <path d="M31 25 L77 25 M44 13 L91 13" stroke="#D7D7D7" stroke-width="1.8" opacity=".6"/>

  <!-- Instance status strip -->
  <path d="M21 47 Q21 43 26 43 L56 44            Q62 44 62 49 Q62 54 57 54            L26 54 Q21 54 21 49Z" fill="#003067" stroke="#203D5E" stroke-width="2.4"/>

  <path d="M26 48 Q28 45 31 47 Q34 49 31 52            Q27 54 25 51 Q24 49 26 48Z" fill="#50E6FF" stroke="#0078D4" stroke-width="1.3"/>

  <!-- Small marker-drawn instance details -->
  <path d="M23 64 L46 64 M24 70 L41 70" stroke="#666666" stroke-width="2.5" opacity=".6"/>
  <path d="M80 31 L80 43 M93 19 L93 29" stroke="#D6D6D6" stroke-width="2" opacity=".65"/>

  <!-- SQL cloud silhouette -->
  <path d="M48 118            C36 118 30 110 30 100            C30 90 37 81 47 80            C52 66 63 59 77 61            C90 62 99 72 100 83            C112 84 120 93 120 103            C120 114 112 121 101 121            L48 121            Q45 121 48 118Z" fill="url(#cloud)" stroke="#075A9C" stroke-width="4.1"/>

  <!-- Loose sketchnote contour -->
  <path d="M36 99 Q37 87 49 85            M54 77 Q61 64 76 65            M103 87 Q115 90 116 101" stroke="#B9E5FF" stroke-width="2.5" opacity=".8"/>

  <!-- Hand-lettered SQL -->
  <g stroke="#F2F2F2" stroke-width="4.5">
    <!-- S -->
    <path d="M58 91              Q51 87 46 92              Q42 97 49 101              L54 103              Q61 108 54 113              Q49 116 44 111"/>

    <!-- Q -->
    <path d="M78 91              C69 88 64 95 64 103              C64 112 69 116 77 114              C84 112 86 105 84 98              C83 94 81 92 78 91Z"/>
    <path d="M77 109 L87 119"/>

    <!-- L -->
    <path d="M95 91 L95 114 L110 114"/>
  </g>

  <!-- Marker accent and subtle hand-drawn spark -->
  <path d="M109 65 L111 59 M115 70 L121 67" stroke="#F7C948" stroke-width="3.1"/>
  <path d="M20 121 L24 124 M28 121 L31 124" stroke="#F7C948" stroke-width="2.3"/>

</svg>

    <path d="M21 99 L49 99 M21 107 L42 107" fill="none" stroke="#62B8E8" stroke-width="2"/>

    <!-- Lower-right tile -->
    <path d="M64 90 L114 90 L114 114 Q114 119 109 119 L64 119 Z" fill="#0078D4"/>
    <path d="M73 99 L104 99 M73 107 L96 107" fill="none" stroke="#55B9F2" stroke-width="2"/>


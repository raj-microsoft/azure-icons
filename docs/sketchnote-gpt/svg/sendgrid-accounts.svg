<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><title>SendGrid Accounts (sketch)</title>
  
  <desc>Hand-drawn four-part geometric SendGrid account integration symbol in Azure blue and cyan.</desc>

  <g stroke="#075B9A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

    <!-- Upper-left tile -->
    <path d="M13 47 Q13 44 17 44 L57 44 L57 83 L13 83 Z" fill="#0078D4"/>
    <path d="M20 52 L49 52 M20 59 L43 59" fill="none" stroke="#55B9F2" stroke-width="2"/>


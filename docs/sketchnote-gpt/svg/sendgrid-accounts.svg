    <path d="M65 45 Q88 43 111 46" fill="none" stroke="#9DEBFA" stroke-width="2"/>

    <!-- Yellow sketchnote accents -->
    <path d="M17 30 L25 24 L33 30" fill="none" stroke="#F2C94C" stroke-width="3"/>
    <path d="M95 27 L102 21 L109 27" fill="none" stroke="#F2C94C" stroke-width="3"/>
    <path d="M119 66 L123 66 M121 62 L121 70" fill="none" stroke="#F2C94C" stroke-width="2.5"/>

    <!-- Small hand-drawn connection marks -->
    <path d="M45 36 Q53 31 60 36" fill="none" stroke="#198AB3" stroke-width="2"/>
    <path d="M68 127 L84 127" fill="none" stroke="#198AB3" stroke-width="2"/>

  </g>

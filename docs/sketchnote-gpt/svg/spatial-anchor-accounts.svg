<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Spatial Anchor Accounts (sketch)</title>
  <defs>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B77AF4"/>
      <stop offset="0.62" stop-color="#8C4FE4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B77AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- spatial anchor connections -->
  <path d="M62 42 27 67 62 94 97 68 62 42Z" fill="none" stroke="#50E6FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 48 34 68 62 88 90 68 62 48Z" fill="none" stroke="#C3F1FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

  <!-- hand-drawn connection to right anchor point -->
  <path d="M89 63            C95 58 104 57 110 61            C116 65 118 74 114 81            C110 88 102 91 95 88            C88 85 84 77 86 69" fill="none" stroke="#50E6FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- top node -->
  <circle cx="62" cy="42" r="10.5" fill="url(#nodeGrad)" stroke="#6C34CC" stroke-width="2.5"/>
  <path d="M56 39c2-4 8-5 12-2" fill="none" stroke="#DFC7FF" stroke-width="2" stroke-linecap="round"/>

  <!-- left node -->
  <circle cx="27" cy="68" r="10.5" fill="url(#nodeGrad)" stroke="#6C34CC" stroke-width="2.5"/>
  <path d="M22 65c2-3 7-4 10-2" fill="none" stroke="#DFC7FF" stroke-width="2" stroke-linecap="round"/>

  <!-- bottom node -->
  <circle cx="62" cy="94" r="10.5" fill="url(#nodeGrad)" stroke="#6C34CC" stroke-width="2.5"/>
  <path d="M57 91c2-3 7-4 10-2" fill="none" stroke="#DFC7FF" stroke-width="2" stroke-linecap="round"/>

  <!-- right highlight node -->
  <circle cx="100" cy="75" r="8.5" fill="#9CEBFF" stroke="#2ABFDB" stroke-width="2.5"/>
  <circle cx="100" cy="75" r="2.8" fill="#EAFBFF"/>

  <!-- location / spatial anchor pin -->
  <path d="M101 8            C90 8 82 16 82 27            C82 32 84 38 88 45            C92 52 95 58 98 66            C99 68 102 68 103 66            C106 58 109 52 113 45            C117 38 119 32 119 27            C119 16 111 8 101 8Z" fill="url(#pinGrad)" stroke="#6F35CE" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="101" cy="27" r="9" fill="#F5EDFF" opacity=".95"/>
  <circle cx="101" cy="27" r="5" fill="#8C4FE4"/>

  <!-- subtle sketchnote marker accents -->
  <path d="M17 56l-6-5m9-24 6-4 5 5m82 83 6 4m-70 1 5 4 7-2" fill="none" stroke="#FFCA28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- uneven marker details -->
  <path d="M35 72c4 2 8 4 12 5M67 85c4-2 8-4 11-7M48 55c4-2 8-5 11-7" fill="none" stroke="#2ABFDB" stroke-width="2" stroke-linecap="round" opacity=".85"/>
</svg>

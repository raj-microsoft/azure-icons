<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Azure Backup Center (sketch)</title>

  <defs>
    <linearGradient id="backupAzure" x1="76" y1="8" x2="76" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".55" stop-color="#378FE4"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="backupCyan" x1="43" y1="47" x2="70" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CBF8FF"/>

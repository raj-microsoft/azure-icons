  <path d="M31 79            L35 79            L37 83            L40 84            L44 82            L47 85            L45 89            L46 92            L50 94            L50 98            L46 100            L45 103            L47 107            L44 110            L40 108            L37 109            L35 113            L31 113            L29 109            L26 108            L22 110            L19 107            L21 103            L20 100            L16 98            L16 94            L20 92            L21 89            L19 85            L22 82            L26 84            L29 83Z" fill="#0078D4" stroke="#16568B" stroke-width="2.2" transform="translate(5 -8) scale(.85)"/>

  <!-- Gear hub -->
  <circle cx="33" cy="88" r="5" fill="#FFFFFF" stroke="#16568B" stroke-width="2.5"/>

  <!-- Small settings detail -->

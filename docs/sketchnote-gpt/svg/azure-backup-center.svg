<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Azure Backup Center (sketch)</title>
  
  <desc>Azure-blue rear cloud, white foreground cloud with cyan outline, and a compact circular backup arrow surrounding a small blue settings gear.</desc>

  <!-- Rear Azure cloud -->
  <path d="M34 49            Q33 39 39 32            Q46 24 56 25            Q62 12 75 9            Q88 6 98 14            Q108 22 108 33            Q119 35 123 44            Q129 56 122 66            Q117 75 106 75            L56 75            Q43 76 36 68            Q31 61 34 49 Z" fill="#438FDF" stroke="#233F56" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- White foreground backup cloud -->
  <path d="M28 68            Q32 52 46 48            Q60 43 72 51            Q83 59 83 71            Q96 73 101 84            Q107 97 98 108            Q92 116 79 116            L30 116            Q14 117 7 105            Q1 94 8 81            Q15 70 28 68 Z" fill="#FFFFFF" stroke="#263D4D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cyan cloud contour -->
  <path d="M28 68            Q32 52 46 48            Q60 43 72 51            Q83 59 83 71            Q96 73 101 84            Q107 97 98 108            Q92 116 79 116            L30 116            Q14 117 7 105            Q1 94 8 81            Q15 70 28 68 Z" fill="none" stroke="#50E6FF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Circular backup arrow, sized around the small gear -->
  <path d="M54 87            C53 74 43 65 30 65            C17 65 9 75 9 88            C9 101 19 111 31 111            L36 111" fill="none" stroke="#263D4D" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M54 87            C53 74 43 65 30 65            C17 65 9 75 9 88            C9 101 19 111 31 111            L36 111" fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Directional arrowhead at bottom-right -->
  <path d="M34 102            Q33 100 36 101            L49 110            Q51 111 49 113            L36 122            Q33 123 34 119            L34 115            L30 115            L30 108            L34 108 Z" fill="#0078D4" stroke="#263D4D" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Small eight-tooth settings gear centered inside arrow -->
  <path d="M28 79            L32 79            L34 83            Q36 83 38 85            L42 83            L45 86            L43 90            Q44 92 44 94            L48 96            L48 100            L44 102            Q44 104 42 106            L44 109            L41 112            L37 110            Q35 112 33 112            L31 116            L27 116            L25 112            Q23 111 21 110            L17 112            L14 109            L16 105            Q15 103 15 101            L11 99            L11 95            L15 93            Q15 91 17 89            L15 86            L18 83            L22 85            Q24 83 26 83 Z" transform="translate(10 19) scale(.65)" fill="#0078D4" stroke="#263D4D" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Small white central gear hub -->
  <path d="M29 86            Q32 85 34 88            Q36 91 33 94            Q30 96 27 93            Q25 90 27 88            Q28 87 29 86 Z" fill="#FFFFFF" stroke="#263D4D" stroke-width="2.3" stroke-linejoin="round"/>

  <!-- Restrained yellow marker ticks -->
  <g fill="none" stroke="#E6B93F" stroke-width="2.5" stroke-linecap="round">
    <path d="M13 37 L8 33"/>
    <path d="M20 33 L19 27"/>
  </g>

  <!-- Subtle hand-drawn contour retraces -->
  <g fill="none" stroke="#236B9D" stroke-width="1.5" stroke-linecap="round">
    <path d="M39 41 Q44 30 55 30"/>
    <path d="M69 21 Q80 12 91 20"/>
    <path d="M35 55 Q47 46 59 51"/>
    <path d="M85 80 Q96 84 97 94"/>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Batch AI (sketch)</title>

  
  <desc id="desc">
    Hand-drawn Azure-blue light bulb with a central
    twin-stem neural circuit, distinct branching white
    neural pathways on both sides, and a compact gray
    threaded socket. No dotted node network.
  </desc>


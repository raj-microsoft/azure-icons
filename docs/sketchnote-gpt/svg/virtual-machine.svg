<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Virtual Machine (sketch)</title>
  
  <desc>Hand-drawn sketchnote illustration of the Azure Virtual Machine icon with a blue monitor, cyan VM cube, and grey stand.</desc>

  <defs>
    <linearGradient id="vmScreen" x1="64" y1="8" x2="64" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="vmStand" x1="64" y1="84" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#707070"/>
      <stop offset="1" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>

  <!-- Monitor body -->
  <path d="M9 14            Q9 9 14 9            L114 9            Q119 9 119 14            L119 79            Q119 84 114 84            L14 84            Q9 84 9 79            Z" fill="url(#vmScreen)" stroke="#12649C" stroke-width="3.2"/>

  <!-- Slightly uneven sketchnote border accent -->
  <path d="M16 16            Q30 13 45 15            M18 22            L18 73            M22 77            Q65 79 108 77" stroke="#8BC3FF" stroke-width="2.4" opacity=".7"/>

  <!-- Inner face highlight -->
  <path d="M19 19            Q64 17 109 19" stroke="#BFE1FF" stroke-width="2.6" opacity=".75"/>

  <!-- Central VM cube top -->
  <path d="M64 29            L84 40            L64 52            L44 40            Z" fill="#C3F1FF" stroke="#2A8CB8" stroke-width="2.6"/>

  <!-- Central VM cube left face -->
  <path d="M44 40            L64 52            L64 75            L44 63            Z" fill="#9CEBFF" stroke="#2A8CB8" stroke-width="2.6"/>

  <!-- Central VM cube right face -->
  <path d="M84 40            L64 52            L64 75            L84 63            Z" fill="#50E6FF" stroke="#2A8CB8" stroke-width="2.6"/>

  <!-- Front lower facets to echo original -->
  <path d="M44 63            L64 52            L64 75            Z" fill="#C3F1FF" opacity=".95"/>
  <path d="M84 63            L64 52            L64 75            Z" fill="#9CEBFF" opacity=".95"/>

  <!-- Cube sketch details -->
  <path d="M49 40            Q57 44 64 48            Q72 44 79 40" stroke="#E6FBFF" stroke-width="2.2" opacity=".9"/>
  <path d="M49 58            Q56 61 61 65" stroke="#D8F8FF" stroke-width="2" opacity=".8"/>
  <path d="M79 57            Q72 61 67 65" stroke="#A7F3FF" stroke-width="2" opacity=".8"/>

  <!-- Monitor stand -->
  <path d="M47 84            C47 103 46 113 31 116            Q27 117 26 120            L102 120            Q101 117 97 116            C82 113 81 103 81 84            Z" fill="url(#vmStand)" stroke="#5F5F5F" stroke-width="3"/>

  <!-- Stand highlight -->
  <path d="M52 88            Q52 102 48 113" stroke="#E2E2E2" stroke-width="2.2" opacity=".7"/>

  <!-- Small handwritten-style marks -->
  <path d="M28 30            q-6 2 -8 7" stroke="#50E6FF" stroke-width="2.2"/>
  <path d="M98 27            q5 2 8 7" stroke="#50E6FF" stroke-width="2.2"/>
  <path d="M22 60            l-7 0            M19 56            l-4 -4" stroke="#9CEBFF" stroke-width="2"/>
  <path d="M108 58            l7 0            M109 54            l4 -4" stroke="#9CEBFF" stroke-width="2"/>

  <!-- Tiny sketchnote sparkle -->
  <path d="M102 99            l0 8            M98 103            l8 0" stroke="#B7B7B7" stroke-width="2.1"/>
</svg>

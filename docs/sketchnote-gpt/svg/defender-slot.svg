<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Defender Slot (sketch)</title>

  
  <desc>
    Three vertical slot elements: one solid Azure-blue
    module with white indicator panels and two navy-blue
    dashed slot outlines. Hand-drawn marker styling,
    restrained yellow highlights, transparent background.
  </desc>

  <defs>
    <linearGradient id="slotAzure" x1="22" y1="8" x2="24" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".48" stop-color="#3C91E5"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Solid Azure slot module -->
  <path d="     M13 8     Q12 6 16 6     L34 7     Q39 7 39 12     L40 115     Q40 120 35 120     L15 121     Q10 121 10 116     L11 13     Q11 9 13 8     Z" fill="url(#slotAzure)" stroke="#005A9E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand-drawn edge accent -->
  <path d="     M15 13     Q14 44 15 71     L14 110" stroke="#B8E2FF" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>

  <!-- Small white status panel -->
  <path d="     M20 14     L30 14.5     Q32 14.5 32 17     L31.5 26     Q31.5 28 29 28     L20 27.5     Q18 27 18 25     L18.5 17     Q18.5 14 20 14     Z" fill="#FFFFFF" stroke="#DCEFFF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Long white slot indicator -->
  <path d="     M20 37     Q19 36 19 39     L19 74     Q19 77 21 77     L29 77.5     Q32 77.5 32 75     L31.5 39     Q31.5 37 29 37     Z" fill="#FFFFFF" stroke="#DCEFFF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Subtle marker strokes on module -->
  <path d="M21 31 L29 31.5" stroke="#005A9E" stroke-width="1.5" stroke-linecap="round"/>

  <path d="M21 83 L29 83.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".65"/>

  <!-- First empty defender slot -->
  <path d="     M58 7     L81 7.5     Q84 7.5 84 11     L84.5 115     Q84.5 120 81 120     L57 120.5     Q54 120.5 54 116     L54.5 11     Q54.5 7 58 7     Z" stroke="#00188F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>

  <!-- Inner sketch edge -->
  <path d="     M60 17     L60 108" stroke="#5EA0EF" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 8" opacity=".7"/>

  <!-- Second empty defender slot -->
  <path d="     M102 7.5     L121 7     Q125 7 125 11     L125 115     Q125 120 121 120     L101 120     Q98 120 98 116     L98 12     Q98 8 102 7.5     Z" stroke="#00188F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>

  <!-- Inner sketch edge -->
  <path d="     M104 17     L104 108" stroke="#5EA0EF" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 8" opacity=".7"/>

  <!-- Restrained yellow sketchnote marks -->
  <path d="     M43 18 L49 15     M44 25 L50 25     M44 32 L49 35" stroke="#F2C94C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom marker accents -->
  <path d="     M17 125 Q26 126 34 124     M59 125 Q70 127 80 125     M103 125 Q112 127 121 125" stroke="#A19F9D" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4" opacity=".75"/>

</svg>

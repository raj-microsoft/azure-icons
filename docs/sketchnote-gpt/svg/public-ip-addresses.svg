<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Public IP Addresses (sketch)</title>
  <defs>
    <linearGradient id="ipCyan" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".4" stop-color="#32D2F2"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="ipHeader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#929292"/>
      <stop offset="1" stop-color="#686868"/>
    </linearGradient>
  </defs>

  <!-- IP address panel -->
  <path d="M13 43     Q13 39 18 39     L110 39     Q115 39 115 44     L115 105     Q115 110 110 110     L18 110     Q13 110 13 105 Z" fill="url(#ipCyan)" stroke="#087BA5" stroke-width="4" stroke-linejoin="round"/>

  <!-- Server header -->
  <path d="M18 21     Q13 21 13 26     L13 43     L115 43     L115 26     Q115 21 110 21 Z" fill="url(#ipHeader)" stroke="#626262" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Header inner highlight -->
  <path d="M23 29 L105 29" stroke="#C7C7C7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Address field -->
  <rect x="27" y="32" width="74" height="8" rx="3" fill="#F2F2F2" stroke="#777777" stroke-width="1.5"/>

  <!-- IP address indicator dots -->
  <g fill="#FFFFFF" stroke="#168AB3" stroke-width="2">
    <circle cx="40" cy="77" r="9"/>
    <circle cx="64" cy="77" r="9"/>
    <circle cx="88" cy="77" r="9"/>
  </g>

  <!-- Dot highlights -->
  <g fill="none" stroke="#DFFAFF" stroke-width="2" stroke-linecap="round">
    <path d="M36 73 Q40 69 44 73"/>
    <path d="M60 73 Q64 69 68 73"/>
    <path d="M84 73 Q88 69 92 73"/>
  </g>

  <!-- Network addressing lines -->
  <g fill="none" stroke="#168AB3" stroke-width="2.5" stroke-linecap="round">
    <path d="M31 94 L97 94"/>
    <path d="M37 101 L91 101"/>
  </g>

  <!-- Connection pins -->
  <g fill="#F2F2F2" stroke="#168AB3" stroke-width="1.8">
    <circle cx="31" cy="94" r="3"/>
    <circle cx="97" cy="94" r="3"/>
    <circle cx="37" cy="101" r="2.5"/>
    <circle cx="91" cy="101" r="2.5"/>
  </g>

  <!-- Yellow public network signal accents -->
  <g fill="none" stroke="#F2C94C" stroke-width="3.2" stroke-linecap="round">
    <path d="M23 14 L18 9"/>
    <path d="M64 13 L64 6"/>
    <path d="M105 14 L110 9"/>
    <path d="M119 61 L125 58"/>
    <path d="M9 62 L3 59"/>
  </g>

  <!-- Hand-drawn marker details -->
  <g fill="none" stroke-linecap="round">
    <path d="M19 48 Q24 45 29 48" stroke="#A8F0FF" stroke-width="2"/>
    <path d="M100 105 Q106 103 109 99" stroke="#A8F0FF" stroke-width="2"/>
    <path d="M16 108 Q22 114 30 114" stroke="#087BA5" stroke-width="2"/>
    <path d="M96 115 Q103 116 108 112" stroke="#32BEDD" stroke-width="2"/>
  </g>
</svg>

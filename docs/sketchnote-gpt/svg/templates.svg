<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Templates (sketch)</title>
  <defs>
    <linearGradient id="templatePaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="templateBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ea0ef"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
  </defs>

  <!-- Document silhouette -->
  <path d="M29 12     Q25 12 25 17     L25 111     Q25 116 30 116     L99 116     Q104 116 104 111     L104 43     L74 12 Z" fill="url(#templatePaper)" stroke="#0078d4" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Folded page corner -->
  <path d="M74 13     L74 36     Q74 43 81 43     L103 43 Z" fill="#0078d4" stroke="#005ba1" stroke-width="2.5" stroke-linejoin="round"/>

  <path d="M79 19 L96 36" fill="none" stroke="#9ed0ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Template layout: content lines -->
  <path d="M39 55     Q39 53 42 53     L83 53" fill="none" stroke="#5ea0ef" stroke-width="4" stroke-linecap="round"/>

  <path d="M39 67 L89 67     M39 79 L87 79     M39 91 L76 91" fill="none" stroke="#83b9f9" stroke-width="3" stroke-linecap="round"/>

  <!-- Editable template blocks -->
  <rect x="39" y="99" width="14" height="9" rx="2" fill="#5ea0ef"/>
  <rect x="58" y="99" width="14" height="9" rx="2" fill="#0078d4"/>
  <rect x="77" y="99" width="12" height="9" rx="2" fill="#83b9f9"/>

  <!-- Page corner marker -->
  <path d="M85 45 L91 49" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Yellow sketchnote sparkle -->
  <path d="M104 17     L109 27     L120 31     L110 36     L107 47     L102 37     L92 33     L102 28 Z" fill="#ffca28" stroke="#d99b00" stroke-width="1.7" stroke-linejoin="round"/>

  <!-- Marker accents -->
  <path d="M16 35 Q12 48 16 59     M108 70 Q114 78 110 86" fill="none" stroke="#50e6ff" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M29 122 Q60 125 88 121" fill="none" stroke="#0078d4" stroke-width="2" stroke-linecap="round"/>
</svg>

  <!-- Three rounded cloud lobes, flat bottom -->
  <path d="M82 122            C74 122 68 116 68 109            C68 101 73 95 81 94            C84 87 91 83 99 83            C109 83 116 89 117 97            C122 98 125 103 125 109            C125 116 120 122 113 122            L82 122 Z" fill="#347BD0" stroke="#243447" stroke-width="3.7"/>

</svg>

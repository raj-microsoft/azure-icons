<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Entra Internet Access (sketch)</title>
  
  <desc>Hand-drawn globe with a dark grid restricted to the cyan left hemisphere, a solid azure-blue right hemisphere, and a small three-lobed cloud overlapping the lower-right edge.</desc>

  <!-- Globe: cyan left hemisphere -->
  <path d="M58 7            C43 7 28 14 19 25            C9 37 7 50 8 59            C8 79 21 96 39 103            Q48 107 58 106            L58 7 Z" fill="#44CFF1"/>

  <!-- Globe: solid blue right hemisphere -->
  <path d="M58 7            C80 6 99 21 106 40            Q111 54 106 72            C101 91 82 106 58 106            Z" fill="#168BDD"/>

  <!-- Left hemisphere: dark hand-drawn meridian -->
  <path d="M56 8            C44 20 37 36 36 54            C35 74 43 94 56 105" stroke="#243447" stroke-width="3.2"/>

  <!-- Left hemisphere: upper parallel -->
  <path d="M18 38            Q35 41 56 41" stroke="#243447" stroke-width="3.1"/>

  <!-- Left hemisphere: equatorial parallel -->
  <path d="M9 57            Q32 58 56 57" stroke="#243447" stroke-width="3.2"/>

  <!-- Left hemisphere: lower parallel -->
  <path d="M16 77            Q36 76 56 77" stroke="#243447" stroke-width="3.1"/>

  <!-- Hemisphere boundary -->
  <path d="M58 8            Q56 31 58 54            Q59 78 58 105" stroke="#243447" stroke-width="3.2"/>

  <!-- Irregular outer marker contour -->

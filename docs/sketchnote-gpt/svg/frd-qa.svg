<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>FRD QA (sketch)</title>

  
  <desc>
    Azure FRD QA icon with a flat blue rounded document,
    five ascending white chart bars, three horizontal text
    lines, and a cyan magnifying glass overlapping the
    lower-right corner. Uneven dark marker outlines,
    transparent background, no decorative accents.
  </desc>

  <!-- Main blue rounded document -->
  <path d="M20 2        L75.6 2        Q88.2 1.7 88.4 14.1        L88.5 94.6        Q88.5 107.3 75.5 107.5        L20.1 107.6        Q7.4 107.4 7.4 94.7        L7.3 15.1        Q7.2 2.2 20 2Z" fill="#318BDE" stroke="#243447" stroke-width="3.4"/>

  <!-- Five ascending chart bars -->
  <g stroke="#243447" stroke-width="6.4">
    <path d="M23.1 58.5L23.1 61"/>
    <path d="M34.9 46.2Q35.2 53.8 34.9 61"/>
    <path d="M46.7 34.8Q46.4 47.5 46.7 61"/>
    <path d="M58.5 24.8Q58.9 43.3 58.5 61"/>
    <path d="M70.3 16.7Q70 38.7 70.3 61"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="4.1">
    <path d="M23.1 58.5L23.1 61"/>
    <path d="M34.9 46.2Q35.2 53.8 34.9 61"/>
    <path d="M46.7 34.8Q46.4 47.5 46.7 61"/>
    <path d="M58.5 24.8Q58.9 43.3 58.5 61"/>
    <path d="M70.3 16.7Q70 38.7 70.3 61"/>
  </g>

  <!-- Three horizontal document text lines -->
  <g stroke="#243447" stroke-width="5.8">
    <path d="M23 71.2Q45.4 70.9 69.7 71.2"/>
    <path d="M23 80.6Q41.3 80.2 60.2 80.6"/>
    <path d="M23 90.1Q45.5 89.7 69.7 90.1"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="3.7">
    <path d="M23 71.2Q45.4 70.9 69.7 71.2"/>
    <path d="M23 80.6Q41.3 80.2 60.2 80.6"/>
    <path d="M23 90.1Q45.5 89.7 69.7 90.1"/>
  </g>

  <!-- Magnifying glass handle, behind lens -->
  <path d="M101.5 105.5        L119.4 123.8        Q121.4 125.8 123.5 123.7        Q125.8 121.5 123.5 119.2        L105.6 101.4Z" fill="#198AB3" stroke="#243447" stroke-width="2.8"/>

  <!-- Transparent lens interior: underlying document remains visible -->
  <path d="M85 69.3        C96 69.2 104.5 78.1 104.6 89.1        C104.7 100.2 96.1 109 85.1 109.1        C74 109.2 65.1 100.3 65.1 89.3        C65 78.3 73.9 69.4 85 69.3Z" fill="#32BEDD" fill-opacity=".12"/>

  <!-- Cyan magnifying glass ring with hollow center -->
  <path d="M84.6 63.8        C98.5 63.4 110.4 74.5 110.9 88.3        C111.3 102.5 100.1 114.4 86.2 114.8        C72.2 115.2 60.2 104.4 59.6 90.5        C59 76.2 70.2 64.2 84.6 63.8Z         M85 69.3        C73.9 69.4 65 78.3 65.1 89.3        C65.1 100.3 74 109.2 85.1 109.1        C96.1 109 104.7 100.2 104.6 89.1        C104.5 78.1 96 69.2 85 69.3Z" fill="#32BEDD" fill-rule="evenodd" stroke="#243447" stroke-width="2.7"/>

</svg>

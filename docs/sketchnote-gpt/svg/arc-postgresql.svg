<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke="#203746" stroke-linecap="round" stroke-linejoin="round"><title>Arc PostgreSQL (sketch)</title>

  
  <desc>Blue PostgreSQL database cylinder with white elephant silhouette, cyan oval pedestal and green Azure Arc badge.</desc>

  <!-- Blue oval pedestal -->
  <path d="M5.5 94            C5 83 30 76 63 76            C96 76 122.5 83 122.5 94            L122 108            C121 119 96 125 63 125            C31 125 7 119 5.5 108Z" fill="#5EA0EF" stroke-width="3.5"/>


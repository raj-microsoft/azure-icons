<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Network Managers (sketch)</title>

  
  <desc id="desc">
    Two blue angle brackets enclosing three separate green
    nodes, positioned above-left of a large blue cogwheel
    with one plain circular opening.
  </desc>

  <!-- Left angle bracket -->
  <path d="M35 7        L9 30        Q7 32 9 34        L35 55" stroke="#203746" stroke-width="9"/>
  <path d="M35 7        L9 30        Q7 32 9 34        L35 55" stroke="#1490DF" stroke-width="5.5"/>

  <!-- Right angle bracket -->
  <path d="M72 7        L97 23        Q100 25 98 28        L73 42" stroke="#203746" stroke-width="9"/>
  <path d="M72 7        L97 23        Q100 25 98 28        L73 42" stroke="#50E6FF" stroke-width="5.5"/>


    <path d="M32 21              C37 21 40 25 40 30              C40 35 36 39 32 39              C27 39 24 35 24 30              C24 25 27 21 32 21 Z"/>
    <path d="M53 21              C58 21 61 25 61 30              C61 35 57 39 53 39              C48 39 45 35 45 30              C45 25 48 21 53 21 Z"/>
    <path d="M74 21              C79 21 82 25 82 30              C82 35 78 39 74 39              C69 39 66 35 66 30              C66 25 69 21 74 21 Z"/>
  </g>


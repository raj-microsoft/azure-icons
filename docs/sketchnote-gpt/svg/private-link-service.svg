    <path d="M94 28       Q96 25 99 28       L121 51       Q124 54 121 58       L94 85" fill="none" stroke="#0877B8" stroke-width="11"/>
    <path d="M94 28 L121 51 Q124 54 121 58" fill="none" stroke="url(#edgeBlue)" stroke-width="7"/>
    <path d="M121 58 L94 85" fill="none" stroke="url(#edgeCyan)" stroke-width="8"/>
    <path d="M115 55 L97 37" fill="none" stroke="#A9DFFF" stroke-width="2.2"/>
  </g>


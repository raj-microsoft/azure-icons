<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Private Link Service (sketch)</title>
  <defs>
    <linearGradient id="linkBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#127FD9"/>
    </linearGradient>
    <linearGradient id="edgeBlue" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1490DF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="edgeCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Left private-network boundary -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 27       Q32 25 29 28       L7 51       Q4 54 7 58       L34 85" fill="none" stroke="#0877B8" stroke-width="11"/>
    <path d="M34 27       Q32 25 29 28       L7 51       Q4 54 7 58" fill="none" stroke="url(#edgeBlue)" stroke-width="7"/>
    <path d="M7 58 L34 85" fill="none" stroke="url(#edgeCyan)" stroke-width="8"/>
    <path d="M13 55 L31 36" fill="none" stroke="#A9DFFF" stroke-width="2.2"/>
  </g>

  <!-- Right private-network boundary -->

  <path d="M80 84     L66 84     C53 84 46 76 46 65     C46 54 54 46 65 46     L69 46     C74 46 77 49 77 54     C77 59 74 62 69 62     L65 62     C62 62 60 64 60 67     C60 70 62 72 66 72     L80 72     C87 72 91 67 91 61     C91 56 89 53 86 50     C94 53 99 61 99 70     C99 79 91 84 80 84 Z" fill="url(#linkBlue)" stroke="#075B9B" stroke-width="2.8" stroke-linejoin="round"/>


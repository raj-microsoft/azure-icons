<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Relays (sketch)</title>
  <defs>
    <linearGradient id="relay-left" x1="6.11" y1="12.5" x2="6.11" y2="9.42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4bb2"/>
      <stop offset="1" stop-color="#c69aeb"/>
    </linearGradient>
    <linearGradient id="relay-right" x1="12.06" y1="12.5" x2="12.06" y2="9.42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f4bb2"/>
      <stop offset="1" stop-color="#c69aeb"/>
    </linearGradient>
  </defs>

  <g transform="scale(7.111111)">

    <!-- Original open upper and lower bracket assemblies -->
    <g fill="#999" stroke="#858585" stroke-width=".035" stroke-linejoin="round">
      <path d="M1.15,1.27H2.44V4.87H.87V1.84a.57.57,0,0,1,.28-.57Z"/>
      <path d="M15.72,1.27H17a.57.57,0,0,1,.57.57v3H15.72Z"/>
      <path d="M.87,12.52H2.45v3.89H1.15a.57.57,0,0,1-.57-.57v-3.03a.29.29,0,0,1,.29-.29Z"/>
      <path d="M15.72,12.52H17.3a.29.29,0,0,1,.29.29v3a.57.57,0,0,1-.57.57h-1.3Z"/>
    </g>

    <!-- Original horizontal bracket bars; deliberately open at both ends -->
    <path d="M8.74-6.32H10V10.68H8.74a.57.57,0,0,1-.57-.57V-5.75a.57.57,0,0,1,.57-.57Z" transform="translate(11.26 -6.9) rotate(90)" fill="#949494" stroke="#858585" stroke-width=".035" stroke-linejoin="round"/>

    <path d="M8.74,7H10V24H8.74a.57.57,0,0,1-.57-.57V7.57A.57.57,0,0,1,8.74,7Z" transform="translate(-6.42 24.59) rotate(-90)" fill="#949494" stroke="#858585" stroke-width=".035" stroke-linejoin="round"/>

    <!-- Original three-way relay connections -->
    <path d="M12.38 10.79 L9.4 6.01 L9.13 6.18 L8.87 6.01 L5.88 10.79 L6.49 11.16 L9.13 6.93 L11.78 11.17 Z" fill="#949494" stroke="#858585" stroke-width=".045" stroke-linejoin="round"/>

    <!-- Central relay -->
    <circle cx="9.08" cy="6.21" r="1.54" fill="#86d633" stroke="#6fae2c" stroke-width=".045"/>

    <!-- Left relay -->
    <circle cx="6.11" cy="10.96" r="1.54" fill="url(#relay-left)" stroke="#8060b4" stroke-width=".045"/>

    <!-- Right relay -->
    <circle cx="12.06" cy="10.96" r="1.54" fill="url(#relay-right)" stroke="#8060b4" stroke-width=".045"/>

  </g>
</svg>

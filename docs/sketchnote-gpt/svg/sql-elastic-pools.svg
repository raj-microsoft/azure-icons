  <path d="M81 59     Q81 53 96 53     Q111 53 111 59     L111 82     Q111 88 96 88     Q81 88 81 82Z" fill="url(#dbCyan)" stroke="#0078B8" stroke-width="2.5"/>

  <ellipse cx="96" cy="59" rx="15" ry="5.5" fill="#EAEAEA" stroke="#0078B8" stroke-width="2"/>
  <ellipse cx="96" cy="59" rx="11" ry="3.5" fill="#50E6FF"/>

  <path d="M81 70 Q96 79 111 70     M81 79 Q96 88 111 79" fill="none" stroke="#0078B8" stroke-width="2" stroke-linecap="round"/>


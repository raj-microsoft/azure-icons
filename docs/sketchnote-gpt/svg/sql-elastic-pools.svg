<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>SQL Elastic Pools (sketch)</title>
  <defs>
    <linearGradient id="poolBlue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset=".52" stop-color="#0071C8"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="dbCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Central elastic pool diamond -->

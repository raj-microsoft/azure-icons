<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><title>Mobile (sketch)</title>
  <defs>
    <linearGradient id="phoneBody" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ea0ef"/>
      <stop offset=".38" stop-color="#3990e4"/>
      <stop offset=".72" stop-color="#1c84dc"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="screen" x1="64" y1="17" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0fffd"/>
      <stop offset="1" stop-color="#d2ebff"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Smartphone outer casing -->
    <path d="M39 8.5 87.5 8.2c4.2 0 6.7 2.9 6.7 7.1v97.1c0 4.2-2.6 7.1-6.8 7.1H40.3c-4.4 0-7-2.9-7-7.1V15.6c0-4.2 1.8-7.1 5.7-7.1Z" fill="url(#phoneBody)" stroke="#005ba1" stroke-width="3.5"/>

    <!-- Hand-drawn edge accents -->
    <path d="M38.5 13.5c-1.2 1.1-1.2 2.7-1.2 4.6v91.1c0 3.6 1.6 5.3 4.8 5.3" fill="none" stroke="#83caff" stroke-width="2.3"/>
    <path d="M89.5 13.5c1.2 1 1.7 2.5 1.7 4.6v91.3c0 3.1-1.6 4.9-4.8 5" fill="none" stroke="#005ba1" stroke-width="1.8" opacity=".75"/>

    <!-- Speaker -->
    <path d="M59.2 12.8h9.6" stroke="#f2f2f2" stroke-width="3.2"/>
    <path d="M57.5 12.8h1.2M69.4 12.8h1.2" stroke="#ffffff" stroke-width="1.3"/>

    <!-- Display -->
    <path d="M42.8 20.2h42.5c1.2 0 1.8.7 1.8 1.8v83.2c0 1.2-.7 1.8-1.8 1.8H42.8c-1.2 0-1.8-.7-1.8-1.8V22c0-1.1.6-1.8 1.8-1.8Z" fill="url(#screen)" stroke="#0078d4" stroke-width="1.8"/>

    <!-- Subtle screen reflection -->
    <path d="M45 24.5v69.2" stroke="#ffffff" stroke-width="1.7" opacity=".6"/>
    <path d="M48 24.5h29" stroke="#ffffff" stroke-width="1.2" opacity=".45"/>

    <!-- Azure cube / mobile application symbol -->
    <g stroke-linejoin="round">
      <path d="m64 48.5 22 12.7v25.4L64 99.3 42 86.6V61.2Z" fill="#ffffff" opacity=".3"/>
      <path d="m64 48.5 22 12.7-22 12.9-22-12.9Z" fill="#5ea0ef" stroke="#0078d4" stroke-width="2.1"/>
      <path d="M64 74.1 86 61.2v25.4L64 99.3Z" fill="#005ba1" stroke="#0078d4" stroke-width="2.1"/>
      <path d="M64 74.1v25.2L42 86.6V61.2Z" fill="#0078d4" stroke="#005ba1" stroke-width="2.1"/>

      <!-- Cube highlights -->
      <path d="m48 61.2 16 9.4 16-9.4" stroke="#b8eaff" stroke-width="1.5" opacity=".9"/>
      <path d="M68 78v16.2" stroke="#50b6ff" stroke-width="1.5" opacity=".8"/>
      <path d="M47 66v17.4l12.2 7" stroke="#50b6ff" stroke-width="1.5" opacity=".8"/>
    </g>

    <!-- Home button -->
    <circle cx="64" cy="112.5" r="3.2" fill="#f2f2f2" stroke="#d9efff" stroke-width="1.1"/>
    <circle cx="64" cy="112.5" r="1.2" fill="#5ea0ef"/>

    <!-- Yellow sketchnote accents -->
    <path d="m99 26 2 5.5 5.5 2-5.5 2-2 5.5-2-5.5-5.5-2 5.5-2Z" fill="#ffd84d" stroke="#d49b20" stroke-width="1.4"/>
    <path d="M24 48v8m-4-4h8" stroke="#ffca3a" stroke-width="2.5"/>
    <path d="M102 88c2.3 1.4 3.5 3.5 3.8 6" stroke="#50e6ff" stroke-width="2.2"/>
    <path d="M25 91c2-1.2 4.1-1.4 6.2-.7" stroke="#0078d4" stroke-width="2"/>

    <!-- Hand-drawn motion marks -->
    <path d="M23 34c2.3-1.3 4.6-1.5 6.8-.7" stroke="#5ea0ef" stroke-width="2"/>
    <path d="M100 48c2.2-.7 4.2-.4 6 .7" stroke="#0078d4" stroke-width="1.8"/>
  </g>
</svg>

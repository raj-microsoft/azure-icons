<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title"><title>Application Gateways (sketch)</title>
  

  <defs>
    <linearGradient id="gateway-green" x1="25" y1="17" x2="104" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76BC2D"/>
      <stop offset=".55" stop-color="#6DAD2A"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn green gateway diamond -->

  <!-- Application Gateway split traffic arrows -->
  <!-- Left outbound arrow -->
  <path d="M60 52            L34 78            L25 69            L25 90            L46 90            L37 81            L69 49            Z" fill="#FFFFFF" stroke="#38691D" stroke-width="2.1"/>

  <!-- Right outbound arrow -->

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Managed DevOps Pools (sketch)</title>

  
  <desc>Azure-blue stacked isometric DevOps pool panels with a small cyan cube, surrounded by hand-drawn gray management brackets.</desc>

  <defs>
    <linearGradient id="poolBlue" x1="25" y1="30" x2="99" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50A8F0"/>
      <stop offset=".5" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#155EA1"/>
    </linearGradient>
    <linearGradient id="cubeCyan" x1="71" y1="51" x2="96" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C3F1FF"/>
      <stop offset="1" stop-color="#50E6FF"/>
    </linearGradient>
  </defs>

  <!-- Left management bracket -->
  <path d="M27 7            L10 17            Q8 18 8 22            L8 106            Q8 109 11 111            L27 120" stroke="#949494" stroke-width="9"/>

  <path d="M27 7 L18 22            M18 106 L27 120" stroke="#A3A3A3" stroke-width="4"/>

  <!-- Right management bracket -->
  <path d="M101 7            L118 17            Q120 19 120 22            L120 106            Q120 109 117 111            L101 120" stroke="#949494" stroke-width="9"/>

  <path d="M101 7 L110 22            M110 106 L101 120" stroke="#A3A3A3" stroke-width="4"/>

  <!-- Hand-drawn bracket highlights -->
  <path d="M13 29 L13 96            M115 30 L115 96" stroke="#D2D2D2" stroke-width="2.5"/>

  <!-- Rear DevOps pool panel -->
  <path d="M24 48            Q24 45 27 43            L70 18            Q74 16 75 21            L75 59            Q75 62 72 64            L29 89            Q25 91 24 86Z" fill="url(#poolBlue)" stroke="#155EA1" stroke-width="3.5"/>

  <!-- Rear panel edge -->
  <path d="M29 48 L70 24            M29 82 L29 54" stroke="#80CEFF" stroke-width="2.3"/>

  <!-- Middle DevOps pool panel -->
  <path d="M41 56            Q41 53 44 51            L87 26            Q91 24 92 29            L92 67            Q92 70 89 72            L46 97            Q42 99 41 94Z" fill="#0078D4" stroke="#155EA1" stroke-width="3.5"/>

  <!-- Middle panel highlight -->
  <path d="M46 56 L86 33            M46 90 L46 63" stroke="#50C7E8" stroke-width="2.5"/>

  <!-- Front DevOps pool panel -->
  <path d="M58 64            Q58 61 61 59            L104 34            Q108 32 109 37            L109 75            Q109 78 106 80            L63 105            Q59 107 58 102Z" fill="url(#poolBlue)" stroke="#155EA1" stroke-width="3.8"/>

  <!-- Front panel marker highlights -->
  <path d="M63 65 L103 42            M63 97 L63 72" stroke="#8AD8FF" stroke-width="2.6"/>

  <!-- Small isometric workload cube -->
  <path d="M76 65            L88 58            L100 65            L88 72Z" fill="url(#cubeCyan)" stroke="#1688B8" stroke-width="2.3"/>

  <path d="M76 65            L88 72            L88 87            L76 80Z" fill="#9CEBFF" stroke="#1688B8" stroke-width="2.3"/>

  <path d="M88 72            L100 65            L100 80            L88 87Z" fill="#50E6FF" stroke="#1688B8" stroke-width="2.3"/>

  <!-- Cube surface detail -->
  <path d="M82 65 L88 62 L94 65" stroke="#FFFFFF" stroke-width="1.8"/>

  <!-- Pool connection indicator -->
  <path d="M75 94            C75 100 78 103 84 106            L96 113" stroke="#BEBFBE" stroke-width="3" stroke-dasharray="4 5"/>

  <!-- Small managed workload node -->
  <path d="M96 113 L105 108 L114 113 L105 118Z" fill="#F4F3F5" stroke="#949494" stroke-width="2"/>

  <path d="M96 113 L105 118 L105 124 L96 119Z" fill="#BEBFBE" stroke="#949494" stroke-width="1.8"/>

  <path d="M105 118 L114 113 L114 119 L105 124Z" fill="#D9D9D6" stroke="#949494" stroke-width="1.8"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M83 12 L88 6            M92 16 L100 14            M86 22 L91 25" stroke="#FFCC4D" stroke-width="3.2"/>

  <!-- Azure-blue emphasis marks -->
  <path d="M16 51 L21 48            M16 61 L21 61" stroke="#0078D4" stroke-width="2.5"/>

  <!-- Small hand-drawn motion details -->
  <path d="M32 100 L39 96            M35 108 L42 104" stroke="#50C7E8" stroke-width="2.7"/>

</svg>

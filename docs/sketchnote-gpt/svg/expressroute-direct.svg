<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>ExpressRoute Direct (sketch)</title>
  
  <desc>Sketch-style ExpressRoute Direct icon featuring a purple triangular network with green endpoints and a large circular direct-connection symbol.</desc>

  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#B796F9"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Triangular network connections -->
  <g stroke="#773ADC" stroke-width="8">
    <path d="M43 18 Q29 43 15 75"/>
    <path d="M45 18 Q59 41 75 69"/>
    <path d="M15 76 Q39 77 63 76"/>
  </g>

  <!-- Sketch reinforcement strokes -->
  <g stroke="#A67AF4" stroke-width="2.5" opacity=".85">
    <path d="M38 28 Q27 49 20 64"/>
    <path d="M51 29 Q61 46 69 58"/>
    <path d="M28 82 Q43 83 54 81"/>
  </g>

  <!-- Green connection endpoints -->
  <g fill="#86D633" stroke="#4D8E20" stroke-width="3.4">
    <path d="M44 8              C52 8 58 14 57 22              C56 30 50 35 43 34              C35 33 30 27 31 20              C32 13 37 8 44 8Z"/>
    <path d="M13 66              C21 65 28 71 28 79              C29 87 22 94 14 94              C6 94 1 88 2 80              C2 72 7 67 13 66Z"/>
  </g>

  <!-- Endpoint highlights -->
  <g stroke="#C6F58B" stroke-width="3">
    <path d="M38 15 Q43 12 48 17"/>
    <path d="M8 74 Q13 71 18 75"/>
  </g>

  <!-- Main circular direct connection -->
  <path d="M87 41            C110 41 125 58 124 82            C123 105 106 121 84 121            C61 121 44 103 44 81            C44 59 62 42 87 41Z" fill="#FFFFFF" stroke="#773ADC" stroke-width="5"/>

  <!-- Secondary imperfect outline -->
  <path d="M84 45            C104 43 119 59 120 78" stroke="#A67AF4" stroke-width="2.2" opacity=".8"/>

  <!-- Lower-left purple connector -->
  <path d="M49 100            L64 85            Q66 83 68 85            L83 101            Q85 103 83 105            L69 119            Q56 113 49 100Z" fill="#A67AF4" stroke="#773ADC" stroke-width="3"/>

  <!-- Upper-right purple connector -->
  <path d="M104 46            Q116 53 122 65            L108 79            Q106 81 104 79            L89 64            Q87 62 89 60Z" fill="#B796F9" stroke="#773ADC" stroke-width="3"/>

  <!-- Connector detail: diagonal parallel strokes -->
  <g stroke="#773ADC" stroke-width="4">
    <path d="M66 89 L74 81"/>
    <path d="M72 95 L80 87"/>
    <path d="M78 101 L86 93"/>

    <path d="M82 73 L91 64"/>
    <path d="M88 79 L97 70"/>
    <path d="M94 85 L103 76"/>
  </g>

  <!-- Small central routing accents -->
  <g stroke="#A67AF4" stroke-width="2.3">
    <path d="M79 53 L84 49"/>
    <path d="M86 54 L91 50"/>
    <path d="M60 91 L56 95"/>
  </g>

  <!-- Restrained Azure-blue motion accents -->
  <g stroke="#5EA0EF" stroke-width="2.8">
    <path d="M107 31 L112 27"/>
    <path d="M113 36 L120 35"/>
    <path d="M35 109 L40 105"/>
  </g>

  <!-- Yellow sketchnote emphasis -->
  <g stroke="#FFCB3D" stroke-width="3">
    <path d="M64 17 L68 12"/>
    <path d="M69 23 L76 21"/>
    <path d="M30 98 L34 103"/>
    <path d="M118 109 L123 113"/>
  </g>

  <!-- Subtle handwritten marker dashes -->
  <g stroke="#773ADC" stroke-width="2" opacity=".6">
    <path d="M19 45 L22 40"/>
    <path d="M58 43 L61 48"/>
    <path d="M97 116 L102 113"/>
  </g>
</svg>

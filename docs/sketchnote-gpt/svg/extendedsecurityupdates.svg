<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>ExtendedSecurityUpdates (sketch)</title>
  
  <desc>Hand-drawn Azure-blue protective shield with a blank interior and an overlapping green circular update badge containing two white rotating arrows.</desc>

  <!-- Main protective shield -->
  <path d="M56 5            C48 5 43 18 13 19            Q7 19 7 25            L7 58            C7 86 29 107 54 123            Q56 125 59 123            C84 107 106 86 106 58            L106 25            Q106 19 100 19            C70 18 65 5 56 5Z" fill="#0078D4" stroke="#243447" stroke-width="3.8"/>

  <!-- Inner blue shield field, intentionally blank -->
  <path d="M56 11            C47 14 40 24 17 25            L17 58            C17 81 35 101 56 115            C78 101 96 81 96 58            L96 25            C73 24 65 14 56 11Z" fill="#5EA0EF" stroke="#243447" stroke-width="2.5"/>

  <!-- Green circular security update badge -->
  <path d="M85 54            C105 53 121 69 122 89            C123 109 107 125 87 125            C67 126 51 110 51 90            C51 70 66 55 85 54Z" fill="#76BC2D" stroke="#243447" stroke-width="3.8"/>

  <!-- Counterclockwise update arrow: lower-left sweep -->
  <path d="M72 82            C69 87 68 93 70 99            C73 110 83 116 94 114" fill="none" stroke="#243447" stroke-width="7" stroke-linecap="round"/>

  <path d="M72 82            C69 87 68 93 70 99            C73 110 83 116 94 114" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Upper-left arrowhead -->
  <path d="M63 83            L74 76            L81 88" fill="none" stroke="#243447" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M63 83            L74 76            L81 88" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Clockwise update arrow: upper-right sweep -->
  <path d="M80 68            C91 65 102 70 107 80            C111 87 111 95 107 102" fill="none" stroke="#243447" stroke-width="7" stroke-linecap="round"/>

  <path d="M80 68            C91 65 102 70 107 80            C111 87 111 95 107 102" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Lower-right arrowhead -->
  <path d="M98 97            L107 108            L117 98" fill="none" stroke="#243447" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M98 97            L107 108            L117 98" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Versions (sketch)</title>
  
  <desc>Two overlapping Azure-blue and cyan version windows with darker header bars, uneven hand-drawn outlines, and subtle marker highlights on a transparent background.</desc>

  <defs>
    <linearGradient id="backBlue" x1="53" y1="30" x2="53" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".5" stop-color="#4093E6"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="frontCyan" x1="72" y1="59" x2="72" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".55" stop-color="#32D2F2"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Rear version window -->
  <path d="M9 10            Q9 7 13 7            L101 8            Q105 8 105 12            L105 85            Q105 89 101 89            L13 89            Q9 89 9 85Z" fill="url(#backBlue)" stroke="#075A9E" stroke-width="3.5"/>

  <!-- Rear dark Azure header -->
  <path d="M9 12            Q9 7 13 7            L101 8            Q105 8 105 12            L105 29            Q57 30 9 29Z" fill="#0078D4" stroke="#075A9E" stroke-width="2.6"/>

  <!-- Rear window marker highlight -->
  <path d="M15 35            Q15 56 16 75" stroke="#A9D7FF" stroke-width="2.5" opacity=".8"/>

  <!-- Subtle hand-drawn rear header marks -->
  <g fill="#B7E3FF" opacity=".85">
    <path d="M18 17 Q21 15 24 17 Q25 20 22 22 Q18 22 18 19Z"/>
    <path d="M30 17 Q33 15 36 17 Q37 20 34 22 Q30 22 30 19Z"/>
  </g>

  <!-- Front version window -->
  <path d="M26 40            Q26 36 30 36            L117 37            Q121 37 121 41            L121 116            Q121 120 117 120            L30 120            Q26 120 26 116Z" fill="url(#frontCyan)" stroke="#087F9C" stroke-width="3.6"/>

  <!-- Front darker teal header -->
  <path d="M26 41            Q26 36 30 36            L117 37            Q121 37 121 41            L121 57            Q74 58 26 57Z" fill="#198AB3" stroke="#087F9C" stroke-width="2.6"/>

  <!-- Header sketch details -->
  <g fill="#B9F3FA" opacity=".9">
    <path d="M36 46 Q39 44 42 46 Q43 49 40 51 Q36 51 36 48Z"/>
    <path d="M48 46 Q51 44 54 46 Q55 49 52 51 Q48 51 48 48Z"/>
  </g>

  <!-- Hand-ink highlight along foreground panel -->
  <path d="M33 65            Q32 84 33 107" stroke="#B6F4FC" stroke-width="2.8" opacity=".85"/>

  <path d="M39 114            Q72 116 108 114" stroke="#A2EDF7" stroke-width="2.2" opacity=".7"/>

  <!-- Minimal version-change lines -->
  <g stroke="#087FAD" stroke-width="3" opacity=".55">
    <path d="M45 74 Q62 73 79 74"/>
    <path d="M45 85 Q72 84 97 85"/>
    <path d="M45 96 Q58 95 70 96"/>
  </g>

  <!-- Subtle hand-drawn version marker -->
  <path d="M100 91            L106 97            L115 84" stroke="#FFFFFF" stroke-width="3.3" opacity=".85"/>

  <!-- Restrained yellow sketchnote sparkle -->
  <path d="M112 12            L115 7            L118 12            L123 15            L118 18            L115 23            L112 18            L107 15Z" fill="#FFD966" stroke="#D49A20" stroke-width="1.5"/>

  <!-- Small uneven marker accent strokes -->
  <g stroke="#0078D4" stroke-width="2.2" opacity=".8">
    <path d="M5 98 L13 95"/>
    <path d="M7 106 L15 103"/>
    <path d="M110 27 L115 25"/>
  </g>
</svg>

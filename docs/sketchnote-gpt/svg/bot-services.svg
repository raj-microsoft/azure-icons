<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Bot Services (sketch)</title>
  
  <desc>
    Hand-drawn Azure Bot Services icon featuring a blue circular
    badge, white interior, cyan angular bot brackets and two eyes.
    Uneven marker outlines, original Azure colors, subtle yellow
    accents, transparent background, and editable vector paths.
  </desc>

  <defs>
    <radialGradient id="botBlue" cx="42%" cy="36%" r="75%">
      <stop offset="0" stop-color="#6BB9F2"/>
      <stop offset=".66" stop-color="#61B4F1"/>
      <stop offset=".86" stop-color="#47A8EF"/>
      <stop offset="1" stop-color="#1B93EB"/>
    </radialGradient>
  </defs>

  <!-- Outer hand-drawn Azure-blue badge -->
  <path d="M64 9            C81 8 98 16 109 29            C120 42 122 59 118 76            C115 94 101 109 85 117            C69 124 49 121 34 113            C18 104 9 87 8 69            C6 51 13 34 26 22            C37 12 49 9 64 9Z" fill="url(#botBlue)" stroke="#1678C8" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slightly irregular marker highlight -->
  <path d="M20 43            C28 25 44 17 61 16            M93 24            Q105 33 110 46" stroke="#B8E5FF" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>

  <!-- White inner circular field -->
  <path d="M64 20            C78 19 92 25 101 36            C111 47 113 62 109 77            C105 93 93 104 79 109            C64 115 48 111 36 103            C23 94 18 80 19 65            C19 49 26 36 38 28            C46 23 55 20 64 20Z" fill="#FFFFFF" stroke="#278ED5" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle interior sketched arc -->
  <path d="M29 49            Q37 33 52 29            M86 31            Q96 37 101 49" stroke="#D7F0FF" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>

  <!-- Upper-right angular bot bracket -->
  <path d="M53 37            Q52 34 55 34            L88 34            Q94 34 94 40            L94 79            Q94 82 91 82            L87 82            Q84 82 84 79            L84 45            Q84 44 82 44            L55 44            Q52 44 52 41            Z" fill="#32BEDD" stroke="#087FA6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Lower-left angular bot bracket -->
  <path d="M38 48            Q41 48 41 51            L41 86            Q41 88 43 88            L78 88            Q81 88 81 91            L81 95            Q81 98 78 98            L38 98            Q32 98 32 92            L32 51            Q32 48 35 48            Z" fill="#32BEDD" stroke="#087FA6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Hand-drawn bracket highlight strokes -->
  <path d="M57 39 L87 39            M89 48 L89 70" stroke="#A7F1FC" stroke-width="1.9" stroke-linecap="round" opacity=".9"/>

  <path d="M36 55 L36 87            M45 93 L72 93" stroke="#A7F1FC" stroke-width="1.9" stroke-linecap="round" opacity=".9"/>

  <!-- Left cyan bot eye -->
  <path d="M54 60            C59 59 63 63 63 68            C63 73 59 77 54 77            C49 77 45 73 45 68            C45 63 49 60 54 60Z" fill="#32BEDD" stroke="#087FA6" stroke-width="1.8"/>

  <!-- Right cyan bot eye -->
  <path d="M75 60            C80 59 84 63 84 68            C84 73 80 77 75 77            C70 77 66 73 66 68            C66 63 70 60 75 60Z" fill="#32BEDD" stroke="#087FA6" stroke-width="1.8"/>

  <!-- Small eye reflections -->
  <path d="M51 65 Q53 63 55 64            M72 65 Q74 63 76 64" stroke="#E8FCFF" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Restrained yellow sketchnote sparkle -->
  <path d="M111 12 L114 6            M117 17 L123 15            M113 21 L118 25" stroke="#F4C542" stroke-width="2.7" stroke-linecap="round"/>

  <!-- Small hand-drawn accent -->
  <path d="M8 99 L4 103            M13 104 L11 110" stroke="#F4C542" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Minimal annotation dots -->
  <circle cx="18" cy="17" r="2" fill="#32BEDD"/>
  <circle cx="117" cy="103" r="2" fill="#F4C542"/>
  <circle cx="105" cy="117" r="1.8" fill="#32BEDD"/>
</svg>

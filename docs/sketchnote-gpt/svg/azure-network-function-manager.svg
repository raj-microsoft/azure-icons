    <path d="M91 114 Q64 129 37 114"/>
    <path d="M22 100 C15 89 12 79 12 69 C12 42 28 20 51 15"/>
  </g>

  <g fill="none" stroke="#37C2B1" stroke-width="3.4" stroke-linecap="round">

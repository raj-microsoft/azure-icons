<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Data Shares (sketch)</title>
  
  <desc>
    Hand-drawn Azure-blue database cylinder with a cyan
    elliptical opening and two branching data-sharing
    connections. Original Azure colours, uneven marker
    outlines, subtle yellow accents, and transparent background.
  </desc>

  <defs>
    <linearGradient id="databaseBlue" x1="10" y1="67" x2="83" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset="0.48" stop-color="#0078D4"/>
      <stop offset="0.78" stop-color="#0071C8"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
    <linearGradient id="topCyan" x1="21" y1="22" x2="70" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Rear database cylinder -->
  <path d="     M10 28     C10 18 27 12 46 12     C66 12 83 18 83 28     L83 101     C83 112 66 118 46 118     C26 118 10 112 10 101     Z" fill="url(#databaseBlue)" stroke="#164F80" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Hand-drawn top rim -->
  <path d="     M10 28     C10 17 27 12 46 12     C66 12 83 18 83 28     C83 39 66 45 46 45     C26 45 10 38 10 28     Z" fill="#E8E8E8" stroke="#165A88" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cyan data surface -->
  <path d="     M20 27     C20 21 32 18 46 18     C61 18 73 22 73 27     C73 33 61 36 46 36     C31 36 20 33 20 27     Z" fill="url(#topCyan)" stroke="#138CB6" stroke-width="2" stroke-linejoin="round"/>

  <!-- Inner elliptical depth -->
  <path d="     M26 32     C32 29 39 28 46 28     C55 28 63 30 68 32     C62 35 54 36 46 36     C37 36 30 35 26 32     Z" fill="#198AB3" opacity="0.92"/>

  <!-- Uneven sketch highlights -->
  <path d="M15 47 Q14 72 15 94" stroke="#58C9F5" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>

  <path d="M22 106 Q43 116 67 108" stroke="#5CC9EF" stroke-width="2" stroke-linecap="round" opacity="0.72"/>

  <path d="M27 23 Q41 17 58 22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Data-sharing branch connections -->
  <path d="     M83 65     L96 65     L109 35" stroke="#949494" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="     M96 65     L109 95" stroke="#949494" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slightly offset sketch line -->
  <path d="     M86 61     L98 61     L106 44" stroke="#C3C3C3" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Upper sharing node -->
  <path d="     M120 35     C120 42 115 47 109 47     C103 47 98 42 98 35     C98 29 103 24 109 24     C115 24 120 29 120 35     Z" fill="#FFFFFF" stroke="#32BEDD" stroke-width="4" stroke-linejoin="round"/>

  <!-- Lower sharing node -->
  <path d="     M120 95     C120 102 115 107 109 107     C103 107 98 102 98 95     C98 89 103 84 109 84     C115 84 120 89 120 95     Z" fill="#FFFFFF" stroke="#32BEDD" stroke-width="4" stroke-linejoin="round"/>

  <!-- Small hand-drawn node highlights -->
  <path d="M104 31 Q108 27 113 31" stroke="#B5F1FA" stroke-width="2" stroke-linecap="round"/>

  <path d="M104 91 Q108 87 113 91" stroke="#B5F1FA" stroke-width="2" stroke-linecap="round"/>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4C542" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M91 20 L94 14"/>
    <path d="M100 18 L105 13"/>
    <path d="M124 52 L127 57"/>
    <path d="M123 112 L126 117"/>
  </g>

  <!-- Small handwritten-style motion marks -->
  <path d="M87 56 Q91 53 95 55" stroke="#32BEDD" stroke-width="2" stroke-linecap="round"/>

  <path d="M88 74 Q92 77 95 75" stroke="#32BEDD" stroke-width="2" stroke-linecap="round"/>

  <!-- Sketch accent dots -->
  <circle cx="96" cy="13" r="1.8" fill="#F4C542"/>
  <circle cx="123" cy="77" r="2" fill="#F4C542"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Multifactor Authentication (sketch)</title>
  
  <desc>Azure-blue security padlock with an organic shield body, a cyan user silhouette, uneven marker outlines, and restrained yellow accents.</desc>

  <defs>
    <linearGradient id="lockBlue" x1="64" y1="33" x2="64" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#1A508B"/>
    </linearGradient>

    <linearGradient id="userCyan" x1="64" y1="44" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#40C4F5"/>
      <stop offset="1" stop-color="#0095E6"/>
    </linearGradient>

    <clipPath id="shieldClip">
      <path d="M35 36                Q64 30 93 36                C106 38 113 46 113 57                C114 83 100 106 77 120                Q64 128 51 120                C28 106 14 83 15 57                C15 46 22 38 35 36Z"/>
    </clipPath>
  </defs>

  <!-- Padlock shackle -->
  <path d="M31 39            C31 20 45 7 64 7            C83 7 97 20 97 39" stroke="#174C85" stroke-width="10"/>

  <path d="M36 37            C36 22 48 12 64 12            C80 12 92 22 92 37" stroke="#215694" stroke-width="5.5"/>

  <!-- Hand-drawn shackle highlight -->
  <path d="M40 27 Q47 14 61 14" stroke="#78B7EA" stroke-width="2.5" opacity=".85"/>

  <!-- Organic shield body -->
  <path d="M35 36            Q64 30 93 36            C106 38 113 46 113 57            C114 83 100 106 77 120            Q64 128 51 120            C28 106 14 83 15 57            C15 46 22 38 35 36Z" fill="url(#lockBlue)" stroke="#143F73" stroke-width="3.5"/>

  <!-- Inset shield sketch -->
  <path d="M35 43            Q64 37 93 43            Q106 46 106 58            C106 83 94 101 73 115            Q64 121 55 115            C34 101 22 83 22 58            Q22 46 35 43Z" stroke="#5DA6E2" stroke-width="1.8" opacity=".7"/>

  <!-- User profile clipped inside the shield -->
  <g clip-path="url(#shieldClip)">

    <!-- Subtle silhouette shadow -->
    <ellipse cx="65" cy="59" rx="18" ry="17" fill="#004795" opacity=".42"/>

    <!-- Head -->
    <path d="M64 43              C74 43 82 51 82 61              C82 71 74 79 64 79              C54 79 46 71 46 61              C46 51 54 43 64 43Z" fill="url(#userCyan)" stroke="#087FC7" stroke-width="2.4"/>

    <!-- Head highlight -->
    <path d="M54 55 Q57 48 65 48" stroke="#B4F0FF" stroke-width="2.6" opacity=".9"/>

    <!-- Shoulders and torso shadow -->
    <path d="M64 82              C43 82 27 95 27 117              Q64 142 101 117              C101 95 85 82 64 82Z" fill="#004795" opacity=".38"/>

    <!-- Rounded user torso -->
    <path d="M64 86              C43 86 32 101 32 120              Q64 139 96 120              C96 101 85 86 64 86Z" fill="url(#userCyan)" stroke="#087FC7" stroke-width="2.4"/>

    <!-- Shoulder marker highlights -->
    <path d="M40 106 Q45 93 58 92              M74 92 Q84 96 88 106" stroke="#A8ECFF" stroke-width="2.4" opacity=".8"/>
  </g>

  <!-- Loose outline accents -->
  <path d="M18 60 Q18 82 34 101            M40 108 Q49 118 60 123" stroke="#0B4178" stroke-width="1.7" opacity=".65"/>

  <path d="M108 64 Q107 87 91 103" stroke="#79B9EE" stroke-width="2" opacity=".7"/>

  <!-- Sketchnote yellow verification accents -->
  <path d="M104 24 L110 18            M110 32 L119 29            M111 40 L120 41" stroke="#FFD65A" stroke-width="2.8"/>

  <!-- Small authentication sparkle -->
  <path d="M17 22 L17 32            M12 27 L22 27" stroke="#FFD65A" stroke-width="2.6"/>

  <circle cx="17" cy="27" r="1.8" fill="#FFE58A"/>

  <!-- Hand-drawn verification tick -->
  <path d="M101 109            L106 114            L116 102" stroke="#FFD65A" stroke-width="3.2"/>

  <!-- Small marker ticks -->
  <path d="M25 113 L20 118            M113 88 L119 91" stroke="#FFD65A" stroke-width="2.3"/>

</svg>

  <path d="M 16 5        Q 16 2 20 2        L 65 2        Q 69 2 69 7        L 69 46        C 61 53 57 61 56 72        Q 54 83 60 93        L 40 113        L 9 113        Q 5 113 5 109        L 5 14        Q 5 5 16 5 Z" fill="#238BD5" stroke="#203746" stroke-width="3.5"/>


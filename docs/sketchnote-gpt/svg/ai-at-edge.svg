  <path d="M 29 24        C 32 23 35 25 35 29        C 35 33 32 35 29 35        C 25 35 23 32 24 29        Q 24 25 29 24 Z" fill="#D9F4FF" stroke="#203746" stroke-width="2.3"/>

  <path d="M 48 24        Q 54 24 54 29        Q 54 35 48 35        Q 42 34 43 29        Q 43 25 48 24 Z" fill="#D9F4FF" stroke="#203746" stroke-width="2.3"/>


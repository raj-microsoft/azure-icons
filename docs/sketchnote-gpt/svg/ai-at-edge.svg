<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>AI at Edge (sketch)</title>

  
  <desc id="desc">
    Hand-drawn Azure AI at Edge icon with a blue rectangular
    edge device, six pale status dots, and a cyan magnifying
    glass overlapping its lower-right side. The magnifying
    lens contains a plain blue center without symbols.
  </desc>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>VM Images (Classic) (sketch)</title>
  
  <desc>Hand-drawn blue computer monitor displaying a three-dimensional virtual machine image, with yellow marker accents.</desc>

  <defs>
    <linearGradient id="screenFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="standBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1490DF"/>
      <stop offset="1" stop-color="#1F56A3"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn monitor frame -->
  <path d="M13 13.5 Q12 12 15 12 L112 12 Q116 12.5 115.5 16            L115 87 Q115 91 111 91 L16 91 Q12 90 12.5 86 Z" fill="url(#screenFrame)" stroke="#005A9E" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Inner display -->
  <path d="M19 19 L108.5 18.5 Q110 19 110 21            L109.5 83 Q109 85 107 85            L20 85 Q18 84 18.5 82 L18.5 21 Q18 19 19 19 Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Screen corner marker details -->
  <path d="M25 27 L25 23 Q25 22 27 22 L34 22" fill="none" stroke="#5EA0EF" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M103 22 L104 22 Q106 22 106 24 L106 29" fill="none" stroke="#5EA0EF" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M25 75 L25 79 Q25 80 28 80 L34 80" fill="none" stroke="#5EA0EF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M101 80 L104 80 Q106 80 106 77 L106 73" fill="none" stroke="#5EA0EF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Virtual machine cube: top face -->
  <path d="M43 45 L64 32.5 L86 45 L64 58 Z" fill="#83B9F9" stroke="#0078D4" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Cube left face -->
  <path d="M43 45 L64 58 L64 82 L43 69 Z" fill="#5EA0EF" stroke="#0078D4" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Cube right face -->
  <path d="M64 58 L86 45 L86 69 L64 82 Z" fill="#0078D4" stroke="#005A9E" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Cube top detail -->
  <path d="M51 45 L64 37.5 L78 45 L64 53 Z" fill="#A8D2FF" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Cube vertical and structural details -->
  <path d="M64 58 L64 81" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M46 48 L46 67 L60 76" fill="none" stroke="#B8DBFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M69 61 L81 54" fill="none" stroke="#B8DBFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small yellow marker accents -->
  <path d="M91 34 L95 30 M94 38 L99 37" fill="none" stroke="#F2C94C" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M34 51 L30 49" fill="none" stroke="#F2C94C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Monitor bottom bezel -->
  <path d="M14 87 Q15 90 19 90 L109 90 Q113 90 114 87" fill="none" stroke="#005A9E" stroke-width="2" stroke-linecap="round"/>

  <!-- Stand neck -->
  <path d="M53 91 L75 91            Q74 99 77 106            Q78 110 83 111            L45 111            Q50 109 51 105            Q54 99 53 91 Z" fill="url(#standBlue)" stroke="#005A9E" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Stand highlights -->
  <path d="M57 95 Q58 103 54 107" fill="none" stroke="#83B9F9" stroke-width="2" stroke-linecap="round"/>
  <path d="M70 96 Q70 102 73 106" fill="none" stroke="#1F56A3" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Base -->
  <path d="M41 111 Q43 108 48 109            L80 109 Q85 109 88 112            L91 117 Q91 119 87 119            L39 119 Q36 118 38 115 Z" fill="url(#standBlue)" stroke="#005A9E" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Base marker highlight -->
  <path d="M46 113 L81 113" fill="none" stroke="#83B9F9" stroke-width="2" stroke-linecap="round"/>

  <!-- Hand-drawn emphasis strokes -->
  <path d="M8 40 L8 31 M8 31 L11 28" fill="none" stroke="#5EA0EF" stroke-width="2" stroke-linecap="round"/>
  <path d="M117 51 L120 48 M119 56 L122 55" fill="none" stroke="#F2C94C" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M27 98 Q31 96 34 98" fill="none" stroke="#5EA0EF" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M96 100 L100 98" fill="none" stroke="#F2C94C" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle hand-drawn contour -->
  <path d="M16 15 Q19 13 23 14 M110 14 Q114 16 113 20" fill="none" stroke="#A8D2FF" stroke-width="1.2" stroke-linecap="round"/>
</svg>

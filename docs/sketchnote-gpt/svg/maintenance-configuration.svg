    <path d="M35 112 L43 120" fill="none" stroke="#D9D9D9" stroke-width="2.5"/>

    <!-- Yellow maintenance accent -->
    <path d="M96 17 L101 10 M108 20 L115 17" fill="none" stroke="#FFD447" stroke-width="3.5"/>

    <!-- Small sketchnote marks -->
    <path d="M12 86 L19 83 M13 96 L20 95" fill="none" stroke="#0078D4" stroke-width="2.5"/>
    <path d="M91 104 L96 99" fill="none" stroke="#FFD447" stroke-width="3"/>

    <!-- Hand-drawn finishing strokes -->
    <path d="M20 17 Q26 12 32 14" fill="none" stroke="#0078D4" stroke-width="2"/>
    <path d="M26 125 Q42 129 53 124" fill="none" stroke="#686868" stroke-width="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Maintenance Configuration (sketch)</title>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Blue maintenance clock -->
    <circle cx="47" cy="47" r="38" fill="#5EA0EF" stroke="#0078D4" stroke-width="4.5"/>
    <circle cx="47" cy="47" r="31" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.5"/>

    <!-- Clock markings -->
    <path d="M47 20 L47 25 M47 69 L47 74              M20 47 L25 47 M69 47 L74 47" fill="none" stroke="#7A7A7A" stroke-width="3"/>
    <path d="M29 29 L33 33 M61 61 L65 65              M65 29 L61 33" fill="none" stroke="#7A7A7A" stroke-width="2.5"/>

    <!-- Clock hands -->
    <path d="M47 29 L47 47 L61 57" fill="none" stroke="#7A7A7A" stroke-width="5"/>
    <circle cx="47" cy="47" r="5" fill="#5E5E5E" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Maintenance wrench -->
    <path d="M75 80 L94 58              Q88 44 98 34              Q106 26 117 31              L106 43 L109 52 L119 54              Q123 41 117 34              Q130 45 120 59              Q111 69 98 64              L79 87" fill="#949494" stroke="#686868" stroke-width="4"/>


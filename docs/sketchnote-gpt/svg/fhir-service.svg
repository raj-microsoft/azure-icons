<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>FHIR Service (sketch)</title>
  
  <desc>Hand-drawn Azure FHIR Service icon with a blue service panel, grey mounting bracket, and orange heart motif with white clinical connection details.</desc>

  <defs>
    <linearGradient id="panelBlue" x1="64" y1="34" x2="64" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="0.18" stop-color="#559CEC"/>
      <stop offset="0.5" stop-color="#3C91E5"/>
      <stop offset="0.84" stop-color="#1380DA"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="heartOrange" x1="64" y1="49" x2="64" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAA21D"/>
      <stop offset="1" stop-color="#EF7100"/>
    </linearGradient>
  </defs>

  <!-- Top bracket / hanger -->
  <path d="M36 29            L36 15            Q36 10 42 10            L86 10            Q92 10 92 15            L92 29            L84 29            L84 18            L44 18            L44 29Z" fill="#A3A3A3" stroke="#6F6F6F" stroke-width="3.4"/>

  <!-- Loose sketchnote bracket accents -->
  <path d="M41 18 Q63 16 86 18            M40 23 L40 28            M88 22 L88 28" stroke="#D4D4D4" stroke-width="2.2" opacity=".85"/>

  <!-- Main blue service panel -->
  <path d="M10 33            Q10 27 16 27            L112 27            Q118 27 118 33            L118 112            Q118 118 112 118            L16 118            Q10 118 10 112Z" fill="url(#panelBlue)" stroke="#155F98" stroke-width="3.8"/>

  <!-- Panel inner marker highlights -->
  <path d="M18 39            L18 107            Q18 111 22 111            L103 111" stroke="#BFE3FF" stroke-width="2.6" opacity=".75"/>

  <path d="M28 36 Q62 34 97 36" stroke="#D8EEFF" stroke-width="2.2" opacity=".8"/>

  <!-- Center heart motif -->
  <path d="M64 91            C64 91 31 69 31 49            C31 39 38 31 49 31            C57 31 63 36 64 44            C66 36 72 31 80 31            C91 31 98 39 98 49            C98 69 64 91 64 91Z" fill="url(#heartOrange)" stroke="#AF5600" stroke-width="3.5"/>

  <!-- Heart highlight -->
  <path d="M40 46            C42 39 47 36 53 37            C58 38 61 41 62 45" stroke="#FFD08A" stroke-width="2.5" opacity=".9"/>

  <!-- White clinical/FHIR link overlay - right arc and node -->
  <path d="M94 47            C96 53 95 60 90 67            C84 75 75 80 65 83" stroke="#FFFFFF" stroke-width="3.2" opacity=".92"/>

  <circle cx="65" cy="83" r="4.8" fill="#FFFFFF" opacity=".95"/>
  <circle cx="65" cy="83" r="2.2" fill="#8CC8F5" opacity=".9"/>

  <!-- White clinical/FHIR link overlay - left braided path -->
  <path d="M51 79            C43 70 37 61 35 54            C33 46 35 40 40 37            C47 33 56 38 66 48" stroke="#FFFFFF" stroke-width="3.2" opacity=".92"/>

  <!-- Small connector capsules -->
  <path d="M49 76            L43 81            M66 48            L71 43" stroke="#FFFFFF" stroke-width="3.2" opacity=".92"/>

  <!-- Little detached pill-like connector marks -->
  <path d="M40 82            Q38 80 40 78            L45 73            Q47 71 49 73            Q51 75 49 77            L44 82            Q42 84 40 82Z" fill="#FFFFFF" opacity=".95"/>

  <path d="M69 46            Q67 44 69 42            L74 37            Q76 35 78 37            Q80 39 78 41            L73 46            Q71 48 69 46Z" fill="#FFFFFF" opacity=".95"/>

  <!-- Tiny sketchnote details -->
  <path d="M23 46 L27 42            M23 55 L29 52            M101 43 L106 39            M103 52 L109 50" stroke="#0078D4" stroke-width="2.3"/>

  <path d="M48 99 L52 94            M59 96 L64 93            M79 96 L83 101" stroke="#FFBD02" stroke-width="2.3" opacity=".95"/>

  <!-- Hand-drawn panel wobble accents -->
  <path d="M13 66 L13 79            M115 70 L115 83            M35 115 L48 115" stroke="#0E5B95" stroke-width="1.8" opacity=".6"/>
</svg>

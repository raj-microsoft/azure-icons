<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>AzureAttestation (sketch)</title>

  
  <desc>
    Hand-drawn Azure Attestation shield in original green tones,
    featuring a white verification seal with a central keyhole-like
    attestation symbol. Uneven marker outlines, subtle Azure-blue
    and yellow accents, transparent background, and editable paths.
  </desc>

  <defs>
    <linearGradient id="shieldGreen" x1="64" y1="5" x2="64" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5E9624"/>
      <stop offset=".52" stop-color="#69A728"/>
      <stop offset="1" stop-color="#76BC2D"/>
    </linearGradient>
  </defs>

  <!-- Main hand-drawn protective shield -->
  <path d="M64 8        C77 8 81 15 92 20        C100 23 108 23 115 24        Q119 25 119 30        L119 61        C119 87 98 105 66 122        Q64 124 61 122        C30 105 9 87 9 61        L9 30        Q9 25 14 24        C23 23 31 23 39 19        C49 14 51 8 64 8Z" fill="url(#shieldGreen)" stroke="#477C22" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Inner shield contour -->
  <path d="M64 16        C76 16 82 23 93 27        C99 29 105 29 110 30        L110 61        C110 82 92 100 65 114        Q64 115 62 114        C36 100 18 82 18 61        L18 31        C25 30 32 29 41 25        C50 21 54 16 64 16Z" fill="none" stroke="#A0D85C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/>

  <!-- Sketch highlight along shield edge -->
  <path d="M20 36        L20 59        C20 75 30 88 42 98" stroke="#C0E88B" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/>

  <path d="M103 79        C96 91 85 101 73 108" stroke="#4A8423" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".65"/>

  <!-- Central white attestation symbol -->
  <!-- Upper certification/keyhole form -->
  <path d="M54 67        C54 58 53 51 50 45        C47 41 45 37 47 31        C49 23 56 21 64 21        C72 21 79 23 81 31        C83 37 81 41 78 45        C75 51 74 58 74 67        Z" fill="#FFFFFF" stroke="#E6F2E0" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Small hand-drawn highlight -->
  <path d="M53 35        C54 30 58 27 63 27" stroke="#D5ECC8" stroke-width="2.3" stroke-linecap="round" fill="none"/>

  <!-- First horizontal certificate bar -->
  <path d="M41 73        Q41 69 46 69        L82 69        Q87 69 87 73        L87 81        L41 81Z" fill="#FFFFFF" stroke="#E6F2E0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Second horizontal certificate bar -->
  <path d="M45 87        L83 87        L83 91        Q83 95 79 95        L49 95        Q45 95 45 91Z" fill="#FFFFFF" stroke="#E6F2E0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand-drawn white symbol details -->
  <g stroke="#C5E4B7" stroke-width="1.6" stroke-linecap="round" opacity=".75">
    <path d="M48 74 L58 74"/>
    <path d="M69 74 L79 74"/>
    <path d="M52 90 L76 90"/>
  </g>

  <!-- Subtle green marker imperfections -->
  <g stroke="#4B8426" stroke-width="1.8" stroke-linecap="round" opacity=".65">
    <path d="M29 32 L35 30"/>
    <path d="M94 34 L101 36"/>
    <path d="M26 75 L29 81"/>
    <path d="M90 96 L85 101"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#E9BF4B" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <path d="M31 14 L27 8"/>
    <path d="M39 10 L38 4"/>

    <path d="M97 14 L102 8"/>
    <path d="M104 20 L111 16"/>

    <path d="M5 83 L0 87"/>
    <path d="M11 93 L6 99"/>

    <path d="M105 105 L110 111"/>
    <path d="M96 112 L99 119"/>

  </g>

  <!-- Tiny Azure-blue trust accents -->
  <g stroke="#0078D4" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M18 12 L22 16"/>
    <path d="M111 42 L117 44"/>
    <path d="M47 118 L52 121"/>
  </g>

  <!-- Small sketchnote sparkle marks -->
  <g fill="#F1CB5B">
    <path d="M15 20 L17 16 L19 20 L17 24Z"/>
    <path d="M113 91 L115 87 L117 91 L115 95Z"/>
    <circle cx="27" cy="110" r="1.8"/>
    <circle cx="107" cy="7" r="1.6"/>
  </g>

</svg>

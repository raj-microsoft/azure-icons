<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>eBooks (sketch)</title>
  

  <!-- Azure-blue book cover -->
  <path d="M9 29 Q9 24 15 24 L113 24 Q119 24 119 30 L119 111 Q118 116 113 116 L15 116 Q9 116 9 110 Z" fill="#0078D4" stroke="#123E60" stroke-width="3.5"/>

  <!-- Dark-blue right cover -->
  <path d="M64 25 L113 25 Q118 25 118 31 L118 110 Q118 115 113 115 L64 115 Z" fill="#005BA1" stroke="#123E60" stroke-width="2"/>

  <!-- Left white page -->
  <path d="M64 30 Q60 20 49 20 L23 20 Q19 20 19 24 L19 97 Q19 101 23 101 L49 101 Q59 101 64 116 Z" fill="#F2F2F2" stroke="#4A5660" stroke-width="3.2"/>

  <!-- Blank right page -->
  <path d="M64 30 Q69 20 79 20 L105 20 Q109 20 109 24 L109 97 Q109 101 105 101 L79 101 Q69 101 64 116 Z" fill="#E8E8E8" stroke="#4A5660" stroke-width="3.2"/>

  <!-- Central book fold -->
  <path d="M64 30 Q62 54 64 77 Q65 96 64 116" stroke="#123E60" stroke-width="2.8"/>

  <!-- Subtle inner fold shadows -->
  <path d="M59 35 Q57 68 60 99 M69 34 Q71 68 68 99" stroke="#9E9E9E" stroke-width="1.6" opacity=".6"/>

  <!-- Six handwritten lines on left page only -->
  <g stroke="#777777" stroke-width="4" stroke-linecap="round">
    <path d="M28 34 Q40 33 53 34"/>
    <path d="M28 45 Q41 44 53 45"/>
    <path d="M28 56 Q41 55 53 56"/>
    <path d="M28 67 Q40 66 53 67"/>
    <path d="M28 78 Q41 77 53 78"/>
    <path d="M28 89 Q35 88 41 89"/>
  </g>

  <!-- Small book-edge details -->
  <path d="M22 106 Q39 104 54 108 M74 108 Q89 104 106 106" stroke="#123E60" stroke-width="1.7" opacity=".55"/>

  <!-- Cover edge marker strokes -->
  <path d="M13 33 Q12 29 16 28 M118 99 L118 110 Q118 116 112 116 M10 100 L10 110 Q10 116 16 116" stroke="#123E60" stroke-width="2" opacity=".7"/>

  <!-- Restrained sketchnote accents outside the book -->
  <path d="M13 17 L18 12 M115 17 L120 12" stroke="#FFCA28" stroke-width="2.5"/>

  <!-- Tiny Azure-blue motion marks -->
  <path d="M5 46 L2 43 M122 48 L125 45" stroke="#0078D4" stroke-width="2"/>
</svg>

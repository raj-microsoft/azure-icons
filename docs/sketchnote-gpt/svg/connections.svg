<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Connections (sketch)</title>

  
  <desc>
    Azure Connections icon recreated as a hand-drawn sketchnote.
    An irregular Azure-blue circular border surrounds two
    interlocking green connection chevrons. Original Azure
    blue and green colours, subtle yellow highlights,
    uneven marker strokes, and transparent background.
  </desc>

  <defs>
    <radialGradient id="connectionBlue" cx="44%" cy="38%" r="72%">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".58" stop-color="#3990E4"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>

    <linearGradient id="connectionGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86D633"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn Azure-blue circular frame -->
  <path d="     M64 7     C79 6 95 13 105 24     C116 36 121 49 121 64     C122 80 115 96 103 107     C92 117 77 122 63 121     C47 121 33 115 22 104     C11 93 6 78 7 63     C7 47 13 33 24 22     C35 12 49 7 64 7     Z" fill="url(#connectionBlue)" stroke="#155EA1" stroke-width="3.4"/>

  <!-- Uneven inner ring / white center -->
  <path d="     M64 17     C77 16 90 22 99 31     C108 40 112 52 111 65     C111 78 105 90 96 99     C87 108 76 112 63 111     C50 111 38 106 29 97     C20 88 16 76 17 63     C17 50 22 38 31 29     C40 21 52 17 64 17     Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.2"/>


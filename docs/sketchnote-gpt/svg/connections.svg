<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Connections (sketch)</title>
  
  <desc>Hand-drawn Azure-blue circular frame containing two separate, inward-facing green chevrons, with flat fills and irregular charcoal marker outlines.</desc>

  <!-- Azure-blue circular frame -->
  <path d="M64 7        C80 6 95 13 106 25        C117 37 121 50 121 65        C121 81 115 96 103 107        C92 118 77 122 63 121        C47 121 32 115 21 103        C11 92 6 78 7 63        C7 47 13 32 25 21        C36 11 49 7 64 7 Z" fill="#3990E4" stroke="#243447" stroke-width="3.8"/>

  <!-- White circular center -->
  <path d="M64 17        C77 16 90 22 99 31        C108 40 112 52 111 65        C111 78 105 90 96 99        C87 108 76 112 63 111        C50 111 38 106 29 97        C20 88 16 76 17 63        C17 50 22 38 31 29        C40 21 52 17 64 17 Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.6"/>

  <!-- Upper-right inward chevron: two arms, one open vertex -->
  <path d="M87 33        Q89 31 91 34        L94 37        Q96 39 94 41        L75 61        L94 81        Q96 83 94 85        L91 88        Q89 90 87 88        L65 64        Q62 61 65 58        Z" fill="#5E9624" stroke="#243447" stroke-width="3.5"/>

  <!-- Flat green face on right chevron lower arm -->
  <path d="M75 61 L94 81        Q96 83 94 85        L91 88        Q89 90 87 88        L70 69 Z" fill="#86D633" stroke="#243447" stroke-width="1.7"/>

  <!-- Lower-left inward chevron: separate from right chevron -->
  <path d="M37 45        Q39 43 41 45        L63 69        Q66 72 63 75        L41 98        Q39 101 37 99        L34 96        Q32 94 34 92        L53 72        L34 52        Q32 50 34 48        Z" fill="#5E9624" stroke="#243447" stroke-width="3.5"/>

  <!-- Flat green face on left chevron lower arm -->
  <path d="M53 72 L61 80        L41 98        Q39 101 37 99        L34 96        Q32 94 34 92 Z" fill="#86D633" stroke="#243447" stroke-width="1.7"/>

  <!-- Restrained sketchnote accents -->
  <g stroke="#F4C542" fill="none" stroke-linecap="round">
    <path d="M55 43 L58 38" stroke-width="2.7"/>
    <path d="M69 42 L73 38" stroke-width="2.5"/>
    <path d="M66 94 L69 98" stroke-width="2.5"/>
  </g>
</svg>

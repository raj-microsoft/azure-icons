  <!-- Left chevron bright lower facet -->
  <path d="     M51 73     L59 81     L41 99     L35 94     Z" fill="#86D633" stroke="#5E9624" stroke-width="1.5"/>

  <!-- Right connection chevron -->
  <path d="     M88 28     Q90 26 92 29     L97 34     Q99 36 96 39     L77 59     L96 79     Q98 81 96 83     L90 89     Q88 91 86 88     L58 61     Q56 59 59 56     Z" fill="#5E9624" stroke="#426F1D" stroke-width="3.7"/>

  <!-- Right chevron bright facet -->
  <path d="     M77 59     L69 67     L89 86     L94 80     Z" fill="#86D633" stroke="#5E9624" stroke-width="1.5"/>

  <!-- Hand-drawn green marker accents -->
  <path d="M37 49 L42 54" stroke="#B8F078" stroke-width="2.5"/>

  <path d="M86 36 L91 33" stroke="#B8F078" stroke-width="2.5"/>

  <path d="M41 95 L48 88" stroke="#B8F078" stroke-width="2.1"/>

  <!-- Subtle yellow sketchnote highlights -->
  <path d="M62 43 L65 37" stroke="#F4C542" stroke-width="2.8"/>

  <path d="M70 43 L75 39" stroke="#F4C542" stroke-width="2.5"/>

  <path d="M63 91 L67 97" stroke="#F4C542" stroke-width="2.5"/>


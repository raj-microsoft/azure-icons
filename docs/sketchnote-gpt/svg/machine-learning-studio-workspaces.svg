<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Machine Learning Studio Workspaces (sketch)</title>

  
  <desc>Hand-drawn Azure Machine Learning Studio workspace with a blue six-tile dashboard behind a cyan laboratory flask, preserving the original icon's colors and symbolism.</desc>

  <defs>
    <linearGradient id="flaskCyan" x1="19" y1="48" x2="72" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".35" stop-color="#31D1F3"/>
      <stop offset=".7" stop-color="#29BADE"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
    <linearGradient id="flaskLiquid" x1="29" y1="82" x2="65" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF8FF"/>
    </linearGradient>
  </defs>

  <!-- Workspace dashboard background -->
  <path d="M43 6            Q42 5 46 5            L119 5            Q123 5 123 9            L123 68            Q123 71 120 71            L43 71            Q40 71 40 68            L40 9            Q40 6 43 6Z" fill="#E6E6E6" stroke="#4C7097" stroke-width="3.5"/>


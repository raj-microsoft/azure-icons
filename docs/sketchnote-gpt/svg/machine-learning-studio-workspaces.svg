  <path d="M68 44            L95 44            L95 70            L68 70Z" fill="#83B9F9" stroke="#377EB8" stroke-width="2.2"/>

  <path d="M95 44            L122 44            L122 70            L95 70Z" fill="#0078D4" stroke="#075AAB" stroke-width="2.2"/>


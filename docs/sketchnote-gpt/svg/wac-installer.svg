<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>WAC Installer (sketch)</title>
  
  <desc>Grey server tower with two cyan indicators, overlapping blue toolbox with dark handle and white latch, and a single blue download badge.</desc>

  <!-- Server tower -->
  <path d="M14 7 Q14 3 19 3 L76 3 Q81 3 82 8            L82 105 Q81 110 76 110 L19 110            Q14 110 14 105 Z" fill="#ADADAD" stroke="#343941" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Upper server slot -->
  <path d="M25 18 Q25 14 29 14 L64 14            Q69 14 69 19 L69 25            Q69 30 64 30 L29 30            Q25 30 25 25 Z" fill="#003067" stroke="#292F39" stroke-width="2.7" stroke-linejoin="round"/>

  <path d="M34 16 Q39 16 40 21 Q41 26 35 27            Q30 27 30 22 Q30 18 34 16 Z" fill="#50E6FF" stroke="#243947" stroke-width="2"/>

  <!-- Lower server slot -->
  <path d="M25 43 Q25 39 29 39 L64 39            Q69 39 69 44 L69 50            Q69 55 64 55 L29 55            Q25 55 25 50 Z" fill="#003067" stroke="#292F39" stroke-width="2.7" stroke-linejoin="round"/>

  <path d="M34 41 Q39 41 40 46 Q41 51 35 52            Q30 52 30 47 Q30 43 34 41 Z" fill="#50E6FF" stroke="#243947" stroke-width="2"/>

  <!-- Toolbox handle, behind the toolbox body -->
  <path d="M75 80 L75 73 Q75 66 82 66            L105 66 Q112 66 112 73 L112 80            L106 80 L106 74 Q106 72 103 72            L84 72 Q81 72 81 75 L81 80 Z" fill="#353535" stroke="#202831" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Blue toolbox body -->
  <path d="M59 81 Q59 79 63 79            L121 79 Q125 79 125 83            L125 123 Q125 126 121 126            L60 126 Q57 126 57 122            L57 84 Q57 81 59 81 Z" fill="#1684DF" stroke="#263747" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- Upper toolbox lid -->
  <path d="M59 96 Q77 97 92 96            Q110 97 125 96            L125 100 Q109 101 92 100            Q75 101 59 100 Z" fill="#0869BA" stroke="#263747" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- White horizontal toolbox fastening strip -->
  <path d="M59 97 L85 97 L85 101            L59 101 Z" fill="#F5FAFF" stroke="#34414A" stroke-width="1.2" stroke-linejoin="round"/>

  <path d="M100 97 L124 97 L124 101            L100 101 Z" fill="#F5FAFF" stroke="#34414A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Central white toolbox latch -->
  <path d="M85 97 L100 97 L100 105            Q100 107 98 107 L87 107            Q85 107 85 105 Z" fill="#FFFFFF" stroke="#293945" stroke-width="2.3" stroke-linejoin="round"/>

  <!-- Single download badge, overlapping server -->
  <path d="M23 83            C35 82 45 91 45 104            C46 117 36 126 23 126            C10 126 1 117 1 104            C1 92 11 83 23 83 Z" fill="#72ACF3" stroke="#263747" stroke-width="3" stroke-linejoin="round"/>

  <!-- One white downward arrow -->
  <path d="M23 93            Q23 102 23 111            M15 106            L23 114            L31 106" fill="none" stroke="#293945" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M23 93            Q23 102 23 111            M15 106            L23 114            L31 106" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Restrained yellow marker accents -->
  <g fill="none" stroke="#E6B93F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88 17 L93 13"/>
    <path d="M94 24 L99 22"/>
  </g>

  <!-- Subtle uneven sketch retraces along existing edges -->
  <g fill="none" stroke="#3B4650" stroke-width="1.3" stroke-linecap="round" opacity=".8">
    <path d="M17 10 Q16 27 17 41"/>
    <path d="M26 17 Q25 22 26 27"/>
    <path d="M26 44 Q25 49 27 53"/>
    <path d="M61 84 Q60 89 61 94"/>
    <path d="M122 105 Q123 114 122 121"/>
  </g>
</svg>

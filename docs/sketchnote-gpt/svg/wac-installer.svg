<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>WAC Installer (sketch)</title>
  
  <desc>Hand-drawn Azure sketchnote showing a server installation package with two server indicators, a blue installation tray and a downward download arrow.</desc>

  <defs>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4C3C4"/>
      <stop offset="1" stop-color="#979797"/>
    </linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="download" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83B9F9"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Server tower -->
  <path d="M17 13 Q16 8 22 8 L76 8 Q82 8 82 14            L82 102 Q82 108 76 108 L22 108            Q17 108 17 102 Z" fill="url(#server)" stroke="#777777" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Server top highlight -->
  <path d="M23 14 Q47 12 75 14" fill="none" stroke="#E2E1E2" stroke-width="2" stroke-linecap="round"/>

  <!-- First server slot -->
  <path d="M27 27 Q26 22 32 22 L68 22            Q74 22 74 27 Q74 32 68 32            L32 32 Q26 32 27 27 Z" fill="#003067" stroke="#174A78" stroke-width="1.8"/>

  <circle cx="37" cy="27" r="5" fill="#50E6FF"/>
  <circle cx="37" cy="27" r="2" fill="#D5FBFF"/>

  <path d="M47 27 L65 27" fill="none" stroke="#5080A9" stroke-width="2" stroke-linecap="round"/>

  <!-- Second server slot -->
  <path d="M27 53 Q26 48 32 48 L68 48            Q74 48 74 53 Q74 58 68 58            L32 58 Q26 58 27 53 Z" fill="#003067" stroke="#174A78" stroke-width="1.8"/>

  <circle cx="37" cy="53" r="5" fill="#50E6FF"/>
  <circle cx="37" cy="53" r="2" fill="#D5FBFF"/>

  <path d="M47 53 L65 53" fill="none" stroke="#5080A9" stroke-width="2" stroke-linecap="round"/>

  <!-- Additional server details -->
  <path d="M28 73 L70 73 M28 81 L70 81 M28 89 L70 89" fill="none" stroke="#858585" stroke-width="2" stroke-linecap="round"/>

  <!-- Installation platform -->
  <path d="M55 76 Q55 72 60 72 L111 72            Q116 72 116 77 L116 113            L55 113 Z" fill="url(#azure)" stroke="#005BA1" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Platform top edge -->
  <path d="M61 79 Q85 77 110 79" fill="none" stroke="#A6D5FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Installation package / download arrow -->
  <path d="M85 83 L85 99            M76 91 L85 100 L95 91" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Installation base -->
  <path d="M67 104 L104 104" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Tray details -->
  <path d="M55 106 L75 106 M97 106 L116 106" fill="none" stroke="#C4E3FF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Download badge -->
  <path d="M12 76            C12 65 20 58 30 58            C40 58 48 66 48 76            C48 86 40 94 30 94            C20 94 12 86 12 76 Z" fill="url(#download)" stroke="#0078D4" stroke-width="2.5"/>

  <path d="M30 65 L30 82 M23 76 L30 83 L37 76" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Yellow sketchnote accents -->
  <g fill="none" stroke="#E6B93F" stroke-width="2.5" stroke-linecap="round">
    <path d="M96 18 L102 13"/>
    <path d="M106 28 L111 25"/>
    <path d="M9 43 L14 40"/>
    <path d="M108 56 L113 53"/>
    <path d="M44 113 L48 117"/>
  </g>

  <!-- Hand-drawn marker strokes -->
  <g fill="none" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round">
    <path d="M14 19 L11 23"/>
    <path d="M85 12 L91 14"/>
    <path d="M119 86 L122 90"/>
    <path d="M52 119 L61 120"/>
  </g>
</svg>

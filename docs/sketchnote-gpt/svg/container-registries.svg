<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Container Registries (sketch)</title>
  
  <desc id="desc">Hand-drawn Azure-blue cloud behind two stacked gray shipping containers, with uneven marker outlines and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="cloudBlue" x1="18" y1="14" x2="83" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="containerTop" x1="72" y1="51" x2="122" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#999999"/>
      <stop offset="1" stop-color="#767676"/>
    </linearGradient>
    <linearGradient id="containerEdge" x1="65" y1="76" x2="125" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#333132"/>
      <stop offset="1" stop-color="#5B5A5C"/>
    </linearGradient>
  </defs>

  <!-- Azure cloud: organic marker silhouette -->
  <path d="M34 96            C18 96 7 85 7 70            C7 55 18 44 32 43            C36 25 51 13 69 13            C89 13 103 27 105 44            C115 46 122 55 123 66            Q123 78 114 86            L82 96            Z" fill="url(#cloudBlue)" stroke="#125D97" stroke-width="3.3"/>

  <!-- Freehand cloud highlight -->
  <path d="M17 67            Q17 53 35 52            Q42 22 67 22            Q84 21 94 37" stroke="#B5DEFF" stroke-width="3" opacity=".8"/>

  <!-- Cloud sketch contours -->
  <g stroke="#0069B8" stroke-width="1.8" opacity=".7">
    <path d="M14 77 Q21 88 34 88"/>
    <path d="M79 20 Q93 27 96 43"/>
  </g>

  <!-- Upper container: left end face -->
  <path d="M55 59            L70 50            L70 81            L55 88Z" fill="#999999" stroke="#505050" stroke-width="2.7"/>

  <!-- Upper container: main corrugated side -->
  <path d="M70 50            L121 69            L121 90            L70 81Z" fill="url(#containerTop)" stroke="#505050" stroke-width="2.7"/>

  <!-- Upper container top lip -->
  <path d="M55 59            L70 50            L121 69" stroke="#B3B3B3" stroke-width="2.2"/>

  <!-- Upper container ribs -->
  <g fill="none" stroke="#B8B8B8" stroke-width="3">
    <path d="M77 56 L77 81"/>
    <path d="M86 59 L86 83"/>
    <path d="M95 63 L95 85"/>
    <path d="M104 66 L104 87"/>
    <path d="M113 69 L113 89"/>
  </g>

  <!-- Hand-drawn container rib shadows -->
  <g stroke="#555555" stroke-width="1.3" opacity=".7">
    <path d="M80 58 L80 80"/>
    <path d="M89 62 L89 82"/>
    <path d="M98 65 L98 84"/>
    <path d="M107 68 L107 87"/>
  </g>

  <!-- Left end panel details -->
  <g stroke="#C6C6C6" stroke-width="2">
    <path d="M60 62 L60 82"/>
    <path d="M65 59 L65 79"/>
  </g>

  <!-- Dark separator between stacked containers -->
  <path d="M55 88            L70 81            L121 90            L106 98            Z" fill="url(#containerEdge)" stroke="#414141" stroke-width="2.5"/>

  <!-- Lower container: left end face -->
  <path d="M55 92            L70 84            L70 121            L55 115Z" fill="#999999" stroke="#505050" stroke-width="2.8"/>

  <!-- Lower container: front face -->
  <path d="M70 84            L121 94            L121 111            L70 121Z" fill="#767676" stroke="#4D4D4D" stroke-width="2.8"/>

  <!-- Lower container corrugations -->
  <g stroke="#A3A3A3" stroke-width="3">
    <path d="M77 87 L77 119"/>
    <path d="M86 89 L86 117"/>
    <path d="M95 91 L95 115"/>
    <path d="M104 93 L104 113"/>
    <path d="M113 95 L113 111"/>
  </g>

  <!-- Lower container rib shadows -->
  <g stroke="#555555" stroke-width="1.3" opacity=".75">
    <path d="M80 90 L80 117"/>
    <path d="M89 92 L89 115"/>
    <path d="M98 94 L98 113"/>
    <path d="M107 96 L107 111"/>
  </g>

  <!-- Lower left end panel -->
  <g stroke="#B3B3B3" stroke-width="2.2">
    <path d="M60 94 L60 112"/>
    <path d="M65 91 L65 116"/>
  </g>

  <!-- Irregular marker edge accents -->
  <g stroke="#D6D6D6" stroke-width="1.7" opacity=".8">
    <path d="M73 53 L90 59"/>
    <path d="M74 88 L92 91"/>
    <path d="M108 108 L116 106"/>
  </g>

  <!-- Azure-blue sketchnote motion marks -->
  <g stroke="#0078D4" stroke-width="2.5">
    <path d="M24 32 L20 27"/>
    <path d="M33 25 L31 18"/>
    <path d="M112 32 L117 28"/>
    <path d="M116 40 L123 39"/>
  </g>

  <!-- Restrained yellow highlights -->
  <g stroke="#FFCC4D" stroke-width="2.6">
    <path d="M39 103 L35 109"/>
    <path d="M46 106 L44 113"/>
    <path d="M122 80 L127 83"/>
  </g>

  <!-- Small freehand sparkle -->
  <path d="M109 8            Q111 16 119 18            Q111 20 109 28            Q107 20 99 18            Q107 16 109 8Z" fill="#FFCC4D" stroke="#D7A323" stroke-width="1.5"/>

  <!-- Tiny marker dashes -->
  <g stroke="#50E6FF" stroke-width="2">
    <path d="M13 101 L9 105"/>
    <path d="M20 107 L17 112"/>
  </g>
</svg>

  <path d="M63 47        Q69 47 73 51        Q77 53 81 53        L81 68        C81 77 71 85 63 90        C55 85 45 77 45 68        L45 53        Q52 53 57 49        Q60 47 63 47 Z" fill="#50E6FF" stroke="#203746" stroke-width="1.5"/>

  <!-- Small white padlock shackle -->
  <path d="M56 65        L56 60        C56 55 59 52 63 52        C67 52 70 55 70 60        L70 65        L66 65        L66 60        Q66 56 63 56        Q60 56 60 60        L60 65 Z" fill="#F2F2F2" stroke="#203746" stroke-width="1.8"/>

  <!-- Small white padlock body -->
  <path d="M54 64        Q54 62 56 62        L70 62        Q72 62 72 64        L72 75        Q72 77 70 77        L56 77        Q54 77 54 75 Z" fill="#F2F2F2" stroke="#203746" stroke-width="2"/>

  <!-- Clockwise green update arrow:
       arrowhead upper-right, arc around right and bottom -->
  <path d="M101 18        C116 29 124 46 124 64        C124 97 97 123 64 123        C54 123 44 120 35 115" fill="none" stroke="#203746" stroke-width="11"/>

  <path d="M101 18        C116 29 124 46 124 64        C124 97 97 123 64 123        C54 123 44 120 35 115" fill="none" stroke="#86D633" stroke-width="7"/>


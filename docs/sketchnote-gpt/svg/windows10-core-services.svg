<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Windows10 Core Services (sketch)</title>
  
  <desc>Azure blue security gear with a cyan shield and white padlock, surrounded by a green circular update arrow.</desc>

  <defs>
    <linearGradient id="gearBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="shieldCyan" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Green circular update arrow -->
  <path d="M99 24     L108 8 Q109 6 111 8     L123 25 Q125 28 121 29     L115 30     C128 44 132 64 126 82     C118 106 95 121 71 117     C61 115 52 111 45 104" fill="none" stroke="#86D633" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M102 23 L108 10 L119 25" fill="none" stroke="#B4EF76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gear silhouette -->
  <path d="M58 13     L72 13 L78 25     Q84 27 89 30     L102 24 L112 34     L106 47     Q110 53 111 59     L124 65 L124 79     L111 84     Q109 91 105 96     L111 109 L100 119     L87 112     Q81 116 74 117     L69 130 L55 130     L50 117     Q43 115 38 111     L25 117 L15 106     L21 93     Q17 87 16 80     L3 75 L3 61     L16 56     Q18 49 22 44     L16 31 L27 21     L40 27     Q46 23 52 22 Z" fill="url(#gearBlue)" stroke="#005BA1" stroke-width="3.5" stroke-linejoin="round" transform="translate(0,-5)"/>

  <!-- Gear inner circular border -->
  <circle cx="63" cy="65" r="37" fill="#0078D4" stroke="#005BA1" stroke-width="2.5"/>
  <circle cx="63" cy="65" r="32" fill="none" stroke="#78BDF2" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- Security shield -->
  <path d="M63 35     Q76 43 89 43     L88 66     C87 83 72 94 64 99     C55 94 40 83 39 66     L38 43     Q51 43 63 35 Z" fill="url(#shieldCyan)" stroke="#D4FAFF" stroke-width="3.5" stroke-linejoin="round"/>

  <path d="M63 41 Q74 48 83 48     L82 66 C81 79 70 88 63 93     C55 88 45 79 45 66     L44 48 Q54 47 63 41 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".65"/>

  <!-- Padlock shackle -->
  <path d="M53 62 L53 55     Q53 43 63 43     Q74 43 74 55 L74 62" fill="none" stroke="#F2F2F2" stroke-width="6" stroke-linecap="round"/>

  <!-- Padlock body -->
  <path d="M49 59 Q49 56 53 56     L74 56 Q78 56 78 60     L78 78 Q78 82 74 82     L53 82 Q49 82 49 78 Z" fill="#F2F2F2" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Keyhole -->
  <circle cx="63.5" cy="66" r="3.5" fill="#0078D4"/>
  <path d="M62 68 L60.5 74 L66.5 74 L65 68" fill="#0078D4"/>

  <!-- Small yellow security sparkles -->
  <g fill="none" stroke="#E6B93F" stroke-width="2.5" stroke-linecap="round">
    <path d="M23 14 L23 21"/>
    <path d="M19 17.5 L27 17.5"/>
    <path d="M96 100 L96 106"/>
    <path d="M93 103 L99 103"/>
    <path d="M13 92 L17 88"/>
  </g>

  <!-- Hand-drawn marker details -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity=".8">
    <path d="M33 36 L37 33"/>
    <path d="M83 24 L88 27"/>
    <path d="M29 86 L32 90"/>
  </g>

  <g fill="none" stroke="#0078D4" stroke-width="2" stroke-linecap="round">
    <path d="M46 105 L51 108"/>
    <path d="M109 87 L113 84"/>
  </g>
</svg>

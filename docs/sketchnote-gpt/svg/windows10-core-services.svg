<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Windows10 Core Services (sketch)</title>

  
  <desc>
    Hand-drawn Azure-blue gear with a small cyan security
    shield and white padlock, surrounded by a clockwise
    green update arrow. Flat fills, irregular charcoal
    marker outlines, and transparent background.
  </desc>

  <!-- Azure-blue gear silhouette -->
  <path d="M55 4        L68 4        L73 20        Q79 21 85 24        L99 17        L109 27        L102 41        Q106 47 108 53        L121 59        L121 72        L108 77        Q106 85 102 91        L106 102        L96 112        L84 106        Q78 110 72 112        L67 124        L54 124        L48 111        Q42 109 37 105        L25 111        L16 101        L22 89        Q18 83 17 77        L4 72        L4 59        L17 54        Q19 47 23 42        L17 29        L27 19        L40 25        Q45 22 50 20        Z         M63 35        C45 35 31 49 31 67        C31 85 45 99 63 99        C81 99 95 85 95 67        C95 49 81 35 63 35        Z" fill="#4394E7" fill-rule="evenodd" stroke="#203746" stroke-width="3.5"/>

  <!-- Cyan security shield: compact relative to gear -->
  <path d="M62 43        Q68 43 72 47        Q77 49 83 49        Q85 49 85 52        L85 68        C85 80 72 89 64 94        Q63 95 61 94        C53 89 41 80 41 68        L41 52        Q41 49 44 49        Q51 49 55 46        Q58 43 62 43 Z" fill="#32BEDD" stroke="#203746" stroke-width="2.8"/>


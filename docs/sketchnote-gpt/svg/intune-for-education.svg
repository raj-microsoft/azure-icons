<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Intune For Education (sketch)</title>

  
  <desc>
    Hand-drawn Azure-blue desktop monitor connected to a cyan
    mobile device by a horizontal connection line and circular
    cyan-outlined node. The phone contains one right-pointing
    blue arrow. Flat fills, uneven charcoal marker outlines,
    and transparent background.
  </desc>

  <!-- Desktop monitor outer frame -->
  <path d="M8 10            Q5 10 5 14            L5.5 78            Q6 82 10 82            L102 82            Q106 82 106 78            L105.5 14            Q105 10 101 10            Z" fill="#398FE0" stroke="#243447" stroke-width="3.3"/>

  <!-- White monitor display -->
  <path d="M12 17            Q12 16 14 16            L97 16.5            Q99 16.5 99 19            L99 73            Q99 75 97 75            L14 75            Q12 75 12 73            Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.4"/>

  <!-- Monitor stand -->
  <path d="M37 82            L57 82            Q56 93 60 100            Q62 103 67 104            L67 109            L27 109            L27 104            Q33 103 35 99            Q38 93 37 82            Z" fill="#167BC9" stroke="#243447" stroke-width="3"/>

  <!-- Stand base -->
  <path d="M25 104            Q23 104 23 107            L21 112            Q46 113 72 112            L70 107            Q69 104 66 104            Z" fill="#1490DF" stroke="#243447" stroke-width="3"/>

  <!-- Horizontal connection line behind circle and phone -->
  <path d="M58 46            Q72 45.5 85 46            L112 46" stroke="#243447" stroke-width="8.5"/>

  <path d="M58 46            Q72 45.5 85 46            L112 46" stroke="#32BEDD" stroke-width="6"/>

  <!-- Circular connection node: cyan outline, blank center -->
  <path d="M70 46            C70.2 52.5 64.7 58.1 58 58            C51.3 58.1 46 52.7 46 46            C45.9 39.3 51.3 34 58 34            C64.7 33.9 69.9 39.4 70 46            Z" fill="#FFFFFF" stroke="#243447" stroke-width="6.2"/>

  <path d="M70 46            C70.2 52.5 64.7 58.1 58 58            C51.3 58.1 46 52.7 46 46            C45.9 39.3 51.3 34 58 34            C64.7 33.9 69.9 39.4 70 46            Z" stroke="#32BEDD" stroke-width="4"/>

  <!-- Cyan mobile device -->
  <path d="M79 43            Q79 40 83 40            L120 40            Q123 40 123 44            L123 117            Q123 121 119 121            L83 121            Q79 121 79 117            Z" fill="#32BEDD" stroke="#243447" stroke-width="3.4"/>

  <!-- Blank white mobile screen -->
  <path d="M85 47            Q101 46.7 117 47            L117 111            Q101 111.5 85 111            Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.2"/>

  <!-- Horizontal connection continuing toward the arrow -->
  <path d="M79 46            Q96 45.7 112 46" stroke="#243447" stroke-width="7.5"/>

  <path d="M79 46            Q96 45.7 112 46" stroke="#32BEDD" stroke-width="5.2"/>

  <!-- Single Azure-blue right-pointing transfer arrow -->
  <path d="M82 78            L101 78            L101 73            Q101 71 103 73            L113 82            Q115 84 113 86            L103 96            Q101 98 101 95            L101 90            L82 90            Z" fill="#0078D4" stroke="#243447" stroke-width="2.4"/>

</svg>

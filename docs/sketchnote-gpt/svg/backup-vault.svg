<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Backup Vault (sketch)</title>

  
  <desc>
    Two overlapping Azure clouds with a curved backup-transfer
    arrow. Original Azure-blue and cyan colours, uneven marker
    outlines, restrained yellow accents, transparent background,
    and fully editable vector paths.
  </desc>

  <defs>
    <linearGradient id="backupBlue" x1="36" y1="10" x2="106" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".55" stop-color="#378FE4"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="backupCyan" x1="20" y1="55" x2="75" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Upper Azure cloud -->
  <path d="M58 74        C45 75 35 65 35 53        C35 42 43 33 54 32        C59 18 71 11 85 13        C99 14 109 24 111 38        C121 40 126 48 125 57        C125 67 117 75 106 75        L60 75Z" fill="url(#backupBlue)" stroke="#005BA1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upper cloud marker highlights -->
  <path d="M42 48        C45 40 51 37 59 37        C64 24 73 19 84 20" stroke="#9CCBFA" stroke-width="2.8" stroke-linecap="round" fill="none" opacity=".9"/>

  <path d="M113 45        C118 48 120 53 119 58" stroke="#8FC8F8" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".75"/>

  <!-- Lower cloud white interior -->
  <path d="M25 112        C15 112 8 104 8 94        C8 84 15 77 25 76        C29 64 40 57 52 58        C65 58 75 67 77 79        C87 81 93 89 92 98        C92 106 85 113 76 113        L27 113Z" fill="#FFFFFF" stroke="#0078A8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cyan marker outline -->
  <path d="M25 112        C15 112 8 104 8 94        C8 84 15 77 25 76        C29 64 40 57 52 58        C65 58 75 67 77 79        C87 81 93 89 92 98        C92 106 85 113 76 113        L27 113" stroke="url(#backupCyan)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Lower cloud internal highlight -->
  <path d="M15 91        C17 84 22 81 29 81        C33 70 41 64 52 65" stroke="#B2F5FF" stroke-width="2.3" stroke-linecap="round" fill="none"/>

  <!-- Cloud depth strokes -->
  <path d="M82 91        C87 95 86 103 81 107" stroke="#17ACCF" stroke-width="2" stroke-linecap="round" fill="none" opacity=".75"/>

  <!-- Curved backup transfer arrow -->
  <path d="M56 67        C57 48 67 38 86 37        L86 30        L104 43        L86 56        L86 48        C73 48 68 55 68 67" fill="#FFFFFF" stroke="#005BA1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Arrow marker highlight -->
  <path d="M62 59        C65 47 73 42 88 42" stroke="#BFEFFF" stroke-width="2.3" stroke-linecap="round" fill="none"/>

  <!-- Arrowhead highlight -->
  <path d="M90 36 L99 43 L90 50" stroke="#D8F6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Subtle sketchnote motion strokes -->
  <g stroke="#0078D4" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M48 47 L54 43"/>
    <path d="M49 54 L55 50"/>
    <path d="M72 31 L77 28"/>
  </g>

  <!-- Restrained yellow accents -->
  <g stroke="#E9BF4B" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M47 17 L44 10"/>
    <path d="M54 13 L54 6"/>
    <path d="M112 16 L117 11"/>
    <path d="M119 23 L125 21"/>
    <path d="M6 69 L1 65"/>
    <path d="M10 62 L7 56"/>
    <path d="M98 105 L104 109"/>
    <path d="M94 114 L97 121"/>
  </g>

  <!-- Tiny sketchnote sparkle marks -->
  <g fill="#F1CA5A">
    <path d="M20 35 L22 31 L24 35 L22 39Z"/>
    <path d="M113 92 L115 88 L117 92 L115 96Z"/>
    <circle cx="108" cy="119" r="1.8"/>
    <circle cx="30" cy="18" r="1.7"/>
  </g>

  <!-- Organic marker imperfections -->
  <g stroke="#168BAF" stroke-width="1.6" stroke-linecap="round" opacity=".7">
    <path d="M13 99 L16 104"/>
    <path d="M34 110 L40 111"/>
    <path d="M107 69 L112 67"/>
    <path d="M119 60 L121 55"/>
  </g>

</svg>

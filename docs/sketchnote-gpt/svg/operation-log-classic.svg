<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Operation Log (Classic) (sketch)</title>
  <defs>
    <linearGradient id="logBlue" x1="64" y1="12" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#54AEF0"/>
      <stop offset="1" stop-color="#1988D9"/>
    </linearGradient>
  </defs>

  <!-- Logbook backing and dark binding -->
  <path d="M24 20 L35 9     Q38 7 42 7     L105 7     Q113 7 113 15     L113 108     Q113 112 110 115     L99 124     L24 124     Q17 124 17 117     L17 29     Q17 24 24 20Z" fill="#005BA1" stroke="#004578" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- White page -->
  <path d="M36 15     Q38 12 42 12     L103 12     Q108 12 108 18     L108 105     Q108 108 105 111     L96 119     L27 119     L27 25Z" fill="#FFFFFF" stroke="#D5E8F5" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Log page content area -->
  <path d="M28 27     Q28 23 32 23     L99 23     Q103 23 103 27     L103 110     L28 110Z" fill="url(#logBlue)" stroke="#1988D9" stroke-width="2"/>

  <!-- Operation log title bar -->
  <rect x="39" y="35" width="49" height="18" rx="3" fill="#FFFFFF" stroke="#005BA1" stroke-width="2"/>

  <!-- Log entries -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <path d="M40 67 L88 67"/>
    <path d="M40 82 L88 82"/>
    <path d="M40 97 L77 97"/>
  </g>

  <!-- Entry markers -->
  <g fill="#FFFFFF">
    <circle cx="33" cy="67" r="3"/>
    <circle cx="33" cy="82" r="3"/>
    <circle cx="33" cy="97" r="3"/>
  </g>

  <!-- Small operation status indicators -->
  <g fill="#FFCA28" stroke="#D99A00" stroke-width="1.2">
    <circle cx="91" cy="67" r="3"/>
    <circle cx="91" cy="82" r="3"/>
    <circle cx="80" cy="97" r="3"/>
  </g>

  <!-- Document header details -->
  <path d="M44 41 L82 41 M44 47 L68 47" stroke="#1988D9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Folded page / binding detail -->
  <path d="M27 25 L37 15" stroke="#005BA1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M97 119 L97 109 L107 109" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>

  <!-- Hand-drawn log activity accent -->
  <path d="M91 25 L95 31 L101 33 L95 36 L92 42 L89 36 L83 33 L89 31Z" fill="#FFCA28" stroke="#D99A00" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Marker-style highlights -->
  <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".85">
    <path d="M35 29 L48 29"/>
    <path d="M35 58 L43 58"/>
    <path d="M35 106 L55 106"/>
  </g>

  <!-- Binding accent marks -->
  <g stroke="#50AEF0" stroke-width="2" stroke-linecap="round">
    <path d="M20 42 L20 53"/>
    <path d="M20 62 L20 72"/>
    <path d="M20 81 L20 91"/>
  </g>
</svg>

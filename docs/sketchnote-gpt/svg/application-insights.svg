<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Application Insights (sketch)</title>
  
  <desc>Hand-drawn purple lightbulb with diagnostic filament, metallic base, and subtle sketchnote accents.</desc>

  <defs>
    <radialGradient id="bulbPurple" cx="45%" cy="34%" r="76%">
      <stop offset="0" stop-color="#B77AF4"/>
      <stop offset=".48" stop-color="#A672ED"/>
      <stop offset="1" stop-color="#624FD0"/>
    </radialGradient>
    <linearGradient id="bulbShine" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn bulb silhouette -->
  <path d="M64 9            C42 8 24 20 20 41            C15 61 25 77 36 90            C42 98 45 104 47 111            Q48 114 52 114            L76 114            Q80 114 81 110            C84 98 91 90 99 80            C110 66 113 48 105 31            C98 16 83 9 64 9Z" fill="url(#bulbPurple)" stroke="#5743B5" stroke-width="3.5"/>


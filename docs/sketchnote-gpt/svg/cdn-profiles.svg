<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>CDN Profiles (sketch)</title>
  
  <desc>
    Azure CDN Profiles icon with three horizontal grey
    delivery lines and a solid Azure-blue cloud.
    Flat colors, uneven charcoal marker outlines,
    transparent background, and no internal arrows.
  </desc>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Upper grey delivery line -->
    <path d="M10 40          Q7 40 7 43          Q7 46 10 46          L39 46          Q42 46 42 43          Q42 40 39 40          Z" fill="#B3B3B3" stroke="#383B40" stroke-width="2.4"/>

    <!-- Middle grey delivery line -->
    <path d="M2 57          Q0 57 0 60          Q0 63 3 63          L32 63          Q35 63 35 60          Q35 57 32 57          Z" fill="#A3A3A3" stroke="#383B40" stroke-width="2.4"/>

    <!-- Lower grey delivery line -->
    <path d="M10 74          Q7 74 7 77          Q7 80 10 80          L39 80          Q42 80 42 77          Q42 74 39 74          Z" fill="#7A7A7A" stroke="#383B40" stroke-width="2.4"/>

    <!-- Main Azure CDN cloud -->
    <path d="M54 101          C39 101 27 90 27 75          C27 61 37 50 50 48          C56 33 69 25 83 26          C100 26 112 38 114 54          C126 57 133 67 132 80          C131 91 122 100 110 101          Q107 102 103 101          L58 101          Q56 102 54 101          Z" transform="translate(-6 0)" fill="#268CE0" stroke="#293D4D" stroke-width="3.8"/>

  </g>
</svg>

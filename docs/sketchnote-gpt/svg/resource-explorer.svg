<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title>Resource Explorer (sketch)</title>

  
  <desc id="desc">Hand-drawn orange resource folder containing a yellow isometric resource cube.</desc>

  <defs>
    <linearGradient id="folderOrange" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e27908"/>
      <stop offset=".3" stop-color="#e57e0a"/>
      <stop offset=".64" stop-color="#ed8b11"/>
      <stop offset="1" stop-color="#faa21d"/>
    </linearGradient>

    <linearGradient id="folderTab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9b24"/>
      <stop offset="1" stop-color="#ef7100"/>
    </linearGradient>
  </defs>

  <!-- Folder rear silhouette -->
  <path d="M7 20            Q7 16 11 16            L48 16            Q51 16 54 18            L68 28            Q70 29 73 29            L119 29            Q123 29 123 34            L123 105            Q123 110 119 110            L8 110            Q5 109 5 105            L5 21            Q5 19 7 20Z" fill="#ef7100" stroke="#bd5700" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Folder tab highlight -->
  <path d="M13 21 L47 21 Q50 21 53 23 L66 32" fill="none" stroke="#ffbd54" stroke-width="3" stroke-linecap="round"/>

  <!-- Folder main body -->
  <path d="M7 40            Q7 37 11 37            L59 37            Q62 37 64 34            L73 25            Q75 24 78 24            L119 24            Q123 24 123 29            L123 104            Q123 109 119 109            L9 109            Q5 109 5 104            L5 43            Q5 40 7 40Z" fill="url(#folderOrange)" stroke="#d65f00" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Folder upper edge -->
  <path d="M10 40 L58 40 Q62 40 65 36 L74 28" fill="none" stroke="#ffc15b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Folder interior subtle shading -->
  <path d="M12 48 Q45 46 64 47" fill="none" stroke="#fbb34a" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>

  <!-- Resource cube top -->
  <path d="M64 49            L96 67            L64 86            L32 67Z" fill="#ffe452" stroke="#d18b00" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cube left face -->
  <path d="M32 67            L64 86            L64 109            L32 90Z" fill="#ffd400" stroke="#d18b00" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cube right face -->
  <path d="M96 67            L64 86            L64 109            L96 90Z" fill="#ffca00" stroke="#d18b00" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cube surface highlights -->
  <path d="M64 52 Q79 61 91 68" fill="none" stroke="#fff2a0" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M38 69 L63 84" fill="none" stroke="#fff0a0" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <path d="M69 85 L91 71" fill="none" stroke="#f5b900" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <!-- Sketchnote marker accents -->
  <g fill="none" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round">
    <path d="M103 47 L109 43"/>
    <path d="M110 53 L115 51"/>
    <path d="M20 96 L15 100"/>
  </g>

  <!-- Hand-drawn contour details -->
  <g fill="none" stroke="#9d4a08" stroke-width="1.3" stroke-linecap="round" opacity=".55">
    <path d="M8 44 Q7 75 8 102"/>
    <path d="M120 34 Q122 65 120 101"/>
    <path d="M33 91 L62 108"/>
    <path d="M67 108 L94 92"/>
  </g>

</svg>

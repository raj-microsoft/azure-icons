      <stop offset="0" stop-color="#32bedd"/>
      <stop offset="1" stop-color="#198ab3"/>
    </linearGradient>
    <linearGradient id="inner" x1="76" y1="40" x2="120" y2="124" gradientUnits="userSpaceOnUse">

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Guide (sketch)</title>
  

  <defs>
    <radialGradient id="guideCyan" cx="50%" cy="43%" r="65%">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset=".55" stop-color="#49DDF7"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </radialGradient>
  </defs>

  <!-- Hand-drawn outer compass circle -->
  <path d="M64 7            C94 6 119 31 121 61            C123 91 101 119 70 121            C40 124 11 103 7 72            C3 43 25 13 54 8            Q59 7 64 7 Z" fill="url(#guideCyan)" stroke="#0078D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Loose sketched outer highlight -->
  <path d="M22 37            Q36 15 60 13            M78 14            Q106 22 114 49            M114 83            Q105 109 78 115" stroke="#B5F5FF" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>


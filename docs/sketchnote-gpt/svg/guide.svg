  <!-- Subtle inner circular marker -->
  <path d="M34 43            Q45 27 62 26            M86 33            Q101 45 102 63            M97 84            Q85 100 66 102" stroke="#50E6FF" stroke-width="2.1" stroke-linecap="round" opacity=".45"/>


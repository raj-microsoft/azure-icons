<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Verifiable Credentials (sketch)</title>
  <defs>
    <linearGradient id="credentialPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b796f9"/>
      <stop offset=".5" stop-color="#a67af4"/>
      <stop offset="1" stop-color="#773adc"/>
    </linearGradient>
    <linearGradient id="badgeGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86d633"/>
      <stop offset="1" stop-color="#76bc2d"/>
    </linearGradient>
    <linearGradient id="sealPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a67af4"/>
      <stop offset="1" stop-color="#552f99"/>
    </linearGradient>
  </defs>

  <!-- Credential document -->
  <path d="M19 12     Q19 8 23 8     L78 8     Q82 8 82 12     L82 114     Q82 118 78 118     L23 118     Q19 118 19 114 Z" fill="url(#credentialPurple)" stroke="#653eab" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Folded document corner -->
  <path d="M66 9 L66 27 Q66 31 70 31 L81 31" fill="none" stroke="#d8c5ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Document highlight -->
  <path d="M26 17 Q29 13 36 14" fill="none" stroke="#e5d7ff" stroke-width="3" stroke-linecap="round"/>

  <!-- User portrait -->
  <circle cx="50" cy="43" r="14" fill="url(#sealPurple)" stroke="#653eab" stroke-width="2"/>

  <path d="M40 40     C40 34 44 30 50 30     C56 30 60 35 60 40     C60 46 56 51 50 51     C44 51 40 46 40 40Z" fill="#b796f9"/>

  <path d="M34 69     C35 58 41 54 50 54     C59 54 65 59 66 69     L66 73 L34 73Z" fill="url(#sealPurple)" stroke="#653eab" stroke-width="2"/>

  <!-- Credential information lines -->
  <g fill="none" stroke="#773adc" stroke-width="4" stroke-linecap="round">
    <path d="M30 83 L68 83"/>
    <path d="M30 94 L68 94"/>
    <path d="M30 105 L57 105"/>
  </g>

  <!-- Verified credential seal -->
  <path d="M94 51     L103 56     L114 55     L119 65     L126 73     L123 84     L125 95     L116 102     L111 112     L100 112     L90 118     L82 111     L71 108     L70 97     L64 88     L69 78     L68 67     L79 62     L85 53 Z" fill="url(#badgeGreen)" stroke="#559b24" stroke-width="3" stroke-linejoin="round"/>

  <!-- Seal inner ring -->
  <circle cx="96" cy="85" r="21" fill="#b4ec36" stroke="#76bc2d" stroke-width="2.5"/>

  <!-- Verification checkmark -->
  <path d="M84 85 L92 93 L109 74" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M85 85 L92 92 L108 75" fill="none" stroke="#559b24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>

  <!-- Yellow sketchnote verification accents -->
  <g fill="none" stroke="#ffca28" stroke-width="3" stroke-linecap="round">
    <path d="M116 39 L121 33"/>
    <path d="M124 48 L128 46"/>
    <path d="M59 20 L63 16"/>
  </g>

  <!-- Marker-style document details -->
  <g fill="none" stroke="#653eab" stroke-width="1.7" stroke-linecap="round">
    <path d="M21 75 Q19 92 21 107"/>
    <path d="M77 99 Q78 108 75 113"/>
  </g>

  <!-- Small identity highlight -->
  <path d="M43 35 Q48 31 53 34" fill="none" stroke="#e8d6ff" stroke-width="2" stroke-linecap="round"/>
</svg>

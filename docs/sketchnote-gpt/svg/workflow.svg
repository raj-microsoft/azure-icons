<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Workflow (sketch)</title>
  
  <desc>Hand-drawn Azure workflow diagram with a central blue starting node connected to three green process nodes through cyan branching paths.</desc>

  <defs>
    <linearGradient id="azureBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50A8EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="greenNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86D633"/>
      <stop offset=".6" stop-color="#81CE31"/>
      <stop offset="1" stop-color="#76BC2D"/>
    </linearGradient>
  </defs>

  <!-- Main branching workflow connector -->
  <g fill="none" stroke="#0078D4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 43 L64 57"/>
    <path d="M64 57 Q64 66 54 66 L23 66 Q18 66 18 76"/>
    <path d="M64 57 L64 88"/>
    <path d="M64 66 L105 66 Q110 66 110 76"/>
  </g>

  <!-- Cyan connector highlights -->
  <g fill="none" stroke="#50E6FF" stroke-width="2" stroke-linecap="round">
    <path d="M68 45 L68 56"/>
    <path d="M64 61 Q56 70 46 70 L23 70"/>
    <path d="M68 69 L68 87"/>
    <path d="M78 70 L104 70"/>
  </g>

  <!-- Top workflow trigger node -->
  <rect x="41" y="7" width="46" height="43" rx="6" fill="url(#azureBlue)" stroke="#005BA1" stroke-width="3" transform="rotate(-1 64 28)"/>

  <rect x="49" y="15" width="30" height="27" rx="3" fill="#FFFFFF" stroke="#D5F0FF" stroke-width="2"/>

  <!-- Trigger symbol -->
  <path d="M57 22 L57 35 L70 28 Z" fill="#0078D4" stroke="#005BA1" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M46 11 L52 10 M75 11 L81 12" fill="none" stroke="#BDEAFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left process node -->
  <rect x="5" y="76" width="38" height="38" rx="5" fill="url(#greenNode)" stroke="#589E24" stroke-width="3" transform="rotate(-2 24 95)"/>

  <rect x="12" y="83" width="24" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <path d="M17 95 L22 100 L31 89" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center process node -->
  <rect x="45" y="88" width="38" height="38" rx="5" fill="url(#greenNode)" stroke="#589E24" stroke-width="3" transform="rotate(1 64 107)"/>

  <rect x="52" y="95" width="24" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <path d="M57 107 L62 112 L71 101" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right process node -->
  <rect x="91" y="76" width="38" height="38" rx="5" fill="url(#greenNode)" stroke="#589E24" stroke-width="3" transform="rotate(2 110 95)"/>

  <rect x="98" y="83" width="24" height="24" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>

  <path d="M103 95 L108 100 L117 89" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connector junction -->
  <circle cx="64" cy="66" r="5" fill="#50E6FF" stroke="#0078D4" stroke-width="2"/>

  <!-- Yellow sketchnote accents -->
  <g fill="none" stroke="#E6B93F" stroke-width="2.5" stroke-linecap="round">
    <path d="M29 20 L25 16"/>
    <path d="M97 43 L102 39"/>
    <path d="M45 56 L41 52"/>
    <path d="M84 79 L89 75"/>
    <path d="M8 121 L14 123"/>
    <path d="M113 120 L119 117"/>
  </g>

  <!-- Hand-drawn marker details -->
  <g fill="none" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round">
    <path d="M36 8 L40 6"/>
    <path d="M88 14 L92 16"/>
    <path d="M48 119 L54 121"/>
    <path d="M75 127 L81 125"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Workflow (sketch)</title>

  
  <desc>
    Hand-drawn Azure Workflow icon with one blue trigger node,
    a blank white inset square, cyan branching connectors,
    and three plain green process nodes. Uneven charcoal
    marker outlines, flat fills, and transparent background.
  </desc>

  <!-- Cyan branching workflow connectors -->
  <path d="M64 42        L64 54        Q64 57 67 57        L108 57        Q112 57 112 62        L112 79        L103 79        L103 68        Q103 66 100 66        L70 66        L70 94        L59 94        L59 66        L28 66        Q25 66 25 69        L25 79        L15 79        L15 62        Q15 57 20 57        L58 57        Q60 57 60 54        L60 42 Z" fill="#50E6FF" stroke="#203746" stroke-width="2.8"/>


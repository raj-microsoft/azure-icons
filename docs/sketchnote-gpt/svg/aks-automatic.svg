      <polygon points="0 9 0 24 11 30 11 15" fill="url(#cubeSide)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="22 9 22 24 11 30 11 15" fill="#8661C5" stroke="#4E3B74" stroke-width="2.2"/>
      <path d="M5 12v10M11 15v13M17 12v10" fill="none" stroke="#DCCFFC" stroke-width="1.4" opacity=".55"/>
    </g>

    <!-- Cube 2: upper right -->
    <g transform="translate(84 38)">
      <polygon points="0 9 11 2 22 9 11 15" fill="url(#cubeTop)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="0 9 0 24 11 30 11 15" fill="url(#cubeSide)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="22 9 22 24 11 30 11 15" fill="#8661C5" stroke="#4E3B74" stroke-width="2.2"/>
      <path d="M5 12v10M11 15v13M17 12v10" fill="none" stroke="#DCCFFC" stroke-width="1.4" opacity=".55"/>

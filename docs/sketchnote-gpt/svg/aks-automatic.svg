      <polygon points="22 9 22 24 11 30 11 15" fill="#8661C5" stroke="#4E3B74" stroke-width="2.2"/>
      <path d="M5 12v10M11 15v13M17 12v10" fill="none" stroke="#DCCFFC" stroke-width="1.4" opacity=".55"/>
    </g>

    <!-- Cube 4: middle center -->
    <g transform="translate(52 66)">
      <polygon points="0 9 11 2 22 9 11 15" fill="url(#cubeTop)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="0 9 0 24 11 30 11 15" fill="url(#cubeSide)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="22 9 22 24 11 30 11 15" fill="#8661C5" stroke="#4E3B74" stroke-width="2.2"/>
      <path d="M5 12v10M11 15v13M17 12v10" fill="none" stroke="#DCCFFC" stroke-width="1.4" opacity=".55"/>
    </g>

    <!-- Cube 5: middle right -->
    <g transform="translate(84 66)">
      <polygon points="0 9 11 2 22 9 11 15" fill="url(#cubeTop)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="0 9 0 24 11 30 11 15" fill="url(#cubeSide)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="22 9 22 24 11 30 11 15" fill="#8661C5" stroke="#4E3B74" stroke-width="2.2"/>
      <path d="M5 12v10M11 15v13M17 12v10" fill="none" stroke="#DCCFFC" stroke-width="1.4" opacity=".55"/>
    </g>

    <!-- Cube 6: bottom left -->
    <g transform="translate(52 94)">
      <polygon points="0 9 11 2 22 9 11 15" fill="url(#cubeTop)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="0 9 0 24 11 30 11 15" fill="url(#cubeSide)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="22 9 22 24 11 30 11 15" fill="#8661C5" stroke="#4E3B74" stroke-width="2.2"/>
      <path d="M5 12v10M11 15v13M17 12v10" fill="none" stroke="#DCCFFC" stroke-width="1.4" opacity=".55"/>
    </g>

    <!-- Cube 7: bottom right -->
    <g transform="translate(84 94)">
      <polygon points="0 9 11 2 22 9 11 15" fill="url(#cubeTop)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="0 9 0 24 11 30 11 15" fill="url(#cubeSide)" stroke="#4E3B74" stroke-width="2.2"/>
      <polygon points="22 9 22 24 11 30 11 15" fill="#8661C5" stroke="#4E3B74" stroke-width="2.2"/>
      <path d="M5 12v10M11 15v13M17 12v10" fill="none" stroke="#DCCFFC" stroke-width="1.4" opacity=".55"/>
    </g>

  </g>

  <!-- Sketchnote finishing accents -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M111 35v8M107 39h8" stroke="#FFD34E" stroke-width="3"/>
    <path d="M27 104c4 2 9 3 13 2" stroke="#FFD34E" stroke-width="3"/>
    <path d="M114 123c-4 1-8 1-12 0" stroke="#4894FE" stroke-width="2.4" opacity=".7"/>

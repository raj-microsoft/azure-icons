<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Defender HMI (sketch)</title>
  
  <desc>Hand-drawn Azure-blue industrial HMI with a blank light-blue display, white status indicators, and a circular control gauge.</desc>

  <!-- Irregular industrial housing -->
  <path d="M21 16.5 Q15 17 12 26 C3 51 4 78 13 102 Q16 112 25 113 L104 113 Q113 112 116 103 C124 78 125 53 116 27 Q113 17 104 17 Z" fill="#0078D4" stroke="#163E60" stroke-width="4"/>

  <!-- Subtle marker retracing on housing -->
  <path d="M19 31 Q12 57 16 78 M20 98 Q22 105 30 106" stroke="#164F84" stroke-width="2" opacity=".6"/>

  <!-- Blank HMI screen: no graph, nodes, or baseline -->
  <path d="M22 31 Q22 28 26 28 L102 29 Q106 29 106 33 L106 68 Q106 72 102 72 L25 72 Q21 72 21 68 Z" fill="#70ACF2" stroke="#163E60" stroke-width="3.2"/>

  <!-- Lower white status bar -->
  <path d="M22 94 Q22 91 25 91 L42 91 Q45 91 45 94 Q45 97 42 97 L25 97 Q22 97 22 94Z" fill="#FFFFFF" stroke="#163E60" stroke-width="1.7"/>

  <!-- Two small white status lights -->
  <path d="M58 94 C58 96.4 56.5 98 54 98 C51.5 98 50 96.4 50 94 C50 91.6 51.5 90 54 90 C56.5 90 58 91.6 58 94Z" fill="#FFFFFF" stroke="#163E60" stroke-width="1.5"/>
  <path d="M72 94 C72 96.4 70.5 98 68 98 C65.5 98 64 96.4 64 94 C64 91.6 65.5 90 68 90 C70.5 90 72 91.6 72 94Z" fill="#FFFFFF" stroke="#163E60" stroke-width="1.5"/>

  <!-- Circular control gauge -->
  <path d="M99 81 C107 81 113 87 113 95 C113 103 107 109 99 109 C91 109 85 103 85 95 C85 87 91 81 99 81Z" fill="#FFFFFF" stroke="#163E60" stroke-width="3"/>

  <!-- Dark-blue gauge pointer -->
  <path d="M99 95 L107 87" stroke="#00188F" stroke-width="3.5"/>
  <path d="M99 92.5 C100.5 92.5 101.5 93.7 101.5 95 C101.5 96.5 100.4 97.5 99 97.5 C97.5 97.5 96.5 96.4 96.5 95 C96.5 93.5 97.6 92.5 99 92.5Z" fill="#00188F"/>

  <!-- Tiny yellow sketchnote ticks -->
  <path d="M116 18 L120 12 M120 24 L125 22" stroke="#FFCC4D" stroke-width="2.5"/>
  <path d="M8 89 L4 93 M10 97 L6 100" stroke="#FFCC4D" stroke-width="2.5"/>
</svg>

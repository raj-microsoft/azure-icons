<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>HD Insight Clusters (sketch)</title>
  
  <desc>Three cyan cluster nodes arranged in a triangle, connected by irregular Azure-blue structural links, preserving the original HDInsight cluster symbolism.</desc>

  <defs>
    <linearGradient id="clusterCyan" x1="0" y1="-15" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="clusterBlue" x1="20" y1="20" x2="105" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#168EE0"/>
      <stop offset=".65" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005AAB"/>
    </linearGradient>
  </defs>

  <!-- Upper-left structural connector -->
  <path d="M38 23            L22 23            Q19 23 17 27            L4 49            Q3 52 5 55            L12 67            Q14 70 18 68            Q25 64 32 65            L43 47            Q45 44 43 41            Q38 34 38 23 Z" fill="url(#clusterBlue)" stroke="#145B96" stroke-width="3.5"/>

  <!-- Upper-right structural connector -->
  <path d="M90 23            L106 23            Q109 23 111 27            L124 49            Q125 52 123 55            L116 67            Q114 70 110 68            Q103 64 96 65            L85 47            Q83 44 85 41            Q90 34 90 23 Z" fill="url(#clusterBlue)" stroke="#145B96" stroke-width="3.5"/>

  <!-- Central triangular connectivity -->
  <path d="M55 42            Q64 45 73 42            L89 69            Q90 72 87 75            Q79 81 77 91            L51 91            Q49 80 41 75            Q38 72 40 69 Z" fill="#0078D4" stroke="#145B96" stroke-width="3.5"/>

  <!-- Lower-left supporting connector -->
  <path d="M42 94            Q49 100 52 111            L46 122            Q44 125 41 125            L18 125            Q15 125 13 122            L8 113            Q19 108 22 94 Z" fill="url(#clusterBlue)" stroke="#145B96" stroke-width="3"/>

  <!-- Lower-right supporting connector -->
  <path d="M86 94            Q79 100 76 111            L82 122            Q84 125 87 125            L110 125            Q113 125 115 122            L120 113            Q109 108 106 94 Z" fill="url(#clusterBlue)" stroke="#145B96" stroke-width="3"/>

  <!-- Central lower bridge -->
  <path d="M51 103            Q64 105 77 103            L84 116            Q85 119 81 121            L47 121            Q43 119 44 116 Z" fill="#0078D4" stroke="#145B96" stroke-width="3"/>

  <!-- Sketched structural highlights -->
  <g stroke="#5EA0EF" stroke-width="2.4" opacity=".85">
    <path d="M23 30 L11 51"/>
    <path d="M105 30 L117 51"/>
    <path d="M52 53 L44 68"/>
    <path d="M76 53 L84 68"/>
    <path d="M48 115 Q64 117 80 115"/>
  </g>

  <!-- Top cyan cluster node -->
  <path d="M64 5            C76 4 88 14 88 27            C89 40 78 52 64 52            C50 52 39 41 40 27            C40 14 51 5 64 5 Z" fill="url(#clusterCyan)" stroke="#087DAE" stroke-width="4"/>

  <!-- Lower-left cyan cluster node -->
  <path d="M24 74            C37 73 48 83 48 96            C49 109 38 120 25 120            C12 120 2 110 2 97            C2 84 12 75 24 74 Z" fill="url(#clusterCyan)" stroke="#087DAE" stroke-width="4"/>

  <!-- Lower-right cyan cluster node -->
  <path d="M104 74            C117 73 126 84 126 97            C126 110 116 120 103 120            C90 120 79 109 80 96            C80 83 91 74 104 74 Z" fill="url(#clusterCyan)" stroke="#087DAE" stroke-width="4"/>

  <!-- Hand-drawn node highlights -->
  <g stroke="#C6F8FF" stroke-width="3" opacity=".9">
    <path d="M49 24 Q52 14 62 13"/>
    <path d="M11 94 Q13 85 23 83"/>
    <path d="M89 94 Q92 85 102 83"/>
  </g>

  <!-- Subtle interior cluster marks -->
  <g fill="#FFFFFF" opacity=".55">
    <circle cx="64" cy="29" r="4"/>
    <circle cx="25" cy="97" r="4"/>
    <circle cx="103" cy="97" r="4"/>
  </g>

  <!-- Small sketch connection marks -->
  <g stroke="#0078D4" stroke-width="2.3">
    <path d="M28 14 L24 9"/>
    <path d="M100 14 L104 9"/>
    <path d="M55 2 L52 0"/>
    <path d="M73 2 L76 0"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4B83F" stroke-width="2.7">
    <path d="M64 61 L64 68"/>
    <path d="M59 65 L64 70 L69 65"/>
    <path d="M14 69 L10 73"/>
    <path d="M114 69 L118 73"/>
  </g>

  <!-- Hand-drawn marker dots -->
  <circle cx="64" cy="76" r="2.5" fill="#F4B83F"/>
  <circle cx="14" cy="61" r="2" fill="#50E6FF"/>
  <circle cx="114" cy="61" r="2" fill="#50E6FF"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Folder Website (sketch)</title>
  

  <!-- Rear folder -->
  <path d="M7 19 Q7 14 12 14        L47 14 Q50 14 53 16        L69 27 Q72 29 76 29        L116 29 Q121 29 121 34        L121 109 Q121 115 116 115        L12 115 Q7 115 7 110 Z" fill="#DFA500" stroke="#765000" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- White folder tab label -->
  <rect x="17" y="21" width="23" height="4" rx="2" fill="#FFFFFF"/>

  <!-- Front folder -->
  <path d="M7 40 Q7 36 12 36        L45 36 Q49 36 52 33        L59 27 Q61 25 65 25        L116 25 Q121 25 121 30        L121 111 Q121 116 116 116        L12 116 Q7 116 7 111 Z" fill="#FFCA0A" stroke="#9A6B00" stroke-width="3.8" stroke-linejoin="round"/>

  <!-- Folder marker details -->
  <path d="M14 46 Q31 45 47 45" stroke="#FFF0A0" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M14 54 Q13 75 14 101" stroke="#FFE875" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M23 109 Q65 111 110 109" stroke="#E8A900" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Blue website globe: radius 28, centered at 64,72 -->
  <path d="M64 44        C79 44 92 56 92 72        C92 87 80 100 64 100        C49 100 36 88 36 72        C36 57 48 44 64 44 Z" fill="#1685D8" stroke="#064F91" stroke-width="3.5"/>

  <!-- Globe subtle highlight -->
  <path d="M43 63 Q49 49 64 49" stroke="#A8DFFF" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Curved pale orbit bands -->
  <g stroke="#EAF7FF" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M49 71 Q64 55 81 73"/>
    <path d="M49 71 Q53 84 68 87"/>
    <path d="M81 73 Q78 84 68 87"/>
    <path d="M44 78 Q64 96 85 78"/>
    <path d="M57 47 Q70 72 68 87" opacity=".65"/>
  </g>

  <!-- Exactly three white network nodes -->

  <!-- Left largest node -->
  <circle cx="49" cy="71" r="6.5" fill="#FFFFFF" stroke="#075A9E" stroke-width="1.8"/>

  <!-- Right smaller node -->
  <circle cx="81" cy="73" r="4.7" fill="#FFFFFF" stroke="#075A9E" stroke-width="1.7"/>

  <!-- Lower small node -->
  <circle cx="68" cy="87" r="4.2" fill="#FFFFFF" stroke="#075A9E" stroke-width="1.7"/>

  <!-- Restrained hand-drawn node details -->
  <path d="M46 69 Q48 67 51 69" stroke="#D0E9FF" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M79 71 L81 70" stroke="#D0E9FF" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M66 86 L68 84" stroke="#D0E9FF" stroke-width="1.2" stroke-linecap="round"/>

</svg>

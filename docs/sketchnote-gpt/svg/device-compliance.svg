<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Device Compliance (sketch)</title>
  <defs>
    <linearGradient id="deviceBlue" x1="6.36" y1="22.03" x2="6.36" y2="-1.85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset=".17" stop-color="#1c84dc"/>
      <stop offset=".38" stop-color="#3990e4"/>
      <stop offset=".59" stop-color="#4d99ea"/>
      <stop offset=".8" stop-color="#5a9eee"/>
      <stop offset="1" stop-color="#5ea0ef"/>
    </linearGradient>
    <linearGradient id="deviceScreen" x1="6.36" y1="15.59" x2="6.36" y2="1.94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2ebff"/>
      <stop offset="1" stop-color="#f0fffd"/>
    </linearGradient>
  </defs>

  <g transform="scale(7.111111)">
    <!-- Original device outer body -->
    <rect x="1.28" y=".5" width="10.17" height="16.99" rx=".51" fill="url(#deviceBlue)" stroke="#0063ad" stroke-width=".1" stroke-linejoin="round"/>

    <!-- Bottom speaker / button -->
    <rect x="5.79" y="16.17" width="1.14" height=".97" rx=".27" fill="#f2f2f2"/>

    <!-- Top earpiece -->
    <rect x="5.19" y="1.07" width="2.34" height=".31" rx=".15" fill="#f2f2f2"/>

    <!-- Blank device display: intentionally no text or lines -->
    <rect x="2.23" y="1.94" width="8.26" height="13.65" rx=".19" opacity=".9" fill="url(#deviceScreen)" stroke="#b9d9f2" stroke-width=".045"/>

    <!-- Original green compliance badge -->
    <rect x="9.2" y="9.98" width="7.52" height="7.52" rx=".28" fill="#76bc2d" stroke="#579c20" stroke-width=".09" stroke-linejoin="round"/>

    <!-- Original white checkmark -->
    <path d="M10.9 13.22h.61a.19.19 0 0 1 .19.19v2.44a.19.19 0 0 1-.19.19h-.43a.19.19 0 0 1-.19-.19v-2.63Z" transform="translate(29.63 16.98) rotate(135)" fill="#fff"/>

    <path d="M13.61 10.66h.61v5.6a.19.19 0 0 1-.19.19h-.43a.19.19 0 0 1-.19-.19v-5.41a.19.19 0 0 1 .19-.19Z" transform="translate(14 32.92) rotate(-135)" fill="#fff"/>
  </g>
</svg>

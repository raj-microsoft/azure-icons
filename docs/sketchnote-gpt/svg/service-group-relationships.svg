<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Service Group Relationships (sketch)</title>
  
  <desc>Two hand-drawn isometric service-group cubes: a cyan upper-right cube and a blue lower-left cube, with a grey bent connector extending from the lower cube toward the upper cube.</desc>

  <!-- Bent relationship connector behind the cubes -->
  <path d="M64 104            L87 104            Q95 104 95 96            L95 48" stroke="#414B50" stroke-width="8"/>

  <path d="M64 104            L87 104            Q95 104 95 96            L95 48" stroke="#A3A3A3" stroke-width="5"/>

  <!-- Upper-right cyan cube: top face -->
  <path d="M66 14            Q67 12.8 69 12            L87 2.2            Q89 1.1 91 2.2            L109 12.5            Q111 13.6 111 16            L89 28.8 Z" fill="#36DFF1" stroke="#176575" stroke-width="3.2"/>

  <!-- Upper-right cyan cube: left face -->
  <path d="M66 14            L89 28.8            L89 62.8            Q87 62.9 85 61.7            L68 51.4            Q66 50.2 66 47.8 Z" fill="#16BBDA" stroke="#176575" stroke-width="3.2"/>

  <!-- Upper-right cyan cube: right face -->
  <path d="M89 28.8            L111 16            L111 47.8            Q111 50.1 109 51.3            L92 61.5            Q90.5 62.5 89 62.8 Z" fill="#26CFE8" stroke="#176575" stroke-width="3.2"/>

  <!-- Subtle hand-drawn upper cube seams -->
  <path d="M68 15 L88.5 27            L108.5 15.5" stroke="#176575" stroke-width="1.5"/>

  <!-- Lower-left blue cube: top face -->
  <path d="M8 79            Q9 77.8 11 76.7            L30 65.7            Q32 64.6 34 65.7            L53 76.7            Q55 77.8 56 79            L32 93 Z" fill="#66C0FF" stroke="#174D82" stroke-width="3.3"/>

  <!-- Lower-left blue cube: left face -->
  <path d="M8 79            L32 93            L32 126            Q30 126 28 124.8            L10.2 114.5            Q8 113.2 8 110.5 Z" fill="#58AAFE" stroke="#174D82" stroke-width="3.3"/>

  <!-- Lower-left blue cube: right face -->
  <path d="M32 93            L56 79            L56 110.5            Q56 113.2 53.7 114.5            L36 124.8            Q34 126 32 126 Z" fill="#4894FE" stroke="#174D82" stroke-width="3.3"/>

  <!-- Subtle hand-drawn lower cube seams -->
  <path d="M11 79.5 L32 91            L53 79.5" stroke="#174D82" stroke-width="1.5"/>

  <!-- Minimal yellow marker accents -->
  <g stroke="#F2C94C" stroke-width="2.6">
    <path d="M56 13 L60 8"/>
    <path d="M59 20 L64 18"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Elastic SAN (sketch)</title>
  
  <desc>Azure Elastic SAN with stacked blue storage disks, a cyan cloud, and white bidirectional scaling arrows, illustrated with uneven marker-style vector outlines.</desc>

  <defs>
    <linearGradient id="cloudCyan" x1="22" y1="45" x2="108" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Bottom storage disk -->
  <path d="M9 76            Q9 72 16 70            Q31 65 49 69            Q70 70 81 75            L81 95            Q79 101 65 103            Q37 108 16 101            Q9 99 9 95 Z" fill="#005BA1" stroke="#004578" stroke-width="3.2"/>

  <!-- Bottom disk rim -->
  <path d="M9 76            Q11 81 27 83            Q47 87 67 82            Q78 80 81 75" stroke="#32BEDD" stroke-width="2.5"/>

  <!-- Middle storage disk -->
  <path d="M9 51            Q9 47 16 45            Q31 40 49 44            Q70 45 81 50            L81 70            Q78 76 63 78            Q38 83 16 76            Q9 74 9 70 Z" fill="#0078D4" stroke="#005BA1" stroke-width="3.2"/>

  <!-- Middle disk upper surface -->
  <path d="M9 51            C9 45 25 42 45 42            C65 42 81 46 81 51            C81 57 65 60 45 60            C25 60 9 57 9 51 Z" fill="#32BEDD" stroke="#005BA1" stroke-width="2.8"/>

  <!-- Top storage disk body -->
  <path d="M9 20            Q10 16 18 14            Q37 9 57 13            Q75 15 81 20            L81 41            Q79 47 64 49            Q39 54 17 47            Q9 45 9 41 Z" fill="#5EA0EF" stroke="#005BA1" stroke-width="3.2"/>

  <!-- Top disk elliptical face -->
  <path d="M9 20            C9 13 25 9 45 9            C65 9 81 14 81 20            C81 27 65 31 45 31            C25 31 9 27 9 20 Z" fill="#9CEBFF" stroke="#0078D4" stroke-width="3"/>

  <!-- Hand-sketched disk highlights -->
  <path d="M17 37 Q28 41 41 41            M17 65 Q28 69 40 69            M17 91 Q28 95 40 95" stroke="#BCEFFF" stroke-width="2.4"/>

  <!-- Elastic cloud silhouette -->
  <path d="M43 117            C29 117 19 107 19 95            C19 82 28 73 40 71            C45 58 57 50 71 51            C87 50 100 62 102 77            C113 79 121 88 121 100            C121 110 113 118 102 119            L44 119 Z" fill="url(#cloudCyan)" stroke="#168EB8" stroke-width="3.8"/>

  <!-- Secondary uneven marker contour -->
  <path d="M24 94            Q24 82 34 78            M46 69            Q53 56 68 56            M78 57            Q94 62 97 80" stroke="#B6F5FF" stroke-width="2.8" opacity=".9"/>

  <!-- Cloud edge accent -->
  <path d="M42 113 Q58 115 74 114            M85 114 Q98 115 106 111" stroke="#159EC5" stroke-width="2.1" opacity=".7"/>

  <!-- Left-pointing elasticity arrow -->
  <path d="M61 89            L48 101            L61 113            L61 106            L78 106            L78 97            L61 97 Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.4"/>

  <!-- Right-pointing elasticity arrow -->
  <path d="M84 89            L97 101            L84 113            L84 106            L67 106            L67 97            L84 97 Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.4"/>

  <!-- Arrow center separation -->
  <path d="M72.5 96 L72.5 107" stroke="#168EB8" stroke-width="1.5"/>

  <!-- Small hand-drawn Azure-yellow accent strokes -->
  <path d="M108 69 L113 64            M113 76 L120 74            M111 83 L117 87" stroke="#FFCA28" stroke-width="3"/>

  <!-- Subtle sketch notation -->
  <path d="M32 57 Q38 59 44 58            M13 110 L17 114" stroke="#0078D4" stroke-width="2.1"/>

  <!-- Final small marker details -->
  <path d="M23 17 Q33 13 43 14            M50 14 Q63 15 69 18" stroke="#D8F8FF" stroke-width="2" opacity=".85"/>

</svg>

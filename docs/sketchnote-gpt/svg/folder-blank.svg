<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Folder Blank (sketch)</title>
  
  <desc>A golden-yellow folder with a raised tab, overlapping front panel, uneven marker outlines and subtle hand-drawn highlights.</desc>

  <defs>
    <linearGradient id="folderGold" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#FFD400"/>
      <stop offset=".45" stop-color="#FFD000"/>
      <stop offset="1" stop-color="#FFBD02"/>
    </linearGradient>
  </defs>

  <!-- Rear folder with raised tab -->
  <path d="M10 23            Q10 19 15 19            L47 19            Q50 19 53 21            L67 31            Q69 33 73 33            L113 33            Q118 33 118 38            L118 102            L10 102Z" fill="#DFA500" stroke="#A97800" stroke-width="4"/>

  <!-- Small white tab detail -->
  <path d="M21 26 Q22 25 24 25 L42 25 Q44 25 44 27            L44 30 L21 30Z" fill="#FFFFFF" stroke="#C28B00" stroke-width="1.8"/>

  <!-- Front folder panel -->
  <path d="M10 45            Q10 41 15 41            L46 41            Q49 41 52 38            L60 31            Q63 28 67 28            L113 28            Q118 28 118 33            L118 107            Q118 113 112 113            L15 113            Q9 113 9 108            Z" fill="url(#folderGold)" stroke="#B78000" stroke-width="4.2"/>

  <!-- Hand-drawn top-edge highlight -->
  <path d="M16 47            Q30 46 45 46            Q51 46 55 42            L64 35            Q67 33 72 33            L110 33" stroke="#FFF1A1" stroke-width="3" opacity=".95"/>

  <!-- Loose marker reinforcement -->
  <g stroke="#DFA500" stroke-width="2.3" opacity=".75">
    <path d="M14 55 Q13 76 14 101"/>
    <path d="M113 43 Q114 71 113 102"/>
    <path d="M23 108 Q62 109 103 108"/>
  </g>

  <!-- Subtle sketch highlights -->
  <g stroke="#FFE77A" stroke-width="2.8">
    <path d="M23 59 Q40 57 56 59"/>
    <path d="M25 65 L43 65"/>
    <path d="M86 100 Q98 99 106 97"/>
  </g>

  <!-- Hand-drawn fold details -->
  <g stroke="#C58C00" stroke-width="2" opacity=".65">
    <path d="M52 40 Q58 35 63 32"/>
    <path d="M18 104 Q24 106 31 105"/>
  </g>

  <!-- Small Azure-blue sketch accents -->
  <g stroke="#5EA0EF" stroke-width="2.5">
    <path d="M120 49 L124 46"/>
    <path d="M121 57 L126 57"/>
    <path d="M4 80 L7 77"/>
  </g>

  <!-- Restrained yellow emphasis marks -->
  <g stroke="#FFCB3D" stroke-width="2.8">
    <path d="M82 18 L86 12"/>
    <path d="M90 21 L97 18"/>
    <path d="M24 119 L28 124"/>
  </g>
</svg>

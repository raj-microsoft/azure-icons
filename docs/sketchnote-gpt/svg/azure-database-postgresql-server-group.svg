<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Database PostgreSQL Server Group (sketch)</title>

  
  <desc>
    Hand-drawn Azure blue database cylinder with a simplified
    white PostgreSQL elephant emblem and a green circular
    server-group badge. Preserves the original blue, cyan,
    white and green palette with subtle yellow accents.
    Transparent background and fully editable vector paths.
  </desc>

  <defs>
    <linearGradient id="pgBlue" x1="18" y1="60" x2="109" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset=".52" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>

    <linearGradient id="pgCyan" x1="64" y1="11" x2="64" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>

    <linearGradient id="pgGreen" x1="90" y1="88" x2="115" y2="117" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BD643"/>
      <stop offset="1" stop-color="#76BC2D"/>
    </linearGradient>
  </defs>

  <!-- Main Azure database cylinder -->
  <path d="M19 24            L19 103            C19 115 39 121 64 121            C89 121 109 115 109 103            L109 24            Z" fill="url(#pgBlue)" stroke="#004F8B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Database top rim -->
  <path d="M19 24            C19 13 39 7 64 7            C89 7 109 13 109 24            C109 35 89 41 64 41            C39 41 19 35 19 24Z" fill="#E8E8E8" stroke="#005BA1" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Cyan inner data surface -->
  <path d="M29 24            C29 17 44 13 64 13            C84 13 99 17 99 24            C99 31 84 35 64 35            C44 35 29 31 29 24Z" fill="url(#pgCyan)" stroke="#168DBB" stroke-width="2" stroke-linejoin="round"/>

  <!-- Hand-drawn cyan reflection -->
  <path d="M37 28            Q64 19 91 28            Q64 37 37 28Z" fill="#198AB3" opacity=".85"/>

  <path d="M38 20            Q54 15 72 17" stroke="#D1FAFF" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

  <!-- Database cylinder contour -->
  <path d="M27 45            L27 99            Q28 109 45 113" stroke="#5EA0EF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".8"/>

  <path d="M101 46 L101 81" stroke="#003F78" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <!-- Subtle sketched database layer line -->
  <path d="M22 105            C35 119 91 119 106 105" stroke="#50E6FF" stroke-width="2" stroke-linecap="round" opacity=".45"/>

  <!-- PostgreSQL elephant emblem -->
  <g stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">

    <!-- Left ear -->
    <path d="M56 57              C46 49 36 49 33 57              C29 68 35 83 41 91              Q44 95 48 90              L55 79              Z" fill="#FFFFFF" stroke="#005BA1" stroke-width="2.2"/>

    <!-- Right ear -->
    <path d="M74 57              C83 49 94 50 96 60              C98 70 91 85 86 91              Q82 95 78 89              L72 79              Z" fill="#FFFFFF" stroke="#005BA1" stroke-width="2.2"/>

    <!-- Elephant head -->
    <path d="M51 58              C55 52 73 51 79 59              C84 65 82 77 78 85              L75 97              Q74 103 70 104              Q65 105 62 101              Q59 96 62 91              L64 85              Q59 87 54 83              C48 78 47 65 51 58Z" fill="#FFFFFF" stroke="#005BA1" stroke-width="2.4"/>

    <!-- Trunk curl -->
    <path d="M70 90              Q67 97 71 99              Q77 102 80 96" fill="none" stroke="#005BA1" stroke-width="2.2"/>

    <!-- Eye marks -->
    <path d="M55 67              Q58 65 61 67" fill="none" stroke="#005BA1" stroke-width="2"/>

    <path d="M72 67              Q75 65 78 67" fill="none" stroke="#005BA1" stroke-width="2"/>

  </g>

  <!-- PostgreSQL eyes -->
  <g fill="#005BA1">
    <circle cx="59" cy="69" r="2.1"/>
    <circle cx="75" cy="69" r="2.1"/>
  </g>

  <!-- Elephant facial sketch details -->
  <g stroke="#7AB8E8" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".8">

    <path d="M52 76 Q55 81 59 82"/>
    <path d="M77 76 Q76 81 73 84"/>
    <path d="M65 87 Q67 89 69 88"/>

  </g>

  <!-- Green PostgreSQL server-group badge -->
  <path d="M118 88            C128 97 127 109 118 117            C110 125 96 126 88 117            C80 108 82 96 91 89            C100 82 111 82 118 88Z" fill="url(#pgGreen)" stroke="#4C8D1B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badge inner highlight -->
  <path d="M90 99            Q96 87 108 89" stroke="#C8F49B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".9"/>

  <!-- Hand-drawn white circular group symbol -->
  <path d="M94 107            C92 100 97 94 104 94            C111 94 115 99 114 105            C113 112 107 116 101 114            Q96 113 94 107Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M97 108            Q100 112 105 109            Q111 106 109 101            Q107 97 102 100            Q99 102 101 105" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small server-group connection marks -->
  <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".95">

    <path d="M95 95 L91 92"/>
    <path d="M114 111 L118 115"/>

  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4C542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Database sparkle -->
    <path d="M113 18 L113 27"/>
    <path d="M109 22 L118 22"/>

    <!-- Emphasis near cylinder -->
    <path d="M10 53 L14 50"/>
    <path d="M8 60 L13 59"/>

    <!-- Server group flourish -->
    <path d="M116 77 L119 72"/>
    <path d="M122 81 L126 78"/>

  </g>

  <!-- Handwritten-style motion strokes -->
  <g stroke="#0078D4" stroke-width="1.7" stroke-linecap="round" fill="none" opacity=".6">

    <path d="M29 124 Q37 127 46 126"/>
    <path d="M51 126 L56 126"/>

    <path d="M12 32 Q9 38 11 44"/>
    <path d="M99 9 Q105 11 109 15"/>

  </g>

</svg>

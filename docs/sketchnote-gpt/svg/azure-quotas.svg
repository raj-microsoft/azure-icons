<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Quotas (sketch)</title>

  
  <desc>
    Hand-drawn Azure cloud with three upward quota arrows.
    Original Azure blue and lime-green colours, uneven marker
    outlines, subtle yellow accents, and transparent background.
  </desc>

  <defs>
    <linearGradient id="cloudBlue" x1="64" y1="19" x2="64" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="arrowGreen" x1="64" y1="45" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B4EC36"/>
      <stop offset="1" stop-color="#86D633"/>
    </linearGradient>

    <linearGradient id="sideGreen" x1="64" y1="71" x2="64" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86D633"/>
      <stop offset="1" stop-color="#76BC2D"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn Azure cloud silhouette -->
  <path d="M37 105        C21 106 12 96 12 83        C11 69 21 58 35 57        C40 37 55 23 73 24        C93 24 105 38 106 56        C118 58 125 69 124 82        C123 95 114 104 101 105        C82 106 57 105 37 105Z" fill="url(#cloudBlue)" stroke="#174D78" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Loose secondary sketch contour -->
  <path d="M19 70        Q24 60 36 61        M40 51        Q49 28 70 28        M81 29        Q103 36 102 58        M112 64        Q120 71 119 83" stroke="#D8EEFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>

  <!-- Sketchy cloud highlight -->
  <path d="M24 79 Q23 88 29 94        M33 98 Q37 100 42 100" stroke="#8BCBFF" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

  <!-- Central upward quota arrow -->
  <path d="M59 105        L59 65        L49 65        Q47 65 49 62        L62 47        Q64 44 66 47        L79 62        Q81 65 77 65        L69 65        L69 105Z" fill="url(#arrowGreen)" stroke="#365D29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand-drawn central arrow inner highlight -->
  <path d="M63 98        Q62 84 63 71        M58 60 L64 53 L70 60" stroke="#E5FF9A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>

  <!-- Left smaller quota arrow -->
  <path d="M34 104        L34 82        L28 82        Q26 82 28 79        L39 67        Q41 65 43 68        L53 79        Q55 82 52 82        L46 82        L46 105Z" fill="url(#sideGreen)" stroke="#365D29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right smaller quota arrow -->
  <path d="M84 105        L84 82        L78 82        Q76 82 78 79        L89 67        Q91 65 93 68        L103 79        Q105 82 102 82        L96 82        L96 104Z" fill="url(#sideGreen)" stroke="#365D29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle marker strokes on side arrows -->
  <path d="M39 96 L39 86        M89 96 L89 86" stroke="#D4F779" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>

  <!-- Yellow hand-drawn emphasis marks -->
  <g stroke="#F5C84C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 35 L64 40"/>
    <path d="M51 39 L55 43"/>
    <path d="M77 39 L73 43"/>
  </g>

  <!-- Small sketchnote motion marks -->
  <g stroke="#D9F1FF" stroke-width="2.1" stroke-linecap="round" opacity=".9">
    <path d="M18 54 L24 50"/>
    <path d="M15 61 L21 59"/>
    <path d="M111 43 L116 47"/>
    <path d="M115 53 L121 55"/>
  </g>

  <!-- Organic baseline marker -->
  <path d="M35 110        Q64 112 94 110" stroke="#174D78" stroke-width="2" stroke-linecap="round" stroke-dasharray="13 5 3 5" opacity=".45"/>

</svg>

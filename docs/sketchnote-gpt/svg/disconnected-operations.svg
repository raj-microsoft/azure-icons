<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Disconnected Operations (sketch)</title>
  
  <desc>Azure-blue cloud divided by a diagonal disconnection slash, with uneven silver-grey marker outlines and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="cloudBlue" x1="42" y1="30" x2="87" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0FAFFF"/>
      <stop offset="1" stop-color="#2764E7"/>
    </linearGradient>
    <linearGradient id="cloudLight" x1="27" y1="32" x2="78" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#73D3FF"/>
      <stop offset="1" stop-color="#2764E7"/>
    </linearGradient>
    <linearGradient id="silverLine" x1="13" y1="13" x2="115" y2="117" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8E1E8"/>
      <stop offset="1" stop-color="#AAB3BD"/>
    </linearGradient>
  </defs>

  <!-- Cloud silhouette, intentionally divided -->
  <path d="M41 90            C25 89 15 77 15 63            C15 49 25 37 39 35            C44 20 56 13 70 13            C87 13 99 23 103 38            L41 90Z" fill="url(#cloudLight)" opacity=".72"/>

  <path d="M45 94            L106 40            C118 43 124 53 124 65            C124 81 112 94 96 94Z" fill="url(#cloudBlue)"/>

  <!-- Broken upper cloud contour -->
  <path d="M31 91            C17 86 9 76 9 63            C9 45 21 31 36 29            C43 14 55 8 70 8            C88 8 102 18 108 35" stroke="url(#silverLine)" stroke-width="5"/>

  <!-- Broken lower cloud contour -->
  <path d="M113 39            C124 45 128 54 128 65            C128 85 114 100 95 100            L45 100" stroke="url(#silverLine)" stroke-width="5"/>

  <!-- Loose marker highlight -->
  <path d="M18 60 Q20 43 39 38            M48 26 Q59 14 72 16            M113 77 Q109 89 95 91" stroke="#E7EFF5" stroke-width="2.6" opacity=".85"/>

  <!-- Main diagonal disconnected slash -->
  <path d="M119 9            Q121 7 123 10            L10 119            Q7 122 5 119            Q4 117 7 114Z" fill="#D8E1E8" stroke="#929EAA" stroke-width="2.5"/>

  <!-- Hand-drawn slash highlight -->
  <path d="M116 13            Q91 39 67 61            L13 113" stroke="#FFFFFF" stroke-width="2.5" opacity=".85"/>

  <!-- Small sketch hatches along disconnected edge -->
  <g stroke="#AAB3BD" stroke-width="2">
    <path d="M35 91 L41 85"/>
    <path d="M46 100 L52 94"/>
    <path d="M104 37 L110 31"/>
  </g>

  <!-- Subtle Azure-blue annotation marks -->
  <g stroke="#0078D4" stroke-width="2.4">
    <path d="M22 104 L29 100"/>
    <path d="M99 108 L106 111"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4C542" stroke-width="2.8">
    <path d="M107 12 L109 5"/>
    <path d="M119 24 L126 22"/>
  </g>

  <!-- Small hand-drawn sparkle -->
  <path d="M17 15            L19 20            L24 22            L19 24            L17 29            L15 24            L10 22            L15 20Z" fill="#F4C542" stroke="#C48B17" stroke-width="1.4"/>
</svg>

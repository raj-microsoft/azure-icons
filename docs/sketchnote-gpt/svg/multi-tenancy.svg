<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Multi Tenancy (sketch)</title>
  <defs>
    <linearGradient id="tenantPurple" x1="45" y1="27" x2="45" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="tenantPurpleLight" x1="44" y1="9" x2="48" y2="67" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="tenantBlue" x1="72" y1="78" x2="119" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1988D9"/>
      <stop offset="1" stop-color="#54AEF0"/>
    </linearGradient>
  </defs>

  <!-- Main tenant / group silhouette -->
  <path d="M8 88     C11 65 26 52 47 52     C69 52 84 68 87 89     Q89 97 80 98     L15 98     Q6 98 8 88Z" fill="url(#tenantPurple)" stroke="#6030B5" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Central user -->
  <circle cx="46" cy="31" r="22" fill="url(#tenantPurpleLight)" stroke="#773ADC" stroke-width="3.2"/>

  <!-- Head highlight -->
  <path d="M32 17 Q39 10 49 11" stroke="#DCC9FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Main user shoulders and body detail -->
  <path d="M25 64     Q46 79 68 64     L60 88     Q46 96 33 88Z" fill="#FFFFFF" opacity=".82"/>

  <path d="M37 63 L46 78 L55 63" stroke="#773ADC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary tenant / user -->
  <circle cx="91" cy="37" r="14" fill="#773ADC" stroke="#6030B5" stroke-width="2.8"/>

  <path d="M77 69     C79 54 87 49 97 49     C108 49 117 57 120 71     Q122 78 115 79     L80 79     Q75 78 77 69Z" fill="#773ADC" stroke="#6030B5" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Secondary user highlight -->
  <path d="M84 30 Q90 24 97 27" stroke="#DCC9FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Shared tenancy platform / database layer -->
  <path d="M65 79     L96 91     L119 81     L96 69Z" fill="#54AEF0" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round"/>

  <path d="M65 79     L65 101     L96 115     L96 91Z" fill="#50E6FF" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round"/>

  <path d="M96 91     L119 81     L119 102     L96 115Z" fill="url(#tenantBlue)" stroke="#0078D4" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Platform separation lines -->
  <path d="M65 88 L96 101 L119 91" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- Tenant connection nodes -->
  <g fill="#FFFFFF" stroke="#0078D4" stroke-width="2">
    <circle cx="65" cy="79" r="3.5"/>
    <circle cx="96" cy="91" r="3.5"/>
    <circle cx="119" cy="81" r="3.5"/>
  </g>

  <!-- Yellow multi-tenant emphasis -->
  <path d="M110 28     L113 35 L120 38     L113 41 L110 48     L107 41 L100 38     L107 35Z" fill="#FFCA28" stroke="#D99A00" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M17 43 L20 48 L25 50 L20 52 L17 57 L15 52 L10 50 L15 48Z" fill="#FFCA28" stroke="#D99A00" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Hand-drawn connection / collaboration marks -->
  <g stroke="#773ADC" stroke-width="2" stroke-linecap="round">
    <path d="M70 30 Q76 25 81 30"/>
    <path d="M73 35 Q77 32 81 35"/>
  </g>

  <!-- Marker-style finishing strokes -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".75">
    <path d="M14 82 Q16 75 20 72"/>
    <path d="M69 89 L69 96"/>
    <path d="M103 107 L113 102"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Azure Spring Apps (sketch)</title>
  
  <desc>Four simple hollow Azure-blue window frames in a two-by-two grid, with an overlapping green Spring leaf emblem. Hand-drawn uneven dark marker outlines, flat fills and transparent background.</desc>

  <!-- Upper-left hollow window frame -->
  <path d="M5 5.5            Q5.2 3.6 7.5 3.8            L58.1 4            Q60.2 4.1 60.1 6.5            L60 58.1            Q59.9 60.4 57.8 60.3            L7.2 60.1            Q4.8 60 4.9 57.6 Z            M13 12.8            L13 51.8            L51.7 51.7            L51.8 12.9 Z" fill="#087BDA" fill-rule="evenodd" stroke="#173B55" stroke-width="3" stroke-linejoin="round"/>

  <!-- Upper-right hollow window frame -->
  <path d="M69.9 6.2            Q70 3.8 72.4 3.9            L121.1 4            Q123.6 4.1 123.6 6.5            L123.8 57.8            Q123.8 60.3 121.3 60.3            L70 60.2 Z            M78.1 12.9            L78.1 51.7            L115.4 51.8            L115.5 12.8 Z" fill="#087BDA" fill-rule="evenodd" stroke="#173B55" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lower-left hollow window frame -->
  <path d="M5 69.7            Q5 67.6 7.5 67.6            L57.8 67.5            Q60.1 67.5 60.1 69.9            L60.2 121            Q60.2 123.5 57.9 123.5            L7.3 123.6            Q4.9 123.5 4.9 121 Z            M13.1 75.9            L13 114.7            L51.8 114.7            L51.7 75.9 Z" fill="#087BDA" fill-rule="evenodd" stroke="#173B55" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lower-right hollow window frame -->
  <path d="M70 69.8            Q70 67.5 72.5 67.5            L121 67.6            Q123.5 67.6 123.5 70            L123.6 121            Q123.6 123.5 121.2 123.5            L72.3 123.6            Q69.9 123.5 69.9 121 Z            M78.1 76            L78.1 114.7            L115.4 114.7            L115.5 76 Z" fill="#087BDA" fill-rule="evenodd" stroke="#173B55" stroke-width="3" stroke-linejoin="round"/>

  <!-- Freehand marker retraces on frame edges -->
  <g fill="none" stroke="#17445F" stroke-width="1.4" stroke-linecap="round">
    <path d="M8 7 L24 7.2"/>
    <path d="M73 7 L88 7"/>
    <path d="M8 71 L23 71"/>
    <path d="M73 71 L87 71"/>
  </g>

  <!-- Central Spring circular emblem -->
  <path d="M106 58            C104 42 93 28 78 22            C80 29 78 34 74 40            C64 34 52 34 42 39            C26 46 18 61 20 77            C22 94 36 107 52 110            C69 113 87 107 98 94            C106 84 109 70 106 58 Z" fill="#5FB832" stroke="#234E32" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Spring white leaf -->
  <path d="M43 83            C35 76 36 62 43 55            C52 47 62 49 72 47            C84 45 92 38 97 28            C102 43 108 66 100 79            C93 91 77 90 65 91            C55 92 47 88 43 83 Z" fill="#FFFFFF" stroke="#234E32" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Leaf vein -->
  <path d="M44 91            C59 84 73 80 83 69            C91 61 95 50 97 41" fill="none" stroke="#327C2D" stroke-width="4" stroke-linecap="round"/>

  <!-- Fine organic leaf detail -->
  <path d="M56 82 Q69 80 77 73" fill="none" stroke="#78BD4A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Spring signature dot -->
  <path d="M37 93            C39 91 42.4 92 43 95            C43.6 98 40.5 100.2 38 99            C35.4 98 35.1 95 37 93 Z" fill="#FFFFFF" stroke="#234E32" stroke-width="2"/>

  <!-- Restrained yellow sketchnote accents -->
  <g fill="none" stroke="#E8BC46" stroke-width="2.4" stroke-linecap="round">
    <path d="M64 11 L64 16"/>
    <path d="M115 63 L120 63"/>
  </g>
</svg>

    <path d="       M64 33       Q53.4 44.4 43 57       Q37.9 68.5 32.3 80.5       M43 57       Q48.2 68.6 53.5 80.5     "/>
    <path d="       M64 33       Q74.8 44.3 85 57       Q79.5 69.1 74.2 80.5       M85 57       Q90.2 68.8 95.5 80.5     "/>
  </g>

  <g fill="none" stroke="#949494" stroke-width="3.5">
    <path d="       M64 33       Q53.4 44.4 43 57       Q37.9 68.5 32.3 80.5       M43 57       Q48.2 68.6 53.5 80.5     "/>
    <path d="       M64 33       Q74.8 44.3 85 57       Q79.5 69.1 74.2 80.5       M85 57       Q90.2 68.8 95.5 80.5     "/>

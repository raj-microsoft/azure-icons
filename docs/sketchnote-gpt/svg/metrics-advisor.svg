<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Metrics Advisor (sketch)</title>
  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Analytics dashboard -->
    <rect x="12" y="10" width="82" height="84" rx="7" fill="#5EA0EF" stroke="#0078D4" stroke-width="4.5"/>
    <rect x="19" y="17" width="68" height="70" rx="3" fill="#0078D4" stroke="#005BA1" stroke-width="2"/>

    <!-- Dashboard data trend -->
    <path d="M27 69 L41 48 L56 57 L73 32 L81 36" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <path d="M27 69 L41 48 L56 57 L73 32 L81 36" fill="none" stroke="#B8DDFB" stroke-width="1.3"/>

    <!-- Data points -->
    <g fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5">
      <circle cx="27" cy="69" r="4"/>
      <circle cx="41" cy="48" r="4"/>
      <circle cx="56" cy="57" r="4"/>
      <circle cx="73" cy="32" r="4"/>
      <circle cx="81" cy="36" r="4"/>
    </g>

    <!-- Dashboard baseline and data lines -->
    <path d="M26 77 L78 77 M26 82 L57 82" fill="none" stroke="#9CEBFF" stroke-width="2"/>

    <!-- Advisor gear -->
    <path d="M105 47              L111 49 L115 46 L121 49 L120 55              L124 59 L121 65 L115 66              L112 72 L105 70 L102 65              L96 64 L95 57 L100 53 Z" fill="#005BA1" stroke="#003F70" stroke-width="3"/>

    <!-- Gear inner circle -->
    <circle cx="109" cy="59" r="11" fill="#FFD400" stroke="#E49A00" stroke-width="2.5"/>
    <circle cx="109" cy="59" r="4.5" fill="#FFF3B0" stroke="#E49A00" stroke-width="2"/>

    <!-- Magnifying / insight indicator -->
    <path d="M98 78 L85 91" fill="none" stroke="#32BEDD" stroke-width="7"/>
    <path d="M98 78 L85 91" fill="none" stroke="#0078D4" stroke-width="2.5"/>

    <!-- Yellow insight spark -->
    <path d="M112 23 L116 15 M120 28 L127 25" fill="none" stroke="#FFD400" stroke-width="3.5"/>

    <!-- Cyan analysis accents -->
    <path d="M7 40 L12 36 M7 50 L12 48" fill="none" stroke="#50E6FF" stroke-width="3"/>
    <path d="M20 101 Q48 105 72 101" fill="none" stroke="#32BEDD" stroke-width="2.5"/>

    <!-- Hand-drawn finishing details -->
    <path d="M17 7 Q36 3 51 7" fill="none" stroke="#0078D4" stroke-width="2"/>
    <path d="M91 107 Q105 110 119 105" fill="none" stroke="#005BA1" stroke-width="2"/>

  </g>
</svg>

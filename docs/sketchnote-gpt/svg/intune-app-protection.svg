  <!-- Right-pointing application arrow -->
  <path d="M78.6 74.6            L97.8 74.6            L97.8 69.8            Q97.8 68.5 99.1 69.5            L108 78            Q109.3 79.2 108 80.5            L99.1 89            Q97.8 90 97.8 88.4            L97.8 83.7            L78.6 83.7 Z" fill="#0078D4" stroke="#173F60" stroke-width="2.5"/>

  <!-- Minimal yellow sketchnote accents -->

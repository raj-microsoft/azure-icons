<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Intune App Protection (sketch)</title>
  
  <desc>Wide Azure-blue desktop monitor with a large circular connection symbol, overlapping cyan mobile device, and right-pointing application arrow. Flat fills, uneven dark marker outlines, and transparent background.</desc>

  <!-- Wide desktop monitor -->
  <path d="M7.3 9.2            Q4.1 9.1 4 12.5            L4.1 76.4            Q4.2 79.7 7.6 79.8            L107.3 79.9            Q110.8 79.8 110.7 76.3            L110.8 12.6            Q110.7 9.2 107.4 9.1 Z" fill="#5EA0EF" stroke="#173F60" stroke-width="3.5"/>


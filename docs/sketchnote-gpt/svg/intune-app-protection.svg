  <!-- Subtle freehand monitor edge retrace -->
  <path d="M9 12.6 Q30 12 49 12.6" stroke="#173F60" stroke-width="1.4"/>

  <!-- Monitor stand -->
  <path d="M46.4 79.8            L68.1 79.9            Q67.6 90.1 69.6 96.5            Q71.2 101.5 77.7 102.7            L80.8 106.4            L33.8 106.4            L36.6 102.7            Q43.2 101.5 44.8 96.4            Q46.5 90 46.4 79.8 Z" fill="#1F56A3" stroke="#173F60" stroke-width="3.4"/>


  <!-- Large circular connection symbol -->
  <path d="M57.2 35.1            C63.3 35 67.9 39.7 68 45.4            C68.1 51.5 63.5 56.3 57.4 56.4            C51.4 56.5 46.6 51.9 46.6 45.8            C46.5 39.9 51.1 35.3 57.2 35.1 Z" fill="#E6F6FF" stroke="#174F71" stroke-width="3.3"/>

  <!-- Subtle circular marker retrace -->
  <path d="M49.7 42            Q52.1 37.7 57.6 37.8" stroke="#32BEDD" stroke-width="1.8"/>

  <!-- Cyan horizontal connection into mobile device -->
  <path d="M68 45.8            L79.1 45.8" stroke="#174F71" stroke-width="8"/>
  <path d="M68 45.8            L79.1 45.8" stroke="#32BEDD" stroke-width="5"/>


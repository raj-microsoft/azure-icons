<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Virtual Networks (sketch)</title>
  
  <desc>Hand-drawn Azure Virtual Networks icon with blue code-style brackets enclosing three green network nodes.</desc>

  <defs>
    <linearGradient id="vnetBlue" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0" stop-color="#1490DF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="vnetCyan" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0" stop-color="#9CEBFF"/>
      <stop offset="1" stop-color="#50E6FF"/>
    </linearGradient>
    <linearGradient id="vnetGreen" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0" stop-color="#86D633"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Left upper bracket -->
  <path d="M43 19            Q40 16 37 20            L10 48            Q7 51 10 54            L17 61            Q20 63 23 60            L47 35            Q50 32 47 29 Z" fill="url(#vnetBlue)" stroke="#12649C" stroke-width="3"/>

  <!-- Left lower bracket -->
  <path d="M17 59            L10 67            Q7 70 10 74            L38 103            Q41 106 44 103            L48 98            Q50 95 47 92            L23 67 Z" fill="url(#vnetCyan)" stroke="#168DBA" stroke-width="3"/>

  <!-- Right upper bracket -->
  <path d="M85 19            Q88 16 91 20            L118 48            Q121 51 118 54            L111 61            Q108 63 105 60            L81 35            Q78 32 81 29 Z" fill="url(#vnetBlue)" stroke="#12649C" stroke-width="3"/>

  <!-- Right lower bracket -->
  <path d="M111 59            L118 67            Q121 70 118 74            L90 103            Q87 106 84 103            L80 98            Q78 95 81 92            L105 67 Z" fill="url(#vnetCyan)" stroke="#168DBA" stroke-width="3"/>

  <!-- Hand-drawn upper bracket highlights -->
  <path d="M38 24 L15 48" stroke="#8CCBFF" stroke-width="2.6"/>
  <path d="M90 24 L113 48" stroke="#8CCBFF" stroke-width="2.6"/>

  <!-- Lower bracket marker highlights -->
  <path d="M15 72 Q28 87 41 99" stroke="#D4F9FF" stroke-width="2.8"/>
  <path d="M113 72 Q100 87 87 99" stroke="#D4F9FF" stroke-width="2.8"/>

  <!-- Left green network node -->
  <path d="M38 54            C43 53 48 58 48 64            C48 70 43 75 37 75            C31 75 27 70 27 64            C27 58 32 54 38 54 Z" fill="url(#vnetGreen)" stroke="#467A20" stroke-width="2.8"/>

  <!-- Center green network node -->
  <path d="M64 54            C70 53 75 58 75 64            C75 70 70 75 64 75            C58 75 53 70 53 64            C53 58 58 54 64 54 Z" fill="url(#vnetGreen)" stroke="#467A20" stroke-width="2.8"/>

  <!-- Right green network node -->
  <path d="M90 54            C96 53 101 58 101 64            C101 70 96 75 90 75            C84 75 79 70 79 64            C79 58 84 54 90 54 Z" fill="url(#vnetGreen)" stroke="#467A20" stroke-width="2.8"/>

  <!-- Network node marker highlights -->
  <path d="M32 61 Q34 57 39 58" stroke="#C3F17B" stroke-width="2.6"/>
  <path d="M59 61 Q61 57 66 58" stroke="#C3F17B" stroke-width="2.6"/>
  <path d="M85 61 Q87 57 92 58" stroke="#C3F17B" stroke-width="2.6"/>

  <!-- Subtle network connection strokes -->
  <path d="M48 64 L53 64            M75 64 L79 64" stroke="#5E9624" stroke-width="2" stroke-dasharray="2 3" opacity=".75"/>

  <!-- Small freehand sketchnote accent marks -->
  <path d="M24 20 L19 15            M17 27 L11 24" stroke="#1490DF" stroke-width="2.4"/>

  <path d="M104 20 L109 15            M111 27 L117 24" stroke="#1490DF" stroke-width="2.4"/>

  <!-- Tiny network sparkle -->
  <path d="M64 87 L64 95            M60 91 L68 91" stroke="#86D633" stroke-width="2.3"/>

  <!-- Light hand-drawn movement accents -->
  <path d="M27 108 Q34 114 42 115" stroke="#50E6FF" stroke-width="2.1"/>

  <path d="M101 108 Q94 114 86 115" stroke="#50E6FF" stroke-width="2.1"/>
</svg>

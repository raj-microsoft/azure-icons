    <!-- Message stream 1 -->
    <path d="M17 42h92" stroke="#ffffff" stroke-width="6"/>
    <path d="M17 42h92" stroke="#fff6c7" stroke-width="1.5" opacity=".7"/>
    <path d="M17 42h12" stroke="#ffffff" stroke-width="8"/>

    <!-- Message stream 2 -->
    <path d="M17 64h92" stroke="#ffe452" stroke-width="6"/>
    <path d="M17 64h92" stroke="#fff4a0" stroke-width="1.5" opacity=".8"/>

    <path d="M13 16.5h102c4 0 6 2.5 6 6v65c0 4-2.5 6-6 6H85l-16 13.5c-2.5 2-5 1-5-2V93.5H13c-4 0-6-2.5-6-6v-65c0-3.5 2.5-6 6-6Z" fill="url(#notificationGold)" stroke="#a96608" stroke-width="3.5"/>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Foundry Agent Service (sketch)</title>
  
  <desc>Six interlocking violet and indigo ribbons forming the recognizable Foundry Agent Service hexagonal swirl, with organic marker outlines and subtle blue and yellow accents.</desc>

  <defs>
    <linearGradient id="violetLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7274FF"/>
      <stop offset="1" stop-color="#4F42FD"/>
    </linearGradient>
    <linearGradient id="violetDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F42FD"/>
      <stop offset="1" stop-color="#2C08AC"/>
    </linearGradient>
    <linearGradient id="violetMid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F42FD"/>
      <stop offset="1" stop-color="#7274FF"/>
    </linearGradient>
  </defs>

  <!-- Outer left ribbon -->
  <path d="M36 111            L18 101            Q10 97 10 87            L10 42            Q10 33 18 28            L30 21            Q32 20 32 24            L32 99            Q32 106 36 111Z" fill="url(#violetLight)" stroke="#3725B5" stroke-width="3.2"/>

  <!-- Lower-left returning ribbon -->
  <path d="M32 95            Q32 101 39 97            L76 75            Q79 73 79 77            L79 90            Q79 98 72 102            L57 111            Q49 116 41 111            Q32 107 32 98Z" fill="url(#violetDark)" stroke="#2C08AC" stroke-width="3.2"/>

  <!-- Lower sweeping ribbon -->
  <path d="M121 69            L121 93            Q121 101 113 106            L79 125            Q72 129 65 125            L54 118            Q52 117 55 115            L113 82            Q121 77 121 69Z" fill="url(#violetMid)" stroke="#3725B5" stroke-width="3.2"/>

  <!-- Right inward folding ribbon -->
  <path d="M75 51            L86 44            Q94 40 101 44            L113 51            Q121 56 121 65            Q121 73 113 78            L110 80            Q108 81 108 78            L72 57            Q70 55 75 51Z" fill="url(#violetDark)" stroke="#2C08AC" stroke-width="3.2"/>

  <!-- Upper sweeping ribbon -->
  <path d="M46 15            L65 4            Q72 0 79 4            L113 23            Q121 28 121 37            L121 49            Q121 52 118 50            L60 17            Q53 13 46 15Z" fill="url(#violetLight)" stroke="#3725B5" stroke-width="3.2"/>

  <!-- Inner left folding ribbon -->
  <path d="M56 65            L45 59            Q38 55 38 47            L38 30            Q38 22 45 18            Q52 14 60 18            L63 20            Q66 22 62 24            L62 65            Q62 68 59 67Z" fill="url(#violetDark)" stroke="#2C08AC" stroke-width="3.2"/>

  <!-- Handmade marker highlights -->
  <g stroke="#B2AEFF" stroke-width="2.5" opacity=".9">
    <path d="M17 41 Q16 62 17 82"/>
    <path d="M42 37 L42 47"/>
    <path d="M69 8 Q75 6 81 11 L104 24"/>
    <path d="M87 119 L110 105"/>
    <path d="M84 82 L84 91"/>
  </g>

  <!-- Short ink reinforcement strokes -->
  <g stroke="#2C08AC" stroke-width="2.1" opacity=".65">
    <path d="M24 93 L30 98"/>
    <path d="M48 107 L60 100"/>
    <path d="M103 49 L113 55"/>
    <path d="M114 87 L114 96"/>
  </g>

  <!-- Subtle Azure-blue sketchnote accents -->
  <g stroke="#5EA0EF" stroke-width="2.7">
    <path d="M24 14 L28 9"/>
    <path d="M32 11 L35 6"/>
    <path d="M91 117 L96 114"/>
  </g>

  <!-- Restrained yellow emphasis -->
  <g stroke="#FFCB3D" stroke-width="3">
    <path d="M103 10 L107 5"/>
    <path d="M111 13 L117 11"/>
    <path d="M12 112 L17 116"/>
    <path d="M21 117 L23 123"/>
  </g>
</svg>

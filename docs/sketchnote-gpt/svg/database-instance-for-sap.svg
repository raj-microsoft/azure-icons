<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Database Instance For SAP (sketch)</title>
  
  <desc>Hand-drawn Azure database cylinder with a cyan SAP instance panel and white isometric cube, preserving the original icon's blue and turquoise palette.</desc>

  <defs>
    <linearGradient id="dbBlue" x1="8" y1="28" x2="83" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="sapCyan" x1="77" y1="75" x2="77" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Database cylinder -->
  <path d="M9 21            C9 11 26 7 44 7            C64 7 81 13 81 22            L81 97            C81 107 65 113 44 113            C24 113 9 106 9 97Z" fill="url(#dbBlue)" stroke="#174E83" stroke-width="3.8"/>

  <!-- Top elliptical rim -->
  <path d="M9 21            C9 11 26 7 44 7            C64 7 81 13 81 22            C81 32 65 36 44 36            C24 36 9 30 9 21Z" fill="#E6E6E6" stroke="#174E83" stroke-width="3.5"/>

  <!-- Cyan database opening -->
  <path d="M18 21            C18 15 30 12 44 12            C60 12 72 16 72 22            C72 28 59 31 44 31            C29 31 18 27 18 21Z" fill="#50E6FF" stroke="#198AB3" stroke-width="2.5"/>

  <!-- Inner data surface -->
  <path d="M25 27            C34 21 55 21 64 28            C52 33 36 33 25 27Z" fill="#198AB3"/>

  <!-- Sketchy cylinder contours -->
  <path d="M14 36            C29 46 60 47 76 37            M14 63            C29 73 60 73 76 64" stroke="#58B9EE" stroke-width="2.4" opacity=".65"/>

  <path d="M15 77 L15 94            Q16 101 28 104            M75 44 L75 58" stroke="#B8EAFF" stroke-width="2.5" opacity=".7"/>

  <!-- SAP instance panel -->
  <path d="M40 75            Q40 72 44 72            L116 72            Q122 72 118 78            L82 119            Q80 122 76 122            L44 122            Q40 122 40 118Z" fill="url(#sapCyan)" stroke="#176B96" stroke-width="3.8"/>

  <!-- Hand-drawn panel highlights -->
  <path d="M46 78 L106 78            M46 84 L46 114            M52 116 L73 116" stroke="#D2F9FF" stroke-width="2.4" opacity=".8"/>

  <!-- Isometric database instance cube -->
  <path d="M63 87            L77 79            L91 87            L77 95Z" fill="#FFFFFF" fill-opacity=".92" stroke="#198AB3" stroke-width="2.5"/>

  <path d="M63 87            L77 95            L77 110            L63 102Z" fill="#FFFFFF" fill-opacity=".75" stroke="#198AB3" stroke-width="2.5"/>

  <path d="M77 95            L91 87            L91 102            L77 110Z" fill="#FFFFFF" fill-opacity=".6" stroke="#198AB3" stroke-width="2.5"/>

  <!-- Small cube sketch highlight -->
  <path d="M67 88 L77 83 L86 88            M67 94 L67 100" stroke="#FFFFFF" stroke-width="1.8" opacity=".9"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M88 13 L93 8            M95 20 L103 18            M88 27 L94 31" stroke="#F6C84B" stroke-width="3.2"/>

  <path d="M29 118 L25 123            M35 120 L34 126" stroke="#F6C84B" stroke-width="2.8"/>

  <!-- Hand-drawn emphasis strokes -->
  <path d="M51 65 Q63 68 74 64" stroke="#32BEDD" stroke-width="2.5"/>

  <path d="M97 108 L104 101            M103 114 L110 107" stroke="#198AB3" stroke-width="2.3"/>

  <!-- Marker dots -->
  <circle cx="98" cy="36" r="2.2" fill="#F6C84B"/>
  <circle cx="22" cy="116" r="2" fill="#32BEDD"/>
</svg>

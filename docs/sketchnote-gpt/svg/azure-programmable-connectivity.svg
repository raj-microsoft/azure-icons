<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Programmable Connectivity (sketch)</title>
  
  <desc>Hand-drawn Azure globe with connected network nodes, overlapping a cyan programmable code window. Transparent background.</desc>

  <defs>
    <linearGradient id="globeBlue" x1="13" y1="12" x2="73" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50B5E8"/>
      <stop offset=".55" stop-color="#2A80C2"/>
      <stop offset="1" stop-color="#1765A8"/>
    </linearGradient>
    <linearGradient id="codeCyan" x1="82" y1="76" x2="92" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn globe silhouette -->
  <path d="M68 57            C72 44 68 29 57 19            C47 9 33 8 22 13            C10 18 5 30 7 43            C9 56 18 66 31 69            C41 72 51 68 58 64" fill="url(#globeBlue)" stroke="#18588E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slightly imperfect globe contour -->
  <path d="M15 22 C7 33 9 48 17 58" stroke="#83D9F2" stroke-width="2.3" stroke-linecap="round" opacity=".8"/>
  <path d="M27 13 C41 8 57 17 63 30" stroke="#A4E9FA" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <!-- Globe longitude and latitude sketch lines -->
  <path d="M27 15 C17 28 17 49 29 66" stroke="#D8F6FF" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <path d="M40 13 C55 27 56 46 47 66" stroke="#D8F6FF" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
  <path d="M10 38 C26 30 46 31 66 39" stroke="#E3F9FF" stroke-width="2.5" stroke-linecap="round" opacity=".62"/>
  <path d="M16 53 C29 58 44 58 59 52" stroke="#D8F6FF" stroke-width="2.5" stroke-linecap="round" opacity=".62"/>

  <!-- Network topology: linked nodes -->
  <path d="M22 35 Q34 21 51 38            M22 35 Q28 51 45 60            M51 38 Q58 48 45 60" stroke="#F5FCFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Connected network nodes -->
  <path d="M22 25            C28 25 33 30 32 36            C31 42 27 46 21 45            C15 44 11 40 12 34            C13 29 17 25 22 25Z" fill="#FFFFFF" stroke="#236C9D" stroke-width="2.7" stroke-linejoin="round"/>
  <path d="M51 31            C56 31 60 35 60 40            C60 45 56 49 51 49            C46 49 42 45 42 40            C42 35 46 31 51 31Z" fill="#F2F2F2" stroke="#236C9D" stroke-width="2.7"/>
  <path d="M45 51            C51 51 55 55 55 61            C55 67 50 71 44 70            C38 69 35 65 35 60            C35 55 39 51 45 51Z" fill="#FFFFFF" stroke="#236C9D" stroke-width="2.7"/>

  <!-- Small marker highlights -->
  <path d="M17 32 L20 29 M47 35 L50 34 M40 57 L43 55" stroke="#B9EFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Programmable connectivity window -->
  <path d="M51 65            Q51 60 56 60            L118 60            Q122 60 122 65            L122 116            Q122 121 117 121            L56 121            Q51 121 51 116Z" fill="url(#codeCyan)" stroke="#176C98" stroke-width="3.7" stroke-linejoin="round"/>

  <!-- Browser top toolbar -->
  <path d="M51 65 Q51 60 56 60            L118 60 Q122 60 122 65            L122 77            Q94 78 51 77Z" fill="#34BDDC" stroke="#176C98" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Informal toolbar separator -->
  <path d="M55 77 Q88 78 119 77" stroke="#12688E" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Browser indicator dots -->
  <circle cx="61" cy="69" r="2.5" fill="#FFFFFF"/>
  <circle cx="70" cy="69" r="2.5" fill="#D9F8FF"/>
  <circle cx="79" cy="69" r="2.5" fill="#FFFFFF"/>

  <!-- Sketchnote code symbols: < / > -->
  <path d="M77 88            L65 98            L77 108" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M99 88            L111 98            L99 108" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M94 84            L82 112" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Hand-drawn offset strokes -->
  <path d="M73 90 L68 95            M103 90 L108 95" stroke="#D9FAFF" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  <path d="M91 87 L85 102" stroke="#A5EFF9" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>

  <!-- Yellow handwritten-style spark -->
  <path d="M108 43 L111 33            M115 48 L122 42            M103 42 L99 36" stroke="#F5C84C" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Tiny sketch accent -->
  <path d="M28 82 Q34 85 41 83" stroke="#F5C84C" stroke-width="3" stroke-linecap="round"/>
  <path d="M34 78 L38 83 L33 87" stroke="#F5C84C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower marker underline -->
  <path d="M68 125 Q88 127 108 124" stroke="#2A80C2" stroke-width="2" stroke-linecap="round" opacity=".55"/>
</svg>

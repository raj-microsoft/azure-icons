<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>MedTech Service (sketch)</title>

  
  <desc>
    Hand-drawn Azure MedTech Service icon featuring a plain blue
    healthcare cloud and an overlapping square medical monitoring
    device with an orange heart and white ECG waveform.
    Flat colors, uneven charcoal marker outlines, no gradients,
    no decorative elements, and a transparent background.
  </desc>

  <!-- Plain Azure cloud: no medical cross or internal symbols -->
  <path d="M35 92        C17 93 4 80 4 63        C4 47 16 34 31 31        C36 12 53 6 65 9        C83 9 98 22 100 39        L91 92        Z" fill="#4394E7" stroke="#203746" stroke-width="3.8"/>

  <!-- Upper device cap -->
  <path d="M75 38        Q75 36 78 36        L110 36        Q113 36 113 39        L113 47        L75 47 Z" fill="#005BA1" stroke="#203746" stroke-width="2.8"/>

  <!-- Main medical monitoring device -->
  <path d="M67 45        Q67 43 70 43        L118 43        Q121 43 121 46        L121 106        Q121 109 118 109        L70 109        Q67 109 67 106 Z" fill="#4394E7" stroke="#203746" stroke-width="3.5"/>

  <!-- Dark recessed display -->
  <path d="M73 51        Q73 49 76 49        L112 49        Q115 49 115 52        L115 101        Q115 103 112 103        L76 103        Q73 103 73 101 Z" fill="#005BA1" stroke="#203746" stroke-width="2.7"/>

  <!-- Orange medical heart -->
  <path d="M94 61        C90 55 83 55 82 61        C80 68 89 75 94 79        C99 75 108 68 106 61        C104 55 97 55 94 61 Z" fill="#FAA21D" stroke="#203746" stroke-width="2.4"/>

  <!-- ECG monitoring waveform -->
  <path d="M74 91        L83 91        L87 84        L92 97        L97 80        L101 90        L106 85        L110 85        L115 85" fill="none" stroke="#203746" stroke-width="4.8"/>

  <path d="M74 91        L83 91        L87 84        L92 97        L97 80        L101 90        L106 85        L110 85        L115 85" fill="none" stroke="#FFFFFF" stroke-width="2.7"/>

  <!-- Lower device cap -->
  <path d="M75 109        L113 109        L113 117        Q113 120 110 120        L78 120        Q75 120 75 117 Z" fill="#005BA1" stroke="#203746" stroke-width="2.8"/>

  <!-- Two small right-side controls -->
  <path d="M122 57        L124 57        Q126 57 126 59        L126 80        Q126 82 124 82        L122 82 Z" fill="#0078D4" stroke="#203746" stroke-width="1.8"/>

  <path d="M122 87        L124 87        Q126 87 126 89        L126 96        Q126 98 124 98        L122 98 Z" fill="#0078D4" stroke="#203746" stroke-width="1.8"/>

</svg>

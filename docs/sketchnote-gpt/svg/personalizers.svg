<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Personalizers (sketch)</title>
  
  <desc>Azure-blue circular personalization loop with a curved arrow, two overlapping cyan user silhouettes, uneven marker outlines, and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="loopBlue" x1="9" y1="17" x2="96" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset=".65" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
    <linearGradient id="darkBlue" x1="34" y1="12" x2="98" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#005BA1"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="frontCyan" x1="55" y1="48" x2="81" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="backCyan" x1="90" y1="51" x2="111" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32BEDD"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
  </defs>

  <!-- Circular personalization loop -->
  <path d="M34 21            C47 12 65 12 79 19            C91 25 99 36 102 49            L88 52            C84 38 72 29 58 29            C50 29 43 31 37 36 Z" fill="url(#darkBlue)" stroke="#064F91" stroke-width="3.3"/>

  <!-- Large sweeping feedback arrow -->
  <path d="M25 42            C14 55 12 72 19 88            C28 111 54 120 76 111            C91 105 101 92 103 76            L89 73            C88 87 79 98 66 102            C51 107 35 100 29 86            C23 73 26 61 35 51            L45 58            Q48 60 47 55            L41 21            Q40 18 37 19            L12 24            Q8 25 12 28 Z" fill="url(#loopBlue)" stroke="#075A9D" stroke-width="3.6"/>

  <!-- Loose marker highlights -->
  <path d="M20 61            C17 80 26 98 42 106" stroke="#B7DCFF" stroke-width="2.5" opacity=".9"/>
  <path d="M45 21            C63 15 81 24 90 38" stroke="#5EA0EF" stroke-width="2.5"/>
  <path d="M29 32 L37 29 L39 43" stroke="#C9E6FF" stroke-width="2.2"/>

  <!-- Rear person: head -->
  <path d="M101 53            C109 53 115 59 115 67            C115 75 109 81 101 81            C93 81 87 75 87 67            C87 59 93 53 101 53 Z" fill="url(#backCyan)" stroke="#147EAA" stroke-width="3"/>

  <!-- Rear person: shoulders -->
  <path d="M101 79            C117 79 124 90 125 105            Q125 110 120 110            L83 110            Q79 110 80 105            C81 90 88 79 101 79 Z" fill="url(#backCyan)" stroke="#147EAA" stroke-width="3.2"/>

  <!-- Rear silhouette highlight -->
  <path d="M95 60 Q100 56 105 60" stroke="#B8F3FF" stroke-width="2.4"/>
  <path d="M112 88 Q119 94 119 102" stroke="#8CE7F7" stroke-width="2.2"/>

  <!-- Foreground person: head -->
  <path d="M73 44            C83 43 91 51 91 61            C91 71 83 80 73 80            C62 80 54 72 54 62            C54 52 62 44 73 44 Z" fill="url(#frontCyan)" stroke="#0795BF" stroke-width="3.5"/>

  <!-- Foreground person: shoulders and torso -->
  <path d="M73 78            C91 78 102 91 105 114            Q106 120 99 120            L46 120            Q40 120 41 114            C43 92 54 78 73 78 Z" fill="url(#frontCyan)" stroke="#0795BF" stroke-width="3.5"/>

  <!-- Sketchnote details on foreground -->
  <path d="M61 56 Q66 49 74 50" stroke="#D4FAFF" stroke-width="3"/>
  <path d="M52 108 Q55 91 65 87" stroke="#D4FAFF" stroke-width="2.6" opacity=".9"/>
  <path d="M92 96 Q97 103 98 113" stroke="#159FC3" stroke-width="2" opacity=".75"/>

  <!-- Yellow personalization spark -->
  <path d="M109 26 L109 38            M103 32 L115 32" stroke="#F4C542" stroke-width="3.4"/>
  <path d="M119 20 L122 16            M119 43 L123 46" stroke="#F4C542" stroke-width="2.5"/>

  <!-- Hand-drawn movement strokes -->
  <path d="M8 71 L6 79            M12 92 L16 99" stroke="#32BEDD" stroke-width="2.5"/>
  <path d="M48 125 Q73 127 96 124" stroke="#0078D4" stroke-width="1.8" opacity=".65"/>
</svg>

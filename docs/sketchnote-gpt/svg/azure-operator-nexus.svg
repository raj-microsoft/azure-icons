<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Operator Nexus (sketch)</title>

  
  <desc>
    Hand-drawn Azure Operator Nexus icon featuring a tall
    Azure-blue infrastructure building with white server windows,
    an overlapping cyan cloud, and a wireless signal node.
    Original Azure colors, uneven marker outlines, restrained
    yellow accents, and a transparent background.
  </desc>

  <defs>
    <linearGradient id="nexusTower" x1="91" y1="8" x2="91" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".18" stop-color="#559CEC"/>
      <stop offset=".47" stop-color="#3C91E5"/>
      <stop offset=".84" stop-color="#1380DA"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="nexusCloud" x1="52" y1="61" x2="52" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset=".55" stop-color="#3DD4F0"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>

    <linearGradient id="nexusSignal" x1="23" y1="82" x2="23" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Tall infrastructure building -->
  <path d="     M57 9     Q57 5 62 5     L120 5     Q124 5 124 10     L124 117     Q124 121 120 121     L61 121     Q57 121 57 117     Z" fill="url(#nexusTower)" stroke="#005BA1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Building marker highlights -->
  <path d="     M64 12     Q89 11 116 12" stroke="#D1E8FF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".85"/>

  <path d="     M119 18     Q120 48 119 78" stroke="#9CCFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity=".65"/>

  <!-- Server windows, first row -->
  <g fill="#FFFFFF" stroke="#0078D4" stroke-width="1.8" stroke-linejoin="round">
    <path d="M66 18 Q66 17 68 17 H77 Q79 17 79 19 V33 Q79 35 77 35 H68 Q66 35 66 33 Z"/>
    <path d="M86 18 Q86 17 88 17 H97 Q99 17 99 19 V33 Q99 35 97 35 H88 Q86 35 86 33 Z"/>
    <path d="M106 18 Q106 17 108 17 H117 Q119 17 119 19 V33 Q119 35 117 35 H108 Q106 35 106 33 Z"/>
  </g>

  <!-- Server windows, second row -->
  <g fill="#FFFFFF" stroke="#0078D4" stroke-width="1.8" stroke-linejoin="round">
    <path d="M66 45 Q66 44 68 44 H77 Q79 44 79 46 V60 Q79 62 77 62 H68 Q66 62 66 60 Z"/>
    <path d="M86 45 Q86 44 88 44 H97 Q99 44 99 46 V60 Q99 62 97 62 H88 Q86 62 86 60 Z"/>
    <path d="M106 45 Q106 44 108 44 H117 Q119 44 119 46 V60 Q119 62 117 62 H108 Q106 62 106 60 Z"/>
  </g>

  <!-- Server windows, third row -->
  <g fill="#FFFFFF" stroke="#0078D4" stroke-width="1.8" stroke-linejoin="round">
    <path d="M66 72 Q66 71 68 71 H77 Q79 71 79 73 V87 Q79 89 77 89 H68 Q66 89 66 87 Z"/>
    <path d="M86 72 Q86 71 88 71 H97 Q99 71 99 73 V87 Q99 89 97 89 H88 Q86 89 86 87 Z"/>
    <path d="M106 72 Q106 71 108 71 H117 Q119 71 119 73 V87 Q119 89 117 89 H108 Q106 89 106 87 Z"/>
  </g>

  <!-- Window marker glints -->
  <g stroke="#9CEBFF" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M69 21 L72 21"/>
    <path d="M89 21 L92 21"/>
    <path d="M109 21 L112 21"/>
    <path d="M69 48 L72 48"/>
    <path d="M89 48 L92 48"/>
    <path d="M109 48 L112 48"/>
    <path d="M109 75 L112 75"/>
  </g>

  <!-- Cloud silhouette -->
  <path d="     M36 120     C25 121 17 113 17 103     C17 94 23 87 32 85     C37 71 49 62 63 63     C79 63 91 74 92 89     C103 91 110 99 110 108     C109 116 103 121 94 121     L38 121     Z" fill="url(#nexusCloud)" stroke="#198AB3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cloud highlights -->
  <path d="     M25 99     Q28 91 36 91     Q40 76 53 71     Q61 68 68 71" stroke="#C7FAFF" stroke-width="3" stroke-linecap="round" fill="none" opacity=".85"/>

  <path d="     M78 75     Q87 81 87 91     M96 96     Q104 100 104 107" stroke="#B1F4FF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".7"/>

  <!-- Cloud lower marker contour -->
  <path d="     M39 116     Q64 118 91 116" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round" fill="none" opacity=".55"/>

  <!-- Wireless signal node -->
  <circle cx="34" cy="99" r="8" fill="#FFFFFF" stroke="#0078D4" stroke-width="3"/>

  <circle cx="34" cy="99" r="3.5" fill="#5EA0EF"/>

  <!-- Inner wireless arcs -->
  <g stroke="url(#nexusSignal)" stroke-linecap="round" fill="none">
    <path d="       M23 89       Q16 97 22 106" stroke-width="3.6"/>

    <path d="       M18 83       Q7 97 17 112" stroke-width="3.6"/>

    <path d="       M45 89       Q52 97 46 106" stroke-width="3.4"/>

    <path d="       M50 83       Q61 96 52 110" stroke-width="3.4"/>
  </g>

  <!-- Wireless hand-drawn echo strokes -->
  <g stroke="#50E6FF" stroke-width="1.7" stroke-linecap="round" fill="none">
    <path d="M13 87 Q8 96 12 104"/>
    <path d="M55 87 Q59 96 56 103"/>
  </g>

  <!-- Infrastructure connection detail -->
  <path d="     M82 94     Q89 98 93 104" stroke="#0078D4" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="3 5" fill="none"/>

  <!-- Yellow sketchnote accents -->
  <g stroke="#F4C542" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M46 48 L51 44" stroke-width="2.8"/>
    <path d="M43 55 L49 54" stroke-width="2.5"/>
    <path d="M48 39 L50 34" stroke-width="2.4"/>

    <path d="M111 98 L116 95" stroke-width="2.8"/>
    <path d="M114 105 L120 105" stroke-width="2.4"/>

    <path d="M63 124 Q73 127 83 124" stroke-width="2.4"/>
  </g>

  <!-- Loose marker accents -->
  <g stroke="#0078D4" stroke-linecap="round" fill="none">
    <path d="M8 66 Q12 61 18 59" stroke-width="1.8"/>
    <path d="M9 73 L15 70" stroke-width="1.7"/>
    <path d="M101 124 Q111 125 118 123" stroke-width="1.7"/>
  </g>

  <!-- Tiny hand-drawn annotation dots -->
  <circle cx="40" cy="26" r="1.9" fill="#50E6FF"/>
  <circle cx="47" cy="20" r="1.5" fill="#0078D4"/>
  <circle cx="115" cy="113" r="1.8" fill="#F4C542"/>

</svg>

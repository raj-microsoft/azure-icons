<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Peerings (sketch)</title>
  <defs>
    <linearGradient id="peerCloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="peerGlobe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#168DE0"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Cloud representing connected peer network -->
  <g stroke="#6330B6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 65       C34 65 27 55 29 44       C30 33 39 27 50 28       C54 13 68 8 81 14       C89 17 95 24 96 34       C107 35 114 43 114 53       C114 63 106 69 96 69       L48 69 Z" fill="url(#peerCloud)"/>
    <path d="M36 43 Q38 32 49 31" fill="none" stroke="#C8A9FF" stroke-width="2"/>
    <path d="M65 16 Q77 12 86 20" fill="none" stroke="#C8A9FF" stroke-width="2"/>
  </g>

  <!-- Cloud connection arrow -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M61 51 Q64 37 80 37"/>
    <path d="M73 30 L81 37 L73 44"/>
  </g>

  <!-- Globe representing virtual network -->
  <circle cx="48" cy="79" r="36" fill="url(#peerGlobe)" stroke="#005A9E" stroke-width="3.5"/>

  <!-- Globe latitude and longitude -->
  <g fill="none" stroke="#A9D6FF" stroke-width="2.6" stroke-linecap="round">
    <ellipse cx="48" cy="79" rx="15" ry="35"/>
    <path d="M14 79 Q48 70 82 79"/>
    <path d="M17 65 Q48 73 79 65"/>
    <path d="M17 93 Q48 85 79 93"/>
    <path d="M48 44 L48 114"/>
  </g>

  <!-- Globe highlight -->
  <path d="M24 59 Q31 48 42 47" fill="none" stroke="#D5ECFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Network peer connection nodes -->
  <g stroke="#075B9B" stroke-width="2.5">
    <circle cx="48" cy="79" r="5" fill="#F2C94C"/>
    <circle cx="80" cy="79" r="5" fill="#F2C94C"/>
    <circle cx="48" cy="47" r="4" fill="#F2C94C"/>
  </g>

  <!-- Peer connection lines -->
  <g fill="none" stroke="#F2C94C" stroke-width="3" stroke-linecap="round">
    <path d="M53 79 L75 79"/>
    <path d="M48 52 L48 73"/>
  </g>

  <!-- Small hand-drawn network accents -->
  <g fill="none" stroke="#F2C94C" stroke-width="2.5" stroke-linecap="round">
    <path d="M101 76 L108 72"/>
    <path d="M109 84 L116 84"/>
    <path d="M100 94 L105 100"/>
    <path d="M15 34 L10 29"/>
    <path d="M18 25 L17 18"/>
  </g>

  <!-- Sketchnote marker details -->
  <g fill="none" stroke-linecap="round">
    <path d="M11 105 Q15 111 22 113" stroke="#50A9ED" stroke-width="2.5"/>
    <path d="M86 112 Q92 115 98 110" stroke="#0078D4" stroke-width="2"/>
    <path d="M117 48 L121 44" stroke="#A67AF4" stroke-width="2.5"/>
    <path d="M31 119 L37 121" stroke="#50A9ED" stroke-width="2"/>
  </g>
</svg>

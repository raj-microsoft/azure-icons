<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Process Explorer (sketch)</title>
  

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Monitor outer frame -->
    <path d="M12 13 Q11 9 16 9 L112 9 Q117 9 117 14       L116 89 Q116 94 111 94 L17 94 Q12 94 12 89 Z" fill="#1490DF" stroke="#005A9E" stroke-width="3.5"/>

    <!-- Screen -->
    <path d="M19 17 Q18 16 21 16 L108 16 Q110 16 110 19       L109 84 Q109 87 106 87 L21 87 Q18 87 18 84 Z" fill="#FFFFFF" stroke="#5EA0EF" stroke-width="1.8"/>

    <!-- Screen highlight -->
    <path d="M23 20 Q63 18 105 20" fill="none" stroke="#D8EBFF" stroke-width="2"/>

    <!-- Process performance waveform -->
    <path d="M20 54       L36 54       L45 39       Q47 36 49 41       L59 69       Q61 73 63 67       L77 34       Q79 29 81 36       L92 57       Q94 61 97 54       L106 54" fill="none" stroke="#76BC2D" stroke-width="5"/>

    <!-- Waveform highlights -->
    <path d="M36 54 L45 39       M63 67 L77 34       M81 36 L92 57" fill="none" stroke="#A5D76A" stroke-width="2"/>

    <!-- Process data points -->
    <g fill="#76BC2D" stroke="#4B8C20" stroke-width="1.5">
      <circle cx="36" cy="54" r="3.5"/>
      <circle cx="48" cy="43" r="3.5"/>
      <circle cx="62" cy="68" r="3.5"/>
      <circle cx="79" cy="35" r="3.5"/>
      <circle cx="94" cy="56" r="3.5"/>
    </g>

    <!-- Small chart baseline -->
    <path d="M25 75 Q63 77 103 75" fill="none" stroke="#D4E8F7" stroke-width="1.8"/>

    <!-- Monitor stand -->
    <path d="M56 94 Q56 107 51 111       Q47 114 40 116       Q37 117 39 120       L89 120 Q91 117 87 116       Q78 113 74 110       Q71 106 72 94 Z" fill="#1F56A3" stroke="#12447F" stroke-width="3"/>

    <!-- Stand highlight -->
    <path d="M61 98 Q61 108 54 113" fill="none" stroke="#5EA0EF" stroke-width="2.5"/>

    <!-- Stand base -->
    <path d="M39 120 Q63 123 89 120" fill="none" stroke="#1F56A3" stroke-width="3"/>

    <!-- Yellow performance indicator -->
    <path d="M99 28 L103 22 L107 28" fill="none" stroke="#FFCA28" stroke-width="3"/>
    <path d="M104 34 L109 34" fill="none" stroke="#FFCA28" stroke-width="2.5"/>

    <!-- Sketchnote accents -->
    <g fill="none" stroke-linecap="round">
      <path d="M5 39 L9 35 M5 39 L10 41" stroke="#1490DF" stroke-width="2.5"/>
      <path d="M119 47 L124 43 M119 47 L125 49" stroke="#76BC2D" stroke-width="2.5"/>
      <path d="M28 102 L33 99 M35 104 L39 101" stroke="#FFCA28" stroke-width="2.5"/>
      <path d="M94 104 L99 108" stroke="#5EA0EF" stroke-width="2"/>
    </g>

  </g>
</svg>

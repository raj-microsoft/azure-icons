<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Process Explorer (sketch)</title>
  
  <desc id="desc">Azure-blue monitor with a white screen displaying a sharp, angular green heartbeat waveform. Dark uneven marker outlines, flat colors, and a blue monitor stand.</desc>

  <!-- Monitor outer frame -->
  <path d="M5 3            Q3 3 3 8            L3 87            Q3 92 8 93            L120 93            Q125 93 125 88            L125 8            Q125 3 120 3            Z" fill="#1490DF" stroke="#243447" stroke-width="3.5"/>

  <!-- White display -->
  <path d="M11 11            Q10 10 13 10            L115 10            Q118 10 118 13            L118 82            Q118 85 115 85            L12 85            Q10 85 10 82            Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.4"/>

  <!-- Subtle display highlight -->
  <path d="M15 15 Q63 13 113 15" stroke="#D8EBFF" stroke-width="2" opacity=".8"/>

  <!-- Official angular heartbeat waveform:
       horizontal baseline, steep rises and falls,
       sharp vertices, no rounded graph nodes -->
  <path d="M11 58            L30 58            L42 36            L54 72            L66 30            L77 51            L86 39            L118 39" stroke="#243447" stroke-width="8.5"/>

  <path d="M11 58            L30 58            L42 36            L54 72            L66 30            L77 51            L86 39            L118 39" stroke="#76BC2D" stroke-width="5.5" stroke-linecap="butt" stroke-linejoin="miter"/>

  <!-- Sparse green marker highlights -->
  <path d="M32 55 L41 39            M55 67 L65 34            M79 48 L85 41" stroke="#A5D76A" stroke-width="1.5" stroke-linecap="butt" opacity=".8"/>

  <!-- Monitor stand neck -->
  <path d="M50 93            L78 93            Q77 102 79 109            Q81 115 91 118            L37 118            Q47 115 49 109            Q51 102 50 93Z" fill="#1F56A3" stroke="#243447" stroke-width="3.2"/>

  <!-- Stand highlight -->
  <path d="M56 97 Q56 108 51 113" stroke="#5EA0EF" stroke-width="2.2"/>

  <!-- Monitor base -->
  <path d="M37 118            Q32 119 30 124            L98 124            Q96 119 91 118            Q64 120 37 118Z" fill="#1F56A3" stroke="#243447" stroke-width="3"/>

  <!-- Restrained hand-drawn accent marks -->
  <path d="M5 100 L10 97            M8 106 L14 103" stroke="#FFCA28" stroke-width="2.7"/>

  <path d="M115 99 L121 96            M117 105 L123 105" stroke="#FFCA28" stroke-width="2.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Web App + Database (sketch)</title>
  
  <desc>Azure-blue web globe with three white network nodes and irregular connecting paths, accompanied by a tall blue database cylinder and partial cyan orbital arcs.</desc>

  <!-- Main web application globe -->
  <path d="M37 7            C54 5 70 13 79 27            C90 43 87 62 76 75            C65 89 46 94 29 88            C13 82 5 67 5 49            C5 31 16 14 37 7 Z" fill="#2189DD" stroke="#243447" stroke-width="3.5"/>

  <!-- Network connection: upper-left node to lower node -->
  <path d="M20 41            Q24 53 35 60            Q42 66 51 69" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Network connection: lower node to right node -->
  <path d="M52 69            Q67 75 79 70" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Network connection: upper-left node around globe -->
  <path d="M20 41            Q37 16 66 12" stroke="#FFFFFF" stroke-width="3.6"/>

  <!-- Network connection: upper-right direction -->
  <path d="M40 9            Q50 34 76 46" stroke="#FFFFFF" stroke-width="3.6"/>

  <!-- Network connection: right node continuation -->
  <path d="M76 46            Q82 52 83 62" stroke="#FFFFFF" stroke-width="3.5"/>

  <!-- Upper-left network node -->
  <path d="M28 40            C28 47 23 52 17 52            C10 52 6 47 6 40            C6 34 11 29 17 29            C24 29 28 34 28 40 Z" fill="#FFFFFF" stroke="#243447" stroke-width="3"/>

  <!-- Lower network node -->
  <path d="M60 69            C60 74 56 79 50 79            C44 79 40 75 40 69            C40 63 44 59 50 59            C56 59 60 63 60 69 Z" fill="#FFFFFF" stroke="#243447" stroke-width="3"/>

  <!-- Right network node -->
  <path d="M88 48            C88 54 84 58 78 58            C72 58 68 54 68 48            C68 42 72 38 78 38            C84 38 88 42 88 48 Z" fill="#FFFFFF" stroke="#243447" stroke-width="3"/>

  <!-- Cyan orbital arcs around globe -->
  <path d="M70 13            Q100 22 109 48" stroke="#32BEDD" stroke-width="5"/>

  <path d="M14 77            Q22 108 54 114            Q65 117 77 114" stroke="#32BEDD" stroke-width="5"/>

  <!-- Database cylinder body -->
  <path d="M72 64            C72 56 84 51 99 51            C114 51 124 57 124 64            L124 113            C124 121 112 125 99 125            C83 125 72 120 72 113 Z" fill="#0078D4" stroke="#243447" stroke-width="3.5"/>

  <!-- Database top rim -->
  <path d="M72 64            C72 56 83 51 99 51            C114 51 124 57 124 64            C124 72 113 76 99 76            C84 76 72 72 72 64 Z" fill="#E8E8E8" stroke="#243447" stroke-width="3.2"/>

  <!-- Inner cyan database opening -->
  <path d="M80 63            C80 59 88 57 99 57            C110 57 117 60 117 63            C117 67 110 70 99 70            C88 70 80 67 80 63 Z" fill="#50E6FF" stroke="#243447" stroke-width="2.4"/>

  <!-- Dark inner opening depth -->
  <path d="M84 66            Q99 60 113 66            Q100 73 84 66 Z" fill="#198AB3" stroke="#243447" stroke-width="1.5"/>

</svg>

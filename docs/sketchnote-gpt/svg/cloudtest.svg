<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>CloudTest (sketch)</title>

  
  <desc>
    Azure CloudTest icon featuring a soft Azure-blue cloud
    behind a cyan laboratory flask containing dark blue
    testing liquid and a small bug symbol. Uneven marker
    outlines, original Azure colors, subtle yellow accents,
    and a transparent background.
  </desc>

  <defs>
    <linearGradient id="cloudBlue" x1="64" y1="8" x2="64" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="flaskCyan" x1="56" y1="39" x2="56" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CEBFF"/>
      <stop offset="1" stop-color="#50E6FF"/>
    </linearGradient>
  </defs>

  <!-- Azure cloud silhouette -->
  <path d="M37 78            C22 80 10 69 10 55            C10 42 20 31 33 30            C39 15 52 8 67 9            C84 9 97 20 99 36            C113 36 121 46 121 59            C121 72 111 79 99 79            Z" fill="url(#cloudBlue)" stroke="#1766A8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cloud marker highlights -->
  <g stroke="#B8E0FF" stroke-width="3" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M19 51 Q21 39 34 38"/>
    <path d="M44 27 Q52 16 66 17"/>
    <path d="M80 21 Q91 27 92 39"/>
  </g>

  <!-- Sketch-style cloud contour accents -->
  <g stroke="#005BA1" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M17 65 Q23 73 34 72"/>
    <path d="M103 44 Q114 48 114 59"/>
    <path d="M104 73 Q110 70 113 65"/>
  </g>

  <!-- Flask rim -->
  <path d="M40 38            Q40 35 44 35            L77 35            Q81 35 81 39            L81 42            Q81 46 77 46            L44 46            Q40 46 40 42Z" fill="#C3F1FF" stroke="#1766A8" stroke-width="3" stroke-linejoin="round"/>

  <!-- Flask body -->
  <path d="M47 46            L47 70            Q47 73 45 76            L19 116            Q16 122 23 122            L99 122            Q106 122 103 116            L77 76            Q75 73 75 70            L75 46Z" fill="url(#flaskCyan)" stroke="#1766A8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flask glass highlight -->
  <path d="M52 51            L52 72            Q52 76 49 81            L29 112" stroke="#E1FAFF" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".9"/>

  <!-- Dark Azure testing liquid -->
  <path d="M50 65            Q50 63 53 63            L69 63            Q72 63 72 66            L72 73            Q72 77 75 82            L95 114            Q97 118 92 118            L29 118            Q25 118 28 114            L48 82            Q50 78 50 74Z" fill="#005BA1" stroke="#164D81" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Liquid surface -->
  <path d="M50 68            Q59 66 72 68" stroke="#50E6FF" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Tiny laboratory bubbles -->
  <g fill="#9CEBFF" stroke="#50E6FF" stroke-width="1.5">
    <circle cx="42" cy="105" r="2.4"/>
    <circle cx="83" cy="108" r="2"/>
    <circle cx="69" cy="78" r="1.7"/>
  </g>

  <!-- Testing bug: head -->
  <circle cx="61" cy="86" r="4" fill="#C3F1FF"/>

  <!-- Testing bug: body -->
  <path d="M61 91            C54 91 52 97 53 103            C54 110 58 113 61 113            C65 113 69 109 69 103            C70 97 67 91 61 91Z" fill="#C3F1FF" stroke="#B2EAFF" stroke-width="1.5"/>

  <!-- Bug center line -->
  <path d="M61 94 L61 110" stroke="#005BA1" stroke-width="2" stroke-linecap="round"/>

  <!-- Bug antennae -->
  <g stroke="#C3F1FF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M58 83 L54 79"/>
    <path d="M64 83 L68 79"/>
  </g>

  <!-- Bug legs -->
  <g stroke="#C3F1FF" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M54 97 L47 94"/>
    <path d="M53 102 L45 102"/>
    <path d="M54 107 L48 112"/>

    <path d="M68 97 L75 94"/>
    <path d="M69 102 L77 102"/>
    <path d="M68 107 L74 112"/>
  </g>

  <!-- Small cyan marker accents -->
  <g stroke="#9CEBFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M35 112 L39 105"/>
    <path d="M85 112 L81 105"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4BE46" stroke-width="2.8" stroke-linecap="round" fill="none">
    <path d="M16 21 L11 16"/>
    <path d="M24 16 L24 9"/>
    <path d="M110 20 L115 14"/>
    <path d="M116 28 L123 26"/>
  </g>

  <!-- Hand-drawn laboratory sparkle -->
  <path d="M109 96 L109 104            M105 100 L113 100" stroke="#F4BE46" stroke-width="2.5" stroke-linecap="round"/>

</svg>

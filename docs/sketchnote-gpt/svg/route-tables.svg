<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Route Tables (sketch)</title>

  
  <desc id="desc">
    Hand-drawn Azure Route Tables icon featuring a cyan
    circular node above a rounded cyan base with a white
    downward wedge, and a blue routing arrow on the left
    pointing left, matching the official icon.
  </desc>

  <!-- Rounded destination base -->
  <path d="M 34 119        C 35 109, 38 98, 44 88        C 50 78, 61 72, 75 71        C 89 70, 100 75, 107 86        C 114 96, 119 107, 121 117        Q 122 122, 117 123        L 40 123        Q 34 123, 34 119 Z" fill="#29B8DE" stroke="#203746" stroke-width="3.5"/>

  <!-- White downward wedge inside base -->
  <path d="M 61 75        Q 74 83, 88 75        L 75 109        Q 74 111, 73 108 Z" fill="#FFFFFF" stroke="#203746" stroke-width="2.8"/>

  <!-- Cyan circular network node -->
  <path d="M 102 42        C 103 57, 92 69, 77 70        C 62 71, 50 61, 48 46        C 46 31, 56 18, 71 16        C 87 13, 100 25, 102 42 Z" fill="#32C9EC" stroke="#203746" stroke-width="3.5"/>

  <!-- Left-pointing routing arrow:
       vertical shaft, bottom horizontal arm,
       and arrowhead on the LEFT -->
  <path d="M 43 42        L 43 9        Q 43 6, 40 6        L 33 6        Q 30 6, 30 9        L 30 39        Q 30 42, 27 42        L 21 42        L 21 33        Q 21 31, 19 33        L 4 48        Q 2 50, 4 52        L 19 67        Q 21 69, 21 66        L 21 57        L 40 57        Q 43 57, 43 54 Z" fill="#0078D4" stroke="#203746" stroke-width="3.5"/>

</svg>

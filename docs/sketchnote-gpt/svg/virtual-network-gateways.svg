<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Virtual Network Gateways (sketch)</title>
  <defs>
    <linearGradient id="gatewayCyan" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#32d4f5"/>
      <stop offset=".47" stop-color="#31d1f3"/>
      <stop offset=".77" stop-color="#29bade"/>
      <stop offset="1" stop-color="#198ab3"/>
    </linearGradient>
  </defs>

  <!-- Gateway arch -->
  <path d="M27 56     L27 39     C27 17 42 7 64 7     C86 7 101 18 101 39     L101 56" fill="none" stroke="url(#gatewayCyan)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M37 53 L37 39     C37 24 48 17 64 17     C80 17 91 25 91 39     L91 53" fill="none" stroke="#9cebff" stroke-width="3" stroke-linecap="round"/>

  <!-- Gateway body -->
  <path d="M19 56     Q16 56 16 62     L16 112     Q16 120 23 120     L105 120     Q112 120 112 112     L112 62     Q112 56 106 56 Z" fill="url(#gatewayCyan)" stroke="#087ca8" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner panel -->
  <path d="M24 64     Q24 62 28 62     L100 62     Q104 62 104 66     L104 109     Q104 113 100 113     L28 113     Q24 113 24 109 Z" fill="#0078d4" opacity=".48"/>

  <!-- Network routing arrows -->
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Up -->
    <path d="M64 45 L64 68"/>
    <path d="M54 57 L64 47 L74 57"/>

    <!-- Down -->
    <path d="M64 84 L64 106"/>
    <path d="M54 96 L64 106 L74 96"/>

    <!-- Left -->
    <path d="M45 82 L23 82"/>
    <path d="M34 72 L24 82 L34 92"/>

    <!-- Right -->
    <path d="M83 82 L105 82"/>
    <path d="M94 72 L104 82 L94 92"/>
  </g>

  <!-- Central network node -->
  <circle cx="64" cy="82" r="9" fill="#9cebff" stroke="#005ba1" stroke-width="3"/>
  <circle cx="64" cy="82" r="3.5" fill="#0078d4"/>

  <!-- Hand-drawn highlights -->
  <g fill="none" stroke="#9cebff" stroke-width="2.5" stroke-linecap="round">
    <path d="M23 69 Q22 85 24 100"/>
    <path d="M104 68 Q106 85 103 99"/>
    <path d="M43 12 Q53 6 65 7"/>
  </g>

  <!-- Yellow sketchnote accents -->
  <g fill="none" stroke="#ffd43b" stroke-width="3" stroke-linecap="round">
    <path d="M13 39 L7 34"/>
    <path d="M115 39 L121 34"/>
    <path d="M12 104 L6 107"/>
    <path d="M115 104 L122 107"/>
  </g>

  <!-- Marker-style connection marks -->
  <g fill="#50e6ff">
    <circle cx="64" cy="30" r="3"/>
    <circle cx="64" cy="115" r="2.5"/>
  </g>
</svg>

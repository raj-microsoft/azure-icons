<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Foundry Project (sketch)</title>
  
  <desc>
    Lavender Azure Foundry project folder with raised tab
    and the original connected white Foundry ribbon symbol.
    Flat fills, uneven charcoal marker outlines,
    transparent background, and no extra geometry.
  </desc>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Rear folder with raised tab -->
    <path d="M5 15          Q5 12 9 12          L49 12          Q51 12 53 14          L69 24          Q70 25 73 25          L122 25          Q126 25 126 29          L126 111          L5 111          Z" fill="#4846DF" stroke="#343244" stroke-width="3.2"/>

    <!-- Small white folder tab label -->
    <path d="M16 18          Q16 17 18 17          L39 17          Q41 17 41 19          L41 22          Q41 23 39 23          L18 23          Q16 23 16 22          Z" fill="#FFFFFF" stroke="#353344" stroke-width="1.8"/>

    <!-- Front folder silhouette -->
    <path d="M5 36          Q5 33 9 33          L49 33          Q51 33 53 31          L62 22          Q64 20 67 20          L122 20          Q126 20 126 24          L126 111          Q126 115 122 115          L9 115          Q5 115 5 111          Z" fill="#9998DE" stroke="#353344" stroke-width="3.5"/>

    <!-- Connected white Foundry ribbon:
         left rising body, upright middle fold,
         and rightward projecting curved loop -->

    <!-- Main rising ribbon body -->
    <path d="M38 91          C37 88 39 84 41 79          L54 46          C57 38 61 34 67 34          L78 34          C81 34 84 36 86 41          L91 55          Q92 58 93 61          L87 61          Q84 60 83 57          L79 44          Q78 41 76 41          L69 41          Q67 41 66 45          L51 88          Q49 94 44 94          L41 94          Q38 94 38 91          Z" fill="#FFFFFF" stroke="#36354B" stroke-width="2.5"/>

    <!-- Continuous ribbon interior and lower sweep -->
    <path d="M69 41          L76 41          Q73 44 73 51          Q72 58 72 64          L72 80          Q72 91 61 91          L45 91          Q48 89 51 82          L60 58          Q63 49 66 44          Q67 42 69 41          Z" fill="#FFFFFF" stroke="#36354B" stroke-width="2.3"/>

    <!-- Right ribbon loop, joined to central upright -->
    <path d="M72 61          Q76 55 84 55          L90 55          Q94 55 94 59          L94 70          Q94 78 86 80          Q84 81 81 81          L72 81          L72 74          L81 74          Q87 74 87 69          L87 62          L84 62          Q80 62 79 66          L79 81          L72 81          Z" fill="#FFFFFF" stroke="#36354B" stroke-width="2.3"/>

    <!-- Negative-space opening inside upper ribbon -->
    <path d="M76 43          Q78 45 79 49          L83 59          Q78 58 74 61          Q74 49 76 43          Z" fill="#9998DE" stroke="#36354B" stroke-width="1.8"/>

  </g>
</svg>

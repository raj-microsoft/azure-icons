<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"><title>Peering Service (sketch)</title>
  

  <!-- Rear dark-blue network disc -->
  <circle cx="52" cy="51" r="43" fill="#185A9D" stroke="#203746" stroke-width="4" stroke-linejoin="round"/>

  <!-- Rear disc hand-drawn contour -->
  <path d="M19 37 Q27 13 52 9 Q76 10 89 30" stroke="#2878B9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Foreground blue globe -->
  <circle cx="80" cy="80" r="42" fill="#168ACB" stroke="#203746" stroke-width="4" stroke-linejoin="round"/>

  <!-- Globe latitude lines -->
  <path d="M40 68 Q80 58 120 68            M38 80 Q80 80 122 80            M40 93 Q80 103 120 93" stroke="#8BDCF5" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Globe longitude meridians -->
  <path d="M80 38            C61 48 57 66 57 80            C57 96 64 110 80 122            M80 38            C99 48 103 66 103 80            C103 96 96 110 80 122" stroke="#8BDCF5" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Single straight cyan connection -->
  <path d="M40 30 L80 80" stroke="#32D4F5" stroke-width="4" stroke-linecap="round"/>

  <!-- Exactly two solid cyan network nodes -->
  <circle cx="40" cy="30" r="8" fill="#32D4F5" stroke="#203746" stroke-width="3"/>

  <circle cx="80" cy="80" r="8" fill="#32D4F5" stroke="#203746" stroke-width="3"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Peering Service (sketch)</title>
  

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Overlapping network globes -->
    <circle cx="45" cy="49" r="37" fill="#005BA1" stroke="#004578" stroke-width="3"/>
    <circle cx="45" cy="49" r="34" fill="#0078D4" stroke="#5EA0EF" stroke-width="1.5"/>

    <circle cx="79" cy="79" r="35" fill="#0078D4" stroke="#005A9E" stroke-width="3"/>

    <!-- Rear globe highlight -->
    <path d="M19 29 Q34 10 55 17" fill="none" stroke="#83B9F9" stroke-width="2.5"/>

    <!-- Front globe latitude and longitude -->
    <g fill="none" stroke="#83B9F9" stroke-width="2.5">
      <path d="M49 47 Q79 44 105 57"/>
      <path d="M47 77 Q78 91 110 78"/>
      <path d="M79 44 Q65 78 79 113"/>
      <path d="M79 44 Q96 77 79 113"/>
      <path d="M46 79 Q65 66 79 44"/>
      <path d="M46 79 Q63 96 79 113"/>
    </g>

    <!-- Globe equator -->
    <path d="M46 79 Q79 73 114 79" fill="none" stroke="#D8EBFF" stroke-width="2.2"/>

    <!-- Globe outer meridian -->
    <path d="M79 44 Q105 59 105 79 Q104 101 79 113" fill="none" stroke="#83B9F9" stroke-width="2"/>

    <!-- Network connection line -->
    <path d="M31 31 L59 63 L78 79" fill="none" stroke="#42E8CA" stroke-width="5"/>
    <path d="M34 34 L60 64" fill="none" stroke="#B4FFF0" stroke-width="1.8"/>

    <!-- Connection nodes -->
    <circle cx="29" cy="28" r="8" fill="#42E8CA" stroke="#007E78" stroke-width="2.5"/>
    <circle cx="29" cy="28" r="2.5" fill="#FFFFFF"/>

    <circle cx="59" cy="63" r="6" fill="#42E8CA" stroke="#007E78" stroke-width="2"/>
    <circle cx="59" cy="63" r="2" fill="#FFFFFF"/>

    <circle cx="79" cy="79" r="9" fill="#42E8CA" stroke="#007E78" stroke-width="2.5"/>
    <circle cx="79" cy="79" r="3" fill="#FFFFFF"/>

    <!-- Marker-style network accents -->
    <g fill="none" stroke-linecap="round">
      <path d="M8 51 L3 48 M8 51 L4 55" stroke="#83B9F9" stroke-width="2.5"/>
      <path d="M109 38 L115 34 M109 38 L115 40" stroke="#42E8CA" stroke-width="2.5"/>
      <path d="M105 110 L111 113 L115 109" stroke="#FFCA28" stroke-width="2.8"/>
      <path d="M39 103 L43 108" stroke="#FFCA28" stroke-width="2.5"/>
    </g>

    <!-- Subtle hand-drawn globe details -->
    <path d="M55 91 Q67 99 73 100" fill="none" stroke="#5EA0EF" stroke-width="1.8"/>
    <path d="M88 53 Q99 59 103 69" fill="none" stroke="#B7D9FF" stroke-width="1.8"/>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Marketplace Management (sketch)</title>
  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Marketplace storefront / shopping bag -->
    <path d="M18 38 L110 38 L112 108 L19 119 Z" fill="#32BEDD" stroke="#087FAE" stroke-width="4.5"/>

    <!-- Right side depth -->
    <path d="M110 38 L119 44 L119 106 L112 108 Z" fill="#50E6FF" stroke="#087FAE" stroke-width="3.5"/>
    <path d="M112 108 L119 106 L109 117 L19 119" fill="#198AB3" stroke="#087FAE" stroke-width="3"/>

    <!-- Bag opening -->
    <path d="M42 39 L42 24              Q42 10 57 10              Q72 10 72 24 L72 39" fill="none" stroke="#767676" stroke-width="5"/>
    <path d="M54 39 L54 24              Q54 16 65 16              Q77 16 77 25 L77 39" fill="none" stroke="#A3A3A3" stroke-width="4"/>

    <!-- Handle highlight -->
    <path d="M45 25 Q46 15 56 14" fill="none" stroke="#D0D0D0" stroke-width="2"/>

    <!-- Storefront front panel -->
    <path d="M29 49 L101 49 L102 105 L29 110 Z" fill="#F6F6F6" stroke="#087FAE" stroke-width="3"/>

    <!-- Product catalogue grid -->
    <g fill="#FFFFFF" stroke="#B5B5B5" stroke-width="1.5">
      <rect x="36" y="57" width="13" height="14" rx="2"/>
      <rect x="54" y="57" width="13" height="14" rx="2"/>
      <rect x="72" y="57" width="13" height="14" rx="2"/>
      <rect x="90" y="57" width="7" height="14" rx="1"/>
      <rect x="36" y="78" width="13" height="14" rx="2"/>
      <rect x="54" y="78" width="13" height="14" rx="2"/>
      <rect x="72" y="78" width="13" height="14" rx="2"/>
      <rect x="90" y="78" width="7" height="14" rx="1"/>
    </g>

    <!-- Product highlights -->
    <g fill="#32BEDD">
      <path d="M40 62 L45 62 L45 67 L40 67 Z"/>
      <path d="M58 62 L63 62 L63 67 L58 67 Z"/>
      <path d="M76 62 L81 62 L81 67 L76 67 Z"/>
    </g>
    <g fill="#86D633">
      <circle cx="42.5" cy="84" r="3"/>
      <circle cx="60.5" cy="84" r="3"/>
      <circle cx="78.5" cy="84" r="3"/>
    </g>

    <!-- Yellow marketplace accent -->
    <path d="M95 19 L101 13 M105 27 L113 24" fill="none" stroke="#FFD447" stroke-width="3.5"/>

    <!-- Sketchnote marker details -->
    <path d="M12 49 L17 46 M12 59 L17 57" fill="none" stroke="#50E6FF" stroke-width="3"/>
    <path d="M34 99 Q57 102 81 98" fill="none" stroke="#D0D0D0" stroke-width="2"/>
    <path d="M24 124 Q64 127 105 122" fill="none" stroke="#087FAE" stroke-width="2.5"/>

  </g>
</svg>

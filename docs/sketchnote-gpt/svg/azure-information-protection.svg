<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Information Protection (sketch)</title>

  
  <desc>
    Hand-drawn Azure Information Protection padlock with
    a cyan-blue shackle, geometric lock body, and three
    connected information nodes. Original Azure colours,
    uneven marker outlines, subtle yellow accents,
    and a transparent background.
  </desc>

  <defs>
    <linearGradient id="lockCyan" x1="32" y1="8" x2="94" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".55" stop-color="#28BFE2"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>

    <linearGradient id="lockFace" x1="22" y1="62" x2="109" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset=".65" stop-color="#32D4F5"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>

    <linearGradient id="nodeSilver" x1="0" y1="-8" x2="8" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#FCFCFC"/>
      <stop offset="1" stop-color="#CCCCCC"/>
    </linearGradient>
  </defs>

  <!-- Curved padlock shackle -->
  <path d="M27 64            L27 41            C27 18 42 6 63 6            C84 6 100 20 100 42            L100 64            L83 64            L83 41            C83 29 75 22 64 22            C53 22 45 30 45 41            L45 64 Z" fill="url(#lockCyan)" stroke="#176B96" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Hand-drawn shackle highlights -->
  <path d="M32 43            C32 23 45 12 63 12" stroke="#A8F3FF" stroke-width="3" stroke-linecap="round" opacity=".85"/>

  <path d="M69 12            C85 15 94 26 94 42" stroke="#0078D4" stroke-width="2" stroke-linecap="round" opacity=".75"/>

  <path d="M40 40            C41 25 51 17 64 17" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity=".65"/>

  <!-- Lock body -->
  <path d="M21 62            Q21 58 26 58            L102 58            Q108 58 108 64            L108 118            Q108 123 103 123            L25 123            Q20 123 20 118            L20 64            Q20 62 21 62 Z" fill="url(#lockFace)" stroke="#176B96" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Folded geometric upper face -->
  <path d="M25 61            L103 61            Q105 61 105 65            L105 117            L25 63 Z" fill="#50E6FF" opacity=".92"/>

  <!-- Translucent diagonal facet -->
  <path d="M24 63            L103 118            L24 118 Z" fill="#FFFFFF" opacity=".18"/>

  <!-- Fine sketched diagonal boundary -->
  <path d="M25 64            Q44 77 63 90            Q85 104 103 117" stroke="#198AB3" stroke-width="1.8" stroke-linecap="round" opacity=".55"/>

  <!-- Inner border sketch -->
  <path d="M26 70            L26 115            Q26 118 30 118" stroke="#D2FAFF" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>

  <path d="M102 70            L102 109" stroke="#0078D4" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- Information protection connection lines -->
  <path d="M82 73            Q62 82 43 93            Q62 103 82 112" stroke="#198AB3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Thin offset marker stroke -->
  <path d="M79 77            L47 93            L78 108" stroke="#E1FBFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>

  <!-- Upper information node -->
  <path d="M90 75            C90 80 86 84 81 84            C76 84 72 80 72 75            C72 70 76 66 81 66            C86 66 90 70 90 75 Z" fill="url(#nodeSilver)" stroke="#198AB3" stroke-width="2.5"/>

  <!-- Left information node -->
  <path d="M52 93            C52 98 48 102 43 102            C38 102 34 98 34 93            C34 88 38 84 43 84            C48 84 52 88 52 93 Z" fill="url(#nodeSilver)" stroke="#198AB3" stroke-width="2.5"/>

  <!-- Lower information node -->
  <path d="M90 112            C90 117 86 121 81 121            C76 121 72 117 72 112            C72 107 76 103 81 103            C86 103 90 107 90 112 Z" fill="url(#nodeSilver)" stroke="#198AB3" stroke-width="2.5"/>

  <!-- Hand-drawn node highlights -->
  <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".95">
    <path d="M76 74 Q77 70 81 70"/>
    <path d="M38 92 Q39 88 43 88"/>
    <path d="M76 111 Q77 107 81 107"/>
  </g>

  <!-- Tiny node depth accents -->
  <g stroke="#A4A4A4" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".65">
    <path d="M85 78 Q82 81 79 80"/>
    <path d="M47 96 Q44 99 41 98"/>
    <path d="M85 115 Q82 118 79 117"/>
  </g>

  <!-- Restrained yellow sketchnote sparkle -->
  <g stroke="#FFD70F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M111 39 L111 49"/>
    <path d="M106 44 L116 44"/>
    <path d="M12 82 L16 86"/>
    <path d="M16 82 L12 86"/>
  </g>

  <!-- Azure-blue marker emphasis -->
  <g stroke="#0078D4" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M12 49 Q15 44 20 42"/>
    <path d="M111 87 Q115 91 116 97"/>
    <path d="M10 109 Q12 114 16 117"/>
  </g>

  <!-- Loose handwritten-style sketch marks -->
  <g stroke="#FFD70F" stroke-width="2" stroke-linecap="round">
    <path d="M103 17 L107 12"/>
    <path d="M110 24 L115 21"/>
  </g>

</svg>

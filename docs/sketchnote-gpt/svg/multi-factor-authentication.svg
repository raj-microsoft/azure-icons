<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><title>Multi Factor Authentication (sketch)</title>
  
  <defs>
    <linearGradient id="tablet-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d2ebff"/>
      <stop offset="1" stop-color="#f0fffd"/>
    </linearGradient>
    <linearGradient id="phone-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ea0ef"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="phone-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fffd"/>
      <stop offset="1" stop-color="#d2ebff"/>
    </linearGradient>
  </defs>

  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- Tablet: original horizontal rectangular silhouette -->
    <path d="M2.1 0.9              Q1.1 0.8 1.1 1.8              L1.1 76.7              Q1.1 84.5 4.8 84.5              L118.2 84.5              Q120.2 84.5 120.1 80              L120.1 5.1              Q120.1 1.1 116.2 1.1              Z" fill="#0078d4" stroke="#0067b5" stroke-width="2"/>

    <rect x="7" y="6" width="105" height="72" rx="2.2" fill="url(#tablet-screen)" stroke="#8bbce0" stroke-width="1.1"/>

    <!-- Tablet camera -->
    <rect x="53" y="2.8" width="13" height="2" rx="1" fill="#f2f2f2"/>

    <!-- Phone: original upright overlapping rectangle -->
    <path d="M74.1 37              Q74 36.1 76 36.1              L126 36.1              Q127 36.1 127 38              L127 121              Q127 126 125 126              L76 126              Q74 126 74 123              Z" fill="url(#phone-body)" stroke="#0067b5" stroke-width="1.8"/>

    <!-- Phone earpiece -->
    <rect x="96" y="40" width="12.5" height="1.8" rx="0.9" fill="#f2f2f2"/>

    <!-- Phone screen -->
    <rect x="79" y="44" width="40" height="72" rx="1.2" fill="url(#phone-screen)" stroke="#b2d8ef" stroke-width="0.8"/>

    <!-- Phone home indicator -->
    <rect x="98" y="120" width="5" height="3.5" rx="1.2" fill="#f2f2f2"/>

    <!-- Green verification circle: original position over tablet -->
    <circle cx="59.4" cy="84.5" r="30.5" fill="#86d633" stroke="#70bd29" stroke-width="1.1"/>

    <!-- Original two-part white checkmark -->
    <path d="M56.3 94.7              L53.5 97.5              Q53 98 52.5 97.5              L41.3 86.3              Q40.8 85.8 41.3 85.3              L43.2 83.4              Q43.7 82.9 44.2 83.4              L56.3 94.7 Z" fill="#ffffff"/>

    <path d="M51.8 97.2              L49 94.4              L75.2 68.2              Q75.7 67.7 76.2 68.2              L78.1 70.1              Q78.6 70.6 78.1 71.1              L54.6 97.2              Q54 97.8 53.5 97.2 Z" fill="#f0f0f0"/>

  </g>
</svg>

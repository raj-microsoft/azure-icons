<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Traffic Manager Profiles (sketch)</title>

  
  <desc>Purple hexagonal traffic manager profile with white branching directional arrows and no central network node.</desc>

  <!-- Outer hexagonal profile -->
  <path d="M46 9            Q48 7 51 7            L78 7            Q81 7 83 9            L119 45            Q121 47 121 50            L121 78            Q121 81 119 83            L83 119            Q81 121 78 121            L50 121            Q47 121 45 119            L9 83            Q7 81 7 78            L7 50            Q7 47 9 45Z" fill="#9A72CE" stroke="#203746" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner hexagonal border -->
  <path d="M49 17            L79 17            L111 49            L111 79            L79 111            L49 111            L17 79            L17 49Z" stroke="#E8D6FF" stroke-width="2.5" opacity="0.85"/>

  <!-- Main branching directional arrow -->
  <g fill="#F2F2F2" stroke="#203746" stroke-width="2.2" stroke-linejoin="round">

    <!-- Upper-left incoming direction -->
    <path d="M36 38 L57 59 L57 35              L49 35 L57 25 L65 35              L57 35"/>

    <!-- Right-pointing branch -->
    <path d="M57 59 L82 59              L82 51 L96 59 L82 67              L82 59"/>

    <!-- Downward branch -->
    <path d="M57 59 L57 88              L49 88 L57 102 L65 88              L57 88"/>

    <!-- Lower-right diagonal branch -->
    <path d="M57 59 L91 91              L84 84 L99 99 L83 99              L91 91"/>

  </g>

  <!-- White directional branch strokes -->
  <g stroke="#F2F2F2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 38 L57 59"/>
    <path d="M57 59 L57 35"/>
    <path d="M57 59 L82 59"/>
    <path d="M57 59 L57 88"/>
    <path d="M57 59 L91 91"/>
  </g>

  <!-- Direction arrowheads -->
  <g fill="#F2F2F2" stroke="#203746" stroke-width="2">
    <path d="M49 35 L57 25 L65 35Z"/>
    <path d="M82 51 L96 59 L82 67Z"/>
    <path d="M49 88 L65 88 L57 102Z"/>
    <path d="M83 99 L99 99 L91 91Z"/>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Internet Analyzer Profiles (sketch)</title>
  
  <desc>Hand-drawn Azure-blue cloud with white network nodes and a cyan laboratory flask containing a green network analysis signal.</desc>

  <defs>
    <linearGradient id="cloudBlue" x1="55" y1="8" x2="55" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".55" stop-color="#348EE3"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="flaskCyan" x1="93" y1="57" x2="93" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7AF1FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Organic hand-drawn Azure cloud silhouette -->
  <path d="M37 89            C19 91 7 80 8 64            C8 49 18 38 31 36            C36 17 50 8 66 9            C84 9 97 22 99 40            C114 42 123 52 122 65            C121 81 110 90 96 90            Z" fill="url(#cloudBlue)" stroke="#005A9E" stroke-width="3.5"/>

  <!-- Sketchy secondary marker strokes -->
  <path d="M14 60 Q17 45 32 42" stroke="#A6D9FF" stroke-width="2.6"/>
  <path d="M42 31 Q49 15 66 15" stroke="#A6D9FF" stroke-width="2.6"/>
  <path d="M103 47 Q115 52 116 64" stroke="#005A9E" stroke-width="2" opacity=".5"/>

  <!-- White cloud network nodes -->
  <path d="M73 27 L63 45 L88 54" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3 4" opacity=".75"/>

  <path d="M63 45 L73 27" stroke="#E7F6FF" stroke-width="2.5"/>

  <circle cx="63" cy="45" r="8.5" fill="#FFFFFF" stroke="#005A9E" stroke-width="2.2"/>
  <circle cx="88" cy="54" r="7" fill="#FFFFFF" stroke="#005A9E" stroke-width="2.2"/>
  <circle cx="73" cy="27" r="5.5" fill="#FFFFFF" stroke="#005A9E" stroke-width="2"/>

  <!-- Small sketchnote-style cloud highlights -->
  <path d="M25 69 Q28 75 35 77" stroke="#CDEEFF" stroke-width="2.5"/>
  <path d="M44 79 L49 82 M52 79 L57 82" stroke="#FFFFFF" stroke-width="2" opacity=".6"/>

  <!-- Analyzer flask neck and lip -->
  <path d="M82 58            Q80 58 80 61            L80 63            Q80 65 83 65            L84 65            L84 85            L63 116            Q61 121 66 122            L120 122            Q125 120 122 115            L102 85            L102 65            L104 65            Q107 65 107 62            L107 60            Q107 58 104 58            Z" fill="url(#flaskCyan)" stroke="#0078D4" stroke-width="3.4"/>

  <!-- Flask rim detail -->
  <path d="M81 65 Q94 67 106 65" stroke="#005A9E" stroke-width="2.1"/>

  <!-- White inner laboratory liquid area -->
  <path d="M89 77            Q89 75 92 75            L96 75            Q98 75 98 78            L98 87            Q98 89 100 92            L115 114            Q117 117 113 117            L72 117            Q69 117 72 113            L87 91            Q89 88 89 85            Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.7"/>

  <!-- Light blue flask rim reflection -->
  <path d="M86 70 L86 85" stroke="#FFFFFF" stroke-width="2.4" opacity=".8"/>

  <!-- Hand-drawn green analyzer waveform -->
  <path d="M76 109            L83 109            L87 101            L91 113            L96 95            L101 107            L105 101            L109 104" stroke="#86D633" stroke-width="3.3"/>

  <!-- Supporting green analysis baseline -->
  <path d="M72 112            Q81 111 86 112            M106 112 L114 112" stroke="#86D633" stroke-width="1.8" opacity=".7"/>

  <!-- Sketchnote yellow emphasis strokes -->
  <path d="M110 80 L118 76" stroke="#FFCA00" stroke-width="3"/>
  <path d="M112 87 L121 86" stroke="#FFCA00" stroke-width="2.6"/>
  <path d="M108 73 L112 66" stroke="#FFCA00" stroke-width="2.6"/>

  <!-- Small hand-drawn analysis spark -->
  <path d="M46 102 L46 110            M42 106 L50 106" stroke="#FFCA00" stroke-width="2.5"/>
  <path d="M34 94 L38 98" stroke="#0078D4" stroke-width="2.2"/>
</svg>

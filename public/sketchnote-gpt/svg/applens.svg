<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Applens (sketch)</title>
  
  <desc>Sketch-style Azure Applens icon featuring concentric diagnostic rings, an indicator needle, and orange observation nodes.</desc>

  <!-- Outer diagnostic ring -->
  <path d="M65 10            C88 9 108 22 117 43            C127 66 119 91 103 107            C86 124 60 127 39 116            C17 105 7 84 10 61" stroke="#0078D4" stroke-width="11"/>
  <path d="M65 13            C89 11 108 26 116 47            M119 72 C116 96 97 116 75 119            M46 116 C26 109 13 91 12 72" stroke="#5EA0EF" stroke-width="2.5" opacity=".75"/>

  <!-- Open upper-left ring segment -->
  <path d="M18 43            C25 26 40 15 57 12" stroke="#0078D4" stroke-width="10"/>
  <path d="M18 44 C25 28 40 17 56 14" stroke="#5EA0EF" stroke-width="2.5"/>

  <!-- Inner diagnostic circular track -->
  <path d="M43 40            C55 30 74 28 89 36            C97 40 103 46 107 54" stroke="#32BEDD" stroke-width="9"/>
  <path d="M107 72            C106 92 90 106 70 108" stroke="#32BEDD" stroke-width="9"/>
  <path d="M48 104            C32 96 24 79 29 61" stroke="#32BEDD" stroke-width="9"/>

  <!-- Sketch highlight strokes -->
  <path d="M47 38 C65 27 88 32 101 47" stroke="#50E6FF" stroke-width="2.5"/>
  <path d="M103 78 C99 94 87 102 74 105" stroke="#50E6FF" stroke-width="2.5"/>
  <path d="M45 101 C31 92 27 77 32 64" stroke="#50E6FF" stroke-width="2.5"/>

  <!-- Orange observation node: upper right -->
  <circle cx="100" cy="55" r="11" fill="#F78D1E" stroke="#B85A13" stroke-width="2.5"/>
  <path d="M96 51 Q99 48 103 51" stroke="#FFE2A6" stroke-width="2.5"/>

  <!-- Orange observation node: lower left -->
  <circle cx="56" cy="103" r="11" fill="#F78D1E" stroke="#B85A13" stroke-width="2.5"/>
  <path d="M52 99 Q55 96 59 99" stroke="#FFE2A6" stroke-width="2.5"/>

  <!-- Diagnostic indicator needle -->
  <path d="M26 24            Q24 22 22 25            L19 28            Q18 30 20 33            L55 75            Q60 81 66 78            Q71 75 69 69            Q68 66 64 63            L29 26 Z" fill="#5EA0EF" stroke="#0067B8" stroke-width="3"/>

  <!-- Needle hand-drawn highlight -->
  <path d="M26 30 L57 68" stroke="#C8E8FF" stroke-width="2.5"/>

  <!-- Central pivot -->
  <circle cx="64" cy="72" r="12" fill="#0078D4" stroke="#005A9E" stroke-width="3"/>
  <circle cx="64" cy="72" r="5" fill="#50E6FF"/>
  <path d="M59 68 Q63 64 67 68" stroke="#DDF8FF" stroke-width="2"/>

  <!-- Subtle sketchnote motion marks -->
  <path d="M12 51 L6 48            M15 56 L8 55            M53 7 L51 2" stroke="#0078D4" stroke-width="2.5"/>
  <path d="M110 34 L116 29            M114 39 L122 36" stroke="#F7BE42" stroke-width="2.5"/>

  <!-- Small marker-style accent dashes -->
  <path d="M84 20 L88 22            M112 89 L110 94            M24 92 L27 97" stroke="#50E6FF" stroke-width="2.5"/>
</svg>

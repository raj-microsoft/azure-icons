      <stop offset="0" stop-color="#83B9F9"/>
      <stop offset="1" stop-color="#5EA0EF"/>
    </linearGradient>
    <linearGradient id="deepAzure" x1="28" y1="25" x2="42" y2="103" gradientUnits="userSpaceOnUse">

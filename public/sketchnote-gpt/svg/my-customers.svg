<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none"><title>My Customers (sketch)</title>
  <defs>
    <linearGradient id="customerMain" x1="43" y1="15" x2="43" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset=".22" stop-color="#32d4f5"/>
      <stop offset="1" stop-color="#198ab3"/>
    </linearGradient>
    <linearGradient id="customerSide" x1="99" y1="48" x2="99" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#005ba1"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Main customer silhouette -->
    <circle cx="47" cy="37" r="22" fill="url(#customerMain)" stroke="#198ab3" stroke-width="3"/>
    <path d="M32 31c3-13 15-18 26-12" stroke="#b8f5ff" stroke-width="2.5" opacity=".85"/>
    <path d="M29 39c1 9 8 16 17 18" stroke="#0078d4" stroke-width="1.7" opacity=".55"/>

    <!-- Main person neck / shoulder highlights -->
    <path d="M37 56c3 3 7 4 10 4s8-1 11-4" stroke="#e9ffff" stroke-width="2" opacity=".8"/>
    <path d="m38 51 9 24 9-24" fill="#ffffff" opacity=".15"/>

    <!-- Main customer body -->
    <path d="M12 108c3-22 14-36 35-36 22 0 33 14 36 36 .7 5-2 8-7 8H19c-5 0-8-3-7-8Z" fill="url(#customerMain)" stroke="#198ab3" stroke-width="3"/>
    <path d="M17 105c4-17 14-27 30-28" stroke="#a8f4ff" stroke-width="2" opacity=".8"/>
    <path d="M78 105c-2-12-7-20-15-25" stroke="#0078d4" stroke-width="2" opacity=".6"/>

    <!-- Secondary customer -->
    <circle cx="99" cy="48" r="15" fill="url(#customerSide)" stroke="#005ba1" stroke-width="2.7"/>
    <path d="M89 43c2-7 8-11 14-10" stroke="#7cecff" stroke-width="2" opacity=".8"/>
    <path d="M91 58c2 3 5 4 8 5" stroke="#ffffff" stroke-width="1.5" opacity=".5"/>

    <!-- Secondary person body -->
    <path d="M77 105c2-17 9-27 22-27s22 10 25 27c.5 3-1.5 5-4.5 5H82c-3 0-5-2-5-5Z" fill="url(#customerSide)" stroke="#005ba1" stroke-width="2.7"/>
    <path d="M83 101c3-11 8-17 16-19" stroke="#50c9f3" stroke-width="1.8" opacity=".8"/>

    <!-- White collar / identity highlights -->
    <path d="m37 73 10 10 10-10" stroke="#ffffff" stroke-width="2.5" opacity=".9"/>
    <path d="m90 79 9 8 8-8" stroke="#ffffff" stroke-width="2" opacity=".8"/>

    <!-- Customer connection line -->
    <path d="M67 66c6-4 13-5 20-3" stroke="#0078d4" stroke-width="2.3" stroke-dasharray="3 4"/>
    <circle cx="75" cy="64" r="2.5" fill="#32d4f5"/>

    <!-- Yellow sketchnote accents -->
    <path d="m20 22 2.2 5.5 5.5 2.2-5.5 2.2-2.2 5.5-2.2-5.5-5.5-2.2 5.5-2.2Z" fill="#ffd84d" stroke="#d49b20" stroke-width="1.3"/>
    <path d="m115 24 1.7 4.3 4.3 1.7-4.3 1.7-1.7 4.3-1.7-4.3-4.3-1.7 4.3-1.7Z" fill="#ffca3a" stroke="#d49b20" stroke-width="1.2"/>

    <!-- Hand-drawn emphasis strokes -->
    <path d="M7 76h7M6 83h5" stroke="#32d4f5" stroke-width="2.2"/>
    <path d="M112 72h7M115 78h5" stroke="#0078d4" stroke-width="2"/>
    <path d="M33 119c9 2 19 2 28 0" stroke="#50bde2" stroke-width="1.8"/>
    <path d="M89 116c7 1 14 0 20-2" stroke="#005ba1" stroke-width="1.8"/>
  </g>
</svg>

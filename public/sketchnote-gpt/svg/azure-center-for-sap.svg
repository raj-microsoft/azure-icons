<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Center for SAP (sketch)</title>

  
  <desc>
    Three hand-drawn Azure cyan isometric cubes enclosed by
    sweeping circular arrows. Original Azure blue and cyan
    palette with restrained yellow sketch accents.
    Transparent background and editable vector paths.
  </desc>

  <!-- Circular Azure orchestration arrows -->
  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Upper right arc -->
    <path d="M68 10              C91 12 110 26 117 47              C123 64 119 80 109 93" stroke="#005BA1" stroke-width="6.2"/>

    <path d="M72 14              C94 17 111 35 115 54" stroke="#1876B8" stroke-width="1.8" opacity=".65"/>

    <!-- Directional sketch flourish -->
    <path d="M68 10 L77 5 L74 17" fill="#005BA1" stroke="#005BA1" stroke-width="2.5"/>

    <!-- Lower circular arc -->
    <path d="M103 101              C86 117 61 122 40 113              C29 109 20 101 15 92" stroke="#00FFFF" stroke-width="6.4"/>

    <path d="M96 105              C76 119 51 118 34 108" stroke="#32BEDD" stroke-width="2.2" opacity=".8"/>

    <!-- Left circle arc -->
    <path d="M13 86              C5 69 8 47 21 30              C32 15 47 10 59 10" stroke="#32BEDD" stroke-width="6.2"/>

    <path d="M14 64              C16 40 32 22 51 16" stroke="#9CEBFF" stroke-width="2" opacity=".85"/>

    <!-- Arrowhead at left lower arc -->
    <path d="M8 83 L17 90 L24 83" stroke="#167FAE" stroke-width="3.2"/>

    <!-- Small arrowhead at lower-right -->
    <path d="M101 91 L109 96 L117 88" stroke="#005BA1" stroke-width="3.2"/>

  </g>

  <!-- Center cube: Azure service component -->
  <g stroke="#17658E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- Top -->
    <path d="M47 35              L64 25              L81 35              L64 45              Z" fill="#9CEBFF"/>

    <!-- Left -->
    <path d="M47 35              L64 45              L64 65              L47 55              Z" fill="#50E6FF"/>

    <!-- Right -->
    <path d="M64 45              L81 35              L81 55              L64 65              Z" fill="#32BEDD"/>

    <!-- Hand-drawn facet highlights -->
    <path d="M52 35 L64 28 L75 35" stroke="#FFFFFF" stroke-width="1.8" opacity=".75"/>

    <path d="M51 41 L51 51" stroke="#D7FAFF" stroke-width="2"/>

    <path d="M76 40 L76 51" stroke="#087EA9" stroke-width="1.5" opacity=".65"/>

  </g>

  <!-- Lower-left SAP component cube -->
  <g stroke="#17658E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">

    <path d="M25 72              L42 62              L59 72              L42 82              Z" fill="#9CEBFF"/>

    <path d="M25 72              L42 82              L42 102              L25 92              Z" fill="#50E6FF"/>

    <path d="M42 82              L59 72              L59 92              L42 102              Z" fill="#32BEDD"/>

    <path d="M30 72 L42 65 L54 72" stroke="#FFFFFF" stroke-width="1.8" opacity=".75"/>

    <path d="M29 79 L29 89" stroke="#D7FAFF" stroke-width="2"/>

    <path d="M54 78 L54 88" stroke="#087EA9" stroke-width="1.5" opacity=".65"/>

  </g>

  <!-- Lower-right SAP component cube -->
  <g stroke="#17658E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">

    <path d="M69 72              L86 62              L103 72              L86 82              Z" fill="#9CEBFF"/>

    <path d="M69 72              L86 82              L86 102              L69 92              Z" fill="#50E6FF"/>

    <path d="M86 82              L103 72              L103 92              L86 102              Z" fill="#32BEDD"/>

    <path d="M74 72 L86 65 L98 72" stroke="#FFFFFF" stroke-width="1.8" opacity=".75"/>

    <path d="M73 79 L73 89" stroke="#D7FAFF" stroke-width="2"/>

    <path d="M98 78 L98 88" stroke="#087EA9" stroke-width="1.5" opacity=".65"/>

  </g>

  <!-- Subtle yellow sketchnote accents -->
  <g stroke="#F4C542" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- Spark above center cube -->
    <path d="M91 23 L91 29"/>
    <path d="M88 26 L94 26"/>

    <!-- Small hand-drawn emphasis marks -->
    <path d="M17 58 L21 55"/>
    <path d="M16 63 L21 62"/>

    <path d="M108 65 L112 62"/>
    <path d="M110 70 L115 69"/>

    <!-- Connection emphasis -->
    <path d="M62 78 L65 75 L68 78"/>

  </g>

  <!-- Lightweight handwritten-style motion details -->
  <g stroke="#005BA1" stroke-width="1.7" stroke-linecap="round" opacity=".65">

    <path d="M35 17 Q40 14 44 14"/>
    <path d="M96 35 Q99 39 101 43"/>
    <path d="M53 111 Q59 113 65 113"/>

  </g>

</svg>

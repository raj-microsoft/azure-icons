<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Active Directory Connect Health (sketch)</title>
  
  <desc>Hand-drawn Azure Active Directory diamond with a red health heart and white heartbeat line.</desc>

  <defs>
    <linearGradient id="azure" x1="14" y1="18" x2="110" y2="113" gradientUnits="userSpaceOnUse">
      <stop stop-color="#44DBF9"/>
      <stop offset=".48" stop-color="#0294E4"/>
      <stop offset="1" stop-color="#225086"/>
    </linearGradient>
    <linearGradient id="heart" x1="68" y1="65" x2="113" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F04049"/>
      <stop offset="1" stop-color="#E62323"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn Azure diamond -->
  <path d="M61 9            Q64 7 68 11            L119 69            Q123 74 117 79            L68 112            Q64 115 60 112            L10 80            Q4 76 9 69            L59 12 Z" fill="url(#azure)" stroke="#174B82" stroke-width="3.6"/>

  <!-- Slightly irregular marker contour -->
  <path d="M15 69 L61 15            M72 15 L114 65            M112 84 L70 109" stroke="#CBF8FF" stroke-width="2" opacity=".65"/>

  <!-- Inner directory diamond -->
  <path d="M64 36            L96 72            L64 93            L32 73 Z" fill="#CBF8FF" stroke="#225086" stroke-width="3.2"/>

  <!-- Folded Azure ribbon -->
  <path d="M64 36            Q48 56 32 73            L64 93            L47 103            Q40 107 32 102            L11 88" fill="#44DBF9" fill-opacity=".7" stroke="#0379B9" stroke-width="2.8"/>

  <!-- Central fold lines -->
  <path d="M33 73 L64 93 L95 72" stroke="#0055C5" stroke-width="2.5"/>

  <path d="M64 38 L64 91" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 6" opacity=".55"/>

  <!-- Marker-like accent strokes -->
  <path d="M24 66 L43 45            M43 39 L49 32" stroke="#FFFFFF" stroke-width="2.6" opacity=".75"/>

  <path d="M19 89 L32 97" stroke="#0055C5" stroke-width="2.3"/>

  <!-- Health heart with organic sketched outline -->
  <path d="M95 119            C89 114 66 98 65 83            C64 73 69 65 79 64            C87 63 93 68 96 75            C100 66 107 62 115 65            C126 69 126 81 122 90            C118 101 105 111 95 119 Z" fill="url(#heart)" stroke="#A91832" stroke-width="3.6"/>

  <!-- Subtle hand-drawn heart highlight -->
  <path d="M72 78            Q74 69 82 70            M107 70            Q114 67 119 77" stroke="#FF9DA3" stroke-width="2.5" opacity=".85"/>

  <!-- White ECG heartbeat -->
  <path d="M68 90            L77 90            L83 82            L90 101            L97 75            L104 93            L111 85            L122 85" stroke="#FFFFFF" stroke-width="4.2"/>

  <!-- Fine secondary marker stroke -->
  <path d="M79 91 L83 86            M98 80 L103 94" stroke="#FFE4E4" stroke-width="1.3" opacity=".75"/>

  <!-- Small yellow sketchnote accents -->
  <path d="M112 38 L117 30            M120 45 L125 42            M105 31 L105 24" stroke="#F7C948" stroke-width="3.2"/>

  <path d="M21 111 L16 116            M28 115 L27 122" stroke="#F7C948" stroke-width="2.8"/>

  <!-- Tiny hand-drawn sparkle -->
  <path d="M44 17 L44 24            M40 20.5 L48 20.5" stroke="#F7C948" stroke-width="2.4"/>
</svg>

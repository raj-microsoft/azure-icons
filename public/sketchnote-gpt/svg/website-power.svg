<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Website Power (sketch)</title>
  
  <desc>Hand-drawn Azure sketchnote icon with two large crossed orbital ellipses, a central blue globe, three white circular nodes, and pale intersecting arcs inside the globe.</desc>

  <!-- rear gray orbital sweep -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 20              C28 8 49 14 70 30              C92 46 110 69 116 88              C121 102 118 113 109 115              C94 117 68 101 45 79              C23 58 10 33 18 20Z" fill="none" stroke="#3F4750" stroke-width="6.2"/>
    <path d="M18 20              C28 8 49 14 70 30              C92 46 110 69 116 88              C121 102 118 113 109 115              C94 117 68 101 45 79              C23 58 10 33 18 20Z" fill="none" stroke="#B3B3B3" stroke-width="3.7"/>

    <!-- front blue orbital ellipse -->
    <path d="M18 108              C8 96 16 71 35 48              C57 22 86 8 106 9              C116 9 122 15 123 25              C124 45 107 72 84 93              C58 116 28 121 18 108Z" fill="none" stroke="#173E62" stroke-width="6.2"/>
    <path d="M18 108              C8 96 16 71 35 48              C57 22 86 8 106 9              C116 9 122 15 123 25              C124 45 107 72 84 93              C58 116 28 121 18 108Z" fill="none" stroke="#5EA0EF" stroke-width="3.9"/>

    <!-- small gray orbital tab on left/front -->
    <path d="M19 59 L25 69 L18.5 75.2 L10.7 63.2 Z" fill="#B3B3B3" stroke="#4A5057" stroke-width="2.2"/>
  </g>

  <!-- central globe -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M84.5 45.3              C95.2 55.6 95.7 72.7 85.4 84.5              C73.9 97.1 56.1 97.2 44.5 87.7              C32.3 77.5 31.4 59.3 41.9 47              C53 34 72 33.3 84.5 45.3Z" fill="#0078D4" stroke="#183F62" stroke-width="3.4"/>
    <path d="M46 45.5              C57.1 36.9 72.8 37.6 82.2 47.1              C91.4 56.8 91.2 69.6 83.5 79.5              C73.8 90.3 58.1 91.2 47.6 83.5              C37 74.9 36.4 56.6 46 45.5Z" fill="#1689DE"/>
  </g>

  <!-- pale intersecting globe/network arcs INSIDE the globe -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M49.8 51.7              C58.5 45.3 71.2 44.1 82.2 49.4" stroke="#EAF6FF" stroke-width="4.1"/>
    <path d="M45.8 69              C51.6 58.2 63.1 52.2 75.6 53.4              C80.8 53.8 85.6 55.3 89.2 58" stroke="#D7EDFC" stroke-width="3.6"/>
    <path d="M56.2 82              C64.7 74.4 77.1 71.9 88.6 75.2" stroke="#EAF6FF" stroke-width="4"/>
    <path d="M56.3 42.8              C59 53.4 65.7 62.5 75.6 69.2              C79.3 71.7 83.1 73.7 87.1 75.1" stroke="#F2F2F2" stroke-width="3.2"/>
    <path d="M43.9 57.8              C47.4 61.1 51.4 63.7 55.7 65.8              C64.5 70.3 74 73.8 84.6 77" stroke="#DDEFFC" stroke-width="3.1"/>
    <path d="M74.3 42.2              C75.7 49.8 80.1 56.4 86.8 61.2" stroke="#DDEFFC" stroke-width="2.8"/>
  </g>

  <!-- three white circular nodes -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="52.4" cy="63.1" r="12.3" fill="#FFFFFF" stroke="#234C72" stroke-width="2.4"/>
    <circle cx="78.2" cy="77.9" r="8.2" fill="#FFFFFF" stroke="#234C72" stroke-width="2.1"/>
    <circle cx="90.1" cy="58.5" r="8.7" fill="#FFFFFF" stroke="#234C72" stroke-width="2.1"/>
  </g>

  <!-- restrained sketchnote accents -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M106.4 8.8 L112.2 4.1" stroke="#E6B93F" stroke-width="2.8"/>
    <path d="M114.7 17.6 L122.3 16" stroke="#E6B93F" stroke-width="2.8"/>
    <path d="M12.3 35.5 L8.1 31.8" stroke="#E6B93F" stroke-width="2.5"/>
    <path d="M78 112 L81 118" stroke="#E6B93F" stroke-width="2.5"/>

    <path d="M14 91 L18 94" stroke="#0078D4" stroke-width="1.8"/>
    <path d="M39 108 Q48 113 57 111" stroke="#0078D4" stroke-width="1.8"/>
    <path d="M103 100 L107 96" stroke="#0078D4" stroke-width="1.8"/>
    <path d="M88 10 L94 11.8" stroke="#0078D4" stroke-width="1.8"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Website Power (sketch)</title>
  
  <desc>Hand-drawn Azure sketchnote illustration of a powered website, represented by a blue central globe with interconnected metallic network nodes and orbital paths.</desc>

  <defs>
    <radialGradient id="globe" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FCFCFC"/>
      <stop offset=".55" stop-color="#D7D7D7"/>
      <stop offset="1" stop-color="#B3B3B3"/>
    </linearGradient>
  </defs>

  <!-- Main orbital website silhouette -->
  <path d="M92 87     C72 110 39 115 22 98     C3 79 16 44 42 22     C66 2 98 7 112 24     C127 43 111 76 92 87 Z" fill="none" stroke="#5EA0EF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Secondary orbital path -->
  <path d="M15 76 C25 48 52 23 79 17" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round"/>

  <!-- Network connection paths -->
  <g fill="none" stroke="#B3B3B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 50 Q48 24 79 23"/>
    <path d="M28 50 L56 78"/>
    <path d="M56 78 L91 91"/>
    <path d="M79 23 L96 53"/>
    <path d="M96 53 L91 91"/>
    <path d="M28 50 Q54 67 96 53"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round">
    <path d="M31 49 Q53 29 76 26"/>
    <path d="M32 53 L55 75"/>
    <path d="M80 27 L93 51"/>
  </g>

  <!-- Central website power globe -->
  <path d="M73 78     C64 84 51 78 46 68     C40 57 46 43 57 37     C68 30 82 35 87 46     C93 58 84 71 73 78 Z" fill="url(#globe)" stroke="#005BA1" stroke-width="3.5"/>

  <!-- Globe highlight -->
  <path d="M53 47 Q64 36 78 40" fill="none" stroke="#BDEAFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Website network symbol inside globe -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 53 L69 45 L79 58 L64 68 Z"/>
    <path d="M55 53 L64 68 L79 58"/>
    <path d="M69 45 L64 68"/>
  </g>

  <g fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5">
    <circle cx="55" cy="53" r="3.5"/>
    <circle cx="69" cy="45" r="3.5"/>
    <circle cx="79" cy="58" r="3.5"/>
    <circle cx="64" cy="68" r="3.5"/>
  </g>

  <!-- Upper-left metallic network node -->
  <circle cx="28" cy="50" r="15" fill="url(#silver)" stroke="#888888" stroke-width="2.5"/>
  <circle cx="28" cy="50" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="28" cy="50" r="4" fill="#5EA0EF"/>

  <!-- Upper-right metallic network node -->
  <circle cx="80" cy="23" r="12" fill="url(#silver)" stroke="#888888" stroke-width="2.5"/>
  <circle cx="80" cy="23" r="6" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="80" cy="23" r="3" fill="#5EA0EF"/>

  <!-- Right metallic network node -->
  <circle cx="97" cy="53" r="13" fill="url(#silver)" stroke="#888888" stroke-width="2.5"/>
  <circle cx="97" cy="53" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="97" cy="53" r="3.5" fill="#5EA0EF"/>

  <!-- Lower metallic network node -->
  <circle cx="91" cy="91" r="11" fill="url(#silver)" stroke="#888888" stroke-width="2.2"/>
  <circle cx="91" cy="91" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
  <circle cx="91" cy="91" r="2.8" fill="#5EA0EF"/>

  <!-- Small orbital node -->
  <circle cx="19" cy="83" r="5" fill="#5EA0EF" stroke="#0078D4" stroke-width="1.5"/>

  <!-- Website power signal -->
  <path d="M104 12 L111 6 M111 19 L119 17" fill="none" stroke="#E6B93F" stroke-width="3" stroke-linecap="round"/>

  <!-- Sketchnote accents -->
  <g fill="none" stroke="#E6B93F" stroke-width="2.5" stroke-linecap="round">
    <path d="M12 34 L7 30"/>
    <path d="M37 13 L40 8"/>
    <path d="M107 75 L113 78"/>
    <path d="M74 109 L77 115"/>
  </g>

  <!-- Hand-drawn marker strokes -->
  <g fill="none" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round">
    <path d="M11 91 L15 94"/>
    <path d="M39 108 Q48 113 57 111"/>
    <path d="M103 99 L107 95"/>
    <path d="M87 9 L93 11"/>
  </g>
</svg>

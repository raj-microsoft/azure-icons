<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure API for FHIR (sketch)</title>
  
  <desc>Warm orange healthcare heart with a yellow hand-drawn interoperability path, connected endpoints and subtle Azure-blue accents.</desc>

  <defs>
    <linearGradient id="fhirHeart" x1="64" y1="10" x2="64" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAA21D"/>
      <stop offset=".56" stop-color="#F69113"/>
      <stop offset="1" stop-color="#EF7100"/>
    </linearGradient>
  </defs>

  <!-- Organic heart silhouette -->
  <path d="M64 30            C57 14 42 8 28 11            C11 14 6 29 8 48            C10 70 27 91 64 119            C101 92 119 70 120 48            C122 29 116 14 99 11            C84 8 70 15 64 30Z" fill="url(#fhirHeart)" stroke="#C65A05" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Loose hand-drawn inner contours -->
  <path d="M17 46            C14 29 21 19 32 18            C46 17 56 26 63 39" stroke="#FFC568" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <path d="M111 43            C113 59 99 82 72 105" stroke="#FFD088" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="14 5 4 5" opacity=".8"/>

  <!-- Interoperability path: left-side winding connection -->
  <path d="M28 18            C18 24 17 37 26 45            C34 52 46 62 59 75" stroke="#D87909" stroke-width="9" stroke-linecap="round" fill="none" opacity=".35"/>

  <path d="M28 18            C18 24 17 37 26 45            C34 52 46 62 59 75" stroke="#FFE452" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Main intertwined API route -->
  <path d="M73 63            C57 46 39 31 29 43            C17 58 43 84 52 92" stroke="#D87909" stroke-width="9" stroke-linecap="round" fill="none" opacity=".32"/>

  <path d="M73 63            C57 46 39 31 29 43            C17 58 43 84 52 92" stroke="#FFE452" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Small freehand integration connector -->
  <path d="M69 59 L76 65 L70 72            M48 87 L54 93 L49 99" stroke="#FFF0A0" stroke-width="4.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right-side sweeping data route -->
  <path d="M115 31            C122 57 106 77 77 89" stroke="#D87909" stroke-width="10" stroke-linecap="round" fill="none" opacity=".3"/>

  <path d="M115 31            C122 57 106 77 77 89" stroke="#FFE452" stroke-width="6.5" stroke-linecap="round" fill="none"/>

  <!-- Endpoint at lower-right -->
  <path d="M82 94            C82 100 77 104 71 104            C65 104 61 100 61 94            C61 88 66 83 72 84            C78 84 82 88 82 94Z" fill="#FFE452" stroke="#C76C09" stroke-width="2.8"/>

  <path d="M68 90 Q72 87 76 91" stroke="#FFF8C8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Tiny hand-drawn data spark -->
  <path d="M88 37 L95 32            M91 44 L100 42" stroke="#FFE452" stroke-width="2.7" stroke-linecap="round"/>

  <!-- Restrained Azure-blue sketchnote accents -->
  <path d="M33 103 L29 109            M39 107 L37 114" stroke="#5EA0EF" stroke-width="2.6" stroke-linecap="round"/>

  <path d="M86 19 L90 15            M94 21 L99 18" stroke="#5EA0EF" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Subtle yellow marker emphasis -->
  <path d="M55 113 L64 119 L72 113" stroke="#FFE452" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
</svg>

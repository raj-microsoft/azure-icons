<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Power Platform (sketch)</title>
  <defs>
    <linearGradient id="ppGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD9A2"/>
      <stop offset=".45" stop-color="#3FBDA9"/>
      <stop offset="1" stop-color="#159455"/>
    </linearGradient>
    <linearGradient id="ppTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23A794"/>
      <stop offset=".55" stop-color="#007A84"/>
      <stop offset="1" stop-color="#005158"/>
    </linearGradient>
    <linearGradient id="ppFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FD9A2"/>
      <stop offset=".5" stop-color="#47BF79"/>
      <stop offset="1" stop-color="#007A84"/>
    </linearGradient>
    <linearGradient id="ppSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8E47C"/>
      <stop offset="1" stop-color="#58BE5A"/>
    </linearGradient>
  </defs>

  <!-- Power Platform signature: flowing interlocking ribbons -->
  <g stroke-linejoin="round" stroke-linecap="round">

    <!-- Upper teal ribbon -->
    <path d="M48 13       Q51 8 57 8       L101 8       Q117 8 121 20       Q124 28 119 37       L105 66       Q101 74 92 74       L49 74       Q44 74 46 68       L61 37       L33 37       Q27 37 30 30       L39 15       Q42 10 48 13 Z" fill="url(#ppTeal)" stroke="#005B62" stroke-width="3.5"/>

    <!-- Inner teal highlight -->
    <path d="M49 18 L99 18 Q111 18 114 26" fill="none" stroke="#73D6BD" stroke-width="3"/>

    <!-- Main green horizontal ribbon -->
    <path d="M28 47       Q31 42 38 42       L107 42       Q120 42 121 54       Q122 59 119 65       L105 94       Q101 102 92 102       L22 102       Q9 102 9 90       Q9 85 12 80       L23 57       Q25 51 28 47 Z" fill="url(#ppFront)" stroke="#087C68" stroke-width="3.5"/>

    <!-- Front ribbon surface -->
    <path d="M26 55 Q29 49 36 49 L103 49       Q113 49 115 57       L100 88 Q98 94 91 94       L23 94 Q17 94 17 88       Z" fill="none" stroke="#B3EBC3" stroke-width="2"/>

    <!-- Lower tapered green segment -->
    <path d="M19 83       Q22 77 29 77       L70 77       L49 117       Q45 124 39 120       L14 108       Q7 105 11 97 Z" fill="url(#ppGreen)" stroke="#16895F" stroke-width="3.5"/>

    <!-- Lower green highlight -->
    <path d="M18 99 L37 109 L52 82" fill="none" stroke="#B5ECA5" stroke-width="2.5"/>

    <!-- Interlocking overlap details -->
    <path d="M46 42 L60 42 L43 77" fill="none" stroke="#005D63" stroke-width="2.5" opacity=".65"/>
    <path d="M68 49 L54 77" fill="none" stroke="#D0F3C0" stroke-width="2" opacity=".85"/>
  </g>

  <!-- Yellow sketchnote energy accents -->
  <g fill="none" stroke="#F2C94C" stroke-width="3.2" stroke-linecap="round">
    <path d="M17 31 L10 27"/>
    <path d="M25 20 L21 13"/>
    <path d="M108 12 L113 7"/>
    <path d="M121 76 L127 73"/>
    <path d="M77 113 L82 119"/>
  </g>

  <!-- Hand-drawn marker finishing strokes -->
  <g fill="none" stroke-linecap="round">
    <path d="M43 12 Q48 8 53 11" stroke="#A8E47C" stroke-width="2"/>
    <path d="M100 43 Q107 40 113 44" stroke="#73D6BD" stroke-width="2"/>
    <path d="M11 88 Q8 94 13 99" stroke="#A8E47C" stroke-width="2"/>
    <path d="M41 119 Q47 122 51 116" stroke="#47BF79" stroke-width="2"/>
    <path d="M91 100 Q97 99 101 95" stroke="#005B62" stroke-width="2"/>
  </g>
</svg>

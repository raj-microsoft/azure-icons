<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Bonsai (sketch)</title>

  
  <desc>
    Stylized Azure Bonsai tree with a twisting dark plum trunk,
    angular green foliage, delicate branch details and a shallow
    ceramic bonsai pot. Hand-drawn marker outlines with subtle
    Azure-blue and yellow accents. Transparent background.
  </desc>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>API Management Services (sketch)</title>

  
  <desc>Hand-drawn Azure API Management icon featuring a cyan cloud outline, a purple API endpoint, and a curved connection path. Transparent background with subtle yellow sketchnote accents.</desc>

  <defs>
    <linearGradient id="apimCloud" x1="64" y1="12" x2="64" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".45" stop-color="#2DC6E9"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>

    <linearGradient id="apimNode" x1="60" y1="80" x2="60" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C69AEB"/>
      <stop offset="1" stop-color="#6F4BB2"/>
    </linearGradient>
  </defs>

  <!-- Main cloud silhouette -->
  <path d="M39 96            C21 99 8 87 8 70            C8 54 19 42 34 40            C40 23 54 14 71 14            C92 14 107 29 108 47            C121 49 125 59 125 71            C125 86 114 96 99 96            L91 96            M49 96            L57 96" stroke="url(#apimCloud)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Slightly irregular marker overlay -->
  <path d="M14 65            Q15 49 34 46            M40 37            Q49 19 69 20            M79 21            Q98 27 101 47            M112 54            Q122 60 119 73" stroke="#BDF4FF" stroke-width="2.7" stroke-linecap="round" opacity=".85"/>

  <!-- Inner cloud contour -->
  <path d="M24 80            Q30 89 41 88            M95 89            Q110 91 116 80" stroke="#198AB3" stroke-width="2.4" stroke-linecap="round" opacity=".65"/>

  <!-- API management connection loop -->
  <path d="M62 68            C80 68 91 80 91 94            C91 110 78 120 62 120" stroke="#198AB3" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Connection highlight -->
  <path d="M66 73            Q83 77 85 91            M82 106            Q75 114 65 114" stroke="#50E6FF" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Purple API endpoint -->
  <path d="M48 83            Q48 79 53 79            L67 79            Q72 79 72 84            L72 99            Q72 104 67 104            L53 104            Q48 104 48 99            Z" fill="url(#apimNode)" stroke="#56407F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Endpoint marker reflection -->
  <path d="M54 86            L63 86            M54 91            L54 96" stroke="#E9D8FF" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>

  <!-- Small API connection point -->
  <circle cx="61" cy="92" r="3" fill="#FFFFFF"/>

  <!-- Yellow sketchnote sparkle -->
  <path d="M112 17            L112 27            M107 22            L117 22" stroke="#FFD34E" stroke-width="3" stroke-linecap="round"/>

  <!-- Handwritten-style emphasis marks -->
  <path d="M12 104            Q21 109 31 108            M21 115            L28 117" stroke="#FFD34E" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle finishing accent -->
  <path d="M103 111            Q109 108 113 103" stroke="#32D4F5" stroke-width="2.7" stroke-linecap="round"/>

</svg>

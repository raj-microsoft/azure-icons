<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Database PostgreSQL Server (sketch)</title>
  
  <desc>
    Hand-drawn Azure PostgreSQL database cylinder with a
    recognizable white PostgreSQL elephant head, floppy ears,
    curved trunk, Azure-blue body, cyan elliptical top,
    uneven marker outlines, subtle yellow accents,
    and a transparent background.
  </desc>

  <defs>
    <linearGradient id="pgBody" x1="18" y1="65" x2="110" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset=".07" stop-color="#0060A9"/>
      <stop offset=".36" stop-color="#0071C8"/>
      <stop offset=".52" stop-color="#0078D4"/>
      <stop offset=".82" stop-color="#006ABB"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
    <linearGradient id="pgTop" x1="64" y1="12" x2="64" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8E8E8"/>
      <stop offset="1" stop-color="#D1EAF6"/>
    </linearGradient>
  </defs>

  <!-- Loose exterior sketchnote accents -->
  <path d="M12 33Q9 40 11 48" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round" opacity=".45"/>
  <path d="M116 39Q120 45 118 51" stroke="#50E6FF" stroke-width="2" stroke-linecap="round" opacity=".6"/>

  <!-- Main database cylinder -->
  <path d="M18 29            C18 41 38 47 64 47            C90 47 110 41 110 29            L110 107            C110 118 89 123 64 123            C39 123 18 118 18 107            Z" fill="url(#pgBody)" stroke="#124E83" stroke-width="3.3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Side marker highlights -->
  <path d="M25 51Q24 78 25 104" stroke="#54AEF0" stroke-width="2.3" stroke-linecap="round" opacity=".65"/>
  <path d="M103 52Q104 78 102 104" stroke="#003F78" stroke-width="2" stroke-linecap="round" opacity=".4"/>

  <!-- Bottom sketch contour -->
  <path d="M23 107Q34 118 64 119Q96 118 105 107" stroke="#50E6FF" stroke-width="1.8" stroke-linecap="round" opacity=".4"/>

  <!-- Database elliptical rim -->
  <path d="M110 29            C110 39 90 46 64 46            C38 46 18 39 18 29            C18 19 38 12 64 12            C90 12 110 19 110 29Z" fill="url(#pgTop)" stroke="#647F91" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cyan database opening -->
  <path d="M100 28            C100 35 84 40 64 40            C44 40 28 35 28 28            C28 21 44 17 64 17            C84 17 100 21 100 28Z" fill="#50E6FF" stroke="#198AB3" stroke-width="2.4"/>

  <!-- Inner opening depth -->
  <path d="M36 33            Q48 28 64 28            Q80 28 92 33            Q80 40 64 40            Q48 40 36 33Z" fill="#198AB3" opacity=".85"/>

  <!-- Rim reflection -->
  <path d="M42 23Q57 18 75 22" stroke="#E8FFFF" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- PostgreSQL elephant: left floppy ear -->
  <path d="M54 53            Q43 48 35 55            Q28 61 32 76            Q36 96 43 104            Q47 108 52 103            L61 91            Q65 81 62 69Z" fill="#F2F2F2" stroke="#D5E8F1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right floppy ear -->
  <path d="M77 54            Q88 49 96 55            Q105 62 99 82            Q95 97 89 103            Q84 107 80 101            L72 89            Q68 77 77 54Z" fill="#F2F2F2" stroke="#D5E8F1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Elephant head and forehead -->
  <path d="M49 72            Q49 57 59 53            Q66 49 74 53            Q83 57 84 72            Q84 83 79 91            L75 102            Q74 108 73 114            Q72 119 68 120            Q62 122 60 117            Q57 111 60 105            L62 97            Q56 95 53 89            Q49 82 49 72Z" fill="#F2F2F2" stroke="#D5E8F1" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Distinctive elephant trunk curl -->
  <path d="M63 98            Q65 106 62 112            Q60 118 64 120            Q69 124 75 119            Q79 115 79 110" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M69 103            Q71 111 69 115" stroke="#B8DCEB" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left facial eye -->
  <path d="M53 72Q58 68 62 72Q59 76 55 75Z" fill="#005BA1"/>
  <path d="M57 72L58 71" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right facial eye -->
  <path d="M72 72Q77 68 81 72Q78 76 74 75Z" fill="#005BA1"/>
  <path d="M76 72L77 71" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Forehead and trunk folds -->
  <path d="M62 82Q67 85 72 82" stroke="#B9DCEB" stroke-width="2" stroke-linecap="round"/>

  <path d="M61 91Q67 94 74 90" stroke="#B9DCEB" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Left ear interior -->
  <path d="M41 62            Q37 74 44 89            Q46 93 49 95" stroke="#C1DFEB" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right ear interior -->
  <path d="M91 61            Q96 73 90 88            Q88 93 85 95" stroke="#C1DFEB" stroke-width="2.2" stroke-linecap="round"/>

  <!-- White tusk-like lower facial details -->
  <path d="M53 94Q51 101 55 105" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M81 94Q83 101 79 105" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Tiny yellow sketchnote spark -->
  <path d="M114 70L118 66            M116 77L121 76" stroke="#F4C542" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M33 61L29 57            M38 57L37 52" stroke="#F4C542" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Loose handwritten-style finishing marks -->
  <path d="M36 115Q47 120 57 120" stroke="#B7E8FF" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
</svg>

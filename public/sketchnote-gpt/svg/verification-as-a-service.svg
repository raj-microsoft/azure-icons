<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"><title>Verification As A Service (sketch)</title>
  
  <desc>Hand-drawn Azure verification document with filled cyan person silhouette, two record lines, and an overlapping green verification seal.</desc>

  <!-- Azure document -->
  <path d="M8 4 Q8 2 12 2 L87 2 Q91 2 91 7 L91 121 Q91 126 87 126 L12 126 Q7 126 7 121 L7 8 Q7 5 8 4Z" fill="#2488D8" stroke="#243447" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Filled identity head -->
  <path d="M45 18            C52 17 57 23 58 30            C59 37 54 43 47 43            C40 43 35 38 35 31            C35 24 39 19 45 18Z" fill="#69DFFF" stroke="#243447" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Filled identity shoulders and torso -->
  <path d="M43 43            C35 43 29 47 26 53            C24 57 23 62 22 65            Q22 67 26 67            L68 67            Q72 67 71 63            C70 55 67 49 61 46            C57 44 52 43 50 43            L47 49Z" fill="#69DFFF" stroke="#243447" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- White collar wedge -->
  <path d="M42 43            Q47 47 52 43            L47 60Z" fill="#F2F2F2" stroke="#243447" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Verification record lines -->
  <path d="M27 78            Q26 77 29 77            L68 77 Q71 77 71 80            L71 84 Q71 86 68 86            L29 86 Q26 86 26 83Z" fill="#8EC1FA" stroke="#243447" stroke-width="2.2" stroke-linejoin="round"/>

  <path d="M28 95            L68 95 Q71 95 71 98            L71 102 Q71 104 68 104            L29 104 Q26 104 26 101            L26 98 Q26 95 28 95Z" fill="#8EC1FA" stroke="#243447" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Green verification seal -->
  <path d="M100 36            C115 36 125 47 125 63            C125 78 114 89 99 90            C84 90 73 78 73 63            C73 48 84 37 100 36Z" fill="#86D633" stroke="#243447" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- White verification check -->
  <path d="M84 63            L94 73            Q95 74 97 72            L115 52" fill="none" stroke="#243447" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M84 63            L94 73            Q95 74 97 72            L115 52" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

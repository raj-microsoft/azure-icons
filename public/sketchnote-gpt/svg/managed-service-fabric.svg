<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Managed Service Fabric (sketch)</title>
  
  <desc>Orange connected fabric nodes forming a pentagonal network, with an overlapping purple management gear and subtle Azure-blue and yellow marker accents.</desc>

  <defs>
    <linearGradient id="fabricOrange" x1="18" y1="12" x2="104" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAA21D"/>
      <stop offset="1" stop-color="#EF7100"/>
    </linearGradient>
    <linearGradient id="gearPurple" x1="63" y1="72" x2="111" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A67AF4"/>
      <stop offset=".52" stop-color="#864FE4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Connected Service Fabric network -->
  <path d="M19 53            Q36 41 62 22            Q83 37 109 54            L98 83            M19 53            L34 106            L45 106" stroke="#E27908" stroke-width="11"/>


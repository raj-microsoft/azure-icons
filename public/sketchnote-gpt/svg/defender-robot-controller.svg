<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Defender Robot Controller (sketch)</title>
  
  <desc>Hand-drawn industrial robot arm with a controller gear, preserving the original grey mechanical structure and Azure-blue gear.</desc>

  <defs>

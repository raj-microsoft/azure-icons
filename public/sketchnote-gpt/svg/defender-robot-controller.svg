      <stop stop-color="#5EA0EF"/>
      <stop offset=".55" stop-color="#278BDF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="steel" x1="14" y1="18" x2="80" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6E6E6"/>

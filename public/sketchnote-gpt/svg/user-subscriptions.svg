<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke="#203746" stroke-linecap="round" stroke-linejoin="round"><title>User Subscriptions (sketch)</title>

  
  <desc>Blue user profile beside a golden subscription key with a distinctive diamond-shaped key head and downward key shaft.</desc>

  <!-- User shoulders and torso -->
  <path d="     M12 111     C16 84 35 67 62 67     C88 67 108 85 113 111     Q115 119 105 120     L19 120     Q10 119 12 111 Z" fill="#32BEDD" stroke-width="3.8"/>

  <!-- User head -->
  <path d="     M62 8     C78 8 91 21 91 38     C91 54 78 67 62 67     C45 67 33 54 33 37     C33 21 46 8 62 8 Z" fill="#32D4F5" stroke-width="3.8"/>

  <!-- Face and collar detail -->
  <path d="M45 20 Q55 12 70 14" stroke="#9CEBFF" stroke-width="2.8"/>

  <path d="M46 69 L62 91 L77 69" stroke="#FFFFFF" stroke-width="3.5"/>

  <!-- Diamond-shaped key head -->
  <path d="     M91 81     L105 66     Q108 63 111 66     L124 79     Q127 82 124 85     L110 99     Q107 102 104 99     L91 86     Q88 84 91 81 Z" fill="#FFD70F" stroke-width="3.8"/>

  <!-- Diamond interior keyhole -->
  <circle cx="108" cy="82" r="4.2" fill="#FFF0A0" stroke-width="2.2"/>

  <!-- Key shaft descending from diamond -->
  <path d="     M108 99     L108 115     Q108 118 111 118     L115 114     L115 108     L120 104     L115 99" fill="#FEA11B" stroke-width="3.5"/>

  <!-- Shaft inner detail -->
  <path d="M110 103 L110 114" stroke="#FF9300" stroke-width="2.2"/>

  <!-- Uneven marker details -->
  <path d="     M28 96 Q42 80 59 80     M73 81 Q88 85 98 96" stroke="#9CEBFF" stroke-width="2.5"/>

</svg>

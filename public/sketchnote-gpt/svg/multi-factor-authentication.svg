<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none"><title>Multi Factor Authentication (sketch)</title>
  <defs>
    <linearGradient id="mfaLaptop" x1="38" y1="12" x2="38" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ea0ef"/>
      <stop offset=".45" stop-color="#3990e4"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="mfaScreen" x1="42" y1="22" x2="42" y2="77" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0fffd"/>
      <stop offset="1" stop-color="#d2ebff"/>
    </linearGradient>
    <linearGradient id="mfaPhone" x1="91" y1="39" x2="91" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ea0ef"/>
      <stop offset=".55" stop-color="#1c84dc"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Laptop outer frame -->
    <path d="M12 13.5c0-2.5 1.8-4.3 4.3-4.3h51.4c2.5 0 4.3 1.8 4.3 4.3v61.2H12Z" fill="url(#mfaLaptop)" stroke="#005ba1" stroke-width="3"/>
    <path d="M17 15h50v54H17Z" fill="url(#mfaScreen)" stroke="#0078d4" stroke-width="1.8"/>

    <!-- Screen reflection -->
    <path d="M20 19v39" stroke="#ffffff" stroke-width="2" opacity=".55"/>
    <path d="M24 18h25" stroke="#ffffff" stroke-width="1.3" opacity=".5"/>

    <!-- Laptop base -->
    <path d="M12 74.7h60l8.5 10.2c1.3 1.6.3 4-1.8 4H6.2c-2 0-3.1-2.4-1.8-4Z" fill="#0078d4" stroke="#005ba1" stroke-width="2.8"/>
    <path d="M30 79h24" stroke="#b8eaff" stroke-width="2.1"/>
    <path d="M8 85.5h69" stroke="#50b6ff" stroke-width="1.5"/>

    <!-- MFA authentication identity symbol on screen -->
    <circle cx="42" cy="46" r="17" fill="#86d633" stroke="#4f9821" stroke-width="2"/>
    <path d="m32.5 45.8 6.2 6.3 13-13.1" stroke="#ffffff" stroke-width="5.5"/>
    <path d="m32.5 45.8 6.2 6.3 13-13.1" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Smartphone -->
    <path d="M78.5 34.5c0-3.1 2.1-5.1 5.1-5.1h34.1c3 0 5.1 2 5.1 5.1v79.2c0 3-2.1 5.1-5.1 5.1H83.6c-3 0-5.1-2.1-5.1-5.1Z" fill="url(#mfaPhone)" stroke="#005ba1" stroke-width="3.2"/>

    <!-- Phone screen -->
    <rect x="83.5" y="41" width="34.3" height="64.3" rx="2.5" fill="url(#mfaScreen)" stroke="#0078d4" stroke-width="1.6"/>
    <path d="M86 45v49" stroke="#ffffff" stroke-width="1.6" opacity=".55"/>

    <!-- Phone speaker and home button -->
    <path d="M94 35.5h8" stroke="#f2f2f2" stroke-width="2.5"/>
    <circle cx="100" cy="111.5" r="2.2" fill="#f2f2f2"/>
    <circle cx="100" cy="111.5" r=".9" fill="#5ea0ef"/>

    <!-- Authentication lock -->
    <path d="M93 67v-5.5c0-4.2 3.1-7.2 7-7.2s7 3 7 7.2V67" stroke="#0078d4" stroke-width="3.5"/>
    <rect x="88.5" y="65" width="23" height="19" rx="3" fill="#86d633" stroke="#4f9821" stroke-width="2"/>
    <circle cx="100" cy="72.5" r="2.2" fill="#ffffff"/>
    <path d="M100 74.5v4" stroke="#ffffff" stroke-width="2.2"/>

    <!-- Wireless verification signal -->
    <path d="M89 51c2.8-3.3 6.5-5 11-5s8.2 1.7 11 5" stroke="#32bedd" stroke-width="2.2"/>
    <path d="M93 54c1.8-1.8 4.1-2.8 7-2.8s5.2 1 7 2.8" stroke="#0078d4" stroke-width="1.8"/>
    <circle cx="100" cy="58" r="1.5" fill="#32bedd"/>

    <!-- Connection between devices -->
    <path d="M71 48c4-4 8-4 12 0" stroke="#0078d4" stroke-width="2.5" stroke-dasharray="3 3"/>
    <path d="M73 57c3 2 5 2 8 0" stroke="#32bedd" stroke-width="2"/>

    <!-- Yellow sketchnote accents -->
    <path d="m65 15 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z" fill="#ffd84d" stroke="#d49b20" stroke-width="1.2"/>
    <path d="m117 17 1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5Z" fill="#ffca3a" stroke="#d49b20" stroke-width="1.1"/>

    <!-- Hand-drawn motion marks -->
    <path d="M8 35H3M8 42H5" stroke="#50b6ff" stroke-width="2"/>
    <path d="M121 88h4M121 94h3" stroke="#50b6ff" stroke-width="2"/>
    <path d="M27 96c3 1 6 1.5 9 1.2" stroke="#32bedd" stroke-width="1.8"/>
    <path d="M84 121h28" stroke="#0078d4" stroke-width="1.5" opacity=".6"/>
  </g>
</svg>

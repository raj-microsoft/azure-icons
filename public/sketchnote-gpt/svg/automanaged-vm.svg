<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Automanaged VM (sketch)</title>

  <defs>
    <linearGradient id="vmBlue" x1="64" y1="7" x2="64" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".8" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#0068B9"/>
    </linearGradient>
    <linearGradient id="vmStand" x1="64" y1="90" x2="64" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#707070"/>

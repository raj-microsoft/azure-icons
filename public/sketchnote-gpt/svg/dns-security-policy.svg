<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>DNS Security Policy (sketch)</title>
  
  <desc>Azure-blue DNS globe with network meridians and a green security shield containing a white padlock, illustrated with organic marker outlines.</desc>

  <defs>
    <radialGradient id="dnsGlobe" cx="36%" cy="28%" r="80%">
      <stop offset=".12" stop-color="#83B9F9"/>
      <stop offset=".55" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>
    <linearGradient id="policyGreen" x1="97" y1="57" x2="97" y2="125" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76BC2D"/>
      <stop offset=".55" stop-color="#6FB12A"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- DNS globe silhouette -->
  <path d="M47 5            C72 3 94 18 99 43            Q102 55 97 69            C90 90 73 100 52 101            Q26 101 12 82            C-2 63 1 39 15 22            Q28 7 47 5Z" fill="url(#dnsGlobe)" stroke="#075A9A" stroke-width="4"/>

  <!-- Hand-drawn latitude and longitude -->
  <g stroke="#B9DFFF" stroke-width="2.7" opacity=".85">
    <path d="M49 9              C28 26 24 76 48 97"/>
    <path d="M52 9              C72 27 78 51 69 78"/>
    <path d="M13 30              Q47 48 88 30"/>
    <path d="M8 67              Q35 53 72 62"/>
    <path d="M20 83              Q43 70 68 78"/>
  </g>

  <!-- Globe equator -->
  <path d="M7 50            Q45 37 96 50" stroke="#DDF2FF" stroke-width="3" stroke-dasharray="8 5" opacity=".65"/>

  <!-- Handwritten-style DNS letters -->
  <g stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M19 40 L19 64              Q35 65 35 52              Q35 40 19 40Z"/>
    <path d="M42 64 L42 40              L58 64 L58 40"/>
    <path d="M78 43              Q69 37 64 44              Q60 50 70 53              Q83 57 77 63              Q71 69 63 62"/>
  </g>

  <!-- Small globe marker highlights -->
  <path d="M18 23 Q25 15 36 12            M13 76 Q18 87 29 92" stroke="#D6EDFF" stroke-width="2.5" opacity=".8"/>

  <!-- Security shield overlapping globe -->
  <path d="M96 55            Q104 55 109 59            Q114 64 124 64            Q126 64 126 68            L126 91            Q126 109 99 125            Q96 127 93 125            Q67 109 67 91            L67 68            Q67 64 71 64            Q81 64 86 59            Q90 55 96 55Z" fill="url(#policyGreen)" stroke="#3C751D" stroke-width="4"/>

  <!-- Sketchy inset shield contour -->
  <path d="M96 62            Q104 62 109 68            Q113 71 120 71            L120 91            Q119 105 96 118            Q74 105 74 91            L74 71            Q83 70 88 65            Q92 62 96 62Z" stroke="#B4E583" stroke-width="2.5" opacity=".8"/>

  <!-- Padlock shackle -->
  <path d="M85 88            L85 81            Q85 69 96 69            Q107 69 107 81            L107 88" stroke="#FFFFFF" stroke-width="6"/>

  <path d="M90 87 L90 81            Q90 75 96 75            Q102 75 102 81            L102 87" stroke="#D8F2D0" stroke-width="2.5"/>

  <!-- Padlock body -->
  <path d="M81 87            Q81 84 85 84            L108 84            Q112 84 112 88            L112 106            Q112 110 108 110            L85 110            Q81 110 81 106Z" fill="#FFFFFF" stroke="#3C751D" stroke-width="2.5"/>

  <!-- Padlock keyhole -->
  <path d="M96 91            Q100 91 100 95            Q100 98 98 99            L99 104            L93 104            L94 99            Q92 97 92 95            Q92 91 96 91Z" fill="#5E9624"/>

  <!-- Marker shine -->
  <path d="M86 90 L86 103" stroke="#CDECB5" stroke-width="2" opacity=".7"/>

  <!-- Yellow security accent -->
  <path d="M110 43            L113 49            L119 52            L113 55            L110 61            L107 55            L101 52            L107 49Z" fill="#FFCF45" stroke="#C18C1C" stroke-width="1.5"/>

  <!-- Sketchnote rays -->
  <path d="M109 36 L109 32            M120 41 L124 37            M122 57 L127 58" stroke="#FFCF45" stroke-width="2.5"/>

  <!-- Hand-drawn annotation ticks -->
  <path d="M9 91 L5 95            M17 101 L14 106            M31 105 L29 111" stroke="#5EA0EF" stroke-width="2.5"/>

  <!-- Small verification dots -->
  <circle cx="23" cy="18" r="2" fill="#D6F4FF"/>
  <circle cx="86" cy="26" r="2" fill="#D6F4FF"/>
  <circle cx="117" cy="103" r="1.7" fill="#D5F0BD"/>
</svg>

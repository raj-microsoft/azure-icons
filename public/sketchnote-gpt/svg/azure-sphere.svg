<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Sphere (sketch)</title>

  
  <desc>
    Hand-drawn Azure Sphere icon with a turquoise circular
    background, central security shield, and three connected
    white network nodes. Uneven marker outlines, original
    Azure Sphere colours, subtle yellow highlights, and
    a transparent background.
  </desc>

  <defs>
    <linearGradient id="sphereBlue" x1="64" y1="10" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".52" stop-color="#28B7DB"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>

    <linearGradient id="shieldBlue" x1="64" y1="43" x2="64" y2="101" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B7F7FF"/>
      <stop offset=".45" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#28B7DB"/>
    </linearGradient>
  </defs>

  <!-- Organic hand-drawn sphere silhouette -->
  <path d="M64 10        C94 9 116 32 118 61        C120 92 97 117 66 119        C36 121 11 98 10 67        C8 36 32 11 64 10Z" fill="url(#sphereBlue)" stroke="#176889" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Loose secondary marker contour -->
  <path d="M25 36        Q39 17 60 17        M76 17        Q105 23 112 51        M113 79        Q106 106 80 112        M45 110        Q20 100 16 76" stroke="#B8F3FF" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>

  <!-- Subtle sketch highlight on sphere -->
  <path d="M27 45        Q35 29 51 25        M24 57 L23 64" stroke="#D8FAFF" stroke-width="3" stroke-linecap="round" opacity=".75"/>

  <!-- Central security shield outer silhouette -->
  <path d="M64 42        Q58 42 53 46        Q47 51 35 52        L35 73        C35 87 49 99 64 108        C79 99 93 87 93 73        L93 52        Q81 51 75 46        Q69 42 64 42Z" fill="#F3FDFF" stroke="#176889" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner turquoise shield -->
  <path d="M64 49        Q58 49 53 53        Q49 56 42 57        L42 73        C42 84 53 94 64 101        C75 94 86 84 86 73        L86 57        Q79 56 75 53        Q69 49 64 49Z" fill="url(#shieldBlue)" stroke="#1689AE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Shield hand-drawn interior accent -->
  <path d="M48 64        L48 74        Q49 84 58 91" stroke="#E1FCFF" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>

  <!-- Small security check detail -->
  <path d="M55 74        L62 81        L75 66" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top connected node -->
  <path d="M64 23        Q64 32 64 39" stroke="#D8FAFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>

  <path d="M64 7        C70 7 75 12 75 18        C75 24 70 29 64 29        C58 29 53 24 53 18        C53 12 58 7 64 7Z" fill="#FFFFFF" stroke="#8C9DA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left lower connected node -->
  <path d="M28 96        Q34 92 40 88" stroke="#D8FAFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>

  <path d="M19 91        C25 90 30 95 31 101        C32 108 27 113 21 114        C15 115 9 111 8 104        C7 98 12 92 19 91Z" fill="#FFFFFF" stroke="#8C9DA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right lower connected node -->
  <path d="M100 88        Q106 92 111 96" stroke="#D8FAFF" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>

  <path d="M108 92        C114 90 120 94 121 100        C123 107 119 113 112 114        C106 115 100 111 99 105        C98 99 102 94 108 92Z" fill="#FFFFFF" stroke="#8C9DA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtle node highlights -->
  <g stroke="#C2EAF2" stroke-width="2.3" stroke-linecap="round">
    <path d="M60 14 Q64 12 68 15"/>
    <path d="M15 101 Q16 97 20 97"/>
    <path d="M105 102 Q106 98 110 98"/>
  </g>

  <!-- Restrained yellow sketchnote emphasis -->
  <g stroke="#F5C84C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 33 L84 28"/>
    <path d="M87 39 L93 37"/>
    <path d="M34 39 L30 35"/>
  </g>

  <!-- Small hand-drawn sparkle -->
  <path d="M97 23        L97 29        M94 26        L100 26" stroke="#F5C84C" stroke-width="2" stroke-linecap="round"/>

</svg>

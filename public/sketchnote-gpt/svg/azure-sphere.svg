<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"><title>Azure Sphere (sketch)</title>
  
  <desc>
    Azure Sphere with a turquoise circular field,
    an empty cyan security shield, and three white
    circular nodes. Flat fills, irregular charcoal
    marker outlines, and transparent surroundings.
  </desc>

  <!-- Turquoise circular field -->
  <path d="M64 6        C96 5 120 29 122 61        C124 94 99 120 66 122        C33 124 7 100 6 67        C5 34 30 8 64 6Z" fill="#28B7DB" stroke="#203746" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Security shield: pale outer shape -->
  <path d="M64 36.7        C58 36.4 54 39.5 49 42.5        C44 45.5 38.5 47.2 33.2 47.4        L33.1 69.6        C33.2 88.1 51.3 102.5 64 110.7        C76.8 102.5 94.7 88.1 94.9 69.6        L94.8 47.4        C89.3 47.2 84 45.5 79 42.5        C74 39.5 70 36.4 64 36.7Z" fill="#F3FDFF" stroke="#203746" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner cyan shield, intentionally empty -->
  <path d="M64 40.3        C58.8 40.1 54.8 43.1 50.5 45.7        C46.5 48.2 42 50.2 36.5 50.6        L36.5 69.6        C36.5 84.2 51.4 97.8 64 106.8        C76.6 97.8 91.5 84.2 91.5 69.6        L91.5 50.6        C86 50.2 81.5 48.2 77.5 45.7        C73.2 43.1 69.2 40.1 64 40.3Z" fill="#50E6FF" stroke="#203746" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upper white circular node -->
  <path d="M64 2.3        C71.5 2 77.8 8 78 15.5        C78.2 23.2 72 29.2 64.4 29.5        C56.7 29.8 50.3 23.6 50.2 16        C50.1 8.4 56.4 2.6 64 2.3Z" fill="#FFFFFF" stroke="#203746" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower-left white circular node -->
  <path d="M19.1 86.4        C26.6 85.9 33 91.9 33.3 99.4        C33.6 107.1 27.3 113.3 19.8 113.6        C12.1 113.9 5.8 107.9 5.7 100.3        C5.5 92.8 11.5 86.9 19.1 86.4Z" fill="#FFFFFF" stroke="#203746" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower-right white circular node -->
  <path d="M108.5 86.4        C116 85.9 122.2 91.8 122.5 99.4        C122.8 107.1 116.7 113.3 109 113.6        C101.4 113.9 95.2 107.9 95.1 100.3        C95 92.8 101 86.9 108.5 86.4Z" fill="#FFFFFF" stroke="#203746" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

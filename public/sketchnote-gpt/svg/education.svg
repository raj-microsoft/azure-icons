<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Education (sketch)</title>
  
  <desc>Hand-drawn purple graduation cap with a violet mortarboard, curved academic crown, and bright cyan tassel, preserving the original Azure Education icon symbolism.</desc>

  <defs>
    <linearGradient id="capPurple" x1="64" y1="17" x2="64" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#773ADC"/>
      <stop offset=".35" stop-color="#9664EC"/>
      <stop offset=".7" stop-color="#A274F2"/>
      <stop offset="1" stop-color="#A67AF4"/>
    </linearGradient>
    <linearGradient id="bandPurple" x1="64" y1="63" x2="64" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8249E2"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Curved academic cap body -->
  <path d="M26 65            Q43 70 64 70            Q84 70 102 65            L102 96            Q102 103 91 108            Q80 114 64 114            Q48 114 36 109            Q26 105 26 97 Z" fill="url(#bandPurple)" stroke="#552F99" stroke-width="3.8"/>

  <!-- Hand-sketched lower curve -->
  <path d="M32 99            Q43 108 63 109            Q83 110 96 100" stroke="#B79AF2" stroke-width="2.8" opacity=".8"/>

  <!-- Graduation mortarboard diamond -->
  <path d="M61 17            Q64 15 68 17            L119 43            Q123 45 122 49            Q122 52 118 54            L68 76            Q64 78 60 76            L10 54            Q6 52 6 48            Q6 45 10 43 Z" fill="url(#capPurple)" stroke="#552F99" stroke-width="4"/>

  <!-- Loose hand-drawn upper edge highlights -->
  <path d="M17 46 L60 24 Q64 22 68 24 L109 45" stroke="#CDB9FF" stroke-width="3" opacity=".85"/>

  <!-- Mortarboard front edge accent -->
  <path d="M16 55 L60 75 Q64 77 69 75 L111 56" stroke="#773ADC" stroke-width="2.1" opacity=".7"/>

  <!-- Dark central button -->
  <path d="M56 45            Q61 41 69 44            Q75 46 74 50            Q73 54 65 55            Q57 55 54 51            Q52 48 56 45 Z" fill="#552F99" stroke="#43227C" stroke-width="2"/>

  <!-- Small blue reflection -->
  <path d="M59 46 Q64 44 69 47" stroke="#B29AF0" stroke-width="1.8"/>

  <!-- Cyan tassel cord -->
  <path d="M66 49            Q79 54 92 60            Q106 66 110 78            Q114 87 112 96" stroke="#178EBE" stroke-width="7"/>

  <path d="M66 47            Q80 52 94 60            Q106 67 110 79            Q113 87 111 95" stroke="#50E6FF" stroke-width="4.5"/>

  <!-- Tassel knot -->
  <path d="M107 94            Q111 91 115 95            Q117 99 114 103            Q110 105 107 101 Z" fill="#50E6FF" stroke="#178EBE" stroke-width="2.4"/>

  <!-- Hanging tassel strands -->
  <path d="M109 102 Q106 110 104 117" stroke="#50E6FF" stroke-width="3"/>
  <path d="M112 103 Q112 112 111 120" stroke="#178EBE" stroke-width="3"/>
  <path d="M115 102 Q119 110 120 117" stroke="#50E6FF" stroke-width="3"/>

  <!-- Subtle hand-drawn spark accents -->
  <g stroke="#E6B94B" stroke-width="2.5">
    <path d="M21 24 L18 19"/>
    <path d="M28 18 L29 12"/>
    <path d="M103 22 L107 17"/>
  </g>

  <!-- Violet marker flourishes -->
  <g stroke="#A67AF4" stroke-width="2.3" opacity=".85">
    <path d="M13 69 Q18 72 21 76"/>
    <path d="M38 118 Q48 122 55 122"/>
    <path d="M78 121 Q86 120 91 117"/>
  </g>
</svg>

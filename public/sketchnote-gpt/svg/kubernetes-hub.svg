<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Kubernetes Hub (sketch)</title>
  
  <desc>Azure-blue rounded square containing seven interconnected purple isometric Kubernetes cubes, illustrated with uneven marker outlines.</desc>

  <defs>
    <linearGradient id="frameBlue" x1="9" y1="9" x2="119" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0094F0"/>
      <stop offset="1" stop-color="#2052CB"/>
    </linearGradient>
    <linearGradient id="panel" x1="64" y1="12" x2="64" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8F7FF"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn Azure-blue outer frame -->
  <path d="M23 6            Q15 6 11 12            Q6 17 7 25            L7 103            Q7 113 14 118            Q19 122 27 121            L103 121            Q113 121 118 114            Q122 109 121 101            L121 25            Q121 16 115 11            Q110 6 102 7 Z" fill="url(#panel)" stroke="url(#frameBlue)" stroke-width="7"/>

  <!-- Subtle second marker line -->
  <path d="M24 13 Q15 14 14 25            L14 103 Q14 114 26 114            L102 114 Q114 114 114 102            L114 26 Q114 14 102 14" stroke="#74BDF0" stroke-width="2.2" opacity=".7"/>

  <!-- Seven explicit editable Kubernetes cubes -->
  <g stroke="#50328D" stroke-width="1.8">

    <!-- Back upper cube: center 64,29 -->
    <g>
      <path d="M64 18 L77 25 L64 33 L51 25 Z" fill="#BD96FF"/>
      <path d="M51 25 L64 33 L64 48 L51 40 Z" fill="#8B52F4"/>
      <path d="M64 33 L77 25 L77 40 L64 48 Z" fill="#9C6CFE"/>
      <path d="M56 25 L64 29 L72 25" stroke="#E8D9FF" stroke-width="1.5" opacity=".85"/>
    </g>

    <!-- Upper-right cube: center 87,42 -->
    <g>
      <path d="M87 31 L100 38 L87 46 L74 38 Z" fill="#BD96FF"/>
      <path d="M74 38 L87 46 L87 61 L74 53 Z" fill="#8B52F4"/>
      <path d="M87 46 L100 38 L100 53 L87 61 Z" fill="#9C6CFE"/>
      <path d="M79 38 L87 42 L95 38" stroke="#E8D9FF" stroke-width="1.5" opacity=".85"/>
    </g>

    <!-- Upper-left cube: center 41,42 -->
    <g>
      <path d="M41 31 L54 38 L41 46 L28 38 Z" fill="#BD96FF"/>
      <path d="M28 38 L41 46 L41 61 L28 53 Z" fill="#8B52F4"/>
      <path d="M41 46 L54 38 L54 53 L41 61 Z" fill="#9C6CFE"/>
      <path d="M33 38 L41 42 L49 38" stroke="#E8D9FF" stroke-width="1.5" opacity=".85"/>
    </g>

    <!-- Middle cube: center 64,55 -->
    <g>
      <path d="M64 44 L77 51 L64 59 L51 51 Z" fill="#BD96FF"/>
      <path d="M51 51 L64 59 L64 74 L51 66 Z" fill="#8B52F4"/>
      <path d="M64 59 L77 51 L77 66 L64 74 Z" fill="#9C6CFE"/>
      <path d="M56 51 L64 55 L72 51" stroke="#E8D9FF" stroke-width="1.5" opacity=".85"/>
    </g>

    <!-- Lower-left cube: center 41,68 -->
    <g>
      <path d="M41 57 L54 64 L41 72 L28 64 Z" fill="#BD96FF"/>
      <path d="M28 64 L41 72 L41 87 L28 79 Z" fill="#8B52F4"/>
      <path d="M41 72 L54 64 L54 79 L41 87 Z" fill="#9C6CFE"/>
      <path d="M33 64 L41 68 L49 64" stroke="#E8D9FF" stroke-width="1.5" opacity=".85"/>
    </g>

    <!-- Lower-right cube: center 87,68 -->
    <g>
      <path d="M87 57 L100 64 L87 72 L74 64 Z" fill="#BD96FF"/>
      <path d="M74 64 L87 72 L87 87 L74 79 Z" fill="#8B52F4"/>
      <path d="M87 72 L100 64 L100 79 L87 87 Z" fill="#9C6CFE"/>
      <path d="M79 64 L87 68 L95 64" stroke="#E8D9FF" stroke-width="1.5" opacity=".85"/>
    </g>

    <!-- Bottom cube: center 64,81 -->
    <g>
      <path d="M64 70 L77 77 L64 85 L51 77 Z" fill="#BD96FF"/>
      <path d="M51 77 L64 85 L64 100 L51 92 Z" fill="#8B52F4"/>
      <path d="M64 85 L77 77 L77 92 L64 100 Z" fill="#9C6CFE"/>
      <path d="M56 77 L64 81 L72 77" stroke="#E8D9FF" stroke-width="1.5" opacity=".85"/>
    </g>
  </g>

  <!-- Hand-drawn cube edge accents -->
  <g stroke="#E5D6FF" stroke-width="1.7" opacity=".8">
    <path d="M57 25 L64 21 L71 25"/>
    <path d="M34 38 L41 34 L48 38"/>
    <path d="M80 38 L87 34 L94 38"/>
    <path d="M57 51 L64 47 L71 51"/>
    <path d="M34 64 L41 60 L48 64"/>
    <path d="M80 64 L87 60 L94 64"/>
    <path d="M57 77 L64 73 L71 77"/>
  </g>

  <!-- Subtle marker sketch details -->
  <g stroke="#5EA0EF" stroke-width="2.3" opacity=".75">
    <path d="M20 30 L20 43"/>
    <path d="M20 48 L20 55"/>
    <path d="M108 80 L108 94"/>
    <path d="M29 108 L42 108"/>
  </g>

  <!-- Small yellow sketchnote sparks -->
  <g stroke="#E8B72A" stroke-width="2.5">
    <path d="M97 20 L101 16"/>
    <path d="M101 27 L107 26"/>
    <path d="M25 89 L21 93"/>
    <path d="M30 94 L29 100"/>
  </g>

  <!-- Light integration connection marks -->
  <g stroke="#A67AF4" stroke-width="2" opacity=".65">
    <path d="M53 94 Q64 99 75 94"/>
    <path d="M48 99 L53 101"/>
    <path d="M75 101 L80 99"/>
  </g>
</svg>

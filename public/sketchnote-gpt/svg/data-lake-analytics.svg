<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Data Lake Analytics (sketch)</title>
  
  <desc>Hand-drawn Azure Data Lake Analytics icon with a cyan rotated backing, blue dashboard and white lightning bolt.</desc>

  <defs>
    <linearGradient id="lakeBlue" x1="64" y1="20" x2="64" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#54AEF0"/>
      <stop offset="1" stop-color="#1988D9"/>
    </linearGradient>
  </defs>

  <!-- Rotated cyan backing sheet -->
  <path d="M45 8            Q48 5 52 7            L117 36            Q122 38 120 44            L91 115            Q89 121 83 119            L11 86            Q6 84 9 78            L39 13            Q41 9 45 8Z" fill="#50E6FF" stroke="#176A96" stroke-width="3.4"/>


  <path d="M27 21            Q23 21 22 27            L22 100            Q22 106 29 107            L99 107            Q106 107 106 100            L106 28            Q106 21 100 21            Z" fill="url(#lakeBlue)" stroke="#174E83" stroke-width="4"/>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Toolchain Orchestrator (sketch)</title>
  
  <desc>Three colored orchestration nodes connected by a hand-drawn circular grey workflow, surrounding crossed wrench and screwdriver tools.</desc>

  <defs>
    <linearGradient id="azure" x1="15" y1="38" x2="105" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="violet" x1="53" y1="4" x2="74" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="teal" x1="102" y1="62" x2="125" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3CD4C2"/>
      <stop offset="1" stop-color="#258277"/>
    </linearGradient>
  </defs>

  <!-- Circular orchestration flow -->
  <g stroke="#9B9C9C" stroke-width="5.5">
    <path d="M49 15              C28 20 12 38 10 59"/>
    <path d="M79 15              C101 21 116 39 118 59"/>
    <path d="M18 93              C29 111 45 120 64 120              C83 120 100 111 110 93"/>
  </g>

  <!-- Uneven marker accents -->
  <g stroke="#B3B2B3" stroke-width="1.8" opacity=".75">
    <path d="M43 12 Q19 25 13 48"/>
    <path d="M86 12 Q108 24 115 48"/>
    <path d="M31 113 Q48 125 66 124"/>
    <path d="M79 123 Q96 118 105 106"/>
  </g>

  <!-- Central screwdriver behind wrench -->
  <path d="M86 35            L94 29            L99 33            L93 43            L85 49            L72 62            L58 76            L44 91            L35 82            L50 67            L65 53            L79 40Z" fill="#9B9C9C" stroke="#62686D" stroke-width="2.8"/>

  <!-- Screwdriver tip -->
  <path d="M85 35            L95 27            L103 29            L104 34            L96 45            L90 47            L85 42Z" fill="#B3B2B3" stroke="#62686D" stroke-width="2.5"/>

  <!-- Screwdriver handle -->
  <path d="M35 79            Q32 78 29 82            L24 88            Q22 91 25 94            L33 102            Q36 105 39 102            L46 95            Q49 92 45 88Z" fill="#A2A2A2" stroke="#62686D" stroke-width="2.8"/>

  <path d="M30 89 L38 97" stroke="#E6E6E6" stroke-width="2.5"/>

  <!-- Main wrench, crossing the screwdriver -->
  <path d="M30 33            C22 42 23 55 32 63            C38 69 46 71 54 68            L86 101            C91 106 99 106 104 101            C109 96 109 89 104 84            L70 50            C73 42 71 34 65 28            C58 21 49 19 40 23            L49 33            L46 43            L36 46            L26 36            Q28 34 30 33Z" fill="url(#azure)" stroke="#075A9E" stroke-width="3.5"/>

  <!-- Open jaw detail -->
  <path d="M26 36            L36 46            L46 43            L49 33            L40 23" stroke="#075A9E" stroke-width="3.2"/>

  <!-- Wrench inner highlight -->
  <path d="M57 60            Q74 77 93 95" stroke="#A6DAFF" stroke-width="3" opacity=".85"/>

  <path d="M35 55 Q42 63 51 61" stroke="#B8E3FF" stroke-width="2.5" opacity=".8"/>

  <!-- Wrench handle hole -->
  <path d="M94 88            C97 87 100 89 101 92            C102 95 99 98 96 98            C93 98 91 95 92 92            Q92 89 94 88Z" fill="#EAF6FF" stroke="#075A9E" stroke-width="2.2"/>

  <!-- Top purple orchestration node -->
  <path d="M64 4            C71 4 77 9 77 16            C77 23 72 29 65 29            C57 29 52 24 52 17            C52 10 57 4 64 4Z" fill="url(#violet)" stroke="#6731B9" stroke-width="2.8"/>

  <!-- Left Azure-blue node -->
  <path d="M12 65            C19 65 25 71 25 78            C25 85 19 91 12 91            C5 91 2 85 2 78            C2 71 5 65 12 65Z" fill="url(#azure)" stroke="#075A9E" stroke-width="2.8"/>

  <!-- Right teal orchestration node -->
  <path d="M116 65            C123 65 126 71 126 78            C126 85 123 91 116 91            C109 91 103 85 103 78            C103 71 109 65 116 65Z" fill="url(#teal)" stroke="#258277" stroke-width="2.8"/>

  <!-- Subtle marker highlights -->
  <g stroke="#FFFFFF" stroke-width="2.4" opacity=".8">
    <path d="M58 13 Q60 9 64 9"/>
    <path d="M7 75 Q9 71 12 71"/>
    <path d="M110 75 Q112 71 116 71"/>
  </g>

  <!-- Small hand-drawn yellow spark -->
  <path d="M82 14            L85 9            L88 14            L93 17            L88 20            L85 25            L82 20            L77 17Z" fill="#FFD966" stroke="#D49A20" stroke-width="1.5"/>

  <!-- Sketch motion accents -->
  <g stroke="#0078D4" stroke-width="2" opacity=".8">
    <path d="M17 31 L22 27"/>
    <path d="M22 36 L27 32"/>
    <path d="M102 108 L106 104"/>
  </g>
</svg>

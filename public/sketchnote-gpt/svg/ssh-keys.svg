<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>SSH Keys (sketch)</title>
  
  <desc>Azure-blue cloud containing a large cyan diamond-headed SSH key with a small circular hole, broad angular shoulders, long vertical shaft and notched right edge. Flat colors and uneven charcoal marker outlines.</desc>

  <!-- Azure cloud silhouette -->
  <path d="M36 98            C24 99 13 91 12 78            C10 66 18 54 31 50            Q34 48 39 48            C42 29 54 18 69 17            C85 16 98 27 101 43            C112 45 119 54 120 66            C122 81 112 95 99 98            Q95 99 90 98Z" fill="#348DDF" stroke="#30343D" stroke-width="3.6"/>

  <!-- Small cloud contour details -->
  <path d="M23 61 Q29 54 38 54            M47 31 Q56 22 67 23            M105 53 Q113 59 114 69" stroke="#1C5F9F" stroke-width="2.2"/>

  <!-- Large diamond-headed SSH key -->
  <path d="M56 54            Q62 47 68 41            Q72 37 76 41            L91 56            Q96 61 91 67            L81 77            Q79 79 79 83            L79 108            L83 112            Q85 114 83 116            L80 119            L83 122            Q85 124 83 126            L77 132            L71 126            Q69 125 69 122            L69 84            Q69 81 67 79            L56 68            Q50 61 56 54Z" transform="translate(0 -14)" fill="#50DFF5" stroke="#30343D" stroke-width="3.7"/>

  <!-- Small circular hole near top of diamond -->
  <path d="M76 46            C72 46 69 49 69 53            C69 57 72 60 76 60            C80 60 83 57 83 53            C83 49 80 46 76 46Z" transform="translate(0 -14)" fill="#348DDF" stroke="#30343D" stroke-width="2.6"/>

  <!-- Two horizontal marks across lower diamond -->
  <path d="M63 69            Q76 70 88 69            M66 75            Q76 76 85 75" transform="translate(0 -14)" stroke="#176FAF" stroke-width="2.6"/>

  <!-- Vertical shaft marker stroke -->
  <path d="M74 86            Q73 100 74 115" transform="translate(0 -14)" stroke="#176FAF" stroke-width="2.4"/>

  <!-- Flat angular right-edge key teeth -->
  <path d="M79 97 L83 101            M79 105 L83 109            M79 113 L83 117" transform="translate(0 -14)" stroke="#176FAF" stroke-width="1.8"/>

</svg>

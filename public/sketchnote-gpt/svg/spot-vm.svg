<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Spot VM (sketch)</title>
  
  <desc>Azure Spot VM monitor with a central isometric cube, a nearly complete circular refresh arrow, and a grey pedestal stand.</desc>

  <!-- Monitor: wide rectangular screen -->
  <path d="M7 9            Q7 6 11 6            L117 6 Q121 6 121 10            L121 84 Q121 89 117 89            L11 89 Q7 89 7 85 Z" fill="#398FDE" stroke="#203746" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Central circular blue emblem -->
  <path d="M93 47            C93 63 80 76 64 76            C48 76 35 63 35 47            C35 31 48 18 64 18            C80 18 93 31 93 47 Z" fill="#006DBB" stroke="#203746" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Isometric cube: top face -->
  <path d="M64 29            L81 39            L64 49            L47 39 Z" fill="#C3F1FF" stroke="#203746" stroke-width="2" stroke-linejoin="round"/>

  <!-- Isometric cube: left face -->
  <path d="M47 39            L64 49            L64 69            L47 59 Z" fill="#9CEBFF" stroke="#203746" stroke-width="2" stroke-linejoin="round"/>

  <!-- Isometric cube: right face -->
  <path d="M64 49            L81 39            L81 59            L64 69 Z" fill="#50E6FF" stroke="#203746" stroke-width="2" stroke-linejoin="round"/>

  <!-- Circular refresh arrow:
       Full circular sweep around the cube,
       with the small gap and arrowhead at upper center.
       Drawn as one uneven marker-style white band. -->
  <path d="M85 24            C91 30 95 38 95 47            C95 64 81 78 64 78            C47 78 33 64 33 47            C33 30 47 16 64 16            C65 16 67 16 69 16" fill="none" stroke="#203746" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M85 24            C91 30 95 38 95 47            C95 64 81 78 64 78            C47 78 33 64 33 47            C33 30 47 16 64 16            C65 16 67 16 69 16" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Refresh arrowhead: upper inward-facing tip -->
  <path d="M68 12            L78 20            Q79 21 77 22            L65 27            L67 20 Z" fill="#FFFFFF" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Monitor pedestal:
       Tapered neck opening into a broad foot -->
  <path d="M51 89            L77 89            C77 103 78 111 88 113            Q93 114 94 120            L34 120            Q35 114 40 113            C50 111 51 103 51 89 Z" fill="#B9B9B9" stroke="#203746" stroke-width="3.2" stroke-linejoin="round"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>VM Image Version (sketch)</title>

  
  <desc>
    Hand-drawn Azure VM Image Version icon featuring a blue
    rectangular VM image document with a cyan isometric cube,
    a large gray optical disk behind it, and a purple circular
    version badge containing a white delta symbol.
    Flat fills, irregular charcoal marker outlines,
    and a transparent background.
  </desc>

  <!-- Large gray optical disk behind document -->
  <path d="     M71 7     C98 7 119 29 119 56     C119 76 108 91 91 99     C85 92 77 88 67 86     C54 83 43 73 41 58     C38 33 51 12 71 7Z" fill="#929292" stroke="#30343D" stroke-width="3.6"/>

  <!-- Optical disk center ring -->
  <path d="     M71 32     C84 32 94 42 94 55     C94 68 84 78 71 78     C58 78 48 68 48 55     C48 42 58 32 71 32Z" fill="#B3B3B3" stroke="#30343D" stroke-width="3.2"/>

  <!-- Central disk opening -->
  <path d="     M71 44     C77 44 82 49 82 55     C82 61 77 66 71 66     C65 66 60 61 60 55     C60 49 65 44 71 44Z" fill="#727272" stroke="#30343D" stroke-width="2.7"/>

  <!-- Blue VM image document -->
  <path d="     M8 5     Q8 3 12 3     L70 3     Q73 3 73 7     L73 73     Q68 88 69 105     Q69 110 74 116     L74 117     L12 117     Q8 117 8 113Z" fill="#0078D4" stroke="#30343D" stroke-width="3.7"/>

  <!-- Flat darker right face of document -->
  <path d="     M65 6     L70 6     L70 73     Q66 87 66 103     L65 111Z" fill="#005BA1"/>

  <!-- Isometric VM cube: top face -->
  <path d="     M22 47     L42 35     L62 47     L42 59Z" fill="#C3F1FF" stroke="#30343D" stroke-width="2.8"/>

  <!-- Cube left face -->
  <path d="     M22 47     L42 59     L42 83     L22 71Z" fill="#9CEBFF" stroke="#30343D" stroke-width="2.8"/>

  <!-- Cube right face -->
  <path d="     M42 59     L62 47     L62 71     L42 83Z" fill="#50E6FF" stroke="#30343D" stroke-width="2.8"/>

  <!-- Purple circular version badge -->
  <path d="     M100 70     C116 70 125 82 125 97     C125 113 114 124 99 124     C84 124 73 113 73 98     C73 83 85 70 100 70Z" fill="#9563E9" stroke="#30343D" stroke-width="3.7"/>

  <!-- White delta symbol -->
  <path d="     M99 82     Q100 81 101 84     L114 111     Q115 114 112 114     L86 114     Q83 114 85 111Z" fill="#FFFFFF" stroke="#30343D" stroke-width="2.5"/>

  <!-- Open center of delta -->
  <path d="     M100 94     L106 108     L93 108Z" fill="#9563E9" stroke="#30343D" stroke-width="2"/>

</svg>

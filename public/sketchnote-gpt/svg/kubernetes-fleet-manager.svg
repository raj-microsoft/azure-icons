<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Kubernetes Fleet Manager (sketch)</title>
  
  <desc>Six purple Kubernetes fleet containers arranged in a symmetric formation above three Azure-blue ships floating on a light-blue wave, recreated with uneven hand-drawn vector outlines.</desc>

  <defs>
    <linearGradient id="fleetPurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="fleetBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1490DF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Top fleet container -->

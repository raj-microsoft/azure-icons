  <path d="M36 94 L58 85            Q64 83 70 85            L92 94 L83 113            Q78 114 73 111            Q64 105 55 111            Q50 114 45 113 Z" fill="url(#fleetBlue)" stroke="#005A9E" stroke-width="2.8"/>


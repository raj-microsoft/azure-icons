<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>SignalR (sketch)</title>
  
  <desc>Azure SignalR icon with an organic blue circular background, a hand-drawn white stylized R, subtle marker highlights, and restrained yellow accents.</desc>

  <defs>

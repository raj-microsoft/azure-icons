      <stop offset=".18" stop-color="#5EA0EF"/>
      <stop offset=".65" stop-color="#238BDD"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>
  </defs>

  <!-- Organic circular Azure background -->
  <path d="M64 5            C81 4 99 12 110 25            C122 39 125 55 123 70            C121 88 113 103 99 114            C85 124 68 126 52 123            C34 120 19 111 11 97            C3 83 2 65 6 49            C10 31 21 18 37 10            C46 6 55 5 64 5 Z" fill="url(#signalBlue)" stroke="#126AB1" stroke-width="3.4"/>


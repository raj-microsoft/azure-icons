<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Cost Management and Billing (sketch)</title>
  
  <desc>
    Hand-drawn circular cost management chart with a large
    green budget segment, yellow billing segment, grey
    upper segment, and central teal dollar symbol.
    Original Azure icon colours, irregular marker outlines,
    subtle highlights, and a transparent background.
  </desc>

  <defs>
    <linearGradient id="costGreen" x1="10" y1="30" x2="88" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76BC2D"/>
      <stop offset="0.55" stop-color="#6FB12A"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>

    <linearGradient id="billingYellow" x1="89" y1="66" x2="111" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE452"/>
      <stop offset="0.5" stop-color="#FFCA00"/>
      <stop offset="1" stop-color="#F0B900"/>
    </linearGradient>

    <linearGradient id="chartGrey" x1="64" y1="9" x2="117" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6E6E6"/>
      <stop offset="1" stop-color="#AAAAAA"/>
    </linearGradient>
  </defs>

  <!-- Upper grey chart segment -->
  <path d="M59 9            C75 8 91 14 102 25            C113 36 119 51 119 67            L93 67            C93 57 89 48 82 42            C76 36 68 34 59 34Z" fill="url(#chartGrey)" stroke="#858585" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Grey segment marker highlights -->
  <path d="M65 14            C82 15 95 25 103 38" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.9"/>

  <path d="M108 46            Q112 54 113 62" stroke="#F5F5F5" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Main green cost-management ring -->
  <path d="M61 37            C43 36 28 49 27 67            C26 85 39 99 57 100            C70 101 80 96 87 87            L104 106            C92 119 76 125 58 124            C26 123 6 98 7 67            C8 35 31 13 61 12Z" fill="url(#costGreen)" stroke="#4B7C1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner green arc marker trace -->
  <path d="M56 43            C42 44 33 55 33 68            C33 83 44 93 57 94" stroke="#A9DC72" stroke-width="2.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Outer hand-drawn green highlight -->
  <path d="M13 61            C16 39 31 23 49 19            M12 79            C16 99 32 114 50 117" stroke="#C4E8A0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Yellow billing segment -->
  <path d="M93 68            L119 68            C119 83 114 95 104 106            L87 87            C91 82 93 75 93 68Z" fill="url(#billingYellow)" stroke="#C99400" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Yellow segment highlights -->
  <path d="M113 75            Q112 88 105 97" stroke="#FFF1A3" stroke-width="2.7" stroke-linecap="round" opacity="0.9"/>

  <path d="M100 74            Q100 81 97 86" stroke="#FFE87A" stroke-width="2" stroke-linecap="round"/>

  <!-- Central dollar sign -->
  <path d="M62 48 L62 91" stroke="#258277" stroke-width="4.6" stroke-linecap="round"/>

  <path d="M73 55            C67 51 58 51 53 55            C48 59 50 65 55 68            C60 71 68 72 72 76            C77 81 73 87 67 89            C61 91 54 89 49 85" stroke="#258277" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fine hand-drawn dollar highlight -->
  <path d="M70 52            Q61 49 54 53            M52 89            Q61 94 69 90" stroke="#62B3A8" stroke-width="1.9" stroke-linecap="round" opacity="0.8"/>

  <!-- Small inner chart emphasis -->
  <path d="M83 46            Q88 51 89 58" stroke="#999999" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Azure-blue sketchnote accents -->
  <g stroke="#0078D4" stroke-width="2.3" stroke-linecap="round">
    <path d="M20 24 L16 20"/>
    <path d="M25 18 L22 13"/>
    <path d="M112 113 L116 118"/>
  </g>

  <!-- Restrained yellow annotation strokes -->
  <g stroke="#FFD45A" stroke-width="2.8" stroke-linecap="round">
    <path d="M121 81 L125 80"/>
    <path d="M118 92 L123 95"/>
    <path d="M109 106 L114 111"/>
  </g>

  <!-- Tiny hand-sketched motion strokes -->
  <g stroke="#76BC2D" stroke-width="2.1" stroke-linecap="round">
    <path d="M7 43 L3 40"/>
    <path d="M5 54 L1 53"/>
    <path d="M25 109 L21 113"/>
  </g>

</svg>

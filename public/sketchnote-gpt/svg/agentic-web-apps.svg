<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Agentic Web Apps (sketch)</title>

  

  <defs>
    <linearGradient id="agentBlue" x1="15" y1="10" x2="80" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4894FE"/>
      <stop offset=".55" stop-color="#3F87F8"/>
      <stop offset="1" stop-color="#2764E7"/>
    </linearGradient>

    <linearGradient id="webGreen" x1="87" y1="34" x2="94" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4AA647"/>
      <stop offset=".55" stop-color="#318B35"/>
      <stop offset="1" stop-color="#197123"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn agent conversation bubble -->
  <path d="M46 12            C26 12 10 27 9 47            C8 57 11 65 15 72            L10 91            Q9 95 14 94            L34 90            C42 94 52 95 61 92            C82 87 92 70 91 51            C90 30 72 13 51 12            Q48 11 46 12Z" fill="url(#agentBlue)" stroke="#174F85" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>


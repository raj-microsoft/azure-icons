  <!-- Small sketchnote spark -->
  <path d="M112 25            L112 34            M108 29            L116 29" stroke="#FFD34E" stroke-width="3" stroke-linecap="round"/>

  <!-- Yellow hand-drawn emphasis strokes -->
  <path d="M20 102            Q29 106 38 104            M40 110            L46 109" stroke="#FFD34E" stroke-width="3" stroke-linecap="round"/>

  <!-- Agent-to-web connection accent -->

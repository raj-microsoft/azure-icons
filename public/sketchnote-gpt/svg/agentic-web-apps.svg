  <path d="M27 49            C27 45 30 42 34 42            C38 42 41 45 41 49            C41 53 38 56 34 56            C30 56 27 53 27 49Z" fill="#F2F2F2" stroke="#174F85" stroke-width="2.2"/>

  <path d="M46 49            C46 45 49 42 53 42            C57 42 60 45 60 49            C60 53 57 56 53 56            C49 56 46 53 46 49Z" fill="#F2F2F2" stroke="#174F85" stroke-width="2.2"/>

  <path d="M65 49            C65 45 68 42 72 42            C76 42 79 45 79 49            C79 53 76 56 72 56            C68 56 65 53 65 49Z" fill="#F2F2F2" stroke="#174F85" stroke-width="2.2"/>

  <!-- Overlapping web globe -->
  <path d="M90 37            C109 37 122 53 122 73            C122 94 108 112 89 115            C70 117 54 103 51 84            C48 65 59 45 77 39            Q84 36 90 37Z" fill="url(#webGreen)" stroke="#185C2C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Globe longitude curves -->
  <path d="M89 44            C77 50 72 62 72 76            C72 91 78 103 89 110            M92 44            C104 52 108 63 108 76            C108 90 103 103 92 110" stroke="#D8F4D5" stroke-width="2.8" stroke-linecap="round" fill="none"/>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Defender PLC (sketch)</title>
  
  <desc>Hand-drawn Azure Defender programmable logic controller with a blue enclosure, dark control modules, cyan circuit wiring and status indicators.</desc>

  <defs>
    <linearGradient id="plcBlue" x1="8" y1="64" x2="120" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#83B9F9"/>
    </linearGradient>
    <linearGradient id="moduleBlue" x1="64" y1="17" x2="64" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#83B9F9"/>
    </linearGradient>
  </defs>

  <!-- Main PLC enclosure -->
  <path d="M11 7            Q7 7 7 13            L7 115            Q7 121 13 121            L115 121            Q121 121 121 115            L121 13            Q121 7 115 7Z" fill="url(#plcBlue)" stroke="#174E83" stroke-width="3.8"/>

  <!-- Uneven marker-style enclosure highlight -->
  <path d="M14 16 L14 109            Q14 114 20 114            M26 13 L108 13            M115 24 L115 108" stroke="#D5EDFF" stroke-width="2.5" opacity=".7"/>

  <!-- Upper circuit wiring -->
  <path d="M21 33 L21 23            Q21 20 25 20            L106 19            Q110 19 110 23            L110 43" stroke="#9CEBFF" stroke-width="3.4"/>

  <path d="M30 34 L30 29            L101 29            L101 36" stroke="#9CEBFF" stroke-width="2.8"/>

  <!-- Central PLC module -->
  <path d="M37 16            Q37 13 41 13            L87 13            Q91 13 91 17            L91 65            Q91 69 87 69            L41 69            Q37 69 37 65Z" fill="#2A4E77" stroke="#173B60" stroke-width="3.4"/>

  <!-- Inner controller display -->
  <path d="M47 23            Q47 20 50 20            L78 20            Q81 20 81 23            L81 56            Q81 59 78 59            L50 59            Q47 59 47 56Z" fill="url(#moduleBlue)" stroke="#9CEBFF" stroke-width="2.7"/>

  <!-- Display marker highlights -->
  <path d="M52 27 L75 27            M52 33 L70 33            M52 40 L66 40" stroke="#DDF4FF" stroke-width="2.4" opacity=".8"/>

  <!-- Subtle PLC control symbol -->
  <path d="M54 49 L60 44            L65 51            L74 42" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Left vertical control rail -->
  <path d="M19 33            Q19 30 22 30            L27 30            Q30 30 30 34            L30 96            Q30 100 27 100            L22 100            Q19 100 19 96Z" fill="#2A4E77" stroke="#173B60" stroke-width="2.8"/>

  <!-- Right vertical control rail -->
  <path d="M101 38            Q101 35 104 35            L109 35            Q112 35 112 39            L112 96            Q112 100 109 100            L104 100            Q101 100 101 96Z" fill="#2A4E77" stroke="#173B60" stroke-width="2.8"/>

  <!-- Rail highlights -->
  <path d="M23 39 L23 90            M105 44 L105 91" stroke="#7DB6F8" stroke-width="2" opacity=".7"/>

  <!-- Lower PLC connection terminals -->
  <path d="M49 94 L49 102            Q49 105 52 105            L57 105            Q60 105 60 102            L60 94Z" fill="#2A4E77" stroke="#173B60" stroke-width="2.4"/>

  <path d="M69 94 L69 102            Q69 105 72 105            L77 105            Q80 105 80 102            L80 94Z" fill="#2A4E77" stroke="#173B60" stroke-width="2.4"/>

  <!-- Small connector lines -->
  <path d="M54 68 L54 94            M74 68 L74 94" stroke="#9CEBFF" stroke-width="3" opacity=".85"/>

  <!-- Bottom status indicator -->
  <path d="M64 107            C59 107 55 111 55 116            C55 121 59 125 64 125            C69 125 73 121 73 116            C73 111 69 107 64 107Z" fill="#2A4E77" stroke="#173B60" stroke-width="2.8"/>

  <circle cx="64" cy="116" r="3.3" fill="#9CEBFF"/>

  <!-- Marker-style industrial accents -->
  <path d="M33 79 L39 79            M33 86 L41 86            M87 79 L95 79" stroke="#9CEBFF" stroke-width="2.5"/>

  <!-- Restrained yellow sketchnote emphasis -->
  <path d="M5 31 L1 26            M5 42 L1 42            M123 38 L127 33" stroke="#F6C84B" stroke-width="3"/>

  <path d="M92 108 L97 104            M97 114 L103 112" stroke="#F6C84B" stroke-width="2.7"/>

  <!-- Hand-drawn circuit accents -->
  <path d="M38 75 Q44 78 48 75            M80 75 Q86 78 91 75" stroke="#C3F1FF" stroke-width="2.2"/>

  <!-- Tiny marker dots -->
  <circle cx="38" cy="109" r="2" fill="#F6C84B"/>
  <circle cx="91" cy="111" r="2" fill="#9CEBFF"/>
</svg>

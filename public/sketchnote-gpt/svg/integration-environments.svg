  <path d="M43 44 L55 37 L62 49            Q65 54 61 60            L54 65 L43 59 Z" fill="#C4EA8B" stroke="#70A944" stroke-width="2"/>

  <path d="M85 44 L73 37 L66 49            Q63 54 67 60            L74 65 L85 59 Z" fill="#F7CC88" stroke="#D39A42" stroke-width="2"/>


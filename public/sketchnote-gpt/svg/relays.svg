<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title>Relays (sketch)</title>

  
  <desc id="desc">Hand-drawn relay network with three connected nodes, green upper node, purple lower nodes and grey connection terminals.</desc>

  <defs>
    <linearGradient id="relayPurple" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6f4bb2"/>
      <stop offset="1" stop-color="#c69aeb"/>
    </linearGradient>
    <linearGradient id="relayGreen" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#64bd27"/>
      <stop offset="1" stop-color="#9be94d"/>
    </linearGradient>
  </defs>

  <!-- Outer relay terminals -->
  <g fill="#999999" stroke="#777777" stroke-width="1.2" stroke-linejoin="round">
    <path d="M13 10 L24 10 L24 35 Q24 39 20 39 L12 39 Q8 39 8 35 L8 15 Q8 10 13 10Z"/>
    <path d="M104 10 L115 10 Q120 10 120 15 L120 35 Q120 39 116 39 L108 39 Q104 39 104 35Z"/>

    <path d="M8 89 L24 89 L24 116 L12 116 Q8 116 8 112Z"/>
    <path d="M104 89 L120 89 L120 112 Q120 116 116 116 L104 116Z"/>
  </g>

  <!-- Terminal highlights -->
  <g fill="none" stroke="#d5d5d5" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M13 15 L18 15"/>
    <path d="M110 15 L115 15"/>
    <path d="M13 110 L18 110"/>
    <path d="M110 110 L115 110"/>
  </g>

  <!-- Main horizontal relay bus -->
  <path d="M19 31            Q64 29 109 31            L109 97            Q64 99 19 97            Z" fill="none" stroke="#949494" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M19 31 Q64 29 109 31" fill="none" stroke="#c1c1c1" stroke-width="2.2" stroke-linecap="round"/>

  <path d="M19 97 Q64 99 109 97" fill="none" stroke="#c1c1c1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Central triangular connections -->
  <g fill="none" stroke="#888888" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 43 Q52 63 43 83"/>
    <path d="M64 43 Q76 63 85 83"/>
  </g>

  <!-- Connection highlight strokes -->
  <g fill="none" stroke="#c4c4c4" stroke-width="1.7" stroke-linecap="round">
    <path d="M61 49 Q53 66 46 79"/>
    <path d="M67 49 Q76 66 82 79"/>
  </g>

  <!-- Upper relay node -->
  <circle cx="64" cy="43" r="13.2" fill="url(#relayGreen)" stroke="#4f9d22" stroke-width="2.2"/>

  <path d="M56 38 Q61 32 68 35" fill="none" stroke="#c8f49b" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Lower left relay node -->
  <circle cx="43" cy="84" r="13.2" fill="url(#relayPurple)" stroke="#6f4bb2" stroke-width="2.2"/>

  <path d="M35 79 Q40 73 47 76" fill="none" stroke="#e2c8fa" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Lower right relay node -->
  <circle cx="85" cy="84" r="13.2" fill="url(#relayPurple)" stroke="#6f4bb2" stroke-width="2.2"/>

  <path d="M77 79 Q82 73 89 76" fill="none" stroke="#e2c8fa" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Small yellow sketchnote emphasis -->
  <g fill="none" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round">
    <path d="M89 23 Q94 19 99 21"/>
    <path d="M30 104 Q25 108 21 106"/>
    <path d="M102 109 L106 105"/>
  </g>

  <!-- Hand-drawn outline accents -->
  <g fill="none" stroke="#555555" stroke-width="1.2" stroke-linecap="round" opacity=".45">
    <path d="M51 42 Q64 39 77 43"/>
    <path d="M31 83 Q29 91 37 95"/>
    <path d="M76 89 Q84 97 93 89"/>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Load Balancer Hub (sketch)</title>
  
  <desc>Hand-drawn Azure Load Balancer Hub with a layered blue panel, three outward-facing white directional arrows, a circular hub, and the original small green bookmark tab at lower left.</desc>

  <!-- Rear blue frame -->
  <path d="M13 12 L22 3 Q24 1 28 1 L107 1 Q114 1 114 7 L114 100 Q114 103 111 106 L102 114 L19 114 L13 111 Z" fill="#0078D4" stroke="#243447" stroke-width="3.4"/>

  <!-- White offset backing -->
  <path d="M20 13 L27 7 Q29 5 32 5 L104 5 Q108 5 108 9 L108 97 L99 107 L20 107 Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.4"/>

  <!-- Front blue hub panel -->
  <path d="M14 13 Q14 11 17 11 L99 11 Q102 11 102 15 L102 109 Q102 112 99 112 L17 112 Q14 112 14 109 Z" fill="#5EA0EF" stroke="#243447" stroke-width="3.1"/>

  <!-- Three outward load-balancing branches -->
  <g fill="none" stroke="#243447" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 81 L58 36"/>
    <path d="M47 47 L58 36 L69 47"/>
    <path d="M53 81 Q51 75 45 69 L35 59"/>
    <path d="M35 70 L35 59 L46 59"/>
    <path d="M63 81 Q65 75 71 69 L81 59"/>
    <path d="M70 59 L81 59 L81 70"/>
  </g>

  <g fill="none" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 81 L58 36"/>
    <path d="M47 47 L58 36 L69 47"/>
    <path d="M53 81 Q51 75 45 69 L35 59"/>
    <path d="M35 70 L35 59 L46 59"/>
    <path d="M63 81 Q65 75 71 69 L81 59"/>
    <path d="M70 59 L81 59 L81 70"/>
  </g>

  <!-- Circular central hub, open centre -->
  <path d="M69 91 C69 97 64 102 58 102 C52 102 47 97 47 91 C47 85 52 80 58 80 C64 80 69 85 69 91 Z" fill="#5EA0EF" stroke="#243447" stroke-width="4"/>

  <path d="M65.5 91 C65.5 95 62 98.5 58 98.5 C54 98.5 50.5 95 50.5 91 C50.5 87 54 83.5 58 83.5 C62 83.5 65.5 87 65.5 91 Z" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>

  <!-- Small green bookmark tab at lower left -->
  <path d="M26 103 Q26 101 28 101 L42 101 Q44 101 44 103 L44 122 L35 116 L26 123 Z" fill="#86D633" stroke="#243447" stroke-width="2.7"/>

  <!-- Folded green lower section -->
  <path d="M35 116 L44 109 L44 122 Z" fill="#76BC2D" stroke="#243447" stroke-width="2.1"/>

  <!-- Restrained yellow marker accents -->
  <g stroke="#F4C542" stroke-width="2.6">
    <path d="M75 27 L80 23"/>
    <path d="M85 33 L91 32"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Azure Orbital (sketch)</title>

  
  <desc>Hand-drawn Azure Orbital satellite with a diagonal blue structural beam, an upper-right connector panel, a central cyan module, a lower-left tapered solar panel, a small circular sensor, and two curved signal arcs inside a pale gray orbital ring. Flat fills and irregular dark marker outlines on a transparent background.</desc>

  <!-- Pale gray planetary orbit -->
  <path d="     M65 125     C94 125 119 104 124 75     C129 48 115 21 91 10     C66 -2 36 4 20 26     C10 39 5 53 6 65" stroke="#B9B9B9" stroke-width="5.2"/>

  <!-- Short lower-left orbital signal arc -->
  <path d="     M13 94     C12 105 20 115 30 117     Q33 118 35 117" stroke="#AFAFAF" stroke-width="4.5"/>

  <!-- Larger lower-left orbital signal arc -->
  <path d="     M4 96     C3 113 16 126 33 126" stroke="#AFAFAF" stroke-width="4.5"/>

  <!-- Main diagonal satellite structural beam -->
  <path d="     M35 15     Q38 12 41 15     L115 89     Q118 92 115 95     L101 109     Q98 112 95 109     L21 35     Q18 32 21 29Z" fill="#0078D4" stroke="#30343D" stroke-width="3.7"/>

  <!-- Upper-right satellite connector panel -->
  <path d="     M79 41     L88 32     Q90 30 92 32     L101 41     Q103 43 101 45     L92 54Z" fill="#005BA1" stroke="#30343D" stroke-width="3"/>

  <!-- Narrow diagonal structural cross-brace -->
  <path d="     M46 70     L51 65     L84 98     L79 103Z" fill="#005BA1" stroke="#30343D" stroke-width="2.7"/>

  <!-- Lower-left tapered solar panel -->
  <path d="     M46 61     L69 84     L62 101     Q60 106 55 104     L26 76     Q22 72 27 69Z" fill="#368EE2" stroke="#30343D" stroke-width="3.6"/>

  <!-- Solar panel divisions -->
  <path d="     M37 65 L63 91     M29 76 L56 102     M48 74 L34 84     M59 86 L45 97" stroke="#30343D" stroke-width="2.2"/>

  <!-- Central cyan satellite module -->
  <path d="     M62 38     Q65 35 68 38     L92 62     Q95 65 92 68     L73 87     L43 57     Q40 54 43 51Z" fill="#50E6FF" stroke="#30343D" stroke-width="3.7"/>

  <!-- Small lower sensor connector -->
  <path d="     M39 86     L32 93     L26 87     L33 80Z" fill="#005BA1" stroke="#30343D" stroke-width="2.8"/>

  <!-- Circular communication sensor -->
  <path d="     M30 89     C35 89 39 93 39 98     C39 103 35 107 30 107     C25 107 21 103 21 98     C21 93 25 89 30 89Z" fill="#50E6FF" stroke="#30343D" stroke-width="3.2"/>

</svg>

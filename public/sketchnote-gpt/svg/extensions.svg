<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Extensions (sketch)</title>
  
  <desc>Hand-drawn Azure Extensions icon featuring a grey open square frame, purple upper-right corner, and cyan central square, with uneven marker outlines and a transparent background.</desc>

  <defs>
    <linearGradient id="cyanFill" x1="34" y1="43" x2="88" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".55" stop-color="#32CAEA"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="purpleFill" x1="67" y1="5" x2="121" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Outer grey extension frame -->
  <path d="M59 18            L9 18            Q5 18 5 23            L5 118            Q5 122 10 122            L109 122            Q113 122 113 117            L113 72            Q113 69 110 69            L102 69            Q99 69 99 73            L99 108            L19 108            L19 31            L59 31            Q62 31 62 28            L62 21            Q62 18 59 18Z" fill="#B3B3B3" stroke="#737373" stroke-width="3.4"/>

  <!-- Subtle grey marker highlights -->
  <path d="M11 32 L11 111            Q11 116 17 116            L92 116" stroke="#E5E5E5" stroke-width="2.6" opacity=".9"/>

  <path d="M23 25 L51 25            M106 80 L106 102" stroke="#E5E5E5" stroke-width="2.3" opacity=".75"/>

  <!-- Upper-right purple corner extension -->
  <path d="M69 6            Q67 6 67 10            L67 17            Q67 20 71 20            L106 20            Q110 20 110 24            L110 61            Q110 64 113 64            L121 64            Q124 64 124 61            L124 10            Q124 6 120 6Z" fill="url(#purpleFill)" stroke="#5426A0" stroke-width="3.6"/>

  <!-- Purple marker stroke details -->
  <path d="M74 12            L115 12            Q118 12 118 16            L118 50" stroke="#D4BCFF" stroke-width="2.8" opacity=".9"/>

  <path d="M114 27 L114 45" stroke="#5D2BAE" stroke-width="2" opacity=".55"/>

  <!-- Central cyan extension tile -->
  <path d="M33 44            Q33 42 37 42            L84 42            Q87 42 87 46            L87 93            Q87 97 83 97            L36 97            Q32 97 32 93            Z" fill="url(#cyanFill)" stroke="#147EAA" stroke-width="3.5"/>

  <!-- Cyan tile hand-drawn inset -->
  <path d="M39 50            Q39 48 42 48            L78 48            M80 54 L80 85            Q80 89 76 89" stroke="#A5F2FF" stroke-width="2.7" opacity=".9"/>

  <!-- Fine informal sketch hatching -->
  <path d="M41 85 L47 79            M41 92 L51 82            M73 53 L78 48" stroke="#16A8D4" stroke-width="2" opacity=".55"/>

  <!-- Small hand-inked corner accents -->
  <path d="M25 38 L25 44            M94 99 L94 104" stroke="#737373" stroke-width="2.2" opacity=".65"/>

  <!-- Subtle sketchnote emphasis marks -->
  <path d="M55 36 L55 32            M64 36 L66 31            M91 39 L96 35" stroke="#0078D4" stroke-width="2.4"/>

  <path d="M99 7 L101 2            M126 25 L128 22" stroke="#A67AF4" stroke-width="2.1"/>

  <!-- Restrained yellow hand-drawn sparkle -->
  <path d="M94 49 L94 55            M91 52 L97 52" stroke="#FFBD02" stroke-width="2.4"/>

  <!-- Slightly irregular outline accents -->
  <path d="M7 52 L7 70            M29 120 L44 120            M115 77 L115 86" stroke="#737373" stroke-width="1.7" opacity=".65"/>
</svg>

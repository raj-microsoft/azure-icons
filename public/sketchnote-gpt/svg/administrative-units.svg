<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Administrative Units (sketch)</title>
  
  <desc>Three overlapping Azure-blue member silhouettes inside a hand-drawn dashed administrative boundary.</desc>

  <defs>
    <linearGradient id="auFront" x1="26" y1="48" x2="83" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#83B9F9"/>
      <stop offset="1" stop-color="#5EA0EF"/>
    </linearGradient>
    <linearGradient id="auMiddle" x1="58" y1="39" x2="106" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="auBack" x1="78" y1="45" x2="118" y2="93" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn administrative boundary -->
  <path d="M9 27 L9 10 Q9 8 12 9 L27 9            M37 9 L51 9            M61 9 L75 9            M85 9 L99 9            M109 9 L117 9 Q120 9 119 13 L119 25            M119 35 L119 49            M119 59 L119 73            M119 83 L119 97            M119 107 L119 116 Q119 119 116 119 L105 119            M95 119 L81 119            M71 119 L57 119            M47 119 L33 119            M23 119 L12 119 Q9 119 9 116 L9 105            M9 95 L9 81            M9 71 L9 57            M9 47 L9 37" stroke="#0078D4" stroke-width="3.2"/>

  <!-- Back member: head -->
  <path d="M88 40            C88 32 94 27 101 28            C109 29 113 35 112 42            C111 49 106 53 100 53            C93 53 88 48 88 40 Z" fill="url(#auBack)" stroke="#004C87" stroke-width="2.7"/>

  <!-- Back member: shoulders -->
  <path d="M94 53            C82 56 77 65 76 84            Q76 89 81 90            L115 90            Q119 89 118 84            C117 68 111 57 105 54            Q100 58 94 53 Z" fill="url(#auBack)" stroke="#004C87" stroke-width="2.7"/>

  <!-- Middle member: head -->
  <path d="M59 41            C59 31 67 24 76 25            C85 26 91 33 90 42            C89 51 83 57 75 57            C66 57 59 50 59 41 Z" fill="url(#auMiddle)" stroke="#005BA1" stroke-width="2.9"/>

  <!-- Middle member: shoulders -->
  <path d="M69 57            C54 60 48 72 46 96            Q46 102 52 103            L99 103            Q105 102 104 96            C102 75 95 62 82 58            Q76 62 69 57 Z" fill="url(#auMiddle)" stroke="#005BA1" stroke-width="2.9"/>

  <!-- Front member: head -->
  <path d="M28 43            C28 31 37 22 49 22            C61 23 70 32 69 44            C68 56 60 65 48 65            C36 65 27 55 28 43 Z" fill="url(#auFront)" stroke="#1769AD" stroke-width="3.3"/>

  <!-- Front member: main silhouette -->
  <path d="M40 65            C24 68 17 80 15 106            Q14 113 21 113            L76 113            Q83 112 82 105            C79 82 71 70 57 65            Q49 71 40 65 Z" fill="url(#auFront)" stroke="#1769AD" stroke-width="3.3"/>

  <!-- White collar detail -->
  <path d="M40 66            Q48 72 57 66            L49 94 Z" fill="#FFFFFF" opacity=".88"/>

  <path d="M43 70 L49 83 L54 70" stroke="#D7ECFF" stroke-width="2.2"/>

  <!-- Sketch highlights on foreground head -->
  <path d="M35 39            Q38 30 47 29" stroke="#D9EEFF" stroke-width="3" opacity=".9"/>

  <path d="M33 47 Q35 56 41 58" stroke="#D5E9FF" stroke-width="2" opacity=".65"/>

  <!-- Subtle hand-drawn shoulder highlights -->
  <path d="M26 85            Q22 92 22 101" stroke="#C7E4FF" stroke-width="2.8"/>

  <path d="M71 86            Q75 94 75 103" stroke="#D6ECFF" stroke-width="2.2" opacity=".7"/>

  <!-- Azure-blue marker texture strokes -->
  <path d="M35 104 L42 104            M56 105 L62 105" stroke="#0078D4" stroke-width="2" opacity=".4"/>

  <!-- Yellow sketchnote accent -->
  <path d="M103 16 L103 23            M99.5 19.5 L106.5 19.5" stroke="#E8BD45" stroke-width="2.8"/>

  <!-- Small handwritten-style annotation marks -->
  <path d="M84 17 L88 14            M90 20 L95 19" stroke="#0078D4" stroke-width="2" opacity=".65"/>

  <!-- Administrative grouping emphasis -->
  <path d="M14 15 L18 15            M15 18 L15 22" stroke="#E8BD45" stroke-width="2.3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Table (sketch)</title>
  
  <desc>Azure Table Storage icon with a blue rectangular enclosure, dark blue header, and a three-by-three grid of white and yellow data cells, illustrated with uneven marker outlines.</desc>

  <defs>
    <linearGradient id="tableBlue" x1="64" y1="40" x2="64" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".5" stop-color="#4093E6"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Main Azure-blue table enclosure -->
  <path d="M8 40            L120 40            L120 108            Q120 115 113 115            L15 116            Q8 116 8 109 Z" fill="url(#tableBlue)" stroke="#155C9A" stroke-width="3.5"/>

  <!-- Dark blue top header -->
  <path d="M15 14            L113 14            Q120 14 120 21            L120 40            L8 40            L8 21            Q8 14 15 14 Z" fill="#0078D4" stroke="#155C9A" stroke-width="3.5"/>

  <!-- Loose marker highlights on header -->
  <path d="M17 20 Q62 19 109 20            M15 25 L15 34" stroke="#9BD3FF" stroke-width="2.2" opacity=".85"/>

  <!-- Sketchy header separator -->
  <path d="M12 43 Q64 44 116 42" stroke="#1267A8" stroke-width="2" opacity=".7"/>

  <!-- Row 1: white data cells -->
  <path d="M22 49            L43 49            Q46 49 46 52            L46 61            Q46 64 43 64            L22 64            Q19 64 19 61            L19 52            Q19 49 22 49 Z" fill="#FFFFFF" fill-opacity=".92" stroke="#2C83C4" stroke-width="2"/>

  <path d="M53 49            L74 49            Q77 49 77 52            L77 61            Q77 64 74 64            L53 64            Q50 64 50 61            L50 52            Q50 49 53 49 Z" fill="#FFFFFF" fill-opacity=".92" stroke="#2C83C4" stroke-width="2"/>

  <path d="M84 49            L105 49            Q108 49 108 52            L108 61            Q108 64 105 64            L84 64            Q81 64 81 61            L81 52            Q81 49 84 49 Z" fill="#FFFFFF" fill-opacity=".92" stroke="#2C83C4" stroke-width="2"/>

  <!-- Row 2: white and yellow cells -->
  <path d="M22 69            L43 69            Q46 69 46 72            L46 81            Q46 84 43 84            L22 84            Q19 84 19 81            L19 72            Q19 69 22 69 Z" fill="#FFFFFF" fill-opacity=".92" stroke="#2C83C4" stroke-width="2"/>

  <path d="M53 69            L74 69            Q77 69 77 72            L77 81            Q77 84 74 84            L53 84            Q50 84 50 81            L50 72            Q50 69 53 69 Z" fill="#FFD400" stroke="#B38D00" stroke-width="2"/>

  <path d="M84 69            L105 69            Q108 69 108 72            L108 81            Q108 84 105 84            L84 84            Q81 84 81 81            L81 72            Q81 69 84 69 Z" fill="#FFD400" stroke="#B38D00" stroke-width="2"/>

  <!-- Row 3: yellow data cells -->
  <path d="M22 89            L43 89            Q46 89 46 92            L46 101            Q46 104 43 104            L22 104            Q19 104 19 101            L19 92            Q19 89 22 89 Z" fill="#FFD400" stroke="#B38D00" stroke-width="2"/>

  <path d="M53 89            L74 89            Q77 89 77 92            L77 101            Q77 104 74 104            L53 104            Q50 104 50 101            L50 92            Q50 89 53 89 Z" fill="#FFD400" stroke="#B38D00" stroke-width="2"/>

  <path d="M84 89            L105 89            Q108 89 108 92            L108 101            Q108 104 105 104            L84 104            Q81 104 81 101            L81 92            Q81 89 84 89 Z" fill="#FFD400" stroke="#B38D00" stroke-width="2"/>

  <!-- Hand-drawn cell highlights -->
  <path d="M24 53 L40 53            M55 53 L71 53            M86 53 L102 53            M24 73 L40 73" stroke="#DCEFFF" stroke-width="1.6" opacity=".9"/>

  <path d="M55 73 L71 73            M86 73 L102 73            M24 93 L40 93            M55 93 L71 93            M86 93 L102 93" stroke="#FFF3A0" stroke-width="1.7" opacity=".85"/>

  <!-- Subtle marker strokes along enclosure -->
  <path d="M14 49 L14 104            M114 49 L114 104" stroke="#B0DCFF" stroke-width="2" opacity=".65"/>

  <!-- Restrained sketchnote accents -->
  <path d="M111 7 L111 11            M106 9 L103 6            M117 9 L120 6" stroke="#FFD400" stroke-width="2.4"/>

  <!-- Small exterior hand-drawn marks -->
  <path d="M3 57 L6 54            M3 65 L6 63            M122 83 L125 80" stroke="#0078D4" stroke-width="2.1"/>

  <!-- Bottom-right marker flourish -->
  <path d="M108 119 Q113 118 116 115" stroke="#FFD400" stroke-width="2.3"/>

</svg>

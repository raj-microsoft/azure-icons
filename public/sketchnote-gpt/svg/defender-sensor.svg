<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Defender Sensor (sketch)</title>
  
  <desc>Hand-drawn Azure Defender Sensor featuring a layered blue sensor appliance, cyan telemetry lines and a glowing status indicator.</desc>

  <defs>
    <linearGradient id="sensorTop" x1="21" y1="18" x2="104" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset=".48" stop-color="#3C91E5"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="sensorFront" x1="13" y1="46" x2="83" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064984"/>
      <stop offset="1" stop-color="#003067"/>
    </linearGradient>
  </defs>

  <!-- Uneven hand-drawn sensor body -->
  <path d="M12 46            L64 24            Q68 22 73 24            L115 41            Q120 43 115 47            L77 65            Q70 69 63 66            L13 49            Q9 48 12 46Z" fill="url(#sensorTop)" stroke="#07528F" stroke-width="3.2"/>

  <!-- Subtle marker highlight on top -->
  <path d="M23 44            L65 27            Q69 26 73 28            L103 40" stroke="#B5E8FF" stroke-width="2.6" opacity=".75"/>

  <path d="M12 48            L63 67            Q70 70 77 66            L116 47            L117 89            Q117 92 113 94            L78 110            Q71 114 64 111            L15 92            Q12 91 12 87Z" fill="#003067" stroke="#052D60" stroke-width="3.6"/>

  <!-- Front-facing shaded panel -->
  <path d="M13 50            L63 69            Q69 72 76 69            L77 109            Q70 113 64 110            L15 91            Q12 90 13 86Z" fill="url(#sensorFront)"/>

  <!-- Side panel hand-drawn edge -->
  <path d="M77 68            Q78 88 77 109            M115 50            L116 88            Q116 91 112 93" stroke="#1675BB" stroke-width="2.6"/>

  <!-- Sketchy rim -->
  <path d="M16 53            L63 70            Q71 73 78 69            L112 52" stroke="#66C9FF" stroke-width="1.8" stroke-dasharray="34 5 17 4" opacity=".65"/>

  <!-- Sensor telemetry lines -->
  <g stroke="#32B0E7" stroke-width="3.2">
    <path d="M23 67 L40 73"/>
    <path d="M23 75 L40 81"/>
    <path d="M23 83 L40 89"/>
    <path d="M46 76 L65 83"/>
    <path d="M46 84 L65 91"/>
    <path d="M46 92 L65 99"/>
  </g>

  <!-- Loose marker accents for telemetry -->
  <g stroke="#50E6FF" stroke-width="1.2" opacity=".75">
    <path d="M25 65 L39 70"/>
    <path d="M48 74 L63 79"/>
    <path d="M25 81 L37 85"/>
  </g>

  <!-- Cyan sensor status indicator -->
  <path d="M99 68            C102 65 106 65 107 68            C108 72 105 77 101 79            C97 81 94 78 95 74            Q96 71 99 68Z" fill="#50E6FF" stroke="#0877AF" stroke-width="2.5"/>

  <path d="M99 70 Q102 68 104 69" stroke="#E1FBFF" stroke-width="2"/>

  <!-- Hand-drawn sensing waves -->
  <g stroke="#32B0E7" fill="none" stroke-width="2.5" opacity=".9">
    <path d="M90 64 Q85 74 89 84"/>
    <path d="M85 60 Q77 74 84 90"/>
  </g>

  <!-- Tiny sketchnote emphasis strokes -->
  <g stroke="#F4C542" stroke-width="2.8">
    <path d="M96 18 L94 11"/>
    <path d="M105 21 L110 15"/>
    <path d="M111 29 L119 27"/>
  </g>

  <!-- Subtle handwritten marker details -->
  <g stroke="#0078D4" stroke-width="2" opacity=".7">
    <path d="M20 100 Q43 110 57 116"/>
    <path d="M83 114 Q98 109 111 101"/>
  </g>

  <!-- Small sketch sparkle -->
  <path d="M19 24 L21 29 L26 31 L21 33 L19 38 L17 33 L12 31 L17 29Z" fill="#F4C542" stroke="#C48B17" stroke-width="1.4"/>

</svg>

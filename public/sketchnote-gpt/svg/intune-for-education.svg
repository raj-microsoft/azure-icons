<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Intune For Education (sketch)</title>
  
  <desc>Azure-blue desktop monitor with a connected cyan mobile device, circular connection node and blue transfer arrow, illustrated with uneven marker strokes.</desc>

  <defs>
    <linearGradient id="monitorBlue" x1="45" y1="9" x2="45" y2="81" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="0.82" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#0067B8"/>
    </linearGradient>
    <linearGradient id="standBlue" x1="45" y1="80" x2="45" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F56A3"/>
      <stop offset="1" stop-color="#1490DF"/>
    </linearGradient>
    <linearGradient id="connectionGlow" x1="45" y1="35" x2="45" y2="57" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0FFFD"/>
      <stop offset="1" stop-color="#D2EBFF"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn desktop monitor frame -->
  <path d="M8 10            Q5 10 5 14            L5.5 78            Q6 82 10 82            L102 82            Q106 82 106 78            L105.5 14            Q105 10 101 10            Z" fill="url(#monitorBlue)" stroke="#005A9E" stroke-width="3.4"/>

  <!-- White display area -->
  <path d="M12 17            Q12 16 14 16            L97 16.5            Q99 16.5 99 19            L99 73            Q99 75 97 75            L14 75            Q12 75 12 73            Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.2"/>

  <!-- Sketchy monitor highlight -->
  <path d="M9 20 L9 40" stroke="#A6D9FF" stroke-width="2.3"/>
  <path d="M19 13 L42 13" stroke="#A6D9FF" stroke-width="2"/>

  <!-- Monitor stand -->
  <path d="M37 82            L57 82            Q56 93 60 100            Q62 103 67 104            L67 109            L27 109            L27 104            Q33 103 35 99            Q38 93 37 82            Z" fill="url(#standBlue)" stroke="#005A9E" stroke-width="3"/>

  <!-- Stand base -->
  <path d="M25 104            Q24 104 23 107            L21 112            L72 112            L70 107            Q69 104 66 104" fill="#1490DF" stroke="#005A9E" stroke-width="3"/>

  <path d="M31 108 L62 108" stroke="#7CC8FF" stroke-width="2"/>

  <!-- Connection line -->
  <path d="M58 46            Q70 44 81 46            L112 46" stroke="#32BEDD" stroke-width="7"/>
  <path d="M65 43 Q84 42 104 43" stroke="#0078D4" stroke-width="2.3"/>

  <!-- Circular Intune connection node -->
  <circle cx="58" cy="46" r="12" fill="#FFFFFF" stroke="#32BEDD" stroke-width="4"/>

  <circle cx="58" cy="46" r="8.3" fill="url(#connectionGlow)" stroke="#0078D4" stroke-width="2"/>

  <path d="M54 46 L62 46 M58 42 L58 50" stroke="#5EA0EF" stroke-width="1.8" opacity=".8"/>

  <!-- Cyan mobile device -->
  <path d="M79 43            Q79 40 83 40            L120 40            Q123 40 123 44            L123 117            Q123 121 119 121            L83 121            Q79 121 79 117            Z" fill="#32BEDD" stroke="#087EAA" stroke-width="3.4"/>

  <!-- Mobile device screen -->
  <path d="M85 47            L117 47            L117 111            L85 111            Z" fill="#FFFFFF" stroke="#087EAA" stroke-width="2"/>

  <!-- Mobile screen marker detail -->
  <path d="M88 50 L88 67" stroke="#D3F7FF" stroke-width="2.3"/>

  <!-- Azure-blue transfer arrow -->
  <path d="M82 78            L101 78            L101 73            Q101 71 103 73            L113 82            Q115 84 113 86            L103 96            Q101 98 101 95            L101 90            L82 90            Z" fill="#0078D4" stroke="#005A9E" stroke-width="2.2"/>

  <path d="M88 82 L101 82" stroke="#8DD5FF" stroke-width="2.2"/>

  <!-- Mobile speaker and home indicator -->
  <path d="M96 44 L106 44" stroke="#E7FCFF" stroke-width="2.2"/>

  <path d="M98 116 L105 116" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Subtle yellow sketchnote accents -->
  <path d="M65 28 L69 20" stroke="#FFCA00" stroke-width="2.8"/>

  <path d="M73 33 L81 29" stroke="#FFCA00" stroke-width="2.8"/>

  <path d="M47 26 L45 20" stroke="#FFCA00" stroke-width="2.5"/>

  <!-- Small handwritten-style annotation marks -->
  <path d="M21 58            Q28 54 35 57            M23 63 L33 63" stroke="#5EA0EF" stroke-width="2" opacity=".7"/>
</svg>

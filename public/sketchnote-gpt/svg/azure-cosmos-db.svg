<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Azure Cosmos DB (sketch)</title>
  
  <desc id="desc">Hand-drawn blue cosmic planet with white cloud shapes, a bright cyan orbital ring, and sparkling stars.</desc>

  <defs>
    <radialGradient id="planet-blue" cx="42%" cy="35%" r="75%">
      <stop offset="0.18" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>

    <clipPath id="planet-clip">
      <path d="M65 22                C88 21 105 39 107 60                C110 85 92 105 69 108                C45 111 24 94 22 70                C20 46 39 24 65 22Z"/>
    </clipPath>
  </defs>

  <!-- Cyan sketchnote star, upper left -->
  <path d="M22 7            Q24 20 36 22            Q24 24 22 37            Q20 24 8 22            Q20 20 22 7Z" fill="#50E6FF" stroke="#078DBB" stroke-width="2.2"/>

  <path d="M22 14 L22 29 M15 22 L29 22" stroke="#E9FCFF" stroke-width="1.5"/>

  <!-- Planet: original Azure-blue palette -->
  <path d="M65 22            C88 21 105 39 107 60            C110 85 92 105 69 108            C45 111 24 94 22 70            C20 46 39 24 65 22Z" fill="url(#planet-blue)" stroke="#145B92" stroke-width="3.3"/>

  <!-- Organic cloud-like planetary markings -->
  <g clip-path="url(#planet-clip)">

    <!-- Lower-left cloud mass -->
    <path d="M18 61              L32 61              C37 60 41 64 42 69              C48 68 54 73 54 80              C54 86 49 91 43 92              L31 92              Q20 81 18 61Z" fill="#F2F2F2" stroke="#D4E5F0" stroke-width="1.8"/>

    <!-- Upper-right cloud mass -->
    <path d="M111 40              L99 40              C94 34 84 35 81 42              C74 40 68 45 68 52              C68 59 74 64 81 64              L99 64              Q107 54 111 40Z" fill="#F2F2F2" stroke="#D4E5F0" stroke-width="1.8"/>

    <!-- Freehand cloud contour details -->
    <g stroke="#C4D7E8" stroke-width="1.6">
      <path d="M28 69 Q35 65 39 72"/>
      <path d="M36 84 Q43 86 47 80"/>
      <path d="M77 49 Q81 43 87 46"/>
      <path d="M88 57 Q96 60 101 55"/>
    </g>

    <!-- Gentle planet highlights -->
    <path d="M39 44              Q48 32 63 30" stroke="#B9E4FF" stroke-width="3" opacity=".75"/>

    <path d="M75 99              Q91 94 98 79" stroke="#005AAB" stroke-width="2.5" opacity=".6"/>

    <!-- Tiny hand-drawn surface strokes -->
    <g stroke="#B9E4FF" stroke-width="2" opacity=".8">
      <path d="M47 48 L52 44"/>
      <path d="M55 43 L59 40"/>
      <path d="M77 87 L82 84"/>
    </g>
  </g>

  <!-- Cosmic orbital ring: rear upper arc -->
  <path d="M31 51            C52 31 89 15 109 18            C117 19 121 23 121 30            C121 40 112 52 99 64" stroke="#078DBB" stroke-width="7" opacity=".16"/>

  <path d="M76 28            C91 21 105 19 111 23            C119 28 112 40 103 50" stroke="#50E6FF" stroke-width="5.2"/>

  <!-- Orbital ring: sweeping foreground arc -->
  <path d="M107 51            C95 66 78 80 58 91            C35 104 14 111 7 103            C1 96 10 80 25 66" stroke="#087DAA" stroke-width="9" opacity=".24"/>

  <path d="M107 51            C95 66 78 80 58 91            C35 104 14 111 7 103            C1 96 10 80 25 66" stroke="#50E6FF" stroke-width="6.5"/>

  <!-- Imperfect marker accent on orbit -->
  <path d="M19 95            Q36 96 59 83" stroke="#C5F8FF" stroke-width="1.8" stroke-dasharray="3 7" opacity=".9"/>

  <!-- Small orbital motion strokes -->
  <g stroke="#50E6FF" stroke-width="2.5">
    <path d="M10 78 L6 83"/>
    <path d="M13 73 L10 76"/>
    <path d="M109 43 L113 38"/>
  </g>

  <!-- Cyan sketchnote star, lower right -->
  <path d="M111 95            Q113 106 123 108            Q113 110 111 122            Q109 110 99 108            Q109 106 111 95Z" fill="#50E6FF" stroke="#078DBB" stroke-width="2.1"/>

  <path d="M111 101 L111 115            M104 108 L118 108" stroke="#E9FCFF" stroke-width="1.4"/>

  <!-- Restrained yellow handwritten accents -->
  <g stroke="#FFCC4D" stroke-width="2.6">
    <path d="M92 14 L95 9"/>
    <path d="M100 15 L104 12"/>
    <path d="M13 45 L8 42"/>
    <path d="M11 52 L5 51"/>
  </g>

  <!-- Tiny hand-drawn cosmic twinkles -->
  <g stroke="#50E6FF" stroke-width="2">
    <path d="M53 12 L53 19"/>
    <path d="M50 15.5 L56 15.5"/>
    <path d="M89 116 L89 122"/>
    <path d="M86 119 L92 119"/>
  </g>

  <!-- Yellow orbit highlight -->
  <path d="M62 90            Q72 84 80 77" stroke="#FFCC4D" stroke-width="2.4" stroke-dasharray="2 7" opacity=".9"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Intune App Protection (sketch)</title>
  
  <desc>Azure-blue desktop monitor linked by a cyan protection connector to a mobile device with an inward blue application arrow, illustrated with uneven marker strokes.</desc>

  <defs>
    <linearGradient id="monitorBlue" x1="8" y1="12" x2="106" y2="83" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="standBlue" x1="44" y1="83" x2="60" y2="113" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F56A3"/>
      <stop offset="1" stop-color="#1490DF"/>
    </linearGradient>
    <linearGradient id="phoneCyan" x1="79" y1="42" x2="121" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Desktop monitor: irregular hand-inked silhouette -->
  <path d="M10 13            Q10 10 14 10            L102 11            Q106 11 106 15            L105 79            Q105 83 101 83            L13 82            Q9 82 9 78            Z" fill="url(#monitorBlue)" stroke="#075A9C" stroke-width="3.6"/>

  <!-- White monitor display -->
  <path d="M16 18            L99 18            L99 74            Q99 76 97 76            L17 75            Q15 75 15 73            Z" fill="#FFFFFF" stroke="#D2EBFF" stroke-width="2.3"/>

  <!-- Loose blue marker highlight -->
  <path d="M20 22 L20 42            M22 70 L42 70" stroke="#B9DDF8" stroke-width="2" opacity=".8"/>

  <!-- Monitor stand -->
  <path d="M45 83            L64 83            Q63 94 66 101            Q68 105 74 106            L75 112            L35 112            L36 107            Q44 105 45 98            Z" fill="url(#standBlue)" stroke="#174D8B" stroke-width="3.2"/>

  <!-- Stand base -->
  <path d="M32 112            Q33 108 38 108            L72 108            Q78 108 79 113            L80 116            L30 116            Z" fill="#1490DF" stroke="#174D8B" stroke-width="3.2"/>

  <!-- Desktop-to-phone circular connection -->
  <path d="M57 43            C49 41 44 47 45 53            C46 60 54 64 60 60            C65 57 66 50 62 46            Q60 44 57 43Z" fill="#F0FFFD" stroke="#32BEDD" stroke-width="3.3"/>

  <!-- Central connection dot -->
  <path d="M53 51            Q56 48 59 51            Q61 54 58 57            Q54 59 52 55            Q51 53 53 51Z" fill="#D2EBFF" stroke="#5EA0EF" stroke-width="1.5"/>

  <!-- Cyan link to mobile device -->
  <path d="M65 53            Q75 52 85 53" stroke="#0078D4" stroke-width="6"/>

  <path d="M68 51 L80 51" stroke="#50E6FF" stroke-width="2" opacity=".85"/>

  <!-- Mobile device -->
  <path d="M83 44            Q83 40 87 40            L119 41            Q123 41 123 45            L122 117            Q122 121 118 121            L87 120            Q83 120 83 116            Z" fill="url(#phoneCyan)" stroke="#087C9C" stroke-width="3.7"/>

  <!-- Phone screen -->
  <path d="M89 48            L116 48            L116 108            L89 108            Q88 108 88 106            L88 50            Q88 48 89 48Z" fill="#FFFFFF" stroke="#D0F5FA" stroke-width="2.2"/>

  <!-- Small phone home indicator -->
  <path d="M99 114            Q103 113 107 114" stroke="#087C9C" stroke-width="2.4"/>

  <!-- Application protection / transfer arrow -->
  <path d="M91 77            L104 77            L104 70            Q104 68 106 70            L114 78            Q116 80 114 82            L106 90            Q104 92 104 89            L104 84            L91 84            Z" fill="#0078D4" stroke="#075A9C" stroke-width="2.1"/>

  <!-- Hand-drawn emphasis -->
  <path d="M107 29 L110 23            M115 32 L121 28" stroke="#F7C948" stroke-width="3.2"/>

  <path d="M72 34 L76 30            M75 39 L81 37" stroke="#F7C948" stroke-width="2.5"/>

  <!-- Subtle sketch marks -->
  <path d="M15 87 L20 90            M24 87 L28 89" stroke="#5EA0EF" stroke-width="2" opacity=".8"/>
</svg>

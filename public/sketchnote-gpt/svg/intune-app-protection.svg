<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Intune App Protection (sketch)</title>
  <defs>
    <linearGradient id="device-blue" x1="8.05" y1="11.32" x2="8.05" y2="1.26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset=".82" stop-color="#5ea0ef"/>
    </linearGradient>
    <linearGradient id="stand-blue" x1="8.05" y1="15.21" x2="8.05" y2="11.32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1490df"/>
      <stop offset=".98" stop-color="#1f56a3"/>
    </linearGradient>
    <linearGradient id="connection-white" x1="8.05" y1="7.87" x2="8.05" y2="4.94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d2ebff"/>
      <stop offset="1" stop-color="#f0fffd"/>
    </linearGradient>
  </defs>

  <g transform="scale(7.111111)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Original large desktop monitor -->
    <rect x=".5" y="1.26" width="15.1" height="10.06" rx=".5" fill="url(#device-blue)" stroke="#247ec2" stroke-width=".09"/>

    <!-- Monitor display -->
    <rect x="1.34" y="2.1" width="13.42" height="8.39" rx=".28" fill="#fff"/>

    <!-- Original monitor stand -->
    <path d="M11.08 14.37       C9.58 14.14 9.52 13.06 9.53 11.37       H6.53       C6.53 13.11 6.47 14.19 4.98 14.37       A.87 .87 0 0 0 4.24 15.21       H11.78       A.88 .88 0 0 0 11.08 14.37 Z" fill="url(#stand-blue)"/>

    <!-- Original phone-shaped protection device -->
    <path d="M17.17 5.91       H10.29       A2.31 2.31 0 1 0 10.29 6.83       H11       V16.41       A.33 .33 0 0 0 11.33 16.74       H17.16       A.33 .33 0 0 0 17.49 16.41       V6.24       A.33 .33 0 0 0 17.17 5.91 Z" fill="#32bedd" stroke="#169fbd" stroke-width=".08"/>

    <!-- Phone screen -->
    <rect x="11.62" y="6.82" width="5.27" height="8.7" rx=".12" fill="#fff"/>

    <!-- Original large circular connection symbol -->
    <circle cx="8.05" cy="6.41" r="1.46" fill="url(#connection-white)" opacity=".9" stroke="#b9e5f5" stroke-width=".06"/>

    <!-- Original right-facing connection arrow -->
    <path d="M14.88 10.82       L13.76 9.70       A.06 .06 0 0 0 13.66 9.75       V10.43       A.06 .06 0 0 1 13.60 10.49       H11       V11.32       H13.60       A.06 .06 0 0 1 13.66 11.38       V12.07       A.06 .06 0 0 0 13.76 12.11       L14.88 11       A.12 .12 0 0 0 14.88 10.82 Z" fill="#0078d4"/>

  </g>
</svg>

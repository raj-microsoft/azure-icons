<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>API Connections (sketch)</title>
  
  <desc>Two interlocking hand-drawn chain links in original Azure blue and green, with uneven marker outlines and restrained yellow accents.</desc>

  <defs>
    <linearGradient id="apiBlue" x1="17" y1="23" x2="73" y2="81" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset=".55" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>

    <linearGradient id="apiGreen" x1="78" y1="45" x2="104" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76BC2D"/>
      <stop offset=".55" stop-color="#6CAB29"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Left Azure-blue chain link -->
  <path d="M28 25            L59 25            C75 25 87 37 87 52            C87 67 76 79 61 79            L28 79            C12 79 4 67 4 52            C4 37 14 25 28 25 Z            M28 38            C20 38 16 44 16 52            C16 60 21 66 29 66            L59 66            C68 66 74 60 74 52            C74 44 68 38 59 38 Z" fill="url(#apiBlue)" fill-rule="evenodd" stroke="#005BA1" stroke-width="2.8"/>

  <!-- Blue marker highlights -->
  <path d="M18 34            Q23 30 30 30            L57 30            M10 47 Q8 55 12 62" stroke="#D6EFFF" stroke-width="2.5" opacity=".85"/>

  <!-- Green chain link -->
  <path d="M69 49            L100 49            C115 49 124 62 124 77            C124 92 114 104 100 104            L69 104            C53 104 43 92 43 77            C43 62 53 49 69 49 Z            M69 62            C61 62 56 68 56 77            C56 85 61 91 69 91            L100 91            C108 91 112 85 112 77            C112 68 108 62 100 62 Z" fill="url(#apiGreen)" fill-rule="evenodd" stroke="#477C1E" stroke-width="2.8"/>

  <!-- Green upper contour -->
  <path d="M90 54 L100 54            Q114 55 118 69            M118 84 Q115 96 103 99" stroke="#C8EE8D" stroke-width="2.5" opacity=".85"/>

  <!-- Interlocking overlap: blue link passes in front -->
  <path d="M43 66            L59 66            C67 66 73 60 74 52            L87 52            C87 67 76 79 61 79            L43 79            Q42 72 43 66 Z" fill="#0078D4" stroke="#005BA1" stroke-width="2.8"/>

  <!-- Hand-drawn overlap highlight -->
  <path d="M49 71 L59 71            Q78 71 81 55" stroke="#8AC9FF" stroke-width="2.4" opacity=".9"/>

  <!-- Shadow at interlocking junction -->
  <path d="M58 81            Q62 91 72 91            L80 91" stroke="#427A20" stroke-width="2.4" opacity=".75"/>

  <!-- Small irregular marker marks -->
  <path d="M24 43 L31 43            M24 48 L36 48            M94 96 L101 96" stroke="#FFFFFF" stroke-width="2" opacity=".65"/>

  <!-- Yellow sketchnote spark accents -->
  <g stroke="#F7C948" stroke-width="3">
    <path d="M89 18 L93 10"/>
    <path d="M98 25 L106 21"/>
    <path d="M81 14 L80 7"/>
  </g>

  <path d="M22 95 L16 101            M30 99 L29 107" stroke="#F7C948" stroke-width="2.8"/>

  <!-- Tiny hand-drawn connection sparkle -->
  <path d="M66 108 L66 117            M61.5 112.5 L70.5 112.5" stroke="#F7C948" stroke-width="2.5"/>

  <!-- Subtle motion strokes -->
  <path d="M9 86 L17 83            M12 92 L20 89            M106 112 L114 109" stroke="#32D4F5" stroke-width="2.2"/>

</svg>

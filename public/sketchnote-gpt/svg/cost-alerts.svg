<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Cost Alerts (sketch)</title>
  
  <desc>Hand-drawn green notification bubble with a white dollar symbol, preserving the original Azure Cost Alerts icon, with subtle Azure-blue and yellow marker accents.</desc>

  <defs>
    <linearGradient id="costGreen" x1="30" y1="15" x2="91" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86D633"/>
      <stop offset=".48" stop-color="#76BC2D"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn notification bubble silhouette -->
  <path d="     M13 15     Q13 11 18 11     L109 11     Q115 11 115 17     L116 91     Q116 96 110 97     L82 97     L82 111     Q82 116 78 113     L57 98     L18 98     Q12 98 12 92     L12 20     Q12 17 13 15     Z" fill="url(#costGreen)" stroke="#426F1D" stroke-width="4.2"/>

  <!-- Uneven marker highlight across upper edge -->
  <path d="M21 19 Q39 18 58 19 L100 18" stroke="#C4F18B" stroke-width="3.5" opacity=".9"/>

  <!-- Subtle left interior marker stroke -->
  <path d="M20 29 L20 78" stroke="#A3E45C" stroke-width="2.5" opacity=".65"/>

  <!-- Notification tail fold -->
  <path d="M58 97 Q70 105 80 111" stroke="#426F1D" stroke-width="2.2"/>

  <path d="M73 98 L80 103" stroke="#C4F18B" stroke-width="2"/>

  <!-- White hand-drawn dollar symbol -->
  <path d="     M77 37     Q66 30 56 34     Q46 37 46 48     Q46 56 58 61     L71 66     Q82 71 80 82     Q78 93 64 94     Q51 95 41 87" stroke="#F2F2F2" stroke-width="9"/>

  <!-- Irregular marker overlay -->
  <path d="     M75 39     Q64 34 55 38     Q49 42 50 48     Q51 55 62 59     L72 64     Q84 70 83 80     Q82 92 69 96     Q53 99 41 90" stroke="#FFFFFF" stroke-width="2.8" opacity=".85"/>

  <!-- Dollar vertical stem -->
  <path d="M63 26 L63 101" stroke="#F2F2F2" stroke-width="7.5"/>

  <path d="M65 28 L65 98" stroke="#FFFFFF" stroke-width="2.2" opacity=".8"/>

  <!-- Green inner cutout accents -->
  <path d="M55 45 Q58 42 61 43" stroke="#5E9624" stroke-width="2.5"/>

  <path d="M73 83 Q70 87 65 87" stroke="#5E9624" stroke-width="2.5"/>

  <!-- Yellow sketchnote alert emphasis -->
  <g stroke="#F4C542" stroke-width="3">
    <path d="M119 28 L124 24"/>
    <path d="M120 37 L126 36"/>
    <path d="M118 46 L123 49"/>
  </g>

  <!-- Restrained Azure-blue annotations -->
  <g stroke="#0078D4" stroke-width="2.4">
    <path d="M5 45 L2 41"/>
    <path d="M5 53 L1 53"/>
    <path d="M6 61 L2 65"/>
  </g>

  <!-- Hand-drawn notification sparkle -->
  <path d="M101 27 L101 35 M97 31 L105 31" stroke="#F4C542" stroke-width="2.4"/>

  <!-- Small freehand edge accents -->
  <path d="M24 105 Q34 108 45 107" stroke="#76BC2D" stroke-width="2.2"/>

  <path d="M90 105 L98 102" stroke="#0078D4" stroke-width="2"/>

  <!-- Marker imperfections -->
  <path d="M109 75 L109 84" stroke="#C4F18B" stroke-width="1.8" opacity=".75"/>

  <path d="M28 90 L36 90" stroke="#C4F18B" stroke-width="1.8" opacity=".75"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Module (sketch)</title>
  
  <defs>
    <linearGradient id="module-blue" x1="9" y1="19.049" x2="9" y2="1.048" gradientUnits="userSpaceOnUse">
      <stop offset=".2" stop-color="#0078d4"/>
      <stop offset=".287" stop-color="#1380da"/>
      <stop offset=".495" stop-color="#3c91e5"/>
      <stop offset=".659" stop-color="#559cec"/>
      <stop offset=".759" stop-color="#5ea0ef"/>
    </linearGradient>
  </defs>

  <g transform="scale(7.111111)" stroke-linejoin="round" stroke-linecap="round">

    <!-- Original square module container -->
    <rect x="1" y="1" width="16" height="16" rx=".534" fill="url(#module-blue)"/>

    <!-- Original top row: three equal grid blocks -->
    <g opacity=".95">
      <rect x="2.361" y="2.777" width="3.617" height="3.368" rx=".14" fill="#fff"/>
      <rect x="7.192" y="2.777" width="3.617" height="3.368" rx=".14" fill="#fff"/>
      <rect x="12.023" y="2.777" width="3.617" height="3.368" rx=".14" fill="#fff"/>
    </g>

    <!-- Original middle row -->
    <rect x="2.361" y="7.28" width="8.394" height="3.368" rx=".14" fill="#fff" opacity=".45"/>
    <rect x="12.009" y="7.28" width="3.617" height="3.368" rx=".14" fill="#fff" opacity=".9"/>

    <!-- Original bottom row -->
    <rect x="2.361" y="11.854" width="13.186" height="3.368" rx=".14" fill="#fff" opacity=".75"/>

  </g>
</svg>

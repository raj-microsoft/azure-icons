  <path d="M64 7.5        C95.4 7.1 120.1 32.6 120.3 64.1        C120.4 95.3 95.6 120.1 64.1 120.2        C32.5 120.4 7.9 95.7 7.7 64.1        C7.5 32.7 32.5 7.7 64 7.5Z" fill="none" stroke="#368CD5" stroke-width="1.8" stroke-linecap="round"/>


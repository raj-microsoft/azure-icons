<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Integration Service Environments (sketch)</title>
  
  <desc>Hand-drawn Azure-blue circular environment with a hollow purple integration node connected by a blue branching line to two plain green service nodes. Dark uneven marker outlines, flat colors, and a transparent background.</desc>

  <!-- Azure environment boundary -->
  <path d="M64 2.5        C81.5 2.1 97.8 9.2 109.3 21.4        C120.1 32.9 125.3 47.8 125.4 64.1        C125.7 81.6 118.9 97.4 106.7 109.3        C95.2 120.6 79.9 125.2 63.7 125.4        C46.5 125.6 30.4 119.2 18.9 106.9        C7.7 95.1 2.7 80.4 2.5 64.2        C2.3 47.1 9 30.8 21 19.1        C32.4 8.1 47.7 2.8 64 2.5Z" fill="#0078D4" stroke="#153E5C" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>


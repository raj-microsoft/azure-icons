  <!-- Central integration connection structure -->
  <!-- Drawn behind all three nodes -->
  <path d="M63.9 54.4        Q64.2 60.2 64 62.8        L64 65.2        Q63.9 66.1 62.8 66.2        L37.5 66.2        Q35.2 66.3 35.1 68.8        L35.1 77" fill="none" stroke="#17486E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M64 65.2        Q64.2 66.2 65.5 66.2        L90.4 66.2        Q92.8 66.3 92.8 68.7        L92.8 77" fill="none" stroke="#17486E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>


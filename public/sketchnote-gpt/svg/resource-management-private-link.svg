<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Resource Management Private Link (sketch)</title>

  
  <desc>
    Hand-drawn Azure Resource Management Private Link icon.
    A cyan isometric cube, two separate outward-facing
    angle brackets, and a gray vertical connector ending
    in a blue circular node. Flat fills, uneven charcoal
    marker outlines, and a transparent background.
  </desc>

  <g stroke="#203746" stroke-linecap="round" stroke-linejoin="round">


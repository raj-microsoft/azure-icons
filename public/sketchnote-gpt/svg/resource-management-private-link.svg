<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title>Resource Management Private Link (sketch)</title>

  
  <desc id="desc">Azure private link illustration with a central cyan isometric resource cube, four outward connection links and a blue endpoint.</desc>

  <defs>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5f8ff"/>
      <stop offset="1" stop-color="#9cebff"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50e6ff"/>
      <stop offset="1" stop-color="#1490df"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32bedd"/>
      <stop offset="1" stop-color="#087eae"/>
    </linearGradient>
    <linearGradient id="endpoint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a3a3a3"/>
      <stop offset="1" stop-color="#777777"/>
    </linearGradient>
  </defs>

  <!-- Four private-link connection paths -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 75 L10 50" stroke="#1490df" stroke-width="8"/>
    <path d="M35 75 L10 100" stroke="#50e6ff" stroke-width="8"/>
    <path d="M93 75 L118 50" stroke="#1490df" stroke-width="8"/>
    <path d="M93 75 L118 100" stroke="#50e6ff" stroke-width="8"/>

    <!-- Marker-style inner highlights -->
    <path d="M34 71 L13 50" stroke="#a9efff" stroke-width="2"/>
    <path d="M34 79 L13 99" stroke="#a9efff" stroke-width="2"/>
    <path d="M94 71 L115 50" stroke="#a9efff" stroke-width="2"/>
    <path d="M94 79 L115 99" stroke="#a9efff" stroke-width="2"/>
  </g>

  <!-- Connection endpoint terminals -->
  <g fill="#50e6ff" stroke="#168dbb" stroke-width="2.2">
    <circle cx="9" cy="49" r="6"/>
    <circle cx="9" cy="101" r="6"/>
    <circle cx="119" cy="49" r="6"/>
    <circle cx="119" cy="101" r="6"/>
  </g>

  <g fill="none" stroke="#d5f8ff" stroke-width="2" stroke-linecap="round">
    <path d="M7 47 L10 45"/>
    <path d="M7 99 L10 97"/>
    <path d="M117 47 L120 45"/>
    <path d="M117 99 L120 97"/>
  </g>

  <!-- Central vertical private-link connector -->
  <path d="M64 18 L64 39" fill="none" stroke="url(#endpoint)" stroke-width="9" stroke-linecap="round"/>

  <path d="M62 20 L62 37" fill="none" stroke="#d0d0d0" stroke-width="2" stroke-linecap="round"/>

  <!-- Blue endpoint -->
  <circle cx="64" cy="13" r="11" fill="#1490df" stroke="#0878b9" stroke-width="2.2"/>

  <path d="M59 9 Q63 5 68 8" fill="none" stroke="#b5ecff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Central resource cube: top face -->
  <path d="M64 39            L99 59            L64 80            L29 59Z" fill="url(#cubeTop)" stroke="#168dbb" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left face -->
  <path d="M29 59            L64 80            L64 119            L29 99Z" fill="url(#cubeLeft)" stroke="#168dbb" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right face -->
  <path d="M99 59            L64 80            L64 119            L99 99Z" fill="url(#cubeRight)" stroke="#168dbb" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cube highlights -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M37 59 L64 75 L90 59" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>

    <path d="M37 69 L57 81" stroke="#b8f5ff" stroke-width="2" opacity=".8"/>

    <path d="M72 81 L91 69" stroke="#8ceaff" stroke-width="2" opacity=".8"/>

    <path d="M36 79 L36 96" stroke="#a4f1ff" stroke-width="2" opacity=".65"/>
  </g>

  <!-- Central structural edge -->
  <path d="M64 80 L64 119" fill="none" stroke="#087eae" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Yellow sketchnote accents -->
  <g fill="none" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round">
    <path d="M91 24 L97 19"/>
    <path d="M101 30 L106 28"/>
    <path d="M23 29 L18 25"/>
  </g>

  <!-- Subtle hand-drawn contour -->
  <path d="M64 37 Q83 48 101 59            L101 100 L64 121            L27 100 L27 59            Q45 48 64 37Z" fill="none" stroke="#176d83" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 3" opacity=".5"/>

</svg>

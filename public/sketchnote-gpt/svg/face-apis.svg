<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Face APIs (sketch)</title>
  
  <desc>Azure-blue human face framed by four cyan facial-recognition scanning corners, with organic marker outlines and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="faceBlue" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Facial recognition scanning corners -->
  <g stroke="#50E6FF" stroke-width="7">
    <path d="M34 9 Q23 8 11 10 Q9 11 10 21 L10 34"/>
    <path d="M94 10 Q107 9 117 10 L118 34"/>
    <path d="M10 94 L10 116 Q10 119 17 118 L34 118"/>
    <path d="M118 94 L118 116 Q117 119 112 118 L94 118"/>
  </g>

  <!-- Dark marker reinforcement -->
  <g stroke="#168FB8" stroke-width="2.2" opacity=".8">
    <path d="M14 31 L14 16 Q18 14 29 14"/>
    <path d="M99 14 L113 14 L113 30"/>
    <path d="M14 99 L14 113 L30 113"/>
    <path d="M98 113 L113 113 L113 98"/>
  </g>

  <!-- Main face silhouette -->
  <path d="M63 17            Q82 16 92 29            C101 40 100 52 97 62            Q96 67 102 73            Q107 79 103 86            Q100 93 95 94            Q92 96 90 103            C84 117 76 122 65 122            C52 122 43 116 37 103            Q34 96 30 94            Q24 93 23 85            Q19 76 25 71            Q30 67 28 61            C25 48 29 33 39 25            Q48 17 63 17Z" fill="url(#faceBlue)" stroke="#165A96" stroke-width="4"/>

  <!-- Hand-drawn forehead highlights -->
  <g stroke="#A9D9FF" stroke-width="2.6" opacity=".9">
    <path d="M43 32 Q51 24 62 24"/>
    <path d="M69 24 Q82 26 88 36"/>
    <path d="M36 45 Q34 54 36 61"/>
  </g>

  <!-- Left eyebrow -->
  <path d="M42 56 Q49 52 56 55" stroke="#165A96" stroke-width="3"/>

  <!-- Right eyebrow -->
  <path d="M72 55 Q79 52 86 56" stroke="#165A96" stroke-width="3"/>

  <!-- Eyes -->
  <g stroke="#E7F6FF" stroke-width="3">
    <path d="M43 64 Q49 60 55 64"/>
    <path d="M73 64 Q79 60 85 64"/>
  </g>

  <!-- Minimal facial landmarks -->
  <g stroke="#165A96" stroke-width="2.6">
    <path d="M64 65 Q61 76 64 80 L69 81"/>
    <path d="M54 96 Q64 102 75 95"/>
  </g>

  <!-- Nose and mouth highlights -->
  <path d="M62 85 Q66 87 70 84" stroke="#BEE7FF" stroke-width="2"/>
  <path d="M58 105 Q65 108 72 104" stroke="#5EA0EF" stroke-width="2.3"/>

  <!-- Sketch-style face contour strokes -->
  <g stroke="#005AAB" stroke-width="2.2" opacity=".65">
    <path d="M32 69 Q29 78 33 87"/>
    <path d="M96 69 Q100 79 95 87"/>
    <path d="M43 104 Q50 115 59 117"/>
  </g>

  <!-- Facial recognition landmark dots -->
  <g fill="#50E6FF" stroke="#087CB9" stroke-width="1.5">
    <circle cx="49" cy="64" r="2.4"/>
    <circle cx="79" cy="64" r="2.4"/>
    <circle cx="65" cy="82" r="2.4"/>
    <circle cx="54" cy="96" r="2.2"/>
    <circle cx="75" cy="96" r="2.2"/>
  </g>

  <!-- Subtle scanning guides -->
  <g stroke="#50E6FF" stroke-width="1.8" stroke-dasharray="3 5" opacity=".8">
    <path d="M22 64 L30 64"/>
    <path d="M98 64 L106 64"/>
    <path d="M64 11 L64 17"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#FFCB3D" stroke-width="3">
    <path d="M17 44 L22 40"/>
    <path d="M16 51 L22 51"/>
    <path d="M106 42 L112 38"/>
    <path d="M108 50 L115 50"/>
  </g>

  <!-- Tiny hand-drawn recognition sparkle -->
  <g stroke="#FFCB3D" stroke-width="2.4">
    <path d="M103 102 L103 110"/>
    <path d="M99 106 L107 106"/>
  </g>

  <!-- Marker motion accents -->
  <g stroke="#5EA0EF" stroke-width="2">
    <path d="M38 12 L43 9"/>
    <path d="M85 12 L90 9"/>
    <path d="M39 119 L44 123"/>
  </g>
</svg>

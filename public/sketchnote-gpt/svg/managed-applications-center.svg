<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke="#203746" stroke-linecap="round" stroke-linejoin="round"><title>Managed Applications Center (sketch)</title>

  
  <desc>One continuous isometric cyan cube subdivided into a three-by-three grid on all three visible faces, surrounded by a continuous purple diagonal orbital swoosh with a hidden rear segment.</desc>

  <defs>
    <clipPath id="topFace">
      <path d="M23 34 L65 12 L107 34 L65 57 Z"/>
    </clipPath>
    <clipPath id="leftFace">
      <path d="M23 34 L65 57 L65 105 L23 81 Z"/>
    </clipPath>
    <clipPath id="rightFace">
      <path d="M65 57 L107 34 L107 81 L65 105 Z"/>
    </clipPath>
  </defs>

  <!-- Rear hidden/behind-cube portion of the orbit -->
  <path d="     M89 24     C103 20, 116 26, 123 38     C128 49, 125 61, 115 70     C107 77, 98 81, 90 84" stroke="#203746" stroke-width="8.5"/>
  <path d="     M89 24     C103 20, 116 26, 123 38     C128 49, 125 61, 115 70     C107 77, 98 81, 90 84" stroke="#9C71E9" stroke-width="5.2"/>

  <!-- Single continuous cube: top face -->
  <path d="M23 34 L65 12 L107 34 L65 57 Z" fill="#50E6FF" stroke-width="3.2"/>

  <!-- Top face 3x3 grid -->
  <g clip-path="url(#topFace)" stroke="#203746" stroke-width="2.2">
    <path d="M37 26 L79 49              M51 19 L93 42              M51 49 L93 27              M37 42 L79 19"/>
  </g>

  <!-- Single continuous cube: left face -->
  <path d="M23 34 L65 57 L65 105 L23 81 Z" fill="#32BEDD" stroke-width="3.2"/>

  <!-- Left face 3x3 grid -->
  <g clip-path="url(#leftFace)" stroke="#203746" stroke-width="2.2">
    <path d="M37 42 L37 89              M51 50 L51 97              M23 50 L65 73              M23 66 L65 89"/>
  </g>

  <!-- Single continuous cube: right face -->
  <path d="M65 57 L107 34 L107 81 L65 105 Z" fill="#198AB3" stroke-width="3.2"/>

  <!-- Right face 3x3 grid -->
  <g clip-path="url(#rightFace)" stroke="#203746" stroke-width="2.2">
    <path d="M79 50 L79 97              M93 42 L93 89              M65 73 L107 50              M65 89 L107 66"/>
  </g>

  <!-- Reassert continuous outer cube silhouette -->
  <path d="M23 34 L65 12 L107 34            L107 81 L65 105 L23 81 Z            M23 34 L65 57 L107 34            M65 57 L65 105" stroke="#203746" stroke-width="3.5"/>

  <!-- Foreground/front portion of the same orbit, curling upward at lower-left -->
  <path d="     M89 84     C80 92, 69 101, 56 108     C42 115, 26 114, 16 106     C10 101, 8 91, 10 80     C13 67, 21 58, 33 51" stroke="#203746" stroke-width="8.5"/>
  <path d="     M89 84     C80 92, 69 101, 56 108     C42 115, 26 114, 16 106     C10 101, 8 91, 10 80     C13 67, 21 58, 33 51" stroke="#A67AF4" stroke-width="5.2"/>

</svg>

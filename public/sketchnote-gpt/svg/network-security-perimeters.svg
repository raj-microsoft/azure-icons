<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Network Security Perimeters (sketch)</title>
  <defs>
    <linearGradient id="perimeterCyan" x1="24" y1="12" x2="24" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="perimeterBlue" x1="82" y1="12" x2="82" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="perimeterYellow" x1="92" y1="72" x2="117" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFBD02"/>
      <stop offset="1" stop-color="#FFE452"/>
    </linearGradient>
  </defs>

  <!-- Perimeter boundary: four directional network gateways -->
  <g stroke="#0078D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 37 L49 37 L49 25 L63 25"/>
    <path d="M63 25 L79 25 L79 38 L104 38"/>
    <path d="M25 90 L25 105 L52 105"/>
    <path d="M52 105 L67 105 L67 91"/>
  </g>

  <!-- Top-left directional gateway -->
  <path d="M12 20 L29 8 L46 20 L29 32 L12 32 Z" fill="url(#perimeterCyan)" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M22 20 L36 20 M30 14 L36 20 L30 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top-right directional gateway -->
  <path d="M82 8 L108 8 L120 20 L108 32 L82 32 Z" fill="url(#perimeterBlue)" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M91 20 L107 20 M101 14 L107 20 L101 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Bottom-left directional gateway -->
  <path d="M10 83 L28 83 L40 95 L28 107 L10 107 Z" fill="url(#perimeterCyan)" stroke="#0078D4" stroke-width="3" stroke-linejoin="round"/>
  <path d="M17 95 L33 95 M27 89 L33 95 L27 101" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central protected perimeter -->
  <path d="M63 40     L91 56     L91 83     L63 99     L37 83     L37 56 Z" fill="#D2F5FF" fill-opacity=".28" stroke="#32BEDD" stroke-width="3.5" stroke-linejoin="round"/>

  <path d="M63 47 L84 59 L84 79 L63 92 L44 79 L44 59 Z" stroke="#0078D4" stroke-width="2" stroke-dasharray="4 4" stroke-linejoin="round"/>

  <!-- Protected cloud / network resource -->
  <path d="M51 70     C48 69 47 66 48 63     C49 60 52 59 55 60     C57 54 62 52 67 54     C72 55 75 59 75 64     C80 64 83 67 82 71     C81 75 78 77 74 77     L55 77     C52 77 50 74 51 70Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Security lock -->
  <rect x="58" y="68" width="13" height="12" rx="2.5" fill="#50E6FF" stroke="#0078D4" stroke-width="2"/>
  <path d="M61 68 V65 C61 60 68 60 68 65 V68" stroke="#0078D4" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64.5" cy="73" r="1.5" fill="#0078D4"/>

  <!-- Bottom-right security perimeter gateway -->
  <path d="M83 88     L108 75     L120 87     L120 113     L96 125     L83 113 Z" fill="url(#perimeterYellow)" stroke="#D99A00" stroke-width="3" stroke-linejoin="round"/>

  <!-- Lock symbol on gateway -->
  <path d="M97 96 V92     C97 84 109 84 109 92 V96" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <rect x="94" y="95" width="18" height="15" rx="3" fill="#FFBD02" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="103" cy="102" r="2" fill="#FFFFFF"/>

  <!-- Yellow security emphasis -->
  <path d="M112 43 L115 49 L122 52 L115 55 L112 62 L109 55 L102 52 L109 49Z" fill="#FFBD02" stroke="#D99A00" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Network traffic / perimeter signal marks -->
  <g stroke="#50E6FF" stroke-width="2.5" stroke-linecap="round">
    <path d="M46 42 L53 42"/>
    <path d="M75 42 L82 42"/>
    <path d="M29 113 L34 118"/>
    <path d="M77 109 L82 114"/>
  </g>

  <!-- Hand-drawn marker highlights -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M17 17 L27 11"/>
    <path d="M88 14 L103 14"/>
    <path d="M16 91 L25 91"/>
    <path d="M89 91 L94 87"/>
  </g>
</svg>

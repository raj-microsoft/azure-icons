    <path d="M50 17          Q43 17 42 24          Q41 31 46 34          Q48 35 51 35          L84 35          Q91 35 93 29          Q95 23 91 19          Q89 17 85 17          Z" fill="#552F99" stroke="#30283C" stroke-width="3.1"/>


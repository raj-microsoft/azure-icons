<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>MachinesAzureArc (sketch)</title>
  
  <desc>Flat purple Azure Arc machine tower with two recessed horizontal server slots and cyan status lights, rendered with uneven charcoal marker outlines.</desc>

  <g stroke-linecap="round" stroke-linejoin="round">

    <!-- Main purple machine enclosure -->
    <path d="M29 4          Q29 1 33 1          L99 1          Q103 1 103 5          L103 123          Q103 127 99 127          L33 127          Q29 127 29 123          Z" fill="#9357E9" stroke="#35313F" stroke-width="3.5"/>


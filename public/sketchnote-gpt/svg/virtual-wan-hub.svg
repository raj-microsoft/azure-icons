<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Virtual WAN Hub (sketch)</title>
  
  <desc>Azure-blue central WAN hub with white code chevrons, connected by pale cyan network links to six lime-green endpoint nodes. Hand-drawn marker styling and transparent background.</desc>

  <defs>
    <linearGradient id="hubBlue" x1="64" y1="49" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".78" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="10" y1="9" x2="114" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A3E65C"/>
      <stop offset="1" stop-color="#86D633"/>
    </linearGradient>
  </defs>

  <!-- Radiating WAN connections behind the hub -->
  <g stroke="#9CEBFF" stroke-width="6">
    <path d="M48 45 Q44 33 35 17"/>
    <path d="M80 45 Q85 30 96 17"/>
    <path d="M27 65 Q18 65 10 65"/>
    <path d="M101 65 Q111 65 119 65"/>
    <path d="M48 94 Q42 106 35 117"/>
    <path d="M80 94 Q86 107 96 117"/>
  </g>

  <!-- Uneven marker strokes on the connections -->
  <g stroke="#50E6FF" stroke-width="2.2" opacity=".8">
    <path d="M39 31 L33 21"/>
    <path d="M88 31 L95 21"/>
    <path d="M13 59 L25 60"/>
    <path d="M104 60 L115 59"/>
    <path d="M39 106 L33 115"/>
    <path d="M88 106 L95 115"/>
  </g>

  <!-- Six green network endpoints -->
  <g fill="url(#nodeGreen)" stroke="#568E20" stroke-width="2.8">
    <path d="M33 5 C40 5 45 10 45 17              C45 24 40 29 33 29              C26 29 21 24 21 17              C21 10 26 5 33 5Z"/>
    <path d="M96 5 C103 5 108 10 108 17              C108 24 103 29 96 29              C89 29 84 24 84 17              C84 10 89 5 96 5Z"/>
    <path d="M10 53 C17 53 22 58 22 65              C22 72 17 77 10 77              C4 77 2 72 2 65              C2 58 4 53 10 53Z"/>
    <path d="M118 53 C125 53 127 58 127 65              C127 72 125 77 118 77              C111 77 106 72 106 65              C106 58 111 53 118 53Z"/>
    <path d="M33 99 C40 99 45 104 45 111              C45 118 40 123 33 123              C26 123 21 118 21 111              C21 104 26 99 33 99Z"/>
    <path d="M96 99 C103 99 108 104 108 111              C108 118 103 123 96 123              C89 123 84 118 84 111              C84 104 89 99 96 99Z"/>
  </g>

  <!-- Hand-drawn node highlights -->
  <g stroke="#E5FFBA" stroke-width="2.3" opacity=".9">
    <path d="M27 15 Q29 10 34 10"/>
    <path d="M90 15 Q92 10 97 10"/>
    <path d="M5 62 Q7 58 11 58"/>
    <path d="M112 62 Q114 58 119 58"/>
    <path d="M27 109 Q29 104 34 104"/>
    <path d="M90 109 Q92 104 97 104"/>
  </g>

  <!-- Main WAN hub panel -->
  <path d="M27 34            Q27 31 31 31            L97 32            Q101 32 101 36            L101 93            Q101 97 97 97            L31 97            Q27 97 27 93Z" fill="url(#hubBlue)" stroke="#075A9E" stroke-width="3.5"/>

  <!-- Dark Azure header -->
  <path d="M27 36            Q27 31 31 31            L97 32            Q101 32 101 36            L101 49            Q64 50 27 49Z" fill="#0078D4" stroke="#075A9E" stroke-width="2.5"/>

  <!-- Subtle header highlight -->
  <path d="M33 37 Q64 35 94 37" stroke="#8BCBFF" stroke-width="2.2" opacity=".7"/>

  <!-- Code chevrons in the hub -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M51 58 L39 71 L51 84"/>
    <path d="M77 58 L89 71 L77 84"/>
  </g>

  <!-- Three white orchestration dots -->
  <g fill="#FFFFFF">
    <path d="M57 68 Q60 67 61 70 Q62 73 59 74 Q56 74 55 71Z"/>
    <path d="M64 68 Q67 67 68 70 Q69 73 66 74 Q63 74 62 71Z"/>
    <path d="M71 68 Q74 67 75 70 Q76 73 73 74 Q70 74 69 71Z"/>
  </g>

  <!-- Loose inner marker accents -->
  <g stroke="#B7E3FF" stroke-width="2" opacity=".7">
    <path d="M33 55 L33 87"/>
    <path d="M95 56 L95 88"/>
  </g>

  <!-- Restrained yellow sketchnote accent -->
  <path d="M110 35            L113 29            L116 35            L122 38            L116 41            L113 47            L110 41            L104 38Z" fill="#FFD966" stroke="#D49A20" stroke-width="1.6"/>
</svg>

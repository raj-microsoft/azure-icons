<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Compliance Center (sketch)</title>

  
  <desc>Hand-drawn blue compliance document with three rows of plain square list bullets and an overlapping green approval badge.</desc>

  <!-- Dark blue circular backplate -->
  <path d="M65 13            C87 13 104 30 108 51            Q111 68 100 82            Q85 77 75 91            Q65 103 70 115            C49 118 31 108 20 91            C8 72 11 49 23 32            Q39 13 65 13Z" fill="#003B70" stroke="#203746" stroke-width="3.5"/>

  <!-- Main document -->
  <path d="M18 14            Q18 10 23 10            L96 11            Q100 11 100 16            L100 78            Q88 77 78 88            Q68 99 72 116            Q50 119 34 106            Q18 92 18 75Z" fill="#1689DC" stroke="#203746" stroke-width="3.8"/>

  <!-- Document top edge -->
  <path d="M25 15 Q55 13 94 16" stroke="#203746" stroke-width="2.2"/>

  <!-- Three plain square list bullets -->
  <g fill="#EAF6FF" stroke="#203746" stroke-width="2.8">
    <path d="M34 38 Q39 37 44 38 L44 48 L34 48Z"/>
    <path d="M34 57 Q39 57 44 57 L44 67 L34 67Z"/>
    <path d="M34 77 Q39 76 44 77 L44 87 L34 87Z"/>
  </g>

  <!-- Three document text rows -->
  <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <path d="M54 40 Q68 39 84 40"/>
    <path d="M54 46 Q68 46 83 46"/>
    <path d="M54 59 Q69 58 84 59"/>
    <path d="M54 65 Q68 65 83 65"/>
    <path d="M54 79 Q65 78 77 79"/>
    <path d="M54 85 Q63 85 72 85"/>
  </g>

  <!-- Green approval badge -->
  <path d="M117 95            C117 108 107 118 95 119            C82 120 72 110 72 97            C71 84 81 74 94 73            C107 72 117 82 117 95Z" fill="#57A300" stroke="#203746" stroke-width="3.8"/>

  <!-- White approval check -->
  <path d="M83 96            Q87 100 92 105            Q101 94 108 86" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Web Jobs (sketch)</title>
  
  <desc>Hand-drawn sketchnote Azure Web Jobs icon featuring a blue connected workflow network, three processing nodes and two cyan gears representing automated background jobs.</desc>

  <defs>
    <radialGradient id="webBlue" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>
    <linearGradient id="nodeSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCFCFC"/>
      <stop offset="1" stop-color="#CCCCCC"/>
    </linearGradient>
    <linearGradient id="gearCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset="1" stop-color="#32B4D5"/>
    </linearGradient>
  </defs>

  <!-- Main Azure circular workflow -->
  <path d="M81 91            C67 111 39 112 22 95            C3 76 11 45 31 29            C49 13 79 15 96 32            C109 45 113 65 105 81" fill="none" stroke="#005BA1" stroke-width="3" stroke-linecap="round" opacity=".8"/>

  <path d="M78 92            C62 108 39 105 25 90            C10 73 16 47 33 32            C51 17 76 20 93 34" fill="none" stroke="#5EA0EF" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round"/>

  <!-- Workflow connections -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 49 Q56 32 79 49"/>
    <path d="M35 49 L55 82"/>
    <path d="M79 49 L55 82"/>
  </g>
  <g fill="none" stroke="#0078D4" stroke-width="2.5" stroke-linecap="round">
    <path d="M35 49 Q56 32 79 49"/>
    <path d="M35 49 L55 82"/>
    <path d="M79 49 L55 82"/>
  </g>

  <!-- Top processing node -->
  <circle cx="56" cy="32" r="16" fill="url(#nodeSilver)" stroke="#777777" stroke-width="2.5"/>
  <circle cx="56" cy="32" r="11" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="56" cy="32" r="5" fill="#5EA0EF" stroke="#0078D4" stroke-width="1.5"/>

  <!-- Left processing node -->
  <circle cx="27" cy="51" r="16" fill="url(#nodeSilver)" stroke="#777777" stroke-width="2.5"/>
  <circle cx="27" cy="51" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="27" cy="51" r="5" fill="#5EA0EF" stroke="#0078D4" stroke-width="1.5"/>

  <!-- Bottom processing node -->
  <circle cx="56" cy="86" r="14" fill="url(#nodeSilver)" stroke="#777777" stroke-width="2.5"/>
  <circle cx="56" cy="86" r="8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="56" cy="86" r="4" fill="#5EA0EF" stroke="#0078D4" stroke-width="1.3"/>

  <!-- Right processing node -->
  <circle cx="86" cy="51" r="13" fill="url(#nodeSilver)" stroke="#777777" stroke-width="2.5"/>
  <circle cx="86" cy="51" r="7" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="86" cy="51" r="3.5" fill="#5EA0EF" stroke="#0078D4" stroke-width="1.3"/>

  <!-- Main automation gear -->
  <path d="M108 57     L114 58 L117 64 L123 64     L125 71 L120 75 L121 81     L115 85 L110 82 L105 86     L99 82 L100 76 L95 72     L98 65 L104 65 Z" fill="url(#gearCyan)" stroke="#0078D4" stroke-width="2.8" stroke-linejoin="round"/>

  <circle cx="110" cy="72" r="8" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
  <circle cx="110" cy="72" r="3" fill="#32BEDD"/>

  <!-- Secondary small gear -->
  <path d="M79 91     L84 91 L87 95 L91 95     L93 100 L89 104 L90 109     L85 112 L81 109 L76 112     L72 108 L74 103 L70 100     L73 95 L77 95 Z" fill="#50E6FF" stroke="#0078D4" stroke-width="2.3" stroke-linejoin="round"/>

  <circle cx="81" cy="101" r="5" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.8"/>

  <!-- Workflow directional indicators -->
  <path d="M89 30 Q99 38 102 48" fill="none" stroke="#32BEDD" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M96 43 L102 49 L104 40" fill="none" stroke="#32BEDD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Yellow sketchnote accents -->
  <g fill="none" stroke="#E6B93F" stroke-width="2.5" stroke-linecap="round">
    <path d="M15 27 L10 23"/>
    <path d="M21 17 L19 12"/>
    <path d="M94 18 L99 14"/>
    <path d="M116 39 L121 36"/>
    <path d="M60 116 L64 121"/>
  </g>

  <!-- Hand-drawn marker details -->
  <g fill="none" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round">
    <path d="M37 17 L42 15"/>
    <path d="M12 68 L9 72"/>
    <path d="M66 100 L70 103"/>
    <path d="M96 91 L100 87"/>
    <path d="M45 110 Q51 113 57 112"/>
  </g>
</svg>

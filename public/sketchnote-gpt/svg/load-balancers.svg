  <path d="M54 34 L64 25 L74 34" stroke="#E1FF83" stroke-width="2.3"/>

  <path d="M34 54 L24 64 L34 74" stroke="#E1FF83" stroke-width="2.3"/>

  <path d="M94 54 L104 64 L94 74" stroke="#E1FF83" stroke-width="2.3"/>


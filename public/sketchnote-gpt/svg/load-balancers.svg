<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Load Balancers (sketch)</title>

  
  <desc>Hand-drawn green diamond with three directional arrows, a central Azure-blue hub, and a small connected lower node.</desc>

  <defs>
    <linearGradient id="lbGreen" x1="25" y1="12" x2="105" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76BC2D"/>
      <stop offset=".55" stop-color="#70B52B"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>


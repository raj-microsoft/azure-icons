<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Data Lake Store Gen1 (sketch)</title>
  
  <desc>Hand-drawn Azure Data Lake Store folder with a cyan front panel and white lightning bolt.</desc>

  <defs>

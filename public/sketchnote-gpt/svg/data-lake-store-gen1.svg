      <stop stop-color="#32D4F5"/>
      <stop offset=".46" stop-color="#2CC3E6"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
  </defs>

  <!-- Back of folder: uneven marker silhouette -->
  <path d="M9 23            Q9 19 14 19            L49 20            Q52 20 55 22            L69 32            L115 32            Q120 32 120 37            L120 108            L9 108 Z" fill="#005BA1" stroke="#174E78" stroke-width="3.5"/>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>promethus (sketch)</title>
  
  <desc>Prometheus monitoring icon with its recognizable orange circular background, white stylized flame, three horizontal base elements, and subtle hand-drawn marker accents.</desc>

  <defs>
    <linearGradient id="promOrange" x1="24" y1="15" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F36B3D"/>
      <stop offset=".55" stop-color="#E6522C"/>
      <stop offset="1" stop-color="#CF421F"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn circular Prometheus badge -->
  <path d="M64 5            C96 4 122 29 123 62            C125 95 99 122 66 123            C33 125 6 101 5 68            C3 34 29 7 64 5 Z" fill="url(#promOrange)" stroke="#A9361B" stroke-width="3.5"/>

  <!-- Subtle irregular marker highlight -->
  <path d="M22 34            C34 17 49 12 65 12" stroke="#FFAD83" stroke-width="3" opacity=".8"/>

  <path d="M112 79            C106 99 91 113 72 116" stroke="#B83C20" stroke-width="2.5" opacity=".6"/>

  <!-- Stylized Prometheus flame -->
  <path d="M35 65            C33 57 36 47 40 39            C43 34 45 27 43 21            C51 25 54 36 53 46            C59 38 59 28 59 21            C59 15 63 10 68 9            C63 17 69 25 72 35            C75 43 75 51 76 58            C79 43 78 28 88 20            C84 30 88 38 92 46            C97 55 99 64 94 72            C92 77 88 81 84 84            L45 84            C39 79 36 73 35 65 Z" fill="#FFFFFF" stroke="#B83E24" stroke-width="2.3"/>

  <!-- Inner flame marker contours -->
  <path d="M52 74            C47 65 50 57 55 51            C55 60 59 65 62 68            C63 58 65 49 69 42            C69 54 75 62 77 73" stroke="#E6522C" stroke-width="2.6" opacity=".65"/>

  <!-- Flame base, first horizontal bar -->
  <path d="M34 84            Q64 88 94 84            L94 94            Q64 96 34 94 Z" fill="#FFFFFF" stroke="#B83E24" stroke-width="2.5"/>

  <!-- Second horizontal bar -->
  <path d="M36 99            Q64 101 92 99            L92 108            Q64 110 36 108 Z" fill="#FFFFFF" stroke="#B83E24" stroke-width="2.5"/>

  <!-- Rounded bottom of Prometheus torch -->
  <path d="M47 112            L81 112            C81 120 73 125 64 125            C55 125 47 120 47 112 Z" fill="#FFFFFF" stroke="#B83E24" stroke-width="2.5"/>

  <!-- Small hand-drawn white flame highlights -->
  <path d="M44 43            Q40 54 42 61" stroke="#FFD5C5" stroke-width="2.5"/>

  <path d="M86 48            Q91 60 88 68" stroke="#FFD5C5" stroke-width="2.2"/>

  <!-- Restrained yellow energy sparks -->
  <path d="M104 25 L104 34            M100 29 L108 29" stroke="#F4C542" stroke-width="3"/>

  <path d="M20 72 L14 76            M25 82 L20 88" stroke="#F4C542" stroke-width="2.5"/>

  <!-- Subtle Azure-blue monitoring accents -->
  <path d="M14 49 L20 46            M108 93 L114 96" stroke="#32BEDD" stroke-width="2.5" opacity=".85"/>

  <!-- Loose sketchnote movement strokes -->
  <path d="M31 108 Q37 114 43 116" stroke="#FFAD83" stroke-width="2" opacity=".75"/>

  <path d="M91 115 Q98 111 103 105" stroke="#FFAD83" stroke-width="2" opacity=".75"/>
</svg>

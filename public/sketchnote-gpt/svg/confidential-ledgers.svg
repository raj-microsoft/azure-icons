<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Confidential Ledgers (sketch)</title>
  
  <desc>Three connected isometric purple ledger cubes with hand-drawn marker outlines, miniature keyholes, and a secure distributed-ledger network.</desc>

  <defs>
    <linearGradient id="clTop" x1="30" y1="10" x2="96" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBB3FF"/>
      <stop offset="1" stop-color="#B796F9"/>
    </linearGradient>
    <linearGradient id="clLeft" x1="12" y1="25" x2="78" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B28AF5"/>
      <stop offset="1" stop-color="#A67AF4"/>
    </linearGradient>
    <linearGradient id="clRight" x1="60" y1="20" x2="116" y2="115" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8749E8"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Distributed ledger connections -->
  <g stroke="#773ADC" stroke-width="3.5" stroke-dasharray="5 6">
    <path d="M48 50 Q40 63 31 73"/>
    <path d="M79 51 Q87 65 98 74"/>
    <path d="M50 103 Q64 108 78 103"/>
  </g>

  <!-- Small connection highlights -->
  <path d="M34 62 L38 57 M87 60 L92 66" stroke="#F4C542" stroke-width="2.8"/>
  <path d="M60 106 L67 106" stroke="#F4C542" stroke-width="2.6"/>

  <!-- Top ledger cube -->
  <g stroke="#552F99" stroke-width="3.2">
    <path d="M39 20 Q39 18 42 17              L62 5 Q64 4 67 6              L87 17 Q90 19 87 21              L66 34 Q64 36 61 34 Z" fill="url(#clTop)"/>

    <path d="M39 20 L63 34              Q64 35 64 39              L64 65              Q64 68 61 66              L40 54 Q38 53 38 50 Z" fill="url(#clLeft)"/>

    <path d="M64 35 L89 20              L89 49 Q89 52 86 54              L64 67 Z" fill="url(#clRight)"/>

    <path d="M44 24 L63 35 L63 60" stroke="#E9DFFF" stroke-width="1.5" opacity=".8"/>
  </g>

  <!-- Top cube lock symbol -->
  <g stroke="#552F99" stroke-width="2.5">
    <path d="M48 40 L48 37              Q48 33 51 35              Q54 37 54 41 L54 44" fill="none"/>
    <path d="M45 40 L57 47 L57 57 L45 50 Z" fill="#773ADC"/>
    <path d="M51 45 L51 49" stroke="#FFF7CE" stroke-width="2.2"/>
  </g>

  <!-- Left ledger cube -->
  <g stroke="#552F99" stroke-width="3.2">
    <path d="M5 77 Q5 75 8 73              L29 61 Q31 60 34 62              L55 74 Q57 76 54 78              L33 90 Q31 92 28 90 Z" fill="url(#clTop)"/>

    <path d="M5 77 L30 91              L30 120 Q30 123 27 121              L8 110 Q5 108 5 105 Z" fill="url(#clLeft)"/>

    <path d="M30 91 L56 76              L56 105 Q56 108 53 110              L30 123 Z" fill="url(#clRight)"/>
  </g>

  <!-- Left cube lock -->
  <g stroke="#552F99" stroke-width="2.5">
    <path d="M13 96 L13 92              Q13 88 17 91              Q20 93 20 97" fill="none"/>
    <path d="M10 95 L23 103 L23 113 L10 106 Z" fill="#773ADC"/>
    <path d="M16.5 101 L16.5 105" stroke="#FFF7CE" stroke-width="2.2"/>
  </g>

  <!-- Right ledger cube -->
  <g stroke="#552F99" stroke-width="3.2">
    <path d="M73 77 Q73 75 76 73              L97 61 Q99 60 102 62              L123 74 Q125 76 122 78              L101 90 Q99 92 96 90 Z" fill="url(#clTop)"/>

    <path d="M73 77 L98 91              L98 120 Q98 123 95 121              L76 110 Q73 108 73 105 Z" fill="url(#clLeft)"/>

    <path d="M98 91 L124 76              L124 105 Q124 108 121 110              L98 123 Z" fill="url(#clRight)"/>
  </g>

  <!-- Right cube lock -->
  <g stroke="#552F99" stroke-width="2.5">
    <path d="M81 96 L81 92              Q81 88 85 91              Q88 93 88 97" fill="none"/>
    <path d="M78 95 L91 103 L91 113 L78 106 Z" fill="#773ADC"/>
    <path d="M84.5 101 L84.5 105" stroke="#FFF7CE" stroke-width="2.2"/>
  </g>

  <!-- Sketch-style cube highlights -->
  <g stroke="#E9DFFF" stroke-width="2" opacity=".9">
    <path d="M11 80 L27 89"/>
    <path d="M79 80 L95 89"/>
    <path d="M43 22 L58 31"/>
  </g>

  <!-- Hand-drawn marker accents -->
  <g stroke="#F4C542" stroke-width="2.6">
    <path d="M92 16 L96 12"/>
    <path d="M96 23 L102 22"/>
    <path d="M18 57 L14 52"/>
    <path d="M61 117 L65 120"/>
  </g>

  <!-- Small sketchnote motion marks -->
  <g stroke="#773ADC" stroke-width="2" opacity=".7">
    <path d="M33 13 L37 10"/>
    <path d="M10 68 L15 65"/>
    <path d="M113 65 L118 68"/>
    <path d="M40 116 L45 113"/>
  </g>
</svg>

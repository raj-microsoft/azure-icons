<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Confidential Ledgers (sketch)</title>
  
  <desc>Three connected purple isometric ledger cubes arranged in a triangle, each with a simple dark keyhole on its left face. Visible purple connecting bars, flat fills, and irregular charcoal marker outlines.</desc>

  <!-- Distributed ledger connectors: drawn behind cubes -->
  <g fill="#773ADC" stroke="#243447" stroke-width="2.3">
    <!-- Upper cube to lower-left cube -->
    <path d="M47 49 L53 52 L39 76 L33 72 Z"/>
    <!-- Upper cube to lower-right cube -->
    <path d="M76 49 L82 46 L96 72 L90 76 Z"/>
    <!-- Horizontal connection between lower cubes -->
    <path d="M51 91 L77 91 L77 97 L51 97 Z"/>
  </g>

  <!-- TOP LEDGER CUBE -->
  <!-- Top face -->
  <path d="M37 17            Q37 15 40 14            L62 2 Q64 1 66 2            L88 15 Q90 17 87 19            L65 32 Q63 33 61 31 Z" fill="#B796F9" stroke="#243447" stroke-width="3"/>

  <!-- Left face -->
  <path d="M37 17            L63 32            L63 64            Q63 66 61 65            L39 52 Q37 51 37 49 Z" fill="#A67AF4" stroke="#243447" stroke-width="3"/>

  <!-- Right face -->
  <path d="M63 32            L89 17            L89 49            Q89 51 87 52            L63 65 Z" fill="#773ADC" stroke="#243447" stroke-width="3"/>

  <!-- Top cube keyhole: small head and tapered slot -->
  <path d="M49 34            C52 34 54 37 54 40            Q54 42 52 43            L54 49            Q54 51 52 50            L47 47            Q46 46 47 44            L49 41            Q47 38 48 36            Q48 35 49 34 Z" fill="#552F99" stroke="#243447" stroke-width="1.6"/>

  <!-- LOWER-LEFT LEDGER CUBE -->
  <!-- Top face -->
  <path d="M3 78            Q3 76 6 74            L28 62 Q30 61 32 62            L54 75 Q57 77 54 79            L32 92 Q30 93 28 91 Z" fill="#B796F9" stroke="#243447" stroke-width="3"/>

  <!-- Left face -->
  <path d="M3 78            L30 92            L30 125            Q30 127 27 125            L6 113 Q3 111 3 108 Z" fill="#A67AF4" stroke="#243447" stroke-width="3"/>

  <!-- Right face -->
  <path d="M30 92            L56 77            L56 108            Q56 110 53 112            L30 125 Z" fill="#773ADC" stroke="#243447" stroke-width="3"/>

  <!-- Left cube keyhole -->
  <path d="M14 96            C17 96 19 100 19 103            Q19 105 17 106            L19 112            Q19 114 17 113            L12 110            Q11 109 12 107            L14 104            Q12 101 13 98            Q13 97 14 96 Z" fill="#552F99" stroke="#243447" stroke-width="1.6"/>

  <!-- LOWER-RIGHT LEDGER CUBE -->
  <!-- Top face -->
  <path d="M71 78            Q71 76 74 74            L96 62 Q98 61 100 62            L122 75 Q125 77 122 79            L100 92 Q98 93 96 91 Z" fill="#B796F9" stroke="#243447" stroke-width="3"/>

  <!-- Left face -->
  <path d="M71 78            L98 92            L98 125            Q98 127 95 125            L74 113 Q71 111 71 108 Z" fill="#A67AF4" stroke="#243447" stroke-width="3"/>

  <!-- Right face -->
  <path d="M98 92            L124 77            L124 108            Q124 110 121 112            L98 125 Z" fill="#773ADC" stroke="#243447" stroke-width="3"/>

  <!-- Right cube keyhole -->
  <path d="M82 96            C85 96 87 100 87 103            Q87 105 85 106            L87 112            Q87 114 85 113            L80 110            Q79 109 80 107            L82 104            Q80 101 81 98            Q81 97 82 96 Z" fill="#552F99" stroke="#243447" stroke-width="1.6"/>
</svg>

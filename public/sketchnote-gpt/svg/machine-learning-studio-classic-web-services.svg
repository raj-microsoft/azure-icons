<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Machine Learning Studio (Classic) Web Services (sketch)</title>
  
  <desc>Azure-blue hand-drawn globe behind a cyan machine-learning laboratory flask, with uneven marker outlines, subtle yellow accents, and a transparent background.</desc>

  <defs>
    <linearGradient id="flaskCyan" x1="15" y1="51" x2="80" y2="123" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D4F5"/>
      <stop offset=".5" stop-color="#2EC9EB"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
    <linearGradient id="globeBlue" x1="46" y1="8" x2="114" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0098E8"/>
      <stop offset="1" stop-color="#0062B3"/>
    </linearGradient>
  </defs>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Azure Token Service (sketch)</title>

  
  <desc>
    Purple isometric cube with one short cyan disk
    in front-left and exactly two distinct stacked
    cyan disks in front-right. Flat fills, uneven
    dark marker outlines, transparent background.
  </desc>

  <!-- Purple cube: left face -->

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Mobile (sketch)</title>

  
  <desc>
    Azure Mobile service icon with a blue smartphone,
    pale screen, and one solid isometric Azure cube.
    Flat fills, slightly irregular charcoal marker outlines,
    and a transparent background.
  </desc>

  <!-- Smartphone outer casing -->
  <path d="M27.7 3.2        Q26.1 3.3 26 6.2        L26.1 121.2        Q26.2 124.4 29.4 124.5        L98.6 124.5        Q101.6 124.3 101.7 121.1        L101.7 6.4        Q101.6 3.2 98.5 3.1        Z" fill="#3C91E5" stroke="#203746" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pale smartphone display -->
  <path d="M34.2 13.5        Q34.2 11.4 36.4 11.4        L91.6 11.4        Q93.6 11.4 93.6 13.5        L93.6 110.6        Q93.6 112.4 91.5 112.4        L36.5 112.4        Q34.3 112.4 34.2 110.5        Z" fill="#E8F7FF" stroke="#203746" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Top speaker -->
  <path d="M56.2 7.3        Q64 7.1 71.8 7.3" stroke="#203746" stroke-width="4.2" stroke-linecap="round"/>

  <path d="M56.2 7.3        Q64 7.1 71.8 7.3" stroke="#F2F2F2" stroke-width="2.3" stroke-linecap="round"/>

  <!-- Single solid Azure cube: top face -->
  <path d="M44.8 52.5        L64.5 41.1        L84.2 52.5        L64.5 64.1        Z" fill="#5EA0EF" stroke="#203746" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Single solid Azure cube: left face -->
  <path d="M44.8 52.5        L64.5 64.1        L64.5 86.9        L44.8 75.5        Z" fill="#0078D4" stroke="#203746" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Single solid Azure cube: right face -->
  <path d="M64.5 64.1        L84.2 52.5        L84.2 75.5        L64.5 86.9        Z" fill="#005BA1" stroke="#203746" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Home button -->
  <path d="M61.8 116.6        L66.3 116.6        Q68.1 116.6 68.1 118.3        L68.1 120.5        Q68.1 122.1 66.4 122.1        L61.8 122.1        Q60.2 122.1 60.2 120.4        L60.2 118.3        Q60.2 116.6 61.8 116.6Z" fill="#F2F2F2" stroke="#203746" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

</svg>

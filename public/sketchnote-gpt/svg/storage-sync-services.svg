  <path d="M50 119     Q64 125 78 119" fill="none" stroke="#0078d4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M73 115 L80 119 L74 124" fill="none" stroke="#0078d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>


  <circle cx="55" cy="69" r="2.2" fill="#50e6ff"/>
  <path d="M62 69 H72" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="50" y="80" width="27" height="10" rx="4" fill="#003067"/>
  <circle cx="55" cy="85" r="2.2" fill="#50e6ff"/>
  <path d="M62 85 H72" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>


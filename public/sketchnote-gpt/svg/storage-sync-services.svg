  <path d="M47 57     L81 57     Q84 57 84 61     L84 100     Q84 104 81 104     L47 104     Q44 104 44 100     L44 61     Q44 57 47 57Z" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.5"/>


  <path d="M30 59     L20 59     L20 53     L11 62     L20 71     L20 65     L30 65Z" fill="#50e6ff" stroke="#0078d4" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M97 94     L107 94     L107 88     L117 97     L107 106     L107 100     L97 100Z" fill="#50e6ff" stroke="#0078d4" stroke-width="1.5" stroke-linejoin="round"/>


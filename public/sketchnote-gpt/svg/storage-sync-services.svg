<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Storage Sync Services (sketch)</title>
  <defs>
    <linearGradient id="cloudBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ea0ef"/>
      <stop offset=".55" stop-color="#3990e4"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="serverSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#ececec"/>
      <stop offset="1" stop-color="#949494"/>
    </linearGradient>
  </defs>

  <!-- Cloud silhouette -->
  <path d="M20 70     C13 66 10 58 12 50     C14 41 22 35 32 35     C35 21 47 13 62 14     C77 14 88 24 91 38     C104 37 115 46 117 58     C119 71 109 82 96 83     L35 83     C29 82 23 78 20 70Z" fill="url(#cloudBlue)" stroke="#005ba1" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Cloud highlight -->
  <path d="M31 38     C36 25 48 20 60 21     C70 21 78 26 82 34" fill="none" stroke="#8ed8ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Server / sync service -->
  <path d="M42 48     L85 48     Q89 48 89 53     L89 108     Q89 113 84 113     L43 113     Q39 113 39 108     L39 53     Q39 48 42 48Z" fill="url(#serverSilver)" stroke="#666666" stroke-width="2.8" stroke-linejoin="round"/>


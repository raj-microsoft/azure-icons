  <!-- Golden security key silhouette -->
  <path d="M62 7            C47 7 35 19 35 34            C35 47 43 57 55 61            L55 86            L45 86            Q42 86 42 90            L42 100            Q42 103 46 103            L55 103            L55 110            Q55 113 59 113            L69 113            Q73 113 73 109            L73 61            C85 57 93 46 93 34            C93 19 80 7 65 7Z            M64 20            C72 20 79 26 79 34            C79 42 72 49 64 49            C56 49 49 42 49 34            C49 26 56 20 64 20Z" fill="url(#keyGold)" fill-rule="evenodd" stroke="#B87516" stroke-width="3.6"/>

  <!-- Inner key-ring highlight -->

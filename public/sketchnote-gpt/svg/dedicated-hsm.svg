  <!-- Keyhole insertion detail -->
  <path d="M49 119 Q64 123 78 119" stroke="#174E83" stroke-width="2.5" opacity=".65"/>

  <!-- Subtle hand-drawn security accents -->
  <path d="M27 22 L21 17            M25 33 L17 32            M29 44 L23 49" stroke="#F6C84B" stroke-width="3.2"/>

  <path d="M101 24 L107 19            M103 35 L112 34" stroke="#1988D9" stroke-width="3"/>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Dedicated HSM (sketch)</title>
  
  <desc>Hand-drawn Azure Dedicated HSM icon featuring a golden security key inserted into a blue hardware security module.</desc>

  <defs>
    <linearGradient id="hsmBlue" x1="64" y1="72" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="keyGold" x1="62" y1="7" x2="62" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD70F"/>
      <stop offset=".72" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#FEA11B"/>
    </linearGradient>
  </defs>

  <!-- Hardware security module -->
  <path d="M9 73            Q9 70 14 70            L114 70            Q119 70 119 75            L119 114            Q119 119 114 119            L14 119            Q9 119 9 114Z" fill="url(#hsmBlue)" stroke="#174E83" stroke-width="3.8"/>


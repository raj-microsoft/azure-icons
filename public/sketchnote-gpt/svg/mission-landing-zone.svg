<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Mission Landing Zone (sketch)</title>
  
  <desc>Azure-blue cloud above a green elliptical landing zone, illustrated with organic marker outlines, subtle highlights, and small yellow sketchnote accents.</desc>

  <defs>
    <linearGradient id="cloudBlue" x1="32" y1="8" x2="100" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".52" stop-color="#3C91E5"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="landingGreen" x1="64" y1="79" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76BC2D"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Landing platform: visible lower rim -->
  <path d="M8 91            C8 80 33 74 64 74            C95 74 120 80 120 91            L120 108            C120 119 95 124 64 124            C33 124 8 119 8 108Z" fill="#5E9624" stroke="#477B1D" stroke-width="3.2"/>

  <!-- Sketchy lower rim contour -->
  <path d="M10 108            Q13 117 37 120            Q67 126 96 119            Q115 115 119 108" stroke="#396C1A" stroke-width="1.8"/>

  <!-- Upper green elliptical landing surface -->
  <path d="M120 91            C120 102 95 108 64 108            C33 108 8 102 8 91            C8 80 33 74 64 74            C95 74 120 80 120 91Z" fill="url(#landingGreen)" stroke="#4F8C23" stroke-width="3"/>

  <!-- Hand-drawn inner landing ellipse -->
  <path d="M24 91            C25 85 43 82 64 82            C87 82 105 86 105 92            C104 99 84 102 63 102            C41 102 24 98 24 91Z" fill="#F2F2F2" stroke="#D1D7D1" stroke-width="2.2"/>

  <!-- Inner landing-zone pencil accent -->
  <path d="M33 91 Q49 85 68 86            M78 87 Q91 88 98 91" stroke="#A8BBA4" stroke-width="1.5" opacity=".8"/>

  <!-- Main cloud silhouette -->
  <path d="M34 89            C20 90 10 81 9 68            Q7 55 16 46            Q22 39 34 39            C40 21 52 11 68 11            Q86 10 97 23            Q104 31 105 43            C119 45 126 55 126 67            Q126 82 113 88            Q108 91 99 91            L35 91Z" fill="url(#cloudBlue)" stroke="#185E9D" stroke-width="3.4"/>

  <!-- Irregular cloud highlight strokes -->
  <path d="M17 62 Q19 50 34 48            M44 36 Q50 21 66 19            M76 20 Q94 24 96 43" stroke="#B8DEFF" stroke-width="2.7" opacity=".85"/>

  <!-- Organic upper cloud contour -->
  <path d="M13 72 Q16 84 34 85            M103 48 Q116 50 120 62" stroke="#8CC9F7" stroke-width="1.9" opacity=".8"/>

  <!-- Fine cloud marker texture -->
  <path d="M36 43 Q41 35 47 30            M107 84 Q116 80 120 71" stroke="#0E69B5" stroke-width="1.8" opacity=".65"/>

  <!-- Minimal sketchnote-style yellow accents -->
  <path d="M108 25 L113 20            M115 32 L122 30            M14 30 L20 35" stroke="#FFD65A" stroke-width="2.8"/>

  <!-- Small hand-drawn sparkle -->
  <path d="M30 15 L30 23            M26 19 L34 19" stroke="#FFD65A" stroke-width="2.6"/>

  <circle cx="30" cy="19" r="1.7" fill="#FFE58A"/>

  <!-- Small accent ticks around landing platform -->
  <path d="M18 111 L14 115            M112 116 L117 120" stroke="#FFD65A" stroke-width="2.5"/>

  <!-- Subtle hand-drawn ground marker -->
  <path d="M43 126 Q64 128 85 126" stroke="#76BC2D" stroke-width="1.5" opacity=".65"/>

</svg>

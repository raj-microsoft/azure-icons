<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Globe Success (sketch)</title>
  

  <defs>
    <linearGradient id="globeGreen" x1="23" y1="9" x2="94" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76BC2D"/>
      <stop offset="0.82" stop-color="#5E9624"/>
      <stop offset="1" stop-color="#52891E"/>
    </linearGradient>
  </defs>

  <!-- Globe: organic marker silhouette -->
  <path d="M56 9            C75 8 91 19 96 37            C103 57 92 77 75 85            C56 94 34 86 25 70            C14 52 21 29 38 17            C43 13 50 10 56 9 Z" fill="url(#globeGreen)" stroke="#477D20" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Loose, slightly uneven globe highlights -->
  <path d="M36 23            Q47 12 62 14            M75 19 Q89 28 92 43" stroke="#A8DB67" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>

  <!-- Distinctive white success check -->
  <path d="M37 49            Q39 47 42 50            L53 62            Q55 64 58 61            L78 36            Q81 33 84 36" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand-inked inner check contour -->
  <path d="M40 49            L54 63            Q56 65 59 61            L81 36" stroke="#F2F2F2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Curved globe support / meridian arc -->
  <path d="M99 15            C121 37 119 68 102 88            C81 111 49 111 29 92" stroke="#A3A3A3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rough pencil edge on support -->
  <path d="M103 19            Q118 39 113 60            M106 77            Q92 101 66 105            M45 102 Q36 99 30 94" stroke="#777777" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>

  <!-- Globe stand -->
  <path d="M62 106            Q64 113 59 118            L84 118            Q79 113 81 106" fill="#999999" stroke="#777777" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stand base -->
  <path d="M52 120            Q71 118 91 120            Q94 121 92 124            Q72 126 51 124            Q49 122 52 120 Z" fill="#A3A3A3" stroke="#777777" stroke-width="2" stroke-linejoin="round"/>

  <!-- Small yellow sketchnote success marks -->
  <path d="M103 24 L110 18            M108 32 L117 30            M101 18 L103 10" stroke="#F6B73C" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle marker flourish -->
  <path d="M15 73 Q18 80 23 84" stroke="#76BC2D" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>

</svg>

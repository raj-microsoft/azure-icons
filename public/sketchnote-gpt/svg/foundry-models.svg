  <!-- Three clean separation seams, each approximately 4px -->
  <path d="M42 15 L51 6 L55 8 L45 23Z" fill="#FFFFFF"/>
  <path d="M94 58 L98 55 L116 82 L112 86Z" fill="#FFFFFF"/>
  <path d="M21 103 L49 103 L48 107 L24 107Z" fill="#FFFFFF"/>

  <!-- Minimal fold definition -->

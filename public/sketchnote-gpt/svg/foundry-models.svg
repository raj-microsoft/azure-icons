  <desc>Three broad, separate violet folded ribbons arranged around a triangular opening, with distinct white seams, curved terminal folds, and uneven dark marker edges.</desc>

  <!-- ARM 1: upper-left to right-mid -->
  <path d="     M29 5     Q38 2 47 3     L55 4     Q63 4 68 13     L102 72     Q106 80 101 83     Q94 87 86 83     Q79 79 75 71     L42 15     Q39 11 35 13     Q31 16 29 21     L25 32     Q22 39 18 36     Q11 30 14 20     Q17 9 29 5Z" fill="#5B50F1" stroke="#29206F" stroke-width="2.4"/>


  <!-- ARM 2: right rounded fold to lower-left -->
  <path d="     M96 57     Q107 52 116 59     Q123 65 126 73     Q129 81 124 90     L111 113     Q105 123 94 123     L35 123     Q31 122 34 116     Q39 103 52 101     L97 101     Q106 101 111 92     Q115 85 110 77     Z" fill="#5144EB" stroke="#29206F" stroke-width="2.4"/>


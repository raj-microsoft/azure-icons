<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>VM Images (Classic) (sketch)</title>

  
  <desc id="desc">
    Hand-drawn Azure virtual machine image icon featuring
    a blue monitor, a central three-dimensional cube,
    four prominent L-shaped corner brackets surrounding
    the cube, and a monitor pedestal.
  </desc>

  <!-- Monitor outer frame -->
  <path d="M 8 7        Q 8 5 12 5        L 116 5        Q 121 5 121 10        L 121 89        Q 121 93 117 93        L 11 93        Q 7 93 7 89        L 7 11        Q 7 8 8 7 Z" fill="#3189DE" stroke="#203746" stroke-width="3.5"/>

  <!-- White monitor display -->
  <path d="M 15 13        Q 15 12 18 12        L 111 12        Q 114 12 114 15        L 114 83        Q 114 86 111 86        L 18 86        Q 15 86 15 83 Z" fill="#FFFFFF" stroke="#203746" stroke-width="2.5"/>

  <!-- Large upper-left corner bracket -->
  <path d="M 39 24        L 25 24        Q 22 24 22 27        L 22 43" stroke="#203746" stroke-width="6.5"/>

  <path d="M 39 24        L 25 24        Q 22 24 22 27        L 22 43" stroke="#5EA0EF" stroke-width="3.5"/>

  <!-- Large upper-right corner bracket -->
  <path d="M 89 24        L 103 24        Q 106 24 106 27        L 106 43" stroke="#203746" stroke-width="6.5"/>

  <path d="M 89 24        L 103 24        Q 106 24 106 27        L 106 43" stroke="#5EA0EF" stroke-width="3.5"/>

  <!-- Large lower-left corner bracket -->
  <path d="M 22 58        L 22 73        Q 22 76 25 76        L 39 76" stroke="#203746" stroke-width="6.5"/>

  <path d="M 22 58        L 22 73        Q 22 76 25 76        L 39 76" stroke="#5EA0EF" stroke-width="3.5"/>

  <!-- Large lower-right corner bracket -->
  <path d="M 106 58        L 106 73        Q 106 76 103 76        L 89 76" stroke="#203746" stroke-width="6.5"/>

  <path d="M 106 58        L 106 73        Q 106 76 103 76        L 89 76" stroke="#5EA0EF" stroke-width="3.5"/>

  <!-- Cube top face -->
  <path d="M 64 30        L 84 42        L 64 54        L 44 42 Z" fill="#83B9F9" stroke="#203746" stroke-width="2.8"/>

  <!-- Cube left face -->
  <path d="M 44 42        L 64 54        L 64 78        L 44 66 Z" fill="#5EA0EF" stroke="#203746" stroke-width="2.8"/>

  <!-- Cube right face -->
  <path d="M 64 54        L 84 42        L 84 66        L 64 78 Z" fill="#0078D4" stroke="#203746" stroke-width="2.8"/>

  <!-- Monitor stand neck -->
  <path d="M 52 93        L 76 93        Q 75 104 79 112        Q 81 115 85 116        L 43 116        Q 48 114 50 110        Q 53 103 52 93 Z" fill="#1F65B6" stroke="#203746" stroke-width="3"/>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Alerts (sketch)</title>

  
  <desc>Hand-drawn green Azure Alerts notification bubble with a prominent white exclamation mark, uneven marker outlines, subtle highlights, and restrained yellow accents on a transparent background.</desc>

  <defs>
    <linearGradient id="alertGreen" x1="64" y1="15" x2="64" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86D633"/>
      <stop offset=".35" stop-color="#7FCB30"/>
      <stop offset=".68" stop-color="#6DAE2A"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>

    <linearGradient id="alertHighlight" x1="22" y1="24" x2="100" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8EB70"/>
      <stop offset="1" stop-color="#86D633"/>
    </linearGradient>
  </defs>

  <!-- Main notification bubble -->
  <path d="M13 20            Q13 15 19 15            L109 16            Q115 16 115 22            L114 92            Q114 97 109 97            L82 97            Q80 97 80 100            L80 113            Q80 118 76 115            L57 99            Q55 97 52 97            L19 98            Q13 98 13 92            Z" fill="url(#alertGreen)" stroke="#3F7521" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Uneven marker highlight along top and left -->
  <path d="M21 30            L21 25            Q21 23 25 23            Q61 22 104 24            M21 37            Q20 56 21 80" stroke="#D3F49B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>

  <!-- Subtle hand-drawn inner contour -->
  <path d="M105 32            Q106 54 105 85            Q105 89 101 89            M48 89            L29 89" stroke="#4D8E27" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <!-- White alert exclamation stem -->
  <path d="M58 32            Q58 29 61 29            L69 29            Q72 29 72 32            L70 67            Q70 70 67 70            L63 70            Q60 70 60 67            Z" fill="#FFFFFF" stroke="#477E27" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Exclamation highlight -->
  <path d="M63 36            L64 60" stroke="#D7EBF5" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>

  <!-- White alert exclamation dot -->
  <path d="M64 77            Q69 76 71 80            Q73 85 69 88            Q64 91 60 87            Q57 83 60 79            Q62 77 64 77Z" fill="#FFFFFF" stroke="#477E27" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small yellow sketchnote emphasis -->
  <path d="M119 31            L124 27            M120 40            L126 40            M119 49            L124 53" stroke="#FFD34E" stroke-width="3" stroke-linecap="round"/>

  <!-- Hand-drawn alert motion strokes -->
  <path d="M7 34            Q4 38 4 44            M6 54            L5 59" stroke="#FFD34E" stroke-width="3" stroke-linecap="round"/>

  <!-- Small sketch accent near tail -->
  <path d="M86 108            Q91 110 97 108" stroke="#86D633" stroke-width="2.5" stroke-linecap="round"/>

</svg>

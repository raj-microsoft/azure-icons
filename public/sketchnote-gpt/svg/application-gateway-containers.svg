  <!-- Bottom endpoint -->
  <path d="M64 105            C71 105 76 110 76 117            C76 123 71 126 64 126            C57 126 52 123 52 117            C52 110 57 105 64 105 Z" fill="#83B9F9" stroke-width="3.2"/>

</svg>

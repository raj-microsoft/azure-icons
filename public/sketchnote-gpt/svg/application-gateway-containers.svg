<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke="#203746" stroke-linecap="round" stroke-linejoin="round"><title>Application Gateway Containers (sketch)</title>

  
  <desc>Blue hexagonal gateway with a central routing hub connected independently to one upper endpoint and three lower endpoints.</desc>

  <!-- Outer hexagonal gateway -->
  <path d="M35 8            Q38 6 41 7            L87 7            Q91 7 93 11            L119 59            Q121 63 119 67            L93 113            Q91 117 87 118            L41 118            Q37 118 35 115            L9 68            Q6 64 9 59            L35 11 Z" fill="#0078D4" stroke-width="3.8"/>


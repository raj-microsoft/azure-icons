  <!-- Three independent outgoing spokes -->
  <path d="M58 72            Q42 88 22 105" stroke="#FFFFFF" stroke-width="8"/>

  <path d="M70 72            Q87 88 106 105" stroke="#FFFFFF" stroke-width="8"/>

  <path d="M64 75            Q63 93 64 112" stroke="#FFFFFF" stroke-width="8"/>


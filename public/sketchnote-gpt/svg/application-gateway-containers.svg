<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Application Gateway Containers (sketch)</title>

  
  <desc>
    Hand-drawn Azure Application Gateway Containers icon
    with a blue hexagonal gateway, branching routing paths,
    connected circular endpoints, and subtle yellow accents.
  </desc>

  <defs>
    <linearGradient id="gatewayBlue" x1="64" y1="8" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>

    <linearGradient id="nodeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#83B9F9"/>
      <stop offset="1" stop-color="#5EA0EF"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn hexagonal gateway silhouette -->
  <path d="M35 8        Q37 6 41 7        L87 7        Q91 7 93 11        L119 59        Q121 63 119 67        L93 113        Q91 117 87 118        L41 118        Q37 118 35 115        L9 68        Q6 64 9 59        L35 11Z" fill="url(#gatewayBlue)" stroke="#004F8B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Uneven inner marker contour -->
  <path d="M39 13        L86 13        L113 63        L86 111        L42 111        L15 64        L39 13Z" stroke="#5EA0EF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="22 3 9 3" opacity="0.65"/>

  <!-- Subtle interior sketch highlights -->
  <path d="M39 19 L23 49        M90 19 L105 47        M43 106 L31 86" stroke="#83B9F9" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Central white connection stem -->
  <path d="M64 21        C63 30 64 38 64 47" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>

  <!-- Central gateway hub ring -->
  <path d="M64 45        C76 44 83 53 83 64        C83 76 75 84 64 84        C52 84 45 76 45 64        C45 52 53 45 64 45Z" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner hand-drawn hub shading -->
  <path d="M52 57        C55 51 61 49 67 51" stroke="#BDE7FF" stroke-width="2.3" stroke-linecap="round" opacity="0.8"/>

  <!-- Central hub node -->
  <path d="M64 54        C70 54 74 58 74 64        C74 70 70 74 64 74        C58 74 54 70 54 64        C54 58 58 54 64 54Z" fill="url(#nodeBlue)" stroke="#D6EDFF" stroke-width="2.4" stroke-linejoin="round"/>

  <path d="M60 59 Q63 57 67 59" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Three-way application routing paths -->
  <path d="M64 75        L64 112        M58 72        L22 105        M70 72        L106 105" stroke="#004A82" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M64 75        C64 88 64 100 64 112        M58 72        C46 83 34 95 22 105        M70 72        C82 83 94 95 106 105" stroke="#C9C9C9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fine silver marker edge -->
  <path d="M61 86 L61 102        M43 88 L32 98        M85 88 L96 98" stroke="#F4F4F4" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Top incoming connection node -->
  <path d="M64 12        C70 12 75 17 75 23        C75 29 70 34 64 34        C58 34 53 29 53 23        C53 17 58 12 64 12Z" fill="#FFFFFF" stroke="#E8F5FF" stroke-width="2"/>

  <path d="M64 15        C69 15 72 18 72 23        C72 28 69 31 64 31        C59 31 56 28 56 23        C56 18 59 15 64 15Z" fill="url(#nodeBlue)" stroke="#0067B8" stroke-width="2.4"/>

  <path d="M60 20 Q63 18 67 20" stroke="#EAF8FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Left outgoing endpoint -->
  <path d="M22 94        C29 94 34 99 34 106        C34 113 29 118 22 118        C15 118 10 113 10 106        C10 99 15 94 22 94Z" fill="#FFFFFF" stroke="#005BA1" stroke-width="3"/>

  <path d="M22 98        C27 98 30 101 30 106        C30 111 27 114 22 114        C17 114 14 111 14 106        C14 101 17 98 22 98Z" fill="url(#nodeBlue)" stroke="#D9F0FF" stroke-width="1.5"/>

  <!-- Right outgoing endpoint -->
  <path d="M106 94        C113 94 118 99 118 106        C118 113 113 118 106 118        C99 118 94 113 94 106        C94 99 99 94 106 94Z" fill="#FFFFFF" stroke="#005BA1" stroke-width="3"/>

  <path d="M106 98        C111 98 114 101 114 106        C114 111 111 114 106 114        C101 114 98 111 98 106        C98 101 101 98 106 98Z" fill="url(#nodeBlue)" stroke="#D9F0FF" stroke-width="1.5"/>

  <!-- Bottom outgoing endpoint -->
  <path d="M64 105        C71 105 76 110 76 117        C76 123 71 126 64 126        C57 126 52 123 52 117        C52 110 57 105 64 105Z" fill="#FFFFFF" stroke="#005BA1" stroke-width="3"/>

  <path d="M64 109        C69 109 72 112 72 117        C72 121 69 123 64 123        C59 123 56 121 56 117        C56 112 59 109 64 109Z" fill="url(#nodeBlue)" stroke="#D9F0FF" stroke-width="1.5"/>

  <!-- Restrained yellow sketchnote highlights -->
  <path d="M85 43 L91 39        M89 49 L96 47" stroke="#F4C542" stroke-width="2.8" stroke-linecap="round"/>

  <path d="M38 72 L33 76        M40 78 L36 83" stroke="#F4C542" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tiny hand-drawn annotation marks -->
  <path d="M40 27 L44 24        M45 31 L49 29" stroke="#83B9F9" stroke-width="2" stroke-linecap="round"/>

  <path d="M88 89 L92 92        M82 94 L86 98" stroke="#83B9F9" stroke-width="1.8" stroke-linecap="round"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" width="128" height="128"><title>Storage Actions (sketch)</title>
  <defs>
    <linearGradient id="storageTop" x1="28" y1="12" x2="95" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9D8FF"/>
      <stop offset="1" stop-color="#83B9F9"/>
    </linearGradient>
    <linearGradient id="storageBody" x1="30" y1="37" x2="90" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2995EA"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="actionPurple" x1="84" y1="70" x2="111" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#552F99"/>

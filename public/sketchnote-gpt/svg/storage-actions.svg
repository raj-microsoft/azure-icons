  </defs>

  <!-- Storage cylinder -->
  <path d="M18 29     C18 20 38 14 63 14     C88 14 108 20 108 29     L108 91     C108 100 88 107 63 107     C38 107 18 100 18 91 Z" fill="url(#storageBody)" stroke="#005A9E" stroke-width="3.5" stroke-linejoin="round"/>


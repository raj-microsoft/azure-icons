<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Deployment Environments (sketch)</title>

  
  <desc>
    Hand-drawn Azure blue deployment cloud with a white upward
    deployment arrow, resting above a turquoise environment platform.
    Preserves the original Azure blue, teal and white palette.
    Uneven marker outlines, restrained yellow sketch accents,
    transparent background and editable vector paths.
  </desc>

  <defs>
    <linearGradient id="deploymentCloud" x1="64" y1="8" x2="64" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".53" stop-color="#3C91E5"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="environmentTeal" x1="64" y1="96" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CD4C2"/>
      <stop offset="1" stop-color="#37C2B1"/>
    </linearGradient>
  </defs>

  <!-- Main Azure deployment cloud -->
  <path d="M37 88            C21 89 9 78 8 62            C7 45 19 32 34 30            C39 15 51 7 66 8            C83 7 96 19 99 35            C114 36 123 48 123 63            C123 77 112 88 97 89            Z" fill="url(#deploymentCloud)" stroke="#005BA1" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Soft irregular cloud highlights -->
  <path d="M17 52            Q20 38 36 37            Q43 18 62 16            Q76 14 85 24" stroke="#B6DEFF" stroke-width="2.8" stroke-linecap="round" fill="none" opacity=".8"/>

  <path d="M105 43            Q116 50 115 63" stroke="#8AC9FF" stroke-width="2" stroke-linecap="round" fill="none" opacity=".75"/>

  <!-- White upward deployment arrow -->
  <path d="M44 49            L61 32            Q64 29 67 32            L84 49            Q86 52 82 53            L73 53            L73 84            Q73 87 70 87            L58 87            Q55 87 55 84            L55 53            L46 53            Q42 53 44 49Z" fill="#F2F2F2" stroke="#D9EBFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand-drawn arrow highlight -->
  <path d="M59 80            L59 49            L51 49            L64 37" stroke="#A9CFF0" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".85"/>

  <path d="M69 58 L69 79" stroke="#FFFFFF" stroke-width="1.7" stroke-linecap="round" opacity=".8"/>

  <!-- Environment platform: top surface -->
  <path d="M25 98            Q27 96 31 96            L99 96            Q102 96 105 99            L122 116            L7 116            Z" fill="url(#environmentTeal)" stroke="#218F87" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Platform front edge -->
  <path d="M7 116            L122 116            L122 121            Q122 124 118 124            L11 124            Q7 124 7 121            Z" fill="#3CD4C2" stroke="#218F87" stroke-width="3" stroke-linejoin="round"/>

  <!-- Subtle platform surface highlight -->
  <path d="M30 102            Q35 100 41 100            L94 100" stroke="#B9FFF2" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>

  <path d="M17 112 L111 112" stroke="#75E8D9" stroke-width="1.8" stroke-linecap="round" opacity=".75"/>

  <!-- Small environment layer details -->
  <g stroke="#239F94" stroke-width="1.8" stroke-linecap="round" fill="none">

    <path d="M22 119 L37 119"/>
    <path d="M43 119 L54 119"/>
    <path d="M89 119 L105 119"/>

  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4C542" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Deployment sparkle -->
    <path d="M109 17 L109 26"/>
    <path d="M105 21 L114 21"/>

    <!-- Cloud emphasis -->
    <path d="M14 23 L19 28"/>
    <path d="M9 30 L15 33"/>

    <!-- Environment activation marks -->
    <path d="M110 93 L115 89"/>
    <path d="M114 99 L120 96"/>

  </g>

  <!-- Handwritten-style sketch motion details -->
  <g stroke="#0078D4" stroke-width="1.7" stroke-linecap="round" fill="none" opacity=".65">

    <path d="M17 91 Q22 94 28 93"/>
    <path d="M99 91 Q106 89 110 85"/>
    <path d="M37 6 Q44 3 50 5"/>

  </g>

  <!-- Small teal finishing strokes -->
  <g stroke="#239F94" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".7">

    <path d="M13 126 L28 126"/>
    <path d="M99 126 L114 126"/>

  </g>

</svg>

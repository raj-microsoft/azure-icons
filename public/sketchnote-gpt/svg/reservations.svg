    <path d="M91 25 L96 20          M111 63 L120 63          M96 105 L101 110          M63 111 L63 120          M25 100 L20 105          M12 63 L21 63          M29 25 L24 20" fill="none" stroke="#777777" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Purple circular reservation arrow -->
    <path d="M63 7          C94 7 119 32 121 62          C124 93 102 119 72 122          C43 126 16 105 8 77          C2 55 9 34 23 20          L17 12          L41 9          L31 33          L27 26          C13 40 8 59 13 77          C20 103 43 119 70 115          C96 112 115 91 114 65          C113 38 91 16 64 15          C60 15 57 13 57 10          C57 8 60 7 63 7Z" fill="url(#reservationPurple)" stroke="#553b8c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Clock hand: vertical -->
    <path d="M62 25          C65 24 67 26 67 29          L67 64          C67 67 65 69 63 69          C61 69 59 67 59 64          L59 30          C59 27 60 25 62 25Z" fill="#777777" stroke="#555555" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Clock hand: diagonal -->
    <path d="M68 65          C70 63 73 64 75 66          L91 82          C93 84 93 87 91 89          C89 91 86 91 84 89          L68 73          C66 71 66 67 68 65Z" fill="#777777" stroke="#555555" stroke-width="1.8" stroke-linejoin="round"/>


    <circle cx="63" cy="65" r="8" fill="url(#reservationCenter)" stroke="#555555" stroke-width="1.8"/>

    <circle cx="63" cy="65" r="3" fill="#d9d9d9"/>

    <!-- Sketchnote marker accents -->
    <path d="M29 40          C35 29 46 21 57 19          M84 106          C96 99 104 88 108 76" fill="none" stroke="#9a7bd0" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Small highlight strokes -->
    <path d="M17 49 L14 58          M43 113 L50 116          M108 41 L112 49" fill="none" stroke="#d1baff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Yellow reservation emphasis -->
    <path d="M102 17 L110 10          M112 25 L119 22" fill="none" stroke="#ffca00" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>

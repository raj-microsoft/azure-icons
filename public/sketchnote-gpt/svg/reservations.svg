<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Reservations (sketch)</title>

  <defs>
    <radialGradient id="reservationPurple" cx="63" cy="62" r="59" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7956ba"/>
      <stop offset="0.69" stop-color="#724eb4"/>
      <stop offset="0.87" stop-color="#6f4bb2"/>
      <stop offset="1" stop-color="#6542a8"/>
    </radialGradient>
    <radialGradient id="reservationCenter" cx="63" cy="64" r="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#858585"/>
      <stop offset="1" stop-color="#505050"/>
    </radialGradient>
  </defs>

  <g>
    <!-- Outer clock casing -->
    <circle cx="63" cy="65" r="59" fill="#b0b0b0" stroke="#555555" stroke-width="3.5" stroke-linecap="round"/>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Container Services (Deprecated) (sketch)</title>

  
  <desc>
    Seven hand-drawn purple shipping containers in a staggered
    two-three-two arrangement, preserving the original Azure
    Container Services icon. Uneven marker strokes, violet
    gradients, dark indigo container doors, small cyan and
    yellow sketchnote accents, and a transparent background.
    Standalone editable SVG.
  </desc>

  <defs>
    <linearGradient id="containerPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B77AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Top-left container -->
  <g>
    <path d="M28 11 L43 8 L62 14 L47 19 Z" fill="#C69AF8" stroke="#773ADC" stroke-width="2.2"/>
    <path d="M28 11 L47 19 L47 43 L28 38 Z" fill="url(#containerPurple)" stroke="#552F99" stroke-width="2.6"/>
    <path d="M47 19 L62 14 L62 36 L47 43 Z" fill="#773ADC" stroke="#552F99" stroke-width="2.6"/>
    <path d="M33 16 L33 36 M40 19 L40 38" stroke="#341A6E" stroke-width="3.2"/>
    <path d="M50 24 L58 21" stroke="#B77AF4" stroke-width="2"/>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Integration Accounts (sketch)</title>
  
  <desc>Hand-drawn Azure Integration Accounts icon with a blue document frame and six colorful application tiles arranged in a staggered grid.</desc>

  <defs>
    <linearGradient id="purpleTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B77AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn Azure-blue account frame -->
  <path d="M11 8            Q9 8 9 12            L9.5 115            Q10 119 14 119            L115 119            Q119 118 119 114            L118 12            Q118 9 114 9            Z" fill="#0078D4" stroke="#005A9E" stroke-width="3.5"/>

  <!-- Irregular inner white document area -->
  <path d="M20 20            L107 20.5            L108 107            Q108 109 105 109            L23 109            Q20 109 20 106            Z" fill="#FFFFFF" stroke="#005A9E" stroke-width="2.5"/>

  <!-- Yellow integration tile -->
  <path d="M29 29 L49 28.5 L49.5 49 L29 49.5 Z" fill="#FFCA00" stroke="#9A7000" stroke-width="2.6"/>
  <path d="M33 32.5 L43 32" stroke="#FFE680" stroke-width="2"/>

  <!-- Red integration tile, middle left -->
  <path d="M29.5 57 L49 56.5 L49.5 77 L29 77.5 Z" fill="#E62323" stroke="#9B1920" stroke-width="2.6"/>
  <path d="M33 60 L43 59.5" stroke="#FF8585" stroke-width="1.8"/>

  <!-- Light Azure-blue integration tile -->
  <path d="M57 57 L77 56.5 L77.5 77 L57 77.5 Z" fill="#5EA0EF" stroke="#1764B3" stroke-width="2.6"/>
  <path d="M61 60.5 L71 60" stroke="#B8E3FF" stroke-width="1.8"/>

  <!-- Purple integration tile, bottom left -->
  <path d="M29 85 L49.5 84.5 L49 105 L29.5 105 Z" fill="url(#purpleTile)" stroke="#6331AA" stroke-width="2.6"/>
  <path d="M33 88 L43 87.5" stroke="#D8B4FE" stroke-width="1.8"/>

  <!-- Red integration tile, bottom center -->
  <path d="M57 85 L77.5 84.5 L77 105 L57.5 105 Z" fill="#E62323" stroke="#9B1920" stroke-width="2.6"/>
  <path d="M61 88 L71 87.5" stroke="#FF8585" stroke-width="1.8"/>

  <!-- Purple integration tile, bottom right -->
  <path d="M85 85 L105 84.5 L105.5 105 L85 105 Z" fill="url(#purpleTile)" stroke="#6331AA" stroke-width="2.6"/>
  <path d="M89 88 L99 87.5" stroke="#D8B4FE" stroke-width="1.8"/>

  <!-- Subtle hand-drawn integration connectors -->
  <path d="M39 50 L39 55" stroke="#0078D4" stroke-width="2" stroke-dasharray="2 3"/>
  <path d="M50 67 L56 67" stroke="#0078D4" stroke-width="2" stroke-dasharray="2 3"/>
  <path d="M39 78 L39 83" stroke="#0078D4" stroke-width="2" stroke-dasharray="2 3"/>
  <path d="M67 78 L67 83" stroke="#0078D4" stroke-width="2" stroke-dasharray="2 3"/>
  <path d="M78 95 L83 95" stroke="#0078D4" stroke-width="2" stroke-dasharray="2 3"/>

  <!-- Small sketchnote-style marker accents -->
  <path d="M85 35 L91 29 M89 39 L97 32" stroke="#FFCA00" stroke-width="2.5"/>
  <path d="M86 49 Q94 45 102 48" stroke="#0078D4" stroke-width="2.2"/>
</svg>

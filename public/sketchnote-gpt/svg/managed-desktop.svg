<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Managed Desktop (sketch)</title>
  

  <defs>
    <linearGradient id="screen-blue" x1="9" y1="12.68" x2="9" y2=".68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset=".82" stop-color="#5ea0ef"/>
    </linearGradient>
    <linearGradient id="stand-blue" x1="9" y1="17.32" x2="9" y2="12.68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1490df"/>
      <stop offset=".98" stop-color="#1f56a3"/>
    </linearGradient>
  </defs>

  <g transform="scale(7.111111)" stroke-linejoin="round" stroke-linecap="round">

    <!-- Desktop monitor outer frame -->
    <rect y=".68" width="18" height="12" rx=".6" fill="url(#screen-blue)"/>

    <!-- White screen -->
    <rect x="1" y="1.68" width="16" height="10" rx=".33" fill="#fff"/>

    <!-- Monitor stand and base -->
    <path d="M12.61 16.31c-1.78-.28-1.85-1.56-1.84-3.63H7.23c0 2.07-.06 3.35-1.84 3.63a1.05 1.05 0 0 0-.89 1h9a1.05 1.05 0 0 0-.89-1Z" fill="url(#stand-blue)"/>

    <!-- Original green checkmark: first stroke -->
    <path d="M6 5.79h.95a.29.29 0 0 1 .29.29v3.76a.29.29 0 0 1-.29.29h-.65A.29.29 0 0 1 6 9.84v-4a0 0 0 0 1 0-.05Z" transform="translate(16.92 8.92) rotate(135)" fill="#86d633"/>

    <!-- Original darker green checkmark: second stroke -->
    <path d="M10.11 1.88h.95a0 0 0 0 1 0 0v8.63a.29.29 0 0 1-.29.29h-.65a.29.29 0 0 1-.29-.29V2.17a.29.29 0 0 1 .29-.29Z" transform="translate(13.33 18.21) rotate(-135)" fill="#5e9624"/>

  </g>
</svg>

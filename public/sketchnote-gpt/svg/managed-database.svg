<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Managed Database (sketch)</title>
  
  <desc>Azure database cylinder with cyan elliptical opening and overlapping turquoise managed cloud containing a white M symbol. No checkmark.</desc>

  <!-- Database cylinder -->
  <path d="M5.5 22            C5.5 12.5 24 7.5 46.5 7.5            C69 7.5 88.5 13 88.5 22            L88.5 103            C88 113 70 119 47 119            C24 119 6 113 5.5 103 Z" fill="#0071C8" stroke="#173F60" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Database top ellipse -->
  <path d="M5.5 22            C5.5 12.5 24 7.5 46.5 7.5            C69 7.5 88.5 13 88.5 22            C88.5 32 70 38 47 38            C24 38 5.5 32 5.5 22 Z" fill="#EAEAEA" stroke="#174F79" stroke-width="3.2"/>

  <!-- Cyan opening -->
  <path d="M15 21            C15 15 29 12 47 12            C65 12 79 16 79 21            C79 27 65 31 47 31            C29 31 15 27 15 21 Z" fill="#50E6FF" stroke="#198AB3" stroke-width="2.2"/>

  <!-- Inner database depth -->
  <path d="M21 27            Q32 22.5 47 22.5            Q62 22.5 73 27            Q63 30.5 47 30.5            Q32 30.5 21 27 Z" fill="#198AB3"/>

  <!-- Cylinder marker contours -->
  <path d="M11 39 Q12 64 11 94" stroke="#50B5F0" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <path d="M83 39 Q82 54 83 66" stroke="#005BA1" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <path d="M12 54 Q30 62 49 61 Q68 61 82 55" stroke="#50E6FF" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <path d="M12 104 Q28 113 46 113" stroke="#50B5F0" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <!-- Managed cloud: no additional checkmark -->
  <path d="M65 120            C52 120 43 111 43 100            C43 89 51 81 62 79            C67 66 78 61 90 63            C102 65 109 73 110 84            C120 86 125 94 124 102            C124 113 116 120 105 120 Z" fill="#2EC9EB" stroke="#14566B" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cloud subtle marker details -->
  <path d="M51 96 Q53 86 63 86" stroke="#A3F3FF" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M70 76 Q78 67 88 70" stroke="#A3F3FF" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M114 92 Q120 97 118 105" stroke="#198AB3" stroke-width="1.8" stroke-linecap="round"/>

  <!-- White managed M glyph -->
  <path d="M69 110            L69 84            L78 84            L85 102            L92 84            L101 84            L101 110            L95 110            L95 91            L88 110            L82 110            L75 91            L75 110 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>

  <!-- Azure-blue accent -->
  <path d="M103 56 Q109 61 112 67" stroke="#0078D4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Yellow sketchnote accents -->
  <path d="M113 53 L117 47            M119 59 L125 56            M108 49 L109 43" stroke="#F5C542" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Small yellow decorative mark (not a checkmark) -->
  <path d="M19 77 L21 75" stroke="#F5C542" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Subtle underline -->
  <path d="M52 124 Q81 126 108 124" stroke="#0078D4" stroke-width="1.7" stroke-linecap="round" opacity=".45"/>
</svg>

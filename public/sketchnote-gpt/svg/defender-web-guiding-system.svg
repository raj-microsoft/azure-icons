<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Defender Web Guiding System (sketch)</title>
  
  <desc>Simple blue rectangular machine control panel suspended within a curved guiding frame, with two small side rollers.</desc>

  <!-- Curved upper guiding frame -->
  <path d="M27 69 L27 57            Q27 43 41 43            L87 43            Q101 43 101 57            L101 69" stroke="#263F50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M28 57 Q29 46 41 46            L87 46 Q99 46 100 57" stroke="#5EA0EF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Side support arms -->
  <path d="M27 67 Q27 85 13 85 L9 84            M101 67 Q101 85 115 85 L119 84" stroke="#263F50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M23 72 Q22 80 15 80            M105 72 Q106 80 113 80" stroke="#5EA0EF" stroke-width="2" stroke-linecap="round"/>

  <!-- Simple central machine panel -->
  <path d="M36 63            Q36 60 40 60            L88 60            Q92 60 92 64            L92 86            Q92 90 88 90            L40 90            Q36 90 36 86 Z" fill="#3C91E5" stroke="#263F50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flat panel face: no screen, buttons or upper markings -->
  <path d="M41 65 Q54 63 67 65" stroke="#70B5F2" stroke-width="1.8" stroke-linecap="round" opacity=".8"/>

  <!-- Small panel corner fasteners -->
  <g fill="#D9EEFF" stroke="#263F50" stroke-width="1.2">
    <circle cx="42.5" cy="66.5" r="1.7"/>
    <circle cx="85.5" cy="66.5" r="1.7"/>
    <circle cx="42.5" cy="83.5" r="1.7"/>
    <circle cx="85.5" cy="83.5" r="1.7"/>
  </g>

  <!-- Left roller -->
  <g transform="translate(14 73)">
    <circle r="13" fill="#1680D2" stroke="#263F50" stroke-width="3.5"/>
    <path d="M-3 -10 Q-10 -4 -9 3 L-3 3 Q-2 -3 3 -8 Z" fill="#83B9F9" stroke="#263F50" stroke-width="1"/>
    <path d="M5 -8 Q11 -4 10 4 L4 2 Q2 -3 5 -8 Z" fill="#0078D4" stroke="#263F50" stroke-width="1"/>
    <path d="M-9 6 Q-4 12 4 10 L2 4 Q-4 7 -9 6 Z" fill="#5EA0EF" stroke="#263F50" stroke-width="1"/>
    <circle r="4.5" fill="#D9EEFF" stroke="#263F50" stroke-width="2"/>
    <circle r="1.4" fill="#004C87"/>
  </g>

  <!-- Right roller -->
  <g transform="translate(114 73)">
    <circle r="13" fill="#1680D2" stroke="#263F50" stroke-width="3.5"/>
    <path d="M-3 -10 Q-10 -4 -9 3 L-3 3 Q-2 -3 3 -8 Z" fill="#83B9F9" stroke="#263F50" stroke-width="1"/>
    <path d="M5 -8 Q11 -4 10 4 L4 2 Q2 -3 5 -8 Z" fill="#0078D4" stroke="#263F50" stroke-width="1"/>
    <path d="M-9 6 Q-4 12 4 10 L2 4 Q-4 7 -9 6 Z" fill="#5EA0EF" stroke="#263F50" stroke-width="1"/>
    <circle r="4.5" fill="#D9EEFF" stroke="#263F50" stroke-width="2"/>
    <circle r="1.4" fill="#004C87"/>
  </g>

  <!-- Subtle yellow alignment accents -->
  <path d="M18 49 L14 45            M110 49 L114 45" stroke="#FFCF45" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hand-drawn lower motion strokes -->
  <path d="M45 97 Q64 100 83 97            M53 103 Q64 105 76 103" stroke="#0078D4" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/>

</svg>

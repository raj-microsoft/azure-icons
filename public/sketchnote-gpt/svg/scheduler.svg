<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Scheduler (sketch)</title>
  
  <desc>Azure-blue circular clock with a white dial, gray hands and tick marks, surrounded by a green scheduling arrow and subtle yellow marker accents.</desc>

  <defs>
    <radialGradient id="clockBlue" cx="48%" cy="42%" r="65%">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".6" stop-color="#3990E4"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>
    <radialGradient id="clockHub" cx="40%" cy="35%" r="70%">
      <stop stop-color="#7F7F7F"/>
      <stop offset="1" stop-color="#5E5E5E"/>
    </radialGradient>
  </defs>

  <!-- Main Azure clock rim -->
  <path d="M69 9            C98 9 118 32 118 61            C118 90 96 113 67 113            C38 113 16 91 16 62            C16 32 39 9 69 9Z" fill="url(#clockBlue)" stroke="#155C99" stroke-width="3.5"/>

  <!-- White clock face -->
  <path d="M69 17            C94 17 110 37 110 61            C110 86 92 105 68 105            C44 105 25 86 25 62            C25 37 44 17 69 17Z" fill="#FFFFFF" stroke="#B9DEFF" stroke-width="2.7"/>

  <!-- Uneven inner dial highlight -->
  <path d="M32 49 Q39 27 62 24            M78 24 Q97 29 103 47            M102 76 Q95 95 76 99" stroke="#D9EFFF" stroke-width="2" opacity=".85"/>

  <!-- Hand-drawn clock hour marks -->
  <g stroke="#7A7A7A" stroke-width="3.4">
    <path d="M69 23 L69 30"/>
    <path d="M69 94 L69 99"/>
    <path d="M30 61 L36 61"/>
    <path d="M101 61 L106 61"/>
    <path d="M43 35 L47 39"/>
    <path d="M91 35 L87 39"/>
    <path d="M43 87 L47 83"/>
    <path d="M91 87 L87 83"/>
  </g>

  <!-- Clock hour hand -->
  <path d="M69 61            Q70 45 69 26" stroke="#7A7A7A" stroke-width="7"/>

  <!-- Clock minute hand -->
  <path d="M69 61            Q80 72 87 80" stroke="#7A7A7A" stroke-width="7"/>

  <!-- Subtle hand-drawn hand highlights -->
  <path d="M67 31 L67 51            M75 66 L84 76" stroke="#B6B8BA" stroke-width="1.6" opacity=".75"/>

  <!-- Central clock pivot -->
  <path d="M69 54            C73 54 76 57 76 61            C76 65 73 68 69 68            C65 68 62 65 62 61            C62 57 65 54 69 54Z" fill="url(#clockHub)" stroke="#5E5E5E" stroke-width="2"/>

  <path d="M66 58 Q69 56 72 59" stroke="#D2D2D2" stroke-width="1.8"/>

  <!-- Green scheduling and renewal arrow -->
  <path d="M57 10            C34 13 16 29 10 49            C0 79 15 106 38 116" stroke="#86D633" stroke-width="7.5"/>

  <!-- Curved arrowhead -->
  <path d="M31 105            L41 122            L22 125" stroke="#86D633" stroke-width="7"/>

  <!-- Green marker highlights -->
  <path d="M47 15            C28 21 17 36 14 53            M12 80            Q18 101 34 111" stroke="#C1EE86" stroke-width="2.2" opacity=".9"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M112 17 L118 11            M118 27 L125 24" stroke="#FFCA45" stroke-width="3.2"/>

  <path d="M115 104 L122 109            M105 113 L107 121" stroke="#FFCA45" stroke-width="3"/>

  <!-- Tiny hand-drawn sparkle -->
  <path d="M100 4 L100 12            M96 8 L104 8" stroke="#FFCA45" stroke-width="2.7"/>
</svg>

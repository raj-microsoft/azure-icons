<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Cognitive Services (sketch)</title>
  
  <desc>
    Hand-drawn Azure Cognitive Services cloud with five
    interconnected circuit nodes. Original Azure-blue gradient,
    pale cyan and white circuitry, irregular marker outlines,
    restrained yellow accents, and transparent background.
    Fully editable vector paths.
  </desc>

  <defs>
    <linearGradient id="cognitiveCloud" x1="64" y1="17" x2="64" y2="113" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".18" stop-color="#559CEC"/>
      <stop offset=".47" stop-color="#3C91E5"/>
      <stop offset=".84" stop-color="#1380DA"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Main Azure cognitive cloud silhouette -->
  <path d="M36 111            C19 113 7 101 7 85            C6 70 16 58 31 55            C38 36 52 23 73 23            C95 22 110 38 111 58            C123 61 127 72 126 84            C125 100 113 111 98 111            Z" fill="url(#cognitiveCloud)" stroke="#075A9E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>


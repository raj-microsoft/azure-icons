  <path d="M12 68            Q19 57 31 54            M38 45            Q51 20 75 20            M100 34            Q113 45 114 58            M121 96            Q114 107 101 110" stroke="#1678C8" stroke-width="2.1" stroke-linecap="round" opacity=".8"/>


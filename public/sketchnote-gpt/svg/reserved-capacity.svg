<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title>Reserved Capacity (sketch)</title>

  
  <desc id="desc">Hand-drawn isometric purple reserved capacity cube with layered diamond faces and marker-style outlines.</desc>

  <defs>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc92bf"/>
      <stop offset="1" stop-color="#a33a85"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ce74b6"/>
      <stop offset="1" stop-color="#59285f"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a33a85"/>
      <stop offset="1" stop-color="#59285f"/>
    </linearGradient>
  </defs>

  <!-- Isometric cube: top -->
  <path d="M64 12            L113 40            L64 69            L15 40            Z" fill="url(#topFace)" stroke="#87316f" stroke-width="3" stroke-linejoin="round"/>

  <!-- Left face -->
  <path d="M15 40            L64 69            L64 116            L15 87            Z" fill="url(#leftFace)" stroke="#59285f" stroke-width="3" stroke-linejoin="round"/>

  <!-- Right face -->
  <path d="M113 40            L64 69            L64 116            L113 87            Z" fill="url(#rightFace)" stroke="#59285f" stroke-width="3" stroke-linejoin="round"/>

  <!-- Top surface highlight -->
  <path d="M64 12 Q87 25 110 40" fill="none" stroke="#f1c4df" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M18 39 L64 66 L107 40" fill="none" stroke="#e9b5d5" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- Central capacity layer -->
  <path d="M15 61            L64 90            L113 61" fill="none" stroke="#a33a85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M15 61            L64 90            L64 116" fill="none" stroke="#ce74b6" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>

  <!-- Lower structural edge -->
  <path d="M17 87 L64 115 L111 87" fill="none" stroke="#4d2054" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hand-drawn marker details -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27 44 L62 64" stroke="#f4d5e9" stroke-width="2" opacity=".75"/>
    <path d="M72 63 L102 45" stroke="#e6acd0" stroke-width="2" opacity=".65"/>
    <path d="M24 73 L56 92" stroke="#d99bc6" stroke-width="1.8" opacity=".65"/>
    <path d="M73 94 L104 75" stroke="#b96ca4" stroke-width="1.8" opacity=".65"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g fill="none" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round">
    <path d="M104 20 L110 16"/>
    <path d="M114 27 L119 25"/>
    <path d="M10 96 L6 100"/>
  </g>

  <!-- Subtle hand-drawn contour -->
  <path d="M64 10 Q88 24 115 39            Q117 40 116 43            L116 88            Q115 90 113 91            L66 119            Q64 121 62 119            L14 90            Q12 89 12 86            L12 42            Q12 39 15 38" fill="none" stroke="#713064" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>

</svg>

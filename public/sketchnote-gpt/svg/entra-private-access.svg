<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Entra Private Access (sketch)</title>
  
  <desc>Hand-drawn Azure globe with grid lines confined to its left hemisphere, a solid blue right hemisphere, and an overlapping green padlock with a white arched shackle and white keyhole.</desc>

  <!-- Globe: flat cyan circular field -->
  <path d="M58 6            C85 6 105 25 108 50            C111 76 94 100 69 105            C43 110 18 96 10 72            C2 47 15 21 39 10            C45 7 52 6 58 6Z" fill="#50E6FF" stroke="#243447" stroke-width="3.5"/>

  <!-- Solid right hemisphere: absolutely no grid -->
  <path d="M58 6            C85 6 105 25 108 50            C111 76 94 100 69 105            C65 106 61 106 58 106            C59 88 59 69 59 56            C59 37 59 19 58 6Z" fill="#1689D5"/>

  <!-- Boundary between grid hemisphere and solid hemisphere -->
  <path d="M58 7            C59 26 59 42 59 56            C59 75 59 91 58 105" fill="none" stroke="#243447" stroke-width="2.7"/>

  <!-- Left hemisphere: curved meridian -->
  <path d="M55 8            C39 22 33 39 33 56            C33 76 41 94 55 104" fill="none" stroke="#243447" stroke-width="2.8"/>

  <!-- Left hemisphere: upper parallel -->
  <path d="M23 29            C33 37 46 40 58 40" fill="none" stroke="#243447" stroke-width="2.8"/>

  <!-- Left hemisphere: middle parallel -->
  <path d="M9 56            C24 59 42 59 58 58" fill="none" stroke="#243447" stroke-width="2.8"/>

  <!-- Left hemisphere: lower parallel -->
  <path d="M20 82            C32 76 46 75 58 75" fill="none" stroke="#243447" stroke-width="2.8"/>

  <!-- Reassert outer globe marker contour -->
  <path d="M58 6            C85 6 105 25 108 50            C111 76 94 100 69 105            C43 110 18 96 10 72            C2 47 15 21 39 10            C45 7 52 6 58 6Z" stroke="#243447" stroke-width="3.5"/>

  <!-- Padlock shackle: white arch, behind body -->
  <path d="M88 84            L88 79            C88 67 96 60 105 60            C115 60 121 68 121 79            L121 87            L113 87            L113 79            C113 73 110 69 105 69            C100 69 96 73 96 79            L96 87Z" fill="#FFFFFF" stroke="#243447" stroke-width="3.2"/>

  <!-- Padlock green rounded body -->
  <path d="M83 83            Q83 80 87 80            L117 80            Q121 80 121 84            L121 116            Q121 121 116 121            L84 121            Q79 121 79 116            L79 87            Q79 83 83 83Z" fill="#86D633" stroke="#243447" stroke-width="3.5"/>

  <!-- White keyhole: circular head and tapered stem -->
  <path d="M100 95            C100 91 103 89 106 89            C110 89 112 92 112 96            C112 99 110 101 108 102            L110 111            Q110 113 108 113            L103 113            Q101 113 102 110            L104 102            C101 100 100 98 100 95Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.2"/>
</svg>

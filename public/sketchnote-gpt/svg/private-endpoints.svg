<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Private Endpoints (sketch)</title>
  
  <desc>Azure cyan and blue opposing chevrons around a central vertical connector with cyan and green endpoint nodes, illustrated with uneven marker outlines and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="endpointCyan" x1="55" y1="5" x2="72" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="endpointGreen" x1="55" y1="73" x2="75" y2="101" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86D633"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Left-facing network chevron -->
  <path d="M13 51            Q11 49 14 46            L47 13            Q50 10 53 14            L59 20            L29 51            L59 82            L52 89            Q49 92 46 89 Z" fill="#1490DF" stroke="#0869AD" stroke-width="3.5"/>

  <!-- Left lower cyan segment -->
  <path d="M13 51 L29 51 L59 82            L52 89 Q49 92 46 89 Z" fill="#50E6FF" stroke="#087EAD" stroke-width="2.8"/>

  <!-- Right-facing network chevron -->
  <path d="M115 51            Q117 49 114 46            L81 13            Q78 10 75 14            L69 20            L99 51            L69 82            L76 89            Q79 92 82 89 Z" fill="#1490DF" stroke="#0869AD" stroke-width="3.5"/>

  <!-- Right lower cyan segment -->
  <path d="M115 51 L99 51 L69 82            L76 89 Q79 92 82 89 Z" fill="#50E6FF" stroke="#087EAD" stroke-width="2.8"/>

  <!-- Sketchy chevron highlights -->
  <path d="M20 46 L47 19            M108 46 L81 19" stroke="#B6E7FF" stroke-width="2.5"/>

  <path d="M22 57 L47 82            M106 57 L81 82" stroke="#D2FAFF" stroke-width="2.5"/>

  <!-- Central connector stem -->
  <path d="M60 26            Q64 24 68 26            L68 78            Q64 81 60 78 Z" fill="#B3B3B3" stroke="#777777" stroke-width="2.7"/>

  <!-- Central junction -->
  <path d="M64 73            C57 73 52 78 52 85            C52 92 57 97 64 97            C71 97 76 92 76 85            C76 78 71 73 64 73 Z" fill="#D0D0D0" stroke="#777777" stroke-width="2.5"/>

  <!-- Top private endpoint -->
  <path d="M64 5            C74 5 82 13 82 23            C82 33 74 41 64 41            C54 41 46 33 46 23            C46 13 54 5 64 5 Z" fill="url(#endpointCyan)" stroke="#087EAD" stroke-width="3.5"/>

  <!-- Top node marker highlight -->
  <path d="M53 20 Q56 11 65 11" stroke="#D7FAFF" stroke-width="3"/>

  <!-- Bottom private endpoint -->
  <path d="M64 73            C74 73 82 81 82 91            C82 101 74 109 64 109            C54 109 46 101 46 91            C46 81 54 73 64 73 Z" fill="url(#endpointGreen)" stroke="#4D841F" stroke-width="3.5"/>

  <!-- Bottom node marker highlight -->
  <path d="M53 88 Q56 79 65 79" stroke="#C9F29A" stroke-width="3"/>

  <!-- Hand-drawn connection indication -->
  <path d="M64 44 L64 69" stroke="#E5E5E5" stroke-width="2.2"/>

  <!-- Small Azure network motion marks -->
  <path d="M8 35 L15 32            M113 32 L120 35" stroke="#32BEDD" stroke-width="2.7"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M93 101 L93 110            M89 105 L98 105" stroke="#F4C542" stroke-width="3"/>

  <path d="M35 101 L30 107            M40 105 L36 112" stroke="#F4C542" stroke-width="2.5"/>

  <!-- Loose handwritten-style detail -->
  <path d="M49 117 Q64 121 79 117" stroke="#0078D4" stroke-width="2" opacity=".7"/>
</svg>

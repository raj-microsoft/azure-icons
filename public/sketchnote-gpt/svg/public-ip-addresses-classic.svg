<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Public IP Addresses (Classic) (sketch)</title>
  
  <desc>Classic Azure public IP address icon featuring a blue header, cyan rectangular network panel, three white circular indicators, and subtle hand-drawn marker accents.</desc>

  <defs>
    <linearGradient id="panelCyan" x1="64" y1="41" x2="64" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".55" stop-color="#32D2F2"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="headerBlue" x1="14" y1="18" x2="114" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168CE0"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Main cyan network panel -->
  <path d="M10 42            L118 42            L118 107            Q118 112 113 112            L15 112            Q10 112 10 107 Z" fill="url(#panelCyan)" stroke="#087EAD" stroke-width="3.5"/>

  <!-- Classic Azure blue header -->
  <path d="M15 16            L113 16            Q118 16 118 21            L118 42            L10 42            L10 21            Q10 16 15 16 Z" fill="url(#headerBlue)" stroke="#075A9D" stroke-width="3.5"/>

  <!-- Hand-drawn header highlight -->
  <path d="M17 22            Q48 20 78 22            L108 22" stroke="#5EA0EF" stroke-width="2.5" opacity=".85"/>

  <!-- White address bar -->
  <path d="M27 25            Q25 25 25 28            L25 33            Q25 35 28 35            L100 35            Q103 35 103 32            L103 28            Q103 25 100 25 Z" fill="#F2F2F2" stroke="#CDEAFF" stroke-width="2"/>

  <!-- Address bar marker reflection -->
  <path d="M32 29 Q58 28 85 29" stroke="#FFFFFF" stroke-width="1.8"/>

  <!-- First white IP indicator -->
  <path d="M39 62            C45 62 50 67 50 73            C50 79 45 84 39 84            C33 84 28 79 28 73            C28 67 33 62 39 62 Z" fill="#F2F2F2" stroke="#168CB7" stroke-width="2.6"/>

  <!-- Second white IP indicator -->
  <path d="M64 62            C70 62 75 67 75 73            C75 79 70 84 64 84            C58 84 53 79 53 73            C53 67 58 62 64 62 Z" fill="#F2F2F2" stroke="#168CB7" stroke-width="2.6"/>

  <!-- Third white IP indicator -->
  <path d="M89 62            C95 62 100 67 100 73            C100 79 95 84 89 84            C83 84 78 79 78 73            C78 67 83 62 89 62 Z" fill="#F2F2F2" stroke="#168CB7" stroke-width="2.6"/>

  <!-- Hand-drawn indicator highlights -->
  <path d="M34 70 Q36 66 40 66            M59 70 Q61 66 65 66            M84 70 Q86 66 90 66" stroke="#FFFFFF" stroke-width="2.2"/>

  <!-- Subtle panel reflections -->
  <path d="M17 50            L17 96" stroke="#B7F4FF" stroke-width="2.6" opacity=".85"/>

  <path d="M111 51            L111 94" stroke="#087EAD" stroke-width="2" opacity=".45"/>

  <!-- Hand-drawn network baseline -->
  <path d="M28 97            Q45 95 64 97            Q82 99 100 96" stroke="#087EAD" stroke-width="2.2" opacity=".55"/>

  <!-- Small connection strokes -->
  <path d="M39 88 L39 93            M64 88 L64 93            M89 88 L89 93" stroke="#0078D4" stroke-width="2.4" opacity=".7"/>

  <!-- Yellow sketchnote sparkle -->
  <path d="M115 6 L115 14            M111 10 L119 10" stroke="#F4C542" stroke-width="2.8"/>

  <!-- Azure marker motion accents -->
  <path d="M4 55 L7 51            M4 64 L7 62" stroke="#32BEDD" stroke-width="2.5"/>

  <!-- Restrained yellow network accents -->
  <path d="M105 119 L111 116            M113 123 L119 120" stroke="#F4C542" stroke-width="2.5"/>

  <!-- Loose handwritten-style underline -->
  <path d="M34 119            Q64 123 94 119" stroke="#0078D4" stroke-width="1.8" opacity=".65"/>
</svg>

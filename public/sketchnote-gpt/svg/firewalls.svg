<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Firewalls (sketch)</title>
  
  <desc id="desc">Azure-blue cloud behind a red brick firewall with uneven hand-drawn outlines, original red and pink brick colors, and restrained yellow accents.</desc>

  <defs>
    <linearGradient id="fwCloud" x1="64" y1="12" x2="64" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".82" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <clipPath id="fwBricks">
      <path d="M29 77                Q29 74 33 74                L95 74                Q99 74 99 78                L99 116                Q99 120 95 120                L33 120                Q29 120 29 116Z"/>
    </clipPath>
  </defs>

  <!-- Azure cloud silhouette -->
  <path d="M35 101            C18 101 7 89 7 74            C7 58 18 47 33 46            C38 27 53 15 70 15            C91 15 105 29 108 48            C120 50 126 61 125 74            C124 89 113 100 99 101            Z" fill="url(#fwCloud)" stroke="#145B92" stroke-width="3.3"/>

  <!-- Soft marker cloud highlight -->
  <path d="M17 70            Q18 55 37 54            Q43 27 67 24            Q88 22 99 43" stroke="#B9E2FF" stroke-width="3" opacity=".85"/>

  <!-- Irregular cloud contour accents -->
  <g stroke="#0069B8" stroke-width="1.8" opacity=".65">
    <path d="M15 82 Q21 92 34 93"/>
    <path d="M92 28 Q103 37 103 50"/>
    <path d="M113 61 Q119 70 115 79"/>
  </g>

  <!-- Firewall dark-red body -->
  <path d="M29 77            Q29 74 33 74            L95 74            Q99 74 99 78            L99 116            Q99 120 95 120            L33 120            Q29 120 29 116Z" fill="#821010" stroke="#5F1218" stroke-width="3.4"/>

  <!-- Hand-drawn brick rows -->
  <g clip-path="url(#fwBricks)" stroke="#821010" stroke-width="2.2">

    <!-- Top brick row -->
    <path d="M32 78              L52 78              L52 89              L32 89Z" fill="#E62323"/>

    <path d="M54 78              L74 78              L74 89              L54 89Z" fill="#FF7381"/>

    <path d="M76 78              L96 78              L96 89              L76 89Z" fill="#E62323"/>

    <!-- Middle brick row, staggered -->
    <path d="M32 91              L41 91              L41 102              L32 102Z" fill="#E62323"/>

    <path d="M43 91              L63 91              L63 102              L43 102Z" fill="#FF7381"/>

    <path d="M65 91              L85 91              L85 102              L65 102Z" fill="#E62323"/>

    <path d="M87 91              L96 91              L96 102              L87 102Z" fill="#FF7381"/>

    <!-- Bottom brick row -->
    <path d="M32 104              L52 104              L52 116              L32 116Z" fill="#E62323"/>

    <path d="M54 104              L74 104              L74 116              L54 116Z" fill="#FF7381"/>

    <path d="M76 104              L96 104              L96 116              L76 116Z" fill="#E62323"/>
  </g>

  <!-- Irregular marker highlights on bricks -->
  <g stroke="#FFC0C5" stroke-width="1.7" opacity=".8">
    <path d="M36 81 L47 81"/>
    <path d="M58 81 L69 81"/>
    <path d="M80 81 L91 81"/>
    <path d="M47 94 L57 94"/>
    <path d="M69 94 L79 94"/>
    <path d="M36 107 L47 107"/>
    <path d="M58 107 L69 107"/>
    <path d="M80 107 L91 107"/>
  </g>

  <!-- Freehand mortar seam accents -->
  <g stroke="#551015" stroke-width="1.3" opacity=".65">
    <path d="M34 89 Q64 90 94 89"/>
    <path d="M34 102 Q63 103 94 102"/>
    <path d="M51 79 L51 87"/>
    <path d="M75 105 L75 114"/>
  </g>

  <!-- Azure-blue sketch emphasis -->
  <g stroke="#0078D4" stroke-width="2.6">
    <path d="M31 34 L26 29"/>
    <path d="M42 26 L40 19"/>
    <path d="M108 31 L113 26"/>
    <path d="M116 40 L122 38"/>
  </g>

  <!-- Restrained yellow security accents -->
  <g stroke="#FFCC4D" stroke-width="2.7">
    <path d="M21 106 L16 110"/>
    <path d="M24 115 L21 121"/>
    <path d="M105 106 L111 110"/>
    <path d="M105 115 L109 121"/>
  </g>

  <!-- Small hand-drawn protection sparkle -->
  <path d="M110 7            Q112 15 120 17            Q112 19 110 27            Q108 19 100 17            Q108 15 110 7Z" fill="#FFCC4D" stroke="#D6A222" stroke-width="1.5"/>

  <!-- Tiny Azure marker marks -->
  <g stroke="#50E6FF" stroke-width="2" opacity=".9">
    <path d="M17 96 L13 100"/>
    <path d="M24 100 L21 105"/>
  </g>
</svg>

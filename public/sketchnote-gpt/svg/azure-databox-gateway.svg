<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Databox Gateway (sketch)</title>

  
  <desc>
    Hand-drawn Azure Databox Gateway icon preserving the
    original blue cloud silhouette, cyan foreground lobe,
    and opposing white data-transfer arrows. Uneven marker
    outlines, restrained yellow sketch accents, and a
    transparent background. Fully editable vector paths.
  </desc>

  <defs>
    <linearGradient id="gatewayCloud" x1="65" y1="20" x2="65" y2="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".62" stop-color="#278EE0"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="gatewayCyan" x1="15" y1="53" x2="69" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#83F0FF"/>
      <stop offset=".55" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Main Azure cloud silhouette -->
  <path d="     M 35 109     C 16 110 5 98 5 82     C 5 66 16 54 31 51     C 36 31 52 19 71 19     C 91 19 105 33 108 52     C 121 54 125 65 125 78     C 125 95 113 108 97 109     Z" fill="url(#gatewayCloud)" stroke="#075A9E" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Uneven cloud marker contour -->
  <path d="     M 10 69     Q 16 55 32 56     M 37 43     Q 45 24 65 24     M 81 25     Q 100 32 103 53     M 113 59     Q 121 64 120 77" stroke="#B5DBFF" stroke-width="2.7" stroke-linecap="round" opacity=".8"/>

  <!-- Subtle freehand outer sketch lines -->
  <path d="     M 3 72     Q 5 57 20 51     M 44 23     Q 55 13 70 15     M 94 25     Q 108 36 111 48     M 127 87     Q 125 100 115 107" stroke="#0078D4" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="13 5 8 5" opacity=".65"/>

  <!-- Foreground cyan cloud lobe -->
  <path d="     M 69 75     C 69 57 56 43 39 43     C 21 43 8 58 8 76     C 8 94 21 108 39 109     L 69 109     Z" fill="url(#gatewayCyan)" stroke="#168DB5" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Cyan lobe marker highlight -->
  <path d="     M 15 71     Q 18 54 34 50     M 43 49     Q 60 52 63 70" stroke="#D6FAFF" stroke-width="3" stroke-linecap="round" opacity=".9"/>

  <!-- Hand-drawn cyan lower contour -->
  <path d="     M 13 91     Q 21 105 39 105     L 61 105" stroke="#119FC7" stroke-width="2" stroke-linecap="round" opacity=".65"/>

  <!-- Upper arrow: data moving right -->
  <path d="     M 19 72     L 42 72     L 42 67     Q 42 65 44 67     L 59 79     Q 61 81 59 83     L 44 95     Q 42 97 42 94     L 42 89     L 19 89     Z" fill="#FFFFFF" stroke="#168DB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow marker highlight -->
  <path d="     M 24 78     L 47 78     M 49 74     L 56 81" stroke="#C3F5FF" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- Lower arrow: data moving left -->
  <path d="     M 49 94     L 24 94     L 24 89     Q 24 87 22 89     L 9 100     Q 7 102 9 104     L 22 115     Q 24 117 24 114     L 24 109     L 49 109     Z" fill="#FFFFFF" fill-opacity=".88" stroke="#168DB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower arrow sketch detail -->
  <path d="     M 45 101     L 20 101     M 18 98     L 12 102" stroke="#B4EBFF" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- Small cloud illumination strokes -->
  <path d="     M 79 40     Q 91 44 95 57     M 82 91     Q 97 94 108 88" stroke="#95D7FF" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>

  <!-- Restrained yellow sketchnote sparks -->
  <path d="     M 116 37     L 120 32     M 120 41     L 125 41" stroke="#F3B82D" stroke-width="2.6" stroke-linecap="round"/>

  <path d="     M 82 113     L 82 119     M 78 116     L 86 116" stroke="#F3B82D" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>

  <!-- Handwritten-style motion marks -->
  <path d="     M 75 69     Q 81 67 87 69     M 77 76     L 91 76     M 76 83     Q 82 85 88 83" stroke="#D2EFFF" stroke-width="2" stroke-linecap="round" opacity=".7"/>

</svg>

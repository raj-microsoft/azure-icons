<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Network Watcher (sketch)</title>
  
  <desc>Azure-blue network globe examined through a cyan magnifying glass with a green monitoring heartbeat, illustrated using uneven marker strokes.</desc>

  <defs>
    <radialGradient id="globeBlue" cx="67" cy="44" r="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".52" stop-color="#4394E7"/>
      <stop offset="1" stop-color="#0078D4"/>
    </radialGradient>
    <linearGradient id="lensCyan" x1="24" y1="57" x2="78" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Network globe -->
  <path d="M79 8            C103 8 120 27 120 51            C120 75 102 94 79 94            C55 94 37 75 37 51            C37 27 55 8 79 8Z" fill="url(#globeBlue)" stroke="#1768B4" stroke-width="3.3"/>

  <!-- Globe meridians -->
  <path d="M79 10            C65 19 59 35 59 51            C59 68 65 84 79 92            M79 10            C93 19 99 35 99 51            C99 68 93 84 79 92" stroke="#D2EEFF" stroke-width="2.7"/>

  <path d="M79 10 Q77 31 79 51            Q81 72 79 92" stroke="#E5F7FF" stroke-width="2" opacity=".85"/>

  <!-- Globe latitudes -->
  <path d="M45 30 Q79 42 113 30            M38 51 Q79 54 119 51            M45 72 Q79 60 113 72" stroke="#D2EEFF" stroke-width="2.8"/>

  <!-- Hand-inked globe edge highlights -->
  <path d="M48 30 Q58 13 75 13            M91 14 Q108 20 114 36            M112 68 Q105 83 91 88" stroke="#B8E2FF" stroke-width="2" opacity=".8"/>

  <!-- Magnifying glass handle -->
  <path d="M30 99            L10 119" stroke="#167CA5" stroke-width="13"/>

  <path d="M30 99 L10 119" stroke="#50BBDD" stroke-width="7"/>

  <path d="M26 103 L13 116" stroke="#A4F1FF" stroke-width="2" opacity=".85"/>

  <!-- Magnifying glass outer rim -->
  <path d="M47 57            C64 57 78 71 78 88            C78 105 64 119 47 119            C30 119 16 105 16 88            C16 71 30 57 47 57Z" fill="url(#lensCyan)" stroke="#138FB8" stroke-width="3.5"/>

  <!-- White monitoring lens -->
  <path d="M47 64            C60 64 71 75 71 88            C71 101 60 112 47 112            C34 112 23 101 23 88            C23 75 34 64 47 64Z" fill="#FFFFFF" stroke="#A9EAF6" stroke-width="2.4"/>

  <!-- Lens reflection -->
  <path d="M28 83 Q31 71 43 69" stroke="#B5F1FF" stroke-width="2.5" opacity=".9"/>

  <!-- Monitoring heartbeat -->
  <path d="M26 94            L33 94            L39 82            L46 104            L53 77            L60 96            L65 87            L70 87" stroke="#76BC2D" stroke-width="4.3"/>

  <!-- Fine heartbeat marker highlight -->
  <path d="M39 85 L45 101            M53 80 L59 93" stroke="#B7EA83" stroke-width="1.5"/>

  <!-- Small network junction dots -->
  <circle cx="79" cy="30" r="2" fill="#E8F8FF"/>
  <circle cx="99" cy="51" r="2" fill="#E8F8FF"/>
  <circle cx="79" cy="72" r="2" fill="#E8F8FF"/>

  <!-- Restrained sketchnote yellow accents -->
  <path d="M116 12 L121 7            M121 21 L126 20            M22 49 L17 44" stroke="#FFD65A" stroke-width="2.7"/>

  <!-- Hand-drawn observation sparkle -->
  <path d="M22 17 L22 26            M18 21 L26 21" stroke="#FFD65A" stroke-width="2.5"/>

  <circle cx="22" cy="21" r="1.6" fill="#FFE58A"/>

  <!-- Loose marker annotation -->
  <path d="M83 100 Q95 99 105 92            M105 92 L103 98            M105 92 L99 91" stroke="#FFD65A" stroke-width="2.3"/>

</svg>

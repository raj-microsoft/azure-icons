<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Network Watcher (sketch)</title>
  
  <desc>Hand-drawn Network Watcher icon with an open Azure-blue globe grid, cyan magnifying glass, green monitoring pulse, and uneven charcoal marker outlines.</desc>

  <!-- Magnifying glass handle, behind the lens -->
  <path d="M31 98            L8 121            Q5 124 3 121            Q1 118 5 114            L27 92 Z" fill="#198AB3" stroke="#203746" stroke-width="3.2"/>

  <!-- Open globe: transparent cells, blue grid -->
  <g stroke="#203746" stroke-width="4.2">
    <!-- Outer globe contour -->
    <path d="M79 9              C102 8 119 26 120 49              C121 72 104 91 81 93              C58 95 39 78 37 55              C35 32 54 10 79 9 Z" fill="none"/>

    <!-- Central vertical meridian -->
    <path d="M79 10              Q78 29 79 49              Q80 72 80 92" fill="none"/>

    <!-- Left curved meridian -->
    <path d="M78 10              C64 18 58 34 59 51              C60 69 67 85 80 92" fill="none"/>

    <!-- Right curved meridian -->
    <path d="M80 10              C94 19 100 35 99 52              C98 70 92 85 80 92" fill="none"/>

    <!-- Upper latitude -->
    <path d="M47 30              Q62 35 79 35              Q97 35 112 30" fill="none"/>

    <!-- Equator -->
    <path d="M37 51              Q57 50 79 51              Q101 52 120 51" fill="none"/>

    <!-- Lower latitude -->
    <path d="M46 72              Q62 67 79 67              Q97 67 112 72" fill="none"/>
  </g>

  <!-- Azure-blue marker core on open grid -->
  <g stroke="#0078D4" stroke-width="2.4" fill="none">
    <path d="M79 10              C101 10 118 27 118 50              C119 73 102 90 80 91              C58 93 40 76 39 54              C38 32 56 12 79 10 Z"/>

    <path d="M79 12              C66 21 61 36 61 51              C61 67 67 82 79 90"/>

    <path d="M81 12              C93 21 97 36 97 52              C97 69 91 83 81 90"/>

    <path d="M79 12 Q78 31 79 50              Q80 72 80 90"/>

    <path d="M48 31 Q79 42 111 31"/>
    <path d="M39 52 Q79 54 118 52"/>
    <path d="M47 71 Q79 61 111 71"/>
  </g>

  <!-- Cyan magnifying glass outer body -->
  <path d="M47 57            C64 57 78 70 79 87            C80 104 66 119 49 120            C31 121 16 108 15 90            C14 72 28 58 45 57            Q46 57 47 57 Z" fill="#50E6FF" stroke="#203746" stroke-width="3.8"/>

  <!-- White monitoring lens -->
  <path d="M47 64            C61 64 71 75 72 88            C73 101 62 112 49 113            C35 114 23 103 22 90            C21 76 32 65 45 64            Q46 64 47 64 Z" fill="#FFFFFF" stroke="#203746" stroke-width="3"/>

  <!-- Green monitoring heartbeat -->
  <path d="M26 94            L33 94            L39 82            L46 104            L53 77            L60 96            L65 87            L70 87" fill="none" stroke="#203746" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M26 94            L33 94            L39 82            L46 104            L53 77            L60 96            L65 87            L70 87" fill="none" stroke="#76BC2D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

</svg>

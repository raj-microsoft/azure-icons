<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Bastions (sketch)</title>

  
  <desc>
    Hand-drawn Azure Bastions icon preserving the original
    four diagonal interlocking blue bars forming an angular
    gateway symbol. Uneven marker outlines, original Azure
    blues, restrained yellow accents, and transparent background.
    Fully editable vector paths.
  </desc>

  <defs>
    <linearGradient id="bastionBlue" x1="34" y1="15" x2="93" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="bastionLight" x1="21" y1="35" x2="107" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A8CFFF"/>
      <stop offset="1" stop-color="#83B9F9"/>
    </linearGradient>
  </defs>

  <!-- Upper-left diagonal bar -->
  <path d="M64 12        Q66 10 69 13        L104 48        Q107 51 104 54        L98 60        Q95 63 92 60        L57 25        Q54 22 57 19Z" fill="url(#bastionBlue)" stroke="#174D78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upper-right descending bar -->
  <path d="M104 13        Q107 10 110 13        L116 19        Q119 22 116 25        L81 60        Q78 63 75 60        L69 54        Q66 51 69 48Z" fill="url(#bastionLight)" stroke="#174D78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower-left ascending bar -->
  <path d="M12 103        L47 68        Q50 65 53 68        L59 74        Q62 77 59 80        L24 115        Q21 118 18 115        L12 109        Q9 106 12 103Z" fill="url(#bastionLight)" stroke="#174D78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower-right diagonal bar -->
  <path d="M24 68        Q27 65 30 68        L65 103        Q68 106 65 109        L59 115        Q56 118 53 115        L18 80        Q15 77 18 74Z" fill="url(#bastionBlue)" stroke="#174D78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand-drawn inner marker highlights -->
  <g stroke="#D8EEFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M65 19 L96 50"/>
    <path d="M107 21 L77 51"/>
    <path d="M20 106 L50 76"/>
    <path d="M25 75 L56 106"/>
  </g>

  <!-- Loose secondary sketch strokes -->
  <g stroke="#0078D4" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M55 15 L51 20"/>
    <path d="M113 29 L109 33"/>
    <path d="M15 91 L11 95"/>
    <path d="M69 113 L73 109"/>
  </g>

  <!-- Small cyan emphasis marks -->
  <g stroke="#50E6FF" stroke-width="2.4" stroke-linecap="round">
    <path d="M83 36 L89 42"/>
    <path d="M89 32 L95 26"/>
    <path d="M34 92 L40 86"/>
    <path d="M40 96 L46 102"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F5C84C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43 12 L40 6"/>
    <path d="M51 8 L52 3"/>
    <path d="M83 113 L87 119"/>
    <path d="M91 108 L97 111"/>
  </g>

  <!-- Hand-drawn sparkle -->
  <path d="M110 87 L110 95        M106 91 L114 91" stroke="#F5C84C" stroke-width="2.2" stroke-linecap="round"/>

</svg>

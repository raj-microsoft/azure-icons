<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Bastions (sketch)</title>
  
  <desc>Two separate, disconnected Azure-blue bent ribbon chevrons facing opposite directions, with uneven charcoal marker outlines.</desc>

  <!-- Bottom-left open chevron: > -->
  <path d="M18 44            Q21 42 24 45            L59 77            Q62 80 59 83            L24 115            Q21 118 18 115            L12 109            Q9 106 12 103            L41 80            L12 56            Q9 53 12 50 Z" fill="#83B9F9" stroke="#174D78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top-right open chevron: < -->
  <path d="M108 10            Q111 8 114 11            L120 17            Q123 20 120 23            L91 47            L120 72            Q123 75 120 78            L114 84            Q111 87 108 84            L69 50            Q66 47 69 44 Z" fill="#2685D5" stroke="#174D78" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand-drawn inner highlights -->
  <g stroke="#D8EEFF" stroke-width="2.5" stroke-linecap="round" opacity=".85">
    <path d="M18 53 L48 79"/>
    <path d="M48 82 L19 108"/>
    <path d="M110 20 L79 47"/>
    <path d="M79 49 L110 75"/>
  </g>

  <!-- Subtle blue sketch marks -->
  <g stroke="#0078D4" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M55 15 L51 20"/>
    <path d="M113 91 L109 95"/>
    <path d="M15 31 L11 35"/>
    <path d="M69 113 L73 109"/>
  </g>

  <!-- Cyan emphasis marks -->
  <g stroke="#50E6FF" stroke-width="2.4" stroke-linecap="round">
    <path d="M34 65 L40 71"/>
    <path d="M34 95 L40 89"/>
    <path d="M89 35 L95 29"/>
    <path d="M89 59 L95 65"/>
  </g>

  <!-- Yellow sketchnote accents -->
  <g stroke="#F5C84C" stroke-width="3" stroke-linecap="round">
    <path d="M43 12 L40 6"/>
    <path d="M51 8 L52 3"/>
    <path d="M83 113 L87 119"/>
    <path d="M91 108 L97 111"/>
  </g>

  <!-- Small sparkle -->
  <path d="M110 87 L110 95 M106 91 L114 91" stroke="#F5C84C" stroke-width="2.2" stroke-linecap="round"/>
</svg>

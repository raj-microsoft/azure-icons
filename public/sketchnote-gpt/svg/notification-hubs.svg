<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Notification Hubs (sketch)</title>

  
  <desc>
    Hand-drawn golden notification speech bubble containing
    exactly two opposed horizontal arrows. Upper white arrow
    points right; lower pale-yellow arrow points left.
    Flat fills, uneven charcoal marker outlines,
    transparent background, no additional symbols.
  </desc>

  <!-- Main golden notification speech bubble -->
  <path d="M9 14        Q9 10 14 10        L114 10        Q119 10 119 15        L119 91        Q119 96 114 96        L85 96        Q83 96 83 99        L83 109        Q83 114 79 111        L60 97        Q59 96 56 96        L14 96        Q9 96 9 91        Z" fill="#EEB309" stroke="#203746" stroke-width="3.8"/>


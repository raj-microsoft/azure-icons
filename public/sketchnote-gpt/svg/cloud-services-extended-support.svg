<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Cloud Services (extended support) (sketch)</title>
  
  <desc>
    Azure-blue cloud with two white configuration gears
    and an overlapping orange extended-support badge.
    Uneven marker outlines, original Azure colours,
    subtle yellow accents and a transparent background.
  </desc>

  <defs>
    <linearGradient id="cloudBlue" x1="54" y1="12" x2="54" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="supportOrange" x1="98" y1="65" x2="98" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAA21D"/>
      <stop offset=".4" stop-color="#F79415"/>
      <stop offset="1" stop-color="#EF7100"/>
    </linearGradient>
  </defs>

  <!-- Main hand-drawn Azure cloud -->
  <path d="M35 100            C17 101 6 90 6 75            C6 60 16 49 31 47            C37 25 53 13 71 13            C90 13 106 27 107 46            C120 48 126 58 126 71            C126 74 125 77 124 80            C117 72 109 69 99 69            C79 69 65 84 65 103            L36 103            Q34 102 35 100Z" fill="url(#cloudBlue)" stroke="#155B91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Uneven inner cloud marker strokes -->
  <path d="M14 72 Q15 57 34 55            M39 43 Q48 20 69 21            M77 21 Q93 24 99 43" stroke="#B5DCFF" stroke-width="2.7" stroke-linecap="round" opacity=".85"/>

  <path d="M13 83 Q18 96 35 96            M112 51 Q121 57 120 68" stroke="#0B63A9" stroke-width="2" stroke-linecap="round" opacity=".55"/>

  <!-- Larger upper configuration gear -->
  <path d="M65 25            L72 25 L75 32            L80 34 L87 31            L93 37 L90 44            L92 49 L99 52            L99 59 L92 62            L90 67 L93 74            L87 80 L80 77            L75 79 L72 86            L65 86 L62 79            L57 77 L50 80            L44 74 L47 67            L45 62 L38 59            L38 52 L45 49            L47 44 L44 37            L50 31 L57 34            L62 32 Z" fill="#F7FBFF" stroke="#155B91" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Upper gear inner ring -->
  <path d="M68 43            C75 42 81 48 81 55            C81 63 75 69 68 69            C60 69 55 63 55 55            C55 48 60 43 68 43Z" fill="#0078D4" stroke="#C3F1FF" stroke-width="3"/>

  <path d="M62 49 Q66 45 71 48" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Smaller lower-left configuration gear -->
  <path d="M29 55            L35 55 L37 61            L41 63 L47 60            L52 65 L49 71            L51 75 L57 77            L57 83 L51 85            L49 90 L52 96            L47 101 L41 98            L37 100 L35 106            L29 106 L27 100            L23 98 L17 101            L12 96 L15 90            L13 85 L7 83            L7 77 L13 75            L15 71 L12 65            L17 60 L23 63            L27 61 Z" fill="#FFFFFF" stroke="#155B91" stroke-width="2.7" stroke-linejoin="round"/>

  <!-- Small gear inner opening -->
  <path d="M32 70            C38 70 43 75 43 81            C43 87 38 92 32 92            C26 92 21 87 21 81            C21 75 26 70 32 70Z" fill="#0078D4" stroke="#C3F1FF" stroke-width="2.8"/>

  <path d="M27 77 Q30 73 34 75" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Overlapping orange extended-support badge -->
  <path d="M98 65            C115 65 126 78 126 95            C126 111 114 123 98 123            C82 123 70 111 70 95            C70 78 82 65 98 65Z" fill="url(#supportOrange)" stroke="#A9560B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sketchy circular badge highlight -->
  <path d="M81 80            Q87 70 99 71            Q112 72 119 84" stroke="#FFD982" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>

  <path d="M79 106 Q85 117 98 117" stroke="#D96A08" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <!-- Extended-support outward arrows -->
  <path d="M86 83            L104 83            Q107 83 105 86            L100 91            L106 97            L114 89            L114 83            L120 83            L120 103            L101 103            L101 97            L94 90            L88 96            L94 102            L94 108            L76 108            L76 90            L82 90            L88 96            L94 90            L86 83Z" fill="#FFFFFF" stroke="#B95D10" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Small highlight on outward arrows -->
  <path d="M81 104 L88 104            M108 87 L115 87" stroke="#FFE9C6" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Yellow sketchnote emphasis strokes -->
  <g stroke="#FFD45A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M107 15 L112 8"/>
    <path d="M116 24 L123 20"/>
    <path d="M119 34 L125 35"/>
  </g>

  <!-- Subtle blue handwritten-style annotations -->
  <g stroke="#32D4F5" stroke-width="2.2" stroke-linecap="round">
    <path d="M12 111 L18 115"/>
    <path d="M21 116 L27 119"/>
    <path d="M41 115 L47 112"/>
  </g>

  <!-- Final sketch accent -->
  <path d="M57 109 Q63 111 67 108" stroke="#155B91" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Update Management Center (sketch)</title>
  <defs>
    <linearGradient id="gearBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1689df"/>
      <stop offset=".55" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#005ba1"/>
    </linearGradient>
    <linearGradient id="centerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#005ba1"/>
      <stop offset="1" stop-color="#003067"/>
    </linearGradient>
    <linearGradient id="cycleCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cebff"/>
      <stop offset=".55" stop-color="#50e6ff"/>
      <stop offset="1" stop-color="#32bedd"/>
    </linearGradient>
  </defs>

  <!-- Update management gear -->
  <path d="M58 7     L69 7 L74 20     Q79 21 83 24     L96 19 L104 27     L99 40 Q102 45 103 50     L117 55 L117 67     L103 72 Q102 78 99 82     L105 95 L96 104     L83 98 Q78 102 73 103     L68 118 L56 118     L51 104 Q45 103 41 100     L28 106 L19 97     L25 83 Q22 78 21 73     L7 68 L7 56     L21 51 Q22 45 25 41     L19 28 L28 19     L41 25 Q46 22 52 20 Z" fill="url(#gearBlue)" stroke="#004b87" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Gear highlight -->
  <path d="M58 12 L66 12 M30 26 L38 30 M91 27 L97 32     M12 60 L19 60 M108 61 L115 61" fill="none" stroke="#9cebff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central mechanism -->
  <circle cx="62" cy="62" r="34" fill="url(#centerBlue)" stroke="#003067" stroke-width="3"/>

  <circle cx="62" cy="62" r="29" fill="none" stroke="#50e6ff" stroke-width="1.8" opacity=".65"/>

  <!-- Circular update arrows -->
  <g fill="none" stroke="url(#cycleCyan)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 48       Q51 34 67 37       Q78 39 83 49"/>
    <path d="M73 49 L84 51 L85 39"/>

    <path d="M82 76       Q72 90 56 86       Q45 84 40 74"/>
    <path d="M50 74 L39 72 L38 84"/>
  </g>

  <!-- Arrowhead yellow marker accents -->
  <g fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-linecap="round">
    <path d="M77 35 L84 30"/>
    <path d="M44 89 L37 94"/>
  </g>

  <!-- Center status indicator -->
  <circle cx="62" cy="62" r="13" fill="#0078d4" stroke="#9cebff" stroke-width="2.5"/>

  <path d="M55 62 L60 68 L70 55" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hand-drawn marker details -->
  <g fill="none" stroke="#9cebff" stroke-width="2" stroke-linecap="round" opacity=".85">
    <path d="M30 72 Q31 77 34 80"/>
    <path d="M89 46 Q92 51 91 56"/>
    <path d="M58 109 L65 110"/>
    <path d="M99 88 L103 84"/>
  </g>

  <!-- Small maintenance spark -->
  <g fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-linecap="round">
    <path d="M108 18 L108 27"/>
    <path d="M104 22 L112 22"/>
    <path d="M16 103 L16 110"/>
    <path d="M12 106 L20 106"/>
  </g>
</svg>

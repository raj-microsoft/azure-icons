<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Event Grid Topics (sketch)</title>
  
  <desc>Hand-drawn event topic flows with three directional arrows, connection nodes, and a loosely sketched grid frame.</desc>

  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#76BC2D"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Loose outer grid frame -->
  <g stroke="#777777" stroke-width="3.6">
    <path d="M12 33 Q11 22 15 14 Q35 10 63 12 L112 13 Q117 14 116 23 L116 34"/>
    <path d="M12 94 L12 110 Q13 116 22 115 L109 115 Q116 114 116 106 L116 94"/>
  </g>

  <!-- Corner brackets -->
  <g fill="#A3A3A3" stroke="#666666" stroke-width="2.5">
    <path d="M8 13 Q8 9 13 9 L23 10 L23 35 Q17 37 9 34 Z"/>
    <path d="M105 10 L115 9 Q120 10 120 15 L119 34 L105 35 Z"/>
    <path d="M9 94 L23 93 L23 118 L14 119 Q9 118 8 113 Z"/>
    <path d="M105 94 L119 93 L120 112 Q120 118 114 119 L105 118 Z"/>
  </g>

  <!-- Sketch highlights on frame -->
  <g stroke="#FFFFFF" stroke-width="2.2" opacity=".65">
    <path d="M13 17 L13 30"/>
    <path d="M110 15 L110 29"/>
    <path d="M13 99 L13 111"/>
    <path d="M110 99 L110 112"/>
  </g>

  <!-- Top green event topic -->
  <g stroke="#416F1D" stroke-width="2.8">
    <path d="M39 40 Q43 35 49 39 L70 39 L70 31              Q70 29 73 31 L91 47              Q94 50 91 53 L73 68              Q70 70 70 66 L70 57              L48 57 Q41 61 36 55 Q31 48 36 43 Z" fill="url(#green)"/>
    <path d="M47 44 Q59 43 70 44" stroke="#B8E77A" stroke-width="2"/>
  </g>

  <!-- Top connection node -->
  <circle cx="40" cy="48" r="7.5" fill="#76BC2D" stroke="#416F1D" stroke-width="2.8"/>
  <circle cx="38" cy="46" r="2.2" fill="#E9FFD3"/>

  <!-- Center blue event stream -->
  <g stroke="#226FB9" stroke-width="2.8">
    <path d="M48 65 Q51 61 57 63              L92 63 L92 56              Q92 53 95 56              L112 72 Q115 75 112 78              L95 94 Q92 96 92 92              L92 84 L57 84              Q51 87 47 82 Q40 74 46 68 Z" fill="url(#blue)"/>
    <path d="M57 69 Q74 68 91 69" stroke="#AAD7FF" stroke-width="2.2"/>
  </g>

  <!-- Center connection node -->
  <circle cx="51" cy="74" r="8" fill="#5EA0EF" stroke="#226FB9" stroke-width="2.8"/>
  <circle cx="49" cy="72" r="2.4" fill="#E1F3FF"/>

  <!-- Bottom green topic -->
  <g stroke="#416F1D" stroke-width="2.8">
    <path d="M39 92 Q44 88 49 91              L70 91 L70 85              Q70 82 73 85              L91 100 Q94 103 91 106              L79 116 L73 119              Q70 120 70 116              L70 110 L49 110              Q43 114 38 109 Q32 102 36 96 Z" fill="url(#green)"/>
    <path d="M48 96 Q58 96 69 97" stroke="#B8E77A" stroke-width="2"/>
  </g>

  <!-- Bottom connection node -->
  <circle cx="40" cy="101" r="7.5" fill="#76BC2D" stroke="#416F1D" stroke-width="2.8"/>
  <circle cx="38" cy="99" r="2.2" fill="#E9FFD3"/>

  <!-- Hand-drawn motion accents -->
  <g stroke-width="2.5">
    <path d="M96 43 L102 40 M97 49 L105 49" stroke="#76BC2D"/>
    <path d="M113 65 L119 61 M115 83 L121 86" stroke="#5EA0EF"/>
    <path d="M96 98 L101 95 M96 108 L102 111" stroke="#76BC2D"/>
  </g>

  <!-- Yellow sketchnote highlights -->
  <g stroke="#FFCB3D" stroke-width="3" opacity=".95">
    <path d="M26 42 L29 37"/>
    <path d="M22 49 L27 49"/>
    <path d="M26 57 L30 61"/>
    <path d="M31 72 L36 70"/>
    <path d="M29 80 L35 82"/>
  </g>

  <!-- Subtle marker scribbles -->
  <g stroke="#5E9624" stroke-width="1.8" opacity=".6">
    <path d="M58 51 L65 51"/>
    <path d="M55 104 L64 104"/>
  </g>
  <path d="M69 77 Q77 76 85 77" stroke="#D7EAFE" stroke-width="1.8" opacity=".8"/>

  <!-- Tiny hand-drawn emphasis spark -->
  <g stroke="#FFCB3D" stroke-width="2.4">
    <path d="M99 19 L101 25"/>
    <path d="M106 21 L104 27"/>
    <path d="M94 26 L99 29"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>API Proxy (sketch)</title>
  
  <desc>
    Hand-drawn Azure API Proxy icon with two mirrored
    turquoise communication arcs, connected endpoints,
    and a central green proxy hub.
  </desc>

  <defs>
    <linearGradient id="proxyHub" x1="64" y1="43" x2="64" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37C2B1"/>
      <stop offset="1" stop-color="#258277"/>
    </linearGradient>

    <linearGradient id="proxyArc" x1="23" y1="24" x2="104" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CD4C2"/>
      <stop offset="1" stop-color="#26AE9F"/>
    </linearGradient>
  </defs>

  <!-- Left communication arc -->
  <path d="M56 35            C40 39 28 51 27 64            C26 80 38 94 56 98" stroke="#168E83" stroke-width="11"/>

  <path d="M56 35            C40 39 28 51 27 64            C26 80 38 94 56 98" stroke="#3CD4C2" stroke-width="7.5"/>

  <!-- Right communication arc -->
  <path d="M72 35            C89 39 101 51 101 64            C102 80 90 94 72 98" stroke="#168E83" stroke-width="11"/>

  <path d="M72 35            C89 39 101 51 101 64            C102 80 90 94 72 98" stroke="#3CD4C2" stroke-width="7.5"/>

  <!-- Left endpoint connector -->
  <path d="M27 64            Q20 63 15 64" stroke="#168E83" stroke-width="8"/>

  <path d="M27 64 L15 64" stroke="#3CD4C2" stroke-width="5.5"/>

  <!-- Right endpoint connector -->
  <path d="M101 64            Q108 65 113 64" stroke="#168E83" stroke-width="8"/>

  <path d="M101 64 L113 64" stroke="#3CD4C2" stroke-width="5.5"/>

  <!-- Left endpoint -->
  <path d="M14 54            C20 54 24 58 24 64            C24 70 20 75 14 75            C8 75 4 70 4 64            C4 58 8 54 14 54 Z" fill="#3CD4C2" stroke="#168E83" stroke-width="3.4"/>

  <!-- Right endpoint -->
  <path d="M114 54            C120 54 124 59 124 64            C124 70 120 75 114 75            C108 75 104 70 104 64            C104 58 109 54 114 54 Z" fill="#3CD4C2" stroke="#168E83" stroke-width="3.4"/>

  <!-- Endpoint highlights -->
  <path d="M9 61 Q11 58 14 58" stroke="#D9FFF8" stroke-width="2.3"/>

  <path d="M109 61 Q111 58 114 58" stroke="#D9FFF8" stroke-width="2.3"/>

  <!-- Central proxy hub -->
  <path d="M64 47            C74 47 82 54 82 64            C82 74 74 82 64 82            C54 82 46 74 46 64            C46 54 54 47 64 47 Z" fill="url(#proxyHub)" stroke="#176E67" stroke-width="3.5"/>

  <!-- Hand-drawn hub highlight -->
  <path d="M53 59            Q56 53 63 53" stroke="#B5F4E7" stroke-width="2.8" opacity=".9"/>

  <!-- Central routing symbol -->
  <path d="M54 64 L74 64            M69 59 L74 64 L69 69" stroke="#E8FFF9" stroke-width="3.2"/>

  <!-- Small marker irregularities -->
  <path d="M35 45 L39 41            M33 84 L37 88" stroke="#76E5D9" stroke-width="2.4" opacity=".85"/>

  <path d="M89 41 L93 45            M91 88 L95 84" stroke="#76E5D9" stroke-width="2.4" opacity=".85"/>

  <!-- Azure-blue sketch accent -->
  <path d="M42 25 L47 22            M49 28 L54 27" stroke="#0078D4" stroke-width="2.5" opacity=".8"/>

  <!-- Yellow sketchnote sparkle -->
  <path d="M96 19 L96 28            M91.5 23.5 L100.5 23.5" stroke="#F2C94C" stroke-width="3"/>

  <path d="M105 17 L109 13            M106 31 L111 33" stroke="#F2C94C" stroke-width="2.2"/>

  <!-- Subtle flow annotation -->
  <path d="M49 103 L55 106            M73 106 L79 103" stroke="#0078D4" stroke-width="2.2" opacity=".65"/>

  <!-- Tiny bottom marker flourish -->
  <path d="M59 113            Q64 116 69 113" stroke="#3CD4C2" stroke-width="2.5" opacity=".7"/>
</svg>

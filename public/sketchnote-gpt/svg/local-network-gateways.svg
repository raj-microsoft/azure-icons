<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke="#203746" stroke-linecap="round" stroke-linejoin="round"><title>Local Network Gateways (sketch)</title>

  
  <desc>Teal diamond-shaped network gateway with four white directional arrows pointing outward from a central junction.</desc>

  <!-- Main diamond gateway body -->
  <path d="     M62.8 8.5     Q65 7 67.2 9.1     L118.7 60.8     Q122 63.7 119 66.8     L67.1 118.7     Q64.5 121.4 61.5 118.5     L9.2 67     Q6.2 64.1 9.2 61     Z" fill="#49A498" stroke-width="3.6"/>

  <!-- Subtle inner diamond boundary -->
  <path d="     M64 16     L112 64     L64 112     L16 64     Z" stroke="#203746" stroke-width="1.7" opacity=".55"/>

  <!-- Top outward-pointing arrow -->
  <path d="     M58.5 55     L58.5 32     L48 42     L44 37.5     L63.8 19     L83.5 37.5     L79 42     L69.5 32     L69.5 55     Q64 52.5 58.5 55     Z" fill="#FFFFFF" stroke-width="2.8"/>

  <!-- Bottom outward-pointing arrow -->
  <path d="     M58.5 73     L69.5 73     L69.5 96     L79 86     L83.5 90.5     L63.8 109     L44 90.5     L48 86     L58.5 96     Z" fill="#FFFFFF" stroke-width="2.8"/>

  <!-- Left horizontal arrow: points OUTWARD -->
  <path d="     M55 58.5     L32 58.5     L42 48     L37.5 44     L19 63.8     L37.5 83.5     L42 79     L32 69.5     L55 69.5     Z" fill="#FFFFFF" stroke-width="2.8"/>

  <!-- Right horizontal arrow: points OUTWARD -->
  <path d="     M73 58.5     L96 58.5     L86 48     L90.5 44     L109 63.8     L90.5 83.5     L86 79     L96 69.5     L73 69.5     Z" fill="#FFFFFF" stroke-width="2.8"/>

  <!-- Central network junction -->
  <circle cx="64" cy="64" r="8.5" fill="#258277" stroke="#203746" stroke-width="3.2"/>

  <!-- Central junction inner point -->
  <circle cx="64" cy="64" r="2.8" fill="#FFFFFF" stroke="#203746" stroke-width="1.4"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Compliance (sketch)</title>
  
  <desc>White document with Azure-blue outline and folded upper-right corner, containing a red certification seal, golden center, and one red notched ribbon. No text or checkmark.</desc>

  <!-- White document silhouette -->
  <path d="M19 4            Q15 4 15 9            L15 119            Q15 124 20 124            L108 124            Q113 124 113 119            L113 46            L75 4            Z" fill="#FFFFFF" stroke="#172B3A" stroke-width="3.2"/>

  <!-- Azure document outline, slightly irregular -->
  <path d="M20 9            Q20 36 20 64            L20 119            L108 119            L108 47" stroke="#0078D4" stroke-width="2.8"/>

  <!-- Folded upper-right corner -->
  <path d="M75 4            Q75 20 75 36            Q75 45 84 45            L113 45            Z" fill="#0078D4" stroke="#172B3A" stroke-width="3.2"/>

  <!-- Ribbon tails, behind certification seal -->
  <path d="M53 78            Q63 83 74 78            L77 104            L75 106            L64 98            L56 106            Q53 108 53 104            Z" fill="#B31B1B" stroke="#172B3A" stroke-width="3" stroke-linejoin="round"/>

  <!-- Red certification seal -->
  <path d="M64 48            C74 48 82 56 82 66            C82 76 74 84 64 84            C54 84 46 76 46 66            C46 56 54 48 64 48 Z" fill="#E62323" stroke="#172B3A" stroke-width="3.1"/>

  <!-- Golden center, intentionally blank -->
  <path d="M64 53            C71 53 77 59 77 66            C77 73 71 79 64 79            C57 79 51 73 51 66            C51 59 57 53 64 53 Z" fill="#FFD400" stroke="#172B3A" stroke-width="2.6"/>

  <!-- Light hand-drawn edge accents -->
  <g stroke="#5EA0EF" stroke-width="1.7">
    <path d="M12 24 Q11 55 12 83"/>
    <path d="M27 126 Q56 127 83 126"/>
  </g>

  <!-- Restrained yellow marker ticks -->
  <g stroke="#E6B93F" stroke-width="2.5">
    <path d="M93 67 L98 64"/>
    <path d="M95 74 L101 74"/>
  </g>
</svg>

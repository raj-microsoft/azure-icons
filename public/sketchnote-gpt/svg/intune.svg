<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Intune (sketch)</title>

  
  <desc>
    Hand-drawn Azure Intune icon featuring a blue desktop monitor,
    supporting stand, circular connection hub, long horizontal
    connection and a tall cyan-outlined rectangular panel.
    Blank white interiors, flat colors, uneven dark marker
    contours and transparent background.
  </desc>

  <!-- Desktop monitor housing -->
  <path d="     M7 9     Q7 6 11 6     L107 6     Q111 6 111 10     L111 77     Q111 80 107 80     L11 80     Q7 80 7 76     Z" fill="#5EA0EF" stroke="#243447" stroke-width="3.4"/>

  <!-- Blank white desktop display -->
  <path d="     M13 15     Q13 13 16 13     L102 13     Q105 13 105 16     L105 70     Q105 73 102 73     L16 73     Q13 73 13 70     Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.5"/>

  <!-- Monitor stand -->
  <path d="     M47 80     L70 80     Q69 91 72 98     Q74 102 81 104     Q85 105 86 109     L31 109     Q32 105 36 104     Q44 102 46 96     Q48 91 47 80     Z" fill="#1F56A3" stroke="#243447" stroke-width="3"/>

  <!-- Stand lower face -->
  <path d="     M35 105     Q59 103 82 105     Q85 106 86 109     L31 109     Q31 107 35 105     Z" fill="#1490DF" stroke="#243447" stroke-width="2.2"/>

  <!-- Circular desktop connection hub -->
  <path d="     M68 45     C68 51 63 56 57 56     C51 56 46 51 46 45     C46 39 51 34 57 34     C63 34 68 39 68 45     Z" fill="#D2EBFF" stroke="#243447" stroke-width="3"/>

  <!-- Long horizontal connection toward right panel -->
  <path d="M68 45 Q85 44 108 45 L120 45" fill="none" stroke="#243447" stroke-width="8"/>

  <path d="M68 45 Q85 44 108 45 L120 45" fill="none" stroke="#32BEDD" stroke-width="4.5"/>

  <!-- Tall cyan rectangular panel -->
  <path d="     M79 42     Q79 39 83 39     L119 39     Q123 39 123 43     L123 119     Q123 123 119 123     L83 123     Q79 123 79 119     Z" fill="#32BEDD" stroke="#243447" stroke-width="3.5"/>

  <!-- Completely blank white panel interior -->
  <path d="     M85 49     Q85 47 87 47     L115 47     Q117 47 117 49     L117 111     Q117 113 115 113     L87 113     Q85 113 85 111     Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.3"/>

  <!-- Long rightward transfer arrow overlapping panel -->
  <path d="     M66 77     Q80 76 94 77     L101 77     L101 69     Q101 67 103 69     L113 80     Q115 82 113 84     L103 95     Q101 97 101 94     L101 87     L66 87     Q64 87 64 85     L64 79     Q64 77 66 77     Z" fill="#0078D4" stroke="#243447" stroke-width="2.7"/>


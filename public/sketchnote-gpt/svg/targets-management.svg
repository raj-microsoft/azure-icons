<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Targets Management (sketch)</title>
  <defs>
    <linearGradient id="centerGradient" x1="-51.062" y1="349.229" x2="-51.062" y2="345.247" gradientTransform="translate(-120.372 -317.22) rotate(-30)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eeaa45"/>
      <stop offset="1" stop-color="#f4cf97"/>
    </linearGradient>

    <linearGradient id="ringGradient" x1="9.026" y1="14.515" x2="9.026" y2="3.541" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#5ea0f0"/>
    </linearGradient>
  </defs>

  <g transform="scale(7.111111)">

    <!-- Four original directional markers -->
    <rect x="8.209" y=".013" width="1.634" height="4.658" rx=".817" fill="#82bbff" stroke="#579ce8" stroke-width=".025"/>

    <rect x="8.209" y="13.329" width="1.634" height="4.658" rx=".817" fill="#82bbff" stroke="#579ce8" stroke-width=".025"/>

    <rect x="14.597" y="6.699" width="1.634" height="4.658" rx=".817" transform="translate(24.442 -6.386) rotate(90)" fill="#82bbff" stroke="#579ce8" stroke-width=".025"/>

    <rect x="1.769" y="6.699" width="1.634" height="4.658" rx=".817" transform="translate(11.614 6.442) rotate(90)" fill="#82bbff" stroke="#579ce8" stroke-width=".025"/>

    <!-- Original single circular target boundary -->
    <path d="M9.026 14.515a5.487 5.487 0 1 1 5.487-5.487 5.493 5.493 0 0 1-5.487 5.487Zm0-9.553a4.066 4.066 0 1 0 4.066 4.066 4.071 4.071 0 0 0-4.066-4.066Z" fill="url(#ringGradient)" stroke="#0877ca" stroke-width=".035" stroke-linejoin="round"/>

    <!-- Plain central disk: exactly one filled circle -->
    <circle cx="9.026" cy="9.028" r="1.991" fill="url(#centerGradient)" stroke="#d99a3e" stroke-width=".035"/>

  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Help and Support (sketch)</title>
  
  <desc>Azure Help and Support icon featuring a cyan support agent, rounded shoulders, a white collar, and a hand-drawn gray headset with microphone.</desc>

  <defs>
    <linearGradient id="supportBody" x1="64" y1="67" x2="64" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".55" stop-color="#32BEDD"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
    <linearGradient id="supportHead" x1="64" y1="15" x2="64" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".55" stop-color="#32BEDD"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
  </defs>

  <!-- Support agent shoulders and torso -->
  <path d="M61 66            C45 66 31 72 22 84            C14 94 11 108 10 117            Q9 124 16 125            Q64 127 112 125            Q119 124 118 117            C116 103 111 90 103 81            C93 71 80 66 67 66 Z" fill="url(#supportBody)" stroke="#087DAE" stroke-width="3.6"/>

  <!-- Soft hand-drawn shoulder highlights -->
  <path d="M20 110 Q23 90 37 80" stroke="#82E9F7" stroke-width="3" opacity=".8"/>

  <path d="M91 79 Q109 91 111 111" stroke="#087DAE" stroke-width="2.2" opacity=".5"/>

  <!-- White shirt collar, matching original -->
  <path d="M48 68            Q64 80 80 68            L64 105 Z" fill="#F5FAFC" stroke="#1689B5" stroke-width="2.5"/>

  <path d="M52 75 L64 101 L76 75" stroke="#FFFFFF" stroke-width="2" opacity=".9"/>

  <!-- Support agent head -->
  <path d="M64 15            C80 14 94 27 94 44            C95 61 82 75 65 75            C48 76 34 63 34 46            C33 28 46 16 64 15 Z" fill="url(#supportHead)" stroke="#087DAE" stroke-width="3.6"/>

  <!-- Hand-drawn face highlights -->
  <path d="M43 36 Q48 23 61 22" stroke="#9DF0FA" stroke-width="3" opacity=".75"/>

  <path d="M85 52 Q81 64 71 68" stroke="#087DAE" stroke-width="2" opacity=".5"/>

  <!-- Headset outer arch -->
  <path d="M27 24            C36 9 50 4 66 4            C88 4 103 17 108 37            Q110 46 107 55" stroke="#606060" stroke-width="6.5"/>

  <path d="M27 24            C36 9 50 4 66 4            C88 4 103 17 108 37            Q110 46 107 55" stroke="#A3A3A3" stroke-width="3.5"/>

  <!-- Left headset accent -->
  <path d="M26 27 Q23 32 23 39" stroke="#767676" stroke-width="3" opacity=".75"/>

  <!-- Right headset earcup -->
  <path d="M105 52            Q110 49 114 54            L111 64            Q109 69 104 67            Q99 65 101 60 Z" fill="#A3A3A3" stroke="#686868" stroke-width="2.8"/>

  <!-- Microphone boom -->
  <path d="M107 66            Q103 78 94 81            Q86 84 79 82" stroke="#767676" stroke-width="4"/>

  <path d="M107 66            Q103 78 94 81            Q86 84 79 82" stroke="#B0B0B0" stroke-width="1.6" opacity=".8"/>

  <!-- Microphone capsule -->
  <path d="M76 78            Q72 78 71 82            Q71 86 76 87            L83 88            Q87 88 88 84            Q89 80 84 79 Z" fill="#767676" stroke="#555555" stroke-width="2"/>

  <!-- Small sketchnote accents -->
  <g stroke="#0078D4" stroke-width="2.5">
    <path d="M16 32 L10 29"/>
    <path d="M15 40 L8 40"/>
    <path d="M119 42 L125 39"/>
  </g>

  <!-- Restrained yellow support spark -->
  <g stroke="#F4B83F" stroke-width="3">
    <path d="M115 15 L119 9"/>
    <path d="M121 22 L127 20"/>
  </g>

  <!-- Hand-drawn base emphasis -->
  <path d="M35 121 Q65 123 94 121" stroke="#FFFFFF" stroke-width="1.8" opacity=".4"/>
</svg>

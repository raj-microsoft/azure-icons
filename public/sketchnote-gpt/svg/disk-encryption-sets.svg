<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Disk Encryption Sets (sketch)</title>
  
  <desc>Two stacked Azure storage disks, blue above green, with an overlapping encryption key and dashed selection boundary.</desc>

  <!-- Dashed encryption-set boundary -->
  <path d="M7 5            L120 5 Q123 5 123 9            L123 119 Q123 123 119 123            L9 123 Q5 123 5 119            L5 9 Q5 5 7 5 Z" stroke="#0078D4" stroke-width="2.6" stroke-dasharray="9 7"/>

  <!-- Lower green disk: single storage layer -->
  <path d="M20 72            C20 61 37 55 59 55            C80 55 98 62 98 72            L98 83            C98 94 81 101 59 101            C37 101 20 94 20 83 Z" fill="#5E9624" stroke="#243447" stroke-width="3.2"/>

  <!-- Green disk upper elliptical face -->
  <path d="M20 72            C20 61 37 55 59 55            C80 55 98 62 98 72            C98 83 81 89 59 89            C37 89 20 82 20 72 Z" fill="#76BC2D" stroke="#243447" stroke-width="3"/>

  <!-- Upper blue disk: single storage layer -->
  <path d="M20 36            C20 25 37 19 59 19            C80 19 98 26 98 36            L98 48            C98 59 81 66 59 66            C37 66 20 59 20 48 Z" fill="#0078D4" stroke="#243447" stroke-width="3.2"/>

  <!-- Blue disk upper elliptical face -->
  <path d="M20 36            C20 25 37 19 59 19            C80 19 98 26 98 36            C98 47 81 53 59 53            C37 53 20 46 20 36 Z" fill="#5EA0EF" stroke="#243447" stroke-width="3"/>

  <!-- Dark center opening -->
  <path d="M46 35            C46 32 52 30 59 30            C67 30 73 32 73 35            C73 38 67 40 59 40            C52 40 46 38 46 35 Z" fill="#005BA1" stroke="#243447" stroke-width="2"/>

  <!-- Encryption key: angular bow and notched shaft -->
  <path d="M94 65            Q97 62 100 65            L112 77            Q115 80 112 83            L104 91            Q103 92 103 95            L103 108            L107 112            Q108 113 107 115            L104 118            L101 115            L98 118            L95 115            L98 112            L95 109            L98 106            L98 103            L95 100            L95 94            Q95 92 93 90            L81 83            Q78 80 81 77 Z" fill="#1685DC" stroke="#243447" stroke-width="3.4"/>

  <!-- Open circular keyhole -->
  <path d="M96 75            C98 73 101 74 103 76            C105 78 104 81 102 83            C100 85 97 84 95 82            C93 80 94 77 96 75 Z" fill="none" stroke="#243447" stroke-width="3"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Host Groups (sketch)</title>
  
  <desc>Two stacked cyan host servers with dark teal offset shadows, lime-green status indicators, and a central connector ending in a circular node.</desc>

  <defs>
    <linearGradient id="hostCyan" x1="68" y1="14" x2="68" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset="0.7" stop-color="#2CC2E5"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
    <linearGradient id="nodeCyan" x1="68" y1="99" x2="68" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
  </defs>

  <!-- Rear offset server housings -->
  <path d="M13 7 Q10 7 10 12        L10 32 Q10 36 14 36        L99 36 Q103 36 103 32        L103 11 Q103 7 99 7Z" fill="#198AB3" stroke="#126B91" stroke-width="2.8"/>

  <path d="M13 51 Q10 51 10 55        L10 76 Q10 80 14 80        L99 80 Q103 80 103 76        L103 55 Q103 51 99 51Z" fill="#198AB3" stroke="#126B91" stroke-width="2.8"/>

  <!-- Vertical host-group connector -->
  <path d="M67 35        Q66 52 67 67        L67 103" stroke="#087DA8" stroke-width="9"/>

  <path d="M69 39 L69 99" stroke="#32BEDD" stroke-width="4"/>

  <!-- Upper foreground host -->
  <path d="M29 17        Q29 15 33 15        L114 15 Q118 15 118 19        L118 40 Q118 44 114 44        L33 44 Q29 44 29 40Z" fill="url(#hostCyan)" stroke="#087DA8" stroke-width="3.2"/>

  <!-- Lower foreground host -->
  <path d="M29 61        Q29 59 33 59        L114 59 Q118 59 118 63        L118 84 Q118 88 114 88        L33 88 Q29 88 29 84Z" fill="url(#hostCyan)" stroke="#087DA8" stroke-width="3.2"/>

  <!-- Loose marker highlights -->
  <path d="M35 20 L95 20        M35 64 L95 64" stroke="#B2F1FC" stroke-width="2.5" opacity="0.9"/>

  <!-- Host panel details -->
  <path d="M39 35 L73 35        M39 79 L73 79" stroke="#087DA8" stroke-width="2.2" opacity="0.55"/>

  <!-- Upper lime-green status indicators -->
  <path d="M103 21 Q103 20 105 20        L109 20 Q111 20 111 22        L111 26 Q111 28 109 28        L105 28 Q103 28 103 26Z" fill="#B4EC36" stroke="#789C22" stroke-width="1.5"/>

  <path d="M103 33 Q103 32 105 32        L109 32 Q111 32 111 34        L111 38 Q111 40 109 40        L105 40 Q103 40 103 38Z" fill="#B4EC36" stroke="#789C22" stroke-width="1.5"/>

  <!-- Lower lime-green status indicators -->
  <path d="M103 65 Q103 64 105 64        L109 64 Q111 64 111 66        L111 70 Q111 72 109 72        L105 72 Q103 72 103 70Z" fill="#B4EC36" stroke="#789C22" stroke-width="1.5"/>

  <path d="M103 77 Q103 76 105 76        L109 76 Q111 76 111 78        L111 82 Q111 84 109 84        L105 84 Q103 84 103 82Z" fill="#B4EC36" stroke="#789C22" stroke-width="1.5"/>

  <!-- Terminal cluster node -->
  <path d="M67 101        C73 100 79 105 79 112        C79 119 73 123 67 123        C60 123 56 118 56 112        C56 106 61 101 67 101Z" fill="url(#nodeCyan)" stroke="#087DA8" stroke-width="3"/>

  <!-- Node highlight -->
  <path d="M61 110 Q63 106 68 106" stroke="#B2F1FC" stroke-width="2.3"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M17 22 L21 18        M17 30 L22 27        M15 68 L20 64" stroke="#F4C542" stroke-width="2.8"/>

  <!-- Small hand-drawn emphasis marks -->
  <path d="M86 105 L91 100        M89 111 L96 109" stroke="#F4C542" stroke-width="2.5"/>

  <!-- Subtle cyan marker hatching -->
  <path d="M35 25 L40 23        M35 69 L40 67        M91 39 L96 37        M91 83 L96 81" stroke="#D4F8FF" stroke-width="1.8" opacity="0.8"/>
</svg>

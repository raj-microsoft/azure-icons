<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>App Service Environments (sketch)</title>
  
  <desc>Four hand-drawn grey environment panels arranged in a grid, with a central Azure-blue cloud and subtle yellow sketch accents.</desc>

  <defs>
    <linearGradient id="aseCloud" x1="42" y1="38" x2="91" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Upper-left environment panel -->
  <path d="M8 12            Q8 8 12 8            L59 8            L59 59            L8 59 Z" stroke="#858585" stroke-width="5"/>

  <!-- Upper-right environment panel -->
  <path d="M69 8            L116 8            Q120 8 120 12            L120 59            L69 59 Z" stroke="#858585" stroke-width="5"/>

  <!-- Lower-left environment panel -->
  <path d="M8 69            L59 69            L59 120            L12 120            Q8 120 8 116 Z" stroke="#858585" stroke-width="5"/>

  <!-- Lower-right environment panel -->
  <path d="M69 69            L120 69            L120 116            Q120 120 116 120            L69 120 Z" stroke="#858585" stroke-width="5"/>

  <!-- Hand-drawn secondary panel contours -->
  <g stroke="#B7B7B7" stroke-width="1.8" opacity=".8">
    <path d="M13 52 L13 16 Q13 13 17 13 L49 13"/>
    <path d="M77 13 L112 13 Q115 13 115 17 L115 47"/>
    <path d="M13 78 L13 111 Q13 115 17 115 L50 115"/>
    <path d="M78 115 L111 115 Q115 115 115 111 L115 79"/>
  </g>

  <!-- Central Azure cloud -->
  <path d="M46 94            C33 95 24 85 24 73            C24 61 33 52 45 51            C49 38 60 31 72 31            C86 31 97 41 99 54            C111 56 117 65 116 76            C115 87 107 94 96 94            Z" fill="url(#aseCloud)" stroke="#075FA9" stroke-width="3.8"/>

  <!-- Organic cloud marker highlight -->
  <path d="M32 70            Q35 59 48 58            M53 47            Q60 37 72 38            M82 40            Q92 45 93 55" stroke="#D7F0FF" stroke-width="3" opacity=".9"/>

  <!-- Cloud lower contour sketch -->
  <path d="M32 81            Q37 89 47 88            L94 88            Q106 88 110 78" stroke="#005BA1" stroke-width="2.2" opacity=".55"/>

  <!-- Minimal hand-drawn cloud texture -->
  <path d="M42 65 L49 62            M39 71 L48 71            M85 84 L96 84" stroke="#BDE4FF" stroke-width="2.2" opacity=".75"/>

  <!-- Small internal environment separation marks -->
  <g stroke="#A0A0A0" stroke-width="2.2" opacity=".7">
    <path d="M19 21 L27 21"/>
    <path d="M101 21 L109 21"/>
    <path d="M19 107 L27 107"/>
    <path d="M101 107 L109 107"/>
  </g>

  <!-- Restrained yellow sketchnote sparks -->
  <g stroke="#F7C948" stroke-width="3">
    <path d="M60 20 L60 13"/>
    <path d="M52 23 L47 18"/>
    <path d="M68 23 L73 18"/>
  </g>

  <!-- Tiny sketched sparkle -->
  <path d="M108 29 L108 37            M104 33 L112 33" stroke="#F7C948" stroke-width="2.4"/>

  <!-- Subtle handwritten-style accent strokes -->
  <path d="M19 43 L25 39            M22 49 L28 45            M99 104 L105 101" stroke="#32D4F5" stroke-width="2.2"/>

</svg>

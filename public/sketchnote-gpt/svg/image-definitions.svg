<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Image Definitions (sketch)</title>
  
  <desc>Azure Image Definitions icon featuring a tall cyan image panel, a hand-drawn isometric cube, and a purple outward-pointing arrow.</desc>

  <defs>
    <linearGradient id="panelCyan" x1="50" y1="5" x2="50" y2="123" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset=".55" stop-color="#3CCBE8"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="arrowPurple" x1="53" y1="92" x2="125" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Tall cyan image-definition panel -->
  <path d="M9 5            Q7 5 7 10            L7 118            Q7 123 12 123            L94 123            Q99 123 99 118            L99 10            Q99 5 94 5            Q52 4 9 5 Z" fill="url(#panelCyan)" stroke="#087DAE" stroke-width="3.5"/>

  <!-- Loose marker highlights on panel -->
  <path d="M13 15 L13 104" stroke="#B6F4FF" stroke-width="2.5" opacity=".8"/>

  <path d="M19 11 Q50 9 87 11" stroke="#C3F1FF" stroke-width="2.2" opacity=".7"/>

  <path d="M19 117 Q52 119 89 117" stroke="#168DB5" stroke-width="2" opacity=".5"/>

  <!-- Isometric image-definition cube: top -->
  <path d="M26 42            L53 26            Q55 25 57 26            L82 41            Q85 43 82 45            L56 61            Q54 62 52 61            L26 46            Q23 44 26 42 Z" fill="#C3F1FF" stroke="#1788B5" stroke-width="3"/>

  <!-- Cube left face -->
  <path d="M26 45            L53 61            L53 94            Q53 97 50 95            L26 81            Q24 80 24 77            L24 48            Q24 45 26 45 Z" fill="#9CEBFF" stroke="#1788B5" stroke-width="3"/>

  <!-- Cube right face -->
  <path d="M53 61            L82 44            L82 77            Q82 80 79 82            L55 96            Q53 97 53 94 Z" fill="#50E6FF" stroke="#1788B5" stroke-width="3"/>

  <!-- Hand-drawn cube highlights -->
  <path d="M32 44 L54 31 L76 44" stroke="#FFFFFF" stroke-width="2.4" opacity=".85"/>

  <path d="M30 52 L30 76 L46 86" stroke="#D8F8FF" stroke-width="2.4" opacity=".9"/>

  <path d="M76 51 L76 74 L60 85" stroke="#C3F1FF" stroke-width="2.4" opacity=".8"/>

  <!-- Subtle cube face fold lines -->
  <path d="M53 61 Q54 77 53 94" stroke="#168DB5" stroke-width="2" opacity=".65"/>

  <path d="M34 48 L53 59 L73 47" stroke="#FFFFFF" stroke-width="1.6" opacity=".5"/>

  <!-- Purple outward image-definition arrow -->
  <path d="M54 116            C59 96 80 86 104 86            L104 76            Q104 73 107 76            L124 93            Q126 95 124 97            L107 114            Q104 117 104 113            L104 104            C82 104 65 110 54 116 Z" fill="url(#arrowPurple)" stroke="#552F99" stroke-width="3.5"/>

  <!-- Arrow marker highlight -->
  <path d="M66 107 Q82 96 108 96" stroke="#C8ADFA" stroke-width="2.5" opacity=".8"/>

  <path d="M111 85 L119 94 L111 103" stroke="#D5C0FF" stroke-width="2" opacity=".75"/>

  <!-- Small Azure-blue sketch accents -->
  <g stroke="#0078D4" stroke-width="2.4">
    <path d="M3 24 L0 21"/>
    <path d="M3 32 L0 32"/>
    <path d="M105 22 L110 18"/>
    <path d="M106 30 L112 29"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4B83F" stroke-width="2.7">
    <path d="M113 66 L117 60"/>
    <path d="M119 72 L125 69"/>
  </g>

  <!-- Tiny hand-drawn emphasis dots -->
  <circle cx="114" cy="49" r="2.4" fill="#F4B83F"/>
  <circle cx="18" cy="111" r="2" fill="#0078D4"/>
</svg>

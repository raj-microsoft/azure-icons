<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Lab Accounts (sketch)</title>

  
  <desc>
    Hand-drawn Azure laboratory flask with a white interior
    and overlapping golden access key. Uneven charcoal marker
    outlines, flat fills, transparent background, no bubbles,
    gradients, or decorative objects.
  </desc>

  <!-- Laboratory flask silhouette -->
  <path d="M34 5        Q34 3 38 3        L72 3        Q76 3 76 7        L76 10        Q76 14 72 14        L69 14        L69 43        Q69 45 71 48        L79 60        L70 69        Q65 75 70 81        L83 94        L14 94        Q10 94 9 90        Q9 88 11 85        L37 47        Q39 44 39 41        L39 14        L37 14        Q34 14 34 11        Z" fill="#4394E7" stroke="#203746" stroke-width="3.5"/>

  <!-- White flask interior: completely empty -->
  <path d="M46 33        Q46 31 49 31        L60 31        Q63 31 63 34        L63 44        Q63 48 66 52        L76 67        L67 76        Q65 79 69 83        L74 87        L22 87        L44 54        Q46 51 46 47        Z" fill="#FFFFFF" stroke="#203746" stroke-width="2.5"/>

  <!-- Golden key head -->
  <path d="M86 39        Q91 34 97 39        L117 59        Q123 65 117 71        L99 89        Q94 94 88 89        L68 69        Q63 64 68 58        Z" fill="#FFBD02" stroke="#203746" stroke-width="3.5"/>

  <!-- Key head circular opening -->
  <path d="M92 48        C97 46 102 50 102 55        C102 60 98 63 93 62        C88 61 86 56 89 51        Q90 49 92 48 Z" fill="none" stroke="#203746" stroke-width="2.8"/>

  <!-- Key shaft with original stepped teeth -->
  <path d="M89 85        L89 113        Q89 116 92 119        L97 124        Q99 126 101 124        L109 116        Q110 115 109 113        L105 109        L110 104        L105 99        L110 94        L103 87        Z" fill="#FFD400" stroke="#203746" stroke-width="3.4"/>

  <!-- Two horizontal key-head grooves -->
  <path d="M78 67        Q88 66 100 67" fill="none" stroke="#203746" stroke-width="2.1"/>

  <path d="M81 73        Q89 72 97 73" fill="none" stroke="#203746" stroke-width="2.1"/>

</svg>

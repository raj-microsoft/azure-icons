<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Mobile Networks (sketch)</title>
  
  <desc>Hand-drawn Azure Mobile Networks icon with overlapping blue and cyan cloud lobes, three green wireless signal bands, and a clearly visible white 5G label.</desc>

  <!-- Main Azure cloud -->
  <path d="M36 109        C20 110 9 99 9 84        Q8 71 17 61        Q23 54 34 52        C41 32 54 19 72 19        Q91 17 102 31        Q110 40 111 54        C124 57 129 68 125 81        Q123 96 112 104        Q105 109 96 109 Z" fill="#0078D4" stroke="#243447" stroke-width="3.6"/>

  <!-- Foreground cyan cloud -->
  <path d="M35 109        C20 110 9 99 9 84        C9 66 21 52 38 51        Q53 50 64 61        Q72 70 72 85        L72 109 Z" fill="#32BEDD" stroke="#243447" stroke-width="3.2"/>

  <!-- Outer mobile signal band -->
  <path d="M33 64        C47 39 72 28 89 35        L78 47        C61 42 45 51 33 64 Z" fill="#86D633" stroke="#243447" stroke-width="2.6"/>

  <!-- Middle mobile signal band -->
  <path d="M35 70        C47 51 62 47 76 53        L68 62        C55 57 45 63 35 70 Z" fill="#86D633" stroke="#243447" stroke-width="2.4"/>

  <!-- Inner mobile signal band -->
  <path d="M36 77        C45 66 55 65 65 69        L59 77        Q47 72 36 77 Z" fill="#86D633" stroke="#243447" stroke-width="2.3"/>

  <!-- Clear white 5G label, entirely within cyan cloud -->
  <!-- Five -->
  <path d="M21 85        L42 85        L40 94        Q33 91 27 95        C20 99 21 107 28 110        Q35 113 41 108        Q46 104 42 98        Q39 94 34 95" stroke="#243447" stroke-width="8.5" fill="none"/>

  <path d="M21 85        L42 85        L40 94        Q33 91 27 95        C20 99 21 107 28 110        Q35 113 41 108        Q46 104 42 98        Q39 94 34 95" stroke="#FFFFFF" stroke-width="5.3" fill="none"/>

  <!-- G -->
  <path d="M65 90        Q59 84 52 86        C44 88 43 98 46 105        Q51 114 64 108        L64 99        L56 99" stroke="#243447" stroke-width="8.5" fill="none"/>

  <path d="M65 90        Q59 84 52 86        C44 88 43 98 46 105        Q51 114 64 108        L64 99        L56 99" stroke="#FFFFFF" stroke-width="5.3" fill="none"/>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4C542" stroke-width="2.7" fill="none">
    <path d="M99 20 L104 14"/>
    <path d="M108 27 L116 24"/>
    <path d="M117 34 L123 34"/>

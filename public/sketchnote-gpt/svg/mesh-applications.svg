<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Mesh Applications (sketch)</title>

  
  <desc>Orange diamond-shaped application mesh with eight interconnected circular nodes, irregular marker outlines, and subtle Azure-blue and yellow highlights.</desc>

  <defs>
    <linearGradient id="meshOrange" x1="64" y1="7" x2="64" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F78D1E"/>
      <stop offset=".5" stop-color="#F28419"/>
      <stop offset="1" stop-color="#E26708"/>
    </linearGradient>
    <linearGradient id="meshLink" x1="25" y1="25" x2="103" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F78D1E"/>
      <stop offset="1" stop-color="#E27908"/>
    </linearGradient>
  </defs>

  <!-- Outer diamond mesh connections -->
  <path d="M64 15            L89 39            L113 64            L89 89            L64 113            L39 89            L15 64            L39 39Z" stroke="url(#meshLink)" stroke-width="7"/>

  <!-- Inner mesh connections -->
  <path d="M39 39 L89 89            M89 39 L39 89            M39 39 L89 39            M39 89 L89 89" stroke="#E27908" stroke-width="6.5"/>

  <!-- Hand-drawn secondary link strokes -->
  <path d="M21 59 L35 45            M93 43 L108 58            M108 70 L94 84            M35 94 L21 70" stroke="#FFC078" stroke-width="2.3" opacity=".85"/>

  <!-- Upper-left inner node -->
  <path d="M39 29            C45 29 49 33 49 39            C49 45 45 49 39 49            C33 49 29 45 29 39            C29 33 33 29 39 29Z" fill="#F78D1E" stroke="#AC5109" stroke-width="3"/>

  <!-- Upper-right inner node -->
  <path d="M89 29            C95 29 99 33 99 39            C99 45 95 49 89 49            C83 49 79 45 79 39            C79 33 83 29 89 29Z" fill="#F78D1E" stroke="#AC5109" stroke-width="3"/>

  <!-- Lower-left inner node -->
  <path d="M39 79            C45 79 49 83 49 89            C49 95 45 99 39 99            C33 99 29 95 29 89            C29 83 33 79 39 79Z" fill="#F78D1E" stroke="#AC5109" stroke-width="3"/>

  <!-- Lower-right inner node -->
  <path d="M89 79            C95 79 99 83 99 89            C99 95 95 99 89 99            C83 99 79 95 79 89            C79 83 83 79 89 79Z" fill="#F78D1E" stroke="#AC5109" stroke-width="3"/>

  <!-- Top outer node -->
  <path d="M64 4            C73 4 79 10 79 18            C79 27 73 33 64 33            C55 33 49 27 49 18            C49 10 55 4 64 4Z" fill="url(#meshOrange)" stroke="#AD5007" stroke-width="3.8"/>

  <!-- Left outer node -->
  <path d="M15 49            C24 49 30 55 30 64            C30 73 24 79 15 79            C7 79 2 73 2 64            C2 55 7 49 15 49Z" fill="url(#meshOrange)" stroke="#AD5007" stroke-width="3.8"/>

  <!-- Right outer node -->
  <path d="M113 49            C121 49 126 55 126 64            C126 73 121 79 113 79            C104 79 98 73 98 64            C98 55 104 49 113 49Z" fill="url(#meshOrange)" stroke="#AD5007" stroke-width="3.8"/>

  <!-- Bottom outer node -->
  <path d="M64 95            C73 95 79 101 79 110            C79 119 73 125 64 125            C55 125 49 119 49 110            C49 101 55 95 64 95Z" fill="url(#meshOrange)" stroke="#AD5007" stroke-width="3.8"/>

  <!-- Uneven marker highlights -->
  <path d="M57 12 Q62 8 68 12            M8 59 Q10 54 16 54            M106 58 Q109 54 115 55            M57 104 Q62 100 68 104" stroke="#FFD099" stroke-width="2.8"/>

  <!-- Inner node highlights -->
  <path d="M35 35 L39 33            M85 35 L89 33            M35 85 L39 83            M85 85 L89 83" stroke="#FFE0B5" stroke-width="2.5"/>

  <!-- Small Azure-blue sketchnote emphasis -->
  <path d="M19 30 L25 27            M23 23 L28 18" stroke="#0078D4" stroke-width="2.6"/>

  <!-- Restrained yellow accents -->
  <path d="M101 15 L106 9            M110 22 L118 20            M108 29 L115 33" stroke="#FFCC4D" stroke-width="3"/>

  <!-- Hand-drawn motion marks -->
  <path d="M88 111 L94 108            M92 119 L99 117" stroke="#E27908" stroke-width="2.5"/>

</svg>

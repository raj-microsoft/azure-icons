<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Stage Maps (sketch)</title>
  
  <desc>Hand-drawn sketchnote Azure Stage Maps icon with a two-level stage platform, a curved connecting route, and two plain blue circular map nodes. Uses uneven dark marker outlines, flat fills, restrained Azure-blue and yellow accents, and a transparent background.</desc>

  <!-- Stage platform lower tier -->
  <path d="M8 108            Q8 105 11 105            L117 105            Q120 105 120 108            L120 121            L8 121 Z" fill="#18A8F5" stroke="#2F3138" stroke-width="3.2"/>

  <!-- Stage platform upper tier -->
  <path d="M19 92            Q19 90 22 90            L106 90            Q109 90 109 93            L109 105            L19 105 Z" fill="#AEEFFF" stroke="#2F3138" stroke-width="3"/>

  <!-- Platform sketch detail -->
  <path d="M14 113            Q38 111 63 113            Q88 112 114 113" stroke="#DDF8FF" stroke-width="2.1"/>

  <!-- Curved stage route -->
  <path d="M51 65            C56 66 61 64 65 58            C69 51 68 42 74 36            C79 30 86 29 91 30" stroke="#2F3138" stroke-width="6.3"/>

  <path d="M51 65            C56 66 61 64 65 58            C69 51 68 42 74 36            C79 30 86 29 91 30" stroke="#BEC4CA" stroke-width="4.1"/>

  <!-- Small route waypoint -->
  <circle cx="64" cy="58" r="4.2" fill="#FFB900" stroke="#2F3138" stroke-width="2"/>

  <!-- Upper plain circle node -->
  <circle cx="91" cy="31" r="21.5" fill="#4AA9F4" stroke="#2F3138" stroke-width="3.5"/>
  <path d="M78 18            Q84 12 93 12" stroke="#CDEEFF" stroke-width="2.4"/>
  <path d="M104 44            Q98 50 89 50" stroke="#0B72BD" stroke-width="2.1"/>

  <!-- Lower plain circle node -->
  <circle cx="36" cy="70" r="21.5" fill="#3E9DE9" stroke="#2F3138" stroke-width="3.5"/>
  <path d="M24 58            Q29 52 38 52" stroke="#CDEEFF" stroke-width="2.4"/>
  <path d="M48 82            Q44 87 37 88" stroke="#0B72BD" stroke-width="2.1"/>

  <!-- Yellow sketchnote accents -->
  <path d="M62 22 L66 17            M65 28 L71 26            M109 56 L115 52            M12 43 L17 40            M57 41 L62 38" stroke="#FFB900" stroke-width="3" stroke-linecap="round"/>

  <!-- Light sketch accents -->
  <path d="M16 72            Q16 81 22 88            M101 95 L107 94" stroke="#DDF8FF" stroke-width="2" opacity="0.9"/>
</svg>

    <circle cx="111" cy="67" r="7" fill="#32BEDD"/>
    <circle cx="111" cy="87" r="7" fill="#32BEDD"/>

    <circle cx="94" cy="30" r="6" fill="#50E6FF"/>
    <circle cx="94" cy="51" r="6" fill="#50E6FF"/>
    <circle cx="94" cy="77" r="6" fill="#50E6FF"/>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Policy (sketch)</title>
  <defs>
    <linearGradient id="policyCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".5" stop-color="#29BADE"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
    <linearGradient id="policyMesh" x1="0" y1="0" x2="1" y2="1">

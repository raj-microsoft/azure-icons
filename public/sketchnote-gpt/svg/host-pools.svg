  <path d="M64 7            C94 6 119 29 121 59            C124 89 102 117 72 121            C41 125 13 104 8 74            C3 45 23 15 53 9            Q59 7 64 7 Z" fill="url(#hostPoolBlue)" stroke="#004F91" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>


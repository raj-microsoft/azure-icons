  <path d="M36 83            L64 66            L64 99 Z" fill="#9CEBFF" stroke="#0078D4" stroke-width="2.3" stroke-linejoin="round"/>

  <path d="M93 83            L64 66            L64 99 Z" fill="#50E6FF" stroke="#0078D4" stroke-width="2.3" stroke-linejoin="round"/>


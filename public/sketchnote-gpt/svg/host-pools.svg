<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Host Pools (sketch)</title>
  

  <defs>
    <linearGradient id="hostPoolBlue" x1="64" y1="7" x2="64" y2="121" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset=".58" stop-color="#0072CA"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
  </defs>


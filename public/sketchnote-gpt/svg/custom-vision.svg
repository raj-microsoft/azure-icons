<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Custom Vision (sketch)</title>
  
  <desc>Concentric Azure-blue vision lens with a cyan configuration gear at the lower right, recreated using irregular hand-drawn vector outlines, subtle marker details and a transparent background.</desc>

  <defs>
    <linearGradient id="cvBlue" x1="34" y1="18" x2="94" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#5EA0EF"/>
    </linearGradient>
    <linearGradient id="cvCyan" x1="76" y1="65" x2="119" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9CEBFF"/>
      <stop offset="1" stop-color="#50E6FF"/>
    </linearGradient>
  </defs>

  <!-- Outer vision lens -->
  <path d="M63 8            C79 7 94 14 104 26            C115 39 120 54 118 70            C117 76 115 83 112 88            L90 107            C81 114 69 119 56 118            C40 118 26 112 17 100            C7 88 5 73 8 57            C11 42 19 28 31 19            C41 12 52 8 63 8Z" fill="#0078D4" stroke="#155EA1" stroke-width="4"/>

  <!-- Second lens ring -->
  <path d="M63 17            C77 16 89 22 98 32            C107 42 111 56 109 69            C107 83 99 95 88 103            C77 111 63 114 49 109            C36 105 25 96 20 83            C15 70 17 56 23 44            C31 28 45 18 63 17Z" fill="url(#cvBlue)" stroke="#C3F1FF" stroke-width="2.6"/>

  <!-- Inner focusing ring -->
  <path d="M63 28            C75 27 86 33 93 43            C100 53 101 65 97 76            C93 88 82 97 70 100            C57 103 45 99 36 90            C27 81 24 69 27 57            C31 41 45 29 63 28Z" fill="#5EA0EF" stroke="#155EA1" stroke-width="3.2"/>

  <!-- Dark central lens -->
  <path d="M63 43            C74 42 83 49 86 59            C89 70 84 81 75 87            C65 93 53 90 46 82            C39 74 39 62 44 53            C48 47 55 43 63 43Z" fill="#005BA1" stroke="#174B78" stroke-width="3"/>

  <!-- Lens reflections -->
  <path d="M34 48 Q42 33 57 31" stroke="#C3F1FF" stroke-width="3" opacity=".8"/>

  <path d="M31 68 Q32 83 43 91" stroke="#9CEBFF" stroke-width="2.5" opacity=".75"/>

  <path d="M49 57 Q54 48 63 49" stroke="#83B9F9" stroke-width="2.6"/>

  <!-- Vision recognition points -->
  <circle cx="53" cy="53" r="8" fill="#83B9F9" stroke="#155EA1" stroke-width="2.4"/>

  <circle cx="64" cy="65" r="4.5" fill="#83B9F9" stroke="#155EA1" stroke-width="1.8"/>

  <!-- Hand-drawn cyan configuration gear -->
  <path d="     M88 64     L98 64     L102 73     L109 76     L118 72     L125 80     L121 89     L125 96     L128 99     L128 109     L119 112     L116 119     L120 126     L110 128     L103 123     L96 126     L86 123     L86 115     L79 111     L71 113     L66 104     L73 97     L72 89     L66 83     L73 75     L81 79     L85 75     Z" transform="translate(-5 -5)" fill="url(#cvCyan)" stroke="#0078D4" stroke-width="3.5"/>

  <!-- Gear internal circle -->
  <path d="M96 83            C105 82 113 89 113 98            C113 107 106 114 97 114            C88 114 81 107 81 98            C81 89 87 83 96 83Z" fill="#50E6FF" stroke="#0078D4" stroke-width="3"/>

  <!-- Gear central hub -->
  <path d="M96 91            C100 90 104 94 104 98            C104 103 100 106 96 106            C92 106 89 103 89 98            C89 94 92 91 96 91Z" fill="#FFFFFF" stroke="#0078D4" stroke-width="2.6"/>

  <!-- Gear sketch highlight -->
  <path d="M83 88 Q86 81 94 79" stroke="#E7FBFF" stroke-width="2.5"/>

  <!-- Subtle yellow annotation strokes -->
  <g stroke="#F4C542" stroke-width="2.8">
    <path d="M104 19 L109 13"/>
    <path d="M111 28 L118 26"/>
    <path d="M18 105 L13 110"/>
  </g>

  <!-- Sketchnote motion marks -->
  <g stroke="#0078D4" stroke-width="2.2">
    <path d="M36 12 L41 9"/>
    <path d="M20 32 L16 36"/>
    <path d="M45 122 L52 124"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Partner Topic (sketch)</title>
  
  <desc>Hand-drawn grey topic frame enclosing a purple circular event symbol and an Azure-blue outbound arrow, with subtle yellow marker accents.</desc>

  <defs>
    <linearGradient id="arrowBlue" x1="45" y1="55" x2="108" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="purpleRing" x1="24" y1="45" x2="76" y2="95" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn topic frame: top rail -->
  <path d="M9 10 Q11 8 15 9            L114 9 Q119 9 119 13            L119 21 L9 21 Z" fill="#949494" stroke="#727272" stroke-width="3"/>

  <!-- Top corner brackets -->
  <path d="M9 10 L9 34 Q9 36 12 36            L20 36 L20 21" fill="#A3A3A3" stroke="#777777" stroke-width="2.8"/>
  <path d="M108 21 L108 36            L116 36 Q119 36 119 33            L119 10" fill="#A3A3A3" stroke="#777777" stroke-width="2.8"/>

  <!-- Bottom rail -->
  <path d="M9 107 L119 107 L119 117            Q118 120 114 120            L14 120 Q9 120 9 116 Z" fill="#949494" stroke="#727272" stroke-width="3"/>

  <!-- Bottom corner brackets -->
  <path d="M9 94 L20 94 L20 107            L9 107 Z" fill="#A3A3A3" stroke="#777777" stroke-width="2.8"/>
  <path d="M108 94 L119 94            L119 107 L108 107 Z" fill="#A3A3A3" stroke="#777777" stroke-width="2.8"/>

  <!-- Sketchy metallic highlights -->
  <path d="M16 14 Q55 12 100 14" stroke="#D6D6D6" stroke-width="2.4"/>
  <path d="M16 113 Q58 115 103 113" stroke="#D6D6D6" stroke-width="2.4"/>
  <path d="M13 25 L13 31            M115 25 L115 31            M13 98 L13 103            M115 98 L115 103" stroke="#E5E5E5" stroke-width="2"/>

  <!-- Purple circular partner-event symbol -->
  <path d="M69 49            C62 40 49 37 39 42            C28 47 24 57 25 67            C26 78 34 87 45 89            C56 92 65 87 70 80" stroke="#6331B5" stroke-width="13"/>

  <path d="M69 49            C62 40 49 37 39 42            C28 47 24 57 25 67            C26 78 34 87 45 89            C56 92 65 87 70 80" stroke="url(#purpleRing)" stroke-width="9"/>

  <!-- Inner hand-drawn echo -->
  <path d="M61 49 Q48 41 37 50            Q25 62 35 76" stroke="#D9C4FF" stroke-width="2" opacity=".85"/>

  <!-- Blue event origin -->
  <path d="M48 55            C39 55 35 62 38 70            C41 78 51 80 57 73            C63 66 57 56 48 55 Z" fill="#5EA0EF" stroke="#006CB8" stroke-width="3"/>

  <path d="M43 61 Q48 57 53 63" stroke="#C3EAFF" stroke-width="2.5"/>

  <!-- Outbound partner-topic arrow -->
  <path d="M57 61            L91 61            L91 50            L113 69            L91 88            L91 77            L57 77            Q61 69 57 61 Z" fill="url(#arrowBlue)" stroke="#086BAA" stroke-width="3.6"/>

  <!-- Arrow marker highlights -->
  <path d="M67 65 L94 65            L94 58 L106 69" stroke="#B7E3FF" stroke-width="2.5"/>
  <path d="M69 73 L87 73" stroke="#005BA7" stroke-width="1.5" opacity=".55"/>

  <!-- Yellow sketchnote motion accents -->
  <path d="M83 43 L88 36            M96 43 L99 35            M106 47 L113 43" stroke="#F4C542" stroke-width="3"/>

  <!-- Small freehand motion strokes -->
  <path d="M74 86 L81 86            M79 92 L87 92" stroke="#32BEDD" stroke-width="2.6"/>

  <!-- Subtle handwritten-style underline -->
  <path d="M41 100 Q64 103 87 99" stroke="#F4C542" stroke-width="2.1" opacity=".8"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Azure Service Bus (sketch)</title>
  
  <desc id="desc">A cyan message envelope with folded blue facets, centered between two hand-drawn gray horizontal bus rails and four terminal posts, with subtle Azure-blue and yellow sketch accents.</desc>

  <defs>
    <linearGradient id="bus-bottom" x1="64" y1="71" x2="64" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#005BA1"/>
      <stop offset=".55" stop-color="#004F90"/>
      <stop offset="1" stop-color="#003067"/>
    </linearGradient>
  </defs>

  <!-- Upper bus rail -->
  <path d="M13 18            Q13 15 17 15            L111 15            Q115 15 115 18            L115 25            Q115 28 111 28            L17 28            Q13 28 13 25Z" fill="#949494" stroke="#626A71" stroke-width="2.6"/>

  <!-- Lower bus rail -->
  <path d="M13 101            Q13 98 17 98            L111 98            Q115 98 115 101            L115 108            Q115 111 111 111            L17 111            Q13 111 13 108Z" fill="#949494" stroke="#626A71" stroke-width="2.6"/>

  <!-- Four hand-drawn terminal posts -->
  <g fill="#999999" stroke="#606970" stroke-width="2.8">
    <path d="M9 11              Q9 8 12 8              L20 8              Q22 8 22 11              L22 34              Q22 37 19 37              L11 37              Q8 37 8 34              Z"/>

    <path d="M108 11              Q108 8 111 8              L119 8              Q122 8 122 11              L122 34              Q122 37 119 37              L111 37              Q108 37 108 34              Z"/>

    <path d="M11 90              L19 90              Q22 90 22 93              L22 117              Q22 120 19 120              L12 120              Q9 120 9 117              L9 93              Q9 90 11 90Z"/>

    <path d="M111 90              L119 90              Q122 90 122 93              L122 117              Q122 120 119 120              L111 120              Q108 120 108 117              L108 93              Q108 90 111 90Z"/>
  </g>

  <!-- Terminal marker highlights -->
  <g stroke="#D7D7D7" stroke-width="2.2" opacity=".85">
    <path d="M13 15 L13 30"/>
    <path d="M113 15 L113 30"/>
    <path d="M14 96 L14 112"/>
    <path d="M113 96 L113 112"/>
  </g>

  <!-- Subtle uneven rail highlights -->
  <g stroke="#D0D0D0" stroke-width="1.8" opacity=".85">
    <path d="M28 19 Q55 18 82 19"/>
    <path d="M45 105 Q75 104 101 105"/>
  </g>

  <!-- Central message envelope silhouette -->
  <path d="M33 53            L62 34            Q64 32 67 34            L95 53            Q97 54 97 57            L97 94            Q97 97 94 97            L34 97            Q31 97 31 94            L31 57            Q31 55 33 53Z" fill="#50E6FF" stroke="#087FAE" stroke-width="3.2"/>

  <!-- Left folded envelope facet -->
  <path d="M32 56            Q31 73 32 96            L64 75            Z" fill="#32BEDD" stroke="#168DB6" stroke-width="1.6"/>

  <!-- Right folded envelope facet -->
  <path d="M96 56            Q97 75 96 96            L64 75            Z" fill="#198AB3" stroke="#087FAE" stroke-width="1.6"/>

  <!-- Lower envelope fold -->
  <path d="M32 96            L64 75            L96 96            Q95 98 92 98            L36 98            Q33 98 32 96Z" fill="url(#bus-bottom)" stroke="#003F7C" stroke-width="2.2"/>

  <!-- Front-fold sketchnote highlights -->
  <path d="M40 92            L64 77            L88 92" stroke="#77D9F5" stroke-width="2" opacity=".9"/>

  <!-- Subtle hand-drawn envelope creases -->
  <g stroke="#B9F5FF" stroke-width="1.8" opacity=".85">
    <path d="M40 54 L59 42"/>
    <path d="M71 42 L87 53"/>
    <path d="M37 64 L38 76"/>
  </g>

  <!-- Small Azure-blue routing marks -->
  <g stroke="#0078D4" stroke-width="2.6">
    <path d="M43 43 L47 39"/>
    <path d="M50 37 L53 33"/>
    <path d="M80 37 L84 41"/>
    <path d="M87 43 L91 47"/>
  </g>

  <!-- Restrained yellow motion accents -->
  <g stroke="#FFCC4D" stroke-width="2.6">
    <path d="M26 52 L21 49"/>
    <path d="M25 60 L19 59"/>
    <path d="M102 52 L107 49"/>
    <path d="M103 60 L109 59"/>
  </g>

  <!-- Mini hand-drawn sparkle -->
  <path d="M104 39            Q105 45 111 46            Q105 47 104 53            Q103 47 97 46            Q103 45 104 39Z" fill="#FFCC4D" stroke="#D9A427" stroke-width="1.3"/>

  <!-- Tiny marker dots -->
  <g fill="#0078D4">
    <circle cx="28" cy="42" r="1.6"/>
    <circle cx="99" cy="77" r="1.6"/>
  </g>
</svg>

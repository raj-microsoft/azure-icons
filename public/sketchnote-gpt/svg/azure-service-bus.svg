<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title desc"><title>Azure Service Bus (sketch)</title>

  
  <desc id="desc">
    A cyan folded message envelope positioned between two separate,
    continuous gray brackets. The upper bracket is an inverted U,
    and the lower bracket is a U. Flat colors, uneven dark marker
    outlines, and a transparent background.
  </desc>

  <!-- Upper bracket: one continuous inverted U -->
  <path d="     M8 10     Q6 10 4 13     L4 35     Q4 38 7 38     L13 38     Q16 38 16 35     L16 22     L112 22     L112 35     Q112 38 115 38     L121 38     Q124 38 124 35     L124 13     Q123 10 120 10     Z" fill="#999999" stroke="#243447" stroke-width="3"/>

  <!-- Lower bracket: one continuous U -->
  <path d="     M7 90     Q4 90 4 93     L4 115     Q4 118 8 118     L120 118     Q124 118 124 115     L124 93     Q124 90 121 90     L115 90     Q112 90 112 93     L112 106     L16 106     L16 93     Q16 90 13 90     Z" fill="#999999" stroke="#243447" stroke-width="3"/>

  <!-- Main cyan envelope silhouette -->
  <path d="     M34 53     L61 34     Q64 31 67 34     L94 53     Q95 54 95 57     L95 91     Q95 94 92 94     L36 94     Q33 94 33 91     L33 57     Q33 55 34 53     Z" fill="#50E6FF" stroke="#243447" stroke-width="3"/>

  <!-- Left folded envelope face -->
  <path d="     M33 55     L64 75     L33 94     Q32 76 33 55     Z" fill="#32BEDD" stroke="#243447" stroke-width="2.3"/>

  <!-- Right folded envelope face -->
  <path d="     M95 55     L64 75     L95 94     Q96 76 95 55     Z" fill="#198AB3" stroke="#243447" stroke-width="2.3"/>

  <!-- Bottom folded envelope face -->
  <path d="     M33 94     L64 75     L95 94     Z" fill="#004F90" stroke="#243447" stroke-width="2.5"/>

</svg>

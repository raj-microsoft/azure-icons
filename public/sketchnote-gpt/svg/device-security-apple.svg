<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke="#203746" stroke-linecap="round" stroke-linejoin="round"><title>Device Security Apple (sketch)</title>

  
  <desc>Pink protective shield overlapping a pink device-security configuration panel with three plain circular list bullets and horizontal text lines.</desc>

  <!-- Protective shield -->
  <path d="     M44 8     Q47 6 50 9     C59 17 73 18 85 18     Q89 18 89 23     L89 49     C89 74 65 95 47 106     Q44 108 41 106     C23 95 7 76 7 49     L7 23     Q7 19 12 19     C26 18 34 17 41 9     Q43 7 44 8 Z" fill="#CE74B6" stroke-width="3.8"/>

  <!-- Inner shield surface -->
  <path d="     M44 14     C54 24 69 25 82 25     L82 49     C82 70 61 90 44 100     C27 90 14 72 14 49     L14 25     C29 25 36 23 44 14 Z" fill="#A33A85" stroke="#203746" stroke-width="2.5"/>

  <!-- Shield hand-drawn contour -->
  <path d="     M19 29 Q32 28 43 20     M19 36 L19 52     Q20 67 28 76" stroke="#F0B8DB" stroke-width="2.5"/>

  <!-- Overlapping device configuration panel -->
  <path d="     M43 62     Q43 59 47 59     L119 60     Q123 60 123 64     L123 119     Q123 123 119 123     L47 122     Q43 122 43 118 Z" fill="#DC92BF" stroke-width="3.8"/>

  <!-- Panel header -->
  <path d="     M45 65     Q45 62 48 62     L118 63     Q121 63 121 66     L121 72     L45 72 Z" fill="#F7DCEB" stroke-width="2.2"/>

  <!-- Panel separator -->
  <path d="M46 74 Q82 75 120 74" stroke-width="2"/>

  <!-- Three plain circular list bullets -->
  <circle cx="53" cy="86" r="4.2" fill="#FFFFFF" stroke-width="2"/>
  <circle cx="53" cy="99" r="4.2" fill="#FFFFFF" stroke-width="2"/>
  <circle cx="53" cy="113" r="4.2" fill="#FFFFFF" stroke-width="2"/>

  <!-- Three horizontal configuration text lines -->
  <path d="     M63 85.5 Q87 85 115 85.5     M63 98.5 Q89 98 115 98.5     M63 112.5 Q90 112 117 112.5" stroke="#FFFFFF" stroke-width="3.2"/>

  <!-- Subtle hand-drawn panel details -->
  <path d="     M48 77 L58 77     M117 78 L119 78" stroke="#F8E0EF" stroke-width="2"/>

</svg>

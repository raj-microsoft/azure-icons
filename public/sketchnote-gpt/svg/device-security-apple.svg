<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Device Security Apple (sketch)</title>
  
  <desc>Hand-drawn purple security shield with overlapping pink device configuration panel, preserving the original Azure icon's colors and symbolism.</desc>

  <defs>
    <linearGradient id="shieldPink" x1="15" y1="8" x2="87" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DC92BF"/>
      <stop offset=".5" stop-color="#CE74B6"/>
      <stop offset="1" stop-color="#A33A85"/>
    </linearGradient>
    <linearGradient id="panelPink" x1="43" y1="62" x2="121" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E6A8CE"/>
      <stop offset="1" stop-color="#DC92BF"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn protective shield silhouette -->
  <path d="M44 8            Q48 6 51 9            C59 17 72 18 85 18            Q89 18 89 23            L89 49            C89 74 65 95 47 106            Q44 108 41 106            C23 95 7 76 7 49            L7 23            Q7 19 12 19            C26 18 34 17 41 9            Q43 7 44 8Z" fill="#CE74B6" stroke="#943B7B" stroke-width="3.5"/>

  <!-- Inner shield shading -->
  <path d="M44 14            C54 24 69 25 82 25            L82 49            C82 70 61 90 44 100            C27 90 14 72 14 49            L14 25            C29 25 36 23 44 14Z" fill="url(#shieldPink)" stroke="#F0B8DB" stroke-width="2.2"/>

  <!-- Uneven marker highlight -->
  <path d="M19 29            Q32 28 43 20            M19 36 L19 52            Q20 67 28 76" stroke="#F7D4E9" stroke-width="2.6" opacity=".85"/>

  <!-- Subtle protective shield detail -->
  <path d="M44 35            L48 46            L60 46            L51 53            L54 65            L44 58            L34 65            L37 53            L28 46            L40 46Z" fill="#F5D6EA" stroke="#B95E9D" stroke-width="1.8" opacity=".75"/>

  <!-- Overlapping device security panel -->
  <path d="M43 62            Q43 59 47 59            L119 60            Q123 60 123 64            L123 119            Q123 123 119 123            L47 122            Q43 122 43 118Z" fill="url(#panelPink)" stroke="#A64C8A" stroke-width="3.5"/>

  <!-- White translucent panel header -->
  <path d="M45 65            Q45 62 48 62            L118 63            Q121 63 121 66            L121 72            L45 72Z" fill="#FFFFFF" opacity=".72"/>

  <!-- Hand-drawn separator -->
  <path d="M47 74 Q82 75 119 74" stroke="#B95E9D" stroke-width="1.7" opacity=".6"/>

  <!-- Configuration rows -->
  <g fill="#FFFFFF" opacity=".82">
    <path d="M62 84              Q62 82 65 82              L113 82              Q116 82 116 84              L116 87              Q116 89 113 89              L65 89              Q62 89 62 87Z"/>

    <path d="M62 97              Q62 95 65 95              L113 95              Q116 95 116 97              L116 100              Q116 102 113 102              L65 102              Q62 102 62 100Z"/>

    <path d="M62 111              Q62 109 65 109              L115 109              Q118 109 118 111              L118 114              Q118 116 115 116              L65 116              Q62 116 62 114Z"/>
  </g>

  <!-- Round status indicators -->
  <g fill="#FFFFFF" stroke="#B95E9D" stroke-width="1.3">
    <path d="M53 82              C56 82 58 84 58 86              C58 89 56 91 53 91              C50 91 48 89 48 86              C48 84 50 82 53 82Z"/>

    <path d="M53 95              C56 95 58 97 58 99              C58 102 56 104 53 104              C50 104 48 102 48 99              C48 97 50 95 53 95Z"/>

    <path d="M53 109              C56 109 58 111 58 113              C58 116 56 118 53 118              C50 118 48 116 48 113              C48 111 50 109 53 109Z"/>
  </g>

  <!-- Tiny hand-drawn status checkmarks -->
  <g stroke="#A33A85" stroke-width="1.8">
    <path d="M51 86 L53 88 L56 84"/>
    <path d="M51 99 L53 101 L56 97"/>
    <path d="M51 113 L53 115 L56 111"/>
  </g>

  <!-- Sketchy panel accents -->
  <path d="M48 77 L58 77            M117 78 L119 78" stroke="#F8E0EF" stroke-width="2"/>

  <!-- Restrained Azure-blue annotation marks -->
  <g stroke="#0078D4" stroke-width="2.5" opacity=".8">
    <path d="M91 40 L98 36"/>
    <path d="M94 48 L103 47"/>
  </g>

  <!-- Yellow hand-drawn emphasis -->
  <g stroke="#F4C542" stroke-width="2.8">
    <path d="M105 18 L108 11"/>
    <path d="M114 24 L121 19"/>
    <path d="M117 34 L125 33"/>
  </g>

  <!-- Small sketchnote sparkle -->
  <path d="M18 7            L20 12            L25 14            L20 16            L18 21            L16 16            L11 14            L16 12Z" fill="#F4C542" stroke="#C48B17" stroke-width="1.4"/>

</svg>

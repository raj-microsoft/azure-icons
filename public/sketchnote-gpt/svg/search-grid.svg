<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><title>Search Grid (sketch)</title>
  
  <desc>Hand-drawn blue grid with a cyan magnifying glass, representing searchable data grids.</desc>

  <g stroke="#075B9A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Grid silhouette -->
    <g fill="#258CE0">
      <path d="M34 13 Q34 10 38 10 L58 10 L58 34 L34 34 Z"/>
      <path d="M64 10 L89 10 L89 34 L64 34 Z"/>
      <path d="M95 10 L115 10 Q118 10 118 14 L118 34 L95 34 Z"/>
      <path d="M34 40 L58 40 L58 64 L34 64 Z"/>
      <path d="M64 40 L89 40 L89 64 L64 64 Z"/>
      <path d="M95 40 L118 40 L118 64 L95 64 Z"/>
      <path d="M34 70 L58 70 L58 94 L34 94 Z"/>
      <path d="M64 70 L89 70 L89 94 L64 94 Z"/>
      <path d="M95 70 L118 70 L118 94 L95 94 Z"/>
      <path d="M34 100 L58 100 L58 117 L38 117 Q34 117 34 113 Z"/>
      <path d="M64 100 L89 100 L89 117 L64 117 Z"/>
      <path d="M95 100 L118 100 L118 113 Q118 117 114 117 L95 117 Z"/>
    </g>

    <!-- Grid marker highlights -->
    <g fill="none" stroke="#83C8F4" stroke-width="2">
      <path d="M39 17 L53 17"/>
      <path d="M69 17 L83 17"/>
      <path d="M100 17 L112 17"/>
      <path d="M39 47 L53 47"/>
      <path d="M69 47 L83 47"/>
      <path d="M100 47 L112 47"/>
      <path d="M39 77 L53 77"/>
      <path d="M69 77 L83 77"/>
    </g>

    <!-- Magnifying glass handle -->
    <path d="M43 94 L21 116 Q18 120 22 123 Q25 125 28 121 L50 99" fill="none" stroke="#087DAE" stroke-width="9"/>
    <path d="M43 94 L21 116 Q18 120 22 123 Q25 125 28 121 L50 99" fill="none" stroke="#50E6FF" stroke-width="4"/>

    <!-- Search lens -->
    <circle cx="50" cy="82" r="29" fill="#50E6FF" stroke="#075B9A" stroke-width="3.5"/>
    <circle cx="50" cy="82" r="22" fill="#FFFFFF" stroke="#198AB3" stroke-width="2.5"/>

    <!-- Lens reflections -->
    <path d="M39 71 Q44 66 50 67" fill="none" stroke="#A6EFFF" stroke-width="4"/>
    <path d="M36 80 Q36 75 39 72" fill="none" stroke="#A6EFFF" stroke-width="2"/>

    <!-- Small sketchnote accent -->
    <path d="M12 48 Q17 44 22 48" fill="none" stroke="#F2C94C" stroke-width="3"/>
    <path d="M13 55 L19 55" fill="none" stroke="#F2C94C" stroke-width="2"/>
  </g>
</svg>

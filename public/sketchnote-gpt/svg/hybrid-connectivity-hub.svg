<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Hybrid Connectivity Hub (sketch)</title>

  
  <desc>
    Hand-drawn Azure Hybrid Connectivity Hub with a stepped
    blue building, seven circular windows, white entrance,
    and a plain overlapping cyan cloud. Flat colors,
    irregular charcoal marker outlines, transparent background.
  </desc>

  <!-- Main stepped building silhouette -->
  <path d="M12 3        Q5 3 4 11        L4 116        Q4 124 13 124        L85 124        Q96 124 96 114        L96 54        Q96 44 86 44        L75 44        L75 12        Q75 4 67 4        Z" fill="#168FEA" stroke="#203746" stroke-width="3.8"/>

  <!-- Upper building face -->
  <path d="M13 11        Q12 10 15 10        L66 10        Q69 10 69 13        L69 45        Q69 51 75 51        L85 51        Q89 51 89 56        L89 114        Q89 117 85 117        L14 117        Q11 117 11 113        L11 15        Q11 12 13 11 Z" fill="#0FAFFF" stroke="#203746" stroke-width="2.5"/>

  <!-- Lower blue building area -->
  <path d="M12 83        Q29 80 45 84        Q65 87 89 83        L89 115        Q89 118 85 118        L14 118        Q11 118 11 114 Z" fill="#2764E7" stroke="none"/>

  <!-- Structural stepped corner -->
  <path d="M69 12        L69 44        Q69 51 76 51        L86 51" stroke="#203746" stroke-width="2.8"/>

  <!-- Seven circular building indicators -->
  <g fill="#D8F7FF" stroke="#203746" stroke-width="2.7">

    <!-- Row 1 -->
    <path d="M26 17              C31 16 35 20 35 25              C35 30 31 34 26 34              C21 34 17 30 17 25              C17 20 21 17 26 17 Z"/>

    <path d="M51 17              C56 17 60 21 60 26              C60 31 56 35 51 35              C46 35 42 31 42 26              C42 21 46 17 51 17 Z"/>

    <!-- Row 2 -->
    <path d="M26 42              C31 41 35 45 35 50              C35 55 31 59 26 59              C21 59 17 55 17 50              C17 45 21 42 26 42 Z"/>

    <path d="M51 42              C56 42 60 46 60 51              C60 56 56 60 51 60              C46 60 42 56 42 51              C42 46 46 42 51 42 Z"/>

    <!-- Row 3 -->
    <path d="M26 67              C31 66 35 70 35 75              C35 80 31 84 26 84              C21 84 17 80 17 75              C17 70 21 67 26 67 Z"/>

    <path d="M51 67              C56 67 60 71 60 76              C60 81 56 85 51 85              C46 85 42 81 42 76              C42 71 46 67 51 67 Z"/>

    <path d="M76 67              C81 66 85 70 85 75              C85 80 81 84 76 84              C71 84 67 80 67 75              C67 70 71 67 76 67 Z"/>
  </g>

  <!-- White building entrance -->
  <path d="M34 124        L34 103        Q34 98 40 98        L61 98        Q66 98 66 103        L66 124 Z" fill="#FFFFFF" stroke="#203746" stroke-width="3"/>

  <!-- Foreground cloud: blank, no Wi-Fi or network symbol -->

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Azure Operator Insights (sketch)</title>

  
  <desc>
    Azure-blue wireless signal with concentric broadcast waves,
    a large grey analytical A, and an overlapping turquoise
    insights badge containing four white chart bars.
    Organic marker outlines, subtle yellow accents,
    and a transparent background.
  </desc>

  <defs>
    <linearGradient id="operatorGrey" x1="20" y1="24" x2="72" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#7B7B7B"/>
    </linearGradient>

    <linearGradient id="insightsTeal" x1="65" y1="64" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6D4"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Sketchnote yellow emphasis marks -->
  <g stroke="#F4B400" stroke-width="2.8" stroke-linecap="round">
    <path d="M12 16L7 10"/>
    <path d="M22 11L21 5"/>
    <path d="M94 17L99 11"/>
    <path d="M101 24L109 21"/>
  </g>

  <!-- Outer left wireless broadcast wave -->
  <path d="M20 15            C11 25 7 38 7 52            C7 66 12 79 21 89" stroke="#0078D4" stroke-width="5" stroke-linecap="round"/>

  <!-- Outer right wireless broadcast wave -->
  <path d="M78 15            C87 25 91 38 91 52            C91 66 86 79 77 89" stroke="#0078D4" stroke-width="5" stroke-linecap="round"/>

  <!-- Inner left wireless broadcast wave -->
  <path d="M32 27            C26 34 23 43 23 52            C23 61 26 69 32 76" stroke="#0078D4" stroke-width="4.3" stroke-linecap="round"/>

  <!-- Inner right wireless broadcast wave -->
  <path d="M66 27            C72 34 75 43 75 52            C75 61 72 69 66 76" stroke="#0078D4" stroke-width="4.3" stroke-linecap="round"/>

  <!-- Wireless transmitter -->
  <circle cx="49" cy="52" r="15" fill="#0078D4" stroke="#005BA1" stroke-width="3.2"/>

  <!-- Hand-drawn transmitter highlight -->
  <path d="M42 46Q49 41 56 46" stroke="#B9E3FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Large analytical A -->
  <path d="M20 119            L43 62            Q45 57 49 57            Q53 57 55 63            L75 119            L63 119            L49 78            L33 119Z" fill="url(#operatorGrey)" stroke="#656565" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A crossbar -->
  <path d="M35 101L60 101" stroke="#737373" stroke-width="4.2" stroke-linecap="round"/>

  <!-- Grey marker highlight -->
  <path d="M27 111L45 67" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Insights badge silhouette -->
  <path d="M96 63            C110 63 121 74 121 88            L121 95            C121 109 110 120 96 120            L64 120            L64 95            C64 77 77 63 96 63Z" fill="url(#insightsTeal)" stroke="#148E9B" stroke-width="3.7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Insights badge highlight -->
  <path d="M72 88            Q77 71 95 70            Q105 70 111 77" stroke="#C5FFF8" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>

  <!-- Chart baseline -->
  <path d="M72 107            Q91 109 113 107" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Bar chart: first bar -->
  <path d="M75 96            Q75 94 77 94            L81 94            Q83 94 83 96            L83 106            L75 106Z" fill="#FFFFFF" stroke="#E6FFFF" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Bar chart: second bar -->
  <path d="M86 87            Q86 85 88 85            L92 85            Q94 85 94 87            L94 106            L86 106Z" fill="#FFFFFF" stroke="#E6FFFF" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Bar chart: third bar -->
  <path d="M97 95            Q97 93 99 93            L103 93            Q105 93 105 95            L105 106            L97 106Z" fill="#FFFFFF" stroke="#E6FFFF" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Bar chart: fourth bar -->
  <path d="M108 80            Q108 78 110 78            L113 78            Q115 78 115 80            L115 106            L108 106Z" fill="#FFFFFF" stroke="#E6FFFF" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Small Azure-blue analytical annotations -->
  <g stroke="#0078D4" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
    <path d="M15 102L10 106"/>
    <path d="M23 108L19 114"/>
  </g>

  <!-- Sketchnote insight spark -->
  <g stroke="#F4B400" stroke-width="2.7" stroke-linecap="round">
    <path d="M112 57L117 52"/>
    <path d="M118 63L125 61"/>
    <path d="M121 71L126 72"/>
  </g>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Azure Applied AI Services (sketch)</title>
  
  <desc>Hand-drawn Azure Applied AI Services icon featuring a sweeping cyan ribbon, dark Azure-blue ascending curve, and small interconnected AI circuit nodes.</desc>

  <defs>
    <radialGradient id="appliedCyan" cx="28%" cy="30%" r="85%">
      <stop offset="0" stop-color="#9CEBFF"/>
      <stop offset=".65" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </radialGradient>
    <linearGradient id="appliedBlue" x1="112" y1="10" x2="29" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset=".7" stop-color="#005BA1"/>
      <stop offset="1" stop-color="#003067"/>
    </linearGradient>
  </defs>

  <!-- Sweeping cyan intelligence ribbon -->
  <path d="     M41 108     C29 105 33 94 46 86     C57 79 72 75 84 73     L99 43     C76 39 55 42 37 50     C18 59 5 74 5 91     C5 107 20 115 41 108Z" fill="url(#appliedCyan)" stroke="#159DBF" stroke-width="3.2"/>

  <!-- Organic ribbon contour -->
  <path d="     M13 84     C19 65 43 52 68 48     M15 97     Q20 106 31 106" stroke="#D9FAFF" stroke-width="3" opacity=".9"/>

  <!-- Cyan ribbon lower fold -->
  <path d="     M40 108     Q34 105 38 98     C45 87 66 80 82 77" stroke="#0078D4" stroke-width="2.5" opacity=".55"/>

  <!-- AI circuit connections -->
  <g stroke="#E7F9FF" stroke-width="3.2">
    <path d="M27 72              L27 61              Q27 57 31 57              L39 57"/>
    <path d="M45 84              L45 68              Q45 64 49 64              L65 64"/>
    <path d="M48 84              L58 84              Q62 84 62 79              L62 70"/>
    <path d="M30 97              L42 97"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#C3F1FF" stroke="#0078D4" stroke-width="2.3">
    <circle cx="27" cy="57" r="5"/>
    <circle cx="39" cy="57" r="5"/>
    <circle cx="45" cy="84" r="5"/>
    <circle cx="65" cy="64" r="5"/>
    <circle cx="62" cy="70" r="5"/>
    <circle cx="30" cy="97" r="5"/>
  </g>

  <!-- Circuit node highlights -->
  <g fill="#FFFFFF">
    <circle cx="27" cy="57" r="1.6"/>
    <circle cx="39" cy="57" r="1.6"/>
    <circle cx="45" cy="84" r="1.6"/>
    <circle cx="65" cy="64" r="1.6"/>
    <circle cx="62" cy="70" r="1.6"/>
    <circle cx="30" cy="97" r="1.6"/>
  </g>

  <!-- Dark Azure ascending intelligence ribbon -->
  <path d="     M8 110     C29 124 55 126 77 114     C98 103 113 79 124 49     Q126 44 126 40     L126 17     Q126 13 122 13     L104 13     Q100 13 98 17     C80 65 55 94 30 106     C20 111 13 112 8 110Z" fill="url(#appliedBlue)" stroke="#003F7D" stroke-width="3.5"/>

  <!-- Sketchy upper ribbon edge -->
  <path d="     M104 19     L120 19     M120 29     L120 40     C108 75 92 101 73 110" stroke="#5EA0EF" stroke-width="2.8" opacity=".8"/>

  <!-- Hand-drawn lower curve highlight -->
  <path d="     M23 115     Q50 124 72 112     M82 107     Q99 93 109 72" stroke="#2892DF" stroke-width="2.5" opacity=".8"/>

  <!-- Fine marker-style contour -->
  <path d="     M34 109     Q61 96 80 67     M86 57     Q96 40 101 24" stroke="#50B8F0" stroke-width="2" opacity=".65"/>

  <!-- Restrained yellow insight sparkle -->
  <path d="     M86 24     L86 34     M81 29     L91 29" stroke="#F7C64A" stroke-width="3"/>

  <!-- Small hand-drawn cyan accent strokes -->
  <path d="     M13 46     L7 42     M18 39     L15 32     M74 36     Q80 34 85 35" stroke="#32BEDD" stroke-width="2.5"/>

  <!-- Subtle sketchnote annotation ticks -->
  <path d="     M12 119     L7 124     M92 116     L96 121     M111 7     L114 3" stroke="#0078D4" stroke-width="2.4"/>

  <!-- Tiny yellow AI signal marks -->
  <path d="     M56 30     L59 25     M63 32     L68 28" stroke="#F7C64A" stroke-width="2.5"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>CDN Profiles (sketch)</title>
  
  <desc>
    Hand-drawn Azure CDN cloud with three horizontal
    delivery speed lines, uneven marker outlines,
    original Azure-blue gradient, subtle grey strokes,
    restrained yellow accents, and transparent background.
  </desc>

  <defs>
    <linearGradient id="cdnCloud" x1="78" y1="25" x2="78" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".52" stop-color="#268CE0"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn CDN delivery speed lines -->
  <path d="M13 43            Q11 43 11 46            Q11 49 14 49            L45 49" stroke="#B3B3B3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M5 62            Q3 62 3 65            Q3 68 6 68            L43 68" stroke="#A3A3A3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M13 81            Q11 81 11 84            Q11 87 14 87            L45 87" stroke="#7A7A7A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small irregular marker highlights -->
  <g stroke="#E6E6E6" stroke-width="1.8" stroke-linecap="round" opacity=".8">
    <path d="M16 41 L33 41"/>
    <path d="M8 60 L25 60"/>
    <path d="M17 79 L31 79"/>
  </g>

  <!-- Main cloud silhouette -->
  <path d="M45 101            C30 100 22 89 22 76            C22 62 32 52 46 51            C52 32 67 23 84 24            C102 25 114 37 115 55            C127 58 133 68 132 80            C131 92 122 101 109 102            Q106 103 102 102            L50 102            Q47 103 45 101Z" transform="translate(-6 0)" fill="url(#cdnCloud)" stroke="#145B91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Interior sketch contour -->
  <path d="M24 76            Q24 62 39 58            M46 48            Q56 30 75 30            Q94 30 103 47            M114 66            Q122 75 116 86" stroke="#A9D9FF" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".85"/>

  <!-- Gentle cloud volume highlights -->
  <path d="M45 70            Q50 58 63 57            M73 42            Q86 38 95 49" stroke="#D8F0FF" stroke-width="2.3" stroke-linecap="round" opacity=".65"/>

  <!-- Small hand-drawn CDN transfer marks -->
  <g stroke="#D7F2FF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M54 76 L76 76"/>
    <path d="M69 68 L78 76 L69 84"/>
    <path d="M86 76 L101 76"/>
    <path d="M95 69 L103 76 L95 83"/>
  </g>

  <!-- Yellow emphasis marks -->
  <g stroke="#FFD45A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M106 31 L111 23"/>
    <path d="M116 40 L124 35"/>
    <path d="M119 51 L126 50"/>
  </g>

  <!-- Hand-drawn edge accents -->
  <path d="M31 94 Q38 103 51 105            M111 98 Q119 95 123 87" stroke="#145B91" stroke-width="1.9" stroke-linecap="round" opacity=".7"/>

  <!-- Subtle trailing speed annotations -->
  <g stroke="#32D4F5" stroke-width="2.2" stroke-linecap="round">
    <path d="M7 35 L17 35"/>
    <path d="M4 97 L17 97"/>
  </g>
</svg>

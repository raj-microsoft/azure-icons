<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>FRD QA (sketch)</title>
  
  <desc>Azure-blue analytics report with ascending white chart bars, document lines, and an overlapping cyan magnifying glass representing quality assurance.</desc>

  <defs>
    <linearGradient id="reportBlue" x1="47" y1="8" x2="47" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".88" stop-color="#0078D4"/>
    </linearGradient>
    <radialGradient id="glassCyan" cx="38%" cy="30%" r="80%">
      <stop offset=".2" stop-color="#32D4F5"/>
      <stop offset=".65" stop-color="#32D2F2"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </radialGradient>
  </defs>

  <!-- Main analytics report -->
  <path d="M20 8            Q16 8 13 12            Q10 15 10 20            L10 94            Q10 104 19 107            Q22 109 27 109            L74 109            Q84 108 87 100            L87 21            Q87 9 76 8            Z" fill="url(#reportBlue)" stroke="#0067B8" stroke-width="3.5"/>

  <!-- Hand-drawn document highlights -->
  <path d="M20 17 Q27 14 39 15" stroke="#B9DEFF" stroke-width="2.5" opacity=".8"/>

  <path d="M17 26 Q16 52 17 74" stroke="#A6D4FF" stroke-width="2.2" opacity=".75"/>

  <!-- Ascending analytics bars -->
  <g stroke="#FFFFFF" stroke-width="5.2">
    <path d="M29 58 L29 61"/>
    <path d="M40 47 Q41 56 40 61"/>
    <path d="M51 37 Q52 49 51 61"/>
    <path d="M62 28 Q63 44 62 61"/>
    <path d="M73 20 Q74 42 73 61"/>
  </g>

  <!-- Subtle marker accents on bars -->
  <g stroke="#DDF2FF" stroke-width="1.5" opacity=".75">
    <path d="M37 50 L37 56"/>
    <path d="M48 41 L48 51"/>
    <path d="M59 32 L59 46"/>
    <path d="M70 25 L70 40"/>
  </g>

  <!-- Report text lines -->
  <g stroke="#FFFFFF" stroke-width="4.2">
    <path d="M28 71 Q47 70 67 71"/>
    <path d="M28 80 Q43 79 57 80"/>
    <path d="M28 89 Q45 88 65 89"/>
  </g>

  <!-- Handwritten line highlights -->
  <g stroke="#BEE7FF" stroke-width="1.7" opacity=".65">
    <path d="M32 68 L52 68"/>
    <path d="M32 77 L47 77"/>
    <path d="M32 86 L51 86"/>
  </g>

  <!-- Magnifying glass lens -->
  <path d="M83 65            C101 65 115 79 115 97            C115 115 101 125 84 125            C66 125 54 112 54 96            C54 78 67 65 83 65 Z" fill="#32D4F5" fill-opacity=".22" stroke="url(#glassCyan)" stroke-width="7"/>

  <!-- Inner lens contour -->
  <path d="M83 73            C97 73 107 83 107 97            C107 110 97 118 84 118            C71 118 62 108 62 96            C62 83 71 73 83 73 Z" stroke="#BCEFFF" stroke-width="2.3" opacity=".85"/>

  <!-- Magnifying glass handle -->
  <path d="M106 117 L122 125" stroke="#198AB3" stroke-width="9"/>

  <path d="M109 118 L121 124" stroke="#79DCF3" stroke-width="2.5"/>

  <!-- Lens reflection -->
  <path d="M69 86 Q75 75 87 76" stroke="#E4FAFF" stroke-width="3" opacity=".9"/>

  <!-- Small inspection check inside lens -->
  <path d="M73 96            L81 104            L96 88" stroke="#0078D4" stroke-width="4.5"/>

  <!-- Restrained Azure-blue sketchnote marks -->
  <g stroke="#0078D4" stroke-width="2.5">
    <path d="M112 55 Q118 59 120 65"/>
    <path d="M117 48 L122 52"/>
    <path d="M10 115 Q16 120 23 121"/>
  </g>

  <!-- Yellow marker accents -->
  <g stroke="#F2B827" stroke-width="2.8">
    <path d="M5 8 L9 12"/>
    <path d="M16 2 L18 7"/>
    <path d="M28 2 L28 6"/>
    <path d="M100 17 L106 14"/>
    <path d="M104 26 L111 25"/>
  </g>

  <!-- Small hand-drawn sparkle -->
  <path d="M108 32            L111 38            L117 41            L111 44            L108 50            L105 44            L99 41            L105 38 Z" fill="#F2B827"/>

  <!-- Loose sketchnote finishing strokes -->
  <g stroke="#B7E4FF" stroke-width="2" opacity=".8">
    <path d="M20 99 Q28 102 36 101"/>
    <path d="M43 102 L52 102"/>
  </g>
</svg>

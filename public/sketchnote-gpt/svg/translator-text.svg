<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Translator Text (sketch)</title>
  <defs>
    <linearGradient id="translatorBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ea0ef"/>
      <stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <linearGradient id="whiteFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".3"/>
    </linearGradient>
  </defs>

  <!-- Main translation tile -->
  <path d="M17 9     Q12 9 11 15     L10 108     Q10 117 19 118     L108 119     Q117 118 118 109     L118 19     Q117 10 108 10 Z" fill="url(#translatorBlue)" stroke="#005ba1" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Subtle marker highlight -->
  <path d="M19 20 Q57 13 105 19" fill="none" stroke="#9bd1ff" stroke-width="3" stroke-linecap="round" opacity=".8"/>

  <!-- Left language symbol -->
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 36 Q43 32 58 36"/>
    <path d="M43 34 Q42 57 26 72"/>
    <path d="M33 50 Q43 64 57 69"/>
    <path d="M27 77 Q43 80 57 74"/>
  </g>

  <!-- Small letter-like vector glyph -->
  <g fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M33 48 L44 48 L50 70"/>
    <path d="M36 62 L48 62"/>
  </g>

  <!-- Translation arrows -->
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 35       Q87 27 96 47       Q99 53 99 59"/>
    <path d="M89 50 L99 61 L109 50"/>
    <path d="M65 91       Q43 101 33 83       Q29 77 29 70"/>
    <path d="M39 79 L29 68 L19 79"/>
  </g>

  <!-- Right language symbol -->
  <g fill="#fff">
    <path d="M77 65 Q88 62 98 66       L98 71 Q87 68 77 72 Z"/>
    <path d="M79 79 Q88 75 97 78       L97 84 Q88 81 79 86 Z"/>
    <path d="M78 92 Q88 88 97 91       L97 97 Q88 94 78 99 Z"/>
  </g>

  <!-- Hand-drawn accent strokes -->
  <g fill="none" stroke="#ffd43b" stroke-width="2.5" stroke-linecap="round">
    <path d="M20 99 L25 96"/>
    <path d="M104 29 L108 25"/>
    <path d="M105 105 L109 101"/>
  </g>

  <!-- Sketchnote motion marks -->
  <g fill="none" stroke="#d8efff" stroke-width="2" stroke-linecap="round">
    <path d="M13 42 L8 39"/>
    <path d="M115 81 L120 78"/>
    <path d="M52 114 L60 116"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Industrial IoT (sketch)</title>
  
  <desc>Hand-drawn industrial factory inside a hexagonal IoT network frame, featuring two cyan smokestacks, three white windows, a small doorway, and three connected cyan nodes.</desc>

  <defs>
    <linearGradient id="iotCyan" x1="64" y1="19" x2="64" y2="109" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset=".55" stop-color="#39CDE9"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="iotNode" x1="0" y1="-10" x2="0" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagonal industrial network -->
  <path d="M64 5            Q66 5 69 7            L115 34            Q118 36 118 40            L118 89            Q118 93 115 95            L69 122            Q64 125 60 122            L13 95            Q10 93 10 89            L10 40            Q10 36 13 34            L60 7            Q62 5 64 5 Z" stroke="#8D8D8D" stroke-width="5"/>

  <!-- Loose gray marker highlight -->
  <path d="M64 11 L111 38 L111 88            L64 116 L17 88 L17 39 Z" stroke="#B8B8B8" stroke-width="2" stroke-dasharray="22 4 14 4" opacity=".65"/>

  <!-- Left IoT node -->
  <path d="M17 26            C24 25 30 31 30 38            C30 45 25 50 18 50            C11 50 6 45 6 38            C6 31 11 26 17 26 Z" fill="url(#iotNode)" stroke="#087DAE" stroke-width="3"/>

  <!-- Right IoT node -->
  <path d="M111 26            C118 25 123 31 123 38            C123 45 118 50 111 50            C104 50 99 45 99 38            C99 31 104 26 111 26 Z" fill="url(#iotNode)" stroke="#087DAE" stroke-width="3"/>

  <!-- Bottom IoT node -->
  <path d="M64 105            C71 105 77 110 77 117            C77 124 71 127 64 127            C57 127 51 124 51 117            C51 110 57 105 64 105 Z" fill="url(#iotNode)" stroke="#087DAE" stroke-width="3"/>

  <!-- Node highlights -->
  <g stroke="#C3F7FF" stroke-width="2.4" opacity=".9">
    <path d="M11 36 Q13 31 18 30"/>
    <path d="M105 36 Q107 31 112 30"/>
    <path d="M58 115 Q60 110 65 110"/>
  </g>

  <!-- First industrial chimney -->
  <path d="M41 56            L44 31            Q44 28 47 28            L53 28            Q56 28 56 31            L59 56 Z" fill="#32BEDD" stroke="#087DAE" stroke-width="3"/>

  <!-- Second industrial chimney -->
  <path d="M62 57            L65 40            Q65 37 68 37            L73 37            Q76 37 76 40            L79 57 Z" fill="#32BEDD" stroke="#087DAE" stroke-width="3"/>

  <!-- Factory building -->
  <path d="M34 55            Q34 52 38 52            L90 52            Q94 52 94 56            L94 86            Q94 90 90 90            L38 90            Q34 90 34 86 Z" fill="url(#iotCyan)" stroke="#087DAE" stroke-width="3.5"/>

  <!-- Uneven marker highlight -->
  <path d="M40 57 Q64 55 88 57" stroke="#B8F3FF" stroke-width="2.5" opacity=".85"/>

  <!-- Factory windows -->
  <path d="M43 64 L53 64 L53 72 L43 72 Z" fill="#FFFFFF" stroke="#1688B5" stroke-width="1.6"/>

  <path d="M59 64 L69 64 L69 72 L59 72 Z" fill="#FFFFFF" stroke="#1688B5" stroke-width="1.6"/>

  <path d="M75 64 L85 64 L85 72 L75 72 Z" fill="#FFFFFF" stroke="#1688B5" stroke-width="1.6"/>

  <!-- Small industrial doorway -->
  <path d="M70 90            L70 79            Q70 77 72 77            L79 77            Q81 77 81 79            L81 90 Z" fill="#FFFFFF" stroke="#1688B5" stroke-width="2"/>

  <!-- Factory sketch details -->
  <path d="M40 82 L40 86" stroke="#C3F7FF" stroke-width="2"/>

  <path d="M87 81 L87 86" stroke="#C3F7FF" stroke-width="2"/>

  <path d="M48 33 L46 49" stroke="#B0F2FF" stroke-width="2" opacity=".75"/>

  <path d="M69 42 L67 50" stroke="#B0F2FF" stroke-width="2" opacity=".75"/>

  <!-- Subtle Azure-blue signal marks -->
  <g stroke="#0078D4" stroke-width="2.5">
    <path d="M28 17 Q35 12 42 16"/>
    <path d="M33 21 Q37 18 41 21"/>
    <path d="M86 16 Q93 12 100 17"/>
    <path d="M87 21 Q91 18 95 21"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F4B83F" stroke-width="2.7">
    <path d="M22 62 L27 59"/>
    <path d="M21 69 L27 69"/>
    <path d="M102 63 L107 60"/>
    <path d="M103 70 L109 70"/>
  </g>

  <!-- Small marker dots -->
  <circle cx="64" cy="17" r="2.5" fill="#F4B83F"/>
  <circle cx="28" cy="99" r="2" fill="#0078D4"/>
  <circle cx="100" cy="99" r="2" fill="#0078D4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc"><title>Resource Groups (sketch)</title>

  
  <desc id="desc">Hand-drawn Azure resource group icon showing a cyan isometric cube enclosed by two grey grouping brackets.</desc>

  <defs>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4f5ff"/>
      <stop offset="1" stop-color="#9cebff"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50e6ff"/>
      <stop offset="1" stop-color="#25b9d8"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32bedd"/>
      <stop offset="1" stop-color="#168eae"/>
    </linearGradient>
  </defs>

  <!-- Left grouping bracket -->
  <path d="M27 12            L15 19            Q12 21 12 25            L12 103            Q12 107 16 109            L29 117" fill="none" stroke="#949494" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M26 12 L15 19 Q12 21 12 25" fill="none" stroke="#b9b9b9" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M12 103 Q12 107 16 109 L29 117" fill="none" stroke="#b9b9b9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right grouping bracket -->
  <path d="M101 12            L113 19            Q116 21 116 25            L116 103            Q116 107 112 109            L99 117" fill="none" stroke="#949494" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M102 12 L113 19 Q116 21 116 25" fill="none" stroke="#b9b9b9" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M116 103 Q116 107 112 109 L99 117" fill="none" stroke="#b9b9b9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central isometric resource cube: top -->
  <path d="M64 20            L101 42            L64 64            L27 42Z" fill="url(#cubeTop)" stroke="#238da9" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Left face -->
  <path d="M27 42            L64 64            L64 108            L27 86Z" fill="url(#cubeLeft)" stroke="#168eae" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Right face -->
  <path d="M101 42            L64 64            L64 108            L101 86Z" fill="url(#cubeRight)" stroke="#168eae" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Cube surface highlights -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 41 L64 58 L92 42" stroke="#e0fbff" stroke-width="2.5"/>

    <path d="M35 51 L57 64" stroke="#a4f1ff" stroke-width="2" opacity=".85"/>

    <path d="M72 63 L94 50" stroke="#72def1" stroke-width="2" opacity=".8"/>

    <path d="M35 61 L35 82" stroke="#9cebff" stroke-width="2" opacity=".65"/>

    <path d="M94 61 L94 82" stroke="#6edcf0" stroke-width="2" opacity=".65"/>
  </g>

  <!-- Internal group divisions -->
  <path d="M64 64 L64 108" fill="none" stroke="#168eae" stroke-width="2" stroke-linecap="round"/>

  <path d="M27 86 L64 108 L101 86" fill="none" stroke="#b4f5ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Yellow sketchnote accents -->
  <g fill="none" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round">
    <path d="M94 20 L100 15"/>
    <path d="M105 28 L111 26"/>
    <path d="M19 91 L14 94"/>
  </g>

  <!-- Subtle hand-drawn contour -->
  <path d="M64 18 Q83 29 103 41            L103 87 L64 111 L25 87            L25 41 Q45 29 64 18Z" fill="none" stroke="#176d83" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 3" opacity=".5"/>

</svg>

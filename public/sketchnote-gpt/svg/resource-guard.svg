<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Resource Guard (sketch)</title>
  
  <desc>Azure-blue protective shield containing a luminous cyan isometric resource cube, drawn with slightly uneven marker outlines and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="shieldBlue" x1="64" y1="9" x2="64" y2="119" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA0EF"/>
      <stop offset=".42" stop-color="#4897E9"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="shieldEdge" x1="17" y1="14" x2="111" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#258FE0"/>
      <stop offset="1" stop-color="#005AAB"/>
    </linearGradient>
  </defs>

  <!-- Outer protective shield silhouette -->
  <path d="M64 7            C79 7 73 20 111 21            Q117 21 117 27            L117 60            C117 89 88 110 66 123            Q64 125 61 123            C39 110 11 89 11 60            L11 27            Q11 21 17 21            C55 20 49 7 64 7Z" fill="url(#shieldEdge)" stroke="#155C99" stroke-width="3.8"/>

  <!-- Inner shield face -->
  <path d="M64 17            C77 17 75 30 106 31            L106 60            C106 84 83 103 64 114            C45 103 22 84 22 60            L22 31            C53 30 51 17 64 17Z" fill="url(#shieldBlue)" stroke="#91C8F5" stroke-width="2.6"/>

  <!-- Uneven hand-drawn shield highlight -->
  <path d="M28 39            L28 60            Q29 81 49 98            M36 29            Q52 27 58 21            M75 22            Q85 29 99 29" stroke="#B9DEFF" stroke-width="2.3" opacity=".75"/>

  <!-- Subtle shield sketch details -->
  <path d="M100 66            Q97 84 81 98            M58 110 L64 114 L70 110" stroke="#075A9A" stroke-width="2" opacity=".35"/>

  <!-- Isometric resource cube: top face -->
  <path d="M40 51            L64 37            L88 51            L64 65Z" fill="#C3F1FF" stroke="#FFFFFF" stroke-width="2.8"/>

  <!-- Isometric resource cube: left face -->
  <path d="M40 51            L64 65            L64 93            L40 79Z" fill="#9CEBFF" stroke="#FFFFFF" stroke-width="2.8"/>

  <!-- Isometric resource cube: right face -->
  <path d="M64 65            L88 51            L88 79            L64 93Z" fill="#50E6FF" stroke="#FFFFFF" stroke-width="2.8"/>

  <!-- Hand-drawn cube edge reinforcement -->
  <path d="M43 53 L62 64            M66 64 L85 53            M43 77 L61 88            M67 89 L85 78" stroke="#DFFFFF" stroke-width="1.6" opacity=".85"/>

  <!-- Minimal cube facet sketch strokes -->
  <path d="M47 57 L47 73            M81 58 L81 74" stroke="#178BB5" stroke-width="1.7" opacity=".4"/>

  <!-- Small marker-style cube highlight -->
  <path d="M54 48            Q63 43 70 47" stroke="#FFFFFF" stroke-width="2" opacity=".7"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M7 38 L2 33            M7 48 L1 47" stroke="#FFCA45" stroke-width="3.2"/>

  <path d="M120 41 L126 36            M121 51 L127 52" stroke="#FFCA45" stroke-width="3.2"/>

  <!-- Tiny hand-drawn sparkle -->
  <path d="M103 8 L103 16            M99 12 L107 12" stroke="#FFCA45" stroke-width="2.7"/>

  <!-- Small grounding marker details -->
  <path d="M43 119 L49 123            M79 122 L85 118" stroke="#198AB3" stroke-width="2" opacity=".4"/>
</svg>

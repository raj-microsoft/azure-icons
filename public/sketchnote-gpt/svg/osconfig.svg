      <path d="M23 67 L27 71 L34 63"/>
      <path d="M23 84 L27 88 L34 80"/>
      <path d="M23 99 L27 103 L34 95"/>
    </g>

    <!-- Checklist writing -->
    <g fill="none" stroke="#C3F1FF" stroke-width="3.2" stroke-linecap="round">
      <path d="M43 68 Q58 67 72 68"/>
      <path d="M43 84 Q55 83 65 84"/>
      <path d="M43 99 Q56 98 76 99"/>
    </g>
  </g>

  <!-- Protective shield -->
  <g stroke="#376E20" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M105 36       Q112 43 124 43       L124 65       Q124 88 106 103       Q103 106 100 103       Q80 89 80 65       L80 44       Q93 43 105 36 Z" fill="url(#shieldGreen)" transform="rotate(2 102 70)"/>

    <!-- Inner shield contour -->
    <path d="M105 43       Q113 49 119 49       L119 65       Q118 85 104 96       Q89 85 87 65       L87 50       Q97 48 105 43 Z" fill="none" stroke="#A6E76A" stroke-width="1.8"/>

    <!-- Verification check -->
    <path d="M92 68 L101 77 L116 59" fill="none" stroke="#FFFFFF" stroke-width="5.5"/>
    <path d="M92 68 L101 77 L116 59" fill="none" stroke="#E9FFD9" stroke-width="2"/>
  </g>

  <!-- Hand-drawn marker accents -->
  <g fill="none" stroke-linecap="round">
    <path d="M12 24 Q9 29 12 33" stroke="#50B9ED" stroke-width="2.2"/>
    <path d="M10 49 L13 46" stroke="#50B9ED" stroke-width="2"/>
    <path d="M72 12 Q76 9 80 12" stroke="#0078D4" stroke-width="2"/>
    <path d="M119 27 L123 24" stroke="#86D633" stroke-width="2.5"/>
    <path d="M117 109 Q121 111 124 108" stroke="#76BC2D" stroke-width="2"/>
    <path d="M68 116 Q72 119 76 116" stroke="#0078D4" stroke-width="2"/>
    <path d="M15 117 L19 114" stroke="#50B9ED" stroke-width="2"/>

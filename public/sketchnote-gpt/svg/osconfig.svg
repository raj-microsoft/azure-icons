<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><title>OSConfig (sketch)</title>
  <defs>
    <linearGradient id="paperBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
    <linearGradient id="shieldGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86D633"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>
  </defs>

  <!-- Checklist document -->
  <g stroke="#064F83" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 13       Q18 13 18 17       L17 106       Q17 111 22 111       L91 111       Q95 111 95 106       L95 19       Q95 14 90 14       Z" fill="url(#paperBlue)" transform="rotate(-1 56 62)"/>


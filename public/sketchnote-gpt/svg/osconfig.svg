    <!-- Settings gear -->
    <g fill="#C3F1FF" stroke="#C3F1FF" stroke-width="1.3">
      <path d="M47 34         L47 30 L52 28 L55 31         L59 29 L59 25 L65 25         L66 29 L70 31 L73 28         L78 30 L77 35 L80 39         L84 40 L84 46 L79 48         L77 52 L79 56 L75 60         L70 57 L66 59 L65 63         L59 63 L58 59 L54 57         L50 60 L46 56 L48 51         L45 47 L41 46 L41 40         L46 39 Z" transform="translate(-13 -7) scale(.85)"/>
      <circle cx="43" cy="40" r="7.5" fill="#0078D4" stroke="#C3F1FF" stroke-width="2"/>
      <circle cx="43" cy="40" r="3" fill="#C3F1FF" stroke="none"/>
    </g>

    <!-- Checklist ticks -->

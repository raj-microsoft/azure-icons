<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Microsoft Defender for IoT (sketch)</title>
  
  <desc>Hand-drawn cyan security shield containing exactly five white network nodes and four branching connections, faithfully following the official icon's composition.</desc>

  <!-- Outer protective shield -->
  <path d="M64 4            C76 4 80 17 108 18            Q115 18 116 24            L116 60            C116 88 84 111 66 123            Q64 125 61 123            C43 112 12 88 12 60            L12 24            Q12 18 19 18            C47 17 52 4 64 4Z" fill="#50E6FF" stroke="#184B70" stroke-width="3.8"/>

  <!-- Flat inner shield face, slightly irregular -->
  <path d="M64 10            C77 10 82 22 107 23            Q110 23 110 27            L110 60            C110 83 82 105 65 116            Q64 117 62 116            C45 104 18 83 18 60            L18 27            Q18 23 22 23            C47 22 51 10 64 10Z" fill="#9CEBFF" stroke="#2077A2" stroke-width="2.4"/>

  <!-- Five-node tree: connections behind nodes -->
  <g stroke="#42546C" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Upper-left node to central hub -->
    <path d="M52 33 Q60 43 67 54"/>

    <!-- Left node to central hub -->
    <path d="M32 61 Q48 60 67 57"/>

    <!-- Central hub to lower-left node -->
    <path d="M69 59 Q63 72 56 80"/>

    <!-- Central hub to lower-right node -->
    <path d="M73 59 Q81 71 87 85"/>
  </g>

  <!-- Subtle secondary marker retraces -->
  <g stroke="#0078D4" stroke-width="1.5" stroke-linecap="round" opacity=".75">
    <path d="M55 37 Q61 46 65 51"/>
    <path d="M36 63 L56 60"/>
    <path d="M66 66 L59 78"/>
    <path d="M77 66 Q82 75 85 80"/>
  </g>

  <!-- Upper-left node -->
  <path d="M52 25            C56 25 60 29 60 33            C60 38 57 41 52 41            C47 41 44 38 44 33            C44 29 47 25 52 25Z" fill="#FFFFFF" stroke="#274C70" stroke-width="3"/>

  <!-- Central hub, largest node -->
  <path d="M70 47            C75 47 80 51 80 57            C80 63 76 67 70 67            C64 67 60 63 60 57            C60 51 64 47 70 47Z" fill="#FFFFFF" stroke="#274C70" stroke-width="3.3"/>

  <!-- Left node -->
  <path d="M32 55            C36 55 39 58 39 62            C39 66 36 69 32 69            C28 69 25 66 25 62            C25 58 28 55 32 55Z" fill="#FFFFFF" stroke="#274C70" stroke-width="2.8"/>

  <!-- Lower-left node -->
  <path d="M56 75            C60 75 63 78 63 82            C63 86 60 89 56 89            C52 89 49 86 49 82            C49 78 52 75 56 75Z" fill="#FFFFFF" stroke="#274C70" stroke-width="2.8"/>

  <!-- Lower-right node -->
  <path d="M87 78            C92 78 95 82 95 86            C95 91 92 94 87 94            C82 94 79 91 79 86            C79 82 82 78 87 78Z" fill="#FFFFFF" stroke="#274C70" stroke-width="3"/>

  <!-- Light handmade outline imperfections -->
  <g stroke="#174A70" stroke-width="1.5" opacity=".65">
    <path d="M45 31 Q47 25 52 24"/>
    <path d="M62 52 Q65 47 70 46"/>
    <path d="M26 60 Q27 56 31 54"/>
    <path d="M50 79 Q52 75 56 74"/>
    <path d="M81 83 Q83 79 87 77"/>
  </g>

  <!-- Sparse handwritten marker touches on shield -->
  <g stroke="#0078D4" stroke-width="1.8" opacity=".55">
    <path d="M23 29 Q35 29 44 25"/>
    <path d="M83 24 Q94 29 104 29"/>
    <path d="M23 70 Q27 85 40 96"/>
    <path d="M104 70 Q101 83 92 93"/>
  </g>

  <!-- Restrained yellow marker ticks -->
  <path d="M101 45 L104 41            M104 49 L108 46" stroke="#FFBD02" stroke-width="2.6"/>

</svg>

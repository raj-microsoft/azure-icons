<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Location (sketch)</title>

  
  <desc>Hand-drawn purple location pin above concentric cyan location rings, with uneven marker outlines and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="pinPurple" x1="39" y1="9" x2="88" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B77AF4"/>
      <stop offset=".58" stop-color="#8C4FE4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>
    <linearGradient id="waterCyan" x1="30" y1="77" x2="105" y2="121" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CEBFF"/>
      <stop offset=".55" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Outer location ripple -->
  <path d="M79 69            C96 73 108 84 108 99            C108 113 89 123 64 123            C39 124 20 113 20 99            C20 87 30 78 46 72" stroke="#9CEBFF" stroke-width="4.5"/>

  <path d="M84 76            C96 82 103 89 103 99" stroke="#50E6FF" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- Middle cyan ripple -->
  <path d="M78 80            C89 84 96 91 96 100            C96 111 82 118 64 118            C46 118 32 111 32 100            C32 91 39 84 50 81" stroke="#50E6FF" stroke-width="4"/>

  <!-- Inner location ring -->
  <path d="M75 89            C82 92 86 96 86 101            C86 109 76 114 64 114            C52 114 42 109 42 101            C42 96 47 91 54 89" stroke="#32BEDD" stroke-width="4.5"/>

  <!-- Location centre -->
  <path d="M64 94            C70 94 76 97 76 102            C76 108 70 111 64 111            C57 111 52 107 52 102            C52 97 57 94 64 94Z" fill="url(#waterCyan)" stroke="#1688B8" stroke-width="2.3"/>

  <!-- Main purple location pin -->
  <path d="M64 9            C49 8 37 20 37 36            C37 48 47 66 55 83            L61 95            Q64 101 67 95            C75 78 91 50 91 36            C91 21 79 10 64 9Z" fill="url(#pinPurple)" stroke="#5831A2" stroke-width="3.8"/>

  <!-- Uneven hand-drawn contour -->
  <path d="M47 22            C53 13 65 11 74 15            M82 21            C88 28 89 38 85 47" stroke="#D8B8FF" stroke-width="2.8"/>

  <path d="M43 43            C47 57 56 76 63 91" stroke="#6431C5" stroke-width="2" opacity=".75"/>

  <!-- Pin centre -->
  <path d="M64 27            C71 27 76 32 76 39            C76 46 70 51 63 51            C56 50 52 45 52 39            C52 32 57 27 64 27Z" fill="#FFFFFF" stroke="#56309F" stroke-width="3.2"/>

  <path d="M59 32 Q63 29 68 32" stroke="#B77AF4" stroke-width="2.5"/>

  <!-- Small yellow marker highlight -->
  <path d="M88 13 L93 7            M96 24 L105 22            M91 33 L99 37" stroke="#FFCC4D" stroke-width="3.5"/>

  <!-- Handwritten-style emphasis marks -->
  <path d="M23 81 L29 77            M16 91 L23 89" stroke="#0078D4" stroke-width="2.4"/>

  <path d="M102 113 L108 116" stroke="#F4BE39" stroke-width="2.8"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Location (sketch)</title>
  
  <desc>Hand-drawn sketchnote Azure Location icon with a purple map pin above three concentric circular target rings, using flat fills, dark uneven marker outlines, restrained cyan and yellow accents, and a transparent background.</desc>

  <!-- outer target ring -->
  <circle cx="64" cy="101" r="23.5" stroke="#2E3138" stroke-width="6.8"/>
  <circle cx="64" cy="101" r="23.5" stroke="#9CEBFF" stroke-width="4.6"/>

  <!-- middle target ring -->
  <circle cx="64" cy="101" r="15.5" stroke="#2E3138" stroke-width="6"/>
  <circle cx="64" cy="101" r="15.5" stroke="#50E6FF" stroke-width="4.2"/>

  <!-- center target -->
  <circle cx="64" cy="101" r="7.8" fill="#32BEDD" stroke="#2E3138" stroke-width="3.4"/>

  <!-- location pin -->
  <path d="M64 9            C49 9 37 21 37 36            C37 48 46 63 54 79            L60 91            Q64 99 68 91            C76 76 91 49 91 36            C91 21 79 9 64 9Z" fill="#8C4FE4" stroke="#2E3138" stroke-width="3.8"/>

  <!-- pin inner contour detail -->
  <path d="M48 22            C53 16 63 13 72 16            M80 22            C85 29 86 38 83 46            M44 43            C48 56 55 72 62 87" stroke="#6A35C7" stroke-width="2.3"/>

  <!-- pin center hole -->
  <circle cx="64" cy="39" r="12" fill="#FFFFFF" stroke="#2E3138" stroke-width="3.2"/>
  <path d="M59 33 Q64 30 69 33" stroke="#B77AF4" stroke-width="2.4"/>

  <!-- subtle sketchnote accents -->
  <path d="M88 14 L94 8            M96 24 L104 22            M91 34 L99 38" stroke="#F4BE39" stroke-width="3.2"/>

  <path d="M22 84 L28 80            M17 94 L24 92" stroke="#0078D4" stroke-width="2.5"/>

  <path d="M102 114 L108 117" stroke="#F4BE39" stroke-width="2.8"/>
  <path d="M96 95 L101 97" stroke="#32BEDD" stroke-width="2.5"/>
</svg>

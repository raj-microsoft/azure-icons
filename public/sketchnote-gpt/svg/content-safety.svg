<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Content Safety (sketch)</title>
  
  <desc>Hand-drawn Azure Content Safety shield with a blank translucent content rectangle, five inspection lines, green scanning corners and a green verification badge. Flat colors, uneven dark marker outlines and transparent background.</desc>

  <!-- Four green scanning corners -->
  <g fill="none" stroke="#243447" stroke-width="6.5">
    <path d="M20 3 L4 3 L4 21"/>
    <path d="M108 3 L124 3 L124 21"/>
    <path d="M4 106 L4 124 L20 124"/>
    <path d="M124 106 L124 124 L108 124"/>
  </g>

  <g fill="none" stroke="#76BC2D" stroke-width="3.8">
    <path d="M20 3 L4 3 L4 21"/>
    <path d="M108 3 L124 3 L124 21"/>
    <path d="M4 106 L4 124 L20 124"/>
    <path d="M124 106 L124 124 L108 124"/>
  </g>

  <!-- Protective shield outer silhouette -->
  <path d="M57 10            C65 9 69 13 75 17            Q81 21 96 22            Q99 22 99 26            L100 57            C100 82 79 101 59 113            Q57 115 54 113            C33 99 15 80 15 57            L15 26            Q15 22 19 22            C35 21 39 16 45 12            Q50 9 57 10 Z" fill="#005BA1" stroke="#243447" stroke-width="3.7"/>

  <!-- Inner shield panel -->
  <path d="M57 16            C65 15 69 22 78 26            Q85 30 94 30            L95 57            C95 77 78 95 57 107            C36 94 21 77 21 57            L21 30            Q34 29 43 23            Q50 16 57 16 Z" fill="#3899E5" stroke="#243447" stroke-width="2.4"/>

  <!-- Blank translucent content rectangle: no image pictogram -->
  <path d="M30 32            Q30 30 32 30            L52 30            Q54 30 54 32            L54 45            Q54 47 52 47            L32 47            Q30 47 30 45 Z" fill="#FFFFFF" fill-opacity="0.65" stroke="#243447" stroke-width="2" stroke-linecap="round"/>

  <!-- Upper two content inspection lines -->
  <g fill="none" stroke="#243447" stroke-width="5">
    <path d="M59 34 Q70 33 83 34"/>
    <path d="M59 44 Q71 43 83 44"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.2" opacity="0.85">
    <path d="M59 34 Q70 33 83 34"/>
    <path d="M59 44 Q71 43 83 44"/>
  </g>

  <!-- Three lower content inspection lines -->
  <g fill="none" stroke="#243447" stroke-width="5">
    <path d="M30 55 Q55 54 84 55"/>
    <path d="M30 65 Q53 64 79 65"/>
    <path d="M30 75 Q45 74 62 75"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.2" opacity="0.75">
    <path d="M30 55 Q55 54 84 55"/>
    <path d="M30 65 Q53 64 79 65"/>
    <path d="M30 75 Q45 74 62 75"/>
  </g>

  <!-- Green verification badge overlapping lower-right shield -->
  <path d="M88 69            C102 68 113 80 113 94            C113 108 103 118 89 119            C75 120 64 109 64 95            C64 81 75 70 88 69 Z" fill="#76BC2D" stroke="#243447" stroke-width="3.8"/>

  <!-- Hand-drawn white verification check -->
  <path d="M74 94            L83 103            L102 84" fill="none" stroke="#243447" stroke-width="9"/>

  <path d="M74 94            L83 103            L102 84" fill="none" stroke="#FFFFFF" stroke-width="5.5"/>

  <!-- Restrained yellow sketch accents -->
  <g fill="none" stroke="#F4C542" stroke-width="2.7">
    <path d="M107 52 L113 47"/>
    <path d="M109 60 L117 59"/>
    <path d="M9 43 L5 40"/>
  </g>
</svg>

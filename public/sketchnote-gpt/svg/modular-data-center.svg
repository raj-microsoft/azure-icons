<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none"><title>Modular Data Center (sketch)</title>
  
  <desc>Azure-blue data center building with three rows of square windows, a cyan foreground gateway with white vertical bays, and a turquoise cloud connection.</desc>

  <!-- Rear data center building -->
  <path d="M58 2            Q56 2 55 5            L55 114            Q55 118 59 118            L123 118            Q127 118 127 114            L127 5            Q127 1 123 1 Z" fill="#0078D4" stroke="#203746" stroke-width="3" stroke-linejoin="round"/>

  <!-- Building windows: three columns, three rows -->
  <g fill="#A7C9EB" stroke="#203746" stroke-width="1.7" stroke-linejoin="round">

    <!-- Top row -->
    <path d="M64 14 L75 14 Q77 14 77 16              L77 29 L63 29 L63 16 Q63 14 64 14 Z"/>
    <path d="M86 14 L97 14 Q99 14 99 16              L99 29 L85 29 L85 16 Q85 14 86 14 Z"/>
    <path d="M108 14 L119 14 Q121 14 121 16              L121 29 L107 29 L107 16 Q107 14 108 14 Z"/>

    <!-- Middle row -->
    <path d="M64 42 L75 42 Q77 42 77 44              L77 57 L63 57 L63 44 Q63 42 64 42 Z"/>
    <path d="M86 42 L97 42 Q99 42 99 44              L99 57 L85 57 L85 44 Q85 42 86 42 Z"/>
    <path d="M108 42 L119 42 Q121 42 121 44              L121 57 L107 57 L107 44 Q107 42 108 42 Z"/>

    <!-- Bottom row -->
    <path d="M64 67 L75 67 Q77 67 77 69              L77 83 L63 83 L63 69 Q63 67 64 67 Z"/>
    <path d="M86 67 L97 67 Q99 67 99 69              L99 83 L85 83 L85 69 Q85 67 86 67 Z"/>
    <path d="M108 67 L119 67 Q121 67 121 69              L121 83 L107 83 L107 69 Q107 67 108 67 Z"/>
  </g>

  <!-- Foreground gateway: wide horizontal cyan housing -->
  <path d="M25 78            L108 78            Q112 78 112 82            L112 123            Q112 127 108 127            L25 127            Q21 127 21 123            L21 82            Q21 78 25 78 Z" fill="#38C9E8" stroke="#203746" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Gateway left vertical bay, interrupted by cloud connector -->
  <path d="M35 85            Q34 85 34 87            L34 99            L47 99            L47 87            Q47 85 45 85 Z" fill="#F2F8FC" stroke="#203746" stroke-width="1.6" stroke-linejoin="round"/>

  <path d="M34 110            L47 110            L47 120            Q47 122 45 122            L36 122            Q34 122 34 120 Z" fill="#F2F8FC" stroke="#203746" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Gateway middle vertical bay -->
  <path d="M60 85            L72 85            Q73 85 73 87            L73 95            Q68 92 65 92            Q62 92 60 94 Z" fill="#F2F8FC" stroke="#203746" stroke-width="1.6" stroke-linejoin="round"/>

  <path d="M60 116            Q66 119 73 115            L73 120            Q73 122 71 122            L62 122            Q60 122 60 120 Z" fill="#F2F8FC" stroke="#203746" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Gateway right vertical bay -->
  <path d="M88 85            L99 85            Q101 85 101 87            L101 120            Q101 122 99 122            L88 122            Q86 122 86 120            L86 87            Q86 85 88 85 Z" fill="#F2F8FC" stroke="#203746" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Foreground cloud connection:
       cyan cloud contour and connected circular gateway node -->
  <path d="M57 57            C52 51 45 48 39 48            C28 48 20 54 17 63            C6 64 1 72 1 83            C1 94 9 103 21 105            Q24 106 27 106            L55 106            C56 111 60 115 66 115            C72 115 77 110 77 104            C77 98 72 94 66 94            C61 94 57 97 55 101            L25 101            C15 101 7 94 7 84            C7 75 13 69 21 69            L23 69            C26 60 31 55 39 55            C46 55 52 58 57 63" fill="none" stroke="#203746" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M57 57            C52 51 45 48 39 48            C28 48 20 54 17 63            C6 64 1 72 1 83            C1 94 9 103 21 105            Q24 106 27 106            L55 106            C56 111 60 115 66 115            C72 115 77 110 77 104            C77 98 72 94 66 94            C61 94 57 97 55 101            L25 101            C15 101 7 94 7 84            C7 75 13 69 21 69            L23 69            C26 60 31 55 39 55            C46 55 52 58 57 63" fill="none" stroke="#32BEDD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

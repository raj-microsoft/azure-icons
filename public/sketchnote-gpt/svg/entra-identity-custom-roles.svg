<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Entra Identity Custom Roles (sketch)</title>
  
  <desc>A lime-green identity silhouette with a white collar and an orange isometric custom-role cube, recreated with uneven marker outlines and transparent background.</desc>

  <defs>
    <linearGradient id="identityGreen" x1="55" y1="40" x2="55" y2="122" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4EC36"/>
      <stop offset=".55" stop-color="#86D633"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>

    <linearGradient id="headGreen" x1="54" y1="5" x2="54" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B4EC36"/>
      <stop offset=".65" stop-color="#86D633"/>
      <stop offset="1" stop-color="#5E9624"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="99" y1="66" x2="99" y2="97" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB34D"/>
      <stop offset="1" stop-color="#F78D1E"/>
    </linearGradient>

    <linearGradient id="cubeLeft" x1="77" y1="91" x2="99" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAA21D"/>
      <stop offset="1" stop-color="#FFB34D"/>
    </linearGradient>

    <linearGradient id="cubeRight" x1="99" y1="90" x2="124" y2="123" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F78D1E"/>
      <stop offset="1" stop-color="#EF7100"/>
    </linearGradient>
  </defs>

  <!-- Identity head -->
  <path d="M55 5            C72 5 85 18 85 35            C85 52 72 65 55 65            C38 65 24 52 24 35            C24 18 38 5 55 5 Z" fill="url(#headGreen)" stroke="#4F8525" stroke-width="3.5"/>

  <!-- Hand-drawn head highlight -->
  <path d="M34 29            Q38 15 52 13            Q60 12 66 16" stroke="#DFFF8A" stroke-width="3.2" opacity=".9"/>

  <!-- Shoulder and torso silhouette -->
  <path d="M53 57            C27 57 12 70 6 96            Q3 108 3 115            Q3 122 11 123            L94 123            Q105 123 106 114            C105 94 99 76 87 66            Q74 57 53 57 Z" fill="url(#identityGreen)" stroke="#4F8525" stroke-width="3.7"/>

  <!-- White collar indicating identity -->
  <path d="M38 60            Q54 73 70 60            L55 102 Z" fill="#F9F9F9" fill-opacity=".88" stroke="#DCE8D2" stroke-width="2.5"/>

  <!-- Collar fold details -->
  <path d="M38 60 L55 78 L70 60" stroke="#FFFFFF" stroke-width="2.5" opacity=".95"/>

  <!-- Subtle sketched torso accents -->
  <path d="M13 105            Q17 82 30 73" stroke="#D8FA86" stroke-width="3" opacity=".85"/>

  <path d="M20 116 L36 116" stroke="#6FAE2D" stroke-width="2.4" opacity=".65"/>

  <!-- Custom-role isometric cube: top face -->
  <path d="M99 64            Q100 64 102 65            L124 78            Q126 80 124 82            L102 95            Q99 97 96 95            L74 82            Q72 80 75 78 Z" fill="url(#cubeTop)" stroke="#C76A0D" stroke-width="3.2"/>

  <!-- Cube left face -->
  <path d="M74 80            L99 95            L99 125            L74 110 Z" fill="url(#cubeLeft)" stroke="#C76A0D" stroke-width="3.2"/>

  <!-- Cube right face -->
  <path d="M99 95            L124 80            L124 110            L99 125 Z" fill="url(#cubeRight)" stroke="#C76A0D" stroke-width="3.2"/>

  <!-- Top face hand-drawn highlight -->
  <path d="M83 80            L99 71            L115 80" stroke="#FFE0A1" stroke-width="2.5" opacity=".9"/>

  <!-- Marker-style left facet -->
  <path d="M80 89            L80 106            L93 114" stroke="#FFE0A1" stroke-width="2.5" opacity=".8"/>

  <!-- Right facet shading detail -->
  <path d="M117 91 L117 105" stroke="#D76C0B" stroke-width="2.6" opacity=".75"/>

  <!-- Cube seam -->
  <path d="M99 95 L99 124" stroke="#B96511" stroke-width="2.6"/>

  <!-- Small sketchnote accents -->
  <g stroke="#0078D4" stroke-width="2.5">
    <path d="M16 17 L12 12"/>
    <path d="M22 10 L23 5"/>
    <path d="M91 37 L97 34"/>
  </g>

  <!-- Yellow marker movement strokes -->
  <g stroke="#E5B843" stroke-width="2.4">
    <path d="M108 58 L112 53"/>
    <path d="M119 62 L124 60"/>
  </g>

  <!-- Light hand-drawn contours -->
  <path d="M30 52 Q40 63 52 63" stroke="#B4EC36" stroke-width="2.1" opacity=".65"/>

  <path d="M32 126 Q44 128 55 126" stroke="#5E9624" stroke-width="2" opacity=".65"/>
</svg>

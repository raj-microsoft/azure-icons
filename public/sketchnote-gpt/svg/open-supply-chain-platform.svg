<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none"><title>Open Supply Chain Platform (sketch)</title>
  <defs>
    <linearGradient id="supplyPurple" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a67af4"/>
      <stop offset="1" stop-color="#773adc"/>
    </linearGradient>
    <radialGradient id="supplyNode" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#c3f1ff"/>
      <stop offset="1" stop-color="#9cebff"/>
    </radialGradient>
    <radialGradient id="supplyCenter" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#c3f1ff"/>
      <stop offset="1" stop-color="#9cebff"/>
    </radialGradient>
  </defs>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Circular supply-chain platform -->
    <circle cx="64" cy="64" r="56" fill="url(#supplyPurple)" stroke="#6530bd" stroke-width="3.5"/>
    <circle cx="64" cy="64" r="50" stroke="#d7c4ff" stroke-width="1.6" opacity=".75"/>

    <!-- Rotating circular supply-chain arrows -->
    <path d="M80 25c-8-4-17-6-26-3-18 5-30 21-31 39" stroke="#ffffff" stroke-width="5" fill="none"/>
    <path d="m17 54 6 8 8-7" stroke="#ffffff" stroke-width="4" fill="none"/>

    <path d="M97 49c7 13 6 29-2 41-7 11-18 18-31 19" stroke="#ffffff" stroke-width="5" fill="none"/>
    <path d="m72 101-8 8 10 5" stroke="#ffffff" stroke-width="4" fill="none"/>

    <path d="M47 103c-13-4-23-13-28-25" stroke="#ffffff" stroke-width="5" fill="none"/>
    <path d="m13 84 6-7 8 2" stroke="#ffffff" stroke-width="3.5" fill="none"/>

    <!-- Inner network ring -->
    <circle cx="64" cy="65" r="40" fill="#b796f9" opacity=".55"/>
    <circle cx="64" cy="65" r="37" stroke="#e8dcff" stroke-width="1.5" stroke-dasharray="3 4"/>

    <!-- Supply chain network connections -->
    <path d="M64 64 91 31M64 64l24 48M64 64 25 76" stroke="#e6faff" stroke-width="4"/>
    <path d="M64 64 91 31M64 64l24 48M64 64 25 76" stroke="#773adc" stroke-width="1.2" opacity=".45"/>

    <!-- Additional logistics connections -->
    <path d="M64 64 64 37M64 64 39 96M64 64 100 75" stroke="#d8f7ff" stroke-width="2.5" stroke-dasharray="3 3"/>

    <!-- Central platform hub -->
    <circle cx="64" cy="64" r="22" fill="url(#supplyCenter)" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="64" cy="64" r="15" fill="#9cebff" opacity=".65"/>
    <path d="M53 62 64 55l11 7-11 7Z" fill="#0078d4" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M53 62v8l11 7v-8Z" fill="#2764e7"/>
    <path d="M75 62v8l-11 7v-8Z" fill="#773adc"/>
    <path d="M64 69v8" stroke="#ffffff" stroke-width="1.4"/>

    <!-- Three supply-chain endpoints -->
    <circle cx="91" cy="27" r="11" fill="url(#supplyNode)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="91" cy="27" r="4" fill="#0078d4"/>

    <circle cx="91" cy="111" r="11" fill="url(#supplyNode)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="91" cy="111" r="4" fill="#0078d4"/>

    <circle cx="24" cy="77" r="11" fill="url(#supplyNode)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="24" cy="77" r="4" fill="#0078d4"/>

    <!-- Node connection details -->
    <path d="M91 38v8M91 100v-8M35 77h8" stroke="#d8f7ff" stroke-width="2.5"/>

    <!-- Yellow sketchnote highlights -->
    <path d="m103 12 2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5Z" fill="#ffd84d" stroke="#d49b20" stroke-width="1.5"/>
    <path d="M19 30h8M23 26v8" stroke="#ffca3a" stroke-width="2.5"/>
    <path d="M109 78h7M112.5 74.5v7" stroke="#ffca3a" stroke-width="2.5"/>

    <!-- Hand-drawn marker details -->
    <path d="M46 12c5-2 10-3 15-2" stroke="#e8dcff" stroke-width="1.8"/>
    <path d="M110 53c2 6 2 12 1 17" stroke="#d8f7ff" stroke-width="1.6"/>
    <path d="M39 113c5 3 10 4 15 5" stroke="#d8f7ff" stroke-width="1.6"/>
  </g>
</svg>

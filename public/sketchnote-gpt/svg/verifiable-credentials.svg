<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>Verifiable Credentials (sketch)</title>
  

  <!-- Credential document -->
  <path d="M19 12 Q19 8 23 8 L78 8 Q82 8 82 12 L82 114 Q82 118 78 118 L23 118 Q19 118 19 114 Z" fill="#a67af4" stroke="#49336f" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Folded corner -->
  <path d="M66 9 Q65 18 66 27 Q66 31 70 31 L81 31" fill="none" stroke="#49336f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Portrait -->
  <circle cx="50" cy="43" r="14" fill="#552f99" stroke="#49336f" stroke-width="2.5"/>

  <path d="M40 40 Q40 30 50 30 Q60 30 60 40            Q60 50 50 51 Q40 50 40 40Z" fill="#b796f9" stroke="#49336f" stroke-width="1.5"/>

  <path d="M34 69 Q35 58 41 56 Q50 52 59 56            Q65 59 66 69 L66 73 L34 73Z" fill="#653eab" stroke="#49336f" stroke-width="2.3" stroke-linejoin="round"/>

  <!-- Document information lines -->
  <g fill="none" stroke="#773adc" stroke-width="4" stroke-linecap="round">
    <path d="M30 83 Q49 82 68 83"/>
    <path d="M30 94 Q49 94 68 94"/>
    <path d="M30 105 Q44 104 57 105"/>
  </g>

  <!-- Certification seal: irregular green outer edge -->
  <path d="M94 51            L103 56 L114 55 L119 65            L126 73 L123 84 L125 95            L116 102 L111 112 L100 112            L90 118 L82 111 L71 108            L70 97 L64 88 L69 78            L68 67 L79 62 L85 53 Z" fill="#7fc92f" stroke="#493b29" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Plain inner green seal: NO checkmark or symbol -->
  <path d="M96 64            C107 64 117 73 117 85            C117 97 108 106 96 106            C84 106 75 97 75 85            C75 73 84 64 96 64Z" fill="#b4ec36" stroke="#493b29" stroke-width="2.5"/>

  <!-- Small irregular marker accents -->
  <g fill="none" stroke="#ffca28" stroke-width="3" stroke-linecap="round">
    <path d="M116 39 L121 33"/>
    <path d="M124 48 L128 46"/>
    <path d="M59 20 L63 16"/>
  </g>

  <!-- Hand-drawn contour details -->
  <g fill="none" stroke="#49336f" stroke-width="1.7" stroke-linecap="round">
    <path d="M21 75 Q19 92 21 107"/>
    <path d="M77 99 Q78 108 75 113"/>
    <path d="M26 17 Q29 14 35 15"/>
    <path d="M43 35 Q48 31 53 34"/>
  </g>
</svg>

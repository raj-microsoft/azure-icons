<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128"><title>VM App Definitions (sketch)</title>
  <defs>
    <linearGradient id="vmBlue" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset=".82" stop-color="#5ea0ef"/>
    </linearGradient>
    <linearGradient id="vmStand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1490df"/>
      <stop offset="1" stop-color="#1f56a3"/>
    </linearGradient>
  </defs>

  <!-- Monitor outer frame -->
  <path d="M12 12     Q12 7 18 7     L110 7     Q116 7 116 13     L116 83     Q116 89 110 89     L18 89     Q12 89 12 83 Z" fill="url(#vmBlue)" stroke="#005ba1" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Screen highlight -->
  <path d="M20 16 Q65 12 108 16" fill="none" stroke="#9bd1ff" stroke-width="3" stroke-linecap="round"/>

  <!-- Application window -->
  <rect x="30" y="23" width="68" height="53" rx="4" fill="#eaf6ff" stroke="#005ba1" stroke-width="2.5"/>

  <!-- Application title bar -->
  <path d="M30 27 Q30 23 34 23 L94 23 Q98 23 98 27 L98 35 L30 35 Z" fill="#773adc"/>

  <circle cx="38" cy="29" r="2" fill="#fff"/>
  <circle cx="45" cy="29" r="2" fill="#fff" opacity=".8"/>
  <circle cx="52" cy="29" r="2" fill="#fff" opacity=".6"/>

  <!-- App definition: layered window symbol -->
  <rect x="43" y="43" width="33" height="26" rx="2" fill="#9cebff" stroke="#0078d4" stroke-width="2.5"/>

  <path d="M50 50 L69 50 M50 57 L69 57" stroke="#0078d4" stroke-width="3" stroke-linecap="round"/>

  <!-- Deployment / configuration arrow -->
  <path d="M70 64 L84 50     M76 50 L84 50 L84 58" fill="none" stroke="#773adc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Monitor stand -->
  <path d="M48 89     L80 89     L80 105     Q80 115 94 117     Q98 118 98 123     L30 123     Q30 118 35 117     Q48 115 48 105 Z" fill="url(#vmStand)" stroke="#005ba1" stroke-width="3" stroke-linejoin="round"/>

  <!-- Stand highlight -->
  <path d="M53 94 L75 94" stroke="#9cebff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Yellow sketchnote accents -->
  <g fill="none" stroke="#ffd43b" stroke-width="3" stroke-linecap="round">
    <path d="M19 99 L12 105"/>
    <path d="M108 99 L115 105"/>
    <path d="M63 3 L63 9"/>
    <path d="M105 21 L111 17"/>
  </g>

  <!-- Marker-style details -->
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M20 79 L25 80"/>
    <path d="M103 79 L108 78"/>
    <path d="M43 119 L54 120"/>
  </g>
</svg>

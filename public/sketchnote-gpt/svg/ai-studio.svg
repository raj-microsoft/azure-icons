<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>AI Studio (sketch)</title>
  
  <desc>Hand-drawn AI Studio ribbon mark with its original blue, violet, and magenta gradients, organic marker outlines, and subtle yellow sketchnote accents.</desc>

  <defs>
    <linearGradient id="studioMain" x1="28" y1="124" x2="82" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1171ED"/>
      <stop offset=".48" stop-color="#1A71EB"/>
      <stop offset=".72" stop-color="#5175E3"/>
      <stop offset=".9" stop-color="#B77BD4"/>
      <stop offset="1" stop-color="#DA7ED0"/>
    </linearGradient>

    <linearGradient id="studioMagenta" x1="79" y1="8" x2="102" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DA7ED0"/>
      <stop offset=".22" stop-color="#F131A5"/>
      <stop offset=".52" stop-color="#EB30A2"/>
      <stop offset=".78" stop-color="#BF2C92"/>
      <stop offset="1" stop-color="#712575"/>
    </linearGradient>

    <linearGradient id="studioLoop" x1="104" y1="35" x2="104" y2="89" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DA7ED0"/>
      <stop offset=".3" stop-color="#8778DB"/>
      <stop offset=".65" stop-color="#3973E7"/>
      <stop offset="1" stop-color="#1171ED"/>
    </linearGradient>
  </defs>

  <!-- Main ascending AI Studio ribbon -->
  <path d="M8 125            Q4 125 6 119            L43 20            C47 9 56 3 67 3            L85 3            Q81 7 81 13            L80 102            C80 117 71 126 56 126            Z" fill="url(#studioMain)" stroke="#2452A4" stroke-width="3.5"/>

  <!-- Bright hand-drawn leading edge -->
  <path d="M13 115            L48 23            Q54 10 67 10" stroke="#D4D2FF" stroke-width="3" opacity=".85"/>

  <!-- Ribbon base fold -->
  <path d="M18 120            L55 120            Q72 120 73 102" stroke="#064EB4" stroke-width="2.5" opacity=".65"/>

  <!-- Upper magenta structural ribbon -->
  <path d="M85 3            C91 3 94 10 96 17            L104 37            L104 87            L78 87            L79 14            Q79 4 85 3 Z" fill="url(#studioMagenta)" stroke="#83267C" stroke-width="3.3"/>

  <!-- Magenta marker highlights -->
  <path d="M86 11            Q90 18 92 27            M96 34 L98 42" stroke="#FFC4EE" stroke-width="2.7" opacity=".85"/>

  <path d="M84 45 L84 77" stroke="#712575" stroke-width="2" opacity=".45"/>

  <!-- Right-facing curved Studio loop -->
  <path d="M105 37            L120 37            Q124 37 124 42            L124 70            C124 84 114 91 101 91            L85 91            L85 57            C85 46 93 37 105 37 Z" fill="url(#studioLoop)" stroke="#3854B8" stroke-width="3.5"/>

  <!-- Loop curvature highlight -->
  <path d="M105 44            C97 44 92 50 92 58            L92 82" stroke="#E3D9FF" stroke-width="2.9" opacity=".9"/>

  <path d="M116 45            L117 68            Q117 79 106 84" stroke="#A8C7FF" stroke-width="2.2" opacity=".75"/>

  <!-- Depth at the ribbon intersection -->
  <path d="M79 76            L85 88            Q87 91 92 91            L83 91            Q80 89 79 85 Z" fill="#712575" opacity=".65"/>

  <!-- Organic sketchnote details -->
  <path d="M31 90 L36 77            M40 68 L44 58            M49 46 L52 39" stroke="#E9E7FF" stroke-width="2.1" opacity=".7"/>

  <path d="M58 16 Q62 12 68 12            M61 114 Q68 109 68 101" stroke="#FFFFFF" stroke-width="2.2" opacity=".6"/>

  <!-- Subtle uneven marker strokes -->
  <path d="M15 127 Q35 128 55 127            M75 19 Q74 30 74 41" stroke="#4057CE" stroke-width="1.7" opacity=".65"/>

  <!-- Restrained yellow sketchnote sparks -->
  <path d="M110 17 L116 10            M117 25 L125 22            M103 12 L104 5" stroke="#F7C948" stroke-width="3" stroke-linecap="round"/>

  <path d="M16 72 L10 68            M20 63 L17 56" stroke="#F7C948" stroke-width="2.6"/>

  <!-- Small hand-drawn sparkle -->
  <path d="M39 9 L39 16            M35 12.5 L43 12.5" stroke="#F7C948" stroke-width="2.4"/>

  <!-- Minimal finishing motion strokes -->
  <path d="M106 101 Q115 99 120 94            M110 107 L116 104" stroke="#8778DB" stroke-width="2.3"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Blueprints (sketch)</title>
  
  <desc>
    Hand-drawn cyan blueprint scroll with rolled edges,
    drafting compass, irregular ink outlines, subtle
    Azure-blue shading and yellow sketch accents.
  </desc>

  <defs>
    <linearGradient id="paper" x1="24" y1="20" x2="104" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78E5FA"/>
      <stop offset=".48" stop-color="#32D4F5"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
    <linearGradient id="roll" x1="91" y1="87" x2="113" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D4F5"/>
      <stop offset="1" stop-color="#14779E"/>
    </linearGradient>
  </defs>

  <!-- Main blueprint sheet -->
  <path d="M21 20            Q24 17 30 19            L103 19            Q113 19 114 30            L114 93            Q105 87 96 91            L30 91            Q19 92 19 80            Z" fill="url(#paper)" stroke="#145C82" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Uneven marker edge -->
  <path d="M30 23 Q67 21 103 23            M110 31 Q112 55 110 82" stroke="#B5F3FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="17 5 8 6" opacity=".8"/>

  <!-- Left rolled scroll -->
  <path d="M20 82            Q16 68 18 45            L18 25            Q18 15 28 15            Q38 15 39 26            L39 72            Q36 68 30 70            Q23 71 21 79            Z" fill="#198AB3" stroke="#145C82" stroke-width="3.5" stroke-linejoin="round"/>

  <path d="M21 28            Q21 19 28 19            Q35 19 35 28            L35 64" stroke="#71DAF3" stroke-width="2.7" stroke-linecap="round" fill="none"/>

  <path d="M20 83            Q23 72 30 73            Q37 74 39 83" stroke="#083F67" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rolled lower-right corner -->
  <path d="M95 91            Q107 86 113 96            Q120 106 112 113            Q105 120 96 113            Z" fill="url(#roll)" stroke="#145C82" stroke-width="3.5" stroke-linejoin="round"/>

  <path d="M99 97            Q108 93 113 102            Q116 109 109 113" stroke="#8CE7F8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hand-drawn drafting compass -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">

    <!-- Compass circular hinge -->
    <path d="M65 34              Q65 28 71 28              Q78 28 79 35              Q79 41 72 42              Q65 42 65 34Z" stroke-width="3.4"/>

    <path d="M69 34 Q72 31 75 35              Q75 38 72 39" stroke-width="1.8"/>

    <!-- Compass legs -->
    <path d="M69 42              Q62 57 57 72              L48 94" stroke-width="4.2"/>

    <path d="M76 42              Q84 60 90 76              L98 94" stroke-width="4.2"/>

    <!-- Horizontal adjustment bar -->
    <path d="M56 70 Q72 68 88 70" stroke-width="3.5"/>

    <!-- Adjustment crosspiece -->
    <path d="M59 66 L59 74              M85 66 L85 74" stroke-width="2.2"/>

    <!-- Fine compass tips -->
    <path d="M48 94 L45 101              M98 94 L101 101" stroke-width="2.5"/>

  </g>

  <!-- Yellow drafting screw -->
  <path d="M68 69            Q72 65 76 69            Q79 73 75 76            Q70 79 67 74            Q66 71 68 69Z" fill="#FFD45A" stroke="#956A18" stroke-width="2"/>

  <path d="M70 72 L75 72" stroke="#956A18" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Blueprint construction marks -->
  <g stroke="#E7FCFF" stroke-linecap="round" opacity=".85">
    <path d="M47 39 L56 39              M51 35 L51 43" stroke-width="1.8"/>

    <path d="M92 47 L103 47              M97 42 L97 52" stroke-width="1.8"/>

    <path d="M48 84 Q72 96 98 84" stroke-width="1.7" stroke-dasharray="5 4"/>

    <path d="M44 56 L49 53              M98 63 L104 66" stroke-width="1.6"/>
  </g>

  <!-- Sketched yellow highlights -->
  <g stroke="#FFD45A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M89 30 L94 25              M96 35 L103 33              M87 23 L88 18" stroke-width="2.7"/>

    <path d="M41 103 L37 108              M48 106 L47 112" stroke-width="2.2"/>
  </g>

  <!-- Handwritten-style blueprint notation -->
  <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M44 29 L48 25 L52 29 L48 33 Z"/>
    <path d="M95 77 L101 77              M98 74 L98 80"/>
    <path d="M54 104 Q71 107 86 103" stroke-dasharray="4 4"/>
  </g>

  <!-- Ink accent strokes -->
  <path d="M24 94 Q31 98 40 96            M103 120 Q111 122 116 116" stroke="#145C82" stroke-width="2" stroke-linecap="round" opacity=".7"/>
</svg>

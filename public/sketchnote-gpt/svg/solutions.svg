<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Solutions (sketch)</title>
  
  <desc>Azure Solutions icon featuring three blue modular tiles and a cyan rounded panel containing a white connected analytics graph, with subtle hand-drawn marker details.</desc>

  <defs>
    <linearGradient id="tileBlue" x1="8" y1="52" x2="75" y2="123" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".4" stop-color="#4897E9"/>
      <stop offset=".75" stop-color="#2E8CE1"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="panelCyan" x1="82" y1="5" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#32D4F5"/>
      <stop offset=".5" stop-color="#2BBFE2"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
  </defs>

  <!-- Lower-left modular tile -->
  <path d="M11 91            Q8 91 8 94            L8 118            Q8 122 12 122            L35 122            L35 91 Z" fill="url(#tileBlue)" stroke="#176BAD" stroke-width="2.8"/>

  <!-- Upper-left modular tile -->
  <path d="M12 57            L35 57            L35 87            L8 87            L8 61            Q8 57 12 57 Z" fill="url(#tileBlue)" stroke="#176BAD" stroke-width="2.8"/>

  <!-- Lower-right modular tile -->
  <path d="M39 91            L70 91            L70 118            Q70 122 66 122            L39 122 Z" fill="url(#tileBlue)" stroke="#176BAD" stroke-width="2.8"/>

  <!-- Loose marker highlights on modular tiles -->
  <path d="M13 63 L29 63            M13 97 L13 115            M44 96 L64 96" stroke="#A6D7FF" stroke-width="2.4" opacity=".75"/>

  <!-- Slightly irregular sketch seams -->
  <path d="M36 91 Q37 105 36 121            M9 88 Q21 89 35 88" stroke="#0C65AA" stroke-width="1.8" opacity=".7"/>

  <!-- Large cyan Solutions panel -->
  <path d="M82 5            C105 4 122 22 123 45            C124 69 106 87 82 88            L40 88            L40 46            C40 22 58 5 82 5 Z" fill="url(#panelCyan)" stroke="#147EA7" stroke-width="3.5"/>

  <!-- Uneven marker contour -->
  <path d="M45 45            C46 24 61 10 82 10            M94 12            C109 17 117 29 119 43            M116 61            C111 75 99 83 83 84" stroke="#9BEAFF" stroke-width="2.5" opacity=".8"/>

  <!-- Cyan inner reflection -->
  <path d="M49 37            Q57 17 76 14            M52 42            Q57 29 65 24" stroke="#C5F4FF" stroke-width="2.5" opacity=".65"/>

  <!-- Connected analytics graph -->
  <path d="M53 64            L69 43            L88 61            L106 29" stroke="#117FA5" stroke-width="9" opacity=".3"/>

  <path d="M53 64            L69 43            L88 61            L106 29" stroke="#FFFFFF" stroke-width="5.5"/>

  <!-- First graph node -->
  <path d="M53 57            C57 57 60 60 60 64            C60 68 57 71 53 71            C49 71 46 68 46 64            C46 60 49 57 53 57 Z" fill="#FFFFFF" stroke="#D7F7FF" stroke-width="1.8"/>

  <!-- Second graph node -->
  <path d="M69 36            C73 36 76 39 76 43            C76 47 73 50 69 50            C65 50 62 47 62 43            C62 39 65 36 69 36 Z" fill="#FFFFFF" stroke="#D7F7FF" stroke-width="1.8"/>

  <!-- Third graph node -->
  <path d="M88 54            C92 54 95 57 95 61            C95 65 92 68 88 68            C84 68 81 65 81 61            C81 57 84 54 88 54 Z" fill="#FFFFFF" stroke="#D7F7FF" stroke-width="1.8"/>

  <!-- Fourth graph node -->
  <path d="M106 22            C110 22 113 25 113 29            C113 33 110 36 106 36            C102 36 99 33 99 29            C99 25 102 22 106 22 Z" fill="#FFFFFF" stroke="#D7F7FF" stroke-width="1.8"/>

  <!-- Small marker glints on graph nodes -->
  <path d="M50 61 L52 60            M66 40 L68 39            M85 58 L87 57            M103 26 L105 25" stroke="#8CDCF5" stroke-width="1.6"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M110 9 L114 3            M119 17 L125 15            M78 101 L84 98" stroke="#F4C542" stroke-width="3"/>

  <!-- Subtle handwritten-style motion strokes -->
  <path d="M84 107 Q92 105 98 108            M87 113 Q96 111 102 115" stroke="#0078D4" stroke-width="2" opacity=".55"/>
</svg>

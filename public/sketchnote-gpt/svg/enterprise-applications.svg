<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Enterprise Applications (sketch)</title>
  
  <desc>Azure-blue enterprise application grid with a cyan globe and lime-green continents, drawn with uneven marker-style vector outlines.</desc>

  <defs>
    <linearGradient id="appBlue" x1="12" y1="8" x2="105" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="globeCyan" x1="70" y1="70" x2="120" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Enterprise application grid: top row -->
  <path d="M10 14 Q10 9 15 9 L35 9 L35 35 L9 35 L9 15 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>
  <path d="M41 9 L67 9 L67 35 L41 35 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>
  <path d="M73 9 L98 9 Q103 9 103 14 L103 35 L73 35 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>

  <!-- Middle row -->
  <path d="M9 41 L35 41 L35 67 L9 67 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>
  <path d="M41 41 L67 41 L67 67 L41 67 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>
  <path d="M73 41 L103 41 L103 67 L73 67 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>

  <!-- Bottom row -->
  <path d="M9 73 L35 73 L35 103 L15 103 Q9 103 9 97 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>
  <path d="M41 73 L67 73 L67 103 L41 103 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>
  <path d="M73 73 L103 73 L103 98 Q103 103 98 103 L73 103 Z" fill="url(#appBlue)" stroke="#005BA1" stroke-width="2.8"/>

  <!-- Hand-drawn highlights on application tiles -->
  <g stroke="#A7D8FF" stroke-width="2.1" opacity=".85">
    <path d="M15 16 Q21 14 28 16"/>
    <path d="M47 16 Q53 14 60 16"/>
    <path d="M79 16 Q87 14 95 16"/>
    <path d="M15 48 Q21 46 28 48"/>
    <path d="M47 48 Q54 46 61 48"/>
    <path d="M79 48 Q87 46 95 48"/>
    <path d="M15 80 Q22 78 28 80"/>
    <path d="M47 80 Q54 78 61 80"/>
  </g>

  <!-- Globe overlapping lower-right corner -->
  <path d="M119 96            C119 109 109 120 96 121            C82 122 71 112 70 99            C69 85 79 73 93 72            C107 71 118 82 119 96 Z" fill="url(#globeCyan)" stroke="#0078D4" stroke-width="3.5"/>

  <!-- Continental silhouettes -->
  <path d="M76 85            L82 80 L88 78            L91 81 L95 82            L98 86 L94 89            L90 88 L86 92            L88 97 L85 101            L81 98 L79 93            L75 91 Z" fill="#B4EC36" stroke="#6EAB24" stroke-width="1.6"/>

  <path d="M95 99            L101 95 L107 96            L113 92 L116 97            L112 102 L108 105            L105 111 L100 116            L96 112 L97 106            L93 103 Z" fill="#B4EC36" stroke="#6EAB24" stroke-width="1.6"/>

  <!-- Small island details -->
  <path d="M104 79 L109 82 L107 85 L102 83 Z" fill="#B4EC36"/>
  <path d="M114 108 L117 106 L116 111 Z" fill="#B4EC36"/>

  <!-- Subtle globe sketch meridians -->
  <path d="M94 74            C86 84 85 107 95 119            M97 74            C108 84 109 108 98 119" stroke="#0078D4" stroke-width="1.5" opacity=".35"/>

  <!-- Globe equatorial sketch -->
  <path d="M73 97 Q94 104 116 97" stroke="#0078D4" stroke-width="1.6" opacity=".3"/>

  <!-- Restrained yellow sketchnote accents -->
  <path d="M109 64 L114 58            M117 69 L124 67            M115 76 L121 79" stroke="#FFCA28" stroke-width="3"/>

  <!-- Hand-drawn annotation marks -->
  <path d="M5 7 L9 3 M104 5 L109 9" stroke="#FFCA28" stroke-width="2.5"/>

  <!-- Marker emphasis along selected grid edges -->
  <path d="M12 38 Q22 37 33 38            M43 70 Q54 69 65 70            M12 106 Q22 107 33 106" stroke="#005BA1" stroke-width="1.8" opacity=".65"/>

</svg>

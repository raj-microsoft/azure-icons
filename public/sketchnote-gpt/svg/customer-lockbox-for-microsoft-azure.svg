<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Customer Lockbox for Microsoft Azure (sketch)</title>

  
  <desc>
    Hand-drawn Azure Customer Lockbox icon featuring a purple
    customer silhouette with a white collar and a cyan approval
    panel displaying check and reject symbols.
    Original Azure purple and cyan colors, uneven marker outlines,
    restrained yellow accents, transparent background,
    and fully editable vector paths.
  </desc>

  <defs>
    <linearGradient id="customerPurple" x1="48" y1="44" x2="48" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B77AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>

    <linearGradient id="headPurple" x1="48" y1="5" x2="48" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B77AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>

    <linearGradient id="lockboxCyan" x1="65" y1="91" x2="122" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
  </defs>

  <!-- Customer head -->
  <path d="M48 5            C64 5 77 18 77 34            C77 51 65 64 48 64            C31 64 19 51 19 35            C19 18 31 6 48 5            Z" fill="url(#headPurple)" stroke="#552F99" stroke-width="3.8"/>

  <!-- Hand-drawn head highlight -->
  <path d="M28 31            Q30 17 44 13            M54 12            Q67 16 70 28" stroke="#D7B5FF" stroke-width="3" opacity=".85"/>

  <!-- Customer shoulders and torso -->
  <path d="M43 59            Q48 62 54 59            C80 61 95 77 101 103            L105 113            Q107 121 99 122            L12 122            Q5 121 6 113            C10 84 24 64 43 59            Z" fill="url(#customerPurple)" stroke="#552F99" stroke-width="4"/>

  <!-- White collar representing customer identity -->
  <path d="M33 62            Q47 73 63 62            L48 99            Z" fill="#FFFFFF" stroke="#E8DEFA" stroke-width="2.7"/>

  <!-- Hand-drawn collar fold -->
  <path d="M37 66            Q47 75 58 66" stroke="#C8B5E8" stroke-width="2"/>

  <!-- Torso marker highlights -->
  <path d="M16 105            Q21 79 35 70            M76 69            Q91 84 94 102" stroke="#B77AF4" stroke-width="3" opacity=".8"/>

  <!-- Lockbox approval panel -->
  <path d="M65 91            Q65 87 70 87            L119 87            Q123 87 123 92            L123 117            Q123 122 118 122            L70 122            Q65 122 65 117            Z" fill="url(#lockboxCyan)" stroke="#0078D4" stroke-width="3.5"/>

  <!-- Approval half of panel -->
  <path d="M70 88            L94 88            L94 121            L70 121            Q66 121 66 117            L66 92            Q66 88 70 88            Z" fill="#32BEDD"/>

  <!-- Hand-drawn panel divider -->
  <path d="M94 90            Q95 104 94 119" stroke="#198AB3" stroke-width="2.5"/>

  <!-- White approval checkmark -->
  <path d="M72 104            L80 112            L90 99" stroke="#FFFFFF" stroke-width="5.5"/>

  <!-- White rejection cross -->
  <path d="M102 99            L115 112            M115 99            L102 112" stroke="#FFFFFF" stroke-width="5" opacity=".95"/>

  <!-- Slightly irregular marker contour on panel -->
  <path d="M71 92            L88 92            M101 92            L116 92" stroke="#B8F4FF" stroke-width="2" opacity=".8"/>

  <!-- Cyan access-control annotation -->
  <g stroke="#50E6FF" stroke-width="2.5">
    <path d="M112 70              Q119 75 120 82"/>
    <path d="M105 75              Q109 78 110 83"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#FFD400" stroke-width="3">
    <path d="M12 20 L18 25"/>
    <path d="M9 32 L16 33"/>
    <path d="M82 15 L77 21"/>
    <path d="M89 28 L81 30"/>
  </g>

  <!-- Small hand-drawn trust sparkle -->
  <g stroke="#FFD400" stroke-width="2.5">
    <path d="M111 48 L111 60"/>
    <path d="M105 54 L117 54"/>
  </g>

</svg>

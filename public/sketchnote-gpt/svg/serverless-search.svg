<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Serverless Search (sketch)</title>
  
  <desc>Hand-drawn Azure-blue cloud with a white magnifying glass, light-blue search lens, and golden serverless lightning bolt.</desc>

  <defs>
    <linearGradient id="cloudBlue" x1="64" y1="8" x2="64" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset=".82" stop-color="#5EA0EF"/>
    </linearGradient>

    <linearGradient id="boltGold" x1="98" y1="65" x2="91" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD70F"/>
      <stop offset=".5" stop-color="#FEB018"/>
      <stop offset="1" stop-color="#FEA11B"/>
    </linearGradient>
  </defs>

  <!-- Organic hand-drawn cloud silhouette -->
  <path d="M102 36            C100 17 85 7 67 8            C50 8 37 18 33 33            C15 35 5 49 6 65            C7 83 21 94 39 94            L77 94            L91 67            Q93 63 98 63            L115 63            Q120 63 122 68            C126 63 125 54 122 47            C118 40 111 37 102 36            Z" fill="url(#cloudBlue)" stroke="#1766AC" stroke-width="3.4"/>

  <!-- Uneven blue marker contour -->
  <path d="M12 59            Q15 42 34 39            M38 30            Q45 13 65 13            M79 14            Q97 20 99 39            M107 41            Q119 44 121 56" stroke="#8DCAFF" stroke-width="2.5" opacity=".8"/>

  <!-- Small internal cloud highlight -->
  <path d="M17 70            Q20 82 33 86            M45 19            Q54 12 64 13" stroke="#C4E8FF" stroke-width="2.2" opacity=".65"/>

  <!-- Magnifying glass handle -->
  <path d="M56 56            L38 75            Q35 79 38 82            Q41 85 45 82            L63 64" fill="none" stroke="#F2F2F2" stroke-width="10"/>

  <!-- Thin sketch outline around handle -->
  <path d="M55 55            L36 74            Q31 79 37 85            Q43 89 48 83            L65 66" stroke="#247AB8" stroke-width="2.2" opacity=".7"/>

  <!-- Search lens with sketch-like irregularity -->
  <path d="M87 29            C100 36 104 51 97 64            C90 77 74 82 61 74            C48 67 44 51 51 38            C58 25 74 22 87 29            Z" fill="#83B9F9" stroke="#F2F2F2" stroke-width="8"/>

  <!-- Slightly uneven inner lens contour -->
  <path d="M84 32            C95 38 99 51 93 62            C87 73 74 76 63 70            C52 64 49 51 55 40            C61 29 73 26 84 32            Z" stroke="#428DD8" stroke-width="2" opacity=".7"/>

  <!-- Lens reflection -->
  <path d="M59 46            Q65 33 79 34            Q71 33 65 40            Q61 44 59 50            Z" fill="#D5EFFF" opacity=".85"/>

  <path d="M83 35 Q91 40 92 48" stroke="#D9F1FF" stroke-width="2.8" opacity=".8"/>

  <!-- Golden serverless lightning bolt -->
  <path d="M97 68            Q98 66 101 66            L115 66            Q118 66 116 69            L98 92            L116 92            Q120 92 117 96            L85 123            Q82 126 83 121            L94 100            L80 100            Q77 100 79 96            Z" fill="url(#boltGold)" stroke="#D18A13" stroke-width="3.2"/>

  <!-- Marker-style lightning highlight -->
  <path d="M101 72            L110 71            L94 93            M91 116            L108 99" stroke="#FFE477" stroke-width="2.8" opacity=".9"/>

  <!-- Deliberately irregular bolt edge -->
  <path d="M82 97 L96 97            M115 95 L91 117" stroke="#E99513" stroke-width="1.5" opacity=".6"/>

  <!-- Restrained sketchnote accent strokes -->
  <path d="M109 17 L112 9            M117 25 L124 21            M17 100 L12 105" stroke="#F4C542" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle hand-drawn motion marks -->
  <path d="M26 103 Q34 107 42 105            M31 110 Q38 112 45 110" stroke="#0078D4" stroke-width="2" opacity=".55"/>
</svg>

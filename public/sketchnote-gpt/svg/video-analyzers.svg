<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Video Analyzers (sketch)</title>

  
  <desc>
    Hand-drawn Azure-blue cloud containing a pale cyan play
    triangle and a connected four-node video analysis graph.
    Flat colors, uneven charcoal marker outlines, and
    transparent background.
  </desc>

  <!-- Azure cloud silhouette -->
  <path d="     M35 109     C22 110 10 101 8 88     C6 74 15 62 30 58     C34 39 48 23 67 22     C88 20 103 35 105 53     C117 55 124 65 124 78     C125 94 114 108 99 109     Z" fill="#2186DB" stroke="#30343D" stroke-width="3.8"/>

  <!-- Subtle cloud contour -->
  <path d="     M19 69 Q24 62 33 62     M44 42 Q53 29 68 29     M106 61 Q116 66 117 77" stroke="#4FA3EC" stroke-width="2.6"/>

  <!-- Analysis connections inside cloud -->
  <g stroke="#30343D" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 65 L66 73"/>
    <path d="M34 91 L66 73"/>
    <path d="M66 73 L97 85"/>
    <path d="M66 73 L72 108"/>
  </g>

  <g stroke="#83B9F9" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 65 L66 73"/>
    <path d="M34 91 L66 73"/>
    <path d="M66 73 L97 85"/>
    <path d="M66 73 L72 108"/>
  </g>

  <!-- Four circular analysis nodes -->
  <g fill="#9CEBFF" stroke="#30343D" stroke-width="3.1">

    <path d="       M40 65       C40 69 37 72 33 72       C29 72 26 69 26 65       C26 61 29 58 33 58       C37 58 40 61 40 65Z"/>

    <path d="       M40 91       C40 95 37 98 33 98       C29 98 26 95 26 91       C26 87 29 84 33 84       C37 84 40 87 40 91Z"/>

    <path d="       M104 85       C104 89 101 92 97 92       C93 92 90 89 90 85       C90 81 93 78 97 78       C101 78 104 81 104 85Z"/>

    <path d="       M79 108       C79 112 76 115 72 115       C68 115 65 112 65 108       C65 104 68 101 72 101       C76 101 79 104 79 108Z"/>

  </g>

  <!-- Central play triangle, layered over graph -->
  <path d="     M53 49     Q53 46 56 48     L89 67     Q93 70 89 73     L56 92     Q53 94 53 90     Z" fill="#C3F1FF" stroke="#30343D" stroke-width="3.5"/>

</svg>

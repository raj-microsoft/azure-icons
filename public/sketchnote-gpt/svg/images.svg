<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Images (sketch)</title>
  
  <desc>Azure Images icon featuring a blue monitor, white image framing corners, a cyan isometric cube, and a dark-blue desktop stand, rendered with hand-drawn marker outlines.</desc>

  <defs>
    <linearGradient id="monitorBlue" x1="64" y1="7" x2="64" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset=".55" stop-color="#2589DF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="standBlue" x1="64" y1="91" x2="64" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F56A3"/>
      <stop offset="1" stop-color="#1490DF"/>
    </linearGradient>
  </defs>

  <!-- Main Azure monitor -->
  <path d="M9 7            Q5 7 5 12            L5 87            Q5 92 10 92            Q63 94 118 92            Q123 92 123 87            L123 12            Q123 7 118 7            Q64 6 9 7 Z" fill="url(#monitorBlue)" stroke="#165B9D" stroke-width="3.5"/>

  <!-- Subtle hand-drawn monitor highlights -->
  <path d="M12 14 Q60 11 115 14" stroke="#9CC9FA" stroke-width="2.4" opacity=".7"/>

  <path d="M11 21 L11 78" stroke="#A9D8FF" stroke-width="2" opacity=".55"/>

  <path d="M17 86 Q62 88 112 86" stroke="#005AAB" stroke-width="2" opacity=".5"/>

  <!-- Four white image framing corners -->
  <g stroke="#FFFFFF" stroke-width="5">
    <path d="M36 19              L20 19              Q18 19 18 22              L18 39"/>

    <path d="M92 19              L108 19              Q110 19 110 22              L110 39"/>

    <path d="M18 59              L18 77              Q18 80 21 80              L36 80"/>

    <path d="M110 59              L110 77              Q110 80 107 80              L92 80"/>
  </g>

  <!-- Cube top face -->
  <path d="M44 43            L62 32            Q64 31 66 32            L84 43            Q86 44 84 46            L66 57            Q64 58 62 57            L44 46            Q42 44 44 43 Z" fill="#C3F1FF" stroke="#1688B5" stroke-width="2.8"/>

  <!-- Cube left face -->
  <path d="M44 45            L64 57            L64 80            Q64 82 62 81            L44 70            Q43 69 43 67            L43 47            Q43 45 44 45 Z" fill="#9CEBFF" stroke="#1688B5" stroke-width="2.8"/>

  <!-- Cube right face -->
  <path d="M64 57            L85 45            L85 67            Q85 69 83 70            L66 81            Q64 82 64 80 Z" fill="#50E6FF" stroke="#1688B5" stroke-width="2.8"/>

  <!-- Marker highlights on cube -->
  <path d="M49 44 L64 35 L79 44" stroke="#FFFFFF" stroke-width="2.2" opacity=".85"/>

  <path d="M48 52 L48 66 L58 72" stroke="#FFFFFF" stroke-width="2" opacity=".7"/>

  <path d="M79 51 L79 66 L69 73" stroke="#C3F1FF" stroke-width="2" opacity=".8"/>

  <!-- Hand-drawn cube center seam -->
  <path d="M64 58 Q65 69 64 79" stroke="#0078D4" stroke-width="1.8" opacity=".6"/>

  <!-- Monitor support stem -->
  <path d="M54 92            L74 92            Q73 108 83 115            L45 115            Q55 108 54 92 Z" fill="url(#standBlue)" stroke="#174F94" stroke-width="3"/>

  <!-- Desktop stand base -->
  <path d="M44 115            Q39 115 37 119            L35 123            Q34 125 38 125            L90 125            Q94 125 93 122            L91 119            Q89 115 84 115 Z" fill="url(#standBlue)" stroke="#174F94" stroke-width="3"/>

  <!-- Stand highlights -->
  <path d="M58 97 L57 109" stroke="#5EA0EF" stroke-width="2" opacity=".7"/>

  <path d="M44 120 Q64 118 84 120" stroke="#75B5F1" stroke-width="2" opacity=".75"/>

  <!-- Restrained sketchnote accent marks -->
  <g stroke="#0078D4" stroke-width="2.5">
    <path d="M3 26 L1 23"/>
    <path d="M3 35 L0 35"/>
    <path d="M125 29 L127 26"/>
    <path d="M125 38 L128 38"/>
  </g>

  <!-- Small yellow emphasis accents -->
  <g stroke="#F4B83F" stroke-width="2.8">
    <path d="M96 101 L101 97"/>
    <path d="M100 108 L106 107"/>
  </g>

  <!-- Tiny hand-drawn annotation dots -->
  <circle cx="25" cy="103" r="2.3" fill="#0078D4"/>
  <circle cx="112" cy="103" r="2.3" fill="#F4B83F"/>
</svg>

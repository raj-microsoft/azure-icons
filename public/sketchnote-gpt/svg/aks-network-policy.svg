<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>AKS Network Policy (sketch)</title>
  
  <desc>Hand-drawn purple security shield enclosing an Azure-blue network node, with five cyan network nodes on the right.</desc>

  <defs>
    <linearGradient id="shield" x1="52" y1="7" x2="52" y2="121" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A67AF4"/>
      <stop offset="1" stop-color="#773ADC"/>
    </linearGradient>

    <linearGradient id="core" x1="52" y1="44" x2="52" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32D4F5"/>
      <stop offset=".5" stop-color="#29BADE"/>
      <stop offset="1" stop-color="#198AB3"/>
    </linearGradient>
  </defs>

  <!-- Hand-drawn protective shield -->
  <path d="M52 8            C65 18 81 23 97 24            Q101 24 101 28            L101 40            M101 48 L101 49            M89 99            C79 109 67 115 52 121            C20 108 3 89 3 59            L3 28            Q3 24 7 24            C23 23 39 18 52 8 Z" stroke="url(#shield)" stroke-width="8"/>

  <!-- Fine irregular shield highlight -->
  <path d="M52 15            Q31 29 10 30            L10 60            Q10 92 52 113" stroke="#D1B5FF" stroke-width="2.5" opacity=".85"/>

  <!-- Outer sketch contours -->
  <path d="M17 34 Q35 30 51 20            M13 77 Q20 98 39 109            M63 113 Q76 107 84 99" stroke="#6530C8" stroke-width="2" opacity=".65"/>

  <!-- Azure core node -->
  <path d="M52 46            C63 45 72 54 72 65            C72 77 63 86 52 86            C40 86 32 77 32 66            C32 54 41 46 52 46 Z" fill="url(#core)" stroke="#087CA8" stroke-width="3.2"/>

  <!-- Core node marker highlight -->
  <path d="M39 61 Q43 52 52 52            M38 72 Q42 79 49 80" stroke="#D6FAFF" stroke-width="2.8" opacity=".85"/>

  <!-- Five network endpoints -->
  <g fill="#50E6FF" stroke="#149FC4" stroke-width="2.5">
    <path d="M89 51              C94 50 99 54 99 59              C99 64 95 69 90 69              C85 69 81 65 81 60              C81 55 85 51 89 51 Z"/>
    <path d="M89 82              C94 81 99 85 99 90              C99 95 95 100 90 100              C85 100 81 96 81 91              C81 86 85 82 89 82 Z"/>
  </g>

  <g fill="#32BEDD" stroke="#087FAE" stroke-width="2.5">
    <path d="M117 35              C122 35 126 39 126 44              C126 49 122 53 117 53              C112 53 108 49 108 44              C108 39 112 35 117 35 Z"/>
    <path d="M117 66              C122 66 126 70 126 75              C126 80 122 84 117 84              C112 84 108 80 108 75              C108 70 112 66 117 66 Z"/>
    <path d="M117 97              C122 97 126 101 126 106              C126 111 122 115 117 115              C112 115 108 111 108 106              C108 101 112 97 117 97 Z"/>
  </g>

  <!-- Subtle network links -->
  <g stroke="#50E6FF" stroke-width="2.2" stroke-dasharray="4 5" opacity=".8">
    <path d="M98 58 L108 47"/>
    <path d="M99 62 L108 72"/>
    <path d="M99 88 L108 78"/>
    <path d="M99 94 L108 103"/>
  </g>

  <!-- Network node highlights -->
  <g stroke="#E4FCFF" stroke-width="2.2" opacity=".9">
    <path d="M86 58 L90 55"/>
    <path d="M86 89 L90 86"/>
    <path d="M113 42 L116 39"/>
    <path d="M113 73 L116 70"/>
    <path d="M113 104 L116 101"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#F7C948" stroke-width="2.8">
    <path d="M72 22 L76 15"/>
    <path d="M80 28 L87 25"/>
    <path d="M69 17 L69 11"/>
    <path d="M18 112 L13 117"/>
    <path d="M25 116 L24 123"/>
  </g>

  <!-- Tiny hand-drawn sparkle -->
  <path d="M24 10 L24 17            M20.5 13.5 L27.5 13.5" stroke="#F7C948" stroke-width="2.3"/>

</svg>

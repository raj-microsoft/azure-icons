<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Detonation (sketch)</title>
  
  <desc>Hand-drawn Azure Detonation icon featuring a blue magnifying glass with two white opposing detection marks, grey marker outlines, and subtle yellow accents.</desc>

  <defs>
    <linearGradient id="lensBlue" x1="77" y1="16" x2="77" y2="94" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83B9F9"/>
      <stop offset=".42" stop-color="#5598DA"/>
      <stop offset=".8" stop-color="#1E71B5"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
    <linearGradient id="handleGrey" x1="18" y1="110" x2="52" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#767676"/>
      <stop offset="1" stop-color="#A3A3A3"/>
    </linearGradient>
  </defs>

  <!-- Magnifying glass handle -->
  <path d="M51 79            L57 85            L28 115            Q24 119 20 115            L15 110            Q12 106 17 102Z" fill="url(#handleGrey)" stroke="#595959" stroke-width="3.5"/>

  <!-- Loose hand-drawn handle highlight -->
  <path d="M20 106 L48 79" stroke="#D2D2D2" stroke-width="2.8" opacity=".85"/>

  <path d="M24 116 L53 87" stroke="#555555" stroke-width="1.6" opacity=".65"/>

  <!-- Outer magnifying glass rim -->
  <path d="M77 11            C96 10 114 23 118 43            C123 65 110 86 90 93            C69 101 46 92 38 72            C29 50 38 28 57 17            Q67 11 77 11Z" fill="#A3A3A3" stroke="#686868" stroke-width="3.8"/>

  <!-- Blue inspection lens -->
  <path d="M77 23            C93 22 104 32 108 47            C113 63 104 77 90 83            C75 90 58 83 51 70            C43 55 48 37 62 28            Q69 24 77 23Z" fill="url(#lensBlue)" stroke="#E8F3FF" stroke-width="2.5"/>

  <!-- Hand-drawn lens highlights -->
  <path d="M57 39            Q65 27 79 28            Q89 28 96 35" stroke="#D0E8FF" stroke-width="2.6" opacity=".8"/>

  <path d="M105 61 Q102 75 90 80" stroke="#004F91" stroke-width="2" opacity=".6"/>

  <!-- Original opposing white detection marks -->
  <path d="M53 50            L75 58            Q72 66 65 66            Q57 65 55 59            Q53 55 53 50Z" fill="#F2F2F2" stroke="#F8FCFF" stroke-width="1.3"/>

  <path d="M101 50            L79 58            Q82 66 89 66            Q97 65 99 59            Q101 55 101 50Z" fill="#F2F2F2" stroke="#F8FCFF" stroke-width="1.3"/>

  <!-- Fine sketch lines beneath detection shapes -->
  <path d="M62 70 Q77 75 92 70" stroke="#075A9C" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>

  <!-- Subtle hand-drawn rim accents -->
  <path d="M47 35 Q55 19 72 17" stroke="#D7D7D7" stroke-width="2.5"/>

  <path d="M110 76 Q102 89 87 91" stroke="#6F6F6F" stroke-width="2" opacity=".75"/>

  <!-- Small Azure sketchnote motion marks -->
  <g stroke="#0078D4" stroke-width="2.4">
    <path d="M19 55 L27 57"/>
    <path d="M25 43 L32 47"/>
    <path d="M109 94 L115 100"/>
  </g>

  <!-- Restrained yellow emphasis strokes -->
  <g stroke="#F4C542" stroke-width="3">
    <path d="M112 16 L116 9"/>
    <path d="M119 24 L126 21"/>
    <path d="M117 34 L124 35"/>
  </g>

  <!-- Small hand-drawn sparkle -->
  <path d="M29 18            L31 23            L36 25            L31 27            L29 32            L27 27            L22 25            L27 23Z" fill="#F4C542" stroke="#C48B17" stroke-width="1.4"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Event Hub Clusters (sketch)</title>
  
  <desc>Three overlapping, staggered Event Hub clusters with hand-drawn grey connector frames, green event tiles, and subtle Azure-blue and yellow accents.</desc>

  <!-- Rear cluster -->
  <path d="M9 32 Q9 29 12 29 L65 29 Q68 29 68 32 L68 44" stroke="#727B82" stroke-width="4.2"/>
  <path d="M12 36 L12 72 Q12 75 15 75 L35 75" stroke="#949494" stroke-width="4.2"/>
  <path d="M17 34 Q36 32 61 34" stroke="#BBC0C2" stroke-width="1.5"/>

  <!-- Rear event tiles -->
  <path d="M24 41 L34 40 L35 50 L24 51 Z" fill="#86D633" stroke="#47791F" stroke-width="2.1"/>
  <path d="M24 56 L35 55 L34 65 L25 66 Z" fill="#76BC2D" stroke="#47791F" stroke-width="2.1"/>
  <path d="M41 41 L51 42 L50 51 L40 50 Z" fill="#76BC2D" stroke="#47791F" stroke-width="2.1"/>
  <path d="M40 56 L51 55 L52 65 L41 66 Z" fill="#5E9624" stroke="#47791F" stroke-width="2.1"/>

  <!-- Middle cluster frame -->
  <path d="M36 56 Q36 53 39 53 L91 53 Q95 53 95 57 L95 69" stroke="#737B80" stroke-width="4.5"/>
  <path d="M39 62 L39 94 Q39 97 43 97 L65 97" stroke="#949494" stroke-width="4.5"/>
  <path d="M44 58 Q66 56 89 58" stroke="#C5C8CA" stroke-width="1.4"/>

  <!-- Middle event tiles -->
  <path d="M49 67 L59 66 L60 76 L49 77 Z" fill="#86D633" stroke="#47791F" stroke-width="2.1"/>
  <path d="M49 82 L60 81 L59 91 L49 92 Z" fill="#76BC2D" stroke="#47791F" stroke-width="2.1"/>
  <path d="M66 67 L76 68 L75 77 L65 76 Z" fill="#76BC2D" stroke="#47791F" stroke-width="2.1"/>
  <path d="M65 82 L76 81 L77 91 L66 92 Z" fill="#5E9624" stroke="#47791F" stroke-width="2.1"/>

  <!-- Front cluster grey frame -->
  <path d="M69 75 Q69 72 72 72 L116 72 Q119 72 119 76 L119 112" stroke="#8B9398" stroke-width="5"/>
  <path d="M72 80 L72 113 Q72 117 76 117 L115 117 Q119 117 119 113" stroke="#949494" stroke-width="5"/>
  <path d="M78 77 Q95 75 113 77" stroke="#C7CACC" stroke-width="1.5"/>
  <path d="M77 112 Q96 114 114 112" stroke="#B8BEC0" stroke-width="1.5"/>

  <!-- Front cluster grid -->
  <path d="M80 83 L91 82 L92 93 L81 94 Z" fill="#86D633" stroke="#47791F" stroke-width="2.2"/>
  <path d="M97 83 L108 84 L107 94 L96 93 Z" fill="#76BC2D" stroke="#47791F" stroke-width="2.2"/>
  <path d="M80 99 L91 98 L92 109 L81 110 Z" fill="#76BC2D" stroke="#47791F" stroke-width="2.2"/>
  <path d="M97 99 L108 98 L109 109 L97 110 Z" fill="#5E9624" stroke="#47791F" stroke-width="2.2"/>

  <!-- Subtle marker strokes inside event tiles -->
  <g stroke="#D7F4AB" stroke-width="1.5" opacity=".8">
    <path d="M27 44 L31 43"/>
    <path d="M27 59 L31 58"/>
    <path d="M52 70 L56 69"/>
    <path d="M52 85 L56 84"/>
    <path d="M83 86 L88 85"/>
    <path d="M99 86 L104 87"/>
    <path d="M83 102 L88 101"/>
  </g>

  <!-- Hand-drawn Azure-blue cluster connections -->
  <path d="M64 38 Q75 40 79 49" stroke="#0078D4" stroke-width="2.7" stroke-dasharray="4 5"/>
  <path d="M75 46 L79 50 L81 43" stroke="#0078D4" stroke-width="2.5"/>
  <path d="M93 61 Q105 62 109 69" stroke="#0078D4" stroke-width="2.7" stroke-dasharray="4 5"/>
  <path d="M105 67 L110 70 L111 63" stroke="#0078D4" stroke-width="2.5"/>

  <!-- Yellow sketchnote accents -->
  <g stroke="#F2B827" stroke-width="2.6">
    <path d="M15 17 L18 23"/>
    <path d="M24 14 L23 21"/>
    <path d="M30 23 L36 20"/>
    <path d="M106 48 L109 54"/>
    <path d="M115 47 L115 54"/>
    <path d="M120 56 L125 53"/>
  </g>

  <!-- Azure marker annotations -->
  <g stroke="#0078D4" stroke-width="2" opacity=".85">
    <path d="M7 84 Q11 87 16 85"/>
    <path d="M18 89 L22 91"/>
    <path d="M53 108 Q58 111 63 108"/>
  </g>

  <!-- Small hand-drawn event sparks -->
  <g fill="#F2B827">
    <path d="M58 17 L60 22 L65 24 L60 26 L58 31 L56 26 L51 24 L56 22 Z"/>
    <circle cx="123" cy="36" r="2.3"/>
    <circle cx="29" cy="111" r="2"/>
  </g>
</svg>

  <path d="M32 9            Q29 9 29 13            L29 115            Q29 120 34 120            L94 120            Q99 120 99 115            L99 13            Q99 8 94 8            L34 8            Q30 8 32 9Z" fill="#3990E4" stroke="#203746" stroke-width="4"/>


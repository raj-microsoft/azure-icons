<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Batch Accounts (sketch)</title>

  
  <desc>
    Azure Batch Accounts illustrated as a large blue job-list
    panel, a curved grey batch-transfer arrow, and two
    overlapping smaller blue account panels. Uneven marker
    outlines, original Azure colours, subtle yellow accents,
    and a transparent background.
  </desc>

  <defs>
    <linearGradient id="batchBlue" x1="9" y1="7" x2="82" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="batchDark" x1="70" y1="75" x2="119" y2="119" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#005BA1"/>
    </linearGradient>
  </defs>

  <!-- Main batch account panel -->
  <path d="M10 9        Q10 6 14 7        L88 8        Q92 8 92 12        L91 61        Q91 65 87 65        L13 65        Q9 65 9 61Z" fill="url(#batchBlue)" stroke="#005BA1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Light Azure panel header -->
  <path d="M10 13        Q10 8 15 9        L86 10        Q90 10 90 14        L90 22        L10 22Z" fill="#83B9F9" stroke="#4D91DC" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Header marker highlight -->
  <path d="M16 13 L80 13" stroke="#C9E4FF" stroke-width="2" stroke-linecap="round" opacity=".85"/>

  <!-- Main account list rows -->
  <path d="M20 29        Q20 27 23 27        L78 28        Q80 28 80 30        L80 34        Q80 36 78 36        L22 36        Q20 36 20 34Z" fill="#FFFFFF" stroke="#D5EDFF" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M20 40        Q20 38 23 38        L78 39        Q80 39 80 41        L80 45        Q80 47 78 47        L22 47        Q20 47 20 45Z" fill="#FFFFFF" stroke="#D5EDFF" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M20 51        Q20 49 23 49        L78 50        Q80 50 80 52        L80 56        Q80 58 78 58        L22 58        Q20 58 20 56Z" fill="#FFFFFF" stroke="#D5EDFF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Batch-processing arrow -->
  <path d="M83 21        C106 21 115 34 115 52        L122 52        L111 65        L100 52        L107 52        C107 39 102 31 83 31Z" fill="#949494" stroke="#686868" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow highlight -->
  <path d="M93 25        C107 28 111 38 111 48" stroke="#C8C8C8" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Rear output account panel -->
  <path d="M74 78        Q74 75 77 75        L119 75        Q122 75 122 78        L122 113        Q122 116 119 116        L77 116        Q74 116 74 113Z" fill="#005BA1" stroke="#00477F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rear panel highlight -->
  <path d="M79 80 L116 80" stroke="#328BCB" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- Front output account panel -->
  <path d="M64 69        Q64 66 68 66        L109 67        Q112 67 112 70        L112 105        Q112 108 109 108        L68 108        Q64 108 64 105Z" fill="url(#batchDark)" stroke="#004F91" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Light blue front panel header -->
  <path d="M65 71        Q65 68 69 69        L107 69        Q110 69 110 72        L110 78        L65 78Z" fill="#83B9F9" stroke="#4C96DE" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Front account list -->
  <path d="M72 84 L103 84        Q105 84 105 86        L105 88        L72 88Z" fill="#FFFFFF" stroke="#D5EDFF" stroke-width="1.2" stroke-linejoin="round"/>

  <path d="M72 92 L103 92        Q105 92 105 94        L105 96        L72 96Z" fill="#FFFFFF" stroke="#D5EDFF" stroke-width="1.2" stroke-linejoin="round"/>

  <path d="M72 100 L103 100        Q105 100 105 102        L105 104        L72 104Z" fill="#FFFFFF" stroke="#D5EDFF" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Subtle panel pen marks -->
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity=".55">
    <path d="M24 31 L40 31"/>
    <path d="M24 42 L40 42"/>
    <path d="M24 53 L40 53"/>
    <path d="M75 86 L86 86"/>
    <path d="M75 94 L86 94"/>
  </g>

  <!-- Hand-drawn motion strokes -->
  <g stroke="#0078D4" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M29 73 L41 73"/>
    <path d="M34 79 L49 79"/>
    <path d="M40 85 L54 85"/>
  </g>

  <!-- Restrained yellow sketchnote accents -->
  <g stroke="#E9BF4B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M23 5 L20 1"/>
    <path d="M31 5 L32 1"/>
    <path d="M105 15 L111 10"/>
    <path d="M112 20 L120 18"/>
    <path d="M10 77 L4 80"/>
    <path d="M14 85 L9 90"/>
    <path d="M52 112 L48 119"/>
    <path d="M60 116 L60 123"/>
  </g>

  <!-- Small sketchnote sparkle marks -->
  <g fill="#F1CB5B">
    <path d="M101 7 L103 3 L105 7 L103 11Z"/>
    <path d="M22 104 L24 100 L26 104 L24 108Z"/>
    <circle cx="119" cy="123" r="1.7"/>
    <circle cx="42" cy="119" r="1.6"/>
  </g>

  <!-- Organic marker imperfections -->
  <g stroke="#005BA1" stroke-width="1.5" stroke-linecap="round" opacity=".65">
    <path d="M13 59 L16 63"/>
    <path d="M86 11 L90 15"/>
    <path d="M67 104 L70 107"/>
    <path d="M118 110 L121 107"/>
  </g>

</svg>

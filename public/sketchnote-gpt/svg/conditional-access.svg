<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none"><title>Conditional Access (sketch)</title>

  
  <desc>
    Hand-drawn Azure Conditional Access shield with an
    integrated golden padlock. Original Azure-blue and
    yellow palette, irregular marker outlines, subtle
    sketch highlights, and a transparent background.
  </desc>

  <defs>
    <linearGradient id="shieldBlue" x1="32" y1="15" x2="91" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EA0EF"/>
      <stop offset="0.55" stop-color="#2E8CE1"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>

    <linearGradient id="lockGold" x1="43" y1="47" x2="86" y2="91" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE452"/>
      <stop offset="0.55" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#FFBD02"/>
    </linearGradient>
  </defs>

  <!-- Main shield silhouette -->
  <path d="M64 10            C75 10 80 17 92 20            C99 22 106 22 112 23            Q116 24 116 29            L116 59            C116 81 101 98 83 111            Q73 118 66 122            Q64 123 61 121            C44 111 28 97 19 83            C14 75 12 68 12 58            L12 29            Q12 24 17 23            C31 22 43 20 51 15            Q58 10 64 10Z" fill="#0078D4" stroke="#005BA1" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner shield face -->
  <path d="M64 16            C74 16 79 23 92 26            Q101 29 109 29            L109 58            C109 78 96 94 79 106            Q70 113 64 117            C47 107 33 95 25 82            C20 74 19 66 19 58            L19 29            C36 28 47 25 56 19            Q61 16 64 16Z" fill="url(#shieldBlue)" stroke="#B8DEFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Uneven hand-drawn edge highlights -->
  <path d="M24 34            Q25 53 24 61            C25 77 39 95 53 105" stroke="#D3ECFF" stroke-width="2.8" stroke-linecap="round" opacity="0.65"/>

  <path d="M70 21            Q81 27 96 31" stroke="#E4F4FF" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>

  <!-- Hand-sketched lock shackle -->
  <path d="M46 58            L46 47            C46 36 54 29 64 29            C74 29 82 36 82 47            L82 58            L74 58            L74 47            C74 40 70 37 64 37            C58 37 54 41 54 47            L54 58Z" fill="#FFBD02" stroke="#A36C00" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Shackle highlight -->
  <path d="M50 53            L50 47            C50 38 56 33 64 33            Q72 33 77 40" stroke="#FFE452" stroke-width="2.6" stroke-linecap="round" opacity="0.95"/>

  <!-- Lock body -->
  <path d="M43 56            Q43 53 47 53            L81 54            Q85 54 85 58            L85 83            Q85 88 80 88            L47 88            Q43 88 43 84Z" fill="url(#lockGold)" stroke="#A36C00" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Subtle sketchnote diagonal highlight -->
  <path d="M47 58            L80 58            L47 82Z" fill="#FFE452" opacity="0.55"/>

  <!-- Lock edge sketch -->
  <path d="M49 61            L49 79            M53 84            Q65 85 77 84" stroke="#FFF0A2" stroke-width="2.3" stroke-linecap="round" opacity="0.8"/>

  <!-- Keyhole -->
  <path d="M64 64            C60 64 58 67 59 71            Q60 73 62 74            L60 80            Q64 82 68 80            L66 74            C69 72 70 69 68 66            Q67 64 64 64Z" fill="#936000" stroke="#805400" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Small marker highlight on lock -->
  <path d="M58 61 Q65 60 72 61" stroke="#FFF2A8" stroke-width="2" stroke-linecap="round"/>

  <!-- Subtle handwritten-style emphasis marks -->
  <path d="M91 42 L98 39            M94 49 L102 48            M91 56 L98 58" stroke="#FFE452" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Small decorative sketch strokes -->
  <path d="M31 46 L36 49            M29 55 L35 57" stroke="#B9E2FF" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/>

  <!-- Hand-drawn accent near shield bottom -->
  <path d="M54 105            Q61 110 66 112" stroke="#FFD400" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Tiny sketchnote sparkle -->
  <path d="M100 15 L102 10            M107 20 L112 18            M101 25 L105 29" stroke="#FFBD02" stroke-width="2.5" stroke-linecap="round"/>

</svg>

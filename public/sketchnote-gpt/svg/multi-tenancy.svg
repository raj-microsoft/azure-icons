<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Multi Tenancy (sketch)</title>

  
  <desc>
    Hand-drawn Azure Multi Tenancy icon with two purple user
    silhouettes and a single cyan-and-blue diamond-shaped pyramid
    overlapping the lower right. Flat colors, gently uneven dark
    marker outlines and a transparent background.
  </desc>

  <!-- Secondary user body, behind main silhouette -->
  <path d="     M64 76     C66 59 76 49 91 49     C107 49 117 61 120 78     Q121 84 115 85     L69 85     Q63 85 64 76     Z" fill="#773ADC" stroke="#243447" stroke-width="3.1"/>

  <!-- Secondary user head -->
  <path d="     M107 36     C107 45 100 52 91 52     C82 52 75 45 75 36     C75 27 82 20 91 20     C100 20 107 27 107 36     Z" fill="#773ADC" stroke="#243447" stroke-width="3.1"/>

  <!-- Main user body -->
  <path d="     M2 88     C5 60 24 47 45 47     C71 47 87 65 90 90     Q91 100 82 100     L11 100     Q1 100 2 88     Z" fill="#A67AF4" stroke="#243447" stroke-width="3.6"/>

  <!-- Main user white collar triangle -->
  <path d="     M33 55     Q45 63 57 55     L45 89     Z" fill="#FFFFFF" stroke="#243447" stroke-width="2.2"/>

  <!-- Main user head -->
  <path d="     M69 28     C69 42 59 53 45 53     C31 53 21 42 21 28     C21 14 31 3 45 3     C59 3 69 14 69 28     Z" fill="#A67AF4" stroke="#243447" stroke-width="3.5"/>

  <!-- Cyan pyramid: back/right face -->
  <path d="     M96 68     L126 112     L96 125     Z" fill="#1988D9" stroke="#243447" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cyan pyramid: front/left face -->
  <path d="     M96 68     L65 112     L96 125     Z" fill="#50E6FF" stroke="#243447" stroke-width="3" stroke-linejoin="round"/>

  <!-- Subtle central pyramid seam -->
  <path d="M96 69 Q95 97 96 124" fill="none" stroke="#243447" stroke-width="2.4"/>

</svg>

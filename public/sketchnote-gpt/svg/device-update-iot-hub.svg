<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" stroke-linecap="round" stroke-linejoin="round"><title>Device Update IoT Hub (sketch)</title>
  
  <desc>Azure IoT Hub device update icon with a cyan connected-device network and two blue circular update arrows, rendered in a hand-drawn marker style.</desc>

  <defs>
    <linearGradient id="hubCyan" x1="35" y1="28" x2="91" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50E6FF"/>
      <stop offset="1" stop-color="#32BEDD"/>
    </linearGradient>
    <linearGradient id="arrowBlue" x1="21" y1="15" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168CE0"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>

  <!-- Central IoT hub -->
  <path d="M64 22            C86 21 105 40 106 62            C108 84 91 104 68 106            C46 109 25 92 23 69            C20 47 37 25 60 22Z" fill="url(#hubCyan)" stroke="#118EBD" stroke-width="3"/>

  <!-- Loose marker highlight -->
  <path d="M34 48            Q42 32 58 29            M79 30 Q91 36 97 48" stroke="#C3FAFF" stroke-width="2.5" opacity=".8"/>

  <!-- Connected IoT device network -->
  <g stroke="#FFFFFF" stroke-width="3" opacity=".9">
    <path d="M68 62 L54 42"/>
    <path d="M68 62 L39 67"/>
    <path d="M68 62 L58 84"/>
    <path d="M68 62 L86 89"/>
  </g>

  <!-- Hub and device nodes -->
  <g fill="#FFFFFF" stroke="#D8FCFF" stroke-width="1.6">
    <path d="M68 54              C73 54 77 58 77 63              C77 68 73 72 68 72              C63 72 59 68 59 63              C59 58 63 54 68 54Z"/>

    <path d="M54 35              C58 35 61 38 61 42              C61 46 58 49 54 49              C50 49 47 46 47 42              C47 38 50 35 54 35Z"/>

    <path d="M39 61              C43 61 46 64 46 68              C46 72 43 75 39 75              C35 75 32 72 32 68              C32 64 35 61 39 61Z"/>

    <path d="M58 78              C62 78 65 81 65 85              C65 89 62 92 58 92              C54 92 51 89 51 85              C51 81 54 78 58 78Z"/>

    <path d="M86 82              C90 82 93 85 93 89              C93 93 90 96 86 96              C82 96 79 93 79 89              C79 85 82 82 86 82Z"/>
  </g>

  <!-- Subtle center marker -->
  <path d="M65 61 Q68 58 71 61" stroke="#50E6FF" stroke-width="2.2"/>

  <!-- Clockwise update arrow -->
  <path d="M78 17            C102 23 118 43 118 65            Q118 72 116 78" stroke="url(#arrowBlue)" stroke-width="8"/>

  <path d="M78 17            L88 7            L84 30            L69 12Z" fill="#0078D4" stroke="#005BA1" stroke-width="2.5"/>

  <!-- Counterclockwise update arrow -->
  <path d="M50 112            C27 107 11 88 10 65            Q10 57 13 49" stroke="url(#arrowBlue)" stroke-width="8"/>

  <path d="M50 112            L40 121            L44 99            L59 116Z" fill="#0078D4" stroke="#005BA1" stroke-width="2.5"/>

  <!-- Hand-drawn arrow highlights -->
  <g stroke="#77CBFF" stroke-width="2.2" opacity=".8">
    <path d="M92 23 Q108 35 113 53"/>
    <path d="M15 76 Q21 96 39 106"/>
  </g>

  <!-- Sketchnote motion accents -->
  <g stroke="#0078D4" stroke-width="2.2">
    <path d="M107 87 L115 91"/>
    <path d="M99 96 L105 103"/>
    <path d="M20 35 L27 31"/>
  </g>

  <!-- Restrained yellow emphasis -->
  <g stroke="#F4C542" stroke-width="2.8">
    <path d="M104 10 L109 4"/>
    <path d="M115 17 L123 14"/>
    <path d="M119 27 L126 28"/>
  </g>

  <!-- Small hand-drawn sparkle -->
  <path d="M18 109            L20 114            L25 116            L20 118            L18 123            L16 118            L11 116            L16 114Z" fill="#F4C542" stroke="#C48B17" stroke-width="1.4"/>
</svg>
